name: gate

# Kit chạy cổng của chính nó. Trước file này, Gate 2 trên repo kit là nghi thức
# không có răng: evidence có thể sai mà vẫn merge được.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — bước `product-map.mjs --check` dưới đây hỏi LỊCH SỬ git
      # để phân biệt "repo chưa từng dựng bản đồ" với "đã có rồi bị xoá". Trên
      # clone nông (depth 1) commit bị graft nên git không thấy lần xoá nào, và
      # chốt duy nhất canh miễn trừ t1 của ADR 0007 fail-open (S4-r15).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # zsh: lời dặn bước thiết kế ghi sổ bằng khối lệnh DEC-ID-RECIPE dưới vỏ zsh của máy chủ kho,
      # nên ca CC-03 (tests/scripts/can-cu-s1.ca.mjs) chạy khối ấy dưới cả bash lẫn zsh và CỐ Ý đỏ khi
      # máy thiếu zsh thay vì tự bỏ qua — đo lệnh shell trên đúng vỏ (hồ sơ buoc-len-thiet-ke-khong-hoi).
      # Trần 5 phút + không hỏi: 12/10 một lượt của #332 treo ~1 g 47′ ở bước này vì job không có trần.
      - name: cài zsh (CC-03 chạy khối lệnh sổ dưới zsh)
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: scripts suite
        run: bash tests/scripts/run-tests.sh
      - name: hooks suite
        run: bash tests/hooks/run-tests.sh
      - name: plugins suite (gồm P33 chống glob-vào-cache)
        run: bash tests/plugins/run-tests.sh
      - name: workflows suite (lớp thuần của acceptance-verify + execute-parallel)
        run: bash tests/workflows/run-tests.sh
      - name: dieu-phoi suite (lõi Điều phối – Thợ + ca đóng gói DP1)
        run: node --test --test-reporter=tap "tests/dieu-phoi/**/*.test.mjs"
      # Bản đồ sản phẩm là view máy sinh: mọi PR đổi hồ sơ xưởng mà quên làm
      # mới nó là bản đồ nói dối. Bốn thân cổng người hứa với người ký rằng
      # "CI bắt drift" — bước này là chỗ lời hứa đó có thật. Thiếu nó thì bản
      # đồ chỉ được kiểm khi tình cờ có ai chạy một vòng nghiệm thu.
      - name: bản đồ sản phẩm khớp hồ sơ xưởng
        run: node scripts/product-map.mjs --root . --check

  # design-floor bước 1 — hợp đồng nhập cho mã Design OS sẽ vendor (design-floor/HOP-DONG-NHAP.md).
  # Job riêng vì nó cần mạng: lấy ĐÚNG commit upstream đã ghim (sparse, depth 1) + deps runtime của nó,
  # dựng `ui` bằng esbuild rồi chấm. 0 token. Giới hạn đã khai là xfail CHẶT: đỏ đúng chữ ký thì xanh,
  # upstream sửa xong mà giới hạn còn khai thì ĐỎ (XPASS) — gỡ giới hạn ở khối máy của hợp đồng.
  design-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bộ đo chấm bản vendored trong kit, không lấy mã upstream qua mạng (hồ sơ design-floor-vendor-va-ban-va-a).
    env:
      DESIGN_FLOOR_KHONG_MANG: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: esbuild + gói npm ghim của bộ đo và bản gói
        run: npm ci --prefix tests/design-floor --no-audit --no-fund
      - name: sổ vá + rào đóng kín + bản gói + bộ đo hợp đồng + chiều đỏ
        run: bash tests/design-floor/run-tests.sh

  # Cổng thiết kế chế độ dom (hồ sơ design-gate-khong-do-duoc-ba-nguyen-nhan, FL1): bộ ca design-eval cần jsdom, nên
  # trước job này mọi ca dom chỉ chạy trên máy người. jsdom ghim bằng package-lock của thư mục ca; DESIGN_EVAL_CAN_DOM=1
  # biến «thiếu jsdom» thành FAIL thay vì SKIP. fetch-depth: 0 — ca KD1-goc dựng bản cổng gốc bằng git archive một sha
  # cũ. Hai lệnh run là NGUYÊN VĂN `bash tests/design-eval/kdd.sh --lenh-ci`; ca KD8-ci so hai bên.
  design-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: jsdom ghim của bộ ca design-eval
        run: npm ci --prefix tests/design-eval --no-audit --no-fund
      - name: design-eval (static + dom, ca KD đòi chạy)
        run: DESIGN_EVAL_CAN_DOM=1 bash tests/design-eval/run-tests.sh

  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — pre-merge-check đọc lịch sử git (stale-guard theo
      # verified_commit, và provenance của commit chữ ký Gate 2).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # LUÔN truyền base. Trước đây job này chạy không --base vì "push không có
      # nhánh base", và luật gap-probe khi đó chỉ bỏ qua kèm NOTE. Từ khi mode
      # `required` có sàn fail-CLOSED (d-128), "không xác định được phạm vi" là
      # VIOLATION — nên không truyền base nghĩa là job đỏ vĩnh viễn. Đó là đúng
      # hành vi của cổng: chỗ phải sửa là CI, không phải hạ chuẩn cổng.
      #   PR   → nhánh đích
      #   push → commit liền trước (fetch-depth: 0 nên HEAD~1 luôn resolve được)
      - name: Resolve PR base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PRE_MERGE_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
            echo "T1_ESCAPE_FLAG=" >> "$GITHUB_ENV"
          else
            # push: CÓ base (luật gap-probe cần phạm vi diff) nhưng răng
            # T1-escape TẮT — tiền đề "PR phải kèm _acceptance/<slug>/" sai với
            # commit release / mirror-sync landing thẳng nhánh chính.
            echo "PRE_MERGE_BASE=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
            echo "T1_ESCAPE_FLAG=--no-t1-escape" >> "$GITHUB_ENV"
          fi
      - name: pre-merge check (evidence + signoff + stale + run-log)
        run: bash scripts/pre-merge-check.sh . $T1_ESCAPE_FLAG
      # ── Răng T1-escape — chỉ trên pull_request ───────────────────────────
      # Mọi PR chạm path T3 (hooks/ lib/ pre-merge-check.sh recheck-evidence.cjs)
      # phải kèm artifact `_acceptance/<slug>/`. Lý do chỉ chạy trên
      # pull_request KHÔNG phải "push không có base" — push CÓ base (xem bước
      # Resolve PR base ở trên). Lý do thật: tiền đề "thay đổi này là một PR nên
      # phải kèm hồ sơ nghiệm thu" SAI với commit đóng gói bản phát hành hay
      # đồng bộ bản sao landing thẳng nhánh chính. Xem docs/adr/0005.
      # Ở nhánh push, bước pre-merge phía trên đã chạy với --no-t1-escape.
      - name: T1-escape backstop
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          out="$(bash scripts/pre-merge-check.sh . --base "origin/${{ github.base_ref }}" 2>&1)" || st=$?
          printf '%s\n' "$out"
          # base ĐÃ KHAI mà không resolve nay là VIOLATION [scope] + exit 2
          # (fail-closed, tự truyền qua exit st). Nhánh "backstop skipped"
          # chỉ còn lại cho trường hợp KHÔNG có merge-base (clone nông/grafted,
          # git diff lỗi) — với repo KIT, một backstop bị bỏ qua âm thầm CHÍNH
          # LÀ lỗ nó sinh ra để bịt, nên ta nâng cả skip đó thành lỗi to.
          case "$out" in
            *"backstop skipped"*)
              echo "::error::T1-escape backstop KHÔNG chạy (base không resolve được) — fail-open không chấp nhận ở repo kit. Kiểm fetch-depth/base_ref."
              exit 1 ;;
          esac
          exit "${st:-0}"
