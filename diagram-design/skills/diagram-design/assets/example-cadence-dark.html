<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhịp lồng · Bốn cỡ, một nhịp · Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --lift: #454b63; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #a1aaba;
      --rule: rgba(245,245,245,0.12); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Lora', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }

    svg .band { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
    svg .beat { fill: var(--lift); stroke: var(--ink); stroke-width: 1; }
    svg .beat.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .beat-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    svg .gloss { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.04em; text-anchor: middle; }
    svg .scale { fill: var(--ink); font: 600 9px var(--mono); letter-spacing: 0.18em; }
    svg .horizon { fill: var(--soft); font-weight: 400; letter-spacing: 0.08em; }
    svg .cycle { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
    svg .rollup { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    svg .arrow-label { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    svg .mask-2 { fill: var(--paper-2); }
    svg .gate-tag { fill: none; stroke: rgba(191,192,192,0.45); stroke-width: 0.8; }
    svg .gate-text { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
    svg .note-tag { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.18em; }
    svg .note { font-family: 'Instrument Serif', 'Lora', serif; font-style: italic; font-size: 14px; fill: var(--accent); }
    svg .legend-label { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.14em; }
    svg .legend-text { fill: var(--muted); font: 400 9px var(--mono); letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Nhịp lồng · Diagram Design</p>
    <h1>Bốn cỡ thời gian, cùng một nhịp bốn beat</h1>

    <svg viewBox="0 0 1000 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cd-title cd-desc">
      <title id="cd-title">Nhịp lồng bốn cỡ thời gian</title>
      <desc id="cd-desc">Bốn dải ngang xếp từ cỡ ngắn nhất ở trên xuống cỡ dài nhất ở dưới: phút, giờ, ngày, tuần. Mỗi dải chứa đúng bốn nhịp giống hệt nhau — Khai, Làm, Đo, Quyết — kèm một vòng lặp quay từ Quyết về Khai. Mũi tên cuộn lên đi từ Quyết của dải trên xuống nhịp Đo của dải kế dưới: vòng trong đóng trước, vòng ngoài mới quyết. Hai dải dài nhất mang dấu cổng người; cổng ngày là cổng coral.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="1000" height="616" fill="#2d3142"/>

      <!-- Bands: shortest horizon at the top, longest at the bottom. -->
      <rect class="band" x="40" y="16"  width="920" height="108" rx="8"/>
      <rect class="band" x="40" y="148" width="920" height="108" rx="8"/>
      <rect class="band" x="40" y="280" width="920" height="108" rx="8"/>
      <rect class="band" x="40" y="412" width="920" height="108" rx="8"/>

      <!-- One return arc per band: QUYẾT back to KHAI, routed below the beat row. -->
      <path class="cycle" d="M 724 84  V 102 A 8 8 0 0 1 716 110 H 188 A 8 8 0 0 1 180 102 V 84"  marker-end="url(#arrow)"/>
      <path class="cycle" d="M 724 216 V 234 A 8 8 0 0 1 716 242 H 188 A 8 8 0 0 1 180 234 V 216" marker-end="url(#arrow)"/>
      <path class="cycle" d="M 724 348 V 366 A 8 8 0 0 1 716 374 H 188 A 8 8 0 0 1 180 366 V 348" marker-end="url(#arrow)"/>
      <path class="cycle" d="M 724 480 V 498 A 8 8 0 0 1 716 506 H 188 A 8 8 0 0 1 180 498 V 480" marker-end="url(#arrow)"/>

      <!-- Roll-up: the inner cycle closes, its evidence lands on the next scale's ĐO beat. -->
      <path class="rollup" d="M 828 84  V 128 A 8 8 0 0 1 820 136 H 568 A 8 8 0 0 0 560 144 V 176" marker-end="url(#arrow)"/>
      <path class="rollup" d="M 828 216 V 260 A 8 8 0 0 1 820 268 H 568 A 8 8 0 0 0 560 276 V 308" marker-end="url(#arrow)"/>
      <path class="rollup" d="M 828 348 V 392 A 8 8 0 0 1 820 400 H 568 A 8 8 0 0 0 560 408 V 440" marker-end="url(#arrow)"/>

      <!-- Roll-up labels: paper-2 mask (band interior), 8px clear of the stroke. -->
      <rect class="mask-2" x="836" y="92"  width="64" height="16" rx="2"/><text class="arrow-label" x="868" y="104">CUỘN LÊN</text>
      <rect class="mask-2" x="836" y="224" width="64" height="16" rx="2"/><text class="arrow-label" x="868" y="236">CUỘN LÊN</text>
      <rect class="mask-2" x="836" y="356" width="64" height="16" rx="2"/><text class="arrow-label" x="868" y="368">CUỘN LÊN</text>

      <!-- ── PHÚT ─────────────────────────────────────────────────────── -->
      <text class="scale" x="64" y="36">PHÚT<tspan class="horizon"> · một phép thử rẻ</tspan></text>
      <rect class="beat" x="64"  y="44" width="128" height="40" rx="6"/>
      <rect class="beat" x="280" y="44" width="128" height="40" rx="6"/>
      <rect class="beat" x="496" y="44" width="128" height="40" rx="6"/>
      <rect class="beat" x="712" y="44" width="128" height="40" rx="6"/>
      <text class="beat-name" x="128" y="68">KHAI</text><text class="gloss" x="128" y="96">ý định 1 dòng</text>
      <text class="beat-name" x="344" y="68">LÀM</text><text class="gloss" x="344" y="96">chạy thử</text>
      <text class="beat-name" x="560" y="68">ĐO</text><text class="gloss" x="560" y="96">đọc kết quả</text>
      <text class="beat-name" x="776" y="68">QUYẾT</text><text class="gloss" x="776" y="96">giữ hay bỏ</text>

      <!-- ── GIỜ ──────────────────────────────────────────────────────── -->
      <text class="scale" x="64" y="168">GIỜ<tspan class="horizon"> · một vòng dựng</tspan></text>
      <rect class="beat" x="64"  y="176" width="128" height="40" rx="6"/>
      <rect class="beat" x="280" y="176" width="128" height="40" rx="6"/>
      <rect class="beat" x="496" y="176" width="128" height="40" rx="6"/>
      <rect class="beat" x="712" y="176" width="128" height="40" rx="6"/>
      <text class="beat-name" x="128" y="200">KHAI</text><text class="gloss" x="128" y="228">phác cách làm</text>
      <text class="beat-name" x="344" y="200">LÀM</text><text class="gloss" x="344" y="228">dựng bản chạy</text>
      <text class="beat-name" x="560" y="200">ĐO</text><text class="gloss" x="560" y="228">so với ý định</text>
      <text class="beat-name" x="776" y="200">QUYẾT</text><text class="gloss" x="776" y="228">sửa hay tiếp</text>

      <!-- ── NGÀY — the coral gate (opaque lift under the accent-tint box) ─ -->
      <text class="scale" x="64" y="300">NGÀY<tspan class="horizon"> · một tính năng</tspan></text>
      <rect class="beat" x="64"  y="308" width="128" height="40" rx="6"/>
      <rect class="beat" x="280" y="308" width="128" height="40" rx="6"/>
      <rect class="beat" x="496" y="308" width="128" height="40" rx="6"/>
      <rect x="712" y="308" width="128" height="40" rx="6" fill="#454b63"/>
      <rect class="beat focal" x="712" y="308" width="128" height="40" rx="6"/>
      <text class="beat-name" x="128" y="332">KHAI</text><text class="gloss" x="128" y="360">chốt phạm vi</text>
      <text class="beat-name" x="344" y="332">LÀM</text><text class="gloss" x="344" y="360">ghép thành luồng</text>
      <text class="beat-name" x="560" y="332">ĐO</text><text class="gloss" x="560" y="360">người dùng thử</text>
      <text class="beat-name" x="776" y="332">QUYẾT</text><text class="gloss" x="776" y="360">mở hay hoãn</text>
      <rect class="gate-tag" x="848" y="320" width="72" height="16" rx="2"/>
      <text class="gate-text" x="884" y="332">CỔNG NGƯỜI</text>

      <!-- ── TUẦN ─────────────────────────────────────────────────────── -->
      <text class="scale" x="64" y="432">TUẦN<tspan class="horizon"> · một chương trình</tspan></text>
      <rect class="beat" x="64"  y="440" width="128" height="40" rx="6"/>
      <rect class="beat" x="280" y="440" width="128" height="40" rx="6"/>
      <rect class="beat" x="496" y="440" width="128" height="40" rx="6"/>
      <rect class="beat" x="712" y="440" width="128" height="40" rx="6"/>
      <text class="beat-name" x="128" y="464">KHAI</text><text class="gloss" x="128" y="492">đặt cược tuần</text>
      <text class="beat-name" x="344" y="464">LÀM</text><text class="gloss" x="344" y="492">các ngày chạy</text>
      <text class="beat-name" x="560" y="464">ĐO</text><text class="gloss" x="560" y="492">nhìn số cả tuần</text>
      <text class="beat-name" x="776" y="464">QUYẾT</text><text class="gloss" x="784" y="492">giữ hướng hay đổi</text>
      <rect class="gate-tag" x="848" y="452" width="72" height="16" rx="2"/>
      <text class="gate-text" x="884" y="464">CỔNG NGƯỜI</text>

      <!-- The rule that decides the one gate that matters. -->
      <text class="note-tag" x="40" y="552">CỔNG NGÀY</text>
      <text class="note" x="144" y="552">quyết = người khi đảo-ngược đắt</text>

      <!-- Legend — bottom strip, outside the diagram area. -->
      <line x1="40" y1="576" x2="960" y2="576" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text class="legend-label" x="40" y="596">CHÚ GIẢI</text>
      <rect x="152" y="588" width="16" height="8" rx="2" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text class="legend-text" x="176" y="596">Thì</text>
      <line x1="232" y1="592" x2="256" y2="592" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5 4"/>
      <text class="legend-text" x="264" y="596">Vòng lặp trong một cỡ</text>
      <line x1="408" y1="592" x2="424" y2="592" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text class="legend-text" x="440" y="596">Cuộn lên</text>
      <rect x="520" y="584" width="20" height="12" rx="2" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
      <text class="legend-text" x="548" y="596">Cổng người</text>
    </svg>
  </main>
</body>
</html>
