<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening an account online · Service Blueprint</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Service Blueprint · Diagram Design</p>
    <h1>Opening an account online</h1>

    <svg viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Ordinary frame hairlines — deliberately weaker than the boundaries -->
      <line x1="40" y1="64" x2="960" y2="64" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
      <line x1="40" y1="448" x2="960" y2="448" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
      <line x1="160" y1="64" x2="160" y2="448" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>

      <!-- The three named boundary lines -->
      <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
      <line x1="40" y1="256" x2="960" y2="256" stroke="rgba(245,245,245,0.60)" stroke-width="1.2" stroke-dasharray="6,4"/>
      <line x1="40" y1="352" x2="960" y2="352" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>

      <!-- Band eyebrows -->
      <text x="48" y="116" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CUSTOMER</text>
      <text x="48" y="212" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FRONTSTAGE</text>
      <text x="48" y="308" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BACKSTAGE</text>
      <text x="48" y="404" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SUPPORT</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- Within-band time steps -->
      <line x1="304" y1="112" x2="336" y2="112" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="208" x2="336" y2="208" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- APPLY · customer → frontstage -->
      <line x1="240" y1="136" x2="240" y2="184" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- UPLOAD · customer → frontstage -->
      <line x1="400" y1="136" x2="400" y2="184" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- KYC REQUEST · frontstage → backstage, crosses the line of visibility -->
      <path d="M 464 208 H 552 A 8 8 0 0 1 560 216 V 280" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- VERIFY ID · backstage → support (coral) -->
      <line x1="560" y1="328" x2="560" y2="376" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- OPEN ACCT · backstage → support -->
      <path d="M 624 304 H 712 A 8 8 0 0 1 720 312 V 376" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- PROVISIONED · support → frontstage -->
      <path d="M 760 376 V 216 A 8 8 0 0 1 768 208 H 816" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- READY · frontstage → customer -->
      <line x1="832" y1="184" x2="832" y2="136" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels — masked, 8px clear of every stroke -->
      <rect x="248" y="140" width="40" height="16" rx="2" fill="#2d3142"/>
      <text x="268" y="151" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

      <rect x="408" y="140" width="48" height="16" rx="2" fill="#2d3142"/>
      <text x="432" y="151" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

      <rect x="784" y="140" width="40" height="16" rx="2" fill="#2d3142"/>
      <text x="804" y="151" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READY</text>

      <rect x="472" y="184" width="80" height="16" rx="2" fill="#2d3142"/>
      <text x="512" y="195" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KYC REQUEST</text>

      <rect x="636" y="280" width="68" height="16" rx="2" fill="#2d3142"/>
      <text x="670" y="291" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN ACCT</text>

      <rect x="768" y="296" width="80" height="16" rx="2" fill="#2d3142"/>
      <text x="808" y="307" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVISIONED</text>

      <rect x="568" y="328" width="68" height="16" rx="2" fill="#2d3142"/>
      <text x="602" y="339" fill="#f19162" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY ID</text>

      <!-- CUSTOMER band -->
      <rect x="176" y="88" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="240" y="110" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start application</text>
      <text x="240" y="124" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web · mobile</text>

      <rect x="336" y="88" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="400" y="110" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Submit ID + selfie</text>
      <text x="400" y="124" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">camera capture</text>

      <rect x="816" y="88" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="880" y="110" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">First login</text>
      <text x="880" y="124" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">account active</text>

      <!-- FRONTSTAGE band -->
      <rect x="176" y="184" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="240" y="206" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Onboarding form</text>
      <text x="240" y="220" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app UI</text>

      <rect x="336" y="184" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="400" y="206" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Doc capture UI</text>
      <text x="400" y="220" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">guided flow</text>

      <rect x="816" y="184" width="128" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="880" y="206" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Account ready</text>
      <text x="880" y="220" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push · email</text>

      <!-- BACKSTAGE band — the critical dependency (coral 1 of 2) -->
      <rect x="496" y="280" width="128" height="48" rx="6" fill="#2d3142"/>
      <rect x="496" y="280" width="128" height="48" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="560" y="302" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KYC check</text>
      <text x="560" y="316" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">risk scoring</text>

      <!-- SUPPORT band -->
      <rect x="496" y="376" width="128" height="48" rx="6" fill="#2d3142"/>
      <rect x="496" y="376" width="128" height="48" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="560" y="398" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">eKYC vendor</text>
      <text x="560" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vendor-api · REST</text>

      <rect x="656" y="376" width="128" height="48" rx="6" fill="#2d3142"/>
      <rect x="656" y="376" width="128" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="720" y="398" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core banking</text>
      <text x="720" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ledger · t24</text>

      <!-- Boundary names — masked, right-aligned, sitting on the line -->
      <rect x="840" y="152" width="120" height="16" fill="#2d3142"/>
      <text x="956" y="163" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.03em">LINE OF INTERACTION</text>

      <rect x="840" y="248" width="120" height="16" fill="#2d3142"/>
      <text x="956" y="259" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.03em">LINE OF VISIBILITY</text>

      <rect x="788" y="344" width="172" height="16" fill="#2d3142"/>
      <text x="956" y="355" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.03em">LINE OF INTERNAL INTERACTION</text>

      <!-- Legend -->
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="504" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="64" y="513" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Step</text>

      <rect x="120" y="504" width="16" height="12" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="144" y="513" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Critical dependency</text>

      <rect x="280" y="504" width="16" height="12" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="304" y="513" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Support system</text>

      <line x1="432" y1="508" x2="460" y2="508" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
      <text x="468" y="513" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Boundary line</text>

      <line x1="576" y1="508" x2="600" y2="508" stroke="rgba(245,245,245,0.60)" stroke-width="1.2" stroke-dasharray="6,4"/>
      <text x="612" y="513" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Line of visibility</text>
    </svg>
  </div>
</body>
</html>
