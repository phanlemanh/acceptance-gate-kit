<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order pipeline · Event flow · Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0;
      --soft: #a1aaba; --rule: rgba(245,245,245,0.12); --accent: #f08a59;
      --accent-tint: rgba(240,138,89,0.10); --link: #6a95d8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', 'Lora', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 1000px; }
    .zone { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.18em; text-anchor: middle; }
    .tag { fill: var(--soft); font: 500 9px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .topic-name { fill: var(--ink); font: 500 12px var(--mono); text-anchor: middle; }
    .edge-label { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .note { fill: var(--accent); font: italic 400 14px var(--serif); }
    .legend-text { fill: var(--muted); font: 400 9px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Event flow · Diagram Design</p>
    <h1>Order pipeline events</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ef-title ef-desc">
      <title id="ef-title">Order pipeline event flow</title>
      <desc id="ef-desc">Checkout service publishes orders.created and Payment service publishes payments.captured. The orders.created topic fans out to Fulfillment, Notifications and a batched Analytics consumer; payments.captured is delivered to Fulfillment as well. Messages Fulfillment cannot handle are routed to an orders.dlq dead-letter queue.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/>
        </marker>
      </defs>

      <rect width="1000" height="520" fill="#2d3142"/>

      <!-- Zone header -->
      <g aria-label="Zones">
        <text x="120" y="48" class="zone">PRODUCERS</text>
        <text x="480" y="48" class="zone">TOPICS · BROKER</text>
        <text x="848" y="48" class="zone">CONSUMERS</text>
        <line x1="40" y1="64" x2="960" y2="64" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      </g>

      <!-- Connectors drawn before boxes. Fan-out attach points are 12px apart on the
           topic's right edge; each edge turns at its own x so no two ever overlap. -->
      <g aria-label="Publish and deliver edges" fill="none" stroke="#bfc0c0" stroke-width="1">
        <!-- publish -->
        <line x1="200" y1="192" x2="384" y2="192" marker-end="url(#arrow)"/>
        <line x1="200" y1="352" x2="384" y2="352" marker-end="url(#arrow)"/>
        <!-- orders.created fan-out -->
        <path d="M576 180 H696 Q704 180 704 172 V136 Q704 128 712 128 H768" marker-end="url(#arrow)"/>
        <path d="M576 192 H664 Q672 192 672 200 V232 Q672 240 680 240 H768" marker-end="url(#arrow)"/>
        <path d="M576 204 H632 Q640 204 640 212 V328 Q640 336 648 336 H768" marker-end="url(#arrow)"/>
        <!-- payments.captured deliver -->
        <line x1="576" y1="352" x2="768" y2="352" marker-end="url(#arrow)"/>
      </g>

      <!-- Dead-letter path — coral element 1 of 2 -->
      <path d="M848 380 V424 Q848 432 840 432 H576" fill="none" stroke="#f08a59" stroke-width="1.2"
            stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Edge label: mask sits 8px clear of the stroke -->
      <rect x="680" y="216" width="80" height="16" rx="2" fill="#2d3142"/>
      <text x="720" y="228" class="edge-label">BATCH · 5MIN</text>

      <!-- Producers -->
      <g aria-label="Producers">
        <rect x="40" y="160" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="160" width="160" height="64" rx="6" fill="#454b63" stroke="rgba(245,245,245,0.25)"/>
        <rect x="48" y="168" width="32" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="64" y="180" class="tag">SVC</text>
        <text x="120" y="200" class="node-name">Checkout service</text>

        <rect x="40" y="320" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="320" width="160" height="64" rx="6" fill="#454b63" stroke="rgba(245,245,245,0.25)"/>
        <rect x="48" y="328" width="32" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="64" y="340" class="tag">SVC</text>
        <text x="120" y="360" class="node-name">Payment service</text>
      </g>

      <!-- Topics and queues: channel bars with a doubled bottom edge (log/queue signature) -->
      <g aria-label="Topics and queues">
        <rect x="384" y="176" width="192" height="32" rx="4" fill="#2d3142"/>
        <rect x="384" y="176" width="192" height="32" rx="4" fill="#393e53" stroke="#bfc0c0"/>
        <line x1="384" y1="211" x2="576" y2="211" stroke="#bfc0c0"/>
        <rect x="392" y="184" width="40" height="16" rx="2" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="412" y="196" class="tag">TOPIC</text>
        <text x="504" y="196" class="topic-name">orders.created</text>

        <rect x="384" y="336" width="192" height="32" rx="4" fill="#2d3142"/>
        <rect x="384" y="336" width="192" height="32" rx="4" fill="#393e53" stroke="#bfc0c0"/>
        <line x1="384" y1="371" x2="576" y2="371" stroke="#bfc0c0"/>
        <rect x="392" y="344" width="40" height="16" rx="2" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="412" y="356" class="tag">TOPIC</text>
        <text x="504" y="356" class="topic-name">payments.captured</text>

        <rect x="384" y="416" width="192" height="32" rx="4" fill="#2d3142"/>
        <rect x="384" y="416" width="192" height="32" rx="4" fill="#393e53" stroke="#bfc0c0"/>
        <line x1="384" y1="451" x2="576" y2="451" stroke="#bfc0c0"/>
        <rect x="392" y="424" width="40" height="16" rx="2" fill="none" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="412" y="436" class="tag">QUEUE</text>
        <text x="504" y="436" class="topic-name">orders.dlq</text>
      </g>

      <!-- Consumers -->
      <g aria-label="Consumers">
        <rect x="768" y="96" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="768" y="96" width="160" height="64" rx="6" fill="#454b63" stroke="rgba(245,245,245,0.25)"/>
        <rect x="776" y="104" width="32" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="792" y="116" class="tag">SUB</text>
        <text x="848" y="136" class="node-name">Notifications</text>

        <rect x="768" y="208" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="768" y="208" width="160" height="64" rx="6" fill="#454b63" stroke="rgba(245,245,245,0.25)"/>
        <rect x="776" y="216" width="32" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="792" y="228" class="tag">SUB</text>
        <text x="848" y="248" class="node-name">Analytics</text>

        <rect x="768" y="316" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="768" y="316" width="160" height="64" rx="6" fill="#454b63" stroke="rgba(245,245,245,0.25)"/>
        <rect x="776" y="324" width="32" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="792" y="336" class="tag">SUB</text>
        <text x="848" y="356" class="node-name">Fulfillment</text>
      </g>

      <!-- Annotation — coral element 2 of 2 -->
      <text x="384" y="472" class="note">Unhandled poison messages land here — nothing subscribes.</text>

      <!-- Legend: horizontal strip below the diagram area -->
      <g aria-label="Legend">
        <line x1="40" y1="488" x2="960" y2="488" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <rect x="40" y="496" width="24" height="12" rx="4" fill="#454b63" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="72" y="504" class="legend-text">Service</text>
        <rect x="176" y="496" width="24" height="12" rx="2" fill="#393e53" stroke="#bfc0c0" stroke-width="0.8"/>
        <line x1="176" y1="511" x2="200" y2="511" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="208" y="504" class="legend-text">Topic</text>
        <rect x="296" y="496" width="24" height="12" rx="2" fill="#393e53" stroke="#bfc0c0" stroke-width="0.8"/>
        <line x1="296" y1="511" x2="320" y2="511" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="328" y="504" class="legend-text">Queue</text>
        <line x1="424" y1="504" x2="452" y2="504" stroke="#bfc0c0" marker-end="url(#arrow)"/>
        <text x="464" y="504" class="legend-text">Publish / deliver</text>
        <line x1="608" y1="504" x2="636" y2="504" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text x="648" y="504" class="legend-text">Dead-letter path</text>
      </g>
    </svg>
  </main>
</body>
</html>
