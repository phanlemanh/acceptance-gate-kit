<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không gian lựa chọn · Morphological Box · Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#2d3142;--paper-2:#393e53;--ink:#f5f5f5;--muted:#bfc0c0;--soft:#a1aaba;--rule:rgba(245,245,245,.12);--accent:#f08a59;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Lora',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    .frame{width:100%;max-width:1100px}.eyebrow{margin-bottom:.5rem;color:var(--muted);font:500 .66rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
    h1{margin-bottom:.35rem;font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em}.subtitle{margin-bottom:1.5rem;color:var(--muted);font-size:.9rem;line-height:1.5}
    .diagram{overflow-x:auto}svg{display:block;width:100%;min-width:900px}
    svg .rule{stroke:rgba(245,245,245,.12);stroke-width:.8}
    svg .head{font-family:'Geist Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.18em;fill:#a1aaba}svg .head.val{fill:#bfc0c0}
    svg .axis{font-family:'Geist',sans-serif;font-size:12px;font-weight:600;fill:#f5f5f5}
    svg .stick{font-family:'Geist Mono',monospace;font-size:9px;fill:#a1aaba;letter-spacing:.04em}
    svg .cell{fill:#454b63;stroke:rgba(245,245,245,.20);stroke-width:1}
    svg .cell-base{fill:#454b63}
    svg .cell-chosen{fill:rgba(240,138,89,.10);stroke:#f08a59;stroke-width:1.4}
    svg .cell-cut{fill:none;stroke:rgba(245,245,245,.12);stroke-width:1}
    svg .val{font-family:'Geist',sans-serif;font-size:11px;font-weight:500;fill:#f5f5f5}
    svg .val.chosen{font-weight:600}svg .val.cut{font-weight:400;fill:#a1aaba}
    svg .tag{fill:none;stroke:rgba(245,245,245,.20);stroke-width:.8}svg .tag.cut{stroke:rgba(245,245,245,.12)}
    svg .tag-t{font-family:'Geist Mono',monospace;font-size:9px;fill:#a1aaba;letter-spacing:.08em}
    svg .reason{font-family:'Geist Mono',monospace;font-size:9px;fill:#a1aaba;letter-spacing:.08em}
    svg .thread{fill:none;stroke:#f08a59;stroke-width:1.4}
    svg .legend-t{font-family:'Geist Mono',monospace;font-size:9px;fill:#bfc0c0}
    svg .note{font-family:'Geist Mono',monospace;font-size:9px;fill:#a1aaba}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Morphological box · Diagram Design</p><h1>Không gian lựa chọn — tính năng thông báo</h1><p class="subtitle">Bốn trục độc lập, mười ba giá trị, một tổ hợp được chọn — sợi chỉ cam là câu trả lời.</p>
    <div class="diagram">
      <svg viewBox="0 0 1000 560" role="img" aria-labelledby="mb-dark-title mb-dark-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="mb-dark-title">Không gian lựa chọn cho tính năng thông báo</title><desc id="mb-dark-desc">Bốn trục — kênh, thời điểm, người nhận, mức khẩn — với các giá trị rời rạc trên từng trục. Mỗi ô mang một nhãn nguồn. Tổ hợp được chọn gồm Trong ứng dụng, Gom theo giờ, Nhóm và Quan trọng, nối với nhau bằng một sợi chỉ cam. Ba ô đã bị cắt vẫn hiển thị mờ kèm lý do.</desc>
        <rect width="1000" height="560" fill="#2d3142"/>

        <!-- Row rules only — no column rules. Header at 108, then 88px stride -->
        <line class="rule" x1="32" y1="108" x2="976" y2="108"/><line class="rule" x1="32" y1="196" x2="976" y2="196"/><line class="rule" x1="32" y1="284" x2="976" y2="284"/><line class="rule" x1="32" y1="372" x2="976" y2="372"/><line class="rule" x1="32" y1="460" x2="976" y2="460"/>

        <!-- Header eyebrows -->
        <text class="head" x="32" y="92">TRỤC</text><text class="head val" x="224" y="92">GIÁ TRỊ</text>

        <!-- Thread: chosen cells linked bottom-edge to top-edge. Drawn before cells. -->
        <path class="thread" d="M 592 164 L 592 172 A 8 8 0 0 1 584 180 L 448 180 A 8 8 0 0 0 440 188 L 440 212"/>
        <path class="thread" d="M 440 252 L 440 300"/>
        <path class="thread" d="M 440 340 L 440 388"/>

        <!-- Axis 1 — Kênh -->
        <text class="axis" x="32" y="140">Kênh</text><text class="stick" x="32" y="156">thước: điểm chạm</text>
        <rect class="cell" x="224" y="124" width="128" height="40" rx="6"/><rect class="tag" x="232" y="128" width="36" height="16" rx="2"/><text class="tag-t" x="236" y="140">REPO</text><text class="val" x="232" y="156">Email</text>
        <rect class="cell" x="376" y="124" width="128" height="40" rx="6"/><rect class="tag" x="384" y="128" width="36" height="16" rx="2"/><text class="tag-t" x="388" y="140">REPO</text><text class="val" x="384" y="156">Push</text>
        <rect class="cell-base" x="528" y="124" width="128" height="40" rx="6"/><rect class="cell-chosen" x="528" y="124" width="128" height="40" rx="6"/><rect class="tag" x="536" y="128" width="36" height="16" rx="2"/><text class="tag-t" x="540" y="140">REPO</text><text class="val chosen" x="536" y="156">Trong ứng dụng</text>
        <rect class="cell-cut" x="680" y="124" width="128" height="40" rx="6"/><rect class="tag cut" x="688" y="128" width="40" height="16" rx="2"/><text class="tag-t" x="692" y="140">NGÀNH</text><text class="val cut" x="688" y="156">SMS</text><text class="reason" x="820" y="156">đắt</text>

        <!-- Axis 2 — Thời điểm -->
        <text class="axis" x="32" y="228">Thời điểm</text><text class="stick" x="32" y="244">thước: độ trễ</text>
        <rect class="cell" x="224" y="212" width="128" height="40" rx="6"/><rect class="tag" x="232" y="216" width="36" height="16" rx="2"/><text class="tag-t" x="236" y="228">REPO</text><text class="val" x="232" y="244">Tức thì</text>
        <rect class="cell-base" x="376" y="212" width="128" height="40" rx="6"/><rect class="cell-chosen" x="376" y="212" width="128" height="40" rx="6"/><rect class="tag" x="384" y="216" width="40" height="16" rx="2"/><text class="tag-t" x="388" y="228">NGÀNH</text><text class="val chosen" x="384" y="244">Gom theo giờ</text>
        <rect class="cell-cut" x="528" y="212" width="128" height="40" rx="6"/><rect class="tag cut" x="536" y="216" width="48" height="16" rx="2"/><text class="tag-t" x="540" y="228">G.ĐỊNH</text><text class="val cut" x="536" y="244">Theo lịch</text><text class="reason" x="668" y="244">trùng</text>

        <!-- Axis 3 — Người nhận -->
        <text class="axis" x="32" y="316">Người nhận</text><text class="stick" x="32" y="332">thước: phạm vi</text>
        <rect class="cell" x="224" y="300" width="128" height="40" rx="6"/><rect class="tag" x="232" y="304" width="36" height="16" rx="2"/><text class="tag-t" x="236" y="316">REPO</text><text class="val" x="232" y="332">Cá nhân</text>
        <rect class="cell-base" x="376" y="300" width="128" height="40" rx="6"/><rect class="cell-chosen" x="376" y="300" width="128" height="40" rx="6"/><rect class="tag" x="384" y="304" width="36" height="16" rx="2"/><text class="tag-t" x="388" y="316">REPO</text><text class="val chosen" x="384" y="332">Nhóm</text>
        <rect class="cell-cut" x="528" y="300" width="128" height="40" rx="6"/><rect class="tag cut" x="536" y="304" width="40" height="16" rx="2"/><text class="tag-t" x="540" y="316">NGÀNH</text><text class="val cut" x="536" y="332">Toàn tổ chức</text><text class="reason" x="668" y="332">sau</text>

        <!-- Axis 4 — Mức khẩn -->
        <text class="axis" x="32" y="404">Mức khẩn</text><text class="stick" x="32" y="420">thước: chi phí ngắt</text>
        <rect class="cell" x="224" y="388" width="128" height="40" rx="6"/><rect class="tag" x="232" y="392" width="36" height="16" rx="2"/><text class="tag-t" x="236" y="404">REPO</text><text class="val" x="232" y="420">Thường</text>
        <rect class="cell-base" x="376" y="388" width="128" height="40" rx="6"/><rect class="cell-chosen" x="376" y="388" width="128" height="40" rx="6"/><rect class="tag" x="384" y="392" width="40" height="16" rx="2"/><text class="tag-t" x="388" y="404">NGÀNH</text><text class="val chosen" x="384" y="420">Quan trọng</text>
        <rect class="cell" x="528" y="388" width="128" height="40" rx="6"/><rect class="tag" x="536" y="392" width="48" height="16" rx="2"/><text class="tag-t" x="540" y="404">G.ĐỊNH</text><text class="val" x="536" y="420">Khẩn</text>

        <!-- Legend strip -->
        <line class="rule" x1="32" y1="500" x2="976" y2="500"/>
        <text class="legend-t" x="32" y="520" letter-spacing=".14em">CHÚ GIẢI</text>
        <rect class="cell" x="120" y="508" width="24" height="16" rx="4"/><text class="legend-t" x="152" y="520">Giá trị</text>
        <rect class="cell-base" x="232" y="508" width="24" height="16" rx="4"/><rect class="cell-chosen" x="232" y="508" width="24" height="16" rx="4"/><text class="legend-t" x="264" y="520">Đã chọn</text>
        <rect class="cell-cut" x="344" y="508" width="24" height="16" rx="4"/><text class="legend-t" x="376" y="520">Đã cắt</text>
        <text class="legend-t" x="456" y="520">Nguồn</text>
        <rect class="tag" x="512" y="508" width="36" height="16" rx="2"/><text class="tag-t" x="516" y="520">REPO</text>
        <rect class="tag" x="556" y="508" width="40" height="16" rx="2"/><text class="tag-t" x="560" y="520">NGÀNH</text>
        <rect class="tag" x="604" y="508" width="48" height="16" rx="2"/><text class="tag-t" x="608" y="520">G.ĐỊNH</text>
        <text class="note" x="976" y="520" text-anchor="end">ô không có nguồn = ô tự nghĩ ra</text>
      </svg>
    </div>
  </main>
</body>
</html>
