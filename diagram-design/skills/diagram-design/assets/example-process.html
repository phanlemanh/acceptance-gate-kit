<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order fulfillment · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#636b80;--accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12);--label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;--node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--dot:rgba(45,49,66,.10);--db:#5e7a9b;--ls:#7c8f6f;--fl:#9c6b50;--tb:#b8915a;--wb:#6e6479;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Lora',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}svg{width:100%;min-width:1000px;display:block}
    svg text{font-family:var(--sans)}.mono{font-family:var(--mono)}.lane{fill:var(--lane)}.rule{stroke:var(--rule)}.label-rule{stroke:var(--label-rule)}.actor{fill:var(--muted);font:500 9px var(--mono);letter-spacing:.08em}.step-label{fill:var(--muted);font:500 9px var(--mono);letter-spacing:.12em}.step-chip{fill:var(--chip)}.step-num{fill:var(--ink);font:600 9px var(--mono)}.connector{fill:none;stroke:var(--muted);stroke-width:1}.connector.focal{stroke:var(--accent);stroke-width:1.2}.node-mask{fill:var(--paper)}.node{fill:var(--node);stroke:var(--node-stroke)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.role{fill:rgba(45,49,66,.10)}.role.focal{fill:rgba(235,108,54,.25)}.role-text{fill:var(--ink);font:600 9px var(--mono)}.role-text.focal{fill:var(--accent)}.node-title{fill:var(--ink);font:600 9px var(--sans)}.node-sub{fill:var(--muted);font:9px var(--mono)}.node-tool{fill:var(--soft);font:9px var(--mono)}.data-text{fill:white;font:700 9px var(--mono)}.legend-key{fill:var(--muted);font:500 9px var(--mono);letter-spacing:.12em}.legend-text{fill:var(--muted);font:9px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Diagram Design</p>
    <h1>Order fulfillment across four teams</h1>
    <svg viewBox="0 0 1176 568" xmlns="http://www.w3.org/2000/svg" aria-label="Order fulfillment process from customer order to support closure">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="1176" height="568" fill="var(--paper)"/><rect width="1176" height="568" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="48" width="1036" height="104"/><rect class="lane" x="140" y="256" width="1036" height="104"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="48" x2="1176" y2="48"/><line x1="0" y1="152" x2="1176" y2="152"/><line x1="0" y1="256" x2="1176" y2="256"/><line x1="0" y1="360" x2="1176" y2="360"/><line x1="0" y1="464" x2="1176" y2="464"/></g>
      <line class="label-rule" x1="140" y1="48" x2="140" y2="464"/>
      <g class="actor" text-anchor="middle"><text x="70" y="103">CUSTOMER</text><text x="70" y="207">SUPPORT</text><text x="70" y="311">WAREHOUSE</text><text x="70" y="415">FINANCE</text></g>
      <g text-anchor="middle">
        
        <rect class="step-chip" x="198" y="8" width="16" height="16" rx="8"/><text class="step-num" x="206" y="20">1</text><text class="step-label" x="206" y="40">ORDER</text>
        <rect class="step-chip" x="326" y="8" width="16" height="16" rx="8"/><text class="step-num" x="334" y="20">2</text><text class="step-label" x="334" y="40">VERIFY</text>
        <rect x="454" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="462" y="20" fill="var(--accent)" font-size="9" font-weight="600" class="mono">3</text><text x="462" y="40" fill="var(--accent)" font-size="9" font-weight="500" letter-spacing=".12em" class="mono">ALLOCATE</text>
        <rect class="step-chip" x="582" y="8" width="16" height="16" rx="8"/><text class="step-num" x="590" y="20">4</text><text class="step-label" x="590" y="40">PICK</text>
        <rect class="step-chip" x="710" y="8" width="16" height="16" rx="8"/><text class="step-num" x="718" y="20">5</text><text class="step-label" x="718" y="40">PACK</text>
        <rect class="step-chip" x="838" y="8" width="16" height="16" rx="8"/><text class="step-num" x="846" y="20">6</text><text class="step-label" x="846" y="40">PAY</text>
        <rect class="step-chip" x="966" y="8" width="16" height="16" rx="8"/><text class="step-num" x="974" y="20">7</text><text class="step-label" x="974" y="40">RECEIVE</text>
        <rect class="step-chip" x="1094" y="8" width="16" height="16" rx="8"/><text class="step-num" x="1102" y="20">8</text><text class="step-label" x="1102" y="40">CLOSE</text>
      </g>
      <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
      <path class="connector" d="M264 100 H326 Q334 100 334 108 V160" marker-end="url(#arrow)"/><path class="connector focal" d="M392 204 H454 Q462 204 462 212 V264" marker-end="url(#arrow-accent)"/><line class="connector focal" x1="520" y1="308" x2="532" y2="308" marker-end="url(#arrow-accent)"/><line class="connector" x1="648" y1="308" x2="660" y2="308" marker-end="url(#arrow)"/><path class="connector" d="M776 308 H838 Q846 308 846 316 V368" marker-end="url(#arrow)"/><path class="connector" d="M904 412 H966 Q974 412 974 404 V144" marker-end="url(#arrow)"/><path class="connector" d="M1032 100 H1094 Q1102 100 1102 108 V160" marker-end="url(#arrow)"/>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="56" width="116" height="88" rx="6"/><rect class="node" x="148" y="56" width="116" height="88" rx="6"/><rect class="role" x="152" y="60" width="24" height="16" rx="2"/><text class="role-text" x="164" y="72">CUS</text><text class="node-title" x="206" y="90">Place order</text><text class="node-sub" x="206" y="103">cart → order</text><text class="node-tool" x="206" y="116">storefront</text><rect x="240" y="124" width="20" height="16" rx="2" fill="var(--db)"/><text class="data-text" x="250" y="136">DB</text></g>
        <g><rect class="node-mask" x="276" y="160" width="116" height="88" rx="6"/><rect class="node" x="276" y="160" width="116" height="88" rx="6"/><rect class="role" x="280" y="164" width="24" height="16" rx="2"/><text class="role-text" x="292" y="176">SUP</text><text class="node-title" x="334" y="194">Verify order</text><text class="node-sub" x="334" y="207">order → cleared</text><text class="node-tool" x="334" y="220">service desk</text><rect x="280" y="228" width="20" height="16" rx="2" fill="var(--db)"/><text class="data-text" x="290" y="240">DB</text><rect x="368" y="228" width="20" height="16" rx="2" fill="var(--db)"/><text class="data-text" x="378" y="240">DB</text></g>
        <g><rect class="node-mask" x="404" y="264" width="116" height="88" rx="6"/><rect class="node focal" x="404" y="264" width="116" height="88" rx="6"/><rect class="role focal" x="408" y="268" width="24" height="16" rx="2"/><text class="role-text focal" x="420" y="280">WHS</text><text class="node-title" x="462" y="298">Allocate stock</text><text class="node-sub" x="462" y="311">order → pick list</text><text class="node-tool" x="462" y="324">inventory system</text><rect x="408" y="332" width="20" height="16" rx="2" fill="var(--db)"/><text class="data-text" x="418" y="344">DB</text><rect x="496" y="332" width="20" height="16" rx="2" fill="var(--ls)"/><text class="data-text" x="506" y="344">LS</text></g>
        <g><rect class="node-mask" x="532" y="264" width="116" height="88" rx="6"/><rect class="node" x="532" y="264" width="116" height="88" rx="6"/><rect class="role" x="536" y="268" width="24" height="16" rx="2"/><text class="role-text" x="548" y="280">WHS</text><text class="node-title" x="590" y="298">Pick items</text><text class="node-sub" x="590" y="311">list → picked</text><text class="node-tool" x="590" y="324">handheld scanner</text><rect x="536" y="332" width="20" height="16" rx="2" fill="var(--ls)"/><text class="data-text" x="546" y="344">LS</text><rect x="624" y="332" width="20" height="16" rx="2" fill="var(--ls)"/><text class="data-text" x="634" y="344">LS</text></g>
        <g><rect class="node-mask" x="660" y="264" width="116" height="88" rx="6"/><rect class="node" x="660" y="264" width="116" height="88" rx="6"/><rect class="role" x="664" y="268" width="24" height="16" rx="2"/><text class="role-text" x="676" y="280">WHS</text><text class="node-title" x="718" y="298">Pack order</text><text class="node-sub" x="718" y="311">picked → shipment</text><text class="node-tool" x="718" y="324">packing station</text><rect x="664" y="332" width="20" height="16" rx="2" fill="var(--ls)"/><text class="data-text" x="674" y="344">LS</text><rect x="752" y="332" width="20" height="16" rx="2" fill="var(--fl)"/><text class="data-text" x="762" y="344">FL</text></g>
        <g><rect class="node-mask" x="788" y="368" width="116" height="88" rx="6"/><rect class="node" x="788" y="368" width="116" height="88" rx="6"/><rect class="role" x="792" y="372" width="24" height="16" rx="2"/><text class="role-text" x="804" y="384">FIN</text><text class="node-title" x="846" y="402">Capture payment</text><text class="node-sub" x="846" y="415">shipment → receipt</text><text class="node-tool" x="846" y="428">payment gateway</text><rect x="792" y="436" width="20" height="16" rx="2" fill="var(--fl)"/><text class="data-text" x="802" y="448">FL</text><rect x="880" y="436" width="20" height="16" rx="2" fill="var(--tb)"/><text class="data-text" x="890" y="448">TB</text></g>
        <g><rect class="node-mask" x="916" y="56" width="116" height="88" rx="6"/><rect class="node" x="916" y="56" width="116" height="88" rx="6"/><rect class="role" x="920" y="60" width="24" height="16" rx="2"/><text class="role-text" x="932" y="72">CUS</text><text class="node-title" x="974" y="90">Receive shipment</text><text class="node-sub" x="974" y="103">receipt → confirmed</text><text class="node-tool" x="974" y="116">delivery portal</text><rect x="920" y="124" width="20" height="16" rx="2" fill="var(--tb)"/><text class="data-text" x="930" y="136">TB</text><rect x="1008" y="124" width="20" height="16" rx="2" fill="var(--wb)"/><text class="data-text" x="1018" y="136">WB</text></g>
        <g><rect class="node-mask" x="1044" y="160" width="116" height="88" rx="6"/><rect class="node" x="1044" y="160" width="116" height="88" rx="6"/><rect class="role" x="1048" y="164" width="24" height="16" rx="2"/><text class="role-text" x="1060" y="176">SUP</text><text class="node-title" x="1102" y="194">Close order</text><text class="node-sub" x="1102" y="207">confirmed → closed</text><text class="node-tool" x="1102" y="220">service desk</text><rect x="1048" y="228" width="20" height="16" rx="2" fill="var(--wb)"/><text class="data-text" x="1058" y="240">WB</text></g>
      </g>
      <!-- Three-row type key -->
      <g><text class="legend-key" x="144" y="496">STEPS</text><rect class="step-chip" x="208" y="484" width="16" height="16" rx="8"/><text class="step-num" x="216" y="496" text-anchor="middle">1</text><text class="legend-text" x="232" y="496">ORDER</text><rect class="step-chip" x="324" y="484" width="16" height="16" rx="8"/><text class="step-num" x="332" y="496" text-anchor="middle">2</text><text class="legend-text" x="348" y="496">VERIFY</text><rect x="440" y="484" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="448" y="496" fill="var(--accent)" font-size="9" class="mono" text-anchor="middle">3</text><text x="464" y="496" fill="var(--accent)" font-size="9">ALLOCATE</text><rect class="step-chip" x="556" y="484" width="16" height="16" rx="8"/><text class="step-num" x="564" y="496" text-anchor="middle">4</text><text class="legend-text" x="580" y="496">PICK</text><rect class="step-chip" x="672" y="484" width="16" height="16" rx="8"/><text class="step-num" x="680" y="496" text-anchor="middle">5</text><text class="legend-text" x="696" y="496">PACK</text><rect class="step-chip" x="788" y="484" width="16" height="16" rx="8"/><text class="step-num" x="796" y="496" text-anchor="middle">6</text><text class="legend-text" x="812" y="496">PAY</text><rect class="step-chip" x="904" y="484" width="16" height="16" rx="8"/><text class="step-num" x="912" y="496" text-anchor="middle">7</text><text class="legend-text" x="928" y="496">RECEIVE</text><rect class="step-chip" x="1020" y="484" width="16" height="16" rx="8"/><text class="step-num" x="1028" y="496" text-anchor="middle">8</text><text class="legend-text" x="1044" y="496">CLOSE</text>
      <text class="legend-key" x="144" y="524">DATA TYPE</text><rect x="220" y="512" width="20" height="16" rx="2" fill="var(--db)"/><text class="legend-text" x="248" y="524">DB · records</text><rect x="340" y="512" width="20" height="16" rx="2" fill="var(--ls)"/><text class="legend-text" x="368" y="524">LS · task</text><rect x="448" y="512" width="20" height="16" rx="2" fill="var(--fl)"/><text class="legend-text" x="476" y="524">FL · document</text><rect x="572" y="512" width="20" height="16" rx="2" fill="var(--tb)"/><text class="legend-text" x="600" y="524">TB · transaction</text><rect x="716" y="512" width="20" height="16" rx="2" fill="var(--wb)"/><text class="legend-text" x="744" y="524">WB · web status</text><text class="legend-key" x="856" y="524">LEFT IN · RIGHT OUT</text>
      <text class="legend-key" x="144" y="552">FLOW</text><line x1="200" y1="548" x2="228" y2="548" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="552">Critical handoff</text><line x1="360" y1="548" x2="388" y2="548" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="400" y="552">Sequential handoff</text></g>
    </svg>
  </div>
</body>
</html>
