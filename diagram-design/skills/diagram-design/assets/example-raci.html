<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Launch · RACI Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#636b80;--rule:rgba(45,49,66,.12);--accent:#eb6c36;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Lora',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    .frame{width:100%;max-width:1100px}.eyebrow{margin-bottom:.5rem;color:var(--muted);font:500 .66rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
    h1{margin-bottom:.35rem;font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em}.subtitle{margin-bottom:1.5rem;color:var(--muted);font-size:.9rem;line-height:1.5}
    .diagram{overflow-x:auto}svg{display:block;width:100%;min-width:900px}
    svg .grid{stroke:rgba(45,49,66,.12);stroke-width:.8}
    svg .col-head{font-family:'Geist Mono',monospace;font-size:9px;font-weight:500;fill:#636b80;letter-spacing:.18em}svg .col-head.role{fill:#4f5d75}
    svg .row-label{font-family:'Geist',sans-serif;font-size:12px;fill:#2d3142}
    svg .glyph{font-family:'Geist Mono',monospace;font-size:10px;font-weight:500}
    svg .chip-a{fill:#2d3142}svg .g-a{fill:#f5f5f5;font-weight:600}
    svg .chip-r{fill:none;stroke:#2d3142;stroke-width:1}svg .g-r{fill:#2d3142;font-weight:600}
    svg .chip-c{fill:none;stroke:#4f5d75;stroke-opacity:.55;stroke-width:1}svg .g-c{fill:#4f5d75;font-weight:600}
    svg .g-i{fill:#636b80}
    svg .chip-focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.4}svg .g-focal{fill:#eb6c36;font-weight:600}
    svg .tick{stroke:#eb6c36;stroke-width:1}
    svg .note{font-family:'Instrument Serif','Lora',serif;font-style:italic;font-size:14px;fill:#eb6c36}
    svg .legend-text{font-family:'Geist Mono',monospace;font-size:9px;fill:#4f5d75}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">RACI matrix · Diagram Design</p><h1>Feature launch RACI</h1><p class="subtitle">Six launch activities × five roles — exactly one accountable owner per activity.</p>
    <div class="diagram">
      <svg viewBox="0 0 1000 504" role="img" aria-labelledby="raci-title raci-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="raci-title">Feature launch RACI matrix</title><desc id="raci-desc">Six launch activities scored against five roles using responsible, accountable, consulted and informed marks. Each activity has exactly one accountable owner; launch comms is flagged as contested.</desc>
        <rect width="1000" height="504" fill="#f5f5f5"/>

        <!-- Column rules: role boundaries at 256/400/544/688/832, 144px stride -->
        <line class="grid" x1="256" y1="76" x2="256" y2="396"/><line class="grid" x1="400" y1="76" x2="400" y2="396"/><line class="grid" x1="544" y1="76" x2="544" y2="396"/><line class="grid" x1="688" y1="76" x2="688" y2="396"/><line class="grid" x1="832" y1="76" x2="832" y2="396"/>
        <!-- Row rules: header at 108, then 48px stride -->
        <line class="grid" x1="32" y1="108" x2="976" y2="108"/><line class="grid" x1="32" y1="156" x2="976" y2="156"/><line class="grid" x1="32" y1="204" x2="976" y2="204"/><line class="grid" x1="32" y1="252" x2="976" y2="252"/><line class="grid" x1="32" y1="300" x2="976" y2="300"/><line class="grid" x1="32" y1="348" x2="976" y2="348"/><line class="grid" x1="32" y1="396" x2="976" y2="396"/>

        <!-- Column headers -->
        <text class="col-head" x="32" y="92">ACTIVITY</text><text class="col-head role" x="328" y="92" text-anchor="middle">PM</text><text class="col-head role" x="472" y="92" text-anchor="middle">DESIGN</text><text class="col-head role" x="616" y="92" text-anchor="middle">ENG</text><text class="col-head role" x="760" y="92" text-anchor="middle">QA</text><text class="col-head role" x="904" y="92" text-anchor="middle">MARKETING</text>

        <!-- Spec — PM accountable -->
        <text class="row-label" x="32" y="136">Spec</text>
        <rect class="chip-a" x="316" y="124" width="24" height="16" rx="4"/><text class="glyph g-a" x="328" y="136" text-anchor="middle">A</text>
        <rect class="chip-c" x="460" y="124" width="24" height="16" rx="4"/><text class="glyph g-c" x="472" y="136" text-anchor="middle">C</text>
        <rect class="chip-c" x="604" y="124" width="24" height="16" rx="4"/><text class="glyph g-c" x="616" y="136" text-anchor="middle">C</text>
        <text class="glyph g-i" x="760" y="136" text-anchor="middle">I</text><text class="glyph g-i" x="904" y="136" text-anchor="middle">I</text>

        <!-- Design — Design accountable -->
        <text class="row-label" x="32" y="184">Design</text>
        <rect class="chip-c" x="316" y="172" width="24" height="16" rx="4"/><text class="glyph g-c" x="328" y="184" text-anchor="middle">C</text>
        <rect class="chip-a" x="460" y="172" width="24" height="16" rx="4"/><text class="glyph g-a" x="472" y="184" text-anchor="middle">A</text>
        <rect class="chip-c" x="604" y="172" width="24" height="16" rx="4"/><text class="glyph g-c" x="616" y="184" text-anchor="middle">C</text>
        <text class="glyph g-i" x="904" y="184" text-anchor="middle">I</text>

        <!-- Build — Eng accountable -->
        <text class="row-label" x="32" y="232">Build</text>
        <text class="glyph g-i" x="328" y="232" text-anchor="middle">I</text>
        <rect class="chip-c" x="460" y="220" width="24" height="16" rx="4"/><text class="glyph g-c" x="472" y="232" text-anchor="middle">C</text>
        <rect class="chip-a" x="604" y="220" width="24" height="16" rx="4"/><text class="glyph g-a" x="616" y="232" text-anchor="middle">A</text>
        <rect class="chip-c" x="748" y="220" width="24" height="16" rx="4"/><text class="glyph g-c" x="760" y="232" text-anchor="middle">C</text>

        <!-- QA — QA accountable, Eng responsible -->
        <text class="row-label" x="32" y="280">QA</text>
        <text class="glyph g-i" x="328" y="280" text-anchor="middle">I</text>
        <rect class="chip-r" x="604" y="268" width="24" height="16" rx="4"/><text class="glyph g-r" x="616" y="280" text-anchor="middle">R</text>
        <rect class="chip-a" x="748" y="268" width="24" height="16" rx="4"/><text class="glyph g-a" x="760" y="280" text-anchor="middle">A</text>

        <!-- Launch comms — Marketing accountable, and contested (focal) -->
        <text class="row-label" x="32" y="328">Launch comms</text>
        <rect class="chip-c" x="316" y="316" width="24" height="16" rx="4"/><text class="glyph g-c" x="328" y="328" text-anchor="middle">C</text>
        <rect class="chip-c" x="460" y="316" width="24" height="16" rx="4"/><text class="glyph g-c" x="472" y="328" text-anchor="middle">C</text>
        <text class="glyph g-i" x="616" y="328" text-anchor="middle">I</text>
        <rect class="chip-focal" x="892" y="316" width="24" height="16" rx="4"/><text class="glyph g-focal" x="904" y="328" text-anchor="middle">A</text>

        <!-- Post-launch review — PM accountable, Marketing responsible -->
        <text class="row-label" x="32" y="376">Post-launch review</text>
        <rect class="chip-a" x="316" y="364" width="24" height="16" rx="4"/><text class="glyph g-a" x="328" y="376" text-anchor="middle">A</text>
        <text class="glyph g-i" x="472" y="376" text-anchor="middle">I</text>
        <rect class="chip-c" x="604" y="364" width="24" height="16" rx="4"/><text class="glyph g-c" x="616" y="376" text-anchor="middle">C</text>
        <rect class="chip-c" x="748" y="364" width="24" height="16" rx="4"/><text class="glyph g-c" x="760" y="376" text-anchor="middle">C</text>
        <rect class="chip-r" x="892" y="364" width="24" height="16" rx="4"/><text class="glyph g-r" x="904" y="376" text-anchor="middle">R</text>

        <!-- Editorial annotation on the contested column -->
        <line class="tick" x1="904" y1="400" x2="904" y2="412"/>
        <text class="note" x="976" y="428" text-anchor="end">Sign-off contested — PM still edits every launch note.</text>

        <!-- Legend strip -->
        <line class="grid" x1="32" y1="448" x2="976" y2="448"/>
        <text class="legend-text" x="32" y="468" letter-spacing=".14em">LEGEND</text>
        <rect class="chip-r" x="120" y="456" width="24" height="16" rx="4"/><text class="glyph g-r" x="132" y="468" text-anchor="middle">R</text><text class="legend-text" x="152" y="468">Responsible</text>
        <rect class="chip-a" x="280" y="456" width="24" height="16" rx="4"/><text class="glyph g-a" x="292" y="468" text-anchor="middle">A</text><text class="legend-text" x="312" y="468">Accountable</text>
        <rect class="chip-c" x="440" y="456" width="24" height="16" rx="4"/><text class="glyph g-c" x="452" y="468" text-anchor="middle">C</text><text class="legend-text" x="472" y="468">Consulted</text>
        <text class="glyph g-i" x="612" y="468" text-anchor="middle">I</text><text class="legend-text" x="632" y="468">Informed</text>
      </svg>
    </div>
  </main>
</body>
</html>
