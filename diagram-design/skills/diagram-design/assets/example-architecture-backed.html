<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth stack · verified backs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
  <!-- Authored facts: node ids that wireflow screens back onto. This file has
       no backs of its own — the manifest exists so other diagrams' claims
       about these nodes can be verified by scripts/check_backs.py. -->
  <script type="application/json" data-diagram-facts>
{
  "nodes": [
    {"id": "web-app", "label": "Web app"},
    {"id": "auth-service", "label": "Auth service"},
    {"id": "user-db", "label": "User DB"},
    {"id": "mail-service", "label": "Mail service"}
  ],
  "backs": []
}
  </script>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Verified Backs</p>
    <h1>Auth stack behind the reset flow</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Auth services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="672" y="136" width="52" height="16" rx="2" fill="#f5f5f5"/>
        <text x="698" y="149" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">STATE</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="264" y1="272" x2="416" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Exit Auth top→enter User DB bottom; exit Auth bottom→enter Mail top -->
        <path d="M 496,240 H 692 Q 700,240 700,232 V 224"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 496,304 H 692 Q 700,304 700,312 V 320"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="316" y="248" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="340" y="262" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="564" y="216" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="586" y="227" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

        <rect x="568" y="312" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="586" y="323" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEND</text>

        <!-- Node: Web app -->
        <g data-node-id="web-app">
          <rect x="120" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="120" y="240" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
          <rect x="128" y="244" width="28" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
          <text x="142" y="257" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
          <text x="192" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web app</text>
          <text x="192" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">screens · wireflow</text>
        </g>

        <!-- Node: Auth service (focal coral) -->
        <g data-node-id="auth-service">
          <rect x="416" y="240" width="160" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="416" y="240" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <rect x="424" y="244" width="32" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
          <text x="440" y="257" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
          <text x="496" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth service</text>
          <text x="496" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">login · reset · tokens</text>
        </g>

        <!-- Node: User DB -->
        <g data-node-id="user-db">
          <rect x="628" y="160" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="628" y="160" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="636" y="164" width="28" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
          <text x="650" y="177" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
          <text x="700" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User DB</text>
          <text x="700" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users · tokens</text>
        </g>

        <!-- Node: Mail service -->
        <g data-node-id="mail-service">
          <rect x="628" y="320" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="628" y="320" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="636" y="324" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="652" y="337" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SMTP</text>
          <text x="700" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mail service</text>
          <text x="700" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reset links</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="444" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal service</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="200" y="444" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store</text>

        <rect x="296" y="436" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
        <text x="316" y="444" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Client</text>

        <line x1="416" y1="442" x2="444" y2="442" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="452" y="444" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">HTTP request</text>

        <text x="588" y="444" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">data-node-id</text>
        <text x="676" y="444" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Node ids referenced by example-wireflow-backed.html</text>
      </svg>
  </div>
</body>
</html>
