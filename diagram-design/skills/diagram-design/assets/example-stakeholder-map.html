<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Who surrounds the data platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75; --soft: #636b80;
      --rule: rgba(45,49,66,0.12); --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08);
      --chip: #ffffff; --mask: #ffffff;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', 'Lora', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1160px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--rule); stroke-width: 1; }
    .chip { fill: var(--chip); stroke: var(--ink); stroke-width: 1; }
    .chip.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .chip-mask { fill: var(--mask); }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 9px var(--mono); text-anchor: middle; }
    .orbit-label { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.14em; text-anchor: middle; }
    .sector-label { fill: var(--soft); }
    .legend-label { fill: var(--muted); font: 400 9px var(--mono); letter-spacing: 0.14em; }
    .legend-item { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.06em; }
    .legend-dot { fill: none; stroke: var(--soft); stroke-width: 1; }
    .legend-swatch { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1; }
    .label-mask { fill: var(--paper); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Stakeholder map · Diagram Design</p>
    <h1>Who surrounds the data platform</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sm-title sm-desc">
      <title id="sm-title">Who surrounds the data platform</title>
      <desc id="sm-desc">Nine stakeholders sit on three concentric rings around a central Data Platform hub. Core holds the CDO sponsor and the platform team; direct holds the analytics guild, product squads and security; indirect holds finance and legal on the internal side, and an external auditor and cloud vendor on the external side. CDO Sponsor and Security are marked focal.</desc>
      <rect width="1000" height="640" fill="#f5f5f5"/>

      <!-- Three proximity rings. Nothing but distance is encoded here. -->
      <circle class="ring" cx="500" cy="288" r="96"/>
      <circle class="ring" cx="500" cy="288" r="184"/>
      <circle class="ring" cx="500" cy="288" r="268"/>

      <!-- The one sector divider: internal left, external right. -->
      <line class="ring" x1="500" y1="20" x2="500" y2="556"/>

      <!-- Ring eyebrows at 12 o'clock, masked where they sit on a stroke. -->
      <rect class="label-mask" x="464" y="12" width="72" height="16"/>
      <text class="orbit-label" x="500" y="24">INDIRECT</text>
      <rect class="label-mask" x="472" y="96" width="56" height="16"/>
      <text class="orbit-label" x="500" y="108">DIRECT</text>
      <rect class="label-mask" x="476" y="184" width="48" height="16"/>
      <text class="orbit-label" x="500" y="196">CORE</text>

      <!-- Sector eyebrows where the divider region meets the outer ring. -->
      <rect class="label-mask" x="276" y="92" width="72" height="16"/>
      <text class="orbit-label sector-label" x="312" y="104">INTERNAL</text>
      <rect class="label-mask" x="652" y="92" width="72" height="16"/>
      <text class="orbit-label sector-label" x="688" y="104">EXTERNAL</text>

      <!-- DIRECT ring -->
      <rect class="chip" x="352" y="108" width="112" height="40" rx="4"/>
      <text class="node-name" x="408" y="124">Product squads</text><text class="sublabel" x="408" y="140">weekly sync</text>

      <rect class="chip" x="260" y="268" width="112" height="40" rx="4"/>
      <text class="node-name" x="316" y="284">Analytics guild</text><text class="sublabel" x="316" y="300">daily users</text>

      <!-- INDIRECT ring — internal -->
      <rect class="chip" x="212" y="132" width="112" height="40" rx="4"/>
      <text class="node-name" x="268" y="148">Finance</text><text class="sublabel" x="268" y="164">cost allocation</text>

      <rect class="chip" x="204" y="404" width="128" height="40" rx="4"/>
      <text class="node-name" x="268" y="420">Legal / Compliance</text><text class="sublabel" x="268" y="436">data residency</text>

      <!-- INDIRECT ring — external -->
      <rect class="chip" x="676" y="132" width="112" height="40" rx="4"/>
      <text class="node-name" x="732" y="148">External auditor</text><text class="sublabel" x="732" y="164">annual audit</text>

      <rect class="chip" x="676" y="404" width="112" height="40" rx="4"/>
      <text class="node-name" x="732" y="420">Cloud vendor</text><text class="sublabel" x="732" y="436">capacity SLA</text>

      <!-- CORE ring -->
      <rect class="chip" x="376" y="336" width="112" height="40" rx="4"/>
      <text class="node-name" x="432" y="352">Platform team</text><text class="sublabel" x="432" y="368">builds &amp; operates</text>

      <!-- The two focal chips: opaque mask first, translucent tint on top. -->
      <rect class="chip-mask" x="376" y="200" width="112" height="40" rx="4"/>
      <rect class="chip focal" x="376" y="200" width="112" height="40" rx="4"/>
      <text class="node-name focal-name" x="432" y="216">CDO Sponsor</text><text class="sublabel" x="432" y="232">funds the roadmap</text>

      <rect class="chip-mask" x="352" y="428" width="112" height="40" rx="4"/>
      <rect class="chip focal" x="352" y="428" width="112" height="40" rx="4"/>
      <text class="node-name focal-name" x="408" y="444">Security</text><text class="sublabel" x="408" y="460">release sign-off</text>

      <!-- The subject itself: the one ink-filled element. -->
      <rect class="hub" x="416" y="256" width="168" height="64" rx="8"/>
      <text class="hub-name" x="500" y="284">Data Platform</text>
      <text class="hub-sub" x="500" y="304">internal launch · 2026</text>

      <!-- Legend strip — outside the diagram area. -->
      <line x1="32" y1="584" x2="968" y2="584" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text class="legend-label" x="32" y="604">LEGEND</text>
      <circle class="legend-dot" cx="124" cy="600" r="6"/>
      <text class="legend-item" x="140" y="604">CORE · decides</text>
      <circle class="legend-dot" cx="268" cy="600" r="6"/>
      <text class="legend-item" x="284" y="604">DIRECT · works with it weekly</text>
      <circle class="legend-dot" cx="504" cy="600" r="6"/>
      <text class="legend-item" x="520" y="604">INDIRECT · affected / regulates</text>
      <rect class="legend-swatch" x="744" y="592" width="20" height="14" rx="2"/>
      <text class="legend-item" x="772" y="604">FOCAL · support decides outcome</text>
    </svg>
  </main>
</body>
</html>
