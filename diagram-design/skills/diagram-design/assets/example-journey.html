<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-week onboarding · Journey map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Journey map · Diagram Design</p>
    <h1>First-week onboarding</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Stage headers -->
      <text x="240" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">DISCOVER</text>
      <text x="400" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">SIGN UP</text>
      <text x="560" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">FIRST VALUE</text>
      <text x="720" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">HABIT</text>
      <text x="880" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">ADVOCATE</text>

      <!-- Stage hairlines -->
      <line x1="160" y1="80" x2="160" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="320" y1="80" x2="320" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="480" y1="80" x2="480" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="640" y1="80" x2="640" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="800" y1="80" x2="800" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

      <!-- Band rules -->
      <line x1="40" y1="80"  x2="960" y2="80"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="176" x2="960" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="432" x2="960" y2="432" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Band eyebrows -->
      <text x="48" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DOING</text>
      <text x="48" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FEELING</text>
      <text x="48" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OPPORTUNITY</text>

      <!-- DOING — touchpoints -->
      <rect x="176" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compare tools</text>
      <text x="240" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">landing page</text>

      <rect x="336" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create workspace</text>
      <text x="400" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signup form</text>

      <rect x="496" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send first report</text>
      <text x="560" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-app</text>

      <rect x="656" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Automate sync</text>
      <text x="720" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">integrations</text>

      <rect x="816" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Invite teammates</text>
      <text x="880" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email · referral</text>

      <!-- FEELING — neutral baseline -->
      <line x1="176" y1="264" x2="944" y2="264" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="944" y="256" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">NEUTRAL</text>

      <!-- FEELING — emotion curve (data curve: smooth path, no elbows) -->
      <path d="M 240 240 C 296 240 344 320 400 320 C 456 320 504 224 560 224 C 616 224 664 232 720 232 C 776 232 824 208 880 208"
            fill="none" stroke="#4f5d75" stroke-width="1.2"/>

      <circle cx="240" cy="240" r="4" fill="#4f5d75"/>
      <circle cx="560" cy="224" r="4" fill="#4f5d75"/>
      <circle cx="720" cy="232" r="4" fill="#4f5d75"/>
      <circle cx="880" cy="208" r="4" fill="#4f5d75"/>

      <!-- Pain moment (coral 1 of 2) -->
      <circle cx="400" cy="320" r="6" fill="#eb6c36"/>
      <line x1="400" y1="328" x2="400" y2="336" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="348" fill="#4f5d75" font-size="14" font-style="italic"
            font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Setup friction stalls new teams</text>

      <!-- OPPORTUNITY — plain notes, no boxes -->
      <text x="400" y="392" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Prefill workspace</text>
      <text x="400" y="404" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">from email domain</text>

      <text x="560" y="392" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Template gallery</text>
      <text x="560" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">on first login</text>

      <text x="720" y="392" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Weekly digest</text>
      <text x="720" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nudges owners back</text>

      <!-- Legend -->
      <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="484" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Touchpoint</text>

      <circle cx="176" cy="492" r="4" fill="#4f5d75"/>
      <text x="188" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Emotion point</text>

      <circle cx="304" cy="492" r="6" fill="#eb6c36"/>
      <text x="320" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Pain moment</text>

      <line x1="440" y1="492" x2="468" y2="492" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="476" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Neutral baseline</text>
    </svg>
  </div>
</body>
</html>
