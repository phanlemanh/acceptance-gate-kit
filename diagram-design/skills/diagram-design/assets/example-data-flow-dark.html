<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics pipeline · Data flow · Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0;
      --soft: #a1aaba; --rule: rgba(245,245,245,0.12); --accent: #f08a59;
      --accent-tint: rgba(240,138,89,0.10); --link: #6a95d8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', 'Lora', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 828px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 9px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 9px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 9px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 9px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 9px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>Role-scoped analytics pipeline</h1>

    <svg viewBox="0 0 828 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Role-scoped analytics data flow</title>
      <desc id="flow-desc">A Data Engineer ingests and stores commerce data, a Data Scientist transforms and analyzes it, and an Analyst publishes a dashboard.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(245,245,245,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bfc0c0"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#f08a59"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#6a95d8"/></marker>
      </defs>
      <rect width="828" height="456" fill="#2d3142"/>
      <rect width="828" height="456" fill="url(#dots)"/>
      <rect x="0" y="44" width="828" height="108" fill="rgba(245,245,245,0.025)"/>
      <rect x="0" y="260" width="828" height="108" fill="rgba(245,245,245,0.025)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="44" x2="828" y2="44" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="152" x2="828" y2="152" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="260" x2="828" y2="260" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="368" x2="828" y2="368" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="44" x2="140" y2="368" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="190" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="206" y="17" class="step-number">01</text><text x="206" y="34" class="step-label">INGEST</text>
        <rect x="322" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="338" y="17" class="step-number">02</text><text x="338" y="34" class="step-label">STORE</text>
        <rect x="454" y="6" width="32" height="16" rx="8" fill="rgba(240,138,89,0.22)"/><text x="470" y="17" class="step-number focal-text">03</text><text x="470" y="34" class="step-label focal-text">TRANSFORM</text>
        <rect x="586" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="602" y="17" class="step-number">04</text><text x="602" y="34" class="step-label">ANALYZE</text>
        <rect x="718" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="734" y="17" class="step-number">05</text><text x="734" y="34" class="step-label">PUBLISH</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="95" class="lane-label">DATA</text><text x="70" y="107" class="lane-label">ENGINEER</text>
        <text x="70" y="203" class="lane-label">DATA</text><text x="70" y="215" class="lane-label">SCIENTIST</text>
        <text x="70" y="311" class="lane-label">ANALYTICS</text><text x="70" y="323" class="lane-label">ANALYST</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M266 98 H278" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <path d="M398 98 H462 Q470 98 470 106 V160" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M530 206 H542" fill="none" stroke="#bfc0c0" marker-end="url(#arr-muted)"/>
      <path d="M662 206 H726 Q734 206 734 214 V268" fill="none" stroke="#6a95d8" marker-end="url(#arr-link)"/>
      <rect x="404" y="90" width="64" height="16" rx="2" fill="#2d3142"/>
      <text x="436" y="101" fill="#f19162" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW TABLE</text>

      <!-- Data Engineer: Capture Events -->
      <rect x="146" y="52" width="120" height="92" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="150" y="56" width="28" height="16" rx="3" fill="rgba(245,245,245,0.12)"/><text x="164" y="67" class="role-text">ENG</text>
      <text x="206" y="88" class="node-title">Capture Events</text><text x="206" y="102" class="node-sub">shop events → batch</text><text x="206" y="116" class="node-tool">NiFi ingest</text>
      <rect x="150" y="124" width="20" height="16" rx="3" fill="#7c8f6f"/><text x="160" y="135" class="chip-text">LS</text>
      <rect x="242" y="124" width="20" height="16" rx="3" fill="#5e7a9b"/><text x="252" y="135" class="chip-text">DB</text>

      <!-- Data Engineer: Land Records -->
      <rect x="278" y="52" width="120" height="92" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="282" y="56" width="28" height="16" rx="3" fill="rgba(245,245,245,0.12)"/><text x="296" y="67" class="role-text">ENG</text>
      <text x="338" y="88" class="node-title">Land Records</text><text x="338" y="102" class="node-sub">events · orders</text><text x="338" y="116" class="node-tool">Object storage</text>
      <rect x="282" y="124" width="20" height="16" rx="3" fill="#5e7a9b"/><text x="292" y="135" class="chip-text">DB</text>
      <rect x="374" y="124" width="20" height="16" rx="3" fill="#5e7a9b"/><text x="384" y="135" class="chip-text">DB</text>

      <!-- Data Scientist: Clean and Model (focal) -->
      <rect x="410" y="160" width="120" height="92" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.2"/>
      <rect x="414" y="164" width="28" height="16" rx="3" fill="rgba(240,138,89,0.22)"/><text x="428" y="175" class="role-text focal-text">SCI</text>
      <text x="470" y="196" class="node-title">Clean &amp; Model</text><text x="470" y="210" class="node-sub">raw → trusted table</text><text x="470" y="224" class="node-tool">Trino · notebooks</text>
      <rect x="414" y="232" width="20" height="16" rx="3" fill="#5e7a9b"/><text x="424" y="243" class="chip-text">DB</text>
      <rect x="506" y="232" width="20" height="16" rx="3" fill="#b8915a"/><text x="516" y="243" class="chip-text">TB</text>

      <!-- Data Scientist: Curate Metrics -->
      <rect x="542" y="160" width="120" height="92" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="546" y="164" width="28" height="16" rx="3" fill="rgba(245,245,245,0.12)"/><text x="560" y="175" class="role-text">SCI</text>
      <text x="602" y="196" class="node-title">Curate Metrics</text><text x="602" y="210" class="node-sub">conversion · revenue</text><text x="602" y="224" class="node-tool">Trino SQL</text>
      <rect x="546" y="232" width="20" height="16" rx="3" fill="#b8915a"/><text x="556" y="243" class="chip-text">TB</text>
      <rect x="638" y="232" width="20" height="16" rx="3" fill="#b8915a"/><text x="648" y="243" class="chip-text">TB</text>

      <!-- Analyst: Publish Dashboard -->
      <rect x="674" y="268" width="120" height="92" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.20)"/>
      <rect x="678" y="272" width="28" height="16" rx="3" fill="rgba(245,245,245,0.12)"/><text x="692" y="283" class="role-text">ANL</text>
      <text x="734" y="304" class="node-title">Publish Dashboard</text><text x="734" y="318" class="node-sub">metrics → decisions</text><text x="734" y="332" class="node-tool">BI workspace</text>
      <rect x="678" y="340" width="20" height="16" rx="3" fill="#b8915a"/><text x="688" y="351" class="chip-text">TB</text>
      <rect x="770" y="340" width="20" height="16" rx="3" fill="#9c6b50"/><text x="780" y="351" class="chip-text">FL</text>

      <!-- Legend: steps -->
      <text x="190" y="379" class="legend-label">STEPS</text>
      <rect x="206" y="368" width="24" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="218" y="379" class="step-number">01</text><text x="238" y="379" class="legend-text">Ingest</text>
      <rect x="288" y="368" width="24" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="300" y="379" class="step-number">02</text><text x="320" y="379" class="legend-text">Store</text>
      <rect x="368" y="368" width="24" height="16" rx="8" fill="rgba(240,138,89,0.22)"/><text x="380" y="379" class="step-number focal-text">03</text><text x="400" y="379" class="legend-text">Transform</text>
      <rect x="468" y="368" width="24" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="480" y="379" class="step-number">04</text><text x="500" y="379" class="legend-text">Analyze</text>
      <rect x="560" y="368" width="24" height="16" rx="8" fill="rgba(245,245,245,0.12)"/><text x="572" y="379" class="step-number">05</text><text x="592" y="379" class="legend-text">Publish</text>

      <!-- Legend: data types -->
      <text x="190" y="411" class="legend-label">DATA TYPE</text>
      <rect x="206" y="400" width="20" height="16" rx="3" fill="#7c8f6f"/><text x="216" y="411" class="chip-text">LS</text><text x="234" y="411" class="legend-text">Stream</text>
      <rect x="286" y="400" width="20" height="16" rx="3" fill="#5e7a9b"/><text x="296" y="411" class="chip-text">DB</text><text x="314" y="411" class="legend-text">Dataset</text>
      <rect x="370" y="400" width="20" height="16" rx="3" fill="#b8915a"/><text x="380" y="411" class="chip-text">TB</text><text x="398" y="411" class="legend-text">Table</text>
      <rect x="444" y="400" width="20" height="16" rx="3" fill="#9c6b50"/><text x="454" y="411" class="chip-text">FL</text><text x="472" y="411" class="legend-text">Dashboard</text>
      <text x="548" y="411" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="190" y="440" class="legend-label">FLOW</text>
      <line x1="206" y1="437" x2="230" y2="437" stroke="#bfc0c0" marker-end="url(#arr-muted)"/><text x="238" y="440" class="legend-text">Standard handoff</text>
      <line x1="336" y1="437" x2="360" y2="437" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="368" y="440" class="legend-text">Focal handoff</text>
      <line x1="452" y1="437" x2="476" y2="437" stroke="#6a95d8" marker-end="url(#arr-link)"/><text x="484" y="440" class="legend-text">Published output</text>
    </svg>
  </main>
</body>
</html>
