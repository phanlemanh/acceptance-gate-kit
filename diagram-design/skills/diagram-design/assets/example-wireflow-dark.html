<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password reset flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Wireflow · Diagram Design</p>
    <h1>Password reset flow</h1>

    <svg viewBox="0 0 1000 296" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Action edges (drawn first, behind the screens) — endpoints share y, so straight lines -->
        <line x1="168" y1="108" x2="232" y2="108" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="368" y1="108" x2="432" y2="108" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="568" y1="108" x2="632" y2="108" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="768" y1="108" x2="832" y2="108" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Error branch: Email sent → Forgot password, routed below the row, r=8 elbows -->
        <path d="M 500 168 L 500 200 A 8 8 0 0 1 492 208 L 308 208 A 8 8 0 0 1 300 200 L 300 168"
              fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Edge labels — masked, 8px clear of the stroke -->
        <rect x="168" y="84" width="64" height="16" rx="2" fill="#2d3142"/>
        <text x="200" y="96" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TAP RESET</text>

        <rect x="376" y="84" width="48" height="16" rx="2" fill="#2d3142"/>
        <text x="400" y="96" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>

        <rect x="568" y="84" width="64" height="16" rx="2" fill="#2d3142"/>
        <text x="600" y="96" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN LINK</text>

        <rect x="780" y="84" width="40" height="16" rx="2" fill="#2d3142"/>
        <text x="800" y="96" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>

        <rect x="360" y="184" width="80" height="16" rx="2" fill="#2d3142"/>
        <text x="400" y="196" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINK EXPIRED</text>

        <!-- Screen 1 — Login -->
        <rect x="32" y="48" width="136" height="120" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
        <path d="M 32 68 L 32 54 A 6 6 0 0 1 38 48 L 162 48 A 6 6 0 0 1 168 54 L 168 68 Z" fill="#393e53"/>
        <line x1="32" y1="68" x2="168" y2="68" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <text x="40" y="62" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Login</text>
        <text x="160" y="62" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/login</text>
        <rect x="44" y="80" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <rect x="44" y="104" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <rect x="44" y="128" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <rect x="44" y="152" width="64" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>

        <!-- Screen 2 — Forgot password -->
        <rect x="232" y="48" width="136" height="120" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
        <path d="M 232 68 L 232 54 A 6 6 0 0 1 238 48 L 362 48 A 6 6 0 0 1 368 54 L 368 68 Z" fill="#393e53"/>
        <line x1="232" y1="68" x2="368" y2="68" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <text x="236" y="62" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Forgot password</text>
        <text x="364" y="62" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/forgot</text>
        <rect x="244" y="84" width="96" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>
        <rect x="244" y="100" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <rect x="244" y="128" width="112" height="16" rx="2" fill="#f5f5f5"/>

        <!-- Screen 3 — Email sent -->
        <rect x="432" y="48" width="136" height="120" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
        <path d="M 432 68 L 432 54 A 6 6 0 0 1 438 48 L 562 48 A 6 6 0 0 1 568 54 L 568 68 Z" fill="#393e53"/>
        <line x1="432" y1="68" x2="568" y2="68" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <text x="440" y="62" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Email sent</text>
        <text x="560" y="62" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/sent</text>
        <rect x="444" y="88" width="112" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>
        <rect x="444" y="100" width="80" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>
        <rect x="444" y="124" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>

        <!-- Screen 4 — New password (the one coral CTA) -->
        <rect x="632" y="48" width="136" height="120" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
        <path d="M 632 68 L 632 54 A 6 6 0 0 1 638 48 L 762 48 A 6 6 0 0 1 768 54 L 768 68 Z" fill="#393e53"/>
        <line x1="632" y1="68" x2="768" y2="68" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <text x="640" y="62" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', sans-serif">New password</text>
        <text x="760" y="62" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/reset</text>
        <rect x="644" y="84" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <rect x="644" y="108" width="112" height="16" rx="2" fill="none" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <rect x="644" y="136" width="112" height="16" rx="2" fill="#f08a59"/>

        <!-- Screen 5 — Success (focal) -->
        <rect x="832" y="48" width="136" height="120" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <path d="M 832 68 L 832 54 A 6 6 0 0 1 838 48 L 962 48 A 6 6 0 0 1 968 54 L 968 68 Z" fill="#393e53"/>
        <line x1="832" y1="68" x2="968" y2="68" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
        <text x="840" y="62" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Success</text>
        <text x="960" y="62" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/done</text>
        <circle cx="900" cy="96" r="12" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="856" y="120" width="88" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>
        <rect x="868" y="132" width="64" height="4" rx="2" fill="rgba(245,245,245,0.12)"/>

        <!-- Legend -->
        <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="256" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SCREENS AND ACTIONS</text>

        <rect x="40" y="264" width="24" height="16" rx="2" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
        <path d="M 40 269 L 40 266 A 2 2 0 0 1 42 264 L 62 264 A 2 2 0 0 1 64 266 L 64 269 Z" fill="#393e53"/>
        <text x="72" y="276" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Screen</text>

        <line x1="160" y1="272" x2="188" y2="272" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="196" y="276" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">User action</text>

        <line x1="320" y1="272" x2="348" y2="272" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="356" y="276" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Error / edge path</text>

        <rect x="516" y="264" width="24" height="16" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="548" y="276" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Focal screen</text>
      </svg>
  </div>
</body>
</html>
