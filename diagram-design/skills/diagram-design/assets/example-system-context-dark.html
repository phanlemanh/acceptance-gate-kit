<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing Platform · System context</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">System context · Diagram Design</p>
    <h1>Billing Platform in context</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <path d="M 296,128 V 176 Q 296,184 304,184 H 456 Q 464,184 464,192 V 236"

      <path d="M 624,128 V 176 Q 624,184 616,184 H 544 Q 536,184 536,192 V 236"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Billing Platform → Stripe -->
      <path d="M 612,264 H 640 Q 648,264 648,256 V 236 Q 648,228 656,228 H 760"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Billing Platform → Tax service -->
      <path d="M 612,296 H 656 Q 664,296 664,304 V 332 Q 664,340 672,340 H 760"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Billing Platform → Email provider -->
      <path d="M 464,324 V 364 Q 464,372 456,372 H 384 Q 376,372 376,380 V 420"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <text x="380" y="173" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAY INVOICE</text>

      <rect x="544" y="160" width="72" height="16" rx="2" fill="#2d3142"/>

      <rect x="364" y="332" width="92" height="32" rx="2" fill="#2d3142"/>
      <text x="410" y="346" fill="#6a95d8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND INVOICES</text>

      <rect x="544" y="332" width="92" height="32" rx="2" fill="#2d3142"/>
      <text x="590" y="346" fill="#6a95d8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXPORT LEDGER</text>

      <!-- Person: Customer -->
      <rect x="232" y="76" width="128" height="52" rx="6" fill="#2d3142"/>
      <rect x="232" y="76" width="128" height="52" rx="6" fill="rgba(191,192,192,0.10)" stroke="#a1aaba" stroke-width="1"/>
      <rect x="240" y="84" width="48" height="16" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>

      <rect x="560" y="76" width="128" height="52" rx="6" fill="#2d3142"/>

      <rect x="388" y="236" width="224" height="88" rx="6" fill="#2d3142"/>

      <text x="832" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stripe</text>

      <!-- External: Tax service -->
      <rect x="760" y="308" width="144" height="64" rx="6" fill="#2d3142"/>
      <rect x="760" y="308" width="144" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="768" y="316" width="60" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="798" y="329" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="832" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tax service</text>

      <!-- External: Email provider -->
      <rect x="304" y="420" width="144" height="64" rx="6" fill="#2d3142"/>
      <rect x="304" y="420" width="144" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="312" y="428" width="60" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="342" y="441" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="376" y="464" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email provider</text>

      <!-- External: ERP -->
      <rect x="560" y="420" width="144" height="64" rx="6" fill="#2d3142"/>
      <rect x="560" y="420" width="144" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="568" y="428" width="60" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="598" y="441" fill="#a1aaba" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="632" y="464" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ERP</text>

      <!-- Legend strip -->
      <line x1="40" y1="504" x2="960" y2="504" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <circle cx="48" cy="532" r="4" fill="none" stroke="#bfc0c0" stroke-width="1.1"/>
      <path d="M 40,544 a 8,6 0 0 1 16,0" fill="none" stroke="#bfc0c0" stroke-width="1.1" stroke-linecap="round"/>
      <text x="64" y="540" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Person</text>

      <rect x="160" y="532" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="180" y="540" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Focal system</text>

      <rect x="320" y="532" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="340" y="540" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">External system</text>

      <line x1="496" y1="536" x2="524" y2="536" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="532" y="540" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">API call</text>

  </div>
</body>
</html>
