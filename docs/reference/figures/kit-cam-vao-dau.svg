</defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="32" y="48" width="936" height="468" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><rect x="48" y="41" width="302" height="14" rx="2" fill="#f5f5f5"/><text x="56" y="51" fill="#636b80" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PHIÊN CLAUDE CODE CỦA ĐỘI VIÊN — MỘT MẶT PHẲNG LÀM VIỆC</text><rect x="64" y="104" width="640" height="384" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="0.8"/><rect x="80" y="97" width="234" height="14" rx="2" fill="#f5f5f5"/><text x="88" y="107" fill="#636b80" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MARKETPLACE acceptance-gate-kit · 3 PLUGIN</text><rect x="96" y="152" width="184" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="108" y="174" fill="#2d3142" font-size="12" font-weight="600">acceptance-gate</text><text x="108" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">5 skill:</text><text x="108" y="206" fill="#4f5d75" font-size="9" >acceptance · design-pass</text><text x="108" y="220" fill="#4f5d75" font-size="9" >morphological-scan · uat-session</text><text x="108" y="234" fill="#4f5d75" font-size="9" >ux-ui-craft</text><text x="108" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">7 lệnh cổng người</text><text x="108" y="262" fill="#4f5d75" font-size="9" >(6 khoá máy-gọi, ADR 0002)</text><text x="108" y="276" fill="#4f5d75" font-size="9" >hook lúc ghi · scripts · lib</text><rect x="296" y="152" width="184" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="308" y="174" fill="#2d3142" font-size="12" font-weight="600">feature-loop</text><text x="308" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1 skill nhạc trưởng S0→S5</text><text x="308" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">2 workflow:</text><text x="308" y="220" fill="#4f5d75" font-size="9" >acceptance-verify (S4 đo)</text><text x="308" y="234" fill="#4f5d75" font-size="9" >execute-parallel (S3 fan-out)</text><text x="308" y="248" fill="#4f5d75" font-size="9" >gọi: acceptance-gate,</text><text x="308" y="262" fill="#4f5d75" font-size="9" >superpowers ×4, Workflow</text><text x="308" y="276" fill="#4f5d75" font-size="9" >4 script: carry-plan · claim-scan…</text><rect x="496" y="152" width="184" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="508" y="174" fill="#2d3142" font-size="12" font-weight="600">diagram-design</text><text x="508" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">1 skill · 2 lệnh</text><text x="508" y="206" fill="#4f5d75" font-size="9" >export-diagram · import-drawio</text><text x="508" y="220" fill="#4f5d75" font-size="9" >vendor có pin + tree-hash</text><text x="508" y="234" fill="#4f5d75" font-size="9" >(kho skill → vendor-sync)</text><text x="508" y="248" fill="#4f5d75" font-size="9" >hình cho thẻ cổng, hồ sơ,</text><text x="508" y="262" fill="#4f5d75" font-size="9" >bản in — chiếu của chữ</text><rect x="96" y="352" width="584" height="112" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/><rect x="112" y="345" width="167" height="14" rx="2" fill="#f5f5f5"/><text x="120" y="355" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENGINE CHUNG — MỘT NGUỒN LUẬT</text><text x="112" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">lib/evidence-core.cjs (L1–L3) · workspace-record.cjs · gap-probe.cjs · ac-line.cjs · md-section.cjs</text><text x="112" y="400" fill="#4f5d75" font-size="9">hook lúc ghi và lưới CI đều require chính các file này — hai lớp không bao giờ lệch luật nhau</text><text x="112" y="418" fill="#4f5d75" font-size="9">acceptance-init chép 7 file (pre-merge-check.sh · recheck-evidence.cjs + 5 lib) sang repo tiêu thụ</text><text x="112" y="436" fill="#4f5d75" font-size="9">→ lưới chạy trong CI mà không cần phiên nào; thiếu một file là tắt một lớp cưỡng chế</text><rect x="736" y="120" width="200" height="136" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="748" y="142" fill="#2d3142" font-size="12" font-weight="600">superpowers</text><text x="748" y="160" fill="#4f5d75" font-size="9" >plugin khác — kit gọi đích danh</text><text x="748" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">superpowers:brainstorming (S1)</text><text x="748" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">superpowers:writing-plans (S2)</text><text x="748" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">superpowers:executing-plans (S3)</text><text x="748" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">…finishing-a-development-branch</text><text x="748" y="230" fill="#4f5d75" font-size="9" >(S5)</text><rect x="736" y="288" width="200" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/><text x="748" y="310" fill="#2d3142" font-size="12" font-weight="600">Ổ cắm repo tự khai</text><text x="748" y="328" fill="#4f5d75" font-size="9" >trong _acceptance/config.yaml:</text><text x="748" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">discovery.brainstorm_skill</text><text x="748" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">feature_loop.ui_standards_skill</text><text x="748" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">design_pass.ds_skill</text><text x="748" y="384" fill="#4f5d75" font-size="9" >→ product-management, skill DS</text><text x="748" y="398" fill="#4f5d75" font-size="9" >của đội… — hiện CHƯA cắm</text><text x="748" y="412" fill="#4f5d75" font-size="9" >vắng thì kit đi nghi thức nội bộ</text><text x="32" y="548" fill="#ba4513" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Repo tiêu thụ đứng ngoài phiên: nó giữ _acceptance/ (hồ sơ + config) và bản chép 7 file — nên lưới còn chạy khi không có phiên nào.</text><line x1="32" y1="572" x2="968" y2="572" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text><rect x="112" y="580" width="24" height="14" rx="3" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><text x="144" y="592" fill="#4f5d75" font-size="9">vòng chứa — ngoài rộng, trong hẹp</text><rect x="336" y="580" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/><text x="368" y="592" fill="#4f5d75" font-size="9">nguồn luật duy nhất</text><rect x="512" y="580" width="24" height="14" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/><text x="544" y="592" fill="#4f5d75" font-size="9">ổ cắm — không bắt buộc</text></svg>