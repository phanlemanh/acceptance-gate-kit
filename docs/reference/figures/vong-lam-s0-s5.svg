      <!-- S1 -->
      <rect x="296" y="204" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="204" width="128" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S1 · Thiết kế</text>
      <text x="360" y="246" fill="#4f5d75" font-size="9" text-anchor="middle">hợp đồng · evals · gap-probe</text>
      <!-- Cổng Phạm vi (diamond) -->
      <polygon points="496,192 536,232 496,272 456,232" fill="#f5f5f5"/>
      <polygon points="496,192 536,232 496,272 456,232" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="496" y="230" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Cổng</text>
      <text x="496" y="242" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Phạm vi</text>
      <!-- S2–S3 -->
      <rect x="568" y="204" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="204" width="128" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S2–S3 · Plan + code</text>
      <text x="632" y="246" fill="#4f5d75" font-size="9" text-anchor="middle">task độc lập → song song</text>
      <!-- Cổng Bằng chứng (diamond) -->
      <polygon points="768,192 808,232 768,272 728,232" fill="#f5f5f5"/>
      <polygon points="768,192 808,232 768,272 728,232" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="768" y="230" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Cổng</text>
      <text x="768" y="242" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Bằng chứng</text>
      <!-- S5 -->
      <rect x="840" y="204" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="204" width="120" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S5 · Giao</text>
      <text x="900" y="246" fill="#4f5d75" font-size="9" text-anchor="middle">PR · bàn giao Vòng TRAO</text>

      <!-- NODES — lane 3 -->
      <rect x="568" y="324" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="324" width="128" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="348" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S4 · Đo</text>
      <text x="632" y="366" fill="#4f5d75" font-size="9" text-anchor="middle">4 suite · hội đồng · review</text>

      <!-- NODES — lane 1 (dashed: chỉ khi cần) -->
      <rect x="440" y="88" width="112" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="88" width="112" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="496" y="108" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Veto trên thẻ</text>
      <text x="496" y="124" fill="#4f5d75" font-size="9" text-anchor="middle">T3 · mơ hồ · còn P0 → dừng</text>
      <rect x="712" y="88" width="112" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="88" width="112" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="768" y="108" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ký khi khó-đảo</text>
      <text x="768" y="124" fill="#4f5d75" font-size="9" text-anchor="middle">ship thật · xoá dữ liệu · T3</text>

      <!-- LANE 4 — status ticks -->
      <line x1="360" y1="400" x2="360" y2="408" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">draft</text>
      <line x1="552" y1="400" x2="552" y2="408" stroke="#4f5d75" stroke-width="1"/>
      <text x="552" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approved</text>
      <text x="552" y="438" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">veto_state: mo</text>
      <line x1="632" y1="400" x2="632" y2="408" stroke="#4f5d75" stroke-width="1"/>
      <text x="632" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">implemented</text>
      <line x1="768" y1="400" x2="768" y2="408" stroke="#4f5d75" stroke-width="1"/>
      <text x="768" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verified</text>
      <text x="768" y="438" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">verified_commit</text>
      <line x1="900" y1="400" x2="900" y2="408" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signed-off</text>
      <text x="900" y="438" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hoặc làn V: không chữ ký</text>

      <!-- LEGEND -->
      <line x1="32" y1="496" x2="968" y2="496" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <line x1="112" y1="512" x2="144" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="152" y="516" fill="#4f5d75" font-size="9">bước máy, đi tiếp trong cùng lượt</text>
      <line x1="352" y1="512" x2="384" y2="512" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="392" y="516" fill="#4f5d75" font-size="9">làn V — qua cổng không hỏi, cửa veto vẫn mở</text>
      <line x1="640" y1="512" x2="672" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="680" y="516" fill="#4f5d75" font-size="9">chỉ khi cần: vòng sửa · gọi người</text>
      <polygon points="872,504 880,512 872,520 864,512" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="888" y="516" fill="#4f5d75" font-size="9">cổng người</text>
    </svg>