<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LANES -->
      <line x1="32" y1="64" x2="968" y2="64" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="160" x2="968" y2="160" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="304" x2="968" y2="304" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="400" x2="968" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="464" x2="968" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="32" y="108" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NGƯỜI Ở BIÊN</text>
      <text x="32" y="122" fill="#636b80" font-size="9">chỉ khi có đánh-đổi / khó-đảo</text>
      <text x="32" y="228" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHẠC TRƯỞNG</text>
      <text x="32" y="242" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">feature-loop</text>
      <text x="32" y="348" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BỘ ĐO</text>
      <text x="32" y="362" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">acceptance-verify</text>
      <text x="32" y="428" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỒ SƠ</text>
      <text x="32" y="442" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">contract.md · status</text>

      <!-- ARROWS -->
      <!-- S0 → S1 -->
      <line x1="264" y1="232" x2="296" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- S1 → Cổng Phạm vi -->
      <line x1="424" y1="232" x2="456" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cổng Phạm vi → S2–S3 (làn V, accent) -->
      <line x1="536" y1="232" x2="568" y2="232" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- S2–S3 → S4 -->
      <line x1="632" y1="260" x2="632" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="642" y="282" width="84" height="14" rx="2" fill="#f5f5f5"/>
      <text x="644" y="292" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IMPLEMENTED</text>
      <!-- S4 → S2–S3 (REJECT, tự sửa ≤3 vòng) -->
      <path d="M568,352 H560 Q552,352 552,344 V256 Q552,248 560,248 H568" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="444" y="290" width="100" height="14" rx="2" fill="#f5f5f5"/>
      <text x="542" y="300" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">REJECT · ≤3 VÒNG</text>
