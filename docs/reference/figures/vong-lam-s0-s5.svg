      <line x1="808" y1="232" x2="840" y2="232" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Cổng Phạm vi → Người (dashed, chỉ khi cần) -->
      <line x1="496" y1="192" x2="496" y2="136" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="506" y="156" width="96" height="14" rx="2" fill="#f5f5f5"/>
      <text x="508" y="166" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">THẺ · CỬA VETO MỞ</text>
      <!-- Cổng Bằng chứng → Người (dashed, chỉ khi cần) -->
      <line x1="768" y1="192" x2="768" y2="136" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="778" y="156" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="780" y="166" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">THIẾU 1/6 · KHÓ-ĐẢO</text>

      <!-- NODES — lane 2 -->
      <!-- S0 -->
      <rect x="168" y="204" width="96" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="168" y="204" width="96" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S0 · Định hạng</text>
