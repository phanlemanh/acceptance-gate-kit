00" y="240" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="500.0" y="262" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S0 · Định hạng</text><text x="500.0" y="278" fill="#4f5d75" font-size="9"  text-anchor="middle">t1_skip_globs · t3_paths · diff thật ở S4</text><polygon points="500,332 540,372 500,412 460,372" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="500" y="370" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Máy</text><text x="500" y="382" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">suy hạng</text><rect x="96" y="440" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="96" y="440" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="216.0" y="462" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ba cổng</text><text x="216.0" y="478" fill="#4f5d75" font-size="9"  text-anchor="middle">+ Cổng 1.5 duyệt plan · người kiểm mọi judgment</text><rect x="400" y="460" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="400" y="460" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/><text x="500.0" y="482" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Hai cổng, có làn V</text><text x="500.0" y="498" fill="#4f5d75" font-size="9"  text-anchor="middle">đủ điều kiện sạch → đi tiếp, cửa veto mở</text><rect x="800" y="440" width="160" height="56" rx="20" fill="#f5f5f5"/><rect x="800" y="440" width="160" height="56" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="880.0" y="462" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Thoát kit</text><text x="880.0" y="478" fill="#4f5d75" font-size="9"  text-anchor="middle">sửa ngoài nghi thức · CI backstop</text><text x="80" y="556" fill="#ba4513" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Hạng quyết độ dày cổng