<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiên Lái-thử Người-lạ — kiến trúc giải pháp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · acceptance-gate-kit</p>
    <h1>Phiên Lái-thử Người-lạ — kiến trúc giải pháp</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONES (bg → zones → arrows → nodes) -->
      <rect x="520" y="80" width="200" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="548" y="84" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BIẾN THỂ UI — WEB</text>
      <rect x="520" y="320" width="200" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="544" y="324" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="333" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BIẾN THỂ AGENT — MCP</text>

      <!-- ARROWS -->
      <!-- 1. điều phối → hồ sơ -->
      <line x1="120" y1="124" x2="120" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="132" y="160" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="136" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VIẾT ĐỀ BÀI</text>
      <!-- 2. hồ sơ → người-lạ -->
      <line x1="200" y1="252" x2="280" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="232" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CẤP</text>
      <!-- 3. người-lạ → Playwright -->
      <path d="M 448,236 H 468 Q 476,236 476,228 V 152 Q 476,144 484,144 H 536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="484" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LÁI PIXEL</text>
      <!-- 4. người-lạ → Chrome DevTools -->
      <path d="M 448,256 H 484 Q 492,256 492,248 V 240 Q 492,232 500,232 H 536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. người-lạ → cầu nối stdio -->
      <path d="M 448,276 H 500 Q 508,276 508,284 V 376 Q 508,384 516,384 H 536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="516" y="300" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GỌI TOOL</text>
      <!-- 6. Playwright → sản phẩm -->
      <path d="M 704,144 H 840 Q 848,144 848,152 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 7. Chrome DevTools → sản phẩm (quan sát, dashed) -->
      <line x1="704" y1="232" x2="800" y2="232" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="724" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOI DÂY</text>
      <!-- 8. cầu nối → sản phẩm -->
      <path d="M 704,384 H 840 Q 848,384 848,376 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 9. người-lạ → nhật ký -->
      <line x1="364" y1="292" x2="364" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="360" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GHI VẤP</text>
      <!-- 10. nhật ký → Cổng Giá trị (accent: vật bàn giao) -->
      <line x1="448" y1="472" x2="800" y2="472" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="592" y="452" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="461" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BÀN GIAO</text>

      <!-- NODES -->

      <rect x="40" y="60" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="60" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="66" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="70" y="75" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESSION</text>
      <text x="120" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên điều phối</text>
      <text x="120" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đề bài · đo lại · hồ sơ</text>

      <!-- B. Hồ sơ mục tiêu (store) -->
      <rect x="40" y="220" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="220" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="226" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="64" y="235" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="120" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ mục tiêu</text>
      <text x="120" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stranger-drive.md</text>

      <!-- C. Phiên người-lạ (FOCAL) -->
      <rect x="280" y="220" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="220" width="168" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="226" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="308" y="235" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FRESH</text>
      <text x="364" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên người-lạ</text>
      <text x="364" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zero-context · budget</text>

      <!-- D. Playwright MCP -->
      <rect x="536" y="112" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="112" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="544" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="558" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="620" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playwright MCP</text>
      <text x="620" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--isolated · caps=vision</text>

      <!-- E. Chrome DevTools MCP -->
      <rect x="536" y="200" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="200" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="544" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="558" y="215" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="620" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chrome DevTools</text>
      <text x="620" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">network · throttle · trace</text>

      <!-- F. Cầu nối stdio -->
      <rect x="536" y="352" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="352" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="544" y="358" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="566" y="367" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRIDGE</text>
      <text x="620" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cầu nối stdio</text>
      <text x="620" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON-RPC · tools/call</text>

      <!-- G. Sản phẩm thật -->
      <rect x="800" y="220" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="220" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="808" y="226" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="830" y="235" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
      <text x="880" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sản phẩm thật</text>
      <text x="880" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dev server / MCP server</text>

      <!-- H. Nhật ký vấp + frames (store) -->
      <rect x="280" y="440" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="440" width="168" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="288" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="302" y="455" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="364" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhật ký vấp + frames</text>
      <text x="364" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CHẶN·LẠC·KHÓ-CHỊU·VẶT</text>

      <!-- I. Cổng Giá trị (người) -->
      <rect x="800" y="440" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="440" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="808" y="446" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="826" y="455" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="880" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Giá trị</text>
      <text x="880" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uat-session · người ký</text>

      <!-- LEGEND -->
      <line x1="30" y1="540" x2="970" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="552" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>

      <rect x="280" y="552" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

      <rect x="400" y="552" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>

      <text x="784" y="561" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">vật bàn giao</text>
    </svg>
  </div>
</body>
</html>
