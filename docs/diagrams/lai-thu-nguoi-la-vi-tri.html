<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiên Lái-thử Người-lạ — vị trí trong Workflow v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · acceptance-gate-kit · feature-loop v2</p>
    <h1>Lái-thử Người-lạ — ngoài vòng lặp, hai ổ cắm</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS trước, NODES sau -->
      <!-- pipeline row 1 -->
      <line x1="184" y1="132" x2="216" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="312" y1="132" x2="344" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="132" x2="520" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="132" x2="672" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="768" y1="132" x2="800" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- S5 → Cổng Giá trị (điều kiện: có opportunity) -->
      <line x1="848" y1="164" x2="848" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="860" y="204" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="864" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ OPPORTUNITY</text>
      <!-- ổ cắm PHỤ: S4 xanh → lái-thử (tuỳ chọn, dashed) -->
      <path d="M 580,164 V 224 Q 580,232 572,232 H 436 Q 428,232 428,240 V 260" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="588" y="176" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SAU S4 XANH</text>
      <!-- lái-thử → Gate 2 (kèm đọc, dashed; hop qua vertical x=580) -->
      <path d="M 440,260 V 208 Q 440,200 448,200 H 572 a 8,8 0 0,1 16,0 H 712 Q 720,200 720,192 V 164" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="448" y="180" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KÈM ĐỌC</text>
      <!-- ổ cắm CHÍNH: lái-thử → Cổng Giá trị (accent) -->
      <line x1="512" y1="296" x2="800" y2="296" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="616" y="276" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="285" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIỀN TRẠM</text>

      <!-- NODES row 1 -->
      <rect x="40" y="100" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="100" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S0–S1 Design</text>
      <text x="112" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contract · evals</text>

      <rect x="216" y="100" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="100" width="96" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="264" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate 1</text>
      <text x="264" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">người duyệt</text>

      <rect x="344" y="100" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="100" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="416" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S2–S3 Execute</text>
      <text x="416" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan · code</text>

      <rect x="520" y="100" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="100" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S4 Verify</text>
      <text x="580" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 suite · max 3 vòng</text>

      <rect x="672" y="100" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="100" width="96" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="720" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate 2</text>
      <text x="720" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">người ký</text>

      <rect x="800" y="100" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="100" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="848" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S5 Ship</text>
      <text x="848" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge · flag</text>

      <!-- NODES row 2 -->
      <rect x="344" y="260" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="260" width="168" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="428" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lái-thử Người-lạ</text>
      <text x="428" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ngoài vòng · 1 ván/vòng</text>

      <rect x="800" y="260" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="260" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="880" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Giá trị</text>
      <text x="880" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uat-session · người ký</text>

      <!-- LEGEND -->
      <line x1="30" y1="368" x2="970" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="380" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">nghi thức ngoài vòng lặp</text>
      <rect x="320" y="380" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="340" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">điểm người quyết</text>
      <line x1="500" y1="386" x2="532" y2="386" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="540" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ổ cắm tuỳ chọn</text>
      <line x1="680" y1="386" x2="712" y2="386" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="720" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ổ cắm mặc định (tiền trạm)</text>
    </svg>
  </div>
</body>
</html>
