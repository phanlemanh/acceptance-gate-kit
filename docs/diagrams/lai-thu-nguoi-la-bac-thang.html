<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiên Lái-thử Người-lạ — bậc thang tiệm cận người thật</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · acceptance-gate-kit</p>
    <h1>Bậc thang tiệm cận người thật — chạy từ rẻ đến đắt, dừng được ở mọi bậc</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-up" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto"><polygon points="0 6, 4 0, 8 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Direction indicator, left margin -->
      <text x="84" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NGƯỜI</text>
      <line x1="84" y1="352" x2="84" y2="88" stroke="#4f5d75" stroke-width="1"/>
      <polygon points="80 92, 84 84, 88 92" fill="#4f5d75"/>
      <text x="84" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY</text>

      <!-- Stack: x=120, w=800, 4 layers × 68px, top y=80 -->
      <!-- B4 — người (không tiệm cận được) -->
      <rect x="120" y="80" width="800" height="68" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="136" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">B4</text>
      <text x="200" y="110" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Bàn giao phiên người</text>
      <text x="200" y="128" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">quyết: đáng-giá — chỉ người, by design</text>
      <text x="904" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uat-session · verdict người ký</text>

      <!-- B3 -->
      <rect x="120" y="148" width="800" height="68" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="136" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">B3</text>
      <text x="200" y="178" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Khử tương quan</text>
      <text x="200" y="196" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bắt: máy tin nhầm chính nó (thiên vị cùng-họ)</text>
      <text x="904" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">vlm-assert.mjs · VLM khác họ · câu ĐÓNG</text>

      <!-- B2 — FOCAL: phần mới so với S4 -->
      <rect x="120" y="216" width="800" height="68" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="136" y="254" fill="rgba(235,108,54,0.90)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">B2</text>
      <text x="200" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Lượt lái người-lạ</text>
      <text x="200" y="264" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bắt: lạc · ma sát · bỏ cuộc — mép Dùng thử</text>
      <text x="904" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">pixel-only · ngân sách bỏ-cuộc · cấm DOM</text>

      <!-- B1 -->
      <rect x="120" y="284" width="800" height="68" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="136" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">B1</text>
      <text x="200" y="314" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Quét chạy-được</text>
      <text x="200" y="332" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bắt: hỏng · gãy · mất dữ liệu — lớp Kiểm thử</text>
      <text x="904" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">DOM cho phép · network truth · throttle</text>

      <!-- Outer silhouette -->
      <rect x="120" y="80" width="800" height="272" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- LEGEND -->
      <line x1="30" y1="388" x2="970" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="400" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">bậc mới của nghi thức (S4 không phủ)</text>
      <rect x="400" y="400" width="12" height="12" rx="2" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="420" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">tầng của người — máy chỉ bàn giao, không phán</text>
    </svg>
  </div>
</body>
</html>
