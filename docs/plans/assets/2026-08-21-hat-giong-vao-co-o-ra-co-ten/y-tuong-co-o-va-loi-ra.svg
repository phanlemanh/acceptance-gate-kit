<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS -->
      <!-- ý tưởng → /start -->
      <line x1="152" y1="240" x2="192" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- /start → stub (accent: bắt buộc) -->
      <line x1="352" y1="240" x2="400" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="340" y="214" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="376" y="224" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BẮT BUỘC</text>
      <!-- stub → ba nhịp tim -->
      <line x1="496" y1="200" x2="496" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="506" y="160" width="92" height="14" rx="2" fill="#f5f5f5"/>
      <text x="508" y="170" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HIỆN MỖI PHIÊN</text>
      <!-- ba nhịp tim → người chọn -->
      <path d="M608,104 H672 Q680,104 680,112 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="612" y="82" width="60" height="14" rx="2" fill="#f5f5f5"/>
      <text x="642" y="92" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHẮC TUỔI</text>
      <!-- stub → người chọn -->
      <line x1="592" y1="240" x2="640" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="214" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="616" y="224" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 CHẠM</text>
      <!-- người chọn → build -->
      <line x1="720" y1="240" x2="792" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="732" y="214" width="48" height="14" rx="2" fill="#f5f5f5"/>
      <text x="756" y="224" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>
      <!-- người chọn → park -->
      <path d="M704,256 V332 Q704,340 712,340 H792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="732" y="314" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="752" y="324" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARK</text>
      <!-- người chọn → kill -->
      <path d="M692,268 V412 Q692,420 700,420 H792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="732" y="394" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="752" y="404" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KILL</text>
      <!-- đường cũ: ý tưởng → spec rời (dashed) -->
      <path d="M96,264 V376 Q96,384 104,384 H192" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="104" y="358" width="84" height="14" rx="2" fill="#f5f5f5"/>
      <text x="106" y="368" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NGOÀI /START</text>

      <!-- NODES -->
      <!-- N1 ý tưởng (start oval) -->
      <rect x="40" y="216" width="112" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="216" width="112" height="48" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="96" y="244" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ý tưởng nảy ra</text>

      <!-- N2 /start -->
      <rect x="192" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="208" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="230" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Một cửa vào</text>
      <text x="272" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/start · Vòng HIỂU</text>
      <text x="272" y="260" fill="#4f5d75" font-size="9" text-anchor="middle">brainstorm qua ổ cắm skill tuỳ chọn</text>

      <!-- N3 stub hồ sơ cơ hội (focal) -->
      <rect x="400" y="200" width="192" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="200" width="192" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="408" y="206" width="28" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="422" y="217" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Ô</text>
      <text x="496" y="238" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Hồ sơ cơ hội — stub</text>
      <text x="496" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_acceptance/&lt;slug&gt;/opportunity.md</text>
      <text x="496" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stage: discovery · tuổi: n ngày</text>

      <!-- N4 ba nhịp tim -->
      <rect x="384" y="72" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="72" width="224" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="496" y="94" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ba nhịp tim đọc ô</text>
      <text x="496" y="110" fill="#4f5d75" font-size="9" text-anchor="middle">/start mỗi phiên · bản đồ mỗi cổng · lưới mỗi PR</text>
      <text x="496" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">«Đang cân nhắc: n»</text>

      <!-- N5 người chọn lối (diamond) -->
      <polygon points="680,200 720,240 680,280 640,240" fill="#f5f5f5"/>
      <polygon points="680,200 720,240 680,280 640,240" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="238" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">Người</text>
      <text x="680" y="250" fill="#2d3142" font-size="9" font-weight="600" text-anchor="middle">chọn lối</text>

      <!-- N6 build → Vòng LÀM (step) -->
      <rect x="792" y="212" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="212" width="176" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="234" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mở Vòng LÀM</text>
      <text x="880" y="252" fill="#4f5d75" font-size="9" text-anchor="middle">spec chỉ sinh ở S1, không sớm hơn</text>

      <!-- N7 park (end oval) -->
      <rect x="792" y="312" width="176" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="792" y="312" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="334" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Xếp lại sau</text>
      <text x="880" y="352" fill="#4f5d75" font-size="9" text-anchor="middle">vẫn trên bản đồ · quay lại khi có tín hiệu</text>

      <!-- N8 kill (end oval) -->
      <rect x="792" y="392" width="176" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="792" y="392" width="176" height="56" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="414" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đã bác — chết có tên</text>
      <text x="880" y="432" fill="#4f5d75" font-size="9" text-anchor="middle">.out-of-scope/ · kèm «Prior requests»</text>

      <!-- N9 đường cũ (dashed) -->
      <rect x="192" y="352" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="352" width="240" height="64" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="312" y="374" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đường cũ: spec rời</text>
      <text x="312" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docs/…/specs/ · 171 file · ~75 mồ côi</text>
      <text x="312" y="404" fill="#4f5d75" font-size="9" text-anchor="middle">không người đọc định kỳ → quên → rác</text>

      <!-- LEGEND -->
      <line x1="40" y1="480" x2="968" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="120" y="490" width="24" height="14" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="152" y="500" fill="#4f5d75" font-size="9">ô có nhịp tim — vật duy nhất ba người đọc cùng thấy</text>
      <line x1="448" y1="496" x2="480" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="488" y="500" fill="#4f5d75" font-size="9">bước máy</text>
      <line x1="576" y1="496" x2="608" y2="496" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="616" y="500" fill="#4f5d75" font-size="9">đường cũ — không bị cấm, chỉ không còn là mặc định</text>
      <polygon points="880,488 888,496 880,504 872,496" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="896" y="500" fill="#4f5d75" font-size="9">quyết định người</text>
    </svg>