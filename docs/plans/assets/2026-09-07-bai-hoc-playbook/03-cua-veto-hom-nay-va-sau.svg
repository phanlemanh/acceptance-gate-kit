<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <line x1="320" y1="80" x2="320" y2="119" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="320" y1="176" x2="320" y2="219" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- KHÔNG: diamond bottom → để yên -->
      <line x1="320" y1="300" x2="320" y2="351" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="332" y="312" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="358" y="324" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <line x1="320" y1="408" x2="320" y2="467" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- CÓ: diamond right → hôm nay -->
      <line x1="376" y1="260" x2="615" y2="260" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="480" y="236" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="498" y="248" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <!-- the missing link: hôm nay → ghi -->
      <line x1="728" y1="296" x2="728" y2="351" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="740" y="312" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="766" y="324" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THIẾU</text>
      <!-- proposed → răng (dashed muted) → dừng -->
      <line x1="728" y1="408" x2="728" y2="467" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="728" y1="524" x2="728" y2="583" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- N1 start -->
      <rect x="220" y="40" width="200" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="220" y="40" width="200" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ máy-đi-trước tới cổng</text>

      <!-- N2 thẻ -->
      <rect x="208" y="120" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="120" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ in ô «veto hay để yên»</text>
      <text x="320" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trả lời dạng: «veto: nêu lý do»</text>

      <!-- N3 diamond -->
      <polygon points="320,220 376,260 320,300 264,260" fill="#f5f5f5"/>
      <polygon points="320,220 376,260 320,300 264,260" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người gõ</text>
      <text x="320" y="272" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«veto»?</text>

      <!-- N4 để yên -->
      <rect x="216" y="352" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="352" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Để yên — máy đi tiếp</text>
      <text x="320" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cửa veto vẫn mở, có vết giờ</text>

      <!-- N5 end merge -->
      <rect x="240" y="468" width="160" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="468" width="160" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp vào nhánh chính</text>

      <!-- N6 hôm nay: dead — FOCAL -->
      <rect x="616" y="224" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="224" width="224" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3"/>
      <text x="728" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hôm nay: không lệnh nào nhận</text>
      <text x="728" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lệnh ký chỉ biết «Ký» / «Trả lại»</text>
      <text x="728" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">người gõ xong, máy không có đường ghi</text>

      <!-- N7 sau khi nối (proposed) -->
      <rect x="616" y="352" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="352" width="224" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="728" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sau khi nối: máy ghi trạng thái veto</text>
      <text x="728" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ một dòng sổ quyết định, cùng lượt</text>

      <!-- N8 răng đã có -->
      <rect x="616" y="468" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="468" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lưới chặn gộp tới khi xử</text>
      <text x="728" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đã có sẵn, canh hai chiều</text>

      <!-- N9 end -->
      <rect x="648" y="584" width="160" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="648" y="584" width="160" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dừng, về làm lại phạm vi</text>

      <!-- legend -->
      <line x1="30" y1="644" x2="970" y2="644" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="30" y="664" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <line x1="120" y1="660" x2="152" y2="660" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="160" y="664" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đã có hôm nay</text>
      <line x1="280" y1="660" x2="312" y2="660" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="320" y="664" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">mắt xích chưa có — việc cần làm</text>
      <rect x="540" y="652" width="20" height="16" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="568" y="664" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bước đề nghị, chưa tồn tại</text>
    </svg>