<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- baseline -->
      <line x1="80" y1="240" x2="920" y2="240" stroke="rgba(79,93,117,0.45)" stroke-width="1"/>

      <!-- ticks = mốc phát hành -->
      <line x1="80" y1="232" x2="80" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="80" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.8.0 · 03/09</text>
      <line x1="240" y1="232" x2="240" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="240" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.9.0</text>
      <line x1="400" y1="232" x2="400" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="400" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.10.0</text>
      <line x1="560" y1="232" x2="560" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="560" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.11.0</text>
      <line x1="720" y1="232" x2="720" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="720" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.12.0</text>
      <line x1="880" y1="232" x2="880" y2="248" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="880" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.13.0</text>

      <!-- W1 · đang mở (below) -->
      <line x1="160" y1="240" x2="160" y2="296" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="160" cy="240" r="4" fill="#2d3142"/>
      <text x="160" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đang mở — không còn chỗ meta</text>
      <text x="160" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">#143–#151: ô ký · audit · MIT · 3 vòng sửa</text>
      <text x="160" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ phát hành 2.9.0 làn V</text>

      <!-- W2 · Đường lùi (above, milestone) -->
      <line x1="320" y1="184" x2="320" y2="240" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="320" cy="240" r="6" fill="#eb6c36"/>
      <text x="320" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đường lùi phải sống</text>
      <text x="320" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">veto + máy-thông có đường ghi</text>
      <text x="320" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">«không đo được» = vi phạm · ký xong chạy suite</text>

      <!-- W3 · Một vòng = một kết quả (below) -->
      <line x1="480" y1="240" x2="480" y2="296" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="480" cy="240" r="4" fill="#2d3142"/>
      <text x="480" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Một vòng = một kết quả</text>
      <text x="480" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đã ký build 04/09 · timebox 2 ngày</text>
      <text x="480" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">media-library chờ 5 vòng A–E</text>

      <!-- W4 · Thước theo đời model (above) -->
      <line x1="640" y1="184" x2="640" y2="240" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="640" cy="240" r="4" fill="#2d3142"/>
      <text x="640" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thước sống theo đời model</text>
      <text x="640" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ghi model lên bằng chứng · cờ nhạt</text>
      <text x="640" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đổi schema → đi theo mốc</text>

      <!-- W5 · Nhà ý định (below) -->
      <line x1="800" y1="240" x2="800" y2="296" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="800" cy="240" r="4" fill="#2d3142"/>
      <text x="800" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhà ý định + lệnh ký Cổng Đáng</text>
      <text x="800" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lát A + B · thước nguyên tố 1</text>
      <text x="800" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vào bằng bài học cong-dang-co-cua</text>

      <!-- sau đó (above, right) -->
      <text x="900" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Theo ngưỡng đếm</text>
      <text x="900" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">luật lái máy hồi quy · băng sau phát hành</text>
      <text x="900" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">bất biến sản phẩm</text>

      <!-- axis unit -->
      <text x="500" y="376" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CỬA SỔ PHÁT HÀNH · MỖI CỬA SỔ MỘT VÒNG META · THỨ TỰ, KHÔNG PHẢI LỊCH</text>

      <!-- legend -->
      <line x1="30" y1="404" x2="970" y2="404" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="30" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <circle cx="124" cy="420" r="6" fill="#eb6c36"/>
      <text x="136" y="424" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">làm trước — trả nợ nhát cắt gọi tên của 2.8.0</text>
      <circle cx="444" cy="420" r="4" fill="#2d3142"/>
      <text x="456" y="424" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">một ô / một cửa sổ</text>
      <line x1="620" y1="412" x2="620" y2="428" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="632" y="424" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">mốc phát hành (làn V, ≤1 lượt người)</text>
    </svg>