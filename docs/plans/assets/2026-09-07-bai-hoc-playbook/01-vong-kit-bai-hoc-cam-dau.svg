<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#636b80"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ring flow: 6 circular arcs, clockwise, R=240, C=(520,340) -->
      <path d="M 600.000 113.726 A 240 240 0 0 1 704.969 187.073" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 743.285 252.000 A 240 240 0 0 1 743.722 426.882" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 705.731 492.000 A 240 240 0 0 1 601.130 565.871" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 440.000 566.274 A 240 240 0 0 1 335.031 492.927" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 296.715 428.000 A 240 240 0 0 1 296.278 253.118" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 334.269 188.000 A 240 240 0 0 1 438.870 114.129" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- write-back spokes: dashed, inward, stop 6px before hub -->
      <path d="M 520.000 132.000 L 520.000 282.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <path d="M 672.574 252.000 L 615.263 285.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <path d="M 672.574 428.000 L 615.263 395.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <path d="M 520.000 548.000 L 520.000 398.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <path d="M 367.426 428.000 L 424.737 395.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <path d="M 367.426 252.000 L 424.737 285.000" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- spoke labels: BÀI n — mask + 6–10px clear of stroke -->
      <rect x="532" y="464" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="554" y="476" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BÀI 1</text>
      <rect x="340" y="388" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="400" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BÀI 3</text>
      <rect x="340" y="276" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="288" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BÀI 2</text>

      <!-- station 0 · Cổng Đáng (top) -->
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="68" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Đáng</text>
      <text x="520" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ý định → ô cơ hội</text>

      <!-- station 1 · Cổng Phạm vi (upper right) -->
      <rect x="648" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="188" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Phạm vi</text>
      <text x="728" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hợp đồng + thước</text>

      <!-- station 2 · Thi công (lower right) -->
      <rect x="648" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="428" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thi công</text>
      <text x="728" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">code, tự kiểm từng việc</text>

      <!-- station 3 · Chấm bằng chứng (bottom) -->
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="548" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chấm bằng chứng</text>
      <text x="520" y="594" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eval máy + hội đồng</text>

      <!-- station 4 · Cổng Bằng chứng (lower left) — FOCAL -->
      <rect x="232" y="428" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="428" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="312" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Bằng chứng</text>
      <text x="312" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ký · veto · hay máy đi tiếp</text>

      <!-- station 5 · Gộp & phát hành (upper left) -->
      <rect x="232" y="188" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="188" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp &amp; phát hành</text>
      <text x="312" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge → cài lên repo</text>

      <!-- hub -->
      <rect x="420" y="288" width="200" height="104" rx="8" fill="#2d3142"/>
      <text x="520" y="332" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ của tính năng</text>
      <text x="520" y="352" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">một trục · máy ghi · người đọc</text>

      <!-- legend -->
      <line x1="30" y1="676" x2="1010" y2="676" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="30" y="696" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <line x1="120" y1="692" x2="152" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="696" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">vòng chạy</text>
      <line x1="260" y1="692" x2="292" y2="692" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="300" y="696" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">ghi về hồ sơ</text>
      <rect x="420" y="684" width="20" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="448" y="696" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">cổng mà bài học 3 cắm vào</text>
      <text x="640" y="696" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BÀI 1</text>
      <text x="680" y="696" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">thước sống theo đời model</text>
      <text x="640" y="716" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BÀI 2</text>
      <text x="680" y="716" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">luật lái máy phải được kiểm hồi quy</text>
      <text x="640" y="736" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BÀI 3</text>
      <text x="680" y="736" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đường lùi phải là đường được tập nhiều nhất</text>
    </svg>