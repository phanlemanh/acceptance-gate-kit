      KHÔNG xuất hiện trong bảng phủ · đợt chỉ có mốc ngoài → không «chưa cắt». Và "PASS: LT-163-do" —
      bản sao răng bỏ kiểm `loai` của mốc mang `phu`: CHÍNH hàm đo trả lỗi nêu ca «loai-han».
