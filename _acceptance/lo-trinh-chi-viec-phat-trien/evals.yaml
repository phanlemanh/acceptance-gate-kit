  - id: E9
    criterion: AC-9
    executor: judgment
    inputs:
      - skills/cat-luot/SKILL.md
      - skills/acceptance/references/lo-trinh-template.json
      - _acceptance/lo-trinh-chi-viec-phat-trien/mau/pham-vi-crm.md
      - _acceptance/lo-trinh-chi-viec-phat-trien/mau/lo-trinh-dap-an.json
    question: >
      Chỉ dùng bốn tệp trong inputs. `lo-trinh-dap-an.json` là cách cắt ĐÚNG bản phạm vi mẫu
      `pham-vi-crm.md` (theo phân loại thật của kho CRM). Câu hỏi không phải đáp án có đúng không, mà
      SKILL cắt lượt có DẪN một phiên cắt tới đáp án ấy không. (A) Với TỪNG mã K1…K11: nêu chỗ của mã
      trong đáp án (hàng · chân trời · mốc ngoài, kèm du_lieu · dung_tren · lap · tu_phuc_vu · mo_lai_khi
      · ai · dot nếu có) và trích bước hoặc khối của SKILL buộc phiên cắt đặt mã ấy đúng chỗ đó. Mã FAIL
      khi SKILL im lặng, nước đôi (hai chỗ đều hợp luật) hoặc dẫn tới chỗ khác; mỗi hàng sinh dữ liệu
      giả và mỗi đích `tu_phuc_vu` của đáp án cũng phải được SKILL dẫn tới (phiên cắt biết phải TẠO
      chúng). (B) Một kho tiêu thụ chạy đồng hồ cỡ và thấy số của mình nói khác khoảng cỡ trong SKILL —
      theo SKILL, phiên cắt làm gì? Đạt khi: không sửa khối khoảng ở kho tiêu thụ, dán số đo của đồng hồ
      cỡ vào mô tả PR cắt, báo chủ kit. (C) Răng in hai dòng: `cảnh báo: hàng R2 [duoi-muc-tieu]: dự kiến
      4 tiêu chí, dưới mục tiêu 8–10 — gộp được với R3 (tổng 9)` và `cảnh báo: [chua-uoc-tieu-chi] 12
      hàng ngoài đợt crm-0410 — 1, 2, 3, …` — theo SKILL, phiên cắt làm gì với từng dòng? Đạt khi: dòng
      đầu là của đợt — gộp, hoặc ghi lý do giữ trong mô tả PR; dòng sau ngoài đợt — chép vào PR, không
      sửa. Với mỗi vế trích chữ SKILL. PASS chỉ khi mọi mã của (A), (B) và (C) đều đạt.
    evidence_required: [run_id, verdict, proposals]
