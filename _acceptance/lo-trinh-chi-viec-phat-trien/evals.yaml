schema_version: 1
feature_slug: lo-trinh-chi-viec-phat-trien
# Ca đo sống ở tests/scripts/lo-trinh.test.mjs (LT-163..LT-170), executor `executors.test.lo_trinh` sẵn
# có. Kho thử do code sinh trong lượt (git init thư mục tạm, hàm `khoCL`). Bản phạm vi thử sinh bằng hàm
# ghi `vietPV` (khuôn dòng rút từ khối PHAM-VI-MA của khuôn). Bản chụp crm dùng nguyên tệp fixture có
# sẵn; ca dựng đợt mới TỪ tệp đó bằng code, không chép tay lộ trình. Mỗi ca đỏ chạy CHÍNH hàm đo trên
# bản sao gói bị tiêm, SAU khi bản lành xanh trên cùng kho, và ghim thông điệp rút từ đầu ra của hàm đo.
# Răng «gốc» = `git archive 9b11cc66 scripts lib skills` (nhánh chính lúc mở vòng, đã có S3).
# Mỗi eval ghim đúng dòng "PASS: LT-…".
