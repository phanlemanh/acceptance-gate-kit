      - "tests/scripts/repin-lane-tran.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.gg_ac7
    expected: >-
      Bốn kết cục (xanh · đỏ · vượt trần · bị ngắt). Xanh: dòng stderr cuối bắt đầu "[lane] TỔNG KẾT"
      nêu kết cục, phút, số lệnh, "eval model thật: gọi n, carry m", "chập chờn: k"; khoá tong_ket
      cùng số ở JSON stdout và ở dòng repin / repin-do. Đo bằng QUAN HỆ: hai eval model thật mỗi lần
