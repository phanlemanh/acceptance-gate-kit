      eval đó và "chi phí đo" BẰNG n; lệnh đo chi phí thoát 1 / không in số → "chi phí đo: lỗi (…)" và
      kết cục làn không đổi. Chiều đỏ: đếm n theo eval thay vì theo lần chạy thật → ghim "đếm model
      sai"; bỏ tổng kết ở làn đỏ → "tổng kết vắng ở làn đỏ".
    paths:
