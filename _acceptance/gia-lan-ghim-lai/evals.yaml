    executor: script
    cmd: config:executors.script.gg_ac8
    expected: >-
      Fixture: env tiến trình K=x, tệp .env K=tu-file, suite `node --env-file=.env -e` thoát 0 khi K
      có chữ, 1 khi rỗng; một eval có lệnh trùng nguyên văn suite. Xanh: khoá [K] → làn ĐỎ, dòng stderr
      của làn và lenh_do gọi "môi trường giống CI (biến rỗng: K)", eval cùng lệnh vẫn chạy riêng với env đầy
      đủ (xanh, dấu vết hai lần chạy); suite xanh ở env CI → dòng repin suites_env "ci" + hậu tố
      section; chập chờn ở env CI → chạy lại cùng env; tên biến "1BAD" → thoát 2. Đối chứng: khoá
      vắng → suite xanh. Chiều đỏ: xoá biến thay vì đặt rỗng → suite xanh, ghim "xoá biến thay vì
      rỗng"; áp env CI cho eval → "env CI tràn sang eval"; gộp lệnh khác env → "gộp lệnh khác env".
    paths:
