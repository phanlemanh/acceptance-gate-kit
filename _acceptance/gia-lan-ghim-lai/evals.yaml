# Eval cho hồ sơ gia-lan-ghim-lai (Vòng A).
#
# Mỗi eval gọi `rang/chan.mjs --ac <n>`, làm HAI việc trên CÙNG fixture code-sinh:
#   (1) chiều xanh — chạy các ca BỀN của AC đó trong tests/scripts/*.test.mjs (ca sống vĩnh viễn
#       trong suite scripts, tên ca bắt đầu bằng mã AC; chọn ca bằng biến GG_CASES) trên CÂY ĐANG
#       KIỂM; đòi ĐÚNG danh sách ca viết trước trong rang/ma-tran.mjs đều PASS — rút rỗng hoặc
#       đếm lệch là ĐỎ «số ô lệch»;
#   (2) chiều đỏ — dựng bản sao bằng `git archive SAU-GIA` (commit lõi mới nhất của vòng, xem
#       contract — cố định sau khi gộp), tiêm MỘT phép phá vào làn của bản sao, chạy đúng ca ấy
#       trong bản sao; chỉ tính «đã bắt» khi CÓ dấu dương bản sao đã chạy tới ca (dòng tên ca in
#       ra) VÀ ca FAIL với thông điệp ghim; phép phá không áp được là ĐỎ «phép phá không áp được».
# Đường dẫn suy từ vị trí chan.mjs, không hardcode ROOT.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.gg_ac1
    expected: >-
      Lệnh fixture chập chờn bằng bộ đếm NGOÀI kho (đỏ lần 1, xanh lần 2). Xanh: suite chập chờn và
      eval chập chờn → làn xanh, chap_chon đủ năm trường, log trỏ tệp tồn tại, ca rút đúng tên theo
      năm khuôn (bun · vitest/jest · playwright · node:test · rỗng → "không rút được tên ca"), section
      có hậu tố chập chờn; đỏ cả hai lần → làn đỏ, hai nhật ký, lenh_do mang lan_thu_lai; eval trong
      model_evals → chạy đúng MỘT lần; khoá vắng → chạy đúng MỘT lần; suite song song bật → lần chạy
      lại bắt đầu sau khi mọi suite song song xong (dấu thời gian ngoài kho); bảng chân trị của hàm
      quyết định đúng từng hàng; repin_retry: 2 → thoát 2 gọi tên khoá. Chiều đỏ: lần hai đỏ vẫn tính
      đạt → ghim "lần hai đỏ vẫn tính đạt"; chạy lại eval model → "chạy lại eval model thật"; bỏ
      chap_chon → "chập chờn im"; chạy lại xen trong khối song song → "chạy lại dưới tải".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/scripts/lib/**"
      - "tests/scripts/repin-lane-chay-lai.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.gg_ac2
    expected: >-
      Bảy ô B1–B7. Lệnh fixture ghi pid cháu ra tệp NGOÀI kho ngay khi sinh — tệp pid vắng lúc làn
      thoát là ĐỎ "cháu chưa kịp sinh" (dấu dương), không phải xanh; trần của ca đặt rộng so với thời
      gian khởi động làn. Xanh: B1 cháu thường → thoát 4 trong N + 15 s, pid cháu đã chết, không dòng
      repin, verified_commit và báo cáo giữ nguyên; B2 cháu bẫy SIGTERM → đã chết trong N + 10 + 15 s;
      B3 làn lồng hai tầng → sau khi làn ngoài thoát 4, mọi pid đã ghi ở hai tầng đều chết; B4 --write
      → mỗi slug một dòng repin-do ly_do vuot-tran có tran_phut, da_chay_phut, chua_chay; B5 khoá
      repin_budget_min cho cùng kết quả, cờ thắng khoá; B6 trần vắng → lệnh dài chạy hết xanh; B7
      --tran-phut 0 / chữ → thoát 3, khoá sai → thoát 2. Chiều đỏ: chỉ giết pid bash → B1 cháu sống
      "cháu tiến trình sót"; bỏ SIGKILL → B2 cháu sống "không SIGKILL"; chỉ giết theo nhóm → B3 cháu
      tầng trong sống "làn lồng sót cháu"; thoát 1 → "trùng mã làn đỏ"; ghi pin khi vượt trần → "pin
      trên làn chưa xong".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/scripts/lib/**"
      - "tests/scripts/repin-lane-tran.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.gg_ac3
    expected: >-
      Ba ô SIGTERM · SIGINT · SIGHUP gửi vào làn SAU khi tệp pid cháu đã có (dấu dương). Xanh: mã
      thoát 143 · 130 · 129, pid cháu đã chết, với --write một dòng repin-do ly_do bi-ngat mang
      tin_hieu đúng tên và chua_chay; không --write → git status không có tệp theo dõi nào đổi.
      Chiều đỏ: bản sao bỏ bộ bắt tín hiệu → không có dòng bi-ngat, ghim "ngắt không để vết".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/scripts/lib/**"
      - "tests/scripts/repin-lane-tran.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.gg_ac4
    expected: >-
      Bốn kết cục (xanh · đỏ · vượt trần · bị ngắt). Xanh: dòng stderr cuối bắt đầu "[lane] TỔNG KẾT"
      nêu kết cục, phút, số lệnh, "eval model thật: gọi n", "chập chờn: k"; khoá tong_ket cùng số ở
      JSON stdout và ở dòng repin / repin-do. Đo bằng QUAN HỆ: hai eval model thật mỗi lần chạy cộng 1
      vào bộ đếm chi tiêu ngoài kho mà repin_cost_cmd đọc → n BẰNG số lần thực chạy các eval đó và
      "chi phí đo" BẰNG n; lệnh đo chi phí thoát 1 / không in số → "chi phí đo: lỗi (…)" và kết cục làn
      không đổi. Chiều đỏ: đếm n theo eval thay vì theo lần chạy thật → ghim "đếm model sai"; bỏ tổng
      kết ở làn đỏ → "tổng kết vắng ở làn đỏ".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/scripts/lib/**"
      - "tests/scripts/repin-lane-tran.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.gg_ac5
    expected: >-
      Fixture: env tiến trình K=x, tệp .env K=tu-file, suite `node --env-file=.env -e` thoát 0 khi K
      có chữ, 1 khi rỗng; một eval có lệnh trùng nguyên văn suite. Xanh: khoá [K] → làn ĐỎ, dòng stderr
      của làn và lenh_do gọi "môi trường giống CI (biến rỗng: K)", eval cùng lệnh vẫn chạy riêng với
      env đầy đủ (xanh, dấu vết hai lần chạy); suite xanh ở env CI → dòng repin suites_env "ci" + hậu
      tố section; chập chờn ở env CI → chạy lại cùng env; tên biến "1BAD" → thoát 2. Đối chứng: khoá
      vắng → suite xanh. Chiều đỏ: xoá biến thay vì đặt rỗng → suite xanh, ghim "xoá biến thay vì
      rỗng"; áp env CI cho eval → "env CI tràn sang eval"; gộp lệnh khác env → "gộp lệnh khác env".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/scripts/lib/**"
      - "tests/scripts/repin-lane-env-ci.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.gg_ac6
    expected: >-
      Round-trip rút từ writer THẬT trên fixture bật mọi khoá: tập khoá của dòng repin và repin-do mà
      writer ghi ⊆ khoá của khuôn REPIN-TEMPLATE trong feature-loop SKILL, thứ tự tương đối giữ nguyên;
      đoạn nghi thức re-pin của SKILL nêu "4" là mã vượt trần và cả hai ly_do vuot-tran, bi-ngat;
      danh sách khoá config rút từ khối marker LAN-KHOA trong repin-lane.mjs (rút rỗng → ĐỎ "rút
      rỗng"), mỗi khoá có một dòng trong GUIDE §7.1. Chiều đỏ: bản sao writer thêm khoá ngoài khuôn →
      ghim "khoá ngoài khuôn"; bản sao GUIDE bỏ một khoá → "khoá chưa khai ở GUIDE".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "feature-loop/skills/feature-loop/SKILL.md"
      - "GUIDE.md"
      - "tests/scripts/repin-lane-khuon-gia.test.mjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.gg_ac7
    expected: >-
      Đường đọc-cũ, đo bằng VI PHÂN từng byte giữa làn của hai bản archive CỐ ĐỊNH — BASE-GIA (bf79fdb1)
      và SAU-GIA (commit lõi mới nhất mang dấu (gia-lan-ghim-lai) chạm feature-loop/scripts) — cùng bộ máy
      acceptance-gate tại BASE-GIA, sau khi chuẩn hoá run_id, ts, wall_s, số giây trong dòng stderr của
      làn, và gỡ ĐÚNG các phần thêm đã kê (dòng stderr cuối "[lane] TỔNG KẾT", khoá tong_ket ở JSON
      stdout và dòng repin/repin-do, dòng repin-do bi-ngat). Trên fixture AC-1…AC-5 đã gỡ khoá: stdout,
      mã thoát, dòng run-log và section Re-pin (--skip-unchanged, --write xanh, --write đỏ, SIGTERM giữa
      lệnh) BẰNG HỆT. recheck-evidence của BASE-GIA đọc dòng repin có tong_ket → thoát 0. Không tìm được
      SAU-GIA → ĐỎ "không tìm thấy commit lõi". Chiều đỏ: mỗi bản sao đổi mặc định MỘT khoá → "đổi mặc
      định: <khoá>"; bản sao thêm dòng hay khoá ngoài danh sách đã kê → "thêm ngoài danh sách".
    paths:
      - "feature-loop/scripts/**"
      - "scripts/recheck-evidence.cjs"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.gg_ac8
    expected: >-
      rang/so-do.mjs dựng lại hai kịch bản thật của R1g và lỗi chỉ-CI trên fixture, mỗi hàng chạy trước
      (khoá vắng / bản BASE-GIA) rồi sau trên CÙNG cây, in bảng ba hàng và thoát 0: Đ4 ca chập chờn
      trong suite — làn đỏ → xanh, tên ca có trong báo cáo · Đ5 làn bị SIGTERM giữa lệnh có cháu — dòng
      dấu 0 → 1, tiến trình sót 1 → 0 · Đ3 ca chỉ đỏ khi khoá rỗng — lỗi bắt được 0 → 1. Chiều đỏ: bản
      sao SAU-GIA tắt MỘT điểm → hàng đó không đổi, thoát 1, ghim "Đx không đổi số" với đúng mã điểm.
    paths:
      - "feature-loop/scripts/**"
      - "tests/scripts/gia-lan-fixture.mjs"
      - "_acceptance/gia-lan-ghim-lai/rang/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
