<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" role="img" aria-labelledby="f2-title f2-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="f2-title">Một bộ đọc cho mỗi vật, mọi bên đọc cùng rút qua đó</title>
        <desc id="f2-desc">Sơ đồ luồng ngang bốn tầng. Làn trên: vật review-findings.md đi qua bộ đọc lib/out-of-contract.cjs tới vị từ dùng chung trong lib/evidence-core.cjs, rồi tới hai bản dựng khong-can-nguoi.mjs và pre-merge-check.sh; ba đoạn từ bộ đọc trở đi vẽ nét đứt vì hôm nay chưa có. Làn dưới: vật là mục tiêu chí của contract.md, đi qua bộ đọc lib/ac-line.cjs với lối vào parseACBlock, rồi toả tới bốn bên đọc: pre-merge-check.sh nhánh node, gate-card.js, eval-coverage-lint.js và evidence-page.js. Ghi chú bên dưới nêu hai ca fail-CLOSED khi thiếu tệp bộ đọc hoặc thiếu node.</desc>

