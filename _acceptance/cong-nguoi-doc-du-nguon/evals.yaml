# Eval cho hồ sơ cong-nguoi-doc-du-nguon.
#
# Ca sống VĨNH VIỄN ở tests/scripts/cong-nguoi-doc-du-nguon.test.mjs — suite `scripts`
# tự chạy mọi *.test.mjs qua glob, nên đây là lưới thường trực cho lớp «cổng người đọc
# thiếu nguồn». Luật đo của tệp ca, áp cho MỌI ca:
#
#  - Fixture do CODE SINH trong chính lượt chạy (kho git tạm + hồ sơ tạm). Không hợp đồng
#    thật nào của kho bị đọc làm fixture — hồ sơ đã ký là sử liệu, và một fixture viết tay
#    đúng khuôn bên đọc là đúng hình dạng lỗi (2) của luật «thước phải gắn vào vật».
#  - Mỗi ca CHẠY HAI CHIỀU trên CÙNG fixture: vật lành → phép phán xanh (đối chứng dương,
#    chạy TRƯỚC); rồi hoàn nguyên ĐÚNG MỘT đường của bản vá trên một BẢN SAO → phép phán
#    phải ĐỎ với ĐÚNG thông điệp ghim. Mũi tiêm phải khớp đúng một lần, bản sao phải khác
#    gốc, và bản sao `.cjs`/`.mjs` phải qua `node --check`; không thì ca đỏ có tên.
#  - Mỗi ca in ĐÚNG MỘT dòng `PASS: CNxx …` / `FAIL: CNxx … (DO: …)`; chi tiết in bằng
#    tiền tố `    · `. Bộ chọn `CNDN_CASES` khớp 0 ca → thoát khác 0 in "CNDN_CASES khop 0 ca".
#  - Mọi đường dẫn suy từ vị trí tệp ca, không hằng nào trỏ checkout của tác giả.

evals:
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cndn_ac_tieu_de
    expected: >-
      Ca CN07, ma trận 12 hình dạng khai báo, mỗi hình dạng một khẳng định phân biệt được,
      ba trong số đó lấy NGUYÊN VĂN từ hợp đồng thật (crm `auto-pr-thoi-do-o-ban-re`,
      artifact-platform `customer-segment-foundation`, kit `release-2-11-0`) — chép chuỗi
      vào fixture, KHÔNG đọc tệp thật lúc chạy. Phủ: `### AC-n — nhãn` thân nhiều dòng ·
      thân một dòng · `### AC-n (judgment)` · tag `(cross-layer)` ở nhãn · tag ở thân ·
      tag trong code span (KHÔNG tính) · `## AC-n` cấp h2 · tiêu đề có `**` · tiêu đề rồi
      tiêu đề kế cắt thân · tiêu chí gạch đầu dòng lẫn tiêu đề trong cùng tệp · dòng THAM
      CHIẾU CHÉO trong thân (không sinh id mới) · tiêu chí thân rỗng (KHÔNG tính là tiêu
      chí). Mỗi ô ghim id, chữ phải có trong `gwt`, và cặp (judgment, crossLayer). Đối
      chứng dương: cả 12 ô đạt trên cây thật. Chiều đỏ: 3 mũi tiêm độc lập trên bản sao
      ac-line (bỏ nhánh tiêu đề · bỏ nối thân · đọc tag trong code span) — mỗi mũi phải làm
      ĐỎ đúng tập ô của nó, mũi nào để cả 12 ô xanh → ca ĐỎ.
    paths:
      - "lib/ac-line.cjs"
      - "tests/scripts/cong-nguoi-doc-du-nguon.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.cndn_tieu_de_muc
    expected: >-
      Ca CN08. Cùng một thân hợp đồng, đặt dưới bốn tiêu đề mục: `## Criteria` ·
      `## Acceptance Criteria` · `## Acceptance criteria` · KHÔNG mục nào. Ba ô đầu phải
      trả CÙNG một tập id và cùng `gwt` (so BẰNG trọn chuỗi, không so độ dài); ô thứ tư
      quét cả tệp và vẫn ra đủ id. Đối chứng dương là ô `## Criteria`, chạy TRƯỚC. Chiều
      đỏ: bản sao thu tiêu đề về đúng `Criteria` → ba ô sau lệch ô đầu → ca ĐỎ, thông điệp
      ghim "tieu de muc chua nhan het".
    paths:
      - "lib/ac-line.cjs"
      - "lib/md-section.cjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.cndn_bo_do_khong_im
    expected: >-
      Ca CN09, ba ô: hợp đồng khai bằng tiêu đề mà bộ bóc bị tiêm cho bỏ sót 2/6 → bộ dò
      trả kind `short`, văn bản nêu số 2 và liệt số dòng · bỏ sót 6/6 → kind `blank` ·
      hợp đồng LÀNH (bóc đủ) → bộ dò trả null, KHÔNG kêu oan (đối chứng dương, chạy TRƯỚC,
      và đây là vế chống cry-wolf). Chiều đỏ: bản sao giữ `AC_SUSPECT` cũ (không nhận dòng
      tiêu đề) → hai ô đầu hoá null → ca ĐỎ, thông điệp ghim "bo do van im truoc dang
      tieu de".
    paths:
      - "lib/ac-line.cjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.cndn_the_cong_2
    expected: >-
      Ca CN10. Fixture hồ sơ verified + review-findings có 2 mục «Trong hợp đồng» và 1 mục
      «Ngoài hợp đồng». Render `scripts/gate-card.js <slug>`: HTML có khối «Trong hợp đồng»
      nêu đúng số 2, vị trí khối đó đứng TRƯỚC khối «Ngoài hợp đồng» (so chỉ số chuỗi), và
      HTML không chứa phát ngôn khẳng định bằng chứng đầy đủ. Đối chứng dương TRƯỚC: cùng
      hồ sơ với mục «Trong hợp đồng» RỖNG → không có khối đó, và phát ngôn đầy-đủ xuất hiện
      như hành vi hiện có. Chiều đỏ: bản sao gate-card bỏ khối mới → ca ĐỎ, thông điệp ghim
      "the giau loi trong hop dong".
    paths:
      - "scripts/gate-card.js"
      - "lib/out-of-contract.cjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.cndn_bon_ben_goi
    expected: >-
      Ca CN13, đo QUAN HỆ «mọi bên gọi thấy cùng một số». Fixture do code sinh: MỘT hợp đồng
      khai 9 tiêu chí bằng tiêu đề (kèm evals.yaml và báo cáo tối thiểu để bốn bên chạy
      được). Bốn bên đọc, mỗi bên rút ra một SỐ tiêu chí nhìn thấy: `scripts/gate-card.js`
      (đếm từ `--extract`) · `scripts/evidence-page.js` (đếm hàng tiêu chí trong HTML) ·
      `scripts/eval-coverage-lint.js` (đếm qua W7 hoặc số AC nó lint) · nhánh node của răng
      cross-layer trong `scripts/pre-merge-check.sh` (đếm id nó rút được). Cả bốn phải bằng
      9. Đối chứng dương TRƯỚC: CÙNG nội dung viết dạng gạch đầu dòng → cả bốn cũng bằng 9,
      tức phép đo phân biệt được HÌNH DẠNG KHAI chứ không phải phân biệt bốn bên.
      Chiều đỏ BỐN mũi tiêm độc lập, mỗi mũi hoàn nguyên ĐÚNG MỘT bên gọi về `parseAC` từng
      dòng: mũi nào cũng phải làm ĐÚNG bên đó ra số khác 9 trong khi ba bên kia vẫn 9. Mũi
      không làm đỏ được bên của nó → ca ĐỎ, thông điệp ghim "ben goi <tên> khong doi theo
      ban vá" — đây chính là vế chống «sửa ba bên quên bên thứ tư».
    paths:
      - "lib/ac-line.cjs"
      - "scripts/gate-card.js"
      - "scripts/evidence-page.js"
      - "scripts/eval-coverage-lint.js"
      - "scripts/pre-merge-check.sh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E14
    criterion: AC-14
    executor: script
    cmd: config:executors.script.cndn_round_trip_writer
    expected: >-
      Ca CN14, round-trip rút-từ-writer-đọc-bằng-reader. Trong CHÍNH lượt chạy: rút khuôn
      một mục của `review-findings.md` từ chỗ có marker mà bên VIẾT dùng — prompt soạn
      trong `feature-loop/workflows/acceptance-verify.js` — KHÔNG chép khuôn vào tệp ca.
      Marker vắng hoặc rút ra rỗng → ca ĐỎ có tên, không xanh lặng (đây là chân chống
      «khuôn trôi khỏi bên viết mà ca vẫn xanh»). Sinh fixture từ khuôn vừa rút: 3 mục dưới
      `## Ngoài hợp đồng` và 2 mục dưới `## Trong hợp đồng`. Đếm bằng `lib/out-of-contract.cjs`:
      phải ra đúng 3 và 2. Đối chứng dương là chính phép đếm đó trên khuôn thật.
      Chiều đỏ hai mũi: (a) đổi khuôn trong bản sao prompt của bên viết (ví dụ mục mở bằng
      `### ` thay vì `- **`) mà bộ đọc vẫn ra 3 và 2 → ca ĐỎ, ghim "ben doc khong theo ben
      viet"; (b) hoàn nguyên bộ đọc để bỏ mục `Trong hợp đồng` → số thứ hai khác 2.
    paths:
      - "lib/out-of-contract.cjs"
      - "feature-loop/workflows/acceptance-verify.js"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E18
    criterion: AC-15
    executor: script
    cmd: config:executors.script.cndn_coverage_bang
    expected: >-
      Ca CN15; stdout có đúng một dòng kết quả, mang "CN15". Đối chứng dương TRƯỚC, trên
      cây đang đo: hợp đồng có Coverage dạng GẠCH ĐẦU DÒNG → --extract trả
      coverage_missing = false và mảng coverage khác rỗng. Rồi hai ô thật: (1) Coverage
      dạng BẢNG → coverage_missing phải là false và mảng coverage phải chứa chữ của ít
      nhất một hàng bảng; (2) VẮNG HẲN mục Coverage → coverage_missing vẫn true và cờ
      vàng vẫn còn nguyên văn "chưa có section Coverage" trong HTML (đường cũ không bị
      nới theo). Chiều đỏ trên BẢN SAO gate-card.js hoàn nguyên bộ đọc Coverage về
      bullets-only (mũi tiêm khớp đúng một lần, bản sao qua node --check): ô (1) phải ĐỎ
      với thông điệp ghim "coverage_missing=true tren muc BANG"; ô (2) vẫn xanh, tức mũi
      tiêm không giết cả hai ô — nếu cả hai cùng đỏ thì phép đo không phân biệt được
      hình dạng, ca ĐỎ có tên.
    paths:
      - "scripts/gate-card.js"
      - "tests/scripts/cong-nguoi-doc-du-nguon.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
