  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.cndn_bon_ben_goi
    expected: >-
      Ca CN13, đo QUAN HỆ «mọi bên gọi thấy cùng một số». Fixture do code sinh: MỘT hợp đồng
