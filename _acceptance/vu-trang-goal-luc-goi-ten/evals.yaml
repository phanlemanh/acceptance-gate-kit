# evals — vu-trang-goal-luc-goi-ten
# Fixture code-sinh, khuôn rút qua marker, đối chứng dương + đột biến trong chính ca.
# Trục B (AC-4..AC-6) đo VĂN CHỈ DẪN — khai thẳng là đo chỉ dẫn, đầu ra đo ở ba dòng số mốc 2.8.0.
# AC-7 KHÔNG có eval: run-log chỉ tồn tại sau khi Workflow S4 append → eval trước đó là fail-open
# (gap-probe vòng 2). Đo bằng script run-log-minted.mjs chạy lúc trình Cổng 2, đầu ra dán vào gói.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      P85 nới ba bản: «PASS: P85 GOAL-TEMPLATE …» và ba dòng vế «P85 VE: <file> khop (6 dong)» — so sau strip,
      nghĩa P85 hiện hành; đột biến trong chính ca đổi một ký tự lần lượt ở SKILL / GUIDE / gate-card.js →
      mỗi lần đỏ ghim đích danh bản lệch với hai bản còn lại.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts
    expected: >
      Ca «GL01 goal_line == khuon rut qua marker (moi <slug> thay, mot dong, 0 <slug> sot)» PASS; test rút
      khuôn từ marker GOAL-TEMPLATE của gate-card.js, thay <slug> bằng phép thay độc lập, không gõ literal.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    expected: >
      Ca «GL02 .mach.goal <b> == goal_line (dang thuc, ngay sau .mach)», «GL03 the do van in goal_line» và
      «GL04 Cong 2 KHONG co goal_line lan .mach.goal» PASS; đột biến nối đuôi vào dòng HTML → GL02 đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    expected: "Ca P-mới «S1 moi cau xin duyet thiet ke kem GOAL-TEMPLATE · S1#5 khong phai cong · S1#7 gap-probe dong bo · Gate 1 giu buoc in · S2#3 GATE 1.5 kem /goal» PASS (grep neo chữ, đo chỉ dẫn)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.plugins
    expected: "Ca P-mới «GUIDE /goal: ba thoi diem + lan V T2 khong cham UI + brainstorm khong hoi → chua phu; 0 cau ‹hai ban› con sot o SKILL/GUIDE/P85» PASS; P85 các vế khuôn không đổi vẫn PASS."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    expected: "Ca P-mới «bat bien dung goi ten ca tien-trinh-nen-bao-xong» PASS (grep neo chữ)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-1
    executor: test
    cmd: config:executors.test.hooks
    expected: "suite hooks XANH (không chạm hook — đối chứng không hồi quy)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8
    criterion: AC-1
    executor: test
    cmd: config:executors.test.workflows
    expected: "suite workflows XANH (không chạm workflow — đối chứng không hồi quy)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
