<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cơ chế luật sản phẩm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình · bat-bien-san-pham · co-che</p>
    <h1>Luật sản phẩm đi hai làn, hội về hai thẻ cổng có sẵn</h1>

    <svg viewBox="0 0 1200 584" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa0ad"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane labels + separator -->
      <text x="64" y="44" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀN 1 · BƯỚC THIẾT KẾ (S1)</text>
      <line x1="24" y1="284" x2="1176" y2="284" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="64" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀN 2 · LƯỢT CHẤM (S4)</text>

      <!-- ========== Arrows (drawn before boxes) ========== -->
      <!-- Lane 1: tệp luật → dòng nạp -->
      <line x1="264" y1="160" x2="304" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- dòng nạp → lựa chọn -->
      <line x1="464" y1="160" x2="512" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- lựa chọn → theo luật (top vertex, elbow right) -->
      <path d="M 584 112 L 584 96 Q 584 88 592 88 L 736 88" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- lựa chọn → phạm luật (right vertex) -->
      <line x1="656" y1="160" x2="736" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Shortcut: kho không có tệp → không đổi gì -->
      <path d="M 164 188 L 164 236 Q 164 244 172 244 L 304 244" fill="none" stroke="#9aa0ad" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- Lane 2: diff → bộ soi → luat-cham.json → thẻ Cổng Bằng chứng -->
      <line x1="264" y1="396" x2="304" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="464" y1="396" x2="520" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="396" x2="736" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8–10px above the line) -->
      <rect x="628" y="66" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="75" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THEO LUẬT</text>

      <rect x="660" y="138" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="147" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHẠM LUẬT</text>

      <rect x="188" y="222" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="231" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG CÓ TỆP</text>

      <!-- ========== Lane 1 nodes ========== -->
      <!-- Tệp luật của kho (start oval) -->
      <rect x="64" y="132" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="64" y="132" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="158" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">PRODUCT-INVARIANTS.md</text>
      <text x="164" y="174" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tệp luật của kho</text>

      <!-- Dòng nạp -->
      <rect x="304" y="132" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="384" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng nạp</text>
      <text x="384" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sổ S1 · bản băm</text>

      <!-- Lựa chọn (diamond) -->
      <polygon points="584,112 656,160 584,208 512,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="157" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mỗi lựa chọn</text>
      <text x="584" y="171" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thiết kế</text>

      <!-- Không đổi gì (grey end oval) -->
      <rect x="304" y="224" width="240" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="304" y="224" width="240" height="40" rx="20" fill="transparent" stroke="#9aa0ad" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="424" y="242" fill="#636b80" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không đổi gì</text>
      <text x="424" y="256" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">hai thẻ y nguyên từng byte</text>

      <!-- Thẻ Cổng Phạm vi (card with two rows) -->
      <rect x="736" y="40" width="440" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="752" y="60" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THẺ CỔNG PHẠM VI</text>
      <rect x="1112" y="50" width="52" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1138" y="60" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÓ SẴN</text>
      <!-- row 1: theo luật -->
      <rect x="752" y="72" width="408" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="768" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Máy đã quyết</text>
      <text x="1144" y="92" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">mã SP-n cạnh căn cứ</text>
      <!-- row 2: phạm luật (focal) -->
      <rect x="752" y="136" width="408" height="48" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="768" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Câu hỏi «Phạm luật SP-n»</text>
      <text x="768" y="174" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">câu luật · chủ luật · nhãn khó-đảo khi luật khó đảo</text>

      <!-- ========== Lane 2 nodes ========== -->
      <!-- Diff của vòng (start oval) -->
      <rect x="64" y="368" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diff của vòng</text>
      <text x="164" y="410" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ dòng thêm</text>

      <!-- Bộ soi dấu hiệu -->
      <rect x="304" y="368" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="384" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ soi dấu hiệu</text>
      <text x="384" y="410" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">theo Dấu hiệu · Phạm vi</text>

      <!-- luat-cham.json -->
      <rect x="520" y="368" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="394" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">luat-cham.json</text>
      <text x="584" y="410" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mã · tệp:dòng</text>

      <!-- Thẻ Cổng Bằng chứng (card with two rows) -->
      <rect x="736" y="316" width="440" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="752" y="336" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THẺ CỔNG BẰNG CHỨNG</text>
      <rect x="1112" y="326" width="52" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1138" y="336" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÓ SẴN</text>
      <!-- row 1: khối luật bị chạm -->
      <rect x="752" y="348" width="408" height="40" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="768" y="365" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Khối «Luật sản phẩm bị chạm»</text>
      <text x="768" y="380" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">câu luật · chủ luật · mức · tệp:dòng</text>
      <!-- row 2: ô SP-n (focal) -->
      <rect x="752" y="404" width="408" height="44" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="768" y="423" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Ô «SP-n: sửa vật»</text>
      <text x="768" y="439" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">điền sẵn khuyến nghị · lối kia: chấp nhận có tên · không đi làn V</text>

      <!-- ========== Note + legend ========== -->
      <line x1="24" y1="484" x2="1176" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="64" y="508" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Máy không sửa tệp luật · không thêm cổng — câu luật chỉ vào dòng lệnh có sẵn của hai thẻ.</text>
      <text x="1176" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-2 · AC-3 · AC-5 · AC-8 · AC-10</text>

      <text x="64" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="64" y="552" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="96" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đầu vào</text>

      <rect x="196" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước máy</text>

      <polygon points="340,558 352,552 364,558 352,564" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <rect x="476" y="552" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="508" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Mục trên thẻ cổng</text>

      <rect x="636" y="552" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="668" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Việc của người (dòng lệnh có sẵn)</text>

      <line x1="852" y1="558" x2="880" y2="558" stroke="#9aa0ad" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="888" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường tắt: kho không có tệp luật</text>
    </svg>
  </div>
</body>
</html>
