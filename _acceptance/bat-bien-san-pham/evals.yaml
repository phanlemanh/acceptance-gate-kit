  - id: E9
    criterion: AC-9
    executor: judgment
    inputs:
      - feature-loop/skills/feature-loop/SKILL.md
      - commands/signoff.md
      - skills/acceptance/references/human-facing-language.md
      - skills/acceptance/references/product-invariants-template.md
      - GUIDE.md
      - CONTEXT.md
      - docs/adr/0023-luat-san-pham-cua-kho.md
    question: >
      Đọc như người của một kho tiêu thụ chưa từng thấy vòng này. Từ các tệp trên, có trả lời được không:
      (1) viết tệp PRODUCT-INVARIANTS.md thế nào, tệp ở đâu, và tệp là của kho — máy không sửa; (2) kho
      không có tệp thì không gì đổi; (3) bước thiết kế (S1 của SKILL) nạp tệp và ghi dòng nạp theo khuôn
      DEC-LUAT-NAP ra sao; (4) lựa chọn theo luật và phạm luật ghi vào sổ thế nào (nguồn căn cứ, pham_luat,
      kho_dao theo mức luật); (5) thẻ Cổng Phạm vi và Cổng Bằng chứng hiện gì, và trả lời ô «SP-<số>» và
      «Tệp luật» ra sao, với đúng hai lối «chấp nhận có tên» · «sửa vật» và khuyến nghị điền sẵn «sửa vật» —
      và hai nhãn ấy có trong danh sách GATE-ONESHOT-SLOTS; (6) kho được dặn thêm một dòng trỏ tệp luật vào
      CLAUDE.md để bộ tìm lỗi ở lượt chấm thấy luật, và vì sao (bộ tìm lỗi chỉ đọc CLAUDE.md); (7)
      thuật ngữ «Luật sản phẩm» trong CONTEXT.md có định nghĩa và từ tránh; (8) ADR 0023 nói ai phê phần
      CỘNG (Cổng Đáng 11/10), vì sao đường cố định không khoá config, và đường đảo; (9) ý (4) của phản biện
      context sạch (S1 mục 7 của SKILL) có câu soi «lựa chọn trái một luật đã nạp mà sổ không ghi
      pham_luat». PASS khi cả chín đúng; nêu câu sai nếu có.
    expected: "PASS — chín vế đúng; FAIL nêu vế thiếu"
    evidence_required: [run_id, verifier, verified_at, panel_votes]
