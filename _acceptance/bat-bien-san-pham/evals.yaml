schema_version: 1
feature_slug: bat-bien-san-pham
# Ca đo sống ở tests/scripts/luat-san-pham.ca.mjs (LS-01..LS-10), gọi từ phần bash của
# tests/scripts/run-tests.sh — executor `executors.test.scripts_bash` sẵn có, cùng lệnh suite nên lệnh trùng
# chỉ chạy một lần; không thêm khoá executor. Kho thử do code sinh trong lượt (thư mục tạm, git init, một
# commit gốc làm «gốc nhánh»); tệp luật của kho thử dựng TỪ khối PRODUCT-INVARIANTS-TEMPLATE rút bằng marker;
# giá trị mong đợi viết sẵn trong ca lúc dựng kho thử, KHÔNG rút từ đầu ra bộ đọc, bộ soi hay thẻ. Mô-đun,
# thẻ và khong-can-nguoi gọi bằng require/spawnSync như người gọi thật; đường dẫn mọi script suy từ vị trí
# tệp ca. Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao vật bị tiêm SAU khi bản lành xanh trên cùng kho thử, và
# ghim thông điệp. Mỗi eval ghim đúng dòng "PASS: LS-…" — suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.scripts_bash
    paths: [skills/acceptance/references/product-invariants-template.md, scripts/luat-san-pham.cjs, tests/scripts/luat-san-pham.ca.mjs, tests/scripts/run-tests.sh]
    expected: >
      exit 0; stdout có "PASS: LS-01 doc-luat" — khối PRODUCT-INVARIANTS-TEMPLATE rút từ khuôn (marker vắng →
      ca FAIL nêu tên khối), điền ba luật viết sẵn (một có câu chứa nháy, `$`, `|`) + bốn khối sai khuôn
      (thiếu Chủ luật · mức lạ · dấu hiệu không biên dịch · mã trùng); docLuat ra mảng luật deepEqual bảng
      viết sẵn (3 phần tử, mọi trường) và sai_khuon deepEqual bảng 4 lý do ghim; banLuat == stdout của
      `git hash-object` trên cùng tệp. Và "PASS: LS-01-do" — bản sao khuôn đổi nhãn «Chủ luật» → CHÍNH
      docLuat ra 0 luật, ca nêu «khuôn ra 0 luật».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_bash
    paths: [scripts/gate-card.js, scripts/khong-can-nguoi.mjs, scripts/luat-san-pham.cjs, scripts/can-cu-s1.cjs, tests/scripts/luat-san-pham.ca.mjs, tests/scripts/run-tests.sh]
    expected: >
      exit 0; stdout có "PASS: LS-02 vi-phan kit=<n> crm=<m|vang>" với n == số thư mục hồ sơ của kit đếm
      trong chính ca (không ghim số); crm theo biến LS_CRM_ROOT, vắng → "crm=vang" có tên. Gốc vòng đọc từ
      dòng «Commit gốc của vòng» ở Notes của hợp đồng (vắng hoặc không resolve → ca FAIL nêu dòng đó); hồ sơ
      của vòng đã ký → ca in "LS-02 da-ky" và không so. Bản gốc của gate-card.js, khong-can-nguoi.mjs và mô-đun
      phụ thuộc rút TRỌN thư mục bằng `git archive <gốc vòng> scripts lib` vào thư mục tạm; với MỌI hồ sơ của
      các kho đã so: HTML thẻ, bản rút (bỏ đúng khoá `luat`, khoá đó phải == {"co_tep":false}) và mã thoát + stdout
      của khong-can-nguoi không ghi trên hồ sơ `verified` bằng nhau từng byte giữa hai bản. Và
      "PASS: LS-02-do" — bản sao gate-card in khối luật vô điều kiện → CHÍNH hàm so trả hồ sơ lệch đầu tiên.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
