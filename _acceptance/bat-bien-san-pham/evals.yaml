    cmd: config:executors.test.scripts_bash
    paths: [feature-loop/skills/feature-loop/SKILL.md, scripts/luat-san-pham.cjs, scripts/can-cu-s1.cjs, scripts/gate-card.js, tests/scripts/luat-san-pham.ca.mjs, tests/scripts/run-tests.sh]
    expected: >
      exit 0; stdout có "PASS: LS-03 bash" và "PASS: LS-03 zsh" — khuôn rút từ khối
      DEC-LUAT-NAP của SKILL (đúng một dòng, có khoá `can_cu` và `luat_nap`), ghi bằng khối DEC-ID-RECIPE rút
      từ SKILL dưới bash và zsh (zsh vắng → FAIL); bộ xếp lớp ra `da-quyet`, `luat_nap.ban` == banLuat của
      tệp; ba thẻ: ca khớp không cờ luật nào, ca thiếu đúng một cờ vàng «Kho đã khai luật sản phẩm mà sổ bước
      thiết kế chưa có dòng nạp», ca đổi đúng một cờ vàng «Luật sản phẩm đã đổi sau khi bước thiết kế nạp»
      chứa bảy ký tự đầu của hai bản. Và "PASS: LS-03-do" — bản sao
      khuôn đổi tên khoá `luat_nap` → ca khớp ra cờ thiếu, ca nêu «DEC-LUAT-NAP».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
