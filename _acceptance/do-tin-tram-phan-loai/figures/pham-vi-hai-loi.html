<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai lối phạm vi, đặt cạnh nhau</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">So sánh hai cột</p>
    <h1>Hai lối phạm vi, đặt cạnh nhau</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Cột trái ============ -->
      <rect x="40" y="96" width="440" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="72" y="140" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">chỉ nhát hỏi lại</text>
      <text x="72" y="164" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">đề bài đã ký ở hồ sơ 2.13</text>
      <line x1="72" y1="180" x2="448" y2="180" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <circle cx="76" cy="200" r="3" fill="#4f5d75"/>
      <text x="92" y="204" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">cứu được ca BỎ SÓT</text>

      <circle cx="76" cy="240" r="3" fill="#4f5d75"/>
      <text x="92" y="244" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">ca TRÔI KHOÁ vẫn sống, mỗi lượt hỏi lại</text>
      <text x="92" y="264" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">phải gánh nó</text>

      <circle cx="76" cy="296" r="3" fill="#4f5d75"/>
      <text x="92" y="300" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">phạm vi hẹp, đúng chữ đã ký</text>

      <!-- ============ Cột phải (focal) ============ -->
      <rect x="520" y="96" width="440" height="232" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="552" y="140" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">cả hai nhát</text>
      <text x="552" y="164" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">thiết kế này</text>
      <line x1="552" y1="180" x2="928" y2="180" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <circle cx="556" cy="200" r="3" fill="#4f5d75"/>
      <text x="572" y="204" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">cứu cả hai nguyên nhân</text>

      <circle cx="556" cy="240" r="3" fill="#4f5d75"/>
      <text x="572" y="244" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">thêm hai lưới chống tin mù và một ô hỏng MỚI</text>
      <text x="572" y="264" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">(đúc lại mã ở lượt 2) phải có ca riêng</text>

      <circle cx="556" cy="296" r="3" fill="#4f5d75"/>
      <text x="572" y="300" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">đúng hai finding P0 của phản biện context sạch</text>

      <!-- ============ Điều kiện quyết ============ -->
      <line x1="40" y1="376" x2="960" y2="376" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐIỀU KIỆN QUYẾT</text>
      <text x="40" y="428" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">dạng nghiệm đúng tầng gọi định danh do LLM chép là bất biến đầu-người,</text>
      <text x="40" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">nên lối trái là vá dưới tầng của lỗi.</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="504" x2="960" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · CỘT VIỀN CAM LÀ LỐI THIẾT KẾ NÀY CHỌN</text>
    </svg>
  </div>
</body>
</html>
