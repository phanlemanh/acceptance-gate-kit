schema_version: 1
feature_slug: lo-trinh-gio-may
# Ca đo sống ở tests/scripts/lo-trinh-gio-may.test.mjs (ca GM-<n> = AC-n; đuôi .test.mjs nên cũng chạy trong mảnh mjs của
# suite) — khoá riêng executors.test.lo_trinh_gio_may, mọi eval máy chung MỘT lệnh. Kho thử do code sinh trong lượt
# (git init, commit ghim ngày bằng GIT_COMMITTER_DATE/GIT_AUTHOR_DATE, hôm nay ghim bằng ACCEPTANCE_TODAY, bản ghi phiên giả
# trong thư mục tạm trỏ bằng CLAUDE_PROJECTS_DIR, tệp đọc hạn mức trỏ bằng HAN_MUC_TEP); «bộ máy gốc» =
# `git archive <gốc so> scripts lib skills commands road-map` bung trong lượt, gốc so đọc từ
# _acceptance/lo-trinh-gio-may/goc-so; mọi đường dẫn suy từ vị trí tệp ca. Mỗi ca đỏ chạy trên BẢN SAO của vật với nhát
# tiêm khớp ĐÚNG một lần (ca tự kiểm số lần khớp), SAU khi bản lành xanh trên cùng kho thử, và ghim thông điệp. Ca in đúng
# một dòng «PASS: GM-…» hoặc «FAIL: GM-… — <vì sao>»; mỗi eval ghim dòng PASS của chính nó — lệnh xanh mà thiếu dòng ghim
# là ĐỎ. Ca so byte với bộ máy gốc làm đối chứng dương trước (lệnh thoát 0, stdout khác rỗng khi bên đó phải in; thiếu →
# «đối chứng gốc không chạy: <bên> <kho>»).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-1", "PASS: GM-1-doc-cu", "PASS: GM-1-nang-kit", "PASS: GM-1-do". GM-1: sáu hàng A gio_may 6 · B [3,5] · C "nhiều"
      · D [5,3] (A–D hạng T2) · E T3 không khoá · F không khoá không hạng — ô giờ máy trên trang BẰNG dãy viết sẵn
      [6 · 3–5 · 4–7 (máy ước) · 4–7 (máy ước) · 7–10 (máy ước) · 4–7 (máy ước, chưa khai hạng)]; trang có đúng hai cờ
      «hàng C: gio_may phải là số giờ dương hoặc cặp [thấp, cao]» và «hàng D: …» (đếm bằng nhau), và đúng một dòng
      «4/6 hàng máy tự ước giờ máy — khai gio_may trên hàng để ghi đè». GM-1-doc-cu: kho không khoá gio_may, không hồ sơ đo —
      `--ra-soat` (chữ và JSON), `--ap --json`, `--mo-o` (stdout và ô cơ hội) và khối dữ liệu máy đọc của trang giống TỪNG
      BYTE bộ máy gốc sau đối chứng dương. GM-1-nang-kit: kho đã commit trang vẽ bằng bộ máy gốc — `product-map.mjs
      --check` của bộ máy mới thoát ≠ 0 với câu «LO-TRINH.html lệch với tệp ý định và hồ sơ — chạy:»; vẽ lại rồi --check thoát 0. GM-1-do: bản sao nhận gio_may chuỗi → FAIL ghim «gio_may sai kiểu mà không cờ: C».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-2", "PASS: GM-2-thieu-phan-tram", "PASS: GM-2-chua-giao", "PASS: GM-2-do". GM-2: sáu hồ sơ
      T2 đã giao mang dòng gio-may đo [3,4,5,6,8,2], năm có phan_tram_tuan [2,3,4,5,6] — hàng T2 chưa khoá ghi
      «3–6 (theo 6 vòng đo)», hàng T3 chưa khoá ghi «7–10 (máy ước)», % ước hàng T2 «~4 %». GM-2-thieu-phan-tram: chỉ bốn hồ
      sơ có phan_tram_tuan → ô % đúng «chưa ước (4/5 vòng đo)». GM-2-chua-giao: thêm một hồ sơ đo chưa giao → ô giờ máy không
      đổi so với GM-2. GM-2-do: bản sao đếm cả hồ sơ chưa giao → FAIL ghim «hồ sơ chưa giao vào phép ước: <slug>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-3", "PASS: GM-3-tat-dinh", "PASS: GM-3-dong-bang", "PASS: GM-3-cat-ban", "PASS: GM-3-do", "PASS: GM-3-do2", "PASS: GM-3-do3". GM-3:
      mốc M phat-hanh mục tiêu D+2 với hàng T2 gio_may 5, hàng T3 không khoá, một hàng đã giao — dòng mốc mang đúng
      «~15,5–20 giờ máy». GM-3-tat-dinh: vẽ trang với ACCEPTANCE_TODAY 2026-10-20 và 2026-11-30 → hai trang giống từng byte.
      GM-3-dong-bang: hồ sơ mở sớm nhất của M có du-bao.json hoàn tất D+3 → dòng mốc mang «dự báo lúc bắt đầu (dd/mm):
      hoàn tất dd/mm» viết sẵn và đúng một cờ «mốc quá tải: dự kiến dd/mm, mục tiêu dd/mm». GM-3-cat-ban: mốc phát hành M′ có hàng nhóm phat-hanh và hàng T2 gio_may 5 → tổng
      M′ đúng «~7,5–8,5 giờ máy». GM-3-do3: bản sao cộng cắt bản cấp mốc dù có hàng cắt bản → FAIL ghim «cắt bản đếm hai lần: M′».
      GM-3-do: bản sao bỏ gộp → FAIL
      ghim «tổng mốc 13,5–17, cần 15,5–20». GM-3-do2: bản sao đọc hôm nay khi vẽ → FAIL ghim «trang đổi theo hôm nay».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-4", "PASS: GM-4-do-du", "PASS: GM-4-khong-ngay", "PASS: GM-4-do", "PASS: GM-4-do2". GM-4:
      hôm nay D, mốc M1 mục tiêu D+1 hai hàng T2 chưa mở, mốc M2 mục tiêu D+5 một hàng dung_tren hàng của M1, một hàng đang
      dở đo 3 giờ trên ước 4–7 — các dòng mốc của `--xem` BẰNG khối viết sẵn theo khuôn «<mốc>: bắt đầu ~dd/mm · ~X giờ máy
      · ~Y % hạn mức tuần · hoàn tất dự kiến dd/mm · mục tiêu dd/mm»: bắt đầu M2 = hoàn tất M1, hàng đang dở tính 1–4 giờ, giờ
      chờ 0 kèm «(chưa có giờ chờ đo)», M1 mang «(quá tải — dự kiến dd/mm, mục tiêu dd/mm)»; lệnh thoát 0, git status rỗng. GM-4-do-du: có vòng
      đã giao mang gio-may → giờ chờ là trung vị đo viết sẵn, không nhãn. GM-4-khong-ngay: mốc không ngay hợp lệ → dòng không vế mục tiêu, không cờ.
      GM-4-do: bản sao bỏ phụ thuộc → FAIL ghim «M2 bắt đầu D, cần sau M1». GM-4-do2: bản sao tính đủ hàng đang dở → FAIL
      ghim «hàng đang dở tính lại phần đã làm».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-5", "PASS: GM-5-chay-lai", "PASS: GM-5-khong-moc", "PASS: GM-5-do". GM-5: trên kho của GM-4,
      `--hang <hàng M1> --mo-o` → JSON.parse của _acceptance/<slug>/du-bao.json BẰNG (deepStrictEqual) đối tượng viết sẵn
      {ngay_tinh, hang:{ma, gio_may, phan_tram}, moc:{ten, bat_dau, hoan_tat, gio_may, gio_cho, gio_cho_do, muc_tieu}}; stdout và ô cơ hội giống
      từng byte lần chạy của bộ máy gốc. GM-5-chay-lai: tệp đã có → băm + mtime không đổi sau lần chạy thứ hai. GM-5-khong-moc:
      hàng không gắn mốc → tệp chỉ có khoá ngay_tinh và hang. GM-5-do: bản sao ghi đè tệp đã có → FAIL ghim «dự báo đóng băng
      bị ghi đè».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/do-vong.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-6", "PASS: GM-6-song-song", "PASS: GM-6-mu", "PASS: GM-6-khong-ghi", "PASS: GM-6-do", "PASS: GM-6-do2",
      "PASS: GM-6-do3", "PASS: GM-6-do4", và đúng một trong hai "PASS: GM-6-that" hoặc "SKIP: GM-6-that — không đọc được ở đây: không có bản
      ghi phiên của vòng" (SKIP không tính xanh cho vế bản ghi thật — bằng chứng phải nêu nó). GM-6: bản ghi
      giả (phiên chính + tác tử con chạm _acceptance/<slug>/, sự kiện giờ viết sẵn, một lời nhắn lặp mã, một phiên khác không
      chạm slug) — `do-vong.mjs --write` thêm đúng một dòng kind gio-may; gio_may, gio_cho, token (model × loại) BẰNG số viết
      sẵn; nguon liệt đúng các bản ghi chạm slug. GM-6-song-song: thêm hai tác tử con chồng giờ với phiên chính và một phiên có sự
      kiện trước ngày quyết của ô → gio_may BẰNG độ dài hợp khoảng viết sẵn, token không gồm sự kiện ngoài cửa sổ. GM-6-that:
      do-vong không --write trên bản ghi thật của máy với slug lo-trinh-gio-may → nguon có ≥1 phiên chính và ≥1 tác tử con,
      gio_may > 0, token ra > 0, mọi model có lời nhắn đều token > 0. GM-6-mu: không bản ghi chạm slug → nguon "khong-co-ban-ghi", gio_may null, token null,
      thoát 0. GM-6-khong-ghi: không --write → băm run-log không đổi. GM-6-do: bản sao đếm lời nhắn lặp hai lần → FAIL ghim
      «token ra 2×, cần 1×». GM-6-do2: bản sao đếm phiên không chạm slug → FAIL ghim «bản ghi lạ vào phép đo». GM-6-do3: bản sao cộng giờ từng bản ghi → FAIL ghim «giờ máy cộng trùng tác tử song
      song». GM-6-do4: bản sao bỏ cắt cửa sổ → FAIL ghim «sự kiện ngoài cửa sổ vào phép đo».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/do-vong.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-7", "PASS: GM-7-loai", "PASS: GM-7-doc", "PASS: GM-7-do". GM-7: hai lần đọc cùng mốc đặt lại
      20 % rồi 30 %, bản ghi cả máy trong khoảng có token quy đổi viết sẵn → phan_tram_tuan BẰNG số viết sẵn, dòng mang ty_le
      và khoảng đọc. GM-7-loai: ba ca (khác mốc đặt lại · % giảm · một lần đọc) → phan_tram_tuan null, ly_do BẰNG ba câu viết
      sẵn, mỗi ca một câu. GM-7-doc: `--doc-han-muc 23 --dat-lai <ISO>` thêm đúng một dòng; -5, 120, ISO hỏng → thoát 2 nêu
      cờ. GM-7-do: bản sao nhận cặp khác mốc đặt lại → FAIL ghim «tỉ lệ qua hai tài khoản».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-8", "PASS: GM-8-thieu-do", "PASS: GM-8-chua-dong-bang", "PASS: GM-8-do", "PASS: GM-8-do2". GM-8: mốc M khép (ba hàng đã giao, ký
      18–20/10), du-bao.json mở sớm nhất hoàn tất 19/10, một hàng thêm sau ngày đóng băng, mỗi hàng có dòng gio-may — đầu ra
      `--do-lech` BẰNG khối viết sẵn (dòng «M: dự báo 19/10 (đóng băng 15/10) · khép thật 20/10 · lệch 1 ngày · 1 hàng thêm
      sau đóng băng» + «giờ chờ: ước A (đo được lúc đóng băng: có/không) · đo B» + mỗi hàng «<mã>: ước X giờ máy · đo Y
      giờ máy · ~Z % hạn mức tuần» + «k/N vòng có số đo»); GM-8-thieu-do: một hàng không dòng gio-may, một hàng nguon
      khong-co-ban-ghi → mỗi hàng đúng «<mã>: thiếu số đo» và dòng «1/3 vòng có số đo»; mốc chưa khép không in; git status
      rỗng. GM-8-chua-dong-bang: mốc khép không du-bao.json → «chưa đóng băng dự báo — không đo được lệch». GM-8-do: bản sao
      lấy dự báo mới nhất → FAIL ghim «dự báo không phải bản đóng băng». GM-8-do2: bản sao bỏ hàng thiếu đo → FAIL ghim «vòng
      thiếu số đo bị giấu».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.lo_trinh_gio_may
    paths: [feature-loop/skills/feature-loop/SKILL.md, road-map/commands/xem.md, GUIDE.md, tests/scripts/lo-trinh-gio-may.test.mjs]
    expected: >
      exit 0; stdout có "PASS: GM-9", "PASS: GM-9-do". GM-9: SKILL feature-loop có đúng một khối marker S4-DO-VONG mang ba dòng
      lệnh (đọc hạn mức lúc mở · đọc hạn mức khi lượt chấm trả về · do-vong.mjs --write); dòng do-vong rút từ khối (thay
      $AG và <slug>) chạy trên kho thử của GM-6 → run-log thêm đúng dòng gio-may như GM-6; xem.md có câu nêu khối giờ máy và
      «quá tải»; GUIDE (mục khuôn tệp lộ trình) nêu khoá gio_may và câu đọc-cũ «hàng thiếu khoá: máy tự ước». GM-9-do: bản sao khối
      thiếu --write → FAIL ghim «khối S4-DO-VONG không ghi dòng gio-may».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
