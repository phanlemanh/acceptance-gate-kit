# Evals: context-ladder — mọi AC máy-đo qua tests/plugins (case mới P134+),
# cộng suite chống thoái lui + mirror. cmd là config: ref (resolve tại S4);
# paths phục vụ carry-forward round delta.

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Case mới (khu design-pass, P134+): rút frontmatter giữa cặp marker
      DESIGN-PASS-NOTE-TEMPLATE bằng máy → có khoá context: đúng 3 giá trị
      standalone|static-frame|host-embedded cạnh material:; Giai đoạn 0 có câu
      hỏi bắt buộc thứ hai về chỗ-vật-sống; đối chứng dương bản nguyên vẹn
      XANH trước; mutation xoá khoá context / xoá câu hỏi giai đoạn 0 → đỏ
      với đúng thông điệp ghim (tên khoá / tên câu hỏi), không chỉ exit code.
    paths: [skills/design-pass/SKILL.md, tests/plugins/run-tests.sh]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Case mới: SKILL.md có luật standalone-trước-Cổng-Phạm-vi ⇒ ≥1 cảnh
      ngữ-cảnh (khung host tĩnh + storyboard vào–ra) hoặc entry descope khuôn
      máy-đọc bắt đầu đúng chuỗi "bỏ cảnh ngữ-cảnh — "; biểu diễn máy-đọc của
      cảnh + chuỗi descope nằm TRONG cặp marker DESIGN-PASS-NOTE-TEMPLATE
      (một chỗ — gap-probe F1); mutation xoá luật / đổi chuỗi khuôn / dời biểu
      diễn ra ngoài marker → đỏ ghim thông điệp; đối chứng dương xanh trước.
    paths: [skills/design-pass/SKILL.md, tests/plugins/run-tests.sh]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Case mới: SKILL.md có quy tắc mặc-định-nấc-cao (đơn vị host đã có khuôn
      ⇒ scaffold đơn vị THẬT sau cờ dev, ruột tạm) + lệnh cấm dựng shell giống
      thật (gương song song) + câu "hợp lệ vĩnh viễn" cho nhánh không-có-đường-
      nhúng-rẻ; mutation xoá quy tắc hoặc xoá lệnh cấm → đỏ ghim thông điệp;
      đối chứng dương xanh.
    paths: [skills/design-pass/SKILL.md, tests/plugins/run-tests.sh]
  - id: E4
