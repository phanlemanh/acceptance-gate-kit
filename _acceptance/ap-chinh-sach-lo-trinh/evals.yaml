schema_version: 1
feature_slug: ap-chinh-sach-lo-trinh
# Ca đo sống ở tests/scripts/ap-chinh-sach-lo-trinh.test.mjs (ca AP-<n> = AC-n; đuôi .test.mjs nên cũng chạy trong mảnh
# mjs của suite) — khoá riêng executors.test.ap_chinh_sach_lo_trinh, mọi eval máy của AC-1…AC-10 chung MỘT lệnh. AC-11 cần
# kho crm trên máy nên tệp không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys (khoá
# executors.test.ap_chinh_sach_lo_trinh_crm; crm vắng → thoát 2 nêu đường — mù, không xanh). Phần khoá lệnh của AC-7 đo
# thêm bằng ca P32 ở suite plugin vùng 1 (khoá executors.test.plugins_vung_1). Kho thử do code sinh trong lượt (commit ghim
# ngày bằng GIT_COMMITTER_DATE/GIT_AUTHOR_DATE, hôm nay ghim bằng ACCEPTANCE_TODAY); «bộ máy gốc» =
# `git archive <gốc so> scripts lib skills commands road-map` bung trong lượt, gốc so đọc từ
# _acceptance/ap-chinh-sach-lo-trinh/goc-so; mọi đường dẫn suy từ vị trí tệp ca. Mỗi ca đỏ chạy trên BẢN SAO của vật với
# nhát tiêm khớp ĐÚNG một lần (ca tự kiểm số lần khớp), SAU khi bản lành xanh trên cùng kho thử, và ghim thông điệp. Ca in
# đúng một dòng «PASS: AP-…» hoặc «FAIL: AP-… — <vì sao>»; mỗi eval ghim dòng PASS của chính nó — lệnh xanh mà thiếu dòng
# ghim là ĐỎ. Mọi ca so byte với bộ máy gốc làm đối chứng dương trước (mỗi kho × mỗi bên: lệnh thoát 0, stdout khác rỗng
# khi bên đó phải in; thiếu → «đối chứng gốc không chạy: <bên> <kho>»).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-1", "PASS: AP-1-sai-kieu", "PASS: AP-1-khong-bat", "PASS: AP-1-do", "PASS: AP-1-do2".
      AP-1: kho thử bốn mốc A (phat-hanh qua ngày, tu_ap true) · B (phat-hanh +3, {tu_ap true, tuoi_ngay 20}) · C
      (phat-hanh +10, tu_ap false) · N (ngoai, tu_ap true), chinh_sach tệp {tuoi_ngay 30, tran_ke_tiep 2} — `--ap --json`
      nêu chiến dịch B và chính sách hiệu lực BẰNG {tu_ap:true, tuoi_ngay:20, tran_ke_tiep:2, nhip_ngay:1, tran_ap:5};
      hàng tuổi 25 mang luat tuoi trong `--ra-soat --json`; trang có đúng một cờ «chính sách chỉ khai ở mốc phát hành»
      nêu N. AP-1-sai-kieu: tu_ap "true" → đúng một cờ «chính sách tu_ap phải là true hoặc false», `--ap --write` không
      tạo sổ, băm tệp không đổi. AP-1-khong-bat: ba kho không bật (không chính sách · chính sách tệp không tu_ap · chỉ mốc
      đã qua bật) — `--ap --write` thoát 0, git status rỗng, không tệp *.so.jsonl; `--ra-soat` chữ và JSON giống từng
      byte bộ máy gốc. AP-1-do: bản sao chọn mốc xa nhất → FAIL ghim «chiến dịch đang chạy: C, cần B». AP-1-do2: bản sao
      đọc tu_ap từ khối tệp → FAIL ghim «kho không bật tự áp mà máy ghi sổ».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-2", "PASS: AP-2-tran-1", "PASS: AP-2-doi", "PASS: AP-2-do", "PASS: AP-2-do2", "PASS: AP-2-do3",
      "PASS: AP-2-do4". AP-2:
      kho bật (nhip_ngay 1, tran_ap 2), ba đề xuất X tuoi · Y moc-qua-ngay · Z ho-so-bac; chạy `--ap --write` ngày
      2026-10-20 (hai lần), 2026-10-21 (sau khi Y có hồ sơ đang mở), 2026-10-22 — ngày 20: băm tệp lộ trình không đổi và
      sổ đúng ba dòng bao-truoc ap_tu 2026-10-21; lần hai ngày 20: băm sổ không đổi; dãy (loai, ma, ngay) của sổ cuối BẰNG
      dãy viết sẵn [bao-truoc X 20, bao-truoc Y 20, bao-truoc Z 20, ap X 21, huy Y 21, ap Z 21]. AP-2-tran-1: tran_ap 1 →
      ngày 21 áp đúng X, ngày 22 áp Z. AP-2-doi: X báo trước ngày 20 luật tuoi, ngày 21 hồ sơ X bị bác → ngày 21 băm tệp
      không đổi, dãy (loai, ma, de_xuat, ngay) thêm [huy X cho-dieu-kien 21, bao-truoc X bac 21]; ngày 22 X là mục cuối
      da_bac. AP-2-do: bản sao áp ngay ngày báo trước → FAIL ghim «áp trước nhịp: X». AP-2-do2:
      bản sao không kiểm đề xuất còn nguyên → FAIL ghim «áp hàng đã có hồ sơ mở: Y». AP-2-do3: bản sao bỏ trần → FAIL ghim
      «áp 3, trần 2». AP-2-do4: bản sao chỉ so mã khi áp → FAIL ghim «áp đề xuất chưa báo trước: X bac».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-3", "PASS: AP-3-khong-moc", "PASS: AP-3-do", "PASS: AP-3-do2". AP-3: năm hàng M · T · L ·
      B (một tệp) và Q (tệp thứ hai không còn mốc chiến dịch phía trước); sau báo trước ngày D và áp ngày D+1, JSON.parse
      của tệp BẰNG (deepStrictEqual) đối tượng viết sẵn trong ca — M cuối hang của mốc đang chạy, rời mốc cũ; T, L hai mục
      cuối chan_troi mang ly_do · mo_lai_khi · tu_ap.ngay, L giữ ly_do cũ và câu máy ở ly_do_may; B mục cuối da_bac; tập mã
      trên hang ∪ chan_troi ∪ da_bac không đổi. AP-3-khong-moc: tệp của Q không đổi băm, JSON `--ap` mang cảnh báo «không
      có mốc chiến dịch phía trước». AP-3-do: bản sao xoá hàng thay vì chuyển → FAIL ghim «hàng biến mất: T». AP-3-do2:
      bản sao chèn đầu mảng → FAIL ghim «mục máy không ở cuối chan_troi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, docs/plans/lo-trinh-kit.json, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-4", "PASS: AP-4-tu-choi", "PASS: AP-4-do", "PASS: AP-4-do2". AP-4: bản sao từng byte
      tệp lộ trình kit ở gốc so (git show <gốc so>:docs/plans/lo-trinh-kit.json) thêm khoá lạ ở gốc (_x_goc), ở một hàng
      (x_la), ở một mốc (x_moc) và một object lồng ({a:{b:1}}), thêm tu_ap vào một mốc phat-hanh tương lai và một đề xuất
      được áp — diff dòng do ca tự tính: mọi dòng ngoài đoạn của hàng bị dời giống từng byte; danh sách khoá (Object.keys
      đệ quy) của mọi object không bị dời BẰNG bản trước; tệp kết bằng đúng một \n. AP-4-tu-choi: bốn tệp (thụt 4 · thiếu
      \n cuối · BOM · khoá "1" trong tu_vung) → thoát 2, stderr chứa «tệp lộ trình không ở dạng chuẩn — máy không ghi:
      <tệp>», băm + mtime tệp và sổ không đổi, đối chứng dương: cùng nội dung ở dạng chuẩn thì áp được. AP-4-do: bản sao
      ghi thụt 4 → FAIL ghim «byte ngoài phần dời đổi». AP-4-do2: bản sao bỏ điều kiện trước → FAIL ghim «ghi đè tệp không
      chuẩn: <ca>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-5", "PASS: AP-5-gop", "PASS: AP-5-dut", "PASS: AP-5-do". AP-5: hai bản clone cùng kho
      bật tự áp, mỗi bản chạy `--ap --write` ngày D rồi D+1 trên nhánh riêng và commit — băm tệp lộ trình và sổ của hai
      bản bằng nhau; mỗi dòng ap có đủ khoá ngay (đúng dạng YYYY-MM-DD, không giờ) · ma · de_xuat · luat · can_cu · vi_tri ·
      hang_goc · lenh_tra_lai. AP-5-gop: `git merge` nhánh này vào nhánh kia thoát 0, không đánh dấu xung đột. AP-5-dut: bản
      sao dừng (process.exit) ngay sau khi ghi dòng ap, trước khi đổi tệp — chạy bản lành cùng ngày: số dòng ap của mã đó
      = 1, băm tệp BẰNG băm của lần chạy không đứt. AP-5-do: bản sao ghi giờ vào ngay → FAIL ghim «sổ hai máy khác byte».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ap_chinh_sach_lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/ap-chinh-sach-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: AP-6", "PASS: AP-6-doi", "PASS: AP-6-ghim", "PASS: AP-6-tu-choi", "PASS: AP-6-do",
      "PASS: AP-6-do2". Mọi lệnh --write trong ca theo sau bởi một commit ghim ngày. AP-6: kho của AP-3 sau khi áp T (tuoi)
      và M (moc-qua-ngay) — `--tra-lai T --write`, `--tra-lai M --write` → băm tệp lộ trình BẰNG băm chụp trong ca trước
      lần áp; ngày kế `--ap --write` không sinh bao-truoc cho T hay M. AP-6-doi: hồ sơ T bị bác rồi áp ngày kế → đúng một
      bao-truoc T mang de_xuat bac. AP-6-ghim: `--ghim M --write` → băm tệp lộ trình không đổi, tuổi T và M trong
      `--ra-soat --json` trước và sau lệnh ghim bằng nhau, các ngày kế không bao-truoc nào cho M; `--bo-ghim M --write` rồi
      áp ngày kế → không bao-truoc M (đề xuất vẫn là đề xuất vừa bị trả); `--ghim` một hàng có bao-truoc chờ → đúng một
      dòng huy cho hàng ấy; dòng tra-lai/ghim/bo-ghim mang boi = git config user.name của kho thử. AP-6-tu-choi: tra-lai
      mã chưa từng áp → thoát 2 «không có lần áp nào của <mã> để trả lại»; tra-lai khi mục máy chuyển đã bị sửa tay → thoát
      2 «hàng đã đổi sau khi máy áp — trả lại bằng tay», băm tệp không đổi. AP-6-do: bản sao bỏ luật chặn đề xuất vừa trả →
      FAIL ghim «máy báo trước lại đề xuất vừa trả: T tuoi». AP-6-do2: bản sao ghi khoá ghim lên hàng → FAIL ghim «lệnh
      ghim đổi tệp lộ trình».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
