<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm chạy tự áp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">So sánh hai nhánh · Cổng Phạm vi · Hỏi-1 · AC-10</p>
    <h1>Máy tự áp chạy ở đâu?</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Nối (vẽ trước) ===== -->
      <path d="M 460 96 V 116 A 8 8 0 0 1 452 124 H 268 A 8 8 0 0 0 260 132 V 152" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 540 96 V 116 A 8 8 0 0 0 548 124 H 732 A 8 8 0 0 1 740 132 V 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Câu hỏi ===== -->
      <rect x="340" y="24" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Điểm chạy tự động</text>
      <text x="500" y="78" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">chủ kho chọn một trong hai</text>

      <!-- ===== Nhánh A — máy khuyên ===== -->
      <rect x="40" y="152" width="440" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="56" y="162" width="144" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="128" y="174" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH A · MÁY KHUYÊN</text>
      <text x="56" y="208" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Áp ngay khi mở việc từ một hàng</text>

      <rect x="40" y="240" width="440" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="56" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÁCH CHẠY</text>
      <text x="56" y="284" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Mỗi lần mở việc từ một hàng lộ trình, máy áp trước</text>
      <text x="56" y="302" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">rồi mới mở ô.</text>
      <text x="56" y="320" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Phần máy đổi thành một commit riêng trên nhánh của vòng.</text>

      <rect x="40" y="352" width="440" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="56" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐƯỢC</text>
      <text x="56" y="396" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">«Tự» thật — không ai phải nhớ gọi.</text>

      <rect x="40" y="432" width="440" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="56" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ</text>
      <text x="56" y="476" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Lộ trình đổi trên nhánh của vòng.</text>
      <text x="56" y="494" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Hai máy áp khác ngày có thể xung đột khi gộp.</text>
      <text x="56" y="520" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Giới hạn đã khai — ngưỡng mở lại: ≥ 1 lần gộp xung đột.</text>

      <!-- ===== Nhánh B ===== -->
      <rect x="520" y="152" width="440" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="162" width="64" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="568" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH B</text>
      <text x="536" y="208" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Một lệnh riêng cho phiên điều phối</text>

      <rect x="520" y="240" width="440" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="536" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÁCH CHẠY</text>
      <text x="536" y="284" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chỉ một lệnh riêng.</text>
      <text x="536" y="302" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Phiên điều phối gọi nó khi xếp lịch.</text>

      <rect x="520" y="352" width="440" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="536" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐƯỢC</text>
      <text x="536" y="396" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Không chạm bước mở việc.</text>

      <rect x="520" y="432" width="440" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="536" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ</text>
      <text x="536" y="476" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Không phiên nào gọi thì máy không áp.</text>
      <text x="536" y="494" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chủ kho vẫn sửa tay.</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="564" x2="960" y2="564" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="40" y1="584" x2="72" y2="584" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="80" y="588" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">nhánh máy khuyên</text>
      <text x="960" y="588" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">mỗi ô: cách chạy · được gì · trả giá gì</text>
    </svg>
  </div>
</body>
</html>
