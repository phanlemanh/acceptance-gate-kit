<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhịp một đề xuất</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ trạng thái · Cổng Phạm vi · AC-2 · AC-6 · AC-10</p>
    <h1>Nhịp một đề xuất: báo trước rồi mới áp</h1>

    <svg viewBox="0 0 1040 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Chuyển trạng thái (vẽ trước) ===== -->
      <!-- bắt đầu → Đề xuất xuất hiện -->
      <line x1="48" y1="200" x2="72" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đề xuất → Báo trước -->
      <line x1="232" y1="200" x2="312" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Báo trước → Chờ một nhịp -->
      <line x1="472" y1="200" x2="568" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Chờ → Áp (đường chính) -->
      <line x1="728" y1="200" x2="840" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Chờ: vượt trần ngày → chờ ngày sau (tự vòng) -->
      <path d="M 616 160 V 136 A 8 8 0 0 1 624 128 H 672 A 8 8 0 0 1 680 136 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Chờ → Báo trước: đề xuất đổi -->
      <path d="M 584 240 V 288 A 8 8 0 0 1 576 296 H 448 A 8 8 0 0 1 440 288 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Chờ → Huỷ -->
      <line x1="680" y1="240" x2="680" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Áp → Trả lại (chủ kho gọi) -->
      <line x1="920" y1="240" x2="920" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Ghim → Huỷ (chủ kho gọi) -->
      <line x1="472" y1="416" x2="568" y2="416" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- ===== Nhãn chuyển ===== -->
      <rect x="240" y="172" width="64" height="18" rx="2" fill="#f5f5f5"/>
      <text x="272" y="185" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không ghim</text>

      <rect x="484" y="172" width="72" height="18" rx="2" fill="#f5f5f5"/>
      <text x="520" y="185" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đặt ngày áp</text>

      <rect x="744" y="172" width="80" height="18" rx="2" fill="#f5f5f5"/>
      <text x="784" y="185" fill="#ba4513" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">còn nguyên</text>

      <rect x="552" y="88" width="192" height="32" rx="2" fill="#f5f5f5"/>
      <text x="648" y="101" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">vượt trần ngày → chờ ngày sau</text>
      <text x="648" y="115" fill="#636b80" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trần mặc định 5 hàng mỗi ngày</text>

      <rect x="432" y="304" width="160" height="18" rx="2" fill="#f5f5f5"/>
      <text x="512" y="317" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đổi → huỷ cũ, báo trước mới</text>

      <rect x="688" y="288" width="140" height="32" rx="2" fill="#f5f5f5"/>
      <text x="692" y="301" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">biến mất</text>
      <text x="692" y="315" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">hoặc hàng đang được mở</text>

      <rect x="928" y="288" width="80" height="32" rx="2" fill="#f5f5f5"/>
      <text x="932" y="301" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif">chủ kho gọi</text>
      <text x="932" y="315" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif">lệnh trả lại</text>

      <rect x="480" y="380" width="80" height="30" rx="2" fill="#f5f5f5"/>
      <text x="520" y="393" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">huỷ báo trước</text>
      <text x="520" y="406" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đang chờ</text>

      <!-- ===== Trạng thái ===== -->
      <circle cx="40" cy="200" r="6" fill="#2d3142"/>

      <!-- Đề xuất xuất hiện -->
      <rect x="72" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="200" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đề xuất xuất hiện</text>
      <text x="152" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">của một hàng lộ trình</text>

      <!-- Báo trước -->
      <rect x="312" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392" y="196" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Báo trước</text>
      <text x="392" y="216" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi sổ</text>
      <text x="392" y="230" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tệp lộ trình không đổi</text>

      <!-- Chờ một nhịp -->
      <rect x="568" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="648" y="200" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chờ một nhịp</text>
      <text x="648" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ít nhất 1 ngày</text>

      <!-- Áp (trọng tâm) -->
      <rect x="840" y="160" width="160" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="920" y="200" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Áp</text>
      <text x="920" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi sổ rồi dời hàng</text>

      <!-- Ghim -->
      <rect x="312" y="376" width="160" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="392" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghim</text>
      <text x="392" y="432" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ ghi sổ</text>
      <text x="392" y="446" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hàng ghim: không báo trước</text>

      <!-- Huỷ -->
      <rect x="568" y="376" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="648" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Huỷ</text>
      <text x="648" y="432" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không áp</text>

      <!-- Trả lại -->
      <rect x="840" y="376" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="920" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả lại</text>
      <text x="920" y="432" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hoàn tác</text>
      <text x="920" y="446" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chặn đúng đề xuất này</text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="480" x2="1008" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <line x1="120" y1="504" x2="152" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="508" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">máy tự đi</text>

      <line x1="256" y1="504" x2="288" y2="504" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="296" y="508" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">chủ kho gọi lệnh</text>

      <line x1="432" y1="504" x2="464" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="472" y="508" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đề xuất đổi: vòng lại báo trước</text>

      <line x1="680" y1="504" x2="712" y2="504" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="720" y="508" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đường chính: đề xuất còn nguyên thì áp</text>
    </svg>
  </div>
</body>
</html>
