<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường phán xét</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .frame { max-width: 720px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; max-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình tại điểm quyết định</p>
    <h1>Đường phán xét</h1>

    <svg viewBox="0 0 720 1168" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Vùng duyệt từng hồ sơ -->
      <rect x="40" y="264" width="640" height="552" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="56" y="288" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DUYỆT TỪNG HỒ SƠ</text>

      <!-- Mũi tên trước, nút sau -->
      <g stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)">
        <line x1="240" y1="96"  x2="240" y2="128" marker-end="url(#arrow)"/>
        <line x1="360" y1="176" x2="480" y2="176" marker-end="url(#arrow)"/>
        <line x1="240" y1="224" x2="240" y2="296" marker-end="url(#arrow)"/>
        <line x1="400" y1="360" x2="480" y2="360" marker-end="url(#arrow)"/>
        <line x1="240" y1="424" x2="240" y2="464" marker-end="url(#arrow)"/>
        <line x1="400" y1="512" x2="480" y2="512" marker-end="url(#arrow)"/>
        <line x1="240" y1="560" x2="240" y2="600" marker-end="url(#arrow)"/>
        <line x1="400" y1="648" x2="480" y2="648" marker-end="url(#arrow)"/>
        <line x1="240" y1="696" x2="240" y2="736" marker-end="url(#arrow)"/>
        <line x1="240" y1="816" x2="240" y2="864" marker-end="url(#arrow)"/>
        <line x1="400" y1="912" x2="480" y2="912" marker-end="url(#arrow)"/>
        <line x1="240" y1="960" x2="240" y2="1000" marker-end="url(#arrow)"/>
      </g>

      <!-- Nhãn nhánh -->
      <g font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em" fill="#636b80">
        <rect x="404" y="152" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="420" y="164" text-anchor="middle">CHƯA</text>

        <rect x="248" y="236" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="252" y="248">RỒI</text>

        <rect x="420" y="336" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="348" text-anchor="middle">KHÔNG</text>

        <rect x="248" y="436" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="252" y="448">CÓ</text>

        <rect x="428" y="488" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="500" text-anchor="middle">CÓ</text>

        <rect x="248" y="572" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="252" y="584">KHÔNG</text>

        <rect x="428" y="624" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="636" text-anchor="middle">CÓ</text>

        <rect x="248" y="708" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="252" y="720">CÒN LẠI</text>

        <rect x="428" y="888" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="900" text-anchor="middle">CÓ</text>

        <rect x="248" y="972" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="252" y="984">KHÔNG CÓ</text>
      </g>

      <!-- Nút -->
      <g font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2d3142">
        <!-- Nút vào -->
        <rect x="80" y="40" width="320" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="64">PR đổi code trọng yếu,</text>
        <text x="240" y="80">có đổi gì đó trong thư mục hồ sơ</text>

        <!-- Rẽ 1 -->
        <polygon points="240,128 360,176 240,224 120,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="180">Nhánh đích đã có cổng?</text>

        <rect x="480" y="152" width="160" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="180">Lần cài kit, được miễn</text>

        <!-- Rẽ 2: điều kiện đầu -->
        <polygon points="240,296 400,360 240,424 80,360" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="348">Có hợp đồng,</text>
        <text x="240" y="364">khai đủ hạng và trạng thái,</text>
        <text x="240" y="380">hạng thuộc diện phải ký?</text>

        <rect x="480" y="336" width="160" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="364">Không tính</text>

        <!-- Rẽ 2: đã khép -->
        <polygon points="240,464 400,512 240,560 80,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="508">Đã khép, hoặc</text>
        <text x="240" y="524">chỉ đổi tệp ghi chép?</text>

        <rect x="480" y="488" width="160" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="516">Không tính</text>

        <!-- Rẽ 2: dưới T3 -->
        <polygon points="240,600 400,648 240,696 80,648" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="644">Hạng dưới T3 mà</text>
        <text x="240" y="660">chưa có người ký?</text>

        <rect x="480" y="624" width="160" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="652">Không tính (Hỏi-2)</text>

        <rect x="160" y="736" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="764">Được tính</text>

        <!-- Kết -->
        <polygon points="240,864 400,912 240,960 80,912" fill="#f5f5f5"/>
        <polygon points="240,864 400,912 240,960 80,912" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="240" y="908">Có ít nhất một hồ sơ</text>
        <text x="240" y="924">được tính?</text>

        <rect x="480" y="884" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="908">Đi tiếp,</text>
        <text x="560" y="924">cổng chấm hồ sơ đó</text>

        <rect x="120" y="1000" width="240" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="1028">Chặn, nêu từng hồ sơ và lý do</text>
      </g>

      <!-- Ghi chú dưới hình -->
      <line x1="40" y1="1080" x2="680" y2="1080" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="1108" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Luật không buộc hồ sơ với từng tệp (Hỏi-3)</text>
      <text x="40" y="1128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">AC liên quan: AC-1 đến AC-7</text>
    </svg>
  </div>
</body>
</html>
