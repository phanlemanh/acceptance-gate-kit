schema_version: 1
feature_slug: t3-can-ho-so-arm
# E1–E7 chạy đúng các ca HA<k> được nêu của tests/scripts/t3-can-ho-so-arm.test.mjs qua rang/chay-ca.sh: ghim số ca
# chọn («Results: n passed, 0 failed», n = số đối số) và dòng PASS của từng ca theo tên. Kho thử do code sinh trong
# lượt; hợp đồng rút CONTRACT-FRONTMATTER-TEMPLATE; đường dẫn suy từ vị trí tệp. Đột biến chạy bản sao trọn thư mục, sau
# khi bản chưa tiêm đã cho kết quả mong đợi trên CÙNG fixture. Chiều đỏ trong lịch sử: 3539300c đứng trước 4b66432c.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.t3ha_e1
    expected: >
      Exit 0, «Results: 2 passed, 0 failed», PASS của HA1-do và HA18-mut. HA1-do: hợp đồng không frontmatter + tệp T3 →
      thoát 1, dòng VIOLATION [PR] chứa `no record in it is judged by the gate`, nêu core/k.js, nêu
      `feat: contract thiếu status, risk_tier`. HA18-mut: bản sao gỡ luật trên CÙNG fixture → `pre-merge-check: clean`.
    paths: [scripts/pre-merge-check.sh, tests/scripts/t3-can-ho-so-arm.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.t3ha_e2
    expected: >
      Exit 0, «Results: 2 passed, 0 failed», PASS của HA2-do và HA17-mut. HA2-do: T1 + verified + tệp T3 → thoát 1, cùng
      thông điệp, lý do `feat: risk_tier=T1 ngoài signoff.required_for`. HA17-mut: bản sao gỡ luật → `clean`.
    paths: [scripts/pre-merge-check.sh, tests/scripts/t3-can-ho-so-arm.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.t3ha_e3
    expected: >
      Exit 0, «Results: 14 passed, 0 failed», PASS của HA3-do, HA4-do, HA5-do, HA6-do, HA20-do, HA21-do, HA22-do, HA23-do và
      đột biến HA3-mut, HA4-mut, HA5-mut, HA6-mut, HA20-mut, HA21-mut. Mỗi ca -do thoát 1, cùng thông điệp, đúng lý do:
      `không có contract.md` · `không có thư mục hồ sơ nào trong PR` · `cu: chỉ đổi tệp chữ` (HA5, HA22) ·
      `hạng T2 chưa có chữ ký người` (HA6 máy-thông, HA23 làn V) · `hồ sơ đã chấm bởi thực tế đã đóng` ·
      `hồ sơ đã cho nghỉ`. Mỗi đột biến gỡ đúng nhánh lý do trên CÙNG fixture → không còn lý do đó trong đầu ra.
      Dòng cho nghỉ của HA21 rút từ bộ đọc hoSoNghi của lib/workspace-record.cjs.
    paths: [scripts/pre-merge-check.sh, tests/scripts/t3-can-ho-so-arm.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
