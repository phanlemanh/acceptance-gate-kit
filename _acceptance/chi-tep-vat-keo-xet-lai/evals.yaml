schema_version: 1
feature_slug: chi-tep-vat-keo-xet-lai
# Mỗi eval chạy đúng các ca TV<k> của nó trong tests/scripts/chi-tep-vat-keo-xet-lai.test.mjs, ghim số ca (dòng
# «Results: n passed, 0 failed» — ma trận viết trước) và dòng PASS của từng ca theo tên. Kho thử do code sinh trong
# lượt (git, hồ sơ cũ ghim commit đầu, mã đổi ở nhánh chính, PR là một commit sau basepoint). Bản gốc thật là main
# 115100b6 dựng trọn scripts/ lib/ skills/ commands/ bằng git archive trong lượt (CI checkout fetch-depth: 0). Mỗi ca
# đột biến chạy bản sao chưa tiêm trên CÙNG kho trước (xanh), neo tiêm khớp đúng một lần, bản tiêm khác bản gốc.
# Chiều đỏ trong lịch sử: commit tệp ca đứng trước commit vật; trên cây trước vòng TV1 đỏ với «evidence is stale».
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tvx_e1
    expected: >
      Exit 0, đúng «Results: 3 passed, 0 failed» và dòng PASS của TV1 chi-tep-chu, TV1-do ban-goc, TV1-do go-ve-chu.
      TV1: ma trận 5 ô viết trước (opportunity · decisions · ca-hai · kho-sau — bốn ô không evals.yaml, kho thử assert vắng tệp ·
      stale-scope-paths — evals.yaml paths [src/**]) — mỗi ô mã 0, 0 dòng
      «VIOLATION [old]: evidence is stale», đúng 1 dòng bắt đầu «NOTE [old]: sửa tệp chữ, không xét bằng chứng cũ — PR
      chỉ đổi » chứa tên mọi tệp chữ ô ấy đổi; 5/5. TV1-do ban-goc: bản gốc 115100b6 trên 5 ô ấy — mỗi ô mã ≠ 0 và dòng
      «VIOLATION [old]: evidence is stale» kèm «src/app.js» trong đầu ra; 5/5. TV1-do go-ve-chu: bản sao mà nhánh
      STALE-TEP-CHU-GUARD thành «elif false; then» (xanh trước khi tiêm trên cùng kho) — ô opportunity đỏ cùng thông điệp ấy.
    paths: [scripts/pre-merge-check.sh, lib/evidence-core.cjs, tests/scripts/chi-tep-vat-keo-xet-lai.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
