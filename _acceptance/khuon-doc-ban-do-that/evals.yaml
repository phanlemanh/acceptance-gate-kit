schema_version: 1
feature_slug: khuon-doc-ban-do-that
# Ca đo của vòng: tên ca mở bằng «KD-», ở tests/scripts/khuon-doc-ban-do-that.test.mjs (đuôi .test.mjs — cũng chạy
# trong mảnh mjs của suite). Khoá executor (thêm ở vòng này):
#   executors.test.khuon_doc_ban_do_that — node tests/scripts/khuon-doc-ban-do-that.test.mjs, in «PASS: [KD-…]»/«FAIL: …».
# Kho mẫu do code sinh trong lượt (bộ dựng chung tests/scripts/khuon-loi-kho-mau.mjs); kho mẫu hình dạng thật dựng lại
# hình dạng tệp bản đồ của kho thứ nhất với tên tệp và tên khối GIẢ. Mỗi ca «-do» chạy CHÍNH hàm kiểm trên bản sao TRỌN
# scripts/ và lib/ của cây đang kiểm bị tiêm một nhát (khớp đúng một lần), SAU khi bản lành xanh trên cùng fixture; bản
# sao phải chạy được (--dem in đúng dòng) trước khi tin màu đỏ; ghim thông điệp của ĐÚNG lỗi được tiêm. Kỳ vọng viết sẵn
# thành hằng trong tệp ca, không tính từ mã sản phẩm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-1]": ma trận viết sẵn (in «số hàng: 7»): mục mapping khối với khoi một tên · danh sách một dòng · danh
      sách một dòng có nháy · danh sách khối; mục mapping một dòng `{tep: …, khoi: …, ly_do: …}` với khoi một tên · danh
      sách một dòng; một hàng ly_do chứa dấu phẩy (danh sách khối trong mapping một dòng không phải YAML nên không có hàng);
      mỗi hàng so JSON ngoai_le của bộ đọc VÀ của CLI `ban-do-khuon.cjs --root <kho> --json` với bản viết thành các mục riêng
      mỗi mục một tên — bằng nhau, mỗi `khoi` là chuỗi; số assert = số hàng × 2. Chiều đỏ ở E2 (KD-2-do).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-2]": hai hàng — T mới so với base, và T đã có ở base với KhoiA, KhoiB rồi nhánh chạm T —
      ngoại lệ `khoi: [KhoiA, KhoiB]` → bước chấm thoát 0 ở cả hai, đầu ra không có dòng nào chứa "T · KhoiA" hay
      "T · KhoiB". "PASS: [KD-2-do]": bản lành xanh; bản sao bỏ bước tách danh sách trong bộ đọc → lỗi chứa "ngoại lệ dạng
      danh sách không được miễn".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-3]": cùng hai hàng, ngoại lệ chỉ `[KhoiA]` → hàng T mới thoát 1 với đúng một dòng bắt đầu
      "lệch: T · KhoiB"; hàng T có ở base in đúng một dòng bắt đầu "nợ cũ: T · KhoiB"; không hàng nào có dòng chứa
      "T · KhoiA". Đối chứng dương là KD-2 trên cùng fixture.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-4]": ma trận viết sẵn (in «số hàng: 8»): chỗ khai {khuon.lop_trinh_bay, cấp đầu} × kiểu {chuỗi,
      danh sách} (4 hàng), một hàng khai cả hai chỗ mỗi chỗ một tên (tệp dựng tên nào cũng được miễn), ba hàng dạng nhập
      (`as`, mặc định, `ns.LopTB`); mỗi hàng: tệp mới dựng lớp trình bày không dựng khuon.ten → không dòng "lệch: <tệp> ·
      khuôn KhungBang"; nhóm phần tử khai lớp trình bày TTLop, thẻ `<TTLop />` thiếu title → in đúng "lệch:
      src/man/bang/Khe2.tsx · TrangThaiMau thiếu khe title · nhóm trang-thai", thẻ có title → không dòng nào. "PASS:
      [KD-4-do]": bản lành xanh; bản sao bỏ lớp trình bày khỏi danh sách tên dựng khuôn → lỗi chứa "tệp dựng lớp trình bày
      bị báo thiếu khuôn".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-5]": cùng tệp dựng `<LopTB>`; nhóm không khai lớp trình bày → thoát 1, dòng "lệch: <tệp> · khuôn
      <ten>"; nhóm khai tên khác `LopKhac` → thoát 1, cùng dòng. Đối chứng dương là KD-4 trên cùng fixture.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, skills/acceptance/references/ban-do-khuon-template.md, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-6]": nhóm sổ đăng ký không tep → bước chấm in dòng "không đo được: nhóm <n>" chứa
      "nhan_dien.tep" và CLI --json `khong_doc_duoc` chứa "nhan_dien.tep"; thêm `tep:` cấp đầu → canh_bao có dòng chứa
      "nhan_dien.tep", không có dòng kết thúc đúng "khoá lạ: tep", nhóm vẫn khong_doc_duoc; glob ở `nhan_dien.tep` →
      nhan_dien là mảng glob, khong_doc_duoc null, và bước chấm không in "không đo được: nhóm <n>". "PASS: [KD-6-do]": bản
      lành xanh; bản sao trả hằng lời nhắc về chữ cũ "thêm tep: [glob]" → lỗi chứa "lời nhắc không nói nhan_dien.tep".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.khuon_doc_ban_do_that
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/khuon-doc-ban-do-that.test.mjs]
    expected: >
      exit 0; "PASS: [KD-7]": kho mẫu hình dạng thật (sổ đăng ký + nhan_dien.tep hẹp, khuon.lop_trinh_bay, thay_cho,
      cam_ho, sáu ngoại lệ trong đó ba dạng danh sách); base có sẵn ba tệp ngăn mang khối ngoại lệ (hai dạng danh sách — đường nợ cũ), nhánh
      thêm ba tệp ngăn mới mang khối ngoại lệ (một dạng danh sách) và một tệp dựng lớp trình bày (đường lệch) và chạm cả ba tệp cũ → bước chấm
      thoát 0, đầu ra không có dòng bắt đầu "lệch:" hay "nợ cũ:"; CLI --json `sai` rỗng. "PASS: [KD-7-do]": bản lành xanh;
      bản sao bỏ bước tách danh sách → lỗi chứa "kho hình dạng thật còn báo oan".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
