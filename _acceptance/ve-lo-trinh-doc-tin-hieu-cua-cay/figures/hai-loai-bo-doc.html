<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai loại bộ đọc</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Vá 2.32.1 · hình tại Cổng Phạm vi</p>
    <h1>Hai loại bộ đọc: trang lộ trình đọc cây đang vẽ, bộ đọc tương tác giữ hộp ý chung</h1>

    <svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Lane labels + divider ===== -->
      <text x="24" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2.32.0 · HÔM NAY</text>
      <text x="24" y="60" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Mọi bộ đọc lấy</text>
      <text x="24" y="76" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">hộp ý chung</text>

      <line x1="24" y1="284" x2="936" y2="284" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <text x="24" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2.32.1 · SAU VÁ</text>
      <text x="24" y="340" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Bộ vẽ trang chỉ</text>
      <text x="24" y="356" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">lấy cây đang vẽ</text>

      <!-- ===== ARROWS (drawn before boxes) ===== -->
      <!-- Lane 1: hộp ý chung → bộ đọc tương tác -->
      <path d="M352,156 H376 Q384,156 384,148 V128 Q384,120 392,120 H430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lane 1: hộp ý chung → bộ vẽ trang -->
      <path d="M352,180 H392 Q400,180 400,188 V208 Q400,216 408,216 H430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lane 1: bộ vẽ → CI -->
      <path d="M652,216 H734" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="656" y="192" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="692" y="203" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANG COMMIT</text>

      <!-- Lane 2: hộp ý chung → bộ đọc tương tác -->
      <path d="M352,352 H430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lane 2: cây đang vẽ → bộ vẽ trang (focal: đường đọc mới) -->
      <path d="M352,468 H430" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="356" y="444" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="392" y="455" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐÃ THEO DÕI</text>
      <!-- Lane 2: bộ vẽ → CI -->
      <path d="M652,468 H734" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="656" y="444" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="692" y="455" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANG COMMIT</text>

      <!-- ===== LANE 1 NODES ===== -->
      <!-- Hộp ý chung -->
      <rect x="152" y="132" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="152" y="132" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hộp ý chung</text>
      <text x="252" y="178" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ở thư mục chính của kho</text>
      <text x="252" y="192" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">có thể lệch cây đang vẽ</text>

      <!-- Bộ đọc tương tác -->
      <rect x="432" y="88" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="88" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="542" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ đọc tương tác</text>
      <text x="542" y="134" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thẻ khởi động · xem lộ trình · gom</text>

      <!-- Bộ vẽ trang -->
      <rect x="432" y="184" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="184" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="542" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ vẽ trang lộ trình</text>
      <text x="542" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LO-TRINH.html</text>

      <!-- CI (focal: chỗ hỏng) -->
      <rect x="736" y="176" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="176" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="836" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm trang ở CI</text>
      <text x="836" y="218" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">vẽ lại từ bản tải sạch của commit</text>
      <text x="836" y="242" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐỎ · TRANG LỆCH</text>

      <!-- Callout lane 1 -->
      <text fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">
        <tspan x="736" y="108">RM3b gộp hai câu hỏi làm một:</tspan>
        <tspan x="736" y="126">«ý nào đang chờ?» và</tspan>
        <tspan x="736" y="144">«trang commit trông thế nào?»</tspan>
      </text>

      <!-- ===== LANE 2 NODES ===== -->
      <!-- Hộp ý chung -->
      <rect x="152" y="316" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="152" y="316" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hộp ý chung</text>
      <text x="252" y="362" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ở thư mục chính của kho</text>
      <text x="252" y="376" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giữ nguyên như RM3b</text>

      <!-- Cây đang vẽ -->
      <rect x="152" y="432" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="152" y="432" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cây đang vẽ</text>
      <text x="252" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">worktree hoặc bản tải CI</text>
      <text x="252" y="492" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chỉ tệp ý đã theo dõi</text>

      <!-- Bộ đọc tương tác -->
      <rect x="432" y="320" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="320" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="542" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ đọc tương tác</text>
      <text x="542" y="366" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thẻ khởi động · xem lộ trình · gom</text>

      <!-- Bộ vẽ trang -->
      <rect x="432" y="436" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="436" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="542" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ vẽ trang lộ trình</text>
      <text x="542" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LO-TRINH.html</text>

      <!-- CI -->
      <rect x="736" y="428" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="428" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="836" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm trang ở CI</text>
      <text x="836" y="470" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">vẽ lại từ bản tải sạch của commit</text>
      <text x="836" y="494" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XANH · TRANG KHỚP</text>

      <!-- Callout lane 2 -->
      <text fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">
        <tspan x="736" y="340">Ý chưa commit: hiện ngay ở</tspan>
        <tspan x="736" y="358">bộ đọc tương tác; lên trang</tspan>
        <tspan x="736" y="376">khi được commit.</tspan>
      </text>
      <text x="736" y="396" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">AC-2 · AC-3</text>

      <!-- ===== LEGEND ===== -->
      <line x1="24" y1="540" x2="936" y2="540" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <line x1="112" y1="565" x2="144" y2="565" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="152" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">đọc tệp ý · chuyển trang</text>

      <line x1="304" y1="565" x2="336" y2="565" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="344" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">đường đọc mới của bộ vẽ trang</text>

      <rect x="528" y="558" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="556" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">chỗ hỏng hôm nay</text>
    </svg>
  </div>
</body>
</html>
