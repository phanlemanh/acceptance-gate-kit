    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-36-0/contract.md, _acceptance/danh-thuc-doc-nhip-dung-ma/contract.md, _acceptance/cong-cu-xet-tep-ton-tai/contract.md, _acceptance/kiem-ban-cai-loi-sua-chay-duoc/contract.md, _acceptance/lenh-dot-ghi-dung-hang/contract.md, _acceptance/doi-chung-chay-duoc/contract.md, _acceptance/tep-sinh-khong-chan-gop/contract.md, GUIDE.md, dieu-phoi/README.md, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-36-0 và mục «## 2.36.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép.
      (0) Ở các mục con của sáu hồ sơ: mỗi câu mô tả vòng (dòng «Gốc:», gạch «Vật:» chép dòng feature, giới hạn trích trong
      ngoặc «») có phải chữ của hợp đồng hồ sơ ấy (dòng feature, Context, Notes) — không tóm tắt, không nói rộng hơn — và
      số giới hạn đã khai (số mục chọn ở Cổng Bằng chứng mỗi ngày) có khớp Notes không? (1) Lời về khối `GITATTR-TEP-SINH`
      (hai dòng thuộc tính, lệnh `git config merge.tep-sinh.driver true` mỗi bản clone, driver giữ bản nhánh đang đứng, vẽ
      lại rồi commit, xung đột ở tệp nguồn vẫn dừng) và về thư mục hồ sơ không tệp nào có khớp khối ấy trong GUIDE.md và
      hợp đồng tep-sinh-khong-chan-gop không? (2) Lời về thứ tự nguồn slug của `xin s4`, lối từ chối khi hai hồ sơ cùng
      bậc, `hang them <mã|slug>`, `hang chay-lai` và hồ sơ `risk_tier: T1` có khớp dieu-phoi/README.md không? (3) Lời về
      lớp chép CI (hai tệp luôn chép lại, `scripts/lo-trinh.mjs` chỉ khi khai lo_trinh) có khớp nhãn trong khối
      INIT-CI-COPY-LIST của commands/acceptance-init.md không? (4) Đoạn «Vì sao 2.36.0» và «Ai bị ảnh hưởng» có nói thẳng
      các đổi hành vi chạm kho đang dùng — đơn `xin s4` không cờ đổi nguồn slug và có thể từ chối; hồ sơ T1 trên nhánh
      chính tính là đã gộp; thư mục hồ sơ rỗng biến khỏi bản đồ và trang lộ trình; làn đối chứng chạy thật — không, và căn
      cứ chọn minor (bề mặt mới, tiền lệ 2.33.1) có đúng với các đoạn «Vì sao» của mục 2.35.0 và 2.33.1 trong cùng tệp
      không? Trả PASS khi cả năm vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
