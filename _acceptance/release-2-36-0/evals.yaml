# evals — release-2-36-0
# Không có bộ răng riêng (nếp từ 2.2.0 → 2.35.0, luật «mốc phát hành KHÔNG dựng răng»): thứ cần canh ở mọi
# lần cắt số là ca vĩnh viễn P200 (vùng 3 của suite plugins) — mọi số đọc TỪ manifest (sáu gói), các đột biến +
# đối chứng dương, MỘT lối thoát. AC-4, AC-5, AC-7 đo bằng lệnh git; AC-8 dùng lại tệp lệnh của release-2-29-0 (rút danh
# sách mong đợi TỪ ghi chú CHANGELOG). AC-10 là cổng số phiên bản của KC1 (khoá có sẵn kiem_ban_cai_moc).
# E1/E2/E6 chấm MÃ THOÁT của vùng 3 — không hứa dòng P200 trong bằng chứng (sổ d-20261009T085335Z-3). E9 là hội
# đồng đọc mục CHANGELOG 2.36.0 cạnh đúng nguồn nó chép.
# long_running khai từ đầu cho ba lệnh dài: vùng 2 của suite plugins, trọn bộ ca điều phối, kiểm bản cài trọn.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vùng 3 của suite plugins xanh, nên ca P200 (cùng vùng) xanh: năm gói cùng số 2.36.0
      (acceptance-gate · feature-loop · dieu-phoi · road-map · tri-thuc), diagram-design 2.7.1, sáu số hợp semver, đọc từ
      manifest. Chiều đỏ sống trong chính P200 (đột biến gồm «road-map lech so» và «tri-thuc lech so», + đối
      chứng dương trên bản sao nguyên vẹn); P200 đỏ thì vùng 3 thoát khác 0.
    evidence_required: [run_id, exit_code, verifier, verified_at]
