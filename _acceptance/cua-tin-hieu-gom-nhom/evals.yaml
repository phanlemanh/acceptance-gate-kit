      khối lo-trinh-du-lieu vẽ từ cùng kho (đọc bằng docDuLieu); --id ra đúng 1 bản ghi; id lạ thoát 1 nêu
      id; ca KHÔNG nối {hang-khac-dot}: hàng phủ cùng mã nhóm nhưng khác dot → bản ghi vẫn «nhom-chua-cat»,
      không nhắc mã hàng đó. Và "PASS: TH-7-do" — bản sao đổi câu của chỗ chan-troi: CHÍNH hàm đo trả lỗi nêu «chan-troi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.tin_hieu
    paths: [scripts/lo-trinh.mjs, scripts/tin-hieu.mjs, skills/acceptance/references/lo-trinh-du-lieu.md, tests/scripts/tin-hieu.test.mjs]
    expected: >
      exit 0; stdout có "PASS: TH-8" — kho thử khai cửa: khối lo-trinh-du-lieu có tin_hieu deepEqual mảng
      --duong của cùng kho; vẽ hai lần → LO-TRINH.html giống byte; bản chép rời docDuLieu (rút nguyên văn
      hàm từ scripts/lo-trinh.mjs trong ca, chạy tách mô-đun) đọc trang có khoá → giữ nguyên mảng, đọc
      trang kho không khai → tin_hieu deepEqual [], và danh sách cảnh báo của (a) trang đó == của (b) cùng
      trang với khối được mã chèn `"tin_hieu": []` (cùng bản chép rời, cây đang kiểm — không so với bản
      cũ nào); bảng khoá đọc từ lo-trinh-du-lieu.md có tin_hieu và == KHUON_DU_LIEU. Và "PASS: TH-8-do" —
      bản sao bộ vẽ bỏ khoá tin_hieu: CHÍNH hàm đo trả lỗi nêu «tin_hieu»; và "PASS: TH-8-do2" — bản chép
      rời cảnh báo khi vắng tin_hieu: CHÍNH hàm so cảnh báo trả lỗi nêu «tin_hieu».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.tin_hieu
    paths: [skills/gom-tin-hieu/SKILL.md, scripts/tin-hieu.mjs, tests/scripts/tin-hieu.test.mjs]
    expected: >
      exit 0; stdout có "PASS: TH-9" — ba khối lệnh GOM-CHUA-GOM, GOM-RANG, GOM-DUONG rút NGUYÊN VĂN từ
      SKILL trong ca, chạy bằng bash trên kho thử (AG = gốc cây đang kiểm): ca xanh thoát 0, ca đỏ (một tín
      hiệu không chỗ) --rang thoát 1; khối GOM-TRUC có dòng `truc: ket-qua`; SKILL chứa ba ngăn và thứ tự
      «gom → commit → răng xanh → chuyển cắt lượt» theo bảng cụm viết sẵn; 0 câu khớp mẫu cấm viết sẵn
      {kit giữ/lưu tín hiệu · ghi trạng thái vào tệp ý định/lộ trình}. Và "PASS: TH-9-do" — bản sao SKILL
      gõ sai tên lệnh trong GOM-RANG: CHÍNH hàm đo trả lỗi nêu «GOM-RANG».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.tin_hieu
    paths: [scripts/tin-hieu.mjs, _acceptance/cua-tin-hieu-gom-nhom/mau/**, _acceptance/cua-tin-hieu-gom-nhom/rang/**, tests/scripts/tin-hieu.test.mjs]
    expected: >
      exit 0; stdout có "PASS: TH-10" — kho thử dựng bằng mã từ mau/bo-vang.json (hồ sơ ở trạng thái của
      crm be1324ba1, 20 tệp tín hiệu từ mau/tin-hieu/), mau/gom-bo-vang.md chép vào thư mục gom, bo-vang.json
      commit trước bản gom; lệnh `node rang/cham-bo-vang.mjs --root <kho> --bo-vang <tệp> --gom <thư mục>`
      thoát 0: --rang xanh; 10/10 cặp trùng ở chung một chỗ (in 10 dòng cặp → chỗ); 8 tín hiệu của 4 hồ sơ
      đã giao ra «đã phủ» đúng hồ sơ; 12 tín hiệu còn lại ở nhóm. KÍN ĐÁP ÁN trên đúng kho thử đưa tác tử
      (mau/kho-tac-tu/ hoặc bản dựng của nó): quét mọi byte mọi tệp tín hiệu → 0 slug nào của bo-vang.json,
      0 tiêu đề trùng nguyên văn một câu giao của hồ sơ trong kho, bo-vang.json vắng (đối chứng dương: CÙNG
      hàm quét thấy slug trong bo-vang.json); 20 mục bo-vang.json == 20 tệp mau/tin-hieu/*.json (id và
      tieu_de đọc bằng bộ đọc thật). Bộ vàng thứ hai do mã sinh (3 cặp, 1 đã phủ) cùng lệnh chấm → thoát
      0; đảo thứ tự commit (bản gom trước bo-vang.json) → thoát 1 nêu «khai trước». Và "PASS: TH-10-do" —
      bản sao bản gom tách một cặp trùng: CHÍNH lệnh chấm trả lỗi nêu cặp đó; "PASS: TH-10-do2" — bản sao
      bộ sinh giữ «sinh từ <slug>» trong nhãn: CHÍNH hàm quét kín đáp án trả lỗi nêu tên tệp.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: judgment
    inputs: [skills/gom-tin-hieu/SKILL.md, _acceptance/cua-tin-hieu-gom-nhom/mau/bo-vang.json, _acceptance/cua-tin-hieu-gom-nhom/mau/gom-bo-vang.md]
    question: >
      SKILL.md là skill gom tín hiệu của kit, chính sách trục ở khối GOM-TRUC; bo-vang.json là đáp án của bộ
      vàng: 20 mục {id, tieu_de, ho_so, cum} — mỗi tín hiệu giả kèm tiêu đề và hồ sơ thật nó sinh từ — cùng
      bốn cụm «cùng lớp» do người gom tay; gom-bo-vang.md là bản gom một phiên viết ra theo SKILL mà KHÔNG
      thấy đáp án (nhóm kê tín hiệu bằng id; tiêu đề của id tra trong bo-vang.json). Chỉ dựa vào ba tệp: (1) mỗi nhóm có phải là MỘT điều một vai
      muốn làm được, tên mở bằng vai, bằng tiếng sản phẩm mà người gửi không dùng git nhận ra ý mình không?
      (2) Có nhóm nào gộp hai kết quả khác nhau chỉ vì cùng cơ chế mã (cùng đọc lượt CI, cùng sửa một tệp)
      không? (3) Cách bản gom đặt tín hiệu của bốn cụm viết tay có giải thích được bằng trục kết quả không —
      cụm nào bị tách hay gộp thì lý do có nằm trong tên nhóm không? PASS khi (1) có, (2) không, (3) có —
      kèm trích tên nhóm cho từng vế; FAIL nêu vế sai và nhóm; UNCERTAIN khi tệp không đọc được.
    paths: [skills/gom-tin-hieu/SKILL.md, _acceptance/cua-tin-hieu-gom-nhom/mau/**]
    expected: PASS kèm trích tên nhóm cho từng vế; FAIL nêu vế sai và nhóm
    evidence_required: [judged_by, verdict, rationale]
