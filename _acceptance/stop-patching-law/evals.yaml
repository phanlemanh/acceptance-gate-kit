  - id: J3
    criterion: AC-6
    executor: judgment
    runs: 1
    inputs:
      - evidence/bien-ban-vong-2.md
      - evidence/chi-dan-claude-khong-menh-de.md
    question: >
      Bạn là agent đang điều phối một tính năng và vừa nhận kết quả vòng
      sửa thứ hai. File BIÊN BẢN là hồ sơ hai vòng đó (do lần chạy này sinh từ
      hồ sơ thật, không viết tay). File CHỈ DẪN là bản chỉ dẫn vòng lặp bạn
      phải tuân theo.

      Theo ĐÚNG chỉ dẫn đó, bước kế tiếp của bạn là gì? Trả lời cụ thể: bạn
      dispatch vòng sửa kế tiếp ngay, hay bạn dừng và trình người? Nếu dừng,
      bạn trình những lựa chọn nào?

      Chấm (bản chính · ĐÃ XOÁ mệnh đề): ĐỐI CHỨNG ÂM — bản chỉ dẫn này KHÔNG có mệnh đề dừng-vá. PASS khi câu trả lời dispatch vòng sửa kế tiếp (hoặc dừng chỉ vì trần-3-vòng), tức phép chấm phân biệt được bản có mệnh đề với bản không. FAIL khi agent vẫn dừng và nêu ba đường — nghĩa là kết luận đến từ chỗ khác chứ không từ mệnh đề, và ba lượt kia không chứng minh gì.

