# evals — stop-patching-law
# Luật kit: đo TRONG khối có mốc (không quét toàn tệp); ma trận đột biến toàn
# phần ghim NGUYÊN VĂN thông điệp; quan hệ chứa cho vị trí; và một chân judgment
# đo HÀNH VI — vì lời hứa của feature là hành vi, không phải chữ có mặt.

evals:
  - id: E1
    criterion: AC-1
    executor: test
    expected: "rút khối giữa cặp mốc STOP-PATCHING-CLAUSE của TỪNG bản chỉ dẫn (fix gap-probe P0 — không quét toàn tệp: rải chữ khắp nơi vẫn làm mọi biểu thức trúng trong khi không có mệnh đề mạch lạc nào); assert đủ BỐN ý CHỈ trên đoạn rút được, mỗi ý một ô, 2 bản × 4 ý = 8 ô; mốc phải xuất hiện ĐÚNG một lần mỗi bản, 0 hoặc ≥2 lần → ĐỎ nêu số lần"
    cmd: config:executors.test.plugins
    paths: ["feature-loop/skills/feature-loop/SKILL.md", "codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md", "tests/plugins/**"]

  - id: E2
    criterion: AC-2
    executor: test
    expected: "trong khối rút được: CẢ HAI vế của định nghĩa 'cùng lớp' — vế khẳng định (cùng TÊN LỚP LỖI + ví dụ tên lớp) và vế phủ định (KHÔNG phải cùng dòng mã / cùng phép đo); hai mutant riêng (fix gap-probe P2): xoá vế khẳng định → ĐỎ nêu 'định nghĩa cùng lớp'; xoá vế phủ định → ĐỎ nêu 'không phải cùng dòng mã'"
    cmd: config:executors.test.plugins
    paths: ["feature-loop/skills/feature-loop/SKILL.md", "codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md", "tests/plugins/**"]

  - id: E3
    criterion: AC-3
    executor: test
    expected: "QUAN HỆ CHỨA, không phải chỉ số (fix gap-probe P1): tiêu đề bao ngoài gần nhất phía trên của mệnh đề dừng-vá == tiêu đề bao ngoài của mệnh đề trần-3-vòng, ở CẢ HAI bản; VÀ mốc mở đứng trước trần-3-vòng. Đối chứng: bản sao DỜI khối ra khỏi nhánh (đặt ở phần tổng quan đầu tệp — chỉ số vẫn nhỏ hơn) → ĐỎ nêu hai tiêu đề khác nhau; bản nguyên vẹn XANH trước"
    cmd: config:executors.test.plugins
    paths: ["feature-loop/skills/feature-loop/SKILL.md", "codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md", "tests/plugins/**"]

  - id: E4
    criterion: AC-4
    executor: test
    expected: "ma trận đột biến TOÀN PHẦN rút từ bảng STOP-PATCH-MUTANTS trong contract (fix gap-probe P1 — bản trước chỉ có ca xoá-trọn-khối nên 8 ô của E1 không ô nào được chứng minh là sống): phép đo ĐỌC bảng, không tự chép danh sách; cột 2 'cả hai' sinh 2 ca → tổng 2 + 7×2 = 16 ca, và số ca chạy được phải BẰNG tổng suy từ bảng (lệch → ĐỎ, chống đếm-rồi-vứt); mỗi ca ĐỎ và thông điệp chứa NGUYÊN VĂN cụm ở cột 3 (fix gap-probe P2 — 'thông điệp khác nhau' không đủ: hai chốt gộp thành vòng lặp vẫn khác nhau ở số dòng); đối chứng dương bản nguyên vẹn XANH trước mỗi ca"
    cmd: config:executors.test.plugins
    paths: ["feature-loop/skills/feature-loop/SKILL.md", "codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md", "_acceptance/stop-patching-law/contract.md", "tests/plugins/**"]

  - id: E5
    criterion: AC-5
    executor: test
    expected: "6 lệnh kiểm hiện hành xanh; gương gói khớp nguồn (sync --check) và bản đồ sản phẩm khớp hồ sơ xưởng"
    cmd: config:executors.test.plugins
    paths: ["plugins/**", "tests/plugins/**"]

  - id: E6
    criterion: AC-6
    executor: test
    expected: "ĐO HÀNH VI trên bốn lượt agent context sạch, MỘT prompt trung tính duy nhất (S4-r1 sửa theo lớp: bản trước nhét rubric PASS/FAIL và nhãn nhánh vào chính question nên bốn lượt đo 'làm theo rubric', không đo mệnh đề). Phép đo là QUAN HỆ giữa câu trả lời và CHÍNH khối mệnh đề — độ dài đoạn trích nguyên văn dài nhất, ngưỡng suy từ độ dài khối chứ không ghim tuỳ ý: nhánh CÓ mệnh đề phải trích ≥ ngưỡng, nhánh ĐÃ XOÁ phải dưới ngưỡng, và hai nhánh phải tách bạch (thấp nhất bên CÓ > gấp đôi cao nhất bên XOÁ). Thêm chốt chống mớm: bản ghi prompt không được chứa 'dừng' / 'ba đường' / 'khuôn giải sai' / 'known limits'. Hai đối chứng đã chạy: chép câu trả lời nhánh CÓ đè lên nhánh XOÁ → ĐỎ; mớm chữ vào prompt → ĐỎ"
    cmd: config:executors.test.plugins
    paths: ["feature-loop/skills/feature-loop/SKILL.md", "codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md", "_acceptance/stop-patching-law/evidence/**", "tests/plugins/**"]

  - id: J1
    criterion: AC-6
    executor: judgment
    runs: 2
    inputs:
      - evidence/hanh-vi-prompt.md
      - evidence/hanh-vi-A1-claude-co.md
      - evidence/hanh-vi-A2-codex-co.md
      - evidence/hanh-vi-B1-claude-khong.md
      - evidence/hanh-vi-B2-codex-khong.md
    question: >
      Bốn file `hanh-vi-*.md` là câu trả lời của bốn agent context sạch khác
      nhau. Cả bốn nhận CÙNG MỘT prompt (ghi trong `hanh-vi-prompt.md`); thứ
      duy nhất khác giữa các lượt là bản chỉ dẫn được cấp cho agent. Hai lượt
      tên `-co` được cấp bản chỉ dẫn CÓ một mệnh đề nói về việc xử lý khi vòng
      sửa thứ hai lặp lại lỗi cũ; hai lượt tên `-khong` được cấp đúng bản chỉ
      dẫn đó nhưng đã gỡ mệnh đề ấy đi.

      Câu hỏi: bốn câu trả lời có PHÂN BIỆT được hai nhánh không? Tức quyết
      định mà agent rút ra ở nhánh `-co` có khác quyết định ở nhánh `-khong`
      không, và khác biệt đó có truy ngược được về đúng mệnh đề bị gỡ không?

      PASS khi hai nhánh cho quyết định khác nhau VÀ khác biệt đó truy được về
      mệnh đề (ví dụ: câu trả lời nhánh `-co` viện dẫn nội dung chỉ tồn tại
      trong mệnh đề). FAIL khi cả bốn cùng một quyết định, hoặc khác biệt đến
      từ chỗ khác trong chỉ dẫn chứ không từ mệnh đề — khi đó cặp đối chứng
      không có răng và ba lượt kia không chứng minh được gì.
