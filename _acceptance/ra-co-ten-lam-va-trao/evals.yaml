      thông điệp đang có cho verified (đối chứng: verified + da-veto cùng thông điệp); (d) start-scan
      trên fixture (a) → broken[] nêu mâu thuẫn, KHÔNG xếp vào done.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
