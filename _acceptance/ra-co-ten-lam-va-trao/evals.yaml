schema_version: 1
feature_slug: ra-co-ten-lam-va-trao
# Mọi eval ghim đích danh "PASS: [RT<n>]" trong stdout suite plugins. Ca ở
# tests/plugins/ra-co-ten.test.mjs: fixture CODE-SINH trong chính lần chạy (hợp đồng từ
# CONTRACT-FRONTMATTER-TEMPLATE, ô cơ hội từ OPP-FRONTMATTER-TEMPLATE + section khuôn, báo
# cáo từ evidence-report-template), chạy THẬT start-scan.mjs / gate-card.js / product-map.mjs /
# pre-merge-check.sh / hook; đường dẫn suy từ vị trí file; mỗi ca có đối chứng dương + chiều
# đỏ ghim thông điệp (MEASURE-BIRTH-CLAUSE). Chuyển CẤM (draft→machine-cleared, T3, UNCERTAIN)
# có ca riêng (Chow N-switch).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [lib/workspace-record.cjs, skills/acceptance/references/contract-template.md, skills/acceptance/references/evidence-report-template.md, scripts/khong-can-nguoi.mjs, scripts/pre-merge-check.sh, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT1]" — enum status == 6 giá trị đúng thứ tự (so mảng); usesUat
      true cho signed-off + machine-cleared, false cho 4 giá trị kia; usesEvidence true cho
      implemented/verified/machine-cleared; enum == danh sách rút từ khuôn contract-template
      (round-trip). Chiều đỏ: bản sao khuôn bỏ `machine-cleared` → reader đỏ nêu giá trị thiếu.
      VÀ: khối EVIDENCE-XANH-SACH-BLOCK nằm NGOÀI vùng chép của khuôn (khối hai mục thì PHẢI nằm
      trong); vùng chép có 0 lần khớp UNCERTAIN; báo cáo dựng TRỌN từ vùng chép → xanhSach nói SẠCH;
      chèn khối đó vào bản sao báo cáo → đỏ đúng «có mục UNCERTAIN»; danh sách rút từ khối == thứ tự
      điều kiện xanhSach() (mjs) == xanh_sach_check (bash) — round-trip ba đầu; bản sao khuôn gỡ mục
      «Known limits» → đỏ nêu tên mục.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/pre-merge-check.sh, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT2]" — fixture machine-cleared T2 + làn V + evidence xanh-sạch SINH
      TỪ TRỌN vùng chép của khuôn bên viết (không gõ tay theo bên đọc) + run-log khớp:
      pre-merge exit 0 với NOTE "xanh-sạch — máy đi tiếp" (đối chứng dương TRƯỚC).
      Cùng fixture: (a) tiêm UNCERTAIN → VIOLATION ghim "status machine-cleared nhưng hồ sơ còn
      cần người — có mục UNCERTAIN"; (b) T3 → ghim "hạng T3"; (c) gỡ veto_state, approved_by rỗng
      → VIOLATION Cổng 1; (d) không evidence-report.md → "status=machine-cleared but no
      evidence-report.md". Mỗi lệnh tiêm chứng minh đổi được đúng dòng.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    paths: [lib/evidence-core.cjs, hooks/acceptance-evidence-gate.js, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT3]" — hook (stdin payload ghi contract.md) với machine-cleared,
      approved_by rỗng: (a) veto mo + mốc + T2 → exit 0; (b) T3 → exit 2 ghim "veto_state: mo on a
      T3 contract"; (c) không veto/không gate1_skipped → exit 2 ghim "status: machine-cleared with
      empty approved_by"; (d) draft→machine-cleared → exit 2 ghim "skips Gate 1"; dòng lifecycle
      của hook chứa machine-cleared và khớp enum AC-1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/start-scan.mjs, scripts/trang-thai-ho-so.cjs, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT4]" — start-scan trên fixture: (a) machine-cleared + veto mo,
      không opportunity → done stateKey da-giao-may-thong-veto-mo, KHÔNG da-giao; (b) approved_by có
      tên, không veto → da-giao-may-thong-xanh-sach; (c) + opportunity build ngưỡng chốt → gates
      gia-tri; (d) mutant về verified (làn V, xanh-sạch) → KHÔNG ở gates, done may-di-tiep-veto-mo;
      (e) mutant machine-cleared→signed-off → stateKey da-giao, label khác (a).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/trang-thai-ho-so.cjs, scripts/product-map.mjs, scripts/gate-card.js, tests/plugins/ra-co-ten.test.mjs, tests/plugins/bang-dieu-khien.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT5]" và "PASS: [BDK2]" — bảng có đúng 4 khoá mới với nhãn chứa
      «máy thông»/«máy thông»/«không đo»/«đóng có hồ sơ»; BUCKET_OF 3 khoá → da-ship, 1 → da-bac;
      product-map trên fixture RT4(a) in nhãn rút từ bảng trong ô Đã giao (so chuỗi với
      chu(key).nhan, không chuỗi tự chế); gate-card --extract trên machine-cleared → gate '2',
      HTML có «máy đã thông» + cửa veto và KHÔNG mời ký; repo bộ quét MÙ (chưa dựng cổng) → thẻ
      RENDER được, không sập; hồ sơ HỎNG (broken) → thẻ nêu lý do + đường sửa, KHÔNG nói «máy đã
      đi tiếp»; BDK2 ma trận N=24 gõ tay.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/uat-session/SKILL.md, feature-loop/skills/feature-loop/SKILL.md, skills/acceptance/SKILL.md, CONTEXT.md, commands/acceptance-status.md, commands/acceptance-report.md, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT6]" — reader cắt đúng phạm vi (uat-session §0 bullet status;
      feature-loop bảng state machine + S4(3); acceptance SKILL đoạn làn V; CONTEXT mục Gates &
      verbs; hai thân lệnh) tìm đúng mệnh đề; bản sao gỡ TỪNG mệnh đề → reader trên bản sao ĐỎ
      nêu mệnh đề (assert qua exit/chuỗi, không mô tả).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/start-scan.mjs, skills/acceptance/references/opportunity-template.md, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT9]" — ma trận {signed-off, machine-cleared} × {chot, khong-do-duoc,
      chua-chot, de-xuat} viết trước (8 ô, 8 assert): chot → gates gia-tri không flags; khong-do-duoc
