  - id: E13
    criterion: AC-13
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/start-scan.mjs, lib/workspace-record.cjs, scripts/trang-thai-ho-so.cjs, _acceptance/ra-co-ten-lam-va-trao/contract.md, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT13]" — (i) bản MỚI start-scan trên cây thật: broken rỗng; (ii) bản CŨ
