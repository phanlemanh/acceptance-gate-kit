      nguong-chua-chot ⇔ (ở gates gia-tri ∧ ngưỡng khác chot) — assert này đúng ở mọi ngày chạy;
      (iv) quét không gian mở: tập file chứa "signed-off" (ngoài _acceptance/** và docs/**) == hợp của
      tập «có ca THẬT» (tên file phải xuất hiện trong BIỂU THỨC ĐƯỢC CHẠY của file ca — lột chú
      thích trước khi tìm, không miễn trừ bằng comment) và khối BO-DOC-KHAI-GACH; file lạ → ĐỎ nêu
      tên file. Ba chiều đỏ TIÊM THẬT: (iv-a) dựng kho git tạm có file tiêm rồi chạy CHÍNH bước
      git grep trên đó — phải tìm ra file mới, phải loại docs/**, không nêu file không chứa chuỗi;
      (iv-b) gỡ một dòng khai gạch → file đó thành lạ; (ii) bản sao xoá một dòng KHAC-BIET-DOC-CU
      → đỏ nêu slug lệch.
