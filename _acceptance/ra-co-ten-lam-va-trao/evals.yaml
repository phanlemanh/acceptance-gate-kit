      khuôn bản sao: ô viết theo chuỗi CŨ phải THÔI được nhận (nêu cả hai chuỗi), ô viết theo
      chuỗi MỚI của khuôn bản sao phải được nhận.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
