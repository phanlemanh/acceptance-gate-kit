schema_version: 1
feature_slug: ra-co-ten-lam-va-trao
# Mọi eval ghim đích danh "PASS: [RT<n>]" trong stdout suite plugins. Ca ở
# tests/plugins/ra-co-ten.test.mjs: fixture CODE-SINH trong chính lần chạy (hợp đồng từ
# CONTRACT-FRONTMATTER-TEMPLATE, ô cơ hội từ OPP-FRONTMATTER-TEMPLATE + section khuôn, báo
# cáo từ evidence-report-template), chạy THẬT start-scan.mjs / gate-card.js / product-map.mjs /
# pre-merge-check.sh / hook; đường dẫn suy từ vị trí file; mỗi ca có đối chứng dương + chiều
# đỏ ghim thông điệp (MEASURE-BIRTH-CLAUSE). Chuyển CẤM (draft→machine-cleared, T3, UNCERTAIN)
# có ca riêng (Chow N-switch).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [lib/workspace-record.cjs, skills/acceptance/references/contract-template.md, skills/acceptance/references/evidence-report-template.md, scripts/khong-can-nguoi.mjs, scripts/pre-merge-check.sh, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT1]" — enum status == 6 giá trị đúng thứ tự (so mảng); usesUat
      true cho signed-off + machine-cleared, false cho 4 giá trị kia; usesEvidence true cho
      implemented/verified/machine-cleared; enum == danh sách rút từ khuôn contract-template
      (round-trip). Chiều đỏ: bản sao khuôn bỏ `machine-cleared` → reader đỏ nêu giá trị thiếu.
      VÀ: khối EVIDENCE-XANH-SACH-BLOCK nằm NGOÀI vùng chép của khuôn (khối hai mục thì PHẢI nằm
      trong); vùng chép có 0 lần khớp UNCERTAIN; báo cáo dựng TRỌN từ vùng chép → xanhSach nói SẠCH;
      chèn khối đó vào bản sao báo cáo → đỏ đúng «có mục UNCERTAIN»; danh sách rút từ khối == thứ tự
      điều kiện xanhSach() (mjs) == xanh_sach_check (bash) — round-trip ba đầu; bản sao khuôn gỡ mục
      «Known limits» → đỏ nêu tên mục. Phạm vi cắt phía bash cắt ĐÚNG THÂN HÀM
      `xanh_sach_check` (tới dấu đóng hàm ở cột 0), KHÔNG tới EOF — cắt-tới-EOF cho 5/6 needle
      cơ hội thoả bởi mã NGOÀI hàm (62290 ký tự thay vì 2933; S4-r8 [5]); kèm răng phụ «thân
      hàm phải ngắn hơn 90% cả file» để phạm vi cắt không thành hư từ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/pre-merge-check.sh, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT2]" — fixture machine-cleared T2 + làn V + evidence xanh-sạch SINH
      TỪ TRỌN vùng chép của khuôn bên viết (không gõ tay theo bên đọc) + run-log khớp:
      pre-merge exit 0 với NOTE "xanh-sạch — máy đi tiếp" (đối chứng dương TRƯỚC).
      Cùng fixture: (a) tiêm UNCERTAIN → VIOLATION ghim "status machine-cleared nhưng hồ sơ còn
      cần người — có mục UNCERTAIN"; (b) T3 → ghim "hạng T3"; (c) gỡ veto_state, approved_by rỗng
      → VIOLATION Cổng 1; (d) không evidence-report.md → "status=machine-cleared but no
      evidence-report.md". Mỗi lệnh tiêm chứng minh đổi được đúng dòng.
      THÊM (S4-r10 [3] — false-green thật): ba điều kiện xanh-sạch TỪNG KHÔNG CÓ THƯỚC —
      (e) verdict != PASS · (f) bypass_used: true · (g) enforcement_mode: off — nay mỗi
      điều kiện một ca ĐỎ ghim đúng câu của lưới. Mỗi ca GẮN NHÃN điều kiện nó phủ, và ca
      kết so TẬP nhãn với khối EVIDENCE-XANH-SACH-BLOCK rút từ khuôn: thiếu một điều kiện
      là ĐỎ kèm tên. Chiều đỏ đã chạy: giết từng nhánh trong bản sao cây → đúng ca tương
      ứng ĐỎ; trước bản này cả ba mutant đều để RT1, RT2 và LV5 XANH.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    paths: [lib/evidence-core.cjs, hooks/acceptance-evidence-gate.js, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT3]" — hook (stdin payload ghi contract.md) với machine-cleared,
      approved_by rỗng: (a) veto mo + mốc + T2 → exit 0; (b) T3 → exit 2 ghim "veto_state: mo on a
      T3 contract"; (c) không veto/không gate1_skipped → exit 2 ghim "status: machine-cleared with
      empty approved_by"; (d) draft→machine-cleared → exit 2 ghim "skips Gate 1".
      (e) hạng KHÁC T2 + approved_by ĐÃ điền → exit 2 ghim "status: machine-cleared on a <hạng>
      contract": vị từ là ALLOWLIST (CHỈ T2 được phép), không phải cấm riêng chuỗi «T3» — viết
      `=== 'T3'` thì T1, hạng RỖNG và mọi cách gõ sai đều LỌT, mà lưới trước-merge chỉ chấm hạng
      trong REQUIRED_FOR («T2 T3») nên hồ sơ T1 không được lưới sờ tới lần nào (S4-r11 [1]). Ca
      chạy ít nhất T3, T1 và hạng RỖNG; và:
      «máy thông không chữ ký» là T2-only nên răng phải đứng ở TẦNG GHI, không chỉ ở lưới
      trước-merge; nhánh (b) chỉ bắt ca đi qua veto_state. ĐỐI CHỨNG DƯƠNG: cùng fixture hạ về
      T2 → exit 0. Gỡ răng khỏi lib → (e) ĐỎ.
      Lifecycle đo THÔNG ĐIỆP HOOK IN RA, KHÔNG grep mã nguồn: cắt khối «Gate-1 lifecycle
      reference:» từ stderr, khối phải nhắc machine-cleared, và mọi tên ở VỊ TRÍ TRẠNG THÁI trong
      khối phải là thành viên enum AC-1 lấy từ chính lib (quan hệ, không phải chuỗi rời) — mỗi
      thành viên enum phải được khối nhắc. Chiều đỏ: bản sao cây (hooks/ + lib/) gỡ machine-cleared
      khỏi ĐÚNG hai dòng lifecycle rồi chạy lại hook từ bản sao → ĐỎ, dù mã nguồn còn ≥3 lần khớp
      trong chú thích (đó chính là ca bản cũ bỏ lọt — S4-r8 [4]).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/start-scan.mjs, scripts/trang-thai-ho-so.cjs, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT4]" — start-scan trên fixture: (a) machine-cleared + veto mo,
      không opportunity → done stateKey da-giao-may-thong-veto-mo, KHÔNG da-giao; (b) approved_by có
      tên, không veto → da-giao-may-thong-xanh-sach; (c) + opportunity build ngưỡng chốt → gates
      gia-tri; (d) mutant về verified (làn V, xanh-sạch) → KHÔNG ở gates, done may-di-tiep-veto-mo;
      (e) mutant machine-cleared→signed-off → stateKey da-giao, label khác (a).
      VÀ (S4-r11 [3] — màu xanh giả): nhãn «máy thông, bằng chứng xanh-sạch» khẳng định một tính
      chất MÁY KIỂM ĐƯỢC nên KHÔNG được in chỉ vì frontmatter tự khai — bộ quét phải HỎI
      `khongCanNguoi` như làn `verified` vẫn làm; hồ sơ machine-cleared có verdict REJECT (hoặc
      mục Known limits có nội dung) phải vào `broken` kèm lý do, KHÔNG vào «đã giao». ĐỐI CHỨNG
      DƯƠNG: hồ sơ sạch vẫn vào đúng ô.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/trang-thai-ho-so.cjs, scripts/product-map.mjs, scripts/gate-card.js, tests/plugins/ra-co-ten.test.mjs, tests/plugins/bang-dieu-khien.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT5]" và "PASS: [BDK2]" — bảng có đúng 4 khoá mới với nhãn chứa
      «máy thông»/«máy thông»/«không đo»/«đóng có hồ sơ»; BUCKET_OF 3 khoá → da-ship, 1 → da-bac;
      product-map trên fixture RT4(a) in nhãn rút từ bảng trong ô Đã giao (so chuỗi với
      chu(key).nhan, không chuỗi tự chế); gate-card --extract trên machine-cleared → gate '2',
      HTML có «máy đã thông» + cửa veto và KHÔNG mời ký; repo bộ quét MÙ (chưa dựng cổng) → thẻ
      RENDER được, không sập; hồ sơ HỎNG (broken) → thẻ nêu lý do + đường sửa, KHÔNG nói «máy đã
      đi tiếp»; BDK2 ma trận N=24 gõ tay.
      THÊM (S4-r8 [1][3] + S4-r9 [1][5]): ma trận NĂM hình dạng ô ngưỡng — thiếu nhãn của khuôn ·
      toàn placeholder không gạch · điền đủ KHÔNG gạch · mang tiền tố đề xuất · chốt đủ — mỗi ô
      so trạng thái thẻ ĐỌC RA (`uat_threshold.state`, thẻ HỎI thresholdState chứ không tự suy
      `lines.length > 0`) với trạng thái lib; ô toàn placeholder phải cho lines RỖNG như bản nền
      cb38ea01. Ô ở trạng thái ĐỀ XUẤT (máy đề nghị, người chưa chốt) KHÔNG được thẻ gọi là «đã
      khai ở Cổng Đáng» — thẻ phải nói rõ đây là đề xuất của máy; ô đã CHỐT thì phải gọi đúng
      tên đó. Chiều đỏ: hoàn nguyên thẻ về vị từ tự chế → ĐỎ nêu đúng ba ô lệch.
      KHÔNG ĐỔI (hồ sơ ĐÃ KÝ ghim, sổ #20): `duong_do.applicable` giữ vị từ «≥1 dòng thật» của
      DD1, và chuỗi cờ «Hồ sơ cơ hội chưa khai ngưỡng nghiệm thu» giữ nguyên văn cho P198.
      THÊM (S4-r8 [2][4]): (a) nhãn máy-thông phải nằm TRONG Ô của hồ sơ — đo QUAN HỆ «ô của
      nhãn == ô của slug», không phải «chuỗi có mặt đâu đó trong bản đồ»; (b) hai hình dạng ĐẾN
      ĐƯỢC mà danh sách khoá từng bỏ sót: hồ sơ máy-thông CÓ opportunity.md × {ngưỡng chốt →
      `cho-cong-gia-tri`, khai không-đo-được → `da-giao-khong-do`} — thẻ KHÔNG được in «Ký
      duyệt»/«Ký hay trả» ở cả hai, mà vẫn phải nói «máy đã thông». Chiều đỏ: hoàn nguyên vị từ
      về danh sách khoá → ĐỎ nêu cả hai khoá. Chiều đỏ: vị từ CŨ (đi qua
      bulletOf, ĐÒI gạch) không được nhận dòng không-gạch — nếu nó vẫn nhận thì fixture không
      phân biệt được hai luật; hoàn nguyên `chuaDien` trong lib thật → RT5 ĐỎ nêu đúng chỗ lệch.
      THÊM (S4-r12 [2]): repo BỘ QUÉT MÙ (chưa dựng cổng → config:false, hoặc bộ quét lỗi)
      → thẻ phải RENDER, KHÔNG khẳng định sáu điều kiện, CÓ cờ vàng «chưa ai kiểm sáu điều
      kiện», và GIỮ lối ký như cũ — bỏ lối ký ở đó là để người kẹt với hồ sơ không ai xác
      nhận, và im lặng tuyên sạch là thứ chú thích trong chính gate-card khai là cấm.
      THÊM (S4-r10 [1]): hồ sơ HỎNG (chữ ký người trên hồ sơ máy-thông) → thẻ in cờ ĐỎ nêu lý
      do và KHÔNG in câu «máy đã thông — qua sáu điều kiện xanh-sạch, KHÔNG có chữ ký người»;
      câu đó vừa sai vừa không ai kiểm (thẻ chỉ đọc status, không chạy xanhSach).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/uat-session/SKILL.md, feature-loop/skills/feature-loop/SKILL.md, skills/acceptance/SKILL.md, CONTEXT.md, commands/acceptance-status.md, commands/acceptance-report.md, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      ⚠ LỆCH HỢP ĐỒNG ĐÃ DUYỆT — KHAI RÕ, KHÔNG SỬA AC: AC-6 (ii) và (iii) đòi văn bản nghi
      thức dạy máy «set `status: machine-cleared`». Vòng chấm S4-r7 xác nhận lỗi NẶNG trên mặt
      người của làn (thẻ Cổng 2 vừa nói «máy đã thông» vừa mời «Ký duyệt» khi hồ sơ có
      opportunity.md — hai người chấm độc lập + tác giả dựng lại được), nên theo luật dừng-vá,
      vòng THU PHẠM VI: ba mệnh đề GHI đã bị gỡ, đường ghi hạ thành giới hạn đã khai, ô
      `_acceptance/lan-may-thong-duong-ghi/` mang nguyên văn ba lỗi. AC-6 (ii)+(iii) vì vậy
      KHÔNG ĐẠT như đã ký — người quyết ở Cổng 2 có nhận phạm vi rút gọn này không.
      Phần CÒN LẠI của AC-6 đo như cũ: exit 0; stdout có "PASS: [RT6]" — reader cắt đúng phạm vi
      (uat-session §0 bullet status; feature-loop bảng state machine; CONTEXT mục Gates & verbs;
      hai thân lệnh) tìm đúng mệnh đề ĐỌC; bản sao gỡ TỪNG mệnh đề → reader trên bản sao ĐỎ nêu
      mệnh đề. THÊM (thay cho hai mệnh đề ghi): cả feature-loop SKILL lẫn acceptance SKILL phải
      KHAI «đường ghi chưa bật»; và phép quét sáu văn bản nghi thức không được thấy câu dạy máy
      tự đặt trạng thái — tiêm lại đúng câu vừa gỡ vào SKILL THẬT → ĐỎ nêu tên file.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
