      chấm) KHÔNG nhận → vẫn nguong-chua-chot; dạng bullet «- Không đo được — …» ĐƯỢC nhận.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/acceptance/references/opportunity-template.md, scripts/start-scan.mjs, scripts/gate-card.js, skills/uat-session/SKILL.md, tests/plugins/ra-co-ten.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [RT10]" — hai khối marker OPP-DE-XUAT-PREFIX / OPP-KHONG-DO-DUOC-PREFIX
