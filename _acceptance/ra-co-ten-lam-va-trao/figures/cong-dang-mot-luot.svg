<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 120 1200 580" role="img" aria-labelledby="d3-title d3-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="d3-title">Ký «việc này có đáng làm không» trong một lượt</title>
        <desc id="d3-desc">Luồng ngang năm chặng: kết buổi khai thác, máy đề xuất ngưỡng, thẻ Cổng Đáng, owner gõ một câu, máy ghi lại quyết định. Chặng thứ tư là chặng người duy nhất, tô cam. Từ chặng cuối toè ra bốn lối ra: làm, lặp, xếp lại, dừng.</desc>

        <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="1200" height="700" fill="#f5f5f5"/>

        <!-- ============ NÉT NỐI (vẽ trước) ============ -->
        <line x1="228" y1="244" x2="272" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="452" y1="244" x2="496" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="676" y1="244" x2="720" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="900" y1="244" x2="944" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- bốn lối ra, mỗi lối một tầng ngang riêng -->
        <path d="M 980,296 V 372 Q 980,380 972,380 H 212 Q 204,380 204,388 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 1016,296 V 392 Q 1016,400 1008,400 H 476 Q 468,400 468,408 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 1052,296 V 412 Q 1052,420 1044,420 H 740 Q 732,420 732,428 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 1088,296 V 432 Q 1088,440 1080,440 H 1004 Q 996,440 996,448 V 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- nhãn nét nối -->
        <rect x="872" y="324" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="968" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">MỘT TRONG BỐN</text>

        <!-- ============ LỜI CHÚ ============ -->
        <text x="810" y="156" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif','Lora',serif" text-anchor="middle">đúng một chặng phải gọi người</text>
        <line x1="810" y1="168" x2="810" y2="192" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>

        <!-- ============ NĂM CHẶNG ============ -->
        <rect x="48" y="192" width="180" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="60" y="204" width="44" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="82" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY</text>
        <text x="138" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kết buổi khai thác</text>
        <text x="138" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">máy tóm lại ý và giả định</text>
        <text x="138" y="288" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chưa có gì để ký</text>

        <rect x="272" y="192" width="180" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="284" y="204" width="44" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="306" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY</text>
        <text x="362" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy đề xuất ngưỡng</text>
        <text x="362" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mỗi dòng mang dấu «đề xuất»</text>
        <text x="362" y="288" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">máy khuyên, máy không quyết</text>

        <rect x="496" y="192" width="180" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="508" y="204" width="44" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="530" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY</text>
        <text x="586" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ để owner đọc</text>
        <text x="586" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">một màn, đọc trong một phút</text>
        <text x="586" y="288" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cờ đỏ nếu ngưỡng còn trống</text>

        <rect x="720" y="192" width="180" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="732" y="204" width="60" height="16" rx="2" fill="none" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
        <text x="762" y="216" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NGƯỜI</text>
        <text x="810" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner gõ một câu</text>
        <text x="810" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chọn một trong bốn lối</text>
        <text x="810" y="288" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">một lượt, một lần gộp</text>

        <rect x="944" y="192" width="180" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="956" y="204" width="44" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="978" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MÁY</text>
        <text x="1034" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy ghi lại quyết định</text>
        <text x="1034" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">vẽ lại bản đồ sản phẩm</text>
        <text x="1034" y="288" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">in ra bước kế tiếp</text>

        <!-- ============ BỐN LỐI RA ============ -->
        <rect x="88" y="496" width="232" height="88" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="204" y="532" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">làm</text>
        <text x="204" y="550" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(build)</text>
        <text x="204" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">máy mở vòng làm ngay</text>

        <rect x="352" y="496" width="232" height="88" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="468" y="532" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lặp</text>
        <text x="468" y="550" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(iterate)</text>
        <text x="468" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">làm thêm một vòng nữa trên cùng ý</text>

        <rect x="616" y="496" width="232" height="88" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="732" y="532" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">xếp lại</text>
        <text x="732" y="550" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(park)</text>
        <text x="732" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">để đó, không ai phải làm gì</text>

        <rect x="880" y="496" width="232" height="88" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="996" y="532" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dừng</text>
        <text x="996" y="550" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(kill)</text>
        <text x="996" y="568" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">đóng hồ sơ, giữ lại lý do</text>

        <!-- ============ CHÚ GIẢI ============ -->
        <line x1="48" y1="620" x2="1152" y2="620" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="48" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

        <rect x="48" y="660" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chặng máy tự làm</text>

        <rect x="232" y="660" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="264" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chặng dừng chờ người — đúng một trong năm</text>

        <rect x="536" y="660" width="24" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <text x="568" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối ra — điểm kết của một câu ký</text>
      </svg>
