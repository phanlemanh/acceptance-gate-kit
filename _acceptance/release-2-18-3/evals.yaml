# evals — release-2-18-3
# Không có bộ răng riêng (nếp từ 2.2.0 → 2.18.2, luật «mốc phát hành KHÔNG dựng răng»): thứ cần
# canh ở mọi lần cắt số là ca vĩnh viễn P200 (vùng 3 của suite plugins) — mọi số đọc TỪ manifest,
# 5 đột biến + đối chứng dương, MỘT lối thoát. AC-4 và AC-5 đo bằng lệnh git, không dựng script
# mới. Mọi eval trỏ KHOÁ MẢNH (hồ sơ ha-tang-khong-dot-luot, Known limit Ngoài-1).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Vùng 3 in «PASS: P200 …» và «P200 OK (so doc tu manifest …; 5/5 dot bien chay that …)»; các
      dòng vế: «hai plugin cung so: 2.18.3» và ba dòng «hop semver» (2.18.3 · 2.18.3 · 2.7.0). Chiều
      đỏ sống trong chính P200 (5 đột biến + đối chứng dương trên bản sao nguyên vẹn).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Dòng vế «P200 VE: GUIDE khop so DOC TU manifest» — câu «Khớp phiên bản» dựng từ ba số đọc trong
      manifest rồi so; đột biến GUIDE giữ số cũ → đỏ ghim nguyên câu dẫn xuất (trong P200).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
