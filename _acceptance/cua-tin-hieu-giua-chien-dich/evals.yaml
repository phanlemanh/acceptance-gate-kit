schema_version: 1
feature_slug: cua-tin-hieu-giua-chien-dich
# Ca đo sống ở tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs (ca CT-<n> = AC-n; đuôi .test.mjs nên cũng chạy trong mảnh
# mjs của suite) — khoá riêng executors.test.cua_tin_hieu_giua_chien_dich, mọi eval chung MỘT lệnh. Kho thử, thư mục đợt và
# cấu hình do code sinh trong lượt; «bộ máy gốc» = git archive <gốc so> scripts lib skills commands road-map dieu-phoi
# feature-loop bung trong lượt, gốc so đọc từ _acceptance/cua-tin-hieu-giua-chien-dich/goc-so; mọi đường dẫn suy từ vị trí
# tệp ca. Mỗi ca đỏ chạy trên BẢN SAO của vật với nhát tiêm khớp ĐÚNG một lần (ca tự kiểm số lần khớp), SAU khi bản lành
# xanh trên cùng fixture, và ghim thông điệp. Ca in đúng một dòng «PASS: CT-…» hoặc «FAIL: CT-… — <vì sao>»; mỗi eval ghim
# dòng PASS của chính nó — lệnh xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/yeu-cau.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/cua-tin-hieu.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-1", "PASS: CT-1-do", "PASS: CT-1-do2", "PASS: CT-1-duong". CT-1: đợt thử có goc_kho trỏ
      kho thử khai tin_hieu.nguon [tin-hieu/kho]; một viec-phu và một hang-moi không chặn; một nhịp phat-lich → mỗi id có
      tra-loi ket_qua "ghi", boi "may", ly_do mở đầu bằng CAU_DA_GHI (import) và nêu --chan; su-kien có đúng một dòng {loai
      yeu-cau, kieu, chan false, ket_qua ghi} mỗi id, 0 dòng can_phan true; viec-cho không nêu hai id (chạy SAU vế dương của
      CT-2 trên cùng đợt). CT-1-duong: câu jq của mục Đường đo trong contract (rút nguyên văn từ contract.md trong lượt)
      chạy trên su-kien.jsonl của CT-1 → {n:2, can_phan:0, ghi: hai id} (SỐNG), trên đợt kho không cửa của CT-4 → can_phan ≥
      1 (CHẾT); jq vắng → FAIL «thiếu jq — không đọc được đường đo». CT-1-do: bản sao bộ xét trả can_phan cho viec-phu →
      FAIL ghim «ý không chặn đánh thức giám sát: <id>». CT-1-do2: bản sao bỏ khoá chan khỏi sự kiện → FAIL ghim «sự kiện
      thiếu khoá chan: <id>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/yeu-cau.mjs, dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/phat-lich.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-2", "PASS: CT-2-doi", "PASS: CT-2-do", "PASS: CT-2-do2". CT-2: cặp yêu cầu như CT-1 ghi
      bằng lệnh thật `dieu-phoi.mjs yeu-cau <loại> --chan` → không tra-loi, sự kiện can_phan true, chan true, ly_do có «chặn
      việc đang chạy», thư mục tin-hieu/kho không có tệp, viec-cho.mjs liệt ĐÚNG hai id ấy (đối chứng dương cho vế âm của
      CT-1). CT-2-doi: cùng nội dung bỏ --chan trên cùng fixture → ghi (hai kết quả khác chỉ vì cờ). CT-2-do: bản sao bỏ
      nhánh chặn → FAIL ghim «ý khai chặn không được phán: <id>». CT-2-do2: bản sao lệnh yeu-cau bỏ đọc --chan → FAIL ghim
      «cờ --chan không vào noi_dung».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/cua-tin-hieu.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/yeu-cau.mjs, scripts/tin-hieu.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-3", "PASS: CT-3-lan-hai", "PASS: CT-3-gop", "PASS: CT-3-do", "PASS: CT-3-khac-than",
      "PASS: CT-3-do2", "PASS: CT-3-do3", "PASS: CT-3-dot-sau", "PASS: CT-3-khong-tieu-de", "PASS: CT-3-do4", "PASS:
      CT-3-do5". CT-3: sau CT-1 có đúng một tệp tin-hieu/kho/<đợt>-<id>.json mỗi id, thân BẰNG thân yêu cầu {phien, loai,
      hang, noi_dung, luc}; `scripts/tin-hieu.mjs --chua-gom` (bộ đọc thật) liệt cả hai id đúng tiêu đề, `--rang` không lỗi
      khuôn cho chúng. CT-3-lan-hai: nhịp thứ hai → vẫn một tệp mỗi id, mtime không đổi. CT-3-gop: viec-phu thứ ba trùng
      tiêu đề trong 24 giờ → gop, voi = id thứ nhất, không tệp thứ ba. CT-3-khac-than: tin-hieu/kho/<đợt>-<id>.json có sẵn
      với thân KHÁC → tệp cũ giữ nguyên từng byte (so băm trước/sau), yêu cầu mới can_phan với ly_do mở đầu «id trùng một ý
      khác trong cửa —». CT-3-do: bản sao ghi thêm khoá _ten → FAIL ghim «tệp tín hiệu khác thân yêu cầu: <id>». CT-3-do2:
      bản sao bỏ kiểm tệp đã có → FAIL ghim «nhịp xét hai lần đẻ tệp mới: <id>». CT-3-do3: bản sao ghi đè tệp có sẵn → FAIL
      ghim «ý bị đè: <id>». CT-3-dot-sau (Ngoài-1, nâng phạm vi): hai đợt tên dot-a, dot-b cùng ghi P1-1 khác thân vào một
      cửa → đợt sau trả ghi, cửa có hai tệp, tệp đợt trước nguyên băm. CT-3-khong-tieu-de (Ngoài-3): hai hang-moi chỉ có
      cau_giao khác nhau trong 24 giờ → cả hai ghi (hai tệp); hai viec-phu cùng «viec» → gộp. CT-3-do4: bản sao đặt tên tệp
      bằng mã trần → FAIL ghim «đợt sau đánh thức giám sát: P1-1». CT-3-do5: bản sao so tiêu đề chỉ bằng tieu_de → FAIL ghim
      «ý không tiêu đề bị gộp mất».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/yeu-cau.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/cua-tin-hieu.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-4", "PASS: CT-4-do", "PASS: CT-4-do2". CT-4: bốn đợt thử (kho không khai tin_hieu · đợt
      không goc_kho · kho có cửa với sáu loại vận hành cham-tep s4-gom gia-han can-nguoi chuyen-hang khac · kho không cửa
      với viec-phu và hang-moi kèm một cặp hang-moi trùng tiêu đề trong 24 giờ), một nhịp bằng bộ máy hiện tại và bộ máy gốc
      (git archive <goc-so>) trên cùng fixture → tra-loi/ và su-kien.jsonl bỏ khoá luc và chan giống từng byte; đối chứng
      dương trước: bộ máy gốc thoát 0 và ≥1 dòng sự kiện mỗi đợt (thiếu → «đối chứng gốc không chạy: <đợt>»); không tệp nào
      sinh trong kho thử. CT-4-do: bản sao coi kho không khai cửa là có cửa ở thư mục mặc định → FAIL ghim «kho không cửa bị
      đổi hành vi: <đợt>». CT-4-do2: bản sao gộp hang-moi trùng TRƯỚC khi xét cửa → FAIL ghim «kho không cửa bị đổi hành vi:
      hang-moi trùng».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/cua-tin-hieu.mjs, dieu-phoi/scripts/phat-lich.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-5", "PASS: CT-5-do". CT-5: kho khai cửa nhưng tin-hieu/kho là một TỆP → một viec-phu không
      chặn: không tra-loi, sự kiện can_phan true, ly_do mở đầu «không ghi được vào cửa tín hiệu —», phat-lich thoát 0 và
      nhịp kế vẫn ghi sự kiện. CT-5-do: bản sao nuốt lỗi ghi rồi vẫn trả ghi → FAIL ghim «ý mất: trả đã ghi mà không có tệp:
      <id>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/cua-tin-hieu.mjs, scripts/tin-hieu-khoa.cjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-6", "PASS: CT-6-do". CT-6: ma trận tám ô cấu hình (nguon chuỗi · dòng [a, b] · danh sách -
      a · chú thích cuối dòng · có nháy · khối tin_hieu vắng · khoá nguon vắng · nguon: ~) đọc bằng bản chép trong gói điều
      phối và bằng scripts/tin-hieu-khoa.cjs → bằng nhau mọi ô, ca in «8/8 ô», đích ghi là phần tử đầu của nguon. CT-6-do:
      bản sao bản chép bỏ cắt chú thích cuối dòng → FAIL ghim «bản chép lệch bộ đọc kit ở ô chú-thích».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [scripts/gui-tin-hieu.mjs, road-map/commands/gui.md, dieu-phoi/scripts/cua-tin-hieu.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-7", "PASS: CT-7-so-trung", "PASS: CT-7-khong-cua", "PASS: CT-7-rong", "PASS: CT-7-lenh",
      "PASS: CT-7-mot-ghi", "PASS: CT-7-do". CT-7: kho thử khai cửa, git user.name «Chủ Kho Thử»; `node
      scripts/gui-tin-hieu.mjs --root <kho> --noi-dung "Mở KR không thấy số tuần trước"` hai lần → thoát 0, stdout có
      CAU_DA_GHI và đường tệp; đúng hai tệp tin-hieu/kho/nguoi-chu-kho-thu-1.json và -2.json, loai tin-hieu,
      noi_dung.tieu_de bằng câu; --chua-gom liệt cả hai. CT-7-so-trung: tệp nguoi-chu-kho-thu-3.json có sẵn khi lệnh tính ra
      số 3 → lần gửi ghi -4.json, tệp -3 còn nguyên từng byte. CT-7-khong-cua: kho không khai cửa → thoát 1, đúng một dòng
      nêu tin_hieu trong _acceptance/config.yaml, không tệp. CT-7-rong: --noi-dung "" → thoát 2. CT-7-lenh: dòng lệnh rút từ
      khối RM-GUI-LENH của road-map/commands/gui.md chạy được trong ca (thay $AG bằng gốc kit, câu bằng câu thử) và tệp lệnh
      KHÔNG mang disable-model-invocation. CT-7-mot-ghi: tệp do lệnh người ghi so byte với tệp dựng lại bằng ghiVaoCua từ
      thân đã đọc → bằng nhau. CT-7-do: bản sao vỏ lệnh tự ghi bằng JSON.stringify không thụt → FAIL ghim «hai khuôn tệp tín
      hiệu: <tệp>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [scripts/start-scan.mjs, scripts/tin-hieu.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-8", "PASS: CT-8-khong", "PASS: CT-8-sai-khuon", "PASS: CT-8-do", "PASS: CT-8-do2". CT-8:
      kho thử khai lộ trình và cửa, 3 tín hiệu chưa gom và 2 đã ở một bản gom → đầu ra thẻ của scripts/start-scan.mjs có
      đúng một dòng «Cửa tín hiệu: 3 ý chờ gom ở mốc khép — gom bằng skill gom-tin-hieu». CT-8-khong: 0 tín hiệu chưa gom,
      kho không khai cửa, và kho khai cửa mà chưa có thư mục nguồn → đầu ra thẻ giống từng byte bộ máy gốc trên cùng kho,
      sau đối chứng dương (gốc thoát 0, đầu ra khác rỗng). CT-8-sai-khuon: một tệp tín hiệu sai khuôn → dòng mở đầu «!» nêu
      số tệp không đọc được, start-scan thoát 0. CT-8-do: bản sao đếm cả tín hiệu đã gom → FAIL ghim «thẻ đếm cả ý đã gom: 5
      ≠ 3». CT-8-do2: bản sao đếm cả lỗi «thư mục nguồn chưa có» → FAIL ghim «thẻ đổi khi không có ý chờ gom: kho khai cửa
      chưa có thư mục nguồn».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [feature-loop/skills/feature-loop/SKILL.md, dieu-phoi/scripts/mau/LUAT.md, dieu-phoi/scripts/dieu-phoi.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-9", "PASS: CT-9-luat", "PASS: CT-9-do". CT-9: rút dòng yêu cầu hang-moi từ khối
      TRONG-DOT-HANG-MOI của feature-loop/skills/feature-loop/SKILL.md, chạy bằng lệnh yeu-cau thật rồi một nhịp → can_phan
      true, chan true. CT-9-luat: dieu-phoi/scripts/mau/LUAT.md có khối LUAT-CHAN chứa «đã ghi» và «--chan», dòng lệnh trong
      khối chạy được qua lệnh yeu-cau thật. CT-9-do: bản sao SKILL bỏ --chan khỏi dòng S0 → FAIL ghim «thợ chờ ô bị trả đã
      ghi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.cua_tin_hieu_giua_chien_dich
    paths: [dieu-phoi/scripts/cua-tin-hieu.mjs, dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/phat-lich.mjs, tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs]
    expected: >
      exit 0; stdout có "PASS: CT-10", "PASS: CT-10-do". CT-10: đợt mở bằng `dieu-phoi.mjs mo` rồi bản lõi chép phẳng vào
      <thư mục đợt>/loi/ (hàm chép của chính dieu-phoi.mjs); phat-lich.mjs CHẠY TỪ loi/ xét một viec-phu không chặn của kho
      có cửa → tệp tín hiệu sinh trong kho, tra-loi mang ghi. CT-10-do: bản sao cua-tin-hieu.mjs import
      ../../scripts/tin-hieu-khoa.cjs → FAIL ghim «bản lõi theo đợt thiếu module: tin-hieu-khoa».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
