schema_version: 1
feature_slug: kiem-ban-cai-loi-sua-chay-duoc
# Ca đo sống ở tests/scripts/kiem-ban-cai-loi-sua.test.mjs (ca LS-<n> = AC-n): kho kit thu nhỏ (chợ + plugin.json chép
# từ HEAD của kit, tệp mẫu mỗi vùng, thẻ thật), bộ đệm = git archive của thẻ, kho tiêu thụ giả có worktree liên kết thật,
# sổ cài khuôn version 2 — tất cả do mã sinh trong chính lượt chạy, đường suy từ vị trí tệp ca. Mỗi ca đỏ chạy SAU đối
# chứng dương của cùng fixture và ghim thông điệp; lệnh sửa / dọn / lấy thẻ được ÁP bằng vỏ thật rồi chạy lại lệnh kiểm.
# Mỗi eval E1–E9 dùng chung một lệnh (s4-args khử trùng); E10 là trọn bộ ca KB đời trước (cần CLI claude).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-1" — kho kit thu nhỏ có một commit sau thẻ (sửa docs/, xoá và thêm dưới _acceptance/, sửa
      LO-TRINH.html), bộ đệm = git archive của commit ấy, gitCommitSha khác sha thẻ: thoát 0, không dòng ĐỎ, đúng một dòng
      "VÀNG may:" chứa «lệch chỉ ở tệp không chạy» và cả bốn tên tệp, TỔNG KẾT «ĐẠT»; đối chứng bộ đệm = archive của thẻ chạy
      trước, thoát 0, không có «lệch chỉ ở tệp không chạy». Chiều đỏ là LS-2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-2" — thêm một tệp scripts/ lệch: thoát 1, «khác tag: 1 tệp» kèm tên tệp scripts/, danh sách
      khác tag không kể bốn tệp không chạy, bốn tệp ấy có tên ở vế riêng; chỉ tệp scripts/ lệch: thoát 1, không vế «tệp không
      chạy»; "PASS: LS-2b" — scripts/docs/x.mjs, skills/a/docs/b.md, feature-loop/LO-TRINH.html lệch → mỗi ca thoát 1 với tên
      tệp trong «khác tag»; "PASS: LS-2b-dot" — hai bản sao lệnh bị tiêm (khớp «chứa» thay vì neo gốc · hằng thêm skills/)
      làm ca LS-2b ĐỎ trên mỗi bản sao.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-3" — clone --no-tags: thoát 2, TỔNG KẾT có «KHÔNG CHẠY ĐƯỢC», «ref không có: <thẻ>» và
      «git -C <clone> fetch --tags origin»; áp đúng lệnh in ra bằng bash rồi chạy lại: TỔNG KẾT «ĐẠT»; "PASS: LS-3-khong-remote"
      — thoát 2, «không có remote», không chứa «fetch»; "PASS: LS-3-sha" — «ref không có: <sha>», không chứa «fetch».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-4" — cây phụ lệch số, gốc khớp: thoát 0, dòng "VÀNG cay-phu:" có đường cây phụ, đường gốc,
      «lệnh sửa:»; không dòng «khác số» đếm bản ghi ấy; áp lệnh bằng bash rồi chạy lại: không dòng cay-phu, TỔNG KẾT «ĐẠT», số
      ĐẠT tăng đúng 1; sổ sau khác sổ trước đúng bốn trường của bản ghi cây phụ, bằng bốn trường của bản ghi gốc; "PASS: LS-4
      sao-luu" — đúng một tệp sao lưu, băm bằng sổ trước khi áp, chép đè thì sổ trở lại từng byte; "PASS: LS-4-dot" — hai bản
      sao lệnh bị tiêm (bỏ sao lưu · ghi rồi mới sao lưu) làm ca sao lưu ĐỎ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-5" — cây phụ cùng số trỏ bộ đệm lệch một tệp scripts/: thoát 1, dòng ĐỎ không còn «cài lại ở»
      kể cây phụ, có "VÀNG cay-phu:" kèm «lệnh sửa:»; áp lệnh rồi chạy lại: thoát 0, TỔNG KẾT «ĐẠT».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-6" — (a) gốc cũng cũ: dòng "VÀNG cay-phu:" có «nâng bản ghi gốc trước», không «lệnh sửa:»;
      (b) bản ghi kho khác và (c) cây phụ mà gốc không có bản ghi: không dòng cay-phu nào kể, được đếm ở «khác số … chưa nâng»;
      không dòng nào có «lệnh sửa:»; mã thoát bằng mã của cùng sổ bỏ ba bản ghi ấy.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.kiem_ban_cai_loi_sua
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-7" — đúng một dòng "VÀNG mo-coi:" đếm «2 bản ghi trỏ thư mục đã xoá», hai đường, «lệnh dọn:»;
      hai bản ghi không ở dòng nào khác; số ĐẠT bằng số khi bỏ chúng; TỔNG KẾT có «2 bản ghi mồ côi»; áp lệnh dọn rồi chạy lại:
      không dòng mo-coi, mọi bản ghi khác giữ từng trường; tệp sao lưu băm bằng sổ trước khi áp, phục hồi đúng từng byte;
      "PASS: LS-7-dot" — bản sao lệnh bỏ sao lưu của lệnh dọn làm ca sao lưu ĐỎ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
