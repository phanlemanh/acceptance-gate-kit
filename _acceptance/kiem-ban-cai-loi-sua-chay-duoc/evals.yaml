    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai-loi-sua.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LS-9 bash" và "PASS: LS-9 zsh" (hoặc dòng «bỏ qua zsh» khi máy không có zsh) — cấu hình và
      cây phụ có dấu cách + nháy đơn trong đường: lệnh sửa in ra thoát 0 ở mỗi vỏ, lần chạy lại không còn dòng cay-phu.
