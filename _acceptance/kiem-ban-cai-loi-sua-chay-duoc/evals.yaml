    expected: >
      exit 0; stdout có "PASS: LS-8" — với mỗi cấu hình giả của LS-1…LS-7, băm sổ cài và danh sách tên · cỡ · mtime dưới
      plugins/ trước và sau mỗi lần chạy lệnh kiểm (trước khi áp lệnh) bằng nhau; "PASS: LS-8-nhay" — hàm chụp đổi khi ca ghi
