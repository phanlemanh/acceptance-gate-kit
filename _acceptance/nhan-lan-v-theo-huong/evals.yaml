schema_version: 1
feature_slug: nhan-lan-v-theo-huong
# Ba lệnh, năm eval (eval chung lệnh chạy một lần). Mỗi lệnh chạy MỘT nhóm ca của
# tests/scripts/nlvh-the.test.mjs. Fixture do code sinh: kịch bản bash của
# tests/plugins/fixtures/viec-cua-anh-scenarios.sh (gate2-may-di-tiep · gate2-4loai), cộng
# review-findings + sổ khi ca cần. Mỗi ca chạy trên cây thật (đối chứng dương) và trên bản sao
# `scripts/` đã tiêm MỘT đột biến (thay nguyên văn đúng một chỗ, chứng mũi tiêm trúng trước khi
# chấm). Ca được gọi tên mà không in dòng PASS/FAIL → tệp thoát khác 0 với «ca không chạy: <tên>».
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.nlvh_the
    expected: >
      Ca NL-AC1-sach xanh trên kịch bản gate2-may-di-tiep: `routing.hoi` = [], `routing.bao` chứa
      «đi tiếp hay kéo lại», `one_shot` chứa «đi tiếp hay kéo lại: đi tiếp»; HTML: dòng «Trả lời
      mẫu» không chứa nhãn, VIỆC CỦA ANH chứa «kéo lại: nêu lý do», nút «Kéo lại»; «veto hay để
      yên» và nút «Veto» vắng trên cả HTML lẫn extract. Chiều đỏ: đột biến `nhan-cu` → «FAIL:
      NL-AC1-sach» kèm «nhan cu»; `ve-o-hoi` → «FAIL: NL-AC1-sach» kèm «routing.hoi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["scripts/gate-card.js", "tests/scripts/nlvh-the.test.mjs", "tests/plugins/fixtures/viec-cua-anh-scenarios.sh"]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.nlvh_the
    expected: >
      Ca NL-AC2-con-muc xanh: hồ sơ máy-đi-trước có hai mục Ngoài hợp đồng đã định đoạt ở sổ gate2
      → `routing.hoi` = ["Ngoài-1","Ngoài-2"] đúng thứ tự, `routing.bao` chứa nhãn, `one_shot` kết
      bằng «đi tiếp hay kéo lại: đi tiếp», nhãn dòng «Trả lời mẫu» bằng `routing.hoi`. Đối chứng
      tiền đề: cùng hồ sơ bỏ dòng sổ → thẻ về «ký hay trả» (chứng fixture đúng là máy-đi-trước).
      Chiều đỏ: `ve-o-hoi` → «FAIL: NL-AC2-con-muc».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["scripts/gate-card.js", "tests/scripts/nlvh-the.test.mjs"]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.nlvh_im
    expected: >
      Ca NL-AC3-im xanh: hai bản `git archive` trọn `scripts lib skills` — TRƯỚC ở cha commit đầu,
      SAU ở commit cuối chạm scripts/gate-card.js có dấu «(nhan-lan-v-theo-huong)» (sha là đầu ra
      `git log --grep`) — dựng thẻ trên kịch bản gate2-4loai VÀ mọi hồ sơ thật trong _acceptance/
      của kho; mỗi thẻ thuộc đúng một vế: bằng nhau từng byte (HTML + extract), hoặc thẻ cũ có
      «veto hay để yên» trong hoi và extract mới = extract cũ biến đổi đúng ba chỗ. gate2-4loai ở vế
      một, hoi chứa «ký hay trả». In tập vế hai («rỗng» nếu rỗng) và tên hồ sơ bản cũ không dựng
      được. Đối chứng đặc hiệu: kịch bản gate2-may-di-tiep phải ở vế HAI (chứng phép so nhìn thấy
      thay đổi của vòng). Không tìm được commit (bản sao nông) → «FAIL: NL-AC3-im» có tên.
      Chiều đỏ: đột biến `lech-the-thuong` trên bản SAU (đổi «Ký duyệt» thành «Ký») → «FAIL:
      NL-AC3-im» kèm «gate2-4loai».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["scripts/gate-card.js", "tests/scripts/nlvh-the.test.mjs"]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.nlvh_the
    expected: >
      Ca NL-AC4-khep xanh với ma trận viết trước ba hàng (số assert = số hàng), mỗi hàng dựng từ
      kịch bản gate2-may-di-tiep: (1) + dòng sổ `type: nghi` · (2) status da-cham-boi-thuc-te + dòng
      quan sát đủ vế · (3) `veto_state: da-veto` + dòng sổ `type: veto`. Cả ba: `routing.bao` không
      chứa nhãn, HTML không chứa «máy đã đi tiếp — không cần trả lời»; hàng 1–2: `hoi` rỗng,
      `one_shot` null; hàng 3: `hoi` chứa «ký hay trả». Đối chứng tiền đề: hồ sơ gốc không thêm gì
      thì `bao` chứa nhãn. Chiều đỏ: `khep-ro` (bỏ bộ lọc ở DA_KHEP) → «FAIL: NL-AC4-khep» kèm
      «nghi: routing.bao». Hàng 2 là lưới hồi quy, không có đột biến riêng: đo 04/10 hồ sơ khép
      bằng thực tế không đi nhánh máy-đi-trước nên nhãn không tới `bao` — đột biến «lọc chỉ khi
      NGHI» là đột biến tương đương (gap-probe F2, cột Xử lý).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["scripts/gate-card.js", "tests/scripts/nlvh-the.test.mjs"]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.nlvh_luat
    expected: >
      Ca NL-AC5-luat xanh: khối GATE-ONESHOT-SLOTS (rút qua marker) có «g2 đi tiếp hay kéo lại»,
      không có «g2 veto hay để yên»; khối GATE-ONESHOT-LAN-V rút qua marker, rút rỗng → đỏ; ma trận
      viết trước sáu dạng (kéo lại: X · đi tiếp hay kéo lại: kéo lại: X · veto: X → kéo-lại; đi tiếp
      hay kéo lại: đi tiếp · đi tiếp · để yên → đi-tiếp) mỗi dạng có đúng một dòng mang đúng hành vi
      (số assert = số hàng); khối nêu «da-veto», «type: veto», «Veto:» và «không ghi gì»;
      commands/signoff.md chứa tên khối «GATE-ONESHOT-LAN-V». Chiều đỏ: bản sao luật đổi hành vi
      dòng «để yên» thành kéo-lại → «FAIL: NL-AC5-luat» kèm «để yên»; gỡ marker → kèm «rut rong».
      Và khối P192 của tests/plugins/run-tests.sh (chạy riêng bằng ONLY_BLOCK) xanh: thẻ
      máy-đi-trước in nhãn mới, round-trip thẻ↔SLOTS khớp hai hướng.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["skills/acceptance/references/human-facing-language.md", "commands/signoff.md", "tests/scripts/nlvh-the.test.mjs", "tests/plugins/run-tests.sh"]
