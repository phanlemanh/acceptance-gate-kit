schema_version: 1
feature_slug: s4-scope-triage
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T1: harness vm-realm, stand-in agent trả finding high + triage inContract:true/acRef:AC-x, mọi eval xanh → verdict 'REJECT', finding nằm trong rejectFindings; đối chứng dương WT-T1b: cùng cấu hình nhưng severity medium → verdict 'PASS'"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T2: finding high + inContract:false, evals xanh → verdict 'PASS', rejectFindings KHÔNG chứa nó, prompt synthesize chứa chỉ dẫn section 'Ngoài hợp đồng' kèm proposal của finding"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T3: finding medium + inContract:true → không REJECT, finding đi vào ngăn 'Trong hợp đồng' kèm acRef trong dữ liệu synthesize"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T4: stand-in agent triage ném lỗi cả 2 lượt (retry) → triageFailed:true, verdict KHÔNG REJECT dù finding high, mọi finding vào ngăn 'Chưa phân loại (triage-failed)'; WT-T4c: args.contractPath trỏ file không tồn tại → CÙNG hành vi triageFailed (không spawn agent trên scope rỗng, không REJECT); đối chứng dương WT-T4b: triage sống + contract đọc được → triageFailed:false, không có ngăn đó"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T5: 1 eval FAIL + finding high in-contract + finding high out-of-contract → verdict 'REJECT', rejectFindings chứa ĐÚNG finding in-contract, KHÔNG chứa finding out-of-contract (ghim cả hai chiều — chốt chặn spiral)"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T6: finding unverified:true (refuter chết) → KHÔNG xuất hiện trong input của stand-in triage agent, vẫn nằm ngăn 'Chưa adversarial-verify' — regression guard hành vi cũ"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T7a: 2 finding file ngoài union paths của evals → coverageCluster {count:2, total, files} + chỉ dẫn dòng 'dừng và quyết' trong prompt synthesize; WT-T7b: không eval nào có paths → coverageCluster null + note 'cluster: n-a'; WT-T7c (âm): finding trong vùng phủ → không flag; WT-T7d (biên): ĐÚNG 1 finding ngoài vùng phủ → coverageCluster null, không dòng cờ — ngưỡng cụm là ≥2"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P52: dựng workspace fixture rồi chạy scripts/gate-card.js và ĐO ĐẦU RA render — khối 'Ngoài hợp đồng' xuất hiện, in câu ngôn ngữ sản phẩm (trường plain) chứ KHÔNG in title kỹ thuật của reviewer (ghim rmSync/globToRe/SyntaxError phải vắng), ba nhãn lựa chọn RÚT TỪ commands/acceptance-card.md phải khớp renderer, có dòng cờ cụm, không lộ đường dẫn file; file review-findings.md thế hệ CŨ → không render khối và không làm hỏng thẻ. Đối chứng dương: đổi nhãn trong renderer, hoặc cho renderer rơi về title → case đỏ đúng thông điệp"
    paths: [scripts/gate-card.js, lib/out-of-contract.js, commands/acceptance-card.md, codex/acceptance-gate/skills/acceptance-card/SKILL.md, tests/plugins/**]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P54: codex feature-loop-codex SKILL.md vùng S4 chứa đủ 3 ngăn triage + luật 'chỉ in-contract high mới REJECT' + fail-toward-human khi triage hỏng (ghim từng chuỗi khóa); bản sao bị xoá luật → đỏ"
    paths: [codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md, tests/plugins/**]
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T8: pin GOLDEN CLOSED-LIST tập section/field mà prompt synthesize chỉ dẫn cho evidence-report.md (danh sách đóng so BẰNG, không grep-vắng-chuỗi) — triage không có mặt trong list; đối chứng dương WT-T8b: tiêm chỉ dẫn 'thêm section Triage vào evidence-report' vào bản sao workflow → case ĐỎ với thông điệp lệch golden-list; hooks suite chạy qua suite_keys xanh nguyên trạng"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E11
    criterion: AC-11
    executor: judgment
    question: "Đọc khối 'Ngoài hợp đồng' render theo chỉ dẫn card từ fixture mẫu: một người quyết kinh doanh không đọc code có hiểu finding là thật-nhưng-ngoài-phạm-vi-đã-duyệt, và phân biệt được 3 lựa chọn (Known limits / contract mới / nâng scope sửa ngay) không? Có jargon kỹ thuật nào lọt vào không?"
    inputs: [_acceptance/s4-scope-triage/evidence/out-of-contract-card-sample.md]
  - id: E12
    criterion: AC-11
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P53 (gác cổng cho judge E11): SINH LẠI fixture bằng tests/plugins/fixtures/render-out-of-contract-block.sh (chạy chính gate-card.js) trong cùng lần chạy rồi so BYTE-ĐỐI-BYTE với evidence/out-of-contract-card-sample.md — khuôn TE17/RL10; cộng kiểm bản render không chứa jargon kỹ thuật. Đối chứng dương: sửa tay một chữ trong fixture → đỏ đúng thông điệp TRÔI"
    paths: [scripts/gate-card.js, lib/out-of-contract.js, commands/acceptance-card.md, tests/plugins/**, _acceptance/s4-scope-triage/evidence/out-of-contract-card-sample.md]
  - id: E13
    criterion: AC-12
    executor: script
    cmd: config:executors.test.workflows
    expected: "case WT-T9: round BLOCKED (suite command cannotRun) + finding high inContract:true → verdict ghim 'BLOCKED', rejectFindings không kích hoạt fix; đối chứng dương WT-T9b: cùng fixture bỏ điều kiện BLOCKED → verdict 'REJECT'"
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/**]
  - id: E14
    criterion: AC-13
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P51: grep .github/workflows/gate.yml có step 'bash tests/workflows/run-tests.sh' VÀ _acceptance/config.yaml có executors.test.workflows + dòng đó trong feature_loop.suite_keys; đối chứng dương: xoá dòng step trong bản sao gate.yml → case đỏ đúng thông điệp"
    paths: [.github/workflows/gate.yml, _acceptance/config.yaml, tests/plugins/**]
  - id: E15
    criterion: AC-14
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P55 (ROUND-TRIP writer↔reader): RÚT khuôn tài liệu từ chính feature-loop/workflows/acceptance-verify.js (khối giữa hai marker OOC-ITEM-TEMPLATE), thay placeholder bằng dữ liệu mẫu, rồi cho lib/out-of-contract.js parse — phải ra đủ title/file/severity/proposal và plain KHÁC RỖNG. TUYỆT ĐỐI không tự viết fixture theo khuôn parser (đó là lỗi làm 3 round liên tiếp xanh giả). Đối chứng dương: đảo dòng plain lên trước dòng title trong tài liệu dựng ra → case ĐỎ đúng thông điệp parse-không-ra"
    paths: [feature-loop/workflows/acceptance-verify.js, lib/out-of-contract.js, tests/plugins/**]
  - id: E16
    criterion: AC-15
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P56: codex feature-loop SKILL.md vùng ghi review-findings.md phải chỉ dẫn ĐÚNG khuôn AC-14 — ghim chuỗi 'Người dùng thấy gì' VÀ cấu trúc '- **<title>**' + dòng khoá thụt vào; đối chứng đột biến phải CHẠM được file (bản sao khác bản gốc) mới tính"
    paths: [codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md, tests/plugins/**]
