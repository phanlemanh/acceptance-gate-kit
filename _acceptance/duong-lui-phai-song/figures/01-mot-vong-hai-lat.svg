<text x="608" y="311" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỜNG CẮT</text>
<text x="572" y="336" fill="var(--ink)" font-size="12" font-weight="600">Thu phạm vi: ship lát 2, bỏ lát 1</text>
<text x="572" y="352" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace">AC-1..AC-5 + AC-10..12 đi tiếp</text>
<text x="572" y="364" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace">AC-6..AC-9 về ô — khai ở Out of scope</text>
<text x="40" y="316" fill="var(--accent-text)" font-size="14" font-family="'Instrument Serif', 'Lora', serif" font-style="italic">«Lát 2 làm trước vì đau đã đo: 5 CI đỏ, 1 hồ sơ mục rỗng, bế tắc làn.»</text>
<text x="40" y="340" fill="var(--accent-text)" font-size="14" font-family="'Instrument Serif', 'Lora', serif" font-style="italic">Đường cắt khai trước khi làm — chạm trần thì lát 1 về ô, không chốt sau.</text>
