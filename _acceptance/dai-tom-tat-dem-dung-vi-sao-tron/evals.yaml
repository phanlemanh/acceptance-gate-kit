schema_version: 1
feature_slug: dai-tom-tat-dem-dung-vi-sao-tron
# Ca đo sống ở tests/scripts/dai-tom-tat-dem-dung.test.mjs (DD-1..DD-6, DD-8) — executor
# `executors.test.dai_tom_tat_dem_dung` thêm ở S3 — và tests/scripts/dai-tom-tat-sau-kho.mjs (DD-7, DD-9: cần
# sáu kho trên máy nên KHÔNG mang đuôi .test.mjs, không vào suite; kho hay mã vắng → ĐỎ nêu tên kho) — executor
# `executors.test.dai_tom_tat_sau_kho`. Kho thử do mã sinh trong lượt (thư mục tạm, đường suy từ vị trí tệp ca),
# ô cơ hội do CHÍNH `lo-trinh.mjs --mo-o` ghi, khối ghim lại rút từ khuôn REPIN-TEMPLATE của SKILL feature-loop
# (đọc, không sửa). Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao cây có ho-so-tom-tat.cjs / evidence-page.js bị
# tiêm, SAU khi bản lành xanh trên cùng kho thử, và ghim thông điệp rút từ đầu ra của hàm đo. Mỗi eval ghim
# đúng dòng "PASS: DD-…".
evals:
