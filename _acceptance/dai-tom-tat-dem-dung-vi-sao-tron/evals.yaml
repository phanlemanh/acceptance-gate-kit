      chua_lam ở trang hồ sơ (bộ đọc HTML độc lập trong ca) VÀ ở khối (docDuLieu) lần lượt == «3 · 4 · 5 · 3 ·
      2 · 0 giới hạn đã biết», mục gioi-han của trang == đúng các câu viết sẵn theo thứ tự; số ca in ra == 6.
      Và "PASS: DD-1-do" — bản sao chỉ đọc MỘT dòng của đầu đoạn văn: CHÍNH hàm đo trả lỗi nêu ca «(a)»;
      "PASS: DD-1-do-dan" — bản sao không cho đoạn dẫn: CHÍNH hàm đo trả lỗi nêu ca «(b)»; "PASS:
      DD-1-do-dau-doan" — bản sao nhận đầu đoạn ở bất kỳ dòng nào: CHÍNH hàm đo trả lỗi nêu ca «(f)».
