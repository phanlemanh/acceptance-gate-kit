<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường lỗi tới người ký</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng</p>
    <h1>Đường lỗi tới người ký</h1>

    <svg viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-ink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2d3142"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first, so nodes sit above them -->
      <line x1="400" y1="88" x2="400" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="500" y1="188" x2="640" y2="188" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="400" y1="248" x2="400" y2="328" stroke="#2d3142" stroke-width="2" marker-end="url(#arrow-ink)"/>
      <line x1="400" y1="376" x2="400" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="400" y1="480" x2="400" y2="528" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Start -->
      <rect x="240" y="40" width="320" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="40" width="320" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt chấm tìm thấy lỗi trong hợp đồng</text>

      <!-- Decision -->
      <polygon points="400,128 500,188 400,248 300,188" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rẽ theo mức lỗi</text>

      <!-- Severe branch -->
      <rect x="532" y="160" width="72" height="20" rx="2" fill="#f5f5f5"/>
      <text x="568" y="175" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Mức nặng</text>

      <rect x="640" y="160" width="200" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="640" y="160" width="200" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tự trả lại:</text>
      <text x="740" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">máy sửa rồi chấm lại</text>

      <!-- Medium branch: the owner's question sits here -->
      <path d="M 240 288 L 392 288" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="400" cy="288" r="8" fill="#2d3142"/>
      <text x="400" y="292" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">?</text>

      <rect x="416" y="276" width="60" height="20" rx="2" fill="#f5f5f5"/>
      <text x="420" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Mức vừa</text>

      <text x="40" y="280" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Câu hỏi: giữ nhánh này,</text>
      <text x="40" y="300" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">hay gộp nó vào nhánh tự trả lại</text>

      <!-- Verdict -->
      <rect x="300" y="328" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="328" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phán quyết PASS</text>

      <!-- Focal: what this round adds -->
      <rect x="240" y="424" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="424" width="320" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="400" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ và trang hiện lỗi, bỏ lời mời ký nhanh</text>
      <text x="576" y="456" fill="#ba4513" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">phần vòng này thêm</text>

      <!-- End -->
      <rect x="240" y="528" width="320" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="528" width="320" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người ký quyết: ký kèm lỗi, hay trả lại</text>

      <!-- Footer strip -->
      <line x1="40" y1="616" x2="840" y2="616" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="640" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Tiêu chí liên quan: AC-1, AC-9, AC-10</text>
    </svg>
  </div>
</body>
</html>
