    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: script
    cmd: node tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs
    paths: [feature-loop/scripts/repin-lane.mjs, docs/adr/0019-ban-ghi-dinh-tuyen-la-vat-t1-may-sinh.md, tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs]
    expected: >
      Đầu ra có dòng PASS của ca «DN5 hai gioi han con lai duoc khai kem nguong» — khối
      SKIP-UNCHANGED-PREDICATE và ADR nêu đủ (a) tệp untracked và (b) lệch glob bash/JS,
      mỗi cái kèm một ngưỡng đang đếm. Chiều đỏ: gỡ một trong hai lời khai → ca ĐỎ gọi
      tên giới hạn bị bỏ.
      Chiều IM (dưới ngưỡng → KHÔNG nổ): thêm một lời khai giới hạn THỨ BA có cùng khuôn
      (giới hạn + ngưỡng) → ca vẫn XANH; và sửa văn ở khối SKIP-UNCHANGED-PREDICATE mà
      KHÔNG chạm hai lời khai → vẫn XANH. Ca đo SỰ CÓ MẶT của từng lời khai kèm ngưỡng,
      không ghim số lượng lời khai hay chuỗi cố định của cả khối.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
