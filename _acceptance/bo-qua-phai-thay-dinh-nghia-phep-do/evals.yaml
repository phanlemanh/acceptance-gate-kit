schema_version: 1
feature_slug: bo-qua-phai-thay-dinh-nghia-phep-do
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: node tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs
    paths: [feature-loop/scripts/repin-lane.mjs, tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs]
    expected: >
      Exit 0 và đầu ra có dòng PASS của ca «DN1 doi gia tri mot khoa executors trong
      _acceptance/config.yaml -> lan KHONG bo qua, chay tron bang lenh MOI». Chiều đỏ ghim
      bằng hành vi, không bằng chuỗi: fixture đổi executor từ một lệnh XANH sang một lệnh
      ĐỎ; làn phải chạy và trả LÀN ĐỎ. Nếu vị từ vẫn loại trừ _acceptance/** thì làn bỏ
      qua và ca ĐỎ vì «skipped=true trên cây đã đổi định nghĩa». Cùng tệp ca: DN2 (đổi
      evals.yaml của hồ sơ — thêm một eval mới → làn chạy, eval mới có trong evals_exit).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-1
    executor: script
    cmd: node tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs
    paths: [feature-loop/scripts/repin-lane.mjs, tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs]
    expected: >
      Đầu ra có dòng PASS của ca «DN3-IM ma tran 4 o cu KHONG mat o nao» — bốn ô của SK1b
      (_acceptance/<slug>/evidence-report.md sâu 2 · pkg/a/_acceptance/… monorepo · tệp
      t1_skip_globs · _acceptance-x/ tiền tố giả) giữ nguyên kết quả sau khi vị từ đổi.
      Chiều đỏ: một mutant nới vị từ cho mọi tệp dưới _acceptance/ đi vào diện «vật đổi»
      → ba ô đầu lật sang «không bỏ qua» và ca ĐỎ gọi tên ô lật.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: script
    cmd: node tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs
    paths: [feature-loop/scripts/repin-lane.mjs, tests/scripts/bo-qua-dinh-nghia-phep-do.test.mjs]
