schema_version: 1
feature_slug: workspace-reader-unification

# Luat chung cho MOI case duoi day (CLAUDE.md — assertion am-tinh-mot-minh la
# assertion khong song): moi ca ket luan tu "phai bao do" PHAI di kem doi chung
# duong trong CUNG mot case — ban nguyen ven XANH truoc, roi ban bi tiem moi
# duoc tin la DO — va phai ghim DUNG THONG DIEP mong doi, khong chi ma thoat.
# Fixture do CODE SINH trong chinh lan chay; duong dan suy tu vi tri script.
#
# `expected` co Y viet MOT DONG (chuoi trich dan), khong dung block scalar `>-`:
# eval-coverage-lint.js doc file nay bang parser theo dong, gap `>-` la lay
# duoc dung hai ky tu do — moi chu con lai tang hinh, va W1/W3/W4 im lang
# thanh xanh gia. Xem co do o Cong 1.

