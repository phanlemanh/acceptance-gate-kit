  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    expected: "exit 0; case P143 xanh — tich Descartes TAP FILE (rut tu bang luat trong lib, khong chep tay) x 4 hinh dang hong (fm khong doc duoc / thieu field ket luan / gia tri ngoai enum / khai da xong ma thieu han file) x trang thai contract; moi to hop bo quet va ban do cung goi hong-hay-lanh VA cung neu ten file; case ASSERT so to hop duyet == tich so da khai va IN DANH SACH id tung to hop — nho hon ky vong la DO kem ten to hop vang, chi log tong ma khong assert cung la DO"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
