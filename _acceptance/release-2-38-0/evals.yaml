      tri-thuc/.claude-plugin/plugin.json» — tập tệp đổi dưới `dieu-phoi/`, `road-map/` và `tri-thuc/` từ `39fa45cc` tới
      HEAD bằng đúng ba manifest, như CHANGELOG 2.38.0 kể. Chiều đỏ: cùng lệnh trước commit nâng số in rỗng, thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rel2380_lop_chep
    expected: >
      Exit 0 và dòng «XANH: đúng 0 tệp đổi như ghi chú 2.38.0 kể» — rút danh sách chép từ khối INIT-CI-COPY-LIST (36 tệp),
      rút danh sách mong đợi từ gạch «- **Lớp chép CI:…» của mục «## 2.38.0» trong CHANGELOG.md (gạch nói «không chép
      gì», không kể tệp nào), và tập tệp đổi byte từ `39fa45cc` tới HEAD RỖNG. Chiều đỏ trên cùng tệp lệnh: mốc `4f891b07`
      (thẻ v2.36.0) với mục 2.38.0 thoát 1 «ĐỎ: tệp đổi mà ghi chú KHÔNG kể: lib/evidence-core.cjs
      scripts/pre-merge-check.sh»; đối chứng dương trên dữ liệu cũ: mốc `4f891b07` với mục 2.37.0 vẫn thoát 0 như bản
      release-2-29-0 (sổ quyết định, dòng S1).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-38-0/contract.md, _acceptance/ban-do-khuon-roi-nhom/contract.md, _acceptance/ban-do-khuon-roi-nhom/opportunity.md, _acceptance/ban-do-khuon-roi-nhom/design.md, _acceptance/khoi-khuon-tren-the-cong/contract.md, _acceptance/khoi-khuon-tren-the-cong/opportunity.md, _acceptance/khoi-khuon-tren-the-cong/design.md, GUIDE.md, skills/acceptance/references/ban-do-khuon-template.md, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-38-0 và mục «## 2.38.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép.
      (0) Ở hai mục con: mỗi câu mô tả vòng (dòng «Gốc:» đọc ở `opportunity.md`, gạch «Vật:» chép dòng feature của hợp
      đồng, chi tiết vật đọc ở hợp đồng và `design.md`, giới hạn trích trong ngoặc «») có phải chữ của hồ sơ ấy — không
      tóm tắt, không nói rộng hơn — và số giới hạn đã khai (số mục chọn ở Cổng Bằng chứng) có khớp Notes của hợp đồng
      không? (1) Lời về cờ `--nhom`, `--nhom-moi`, `--gan` của bước nạp, khoá `chon` trong `khuon-nap.json`, khối «Khuôn»
      và các cờ trên thẻ Cổng Phạm vi, các dòng lệch trên thẻ Cổng Bằng chứng, và «kho không khai bản đồ thì thẻ không
      đổi» có khớp hợp đồng khoi-khuon-tren-the-cong và GUIDE §5.2 không? (2) Lời về mục `ngoai_le` không có `khoi` là
      tệp rời nhóm, `khoi: []`, `khoi:` để trống, `khoi: ""` giữ nghĩa cũ, tệp rời vẫn bị chấm theo nhóm thật, lưới
      `s4-args` và cờ thẻ với tệp đã rời nhóm, cùng số TRƯỚC/SAU trên bản sao hai kho có khớp hợp đồng
      ban-do-khuon-roi-nhom, design.md của nó, khuôn tệp ban-do-khuon-template.md và GUIDE §5.2 không? (3) Lời về lớp
      chép CI («không chép gì») có đúng với khối INIT-CI-COPY-LIST của commands/acceptance-init.md không — không tệp nào
      trong khối được kể là đổi? (4) Đoạn «Vì sao 2.38.0» và «Ai bị ảnh hưởng» có nói thẳng các đổi hành vi chạm kho
      đang dùng — tệp đã khai rời nhóm thôi bị chấm lệch hay nợ cũ theo nhóm ấy và thôi chặn lượt chấm S4; hồ sơ mặt
      người nhìn ở kho khai bản đồ mà S1 chưa ghi nhóm thì thẻ Cổng Phạm vi có cờ — và nói đúng lý do cắt trước đợt
      nen-thiet-ke-0411 như Context của hợp đồng release-2-38-0 kể, và căn cứ chọn minor (bề mặt mới) có đúng với nếp đã
      khai ở đoạn «Vì sao 2.37.0» không? Trả PASS khi cả năm vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
