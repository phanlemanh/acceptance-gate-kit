    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ `39fa45cc..HEAD`, suy từ kho bằng QUAN HỆ
      (bỏ hồ sơ mốc `release-*`), BẰNG tập kể trong Context (ban-do-khuon-roi-nhom, khoi-khuon-tren-the-cong). Chiều đỏ trong chính lệnh: slug thừa và slug thiếu đều in tên, thoát 1.
