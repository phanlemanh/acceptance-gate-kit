# Evals — het-gio-khong-phai-truot
# Phép đo thật sống trong tests/workflows/acceptance-verify.test.mjs (W25–W27,
# mutant srcOverride chạy chiều đỏ trong CÙNG lượt). Răng hồ sơ ghim ĐÚNG dòng
# case trong stdout suite (nếp p194 — không tin exit code trọn suite: trên
# diffBase suite cũng xanh nên mã thoát không phân biệt cây cũ/mới) + kiểm mã
# thoát và dòng tổng kết. E7 = trọn suite tồn kho cho AC-7. Chân tồn-kho «không
# sửa case cũ» đã GỠ 18/08 (owner gật thu phạm vi) — xem Known limits.

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.script.rang_hgkpt
    expected: "răng ghim dòng 'PASS: W25 machine prompt chua TOOL-KILL-RULE' + dòng 'PASS: W25 rule rut tu marker' — chuỗi luật RÚT TỪ MARKER trong source, không chép tay, nên prompt và luật không trôi khỏi nhau. Chiều đỏ chạy cùng lượt qua chính hàm kiểm của răng (mũi đổi tên pin trong bản sao tiêm → 'thieu dong PASS: ...'); chiều đỏ của chính W25 nằm trong suite (3 mutant lane)."
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/acceptance-verify.test.mjs, _acceptance/het-gio-khong-phai-truot/rang.sh]
  - id: E2
