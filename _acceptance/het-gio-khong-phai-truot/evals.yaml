    expected: "răng ghim cặp: 'PASS: W27 baseline killed -> n-a' (không red giả, không vào nonDiscriminating) VÀ 'PASS: W27 doi chung: baseline exit 1 that -> red'."
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/acceptance-verify.test.mjs, _acceptance/het-gio-khong-phai-truot/rang.sh]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.workflows
    expected: "trọn suite workflows tồn kho xanh (exit 0) — mọi field mới optional; chiều đỏ của tương thích là bất kỳ case W01–W24 nào đỏ."
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/acceptance-verify.test.mjs, tests/workflows/harness.mjs]
  - id: E8
    criterion: AC-7
    executor: test
    cmd: config:executors.script.rang_hgkpt
    expected: "chân tồn-kho của răng phủ MỌI khuôn đặt tên case của bản diffBase (git show, đếm nguồn trong cùng lần chạy, không hardcode): (a) tên nháy đơn → assert từng tên còn nguyên văn trong source VÀ có dòng 'PASS: <tên>' khớp TRỌN dòng trong stdout, in 'PASS: TON-KHO <n> case cu nguyen van'; (b) tên template literal (sinh lúc chạy, không có dòng PASS để ghim) → assert thân template còn nguyên văn, in 'PASS: TON-KHO-TPL <m> case ten dong nguyen van'; (c) đóng không gian bằng đẳng thức 'PASS: TON-KHO-MA-TRAN <tổng> callsite = <n> nhay-don + <m> backtick' — khuôn thứ ba chưa phủ thì ĐỎ, kèm tự-phá-thử chạy cùng lượt 'PASS: TON-KHO-MA-TRAN tu-pha-thu: khuon thu ba bi bat'. Chiều đỏ đã chạy thật: sửa/xoá case nháy đơn → 'TON-KHO: case cu bi sua/xoa'; sửa case backtick → 'TON-KHO-TPL: case cu (ten dong) bi sua/xoa'."
    paths: [feature-loop/workflows/acceptance-verify.js, tests/workflows/acceptance-verify.test.mjs, _acceptance/het-gio-khong-phai-truot/rang.sh]
