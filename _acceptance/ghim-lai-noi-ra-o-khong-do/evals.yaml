      `chot_may.ac_khong_mo` phải BẰNG danh sách diễn giải dựng bởi một BỘ ĐỌC evals.yaml
      ĐỘC LẬP trong chính ca (không gọi lib sản phẩm — hai bản trôi khỏi nhau là phải đỏ),
