      exit 0, ghi; dòng repin evals_not_machine_touched = ["E6"] (mốc diff = pin cũ, không
      phải HEAD~1); và SECTION mang hậu tố đã hứa — chuỗi kỳ vọng KHÔNG gõ lại mà RÚT từ
      HỢP ĐỒNG (dòng "- AC-4:" của contract.md, chuỗi trong dấu huyền mở đầu " · "), rút
      được 0 thì ca NỔ có tên. Khuôn cũ chỉ đọc khoá JSON nên xoá trắng hậu tố vẫn xanh —
      đó là finding lượt chấm 3. Lượt ghim kế sau khi chỉ commit tệp không khớp glob → khoá
      VẮNG HẲN và section KHÔNG mang hậu tố ấy (đối chứng cùng chuỗi rút). Tệp đổi dưới
      _acceptance/<slug>/rang/ khớp glob → vẫn tính chạm. E12 không paths → không bao giờ
      vào khoá. Chiều đỏ (bản sao làn): bỏ bước so diff → ĐỎ ghim "touched vang du diff
      cham"; đổi mốc diff thành HEAD~1 → ĐỎ ghim "moc diff khong phai pin cu"; bỏ ${veCham}
      khỏi khuôn section (khoá JSON còn nguyên) → ĐỎ ghim "section thieu hau to diff cham
      vat".
    paths:
      - "feature-loop/scripts/repin-lane.mjs"
      - "tests/scripts/repin-lane-noi-ra.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

