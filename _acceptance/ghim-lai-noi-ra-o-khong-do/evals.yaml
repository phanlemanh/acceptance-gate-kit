      dòng lệnh đếm tự thoả): neo vào ĐOẠN VĂN "**Giới hạn khai, một ngưỡng ĐẾM ĐƯỢC:**" và
      CẮT ở khối ```bash, rồi đòi đoạn văn ấy gọi tên mọi khoá MỚI — danh sách khoá không gõ
      tay mà là HIỆU TẬP KHOÁ giữa dòng repin do làn nay ghi và dòng do làn mốc 2826f807 ghi
      trên cùng fixture; hiệu rỗng thì ca NỔ có tên ("rut 0 khoa moi"). Phép khớp phải có
      RANH GIỚI (tên khoá trong dấu huyền), KHÔNG `includes` trần — `evals_not_machine_touched`
      bao `evals_not_machine` nên containment làm khoá ngắn không bao giờ được kiểm thật
      (nâng phạm vi 20/09, Ngoài-11: đã chứng khuôn cũ MÙ — gỡ khoá ngắn khỏi đoạn văn mà
      giữ khoá dài thì bản `includes` trần vẫn PASS). GUIDE mang một lệnh
      đếm ngưỡng (grep khoá trên _acceptance/*/run-log.jsonl); ca RÚT lệnh từ GUIDE lúc chạy,
      chạy thật trong kho tạm có đúng 1 hồ sơ mang khoá → in "1"; kho không hồ sơ nào → "0".
      Chiều đỏ: bản sao GUIDE gỡ lệnh đếm → ĐỎ ghim "GUIDE khong con lenh dem"; bản sao GUIDE
      đổi neo đoạn văn → ĐỎ ghim "GUIDE thieu doan gioi han"; bản sao SKILL gỡ câu → ĐỎ ghim
      "SKILL thieu cau touched"; bản sao LÀN đổi tên khoá (round-trip: tài liệu phải theo
      writer) → ĐỎ ghim "GUIDE thieu cau touched"; bản sao GUIDE gỡ riêng khoá NGẮN mà giữ
      khoá DÀI → ĐỎ ghim "GUIDE thieu cau touched" (chiều đỏ của phép khớp-có-ranh-giới).
    paths:
      - "feature-loop/skills/feature-loop/SKILL.md"
      - "GUIDE.md"
      - "tests/scripts/repin-lane-noi-ra.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: script
    cmd: config:executors.script.gnro_diff_cham
    expected: >-
      Ca GN06; stdout có đúng một dòng kết quả, mang "GN06". paths E6 = ["apps/x/**",
