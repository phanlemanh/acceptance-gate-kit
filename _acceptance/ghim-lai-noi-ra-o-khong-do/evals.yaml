      - "feature-loop/skills/feature-loop/SKILL.md"
      - "tests/scripts/repin-lane-noi-ra.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: script
    cmd: config:executors.script.gnro_guide_nguong
    expected: >-
      Ca GN05; stdout có đúng một dòng kết quả, mang "GN05". Vế SKILL: neo vào câu "Giới hạn
