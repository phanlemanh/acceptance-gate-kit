<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng định tuyến</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1480px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ngoai-n-tu-dinh-tuyen</p>
    <h1>Luồng định tuyến: từ S4 PASS tới làn V</h1>

    <svg viewBox="0 0 1464 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #4f5d75; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #4f5d75; }
          .mi { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500; fill: #2d3142; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .ea { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #ba4513; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.02em; fill: #4f5d75; }
          .ac { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- S4 PASS → bên ghi -->
      <line x1="168" y1="200" x2="208" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- bên ghi → tắt -->
      <line x1="308" y1="264" x2="308" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- bên ghi → bật + đủ điều kiện → điểm tách theo mục -->
      <line x1="408" y1="200" x2="588" y2="200" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- tách → mục known-limits / wont-fix -->
      <path d="M592 196 V104 Q592 96 600 96 H632" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tách → mục new-contract -->
      <path d="M592 204 V296 Q592 304 600 304 H632" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- dòng sổ máy → bộ đọc làn V (đỉnh trên) -->
      <path d="M872 96 H1000 Q1008 96 1008 104 V136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- để người → bộ đọc làn V (đỉnh trái) -->
      <path d="M872 304 H888 Q896 304 896 296 V208 Q896 200 904 200 H912" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- bộ đọc → làn V -->
      <line x1="1104" y1="200" x2="1248" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- bộ đọc → mời ký Cổng 2 -->
      <line x1="1008" y1="264" x2="1008" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector labels -->
      <rect x="428" y="176" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="188" class="al" text-anchor="middle">bật + hồ sơ đủ điều kiện</text>
      <rect x="478" y="208" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="500" y="220" class="ac" text-anchor="middle">AC-4</text>

      <rect x="316" y="296" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="320" y="308" class="al">tắt</text>
      <rect x="316" y="316" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="338" y="328" class="ac" text-anchor="middle">AC-1</text>

      <rect x="1112" y="176" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1176" y="188" class="al" text-anchor="middle">mọi mục đã định tuyến</text>

      <rect x="1016" y="296" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1020" y="308" class="al">còn mục của người</text>

      <!-- ===== Điểm tách theo từng mục ===== -->
      <circle cx="592" cy="200" r="4" fill="#2d3142"/>

      <!-- ===== Bắt đầu: S4 PASS ===== -->
      <rect x="40" y="172" width="128" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="172" width="128" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="104" y="196" class="nm" text-anchor="middle">S4 PASS</text>
      <text x="104" y="214" class="sb" text-anchor="middle">hồ sơ verified</text>

      <!-- ===== Rẽ 1: bên ghi đọc khoá kho ===== -->
      <polygon points="308,136 408,200 308,264 208,200" fill="#f5f5f5"/>
      <polygon points="308,136 408,200 308,264 208,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="188" class="nm" text-anchor="middle">Bên ghi</text>
      <text x="308" y="204" class="mi" text-anchor="middle">dinh-tuyen-may</text>
      <text x="308" y="220" class="sb" text-anchor="middle">khoá kho bật?</text>

      <!-- ===== Kết cục: tắt ===== -->
      <rect x="228" y="360" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="228" y="360" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="308" y="384" class="nm" text-anchor="middle">0 byte, như hôm nay</text>
      <text x="308" y="400" class="mo" text-anchor="middle">khoá vắng · false</text>

      <!-- ===== Mục known-limits / wont-fix → dòng sổ máy (focal) ===== -->
      <rect x="632" y="56" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="56" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="648" y="76" class="ea">MỤC KNOWN-LIMITS / WONT-FIX</text>
      <rect x="812" y="108" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="834" y="120" class="ac" text-anchor="middle">AC-2</text>
      <text x="648" y="100" class="nm">Dòng sổ gate2 khoá <tspan font-family="'Geist Mono', monospace" font-weight="500">may</tspan></text>
      <text x="648" y="120" class="sb">+ gạch Notes</text>

      <!-- ===== Mục new-contract → để người ===== -->
      <rect x="632" y="264" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="264" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="648" y="284" class="ey">MỤC NEW-CONTRACT</text>
      <text x="648" y="308" class="nm">Để người</text>
      <text x="648" y="328" class="sb">không ghi dòng nào — vẫn của người</text>

      <!-- ===== Rẽ 2: bộ đọc làn V (lib, KHÔNG đổi) ===== -->
      <polygon points="1008,136 1104,200 1008,264 912,200" fill="#f5f5f5"/>
      <polygon points="1008,136 1104,200 1008,264 912,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1008" y="192" class="nm" text-anchor="middle">Bộ đọc làn V</text>
      <text x="1008" y="208" class="mo" text-anchor="middle">lib, KHÔNG đổi</text>
      <rect x="986" y="216" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1008" y="228" class="ac" text-anchor="middle">AC-5</text>

      <!-- ===== Kết cục: làn V (focal) ===== -->
      <rect x="1248" y="172" width="176" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="1248" y="172" width="176" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1336" y="196" class="nm" text-anchor="middle">Làn V</text>
      <text x="1336" y="214" class="sb" text-anchor="middle">không mời ký</text>

      <!-- ===== Kết cục: mời ký Cổng 2 ===== -->
      <rect x="888" y="360" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="888" y="360" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1008" y="384" class="nm" text-anchor="middle">Mời ký Cổng 2</text>
      <text x="1008" y="402" class="sb" text-anchor="middle">mục máy là dòng báo</text>
      <rect x="1136" y="380" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1158" y="392" class="ac" text-anchor="middle">AC-7</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="448" x2="1424" y2="448" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="468" class="ey">CHÚ GIẢI</text>

      <rect x="40" y="480" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="490" class="lg">Bắt đầu / kết cục</text>

      <rect x="200" y="480" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="490" class="lg">Bước</text>

      <polygon points="292,486 304,480 316,486 304,492" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="490" class="lg">Rẽ nhánh</text>

      <circle cx="412" cy="486" r="4" fill="#2d3142"/>
      <text x="424" y="490" class="lg">Tách theo từng mục Ngoài-n</text>

      <rect x="580" y="480" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="612" y="490" class="lg">Dòng máy mới và đích làn V</text>

      <rect x="776" y="480" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="798" y="489" class="ac" text-anchor="middle">AC-n</text>
      <text x="828" y="490" class="lg">Tiêu chí hợp đồng giữ bước ấy</text>
    </svg>
  </div>
</body>
</html>
