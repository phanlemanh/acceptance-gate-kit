<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg">
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #4f5d75; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #4f5d75; }
          .mi { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500; fill: #2d3142; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .ea { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #ba4513; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.02em; fill: #4f5d75; }
          .ac { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- dòng máy → thẻ -->
      <line x1="500" y1="96" x2="500" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- thẻ → người gõ -->
      <line x1="500" y1="192" x2="500" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- người gõ → loại hồ sơ -->
      <line x1="500" y1="296" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- rẽ trái: machine-cleared -->
      <path d="M400 376 H268 Q260 376 260 384 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- rẽ phải: máy-đi-trước -->
      <path d="M600 376 H732 Q740 376 740 384 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- hợp lại -->
      <path d="M260 512 V552 Q260 560 268 560 H496" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M740 512 V552 Q740 560 732 560 H504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- điểm hợp → đường ký thường -->
      <line x1="500" y1="564" x2="500" y2="592" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- đường ký thường → dòng người mới -->
      <line x1="500" y1="648" x2="500" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- dòng người mới → thẻ -->
      <line x1="500" y1="744" x2="500" y2="776" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector labels -->
      <rect x="284" y="352" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="334" y="364" class="al" text-anchor="middle">machine-cleared</text>
      <rect x="616" y="352" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="666" y="364" class="al" text-anchor="middle">máy-đi-trước</text>

      <!-- ===== Bắt đầu: dòng máy ===== -->
      <rect x="360" y="40" width="280" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="360" y="40" width="280" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="64" class="nm" text-anchor="middle">Dòng máy</text>
      <text x="500" y="82" class="mo" text-anchor="middle">Ngoài-3: ghi Known limits</text>

      <!-- ===== Thẻ / dòng báo in lệnh đảo ===== -->
      <rect x="320" y="128" width="360" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="128" width="360" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="156" class="nm">Thẻ / dòng báo in lệnh đảo</text>
      <text x="336" y="176" class="sb">«Máy đã định tuyến: … — đảo: <tspan font-family="'Geist Mono', monospace">dao</tspan>»</text>
      <rect x="620" y="144" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="642" y="156" class="ac" text-anchor="middle">AC-7</text>

      <!-- ===== Người gõ lệnh đảo (focal) ===== -->
      <rect x="260" y="224" width="480" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="224" width="480" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="276" y="244" class="ea">NGƯỜI GÕ</text>
      <rect x="680" y="232" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="702" y="244" class="ac" text-anchor="middle">AC-9</text>
      <text x="276" y="276" class="mi">/acceptance-gate:signoff &lt;slug&gt; Ngoài-3: mở hợp đồng mới; Ký</text>

      <!-- ===== Rẽ: loại hồ sơ ===== -->
      <polygon points="500,328 600,376 500,424 400,376" fill="#f5f5f5"/>
      <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="380" class="nm" text-anchor="middle">Loại hồ sơ?</text>

      <!-- ===== Hồ sơ machine-cleared ===== -->
      <rect x="140" y="448" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="156" y="476" class="nm">Hồ sơ machine-cleared</text>
      <text x="156" y="496" class="sb">signoff đã nhận loại này</text>

      <!-- ===== Hồ sơ máy-đi-trước ===== -->
      <rect x="620" y="448" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="636" y="476" class="nm">Hồ sơ máy-đi-trước</text>
      <text x="636" y="496" class="sb">veto mở · câu mới của signoff</text>
      <rect x="800" y="464" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="822" y="476" class="ac" text-anchor="middle">AC-9</text>

      <!-- ===== Điểm hợp ===== -->
      <circle cx="500" cy="560" r="4" fill="#2d3142"/>

      <!-- ===== Đường ký thường bước 3–7 ===== -->
      <rect x="340" y="592" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="592" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="616" class="nm" text-anchor="middle">Đường ký thường bước 3–7</text>
      <text x="500" y="634" class="mo" text-anchor="middle">commands/signoff.md</text>

      <!-- ===== Dòng người MỚI sau dòng máy (focal) ===== -->
      <rect x="260" y="680" width="480" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="680" width="480" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="276" y="708" class="nm">Dòng người MỚI sau dòng máy — người thắng</text>
      <text x="276" y="728" class="mo">decisions.jsonl · dòng máy giữ nguyên</text>
      <rect x="680" y="696" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="702" y="708" class="ac" text-anchor="middle">AC-7</text>

      <!-- ===== Kết cục: thẻ ===== -->
      <rect x="300" y="776" width="400" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="300" y="776" width="400" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="800" class="nm" text-anchor="middle">Thẻ: Ngoài-3 người định tuyến</text>
      <text x="500" y="818" class="mo" text-anchor="middle">hồ sơ đã ký Cổng 2</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="860" x2="960" y2="860" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="880" class="ey">CHÚ GIẢI</text>

      <rect x="40" y="892" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="902" class="lg">Bắt đầu / kết cục</text>

      <rect x="196" y="892" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="902" class="lg">Bước</text>

      <polygon points="288,898 300,892 312,898 300,904" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="902" class="lg">Rẽ nhánh</text>

      <circle cx="404" cy="898" r="4" fill="#2d3142"/>
      <text x="416" y="902" class="lg">Hai nhánh hợp lại</text>

      <rect x="520" y="892" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="552" y="902" class="lg">Chỗ người quyết và chỗ người thắng</text>

      <rect x="732" y="892" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="754" y="901" class="ac" text-anchor="middle">AC-n</text>
      <text x="784" y="902" class="lg">Tiêu chí hợp đồng giữ bước ấy</text>
    </svg>
