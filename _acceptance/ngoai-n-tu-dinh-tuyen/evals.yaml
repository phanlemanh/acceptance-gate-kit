      guide-lenh": khối GUIDE NGOAI-N-TU-DINH-TUYEN chứa chuỗi "dinh-tuyen-may.cjs --soat-lech". Chiều đỏ "PASS:
      NT11-do qua-dieu-kien" (bản sao cho --soat-lech đi qua bước xét điều kiện hồ sơ → in "0 hồ sơ"; ca ghim chuỗi
      ấy từ stdout bản đột biến và nêu "hồ sơ machine-cleared không được đếm").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, scripts/gate-card.js, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
