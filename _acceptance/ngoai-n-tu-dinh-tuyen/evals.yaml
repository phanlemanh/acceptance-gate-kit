schema_version: 1
feature_slug: ngoai-n-tu-dinh-tuyen
# Ca đo sống ở tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs (tên ca «NT<k> …»; chiều đỏ «NT<k>-do …»). Khoá
# executor thêm ở S3:
#   executors.test.ngoai_n_tu_dinh_tuyen = chạy tệp test, gộp mọi dòng «PASS: NT…» / «FAIL: …» và dòng tổng kết
#     thành MỘT dòng (lượt chấm chỉ giữ vài dòng cuối của lệnh xanh); pipefail giữ mã thoát của test.
#   executors.test.ngoai_n_lm20 = LMCMS_ONLY=LM20 trên tests/scripts/gate-card-lmcms.test.mjs (ca có sẵn).
# Kho thử do code sinh trong lượt: hợp đồng rút từ CONTRACT-FRONTMATTER-TEMPLATE, mục ngoài hợp đồng rút từ
# OOC-ITEM-TEMPLATE của feature-loop/workflows/acceptance-verify.js (bên viết thật của review-findings), dòng
# máy do bên ghi THẬT viết; bên đọc là chính khong-can-nguoi.mjs, pre-merge-check.sh, gate-card.js của cây.
# Đường dẫn suy từ vị trí tệp test. Mỗi ca đỏ chạy CHÍNH lệnh đo trên bản sao bị tiêm, SAU khi bản lành xanh trên
# cùng fixture, và ghim thông điệp. Mỗi eval ghim đúng các dòng «PASS: NT…» — lệnh xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; dòng duy nhất chứa "PASS: NT1 khoa-vang", "PASS: NT1 khoa-false" (mỗi ca: thoát 0, stdout đúng một
      dòng chứa "tắt", băm năm tệp của hồ sơ trước == sau), "PASS: NT1 khoa-sai" (thoát 2, stderr chứa
      "feature_loop.ngoai_n_tu_dinh_tuyen" và "true | false", băm trước == sau), "PASS: NT1 khoa-true" (thoát 0,
      sổ thêm hai dòng). Chiều đỏ "PASS: NT1-do vang-la-bat" (bản sao bên ghi coi khoá vắng là bật — chạy trên
      CÙNG fixture "khoa-vang" sau khi bản lành xanh — ca nêu "khoá vắng mà vẫn ghi"). Không có dòng "FAIL:".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT2 ba-dong": sổ thêm đúng ba dòng; tập khoá mỗi dòng == tập khoá rút từ khối marker
      DINH-TUYEN-MAY-LINE của bên ghi (đẳng thức tập, in ra), không có decided_by; decision ba dòng lần lượt
      == "Ngoài-1: ghi Known limits", "Ngoài-2: chấp nhận, không sửa", "Ngoài-3: ghi Known limits" với chữ người
      rút từ OOC_GLOSS_NGUOI (không chép tay); id khớp /^d-\d{8}T\d{6}Z-<n>$/ với n == số dòng sổ sau dòng đó;
      tieu_de == tiêu đề mục; dao == "/acceptance-gate:signoff <slug> Ngoài-<n>: mở hợp đồng mới; Ký".
      "PASS: NT2 notes": ## Notes thêm đúng hai gạch chứa "Ngoài-1"/"Ngoài-3" và câu «Người dùng thấy gì» của
      mục, không gạch nào chứa "Ngoài-2". "PASS: NT2 khong-cham": băm frontmatter hợp đồng, evidence-report.md,
      run-log.jsonl, review-findings.md trước == sau. "PASS: NT2 stdout": stdout đúng một dòng bắt đầu
      "dinh-tuyen-may: 3 mục (known-limits 2 · wont-fix 1)". "PASS: NT2 notes-vang": hợp đồng không có ## Notes
      → mục tạo ở cuối, chứa hai gạch. "PASS: NT2 check": --check in cùng dòng, băm trước == sau. Chiều đỏ
      "PASS: NT2-do decided-by" (bản sao bên ghi thêm decided_by "may" → ca nêu "dòng máy mang decided_by").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT3 ma-tran" với số hàng in ra == 6 == độ dài ma trận viết sẵn (new-contract · chu-nguoi-o-cho-token
      · thieu-de-xuat · da-co-dong-nguoi · da-co-khoang-nguoi · da-co-dong-may-khop); mỗi hàng là một hồ sơ có mục
      của hàng ĐỨNG CẠNH một mục đối chứng known-limits chưa định tuyến: thoát 0, sổ thêm đúng MỘT dòng máy và dòng
      ấy gọi tên mục đối chứng, 0 dòng mới gọi tên mục của hàng, stdout == "dinh-tuyen-may: 1 mục (known-limits 1 ·
      wont-fix 0)" (in từng hàng). "PASS: NT3 chay-lai": lần hai trên hồ sơ của NT2 → băm năm tệp trước == sau,
      stdout == "dinh-tuyen-may: 0 mục". "PASS: NT3 muoi-mot-muc": hồ sơ 11 mục có dòng máy cho Ngoài-1 (tiêu đề A)
      và Ngoài-11 (tiêu đề K) → chạy lại thoát 0, stdout "dinh-tuyen-may: 0 mục", không báo lệch. Chiều đỏ "PASS:
      NT3-do bo-hoi-so" (bản sao bỏ bước hỏi sổ → hàng da-co-dong-nguoi thêm dòng, ca nêu "ghi đè định tuyến của
      người"), "PASS: NT3-do thoat-som" (bản sao thoát 1 ngay sau khi đọc khoá → cả sáu hàng đỏ, ca in số hàng đỏ ==
      6) và "PASS: NT3-do chuoi-con" (bản sao so nhãn bằng chuỗi con → hàng 11 mục đỏ, ca nêu "Ngoài-1 lẫn Ngoài-11").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT4 ma-tran" với số hàng in ra == 10 == độ dài ma trận viết sẵn (doi-chung-du · implemented ·
      T3 · pending · uncertain · bypass · enf-off · triage-failed · findings-sai-khuon · chua-phan-loai); hàng
      doi-chung-du thêm hai dòng; chín hàng còn lại thoát 0, băm năm tệp trước == sau, stdout một dòng bắt đầu
      "không định tuyến:" chứa chuỗi ghim của hàng đó (in từng hàng). Báo cáo của các hàng dựng từ khối
      EVIDENCE-SECTIONS-TEMPLATE, hàng uncertain chèn khối JUDGMENT-BLOCK-TEMPLATE (rút từ
      skills/acceptance/references/evidence-report-template.md, không chép tay). "PASS: NT4 vi-phan": ở năm hàng
      pending · bypass · enf-off · T3 · uncertain, `khong-can-nguoi.mjs --check` thoát 2 và lý do nó in nêu cùng vế
      với bên ghi (in cặp lý do từng hàng). "PASS: NT4 mot-nguon": tập mã vế xuất từ bên ghi ⊇ tập mã rút từ khối
      EVIDENCE-XANH-SACH-BLOCK trừ "sections" (in hai tập). Chiều đỏ "PASS: NT4-do bo-T2" (bản sao bỏ vế hạng →
      hàng T3 thêm dòng, ca nêu "T3 bị máy định tuyến").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, scripts/khong-can-nguoi.mjs, scripts/pre-merge-check.sh, lib/out-of-contract.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; kho thử git: lib/ + scripts/recheck-evidence.cjs chép từ CÂY ĐANG KIỂM (đường suy từ vị trí test),
      nhánh basepoint trước hồ sơ. "PASS: NT5 truoc": cả hai biến thể --check thoát 2 và lưới in
      "VIOLATION [<slug>]". "PASS: NT5 sau-a": biến thể known-limits + wont-fix sau --write (commit): --check thoát
      0, lưới không in VIOLATION nào cho slug. "PASS: NT5 sau-b": biến thể có thêm new-contract: --check thoát 2,
      stderr chứa "Ngoài-3" và không chứa "Ngoài-1", lưới vẫn "VIOLATION [<slug>]". Chiều đỏ "PASS: NT5-do
      thieu-nhan" (bản sao bên ghi viết decision không có nhãn Ngoài-<n> → biến thể a sau vẫn chặn, ca nêu "dòng
      máy không mở được làn V").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, scripts/gate-card.js, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT6 lech": hồ sơ NT2 đảo thứ tự hai mục đầu → --write thoát 2, stderr chứa "Ngoài-1", tiêu đề
      cũ và tiêu đề mới, băm năm tệp trước == sau; --check cùng mã 2. "PASS: NT6 the": gate-card --extract của hồ
      sơ ấy không có "Ngoài-1" trong routing.bao, HTML có chuỗi "dòng máy trỏ mục đã đổi". Chiều đỏ "PASS: NT6-do
      bo-so-tieu-de" (bản sao bên ghi bỏ so tieu_de → thoát 0, ca nêu "dòng máy lệch mục mà vẫn đi").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/gate-card.js, scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT7 routing": routing.bao ⊇ {Ngoài-1, Ngoài-2, Ngoài-3}, routing.hoi ∩ ba nhãn == ∅, one_shot
      chứa "Ngoài-1: ghi Known limits". "PASS: NT7 extract": out_of_contract.dinh_tuyen_may có ba phần tử, mỗi
      phần tử {nhan, id, de_xuat, dao} bằng khoá tương ứng của dòng máy trong sổ. "PASS: NT7 dao": phần sau slug của
      dao tách theo ";" cho đúng hai vế "Ngoài-<n>: " + OOC_GLOSS_NGUOI['new-contract'] và "Ký". "PASS: NT7 html": mỗi mục in
      "Máy đã định tuyến" kèm dao của mục; khối "Quyết định CHƯA duyệt" có ba mục chứa "máy định tuyến". "PASS: NT7
      nguoi-thang": thêm dòng người "Ngoài-2: mở hợp đồng mới" SAU dòng máy → Ngoài-2 rời dinh_tuyen_may và vào
      routing.hoi, Ngoài-1/Ngoài-3 giữ. "PASS: NT7 muoi-mot-muc": hồ sơ 11 mục có dòng máy cho Ngoài-1 và Ngoài-11
      khác tiêu đề → cả hai trong routing.bao, HTML không có "dòng máy trỏ mục đã đổi". Chiều đỏ "PASS: NT7-do dong-dau" (bản sao thẻ lấy dòng đầu thay dòng mới
      nhất → ca nêu "người không thắng máy").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8a
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/gate-card.js, scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT8 doc-cu": hồ sơ fixture hai mục, sổ không dòng máy → --extract có dinh_tuyen_may == [] và
      routing.hoi chứa đúng Ngoài-1, Ngoài-2, HTML không có chuỗi "Máy đã định tuyến".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ngoai_n_lm20
    paths: [scripts/gate-card.js, scripts/dinh-tuyen-may.cjs, tests/scripts/fixtures/routing-baseline.txt]
    expected: >
      exit 0; output có dòng PASS của ca LM20 (bản ghi mốc định tuyến khớp mọi hồ sơ đã ký) và không có dòng FAIL.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9a
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [feature-loop/skills/feature-loop/SKILL.md, commands/signoff.md, skills/acceptance/references/human-facing-language.md, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
      exit 0; "PASS: NT9 round-trip": dòng lệnh rút từ khối giữa marker DINH-TUYEN-MAY của SKILL (thay đường gói
      bằng gốc acceptance-gate của cây) chạy trên kho thử như NT2 → sổ thêm đúng ba dòng máy. "PASS: NT9 thu-tu":
      trong khối, lệnh dinh-tuyen-may đứng trước "khong-can-nguoi" (so vị trí). Chiều đỏ "PASS: NT9-do ten-sai"
      (bản sao khối đổi tên script → ca nêu "lệnh trong khối không chạy").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9c
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ngoai_n_khoi_khac
    paths: [feature-loop/skills/feature-loop/SKILL.md, skills/acceptance/references/human-facing-language.md, tests/scripts/ngoai-n-khoi-khac.mjs]
    expected: >
      exit 0; in sha gốc "d9d1f3a6" (hằng trong script, KHÔNG merge-base); dòng "khoi TRONG-DOT bang", "khoi
      GOAL-TEMPLATE bang", "khoi S5-SHIP-DEFAULT bang", "khoi GATE-ONESHOT-LAN-V bang" (git show <sha>:<tệp>, rút
      khối giữa marker, so byte); dòng "bat-bien-dung + bang trang thai: chi them loi goi DINH-TUYEN-MAY" (đoạn
      «Bất biến dừng» và bảng trạng thái của SKILL sau khi gỡ các câu chứa "DINH-TUYEN-MAY" byte-bằng bản gốc).
      Chiều đỏ: chạy cùng script trên bản sao SKILL đổi một chữ trong GOAL-TEMPLATE → thoát 1, in "GOAL-TEMPLATE
      lech" (script tự chạy chiều đỏ trên bản sao trong thư mục tạm SAU khi bản lành xanh, in "chieu do: ok").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9b
    criterion: AC-9
    executor: judgment
    inputs: [feature-loop/skills/feature-loop/SKILL.md, commands/signoff.md]
    question: >
      Đọc khối giữa hai marker DINH-TUYEN-MAY trong SKILL.md, và câu trong signoff.md nói về câu gộp có «Ký» hoặc
      «Ngoài-<n>:» trên hồ sơ máy-đi-trước. Khối có đủ bốn ý không: (i) gọi dinh-tuyen-may --write ở hàng verified
      VÀ ở bước PASS của S4, trước khong-can-nguoi --write, đường gói giải qua resolve-plugin.mjs; (ii) thoát 0 →
      nói lại đúng dòng in, gộp vào dòng báo làn V, commit sổ + hợp đồng cùng gói evidence máy viết; (iii) thoát 2
      → vào Gate 2, không chạy khong-can-nguoi; (iv) khối nói rõ nó KHÔNG đổi bảng cổng — khó-đảo vẫn hỏi người,
      chữ quyết vẫn của người (việc bảng cổng thật sự byte-bằng bản gốc do E9c đo, không hỏi ở đây). Và signoff có
      nói rõ (v) câu gộp như vậy trên hồ sơ máy-đi-trước đi đường ký thường (bước 3–7), không đọc theo khối làn V,
      mà không mâu thuẫn với đoạn hồ sơ MÁY-ĐI-TRƯỚC đứng trước nó; (vi) một mục đã mang dòng máy (khoá `may`) được
      định tuyến lại bằng «Ngoài-<n>: …; Ký» trên CẢ hồ sơ machine-cleared lẫn hồ sơ máy-đi-trước, và lệnh ghi một
      dòng người MỚI chứ không sửa dòng máy? Trả PASS chỉ khi đủ sáu ý.
    evidence_required: [run_id, verdict, rationale]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [GUIDE.md, scripts/dinh-tuyen-may.cjs, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
