      "tieu_de". Chiều đỏ "PASS: NT10-do doi-chu" (bản sao GUIDE đổi một chữ của tên khoá → ca nêu tên khoá).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  # ── Phạm vi nâng sau Cổng Bằng chứng lượt 1 (AC-11…AC-14) ──
  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.ngoai_n_tu_dinh_tuyen
    paths: [scripts/dinh-tuyen-may.cjs, GUIDE.md, tests/scripts/ngoai-n-tu-dinh-tuyen.test.mjs]
    expected: >
