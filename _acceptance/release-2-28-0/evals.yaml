# evals — release-2-28-0
# Không có bộ răng riêng (nếp từ 2.2.0 → 2.27.0, luật «mốc phát hành KHÔNG dựng răng»): thứ cần
# canh ở mọi lần cắt số là ca vĩnh viễn P200 (vùng 3 của suite plugins) — mọi số đọc TỪ manifest
# (bốn gói), 6 đột biến + đối chứng dương, MỘT lối thoát. AC-4, AC-5 và AC-8 đo bằng lệnh git (AC-8
# qua một tệp lệnh của chính hồ sơ, chiều đỏ trong lệnh). E7 chạy suite của gói dieu-phoi bằng khoá có
# sẵn `dieu_phoi`. E1/E2/E6 chấm MÃ THOÁT của vùng 3 — không hứa dòng P200 trong bằng chứng (cùng căn cứ
# release-2-26-0, sổ d-20261009T085335Z-3). E9 là hội đồng đọc ghi chú nhận cho crm cạnh vật nó mô tả.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vùng 3 của suite plugins xanh, nên ca P200 (cùng vùng) xanh: ba gói cùng số 2.28.0
      (acceptance-gate · feature-loop · dieu-phoi), diagram-design 2.7.1, bốn số hợp semver, đọc từ manifest.
      Chiều đỏ sống trong chính P200 (6 đột biến, gồm «dieu-phoi lech so», + đối chứng dương trên bản sao
      nguyên vẹn); P200 đỏ thì vùng 3 thoát khác 0.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vế GUIDE của P200 xanh: câu «Khớp phiên bản» dựng từ bốn số đọc trong manifest rồi so;
      đột biến GUIDE giữ số cũ → P200 đỏ (trong P200), vùng 3 thoát khác 0.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts_bash
    expected: "mảnh bash của suite scripts XANH"
