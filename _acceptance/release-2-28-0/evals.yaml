    cmd: config:executors.script.product_map
    expected: "exit 0 — PRODUCT-MAP.md và LO-TRINH.html khớp hồ sơ xưởng (vẽ lại cùng commit đổi trạng thái hồ sơ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rel2280_cua_so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ, suy từ kho bằng QUAN HỆ (hồ
      sơ có contract.md đổi trong `a1e2e0b9..HEAD`, nay `status: signed-off`, mà ở mốc trước CHƯA ký; bỏ hồ sơ
      mốc `release-*`), BẰNG tập năm slug kể trong Context. Chiều đỏ trong chính lệnh: slug thừa và slug
      thiếu đều in tên — đo khi mở hồ sơ: chạy với tập «x» thì «ĐỎ: … mốc KHÔNG kể: …», thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rel2280_dd_giu
    expected: >
      Exit 0 và dòng «moc:   "version": "2.7.1", | HEAD:   "version": "2.7.1",» — `diagram-design/` KHÔNG
      có dòng đổi từ `a1e2e0b9` tới HEAD VÀ số bằng số ở mốc. Chiều đỏ: cùng lệnh với mốc `1b98fdb1`
      (v2.20.0, trước commit nâng 2.7.1) thoát 1 — đo khi mở hồ sơ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vế mô tả của P200 xanh: mô tả acceptance-gate có mục v2.28.0 và mục v2.28.0 của
      feature-loop tự khai cặp acceptance-gate >= 2.28.0; hai đột biến của P200 (mô tả thiếu mục · câu khai
      cặp nằm ngoài mục) phải đỏ trong chính ca.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dieu_phoi
    expected: >
      Exit 0 — suite tests/dieu-phoi xanh: một dòng gộp mang mọi «ok … DP1-…» (gồm DP1-06 khuôn và DP1-06-do
      khuôn), không dòng «not ok» nào, và tổng kết TAP «# fail 0». Lệnh có pipefail: suite đỏ hay sập trước
      dòng tổng kết thì thoát khác 0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rel2280_lop_chep
    expected: >
      Exit 0 và dòng «XANH: đúng 1 tệp đổi như mốc kể» — rút 25 tệp từ khối INIT-CI-COPY-LIST của
      acceptance-init, đúng một tệp (scripts/ho-so-tom-tat.cjs) đổi byte từ `a1e2e0b9` tới HEAD, khớp lời
      «chép lại MỘT tệp» của CHANGELOG 2.28.0. Chiều đỏ trong chính lệnh: tệp đổi mà mốc không kể, hay mốc kể
      tệp không đổi, đều in tên và thoát 1; rút được dưới 20 tệp thì thoát 2 — đo khi mở hồ sơ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, scripts/ho-so-tom-tat.cjs, skills/acceptance/references/lo-trinh-du-lieu.md, dieu-phoi/README.md, _acceptance/release-2-28-0/contract.md]
    question: >
      Đọc AC-9 của contract và mục «## 2.28.0» của CHANGELOG.md (chỉ mục đó), cạnh mã và tài liệu đi kèm.
      (1) Hành vi khoá `production.nhanh` mà CHANGELOG nêu — vắng khoá thì ô production giữ câu cũ «chưa ghi
      quan sát production» và máy không suy «đã triển khai»; khai khoá thì ba kết cục (đã triển khai — gộp vào
      <nhánh> <ngày> · chưa gộp vào <nhánh> · chưa đọc được triển khai ở đây — <lý do>); dòng quan sát người ghi
      luôn thắng — có khớp scripts/ho-so-tom-tat.cjs và lo-trinh-du-lieu.md không? (2) Ghi chú nhận cho crm có
      bảo cài theo ĐÚNG thẻ v2.28.0 (không cài mã main giữa hai thẻ), có nêu bản cài «2.27.0» ở máy M5 thật ra
      là mã main chứ không phải thẻ, và có bảo bản chép docDuLieu lấy từ thẻ không? (3) Cách khai
      `dieu_phoi.lich_su` và lệnh `ghi-danh <dãy>` mà CHANGELOG nêu có khớp dieu-phoi/README.md không?
      (4) Ba hồ sơ có thể đỏ khi ghim lại vì môi trường (evals-sat-le-doc-du, tac-tu-cham-chi-cham-khong,
      dieu-phoi-on-dinh-r2) có được gọi tên kèm lý do môi trường và nói rõ không phải lỗi của mốc không?
      Trả PASS khi cả bốn vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
