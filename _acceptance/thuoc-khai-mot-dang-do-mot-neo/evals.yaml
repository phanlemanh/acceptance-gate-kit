schema_version: 1
feature_slug: thuoc-khai-mot-dang-do-mot-neo

# T2, mười tiêu chí, không judgment.
# E1–E5 cùng chạy nhóm `lane-doc-khong-doi` qua CHÍNH khoá đang đỏ `itgk_lane_doc_khong_doi`
# (không sinh khoá song song — gap-probe P0: khoá mới viết đúng sẽ che lỗi tầng giải chuỗi của
# khoá cũ). E6–E8 cùng chạy P86. Workflow dedupe lệnh; mỗi ô ghim một ca khác nhau.
# Con số trong chuỗi ghim là số MÁY TRÍCH rồi in ra, không phải chữ hằng.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.itgk_lane_doc_khong_doi
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh"]
    expected: >-
      exit 0; `Results: chan lane-doc-khong-doi passed` (8 pass); hai dòng OK in HAI mốc đã neo
      NGUYÊN VĂN đủ 40 ký tự; và dòng `hai lượt một kết quả` báo PASS, câu của nó nêu CẢ đối chứng
      âm — bản cũ theo `merge-base` cho hai mốc KHÁC nhau trên cùng cặp cây. Thiếu đối chứng âm ấy
      thì nhóm FAIL với `phép so hai-lượt KHÔNG có răng`. Đo trước khi vá: `0 pass, 3 do` trên `main` sạch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.itgk_lane_doc_khong_doi
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh", "feature-loop/workflows/acceptance-verify.js"]
    expected: >-
      exit 0; dòng `vế lane (sống)` báo PASS trên cây thật — `acceptance-verify.js` trên CÂY LÀM VIỆC
      giống bản tại mốc ký `9b3d6f64` (so cây, không so HEAD: sửa chưa commit cũng bị bắt); VÀ dòng
      HAI dòng `chiều đỏ 1` và `chiều đỏ 1b` cùng báo PASS — clone sửa file ấy ĐÃ COMMIT, và clone sửa
      mà CHƯA commit, cả hai làm phép kiểm ĐỎ với ghim `lane hội đồng đã đổi`. Ca 1b là chỗ duy nhất
      phân biệt so-cây với so-HEAD: đổi phép đo về `MOC_KY..HEAD` thì 1b đỏ (đã phá thử, nhóm 7 pass 1 do).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.itgk_lane_doc_khong_doi
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh"]
    expected: >-
      exit 0; dòng `vế tập-file (chứng-một-lần)` báo PASS và in tập thật đọc từ khoảng đã giao
      `1765b550..9b3d6f64`, đúng bằng `{feature-loop/scripts/s4-args.mjs}`. Ô này khai rõ vế hai là
      HẰNG với đối số thật; chiều đỏ của nó nằm ở E4, không nằm ở đây.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.itgk_lane_doc_khong_doi
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh"]
    expected: >-
      exit 0; dòng `chiều đỏ 2` báo PASS — một KHO GIẢ dựng tại chỗ (`git init`, hai commit) có
      khoảng `base..tip` chứa `lib/tiem-file-la.mjs` ngoài `s4-args.mjs`; gọi hàm vế-tập-file qua
      ĐÚNG chữ ký mà lời gọi thật dùng (repo, base, tip đều là hằng của kho giả) phải ĐỎ với
      `tập file mã đổi ≠ {…}` nêu đích danh file lạ. Đỏ đi vòng qua HEAD của clone → không tính.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.itgk_lane_doc_khong_doi
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh"]
    expected: >-
      exit 0; dòng `chiều đỏ 3` báo PASS — chạy trên một kho KHÔNG có mốc đã neo thì ĐỎ và gọi tên
      sha thiếu (`mốc đã neo không có trong kho`). Bản thiếu-mốc mà XANH thì nhóm FAIL: đó đúng là
      đường xanh-im-lặng vòng này tồn tại để đóng.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.tkm_p86
    paths: ["tests/plugins/run-tests.sh", "GUIDE.md", "QUICKSTART.md", "README.md"]
    expected: >-
      exit 0; `PASS: P86` và dòng `P86 VE: ngan sach doc duoc` in ba con số cho TỪNG bản
      (`VI 3/4/1` · `EN 3/4/1`). Số đến từ biểu thức trích trên đúng vế; vế nào không khớp biểu
      thức → đỏ nêu tên vế và tên bản.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.tkm_p86
    paths: ["tests/plugins/run-tests.sh", "GUIDE.md", "QUICKSTART.md", "README.md"]
    expected: >-
      exit 0; ba dòng `P86 MUTANT` mới in kèm THÔNG ĐIỆP ĐỎ THẬT sau dấu hai chấm:
      `ngan sach luot 3->9 -> do dung cho: … ngan sach luot 9 != so cong 4 - 1` ·
      `tran T3 4->5 -> … tran T3 5 != so luot 3 + 1` ·
      `xoa ve moc phat hanh -> … khong doc duoc ve ngan sach «moc phat hanh»`.
      Con số 9 đến từ `ngan_sach()` trích được, không từ nhãn ca: đổi thông điệp thành chuỗi hằng
      thì suite FAIL với `thieu ghim` (đã phá thử 06/09). Đo trước khi vá: hai trong ba ca này XANH.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.tkm_p86
    paths: ["tests/plugins/run-tests.sh", "GUIDE.md", "QUICKSTART.md", "README.md"]
    expected: >-
      exit 0; dòng `P86 MUTANT: them cong nhung giu ngan sach -> do dung cho:` in tiếp thông điệp
      `ngan sach luot 3 != so cong 5 - 1` — cả hai số đều là số máy trích. Ba bản vẫn khớp nhau nên
      mọi phép so bản-chép đều xanh: chỉ phép so QUAN HỆ bắt được ca này.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.plugins
    paths: ["tests/plugins/run-tests.sh"]
    expected: >-
      exit 0; `Results: all plugin tests passed`; trong đó P86 in đủ NĂM dòng `P86 MUTANT` CŨ
      (bản VI ở QUICKSTART, bản VI ở GUIDE, bản EN ở README, thêm cổng ở nguồn, mất ngân sách T3), và MỌI
      dòng MUTANT đều in thông điệp đỏ thật sau `do dung cho:` — không ca nào assert âm tính trần.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-9
    executor: script
    cmd: config:executors.script.tkm_suite_con_lai
    paths: ["_acceptance/config.yaml", "PRODUCT-MAP.md"]
    expected: >-
      exit 0; ba suite còn lại của kho (`scripts` · `hooks` · `workflows`) mỗi cái kết `0 failed`,
      rồi `product-map.mjs --root . --check` in `PRODUCT-MAP.md khớp hồ sơ xưởng.` — thêm một thư
      mục hồ sơ và ba khoá config là đúng loại thay đổi làm cổng đếm của kho đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
    executor: script
    cmd: config:executors.script.tkm_bay_chan
    paths: ["_acceptance/inputs-tinh-tu-goc-kho/rang.sh"]
    expected: >-
      exit 0; bảy nhóm còn lại của `rang.sh` (`goc-kho-giu` · `thieu-exit-2` · `duong-cu-goi-y` ·
      `abs-hai-chieu` · `tai-lieu-khong-con-duong-cu` · `bang-chung-cung-ho-so` ·
      `thu-muc-khong-phai-file`) mỗi nhóm in `Results: chan <tên> passed`, không nhóm nào `FAILED`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
