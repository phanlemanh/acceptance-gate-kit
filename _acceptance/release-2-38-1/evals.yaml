  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rel2381_cua_so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ `c8fa5a65..HEAD`, suy từ kho bằng QUAN HỆ
      (bỏ hồ sơ mốc `release-*`), BẰNG tập kể trong Context (t3-can-ho-so-arm). Chiều đỏ trong chính lệnh: slug thừa và slug thiếu đều in tên, thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
