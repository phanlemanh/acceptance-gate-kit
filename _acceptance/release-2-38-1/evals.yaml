    cmd: config:executors.script.rel2381_dd_giu
    expected: >
      Exit 0 và dòng «moc:   "version": "2.7.1", | HEAD:   "version": "2.7.1",» — `diagram-design/` KHÔNG có dòng đổi
      từ `c8fa5a65` tới HEAD VÀ số bằng số ở mốc. Chiều đỏ: cùng lệnh với mốc `1b98fdb1` (v2.20.0, trước commit nâng
      2.7.1) thoát 1 — đo ở release-2-29-0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vế mô tả của P200 xanh: mô tả acceptance-gate có mục v2.38.1 và mục v2.38.1 của
      feature-loop tự khai cặp acceptance-gate >= 2.38.1; hai đột biến của P200 (mô tả thiếu mục · câu khai
      cặp nằm ngoài mục) phải đỏ trong chính ca.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.rel2381_goi_doi
    expected: >
      Exit 0 và dòng «goi chi doi so: dieu-phoi/.claude-plugin/plugin.json feature-loop/.claude-plugin/plugin.json
      road-map/.claude-plugin/plugin.json tri-thuc/.claude-plugin/plugin.json» — tập tệp đổi dưới bốn gói từ `c8fa5a65` tới
      HEAD bằng đúng bốn manifest, như CHANGELOG 2.38.1 kể. Chiều đỏ: cùng lệnh trước commit nâng số in rỗng, thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rel2381_lop_chep
    expected: >
      Exit 0 và dòng «XANH: đúng 1 tệp đổi như ghi chú 2.38.1 kể» — rút danh sách chép từ khối INIT-CI-COPY-LIST (36 tệp),
      rút danh sách mong đợi từ gạch «- **Lớp chép CI:…» của mục «## 2.38.1» trong CHANGELOG.md, và tập tệp đổi byte từ
      `c8fa5a65` tới HEAD là đúng `scripts/pre-merge-check.sh`. Chiều đỏ trên cùng tệp lệnh, đo trước khi cắt: mốc
      `v2.38.0` với mục 2.38.0 thoát 1 «ĐỎ: tệp đổi mà ghi chú KHÔNG kể: scripts/pre-merge-check.sh».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, README.md, _acceptance/release-2-38-1/contract.md, _acceptance/t3-can-ho-so-arm/contract.md, _acceptance/t3-can-ho-so-arm/design.md, _acceptance/t3-can-ho-so-arm/rang/ds-pr.json, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-38-1 và mục «## 2.38.1» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép.
      (0) Ở mục con của hồ sơ t3-can-ho-so-arm: mỗi câu mô tả vòng (dòng «Gốc:», gạch «Vật:», giới hạn trích trong ngoặc «»)
      có phải chữ của hợp đồng hay design.md ấy — không nói rộng hơn — và số giới hạn đã khai (22 mục chọn ở Cổng Bằng
      chứng) có khớp Notes của hợp đồng không? (1) Lời về các dạng hồ sơ bị chặn, miễn trừ PR cài kit theo đỉnh nhánh đích,
      code ngoài t3_paths giữ luật cũ và cờ --no-t1-escape có khớp hợp đồng t3-can-ho-so-arm và đoạn tương ứng của README
      không? (2) Số PR nêu (48 PR, 10 kho, 27 · 12 · 2 không chặn thêm, 7 chặn thêm và phân bố 7 PR theo kho) có khớp
      rang/ds-pr.json không? (3) Lời về lớp chép CI có đúng với khối INIT-CI-COPY-LIST của commands/acceptance-init.md
      không — tệp kể có thuộc khối và tổng 36 đúng? (4) Đoạn «Vì sao 2.38.1» và «Ai bị ảnh hưởng» có nói thẳng rằng PR đổi
      t3_paths không có hồ sơ được chấm nay bị chặn, và căn cứ chọn patch (không có bề mặt mới) có đúng với Context của
      hợp đồng release-2-38-1 không? Trả PASS khi cả năm vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.kiem_ban_cai_moc
    long_running: 30
    expected: >
      Exit 0 — cổng số phiên bản của kiem-ban-cai-sau-phat-hanh: số trong .claude-plugin/plugin.json ở HEAD khác
      gốc vòng nên lệnh chạy TRỌN kiểm bản cài trên HEAD (cài cách ly từ `git archive HEAD`), in dòng «TỔNG KẾT:
      ĐẠT 8/8 — HEAD (<sha>) cài đúng tag» và «… v2.38.0 (c8fa5a65) cài đúng tag». Chiều đỏ sống trong ca của KC1
      (KB-1…KB-11). Đỏ → KHÔNG cắt mốc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
