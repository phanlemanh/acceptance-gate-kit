# evals — moi-noi-vong-trao
#
# Hai lớp thước (Notes của contract):
#   · Lớp MÁY: rang-mnvt.sh — mỗi chân chạy VẬT THẬT trên fixture code-sinh và
#     kèm CHIỀU ĐỎ cùng lượt (bản sao bị tiêm lỗi phải ĐỎ đúng thông điệp ghim,
#     mutant phải CHẠY ĐƯỢC). Chân thẻ ngưỡng chạy case P197 của suite plugins
#     qua ONLY_BLOCK và ghim ĐÚNG dòng «P197 OK» (không tin mã thoát trọn suite).
#   · Lớp HÀNH VI (judgment): hội đồng phiên sạch, giao thức 1c — agent hành
#     động KHÔNG TOOL, nhận inline thân SKILL sau sửa + đề ca hoi-dong/ca-<eval>.md;
#     đáp án viết TRƯỚC ở giam-khao/dap-an-<eval>.md, CHỈ giám khảo nạp.

evals:
  # ── Thẻ Cổng Phạm vi in ngưỡng ────────────────────────────────────────
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.rang_mnvt_the_nguong
    paths: [scripts/gate-card.js, tests/plugins/run-tests.sh, skills/acceptance/references/opportunity-template.md]
    expected: >
      Chạy suite plugins ONLY_BLOCK=P197 và ghim dòng «P197 OK» trong stdout
      (không tin mã thoát suite). P197 dựng workspace code-sinh từ khuôn
      opportunity-template (round-trip writer→reader), gọi gate-card.js THẬT
      trên MA TRẬN VIẾT TRƯỚC 4 trạng thái × 2 mặt (HTML thẻ · --extract), mỗi
      ô một assert ghim tên «<trạng thái>/<mặt>» (8 ô, không gộp): có-ngưỡng/
      html có khối «Ngưỡng nghiệm thu» + từng dòng nguyên văn + câu «sẽ có phiên
      nghiệm thu»; có-ngưỡng/extract section_present true, lines đúng số dòng
      TÍNH TỪ FIXTURE (không hardcode). Mutant m1 gỡ khối render trong bản sao
      gate-card → P197 ĐỎ ghim «thieu khoi nguong». Đỏ ghim tên ô.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.rang_mnvt_the_nguong
    paths: [scripts/gate-card.js, tests/plugins/run-tests.sh]
    expected: >
      Cùng lệnh với E1 (dedupe — một lượt P197 chấm cả hai AC), ghim các ô còn lại của ma trận: rỗng/html
      cờ vàng «chưa khai ngưỡng» + KHÔNG khối; rỗng/extract opportunity_present
      true, section_present true, lines rỗng; thiếu/html cờ vàng + KHÔNG khối;
      thiếu/extract section_present false, lines rỗng; không-cơ-hội/html dòng
      sự kiện «ship thẳng, không phiên nghiệm thu», KHÔNG cờ, exit 0;
      không-cơ-hội/extract opportunity_present false; đời-cũ (contract cũ,
      không opportunity) = như không-cơ-hội, không lỗi. Mutant m2 làm nhánh
      không-cơ-hội in cờ vàng → ĐỎ ghim «nhanh khong-co-hoi in co vang»;
      mutant m3 làm nhánh rỗng vẫn in khối ngưỡng → ĐỎ ghim «rong van in khoi».
      Đỏ ghim tên ô.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── Khuôn nhật-ký-vấp round-trip ──────────────────────────────────────
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.rang_mnvt_khuon
    paths: [skills/acceptance/references/stranger-drive-template.md, skills/uat-session/SKILL.md, docs/lai-thu-nguoi-la.md]
    expected: >
      QUAN HỆ writer→reader, hai phía đều bằng máy: KHUÔN = tập khoá parse
      từ YAML giữa mốc STRANGER-FRONTMATTER-TEMPLATE; ĐỌC = tập khoá backtick
      mà §0–§1 của uat-session gọi khi đọc nhật-ký-vấp (rút bằng regex trên
      đúng hai section, không chép tay). Assert: ĐỌC ⊆ KHUÔN; ĐỌC ⊇ {chan, slug,
      ran_at}; §0 nhắc đúng tên file stranger-drive.md; docs/lai-thu-nguoi-la.md
      chứa đường dẫn khuôn. Chiều đỏ HAI PHÍA trên bản sao: (a) khuôn đổi
      `chan`→`blocked` → ĐỎ ghim «§0 doc khoa ngoai khuon: chan»; (b) SKILL §0
      đổi `chan`→`blocked` → ĐỎ ghim «§0 doc khoa ngoai khuon: blocked». Đỏ
      ghim khoá / file.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── uat-session §0 — hành vi ──────────────────────────────────────────
  - id: E4
    criterion: AC-4
    executor: judgment
    inputs:
      - skills/uat-session/SKILL.md
      - _acceptance/moi-noi-vong-trao/hoi-dong/ca-E4.md
      - _acceptance/moi-noi-vong-trao/hoi-dong/transcript-E4.md
      - _acceptance/moi-noi-vong-trao/giam-khao/dap-an-E4.md
    paths:
      - skills/uat-session/SKILL.md
    question: >
      Giao thức chống rò rỉ (đầu file): agent hành động KHÔNG TOOL đã nhận
      inline thân skill uat-session SAU sửa + 6 ca của đề (chan=0 hợp lệ ·
      chan=2 · vắng file · frontmatter hỏng · slug lệch · ran_at cũ hơn lần
      chấm) — bài làm của nó là hoi-dong/transcript-E4.md (đầu file ghi
      tool_uses: 0). GIÁM KHẢO: chấm transcript đó theo đáp án
      giam-khao/dap-an-E4.md từng ca (ĐẠT/TRƯỢT theo cột), đối chiếu với §0
      của SKILL: 6/6 đạt → PASS; lời văn mơ hồ không xếp được → UNCERTAIN; ≥1
      ca trượt → REJECT kèm trích transcript. Không tự đóng vai agent hành
      động, không viết lại bài làm.
    evidence_required: [judged_by, verdict, rationale]

  - id: E4b
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rang_mnvt_uat_needle
    paths: [skills/uat-session/SKILL.md]
    expected: >
      §0 của uat-session chứa các nhánh có tên (chan 0 + slug khớp + ran_at
      không cũ hơn verified_at → thoả bằng bằng chứng · chan > 0 → dừng KÈM
      chỉ đường «lái-thử» lại · vắng / không đọc được / slug lệch / ran_at cũ →
      cờ vàng nêu lý do có tên, không chặn) và §1 nhắc chép «Chuyển phiên
      người» vào khối chấm kín. Chiều đỏ: bản sao xoá nhánh cờ vàng → ĐỎ ghim
      «thieu nhanh co vang»; xoá câu chỉ đường → ĐỎ ghim «thieu chi duong
      lai-thu lai». Đỏ ghim nhánh thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── feature-loop S5 — hành vi ─────────────────────────────────────────
  - id: E5
    criterion: AC-5
    executor: judgment
    inputs:
      - feature-loop/skills/feature-loop/SKILL.md
      - _acceptance/moi-noi-vong-trao/hoi-dong/ca-E5.md
      - _acceptance/moi-noi-vong-trao/hoi-dong/transcript-E5.md
      - _acceptance/moi-noi-vong-trao/giam-khao/dap-an-E5.md
    paths:
      - feature-loop/skills/feature-loop/SKILL.md
    question: >
      Giao thức như E4. Agent hành động KHÔNG TOOL đã nhận inline mục S0/S5
      của feature-loop SAU sửa + 3 ca (S5 có opportunity · S5 không
      opportunity · S0 mở vòng khi workspace đã có opportunity); bài làm ở
      hoi-dong/transcript-E5.md. GIÁM KHẢO chấm transcript theo
      giam-khao/dap-an-E5.md từng ca, đối chiếu S0/S5 của SKILL: 3/3 → PASS;
      mơ hồ → UNCERTAIN; ≥1 trượt → REJECT kèm trích. Không tự đóng vai agent
      hành động.
    evidence_required: [judged_by, verdict, rationale]

  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rang_mnvt_s5_needle
    paths: [feature-loop/skills/feature-loop/SKILL.md]
    expected: >
      Mục S5 của feature-loop chứa nhánh «có opportunity.md → một dòng bàn giao»
      nhắc «lái-thử» + «uat-session <slug>» và nhánh «không → ship thẳng»; S0
      nhắc opportunity.md là input của brainstorm S1. Chiều đỏ: bản sao xoá
      dòng bàn giao → ĐỎ ghim «thieu dong ban giao S5». Đỏ ghim nhánh thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── Spec chữ + §5 giữ nguyên ──────────────────────────────────────────
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.rang_mnvt_spec
    paths: [docs/specs/workflow-v2-spec.md, docs/plans/2026-08-13-de-bai-lai-thu-nguoi-la.md]
    expected: >
      Spec: §2.3 có «thì ĐO» gắn với lái-thử; hàng «**A**» của bảng định tuyến
      chứa «lái-thử»; Chương 3 có dòng «lái-thử không có hàng»; Chương 4 nhắc
      «nhật-ký-vấp» + «song diện». Đề bài §5 vẫn chứa nguyên câu «Cấm leo thang
      trước số liệu». Chiều đỏ qua CHÍNH checker: bỏ «lái-thử» khỏi hàng A → ĐỎ
      ghim «hang A thieu lai-thu»; bỏ «song diện» → ĐỎ ghim «Chuong 4 nhat-ky-vap
      khong noi song dien». Đỏ ghim needle + file.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── Bộ hình ──────────────────────────────────────────────────────────
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.rang_mnvt_hinh
    paths: [docs/diagrams/]
    expected: >
      Đủ 6 file workflow-v2-*.html; workflow-v2-bo-hinh.md trỏ đủ 6 tên file;
      hai file chuoi-vat-chung và vong-doi-mot-viec chứa «ĐỀ XUẤT» trong eyebrow
      lẫn colophon, và colophon hai file đó chứa điều kiện gỡ «cho tới khi»;
      mọi file có class colophon. Chiều đỏ: bản sao gỡ «ĐỀ XUẤT» khỏi một
      file → ĐỎ ghim «thieu dau DE XUAT: <file>»; gỡ câu điều kiện → ĐỎ ghim
      «colophon thieu dieu kien go dau: <file>»; bản sao xoá một trong 6 file
      → ĐỎ ghim «thieu file: <tên>» (ca dưới-ngưỡng, thẻ Cổng 1 nhắc). Đỏ ghim
      file.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ── Lưới kế thừa ────────────────────────────────────────────────────
  - id: E8
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    expected: "suite plugins XANH (P197 nằm trong suite vĩnh viễn)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
