schema_version: 1
feature_slug: crosslayer-uncoded
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.test.scripts
    expected: "case PM18 + PM18-quote: contract có criterion trích dẫn Dấu cross-layer trong code span, evals KHÔNG khai layer: backend-effect → exit 0 và stdout KHÔNG chứa 'AC-1 is tagged'. Đối chứng đã đo: cùng fixture trên cây chưa sửa ĐỎ ('expected exit 0, got 1' + 'trích dẫn Dấu bị chấm như mang Dấu')"
    paths: [lib/ac-line.js, scripts/pre-merge-check.sh, tests/scripts/run-tests.sh]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.test.scripts
    expected: "case PM13 + PM01 (cổng CHẶN) và L34 (lint): criterion THẬT SỰ mang Dấu mà thiếu cặp → vẫn 'is tagged (cross-layer)' + exit 1 ở cổng, vẫn 'W4' ở lint. Cả ba XANH trước lẫn sau — răng chống hồi quy cho chiều nới-làm-im"
    paths: [lib/ac-line.js, scripts/pre-merge-check.sh, scripts/eval-coverage-lint.js]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.test.scripts
    expected: "case L37-quote: cùng hình dạng criterion của PM18 chạy qua eval-coverage-lint → KHÔNG có 'W4 AC-1'. Đối chứng đã đo: cây chưa sửa ĐỎ ('W4 bắn giả'). Hai consumer phải cùng đổi, nếu không Cổng 1 và cổng chặn lại bất đồng"
    paths: [lib/ac-line.js, scripts/eval-coverage-lint.js, tests/scripts/run-tests.sh]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.test.plugins
    expected: "suite plugins xanh — nó là nơi parseAC bị soi qua gate-card (P148 lọt-dấu-máy, P161 ma trận strip-md, GCV1 dò mù criterion). Đối xứng judgment/crossLayer đo trực tiếp bằng ma trận 5 hình dạng: mang-judgment(true,false) | trích-judgment(false,false) | mang-cross(false,true) | trích-cross(false,false) | Dấu-ở-Nhãn(false,true)"
    paths: [lib/ac-line.js, tests/plugins/run-tests.sh]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.test.scripts
    expected: "case DV5 (additive-only.test.mjs): diff scripts/pre-merge-check.sh so với base suy từ git lúc chạy → 0 dòng luật cũ bị xoá/sửa. Nửa âm DV5m: bản sao sửa 1 dòng luật cũ phải làm phép đo ĐỎ đích danh — không có nó thì '0 dòng' là 0-hit-giả"
    paths: [scripts/pre-merge-check.sh, tests/scripts/additive-only.test.mjs]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.coverage_lint
    expected: "exit 0 trên _acceptance/ của kit — không hồ sơ nào sinh W4 mới hay mất W4 cũ. Bán kính đo tay trước khi sửa: 556 criterion (kit + oneflow), mang Dấu 7 → 7, đổi trạng thái 0. Con số này là thứ biện minh cho việc không cần sóng kiểm lại hồ sơ"
    paths: [lib/ac-line.js, scripts/eval-coverage-lint.js]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.test.scripts
    expected: "case PM18-mut + PM18-red — mutation: gỡ dòng đè `out.delete(a.id)` khỏi bản sao script rồi chạy trên fixture PM18 → phải ĐỎ ('AC-1 is tagged'). Răng hai vế PM18-mut: bước tiêm chạm được file VÀ bản tiêm vẫn `bash -n` sạch (lần trước tiêm bằng xoá trắng để lại khối rỗng, case 'đỏ' vì hỏng cú pháp chứ không vì mất phần sửa)"
    paths: [scripts/pre-merge-check.sh, tests/scripts/run-tests.sh]

  - id: E8
    criterion: AC-1
    executor: script
    cmd: config:executors.script.mirror_sync
    expected: "exit 0; 'plugins/ mirror in sync.' — lib/ac-line.js và scripts/* trong mirror byte-khớp nguồn. Ba lát trước của loạt này đều quên bước đó, nên gói THẬT ship ra vẫn là bản cũ"
    paths: [lib/ac-line.js, scripts/**, plugins/**]

  - id: E9
    criterion: AC-8
    executor: judgment
    expected: "T3 ⇒ người tự phán, verdict của judge chỉ tham khảo. Câu hỏi: `crossLayer` đọc NHÃN lỏng (`/cross-layer/i`, không đòi ngoặc) — sao chép nguyên luật của `judgment` — có đúng hơn đòi đúng chuỗi `(cross-layer)` ở cả hai chỗ không? Nêu rõ: đọc lỏng khiến `- AC-1 (bàn về cross-layer): …` bị coi là mang Dấu; lệch về phía CHẶN NHIỀU HƠN (chiều an toàn cho cổng chặn); hiện 0/556 criterion vướng. Judge KHÔNG được xem diff hay lập luận người viết"
    paths: [lib/ac-line.js]
