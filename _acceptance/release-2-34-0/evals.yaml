    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-34-0/contract.md, _acceptance/suc-khoe-cho-trong-va-toc-do/contract.md, _acceptance/anh-co-that-trong-ho-so/contract.md, _acceptance/ky-den-gop/contract.md, _acceptance/kho-tri-thuc-va-lint/contract.md, _acceptance/o-mo-viec-mang-nguon/contract.md, _acceptance/ghi-tri-thuc/contract.md, _acceptance/thiet-ke-nap-tri-thuc/contract.md, _acceptance/vong-don-le-tra-tri-thuc/contract.md, dieu-phoi/README.md, feature-loop/skills/feature-loop/SKILL.md, skills/acceptance/references/tri-thuc-template.md, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-34-0 và mục «## 2.34.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép.
      (0) Ở tám mục con của tám hồ sơ: mỗi câu mô tả vòng (câu giao, lý do làm, giới hạn trích trong ngoặc «») có phải chữ
      của hợp đồng hồ sơ ấy (dòng feature, Context, Notes) — không tóm tắt, không nói rộng hơn — và số giới hạn đã khai
      (nhãn trạng thái + chọn ở Cổng Bằng chứng) có khớp Notes không? (1) Lời về lịch biết tệp, lệnh gộp `gop`, khoá
      `gop_khong_chay_lai_ci` và các khoá của `dem` có khớp dieu-phoi/README.md, và lời về PR sẵn sàng lúc trình thẻ có khớp
      khối PR sẵn sàng của SKILL feature-loop không? (2) Hình dạng khối `tri_thuc` (noi, cong_khai, kho.ten/duong/remote) có
      khớp khuôn tri-thuc-template.md không? (3) Lời về lớp chép CI (bốn tệp chép lại, ba tệp tri thức chỉ khi khai
      tri_thuc) có khớp nhãn trong khối INIT-CI-COPY-LIST của commands/acceptance-init.md không? (4) Đoạn «Vì sao 2.34.0» và
      «Ai bị ảnh hưởng» có nói thẳng hai đổi hành vi chạm kho đang dùng — PR chuyển sẵn sàng lúc trình thẻ Cổng Bằng
      chứng, và ngưỡng swap/RSS của cấu hình đợt hết tác dụng mà không được báo — không? Trả PASS khi cả năm vế đúng; FAIL
      nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
