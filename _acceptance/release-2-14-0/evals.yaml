schema_version: 1
feature_slug: release-2-14-0
# Khuôn theo 2.13.0: mỗi eval máy ghim MỘT dòng PASS KHÁC NHAU của chính răng nó gọi, phán
# quyết không lấy từ mã thoát trọn suite. Mọi cmd đi qua config: ref.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.p200_cat_so_2_14
    expected: >
      Exit 0 và đầu ra có đúng một dòng «PASS: P200 xanh (dung 1 dong PASS cua chinh no;
      phan quyet KHONG lay tu ma thoat tron suite; rang ban <8 hex>)». Răng là bản chép
      nguyên thân của rang-p200.sh 2.13.0. Chiều đỏ ghim mã: 2 chưa từng chạy · 3 P200 in
      FAIL (số hai gói không nhất quán, ca đỏ thật) · 4 nhiều hơn một dòng PASS · 5 không
      tới kết luận · 8 không đọc được dấu bản răng. Vế giá trị «2.14.0» KHÔNG nằm trong
      eval — owner xác nhận trên thẻ.
    paths: [.claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, GUIDE.md, _acceptance/release-2-14-0/rang-p200.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.so_tang_2_14
    expected: >
      Exit 0 và đúng một dòng «PASS: so trong cay (<số>) TANG theo semver so voi so tai
      commit dua ho so moc vao kho (<sha>) = <số cũ> — neo suy TU KHO, khong ghim sha».
      Chiều đỏ ghim mã: 2 không có nền để đo · 3 số KHÔNG tăng (bằng — bước nâng số chưa
      chạy — hoặc lùi) · 4 không đọc được số tại neo · 5 không tới kết luận. Đã thử thật cả
      hai chiều: cây chưa bump → mã 3; bump thử rồi trả lại → 0.
    paths: [.claude-plugin/plugin.json, _acceptance/release-2-14-0/rang-so-tang.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.moc_diagram_2_14
    expected: >
      Exit 0 và đầu ra có đúng một dòng «PASS: diagram-design KHONG doi ke tu lan cat so gan
      nhat (<sha>), so doc duoc tai HEAD la 2.7.0 (doi chung duong: cua so moc..HEAD KHONG
      rong; bo loc diagram-design/ con khop vat; rang ban <8 hex>)». Sha là mốc suy từ kho,
      không ghim vào expected. Chiều đỏ ghim mã như 2.13.0: 2 · 3 · 4 · 5 (có đổi mà giữ số)
      · 6 · 8.
    paths: [diagram-design/.claude-plugin/plugin.json, _acceptance/release-2-14-0/rang-moc.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3a
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    expected: >
      Exit 0 và dòng tổng kết «Results: <n> passed, 0 failed» với <n> LỚN HƠN 0. Vế dưới
      ngưỡng: một suite chạy 0 ca KHÔNG được đọc là xanh — «0 passed, 0 failed» exit 0 là
      hình dạng «chưa bao giờ chạy» đội lốt hồi quy.
    paths: [scripts/, tests/scripts/**, lib/]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.hooks
    expected: >
      Exit 0 và dòng tổng kết «Results: <n> passed, 0 failed» với <n> LỚN HƠN 0; cùng vế
      dưới ngưỡng như E3a.
    paths: [hooks/, tests/hooks/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3c
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Exit 0 và «Results: all plugin tests passed», và đầu ra phải CHỨA dòng PASS của ca
      thường trực P200 — vế dưới ngưỡng: suite xanh mà P200 không hề chạy thì con số của
      mốc không có ai canh.
    paths: [tests/plugins/run-tests.sh, _acceptance/config.yaml, feature-loop/**, .claude-plugin/plugin.json]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3d
    criterion: AC-3
    executor: test
    cmd: config:executors.test.workflows
    expected: >
      Exit 0 và «Results: all workflow tests passed», và đầu ra phải chứa dòng tổng kết của
      tệp ca vùng-vật — vế dưới ngưỡng: runner bỏ sót tệp ca thì vẫn in dòng xanh cuối cùng.
    paths: [feature-loop/workflows/**, tests/workflows/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3e
    criterion: AC-3
    executor: script
    cmd: config:executors.script.product_map
    expected: "Exit 0, «PRODUCT-MAP.md khớp hồ sơ xưởng.»"
    paths: [PRODUCT-MAP.md, _acceptance/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: judgment
    question: >
      Đọc ## Notes của hợp đồng. Bốn khối (năm dòng số · lớp vendored · lớp lỗi tái phát ·
      nhát cắt kế) có ĐỦ MẶT không; bảng năm dòng có ĐỦ HAI CỘT cho hai vòng đã ký của cửa
      sổ không; mỗi ô số có ghi NGUỒN RÚT không; dòng 2 có đếm bằng BA NGĂN (cổng thiết kế ·
      luật đòi ngoài cổng · máy tự chèn) cho cả hai vòng không. KHÔNG tính lại con số nào —
      đó là việc người ký làm bằng mắt. RIÊNG đối chiếu NHÃN với nguồn: hai dòng máy đo của
      vòng `do-tin-tram-phan-loai` có khớp từng chữ số với usage-report.md nêu tên ở input
      thứ hai không; số lượt chấm và lượt hạ-tầng-đốt của vòng `chu-ky-khong-tu-lam-hoa-cu`
      có khớp «## Iterations» trong báo cáo ở input thứ ba không. Cuối cùng: khối năm dòng
      có nói THẲNG bốn điều bất lợi không — token/lượt KHÔNG giảm so mốc trước · lượt gọi
      người vượt trần ở CẢ HAI vòng · cửa sổ có HAI vòng meta trong khi luật (b) cho một ·
      dòng 4 của vòng thứ hai rút từ tệp CHƯA lên main, có ghi nguồn và chờ merge.
    inputs:
      - _acceptance/release-2-14-0/contract.md
      - _acceptance/do-tin-tram-phan-loai/usage-report.md
      - _acceptance/chu-ky-khong-tu-lam-hoa-cu/evidence-report.md
    expected: >
      PASS khi bốn khối có mặt, bảng năm dòng đủ hai cột với nguồn rút từng ô, dòng 2 đếm ba
      ngăn cho cả hai vòng, hai đối chiếu nhãn-với-nguồn khớp, và bốn điều bất lợi đều được
      nói thẳng. Che bất kỳ điều nào trong bốn là FAIL.
    evidence_required: [judged_by, verdict, votes, rationale]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ton_dong_ghim_lai_2_14
    expected: >
      Exit 0 và đầu ra có đúng một dòng «PASS: so ho so hoa cu ghi trong ho so (<n> tai moc
      <sha>) BANG so luoi dang noi hom nay — khong phai so chep tay tu moc truoc». Chiều đỏ
      ghim mã: 2 lưới GÃY hoặc mốc so không giải được (mã RIÊNG, không đội lốt «hai số
      lệch») · 3 hai số LỆCH (đã bắt thật ở lượt chạy đầu: hồ sơ chép 42, lưới nói 43) · 4
      hồ sơ không khai đủ cặp · 5 lưới không tới dòng kết luận · 6 lưới không soi hồ sơ nào
      (đối chứng dương hỏng, để «0 = 0» không thành đường xanh) · 7 con số lặp trong văn hợp
      đồng lệch ô marker. Đếm theo HỒ SƠ DUY NHẤT, không đếm dòng. Chiều đỏ mã 7 đã thử
      thật — và lần thử ấy lộ ra chính răng này từng xanh oan vì mẫu dùng ký tự biên sau chữ
      đa byte, dưới bash không khớp gì.
    paths: [_acceptance/release-2-14-0/contract.md, _acceptance/release-2-14-0/rang-ton-dong.sh, scripts/pre-merge-check.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
