      chấm không bao giờ tự làm nổ trần.
    paths: [feature-loop/scripts/s4-args.mjs, feature-loop/scripts/thuoc-vat.mjs, tests/scripts/s4-args-tran-thuoc.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E18
    criterion: AC-13
    executor: script
    cmd: config:executors.script.tcc_the_thuoc_vat
    expected: >
      Exit 0 và bốn dòng PASS. GT1 (round-trip): dòng đếm do CHÍNH bộ đếm ghi vào run-log của
      fixture được thẻ Cổng Bằng chứng in thành đúng MỘT dòng vật · thước · nhát với đúng các
      số. GT2 (chiều im): run-log không có dòng ấy — thẻ không in dòng nào thêm, không cờ. GT3
