  - id: E17
    criterion: AC-12
    executor: script
    cmd: config:executors.script.tcc_tran_thuoc
    expected: >
      Exit 0 và năm dòng PASS. TT1 (đối chứng dương, chiều im): hai nhát ở implemented — bộ
      sinh args thoát 0 và sinh tệp. TT2 (chiều đỏ, cùng fixture thêm một commit thước): ba
