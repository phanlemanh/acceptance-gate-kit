<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranh giới với ô đã park</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Đối chiếu hai cột · AC-2 · AC-11</p>
    <h1>Ranh giới với ô đã park</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= VẠCH NGĂN ================= -->
      <text x="568" y="96" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.18em">RANH GIỚI</text>
      <line x1="568" y1="112" x2="568" y2="336" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="4,4"/>

      <!-- ================= CỘT TRÁI — ô đã park ================= -->
      <rect x="192" y="112" width="352" height="224" rx="6"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="212" y="146" fill="#2d3142" font-size="14" font-weight="600"
            font-family="'Geist', sans-serif">Ô đã park</text>
      <text x="212" y="166" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace">baseline-127-tin-hieu-phan-biet</text>
      <rect x="436" y="132" width="88" height="20" rx="4" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">ĐANG PARK</text>
      <line x1="212" y1="184" x2="524" y2="184" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ================= CỘT PHẢI — việc vòng này ================= -->
      <rect x="592" y="112" width="352" height="224" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="612" y="146" fill="#2d3142" font-size="14" font-weight="600"
            font-family="'Geist', sans-serif">Việc của vòng này</text>
      <text x="612" y="166" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace">eval-khai-ma-thoat-mong-doi</text>
      <rect x="804" y="132" width="120" height="20" rx="4" fill="#2d3142"/>
      <text x="864" y="146" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">TRONG PHẠM VI</text>
      <line x1="612" y1="184" x2="924" y2="184" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ================= HÀNG ĐỐI CHIẾU ================= -->
      <!-- hàng 1 -->
      <text x="32" y="220" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">AI PHÁT NGÔN</text>
      <text x="32" y="234" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">KỲ VỌNG</text>
      <text x="212" y="224" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif">MÁY tự suy lấy</text>
      <text x="612" y="224" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif">NGƯỜI khai bằng tay</text>
      <line x1="212" y1="244" x2="524" y2="244" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="612" y1="244" x2="924" y2="244" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- hàng 2 -->
      <text x="32" y="272" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">LẤY KỲ VỌNG</text>
      <text x="32" y="286" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">TỪ ĐÂU</text>
      <text x="212" y="276" fill="#2d3142" font-size="12"
            font-family="'Geist', sans-serif">mã thoát của làn đối chứng</text>
      <text x="612" y="276" fill="#2d3142" font-size="12"
            font-family="'Geist', sans-serif">khai ở Cổng 1, ký ở Cổng Bằng chứng</text>
      <line x1="212" y1="296" x2="524" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="612" y1="296" x2="924" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- hàng 3 -->
      <text x="32" y="324" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">Ở TẦNG NÀO</text>
      <text x="212" y="324" fill="#2d3142" font-size="12"
            font-family="'Geist', sans-serif">thước-của-thước — tầng hai</text>
      <text x="612" y="324" fill="#2d3142" font-size="12"
            font-family="'Geist', sans-serif">tầng một</text>

      <!-- ================= DẢI VẬT HOÁ RANH GIỚI ================= -->
      <rect x="32" y="368" width="912" height="80" rx="6"
            fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="56" y="396" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.18em">VẬT HOÁ RANH GIỚI</text>
      <text x="56" y="420" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist Mono', monospace">lib/eval-yaml.cjs</text>
      <text x="176" y="420" fill="#2d3142" font-size="12"
            font-family="'Geist', sans-serif">cấm khai mã 97 và 127 — đúng hai mã là lãnh địa ô park.</text>
      <text x="56" y="438" fill="#4f5d75" font-size="10"
            font-family="'Geist', sans-serif">Ranh giới không sống bằng lời dặn: máy chặn ngay khi ai đó khai vào hai mã ấy.</text>

      <!-- ================= CHÚ GIẢI ================= -->
      <line x1="32" y1="472" x2="944" y2="472" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="128" y="486" width="24" height="14" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="160" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ô đã park — ngoài phạm vi</text>

      <rect x="344" y="486" width="24" height="14" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="376" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Việc trong phạm vi vòng này</text>

      <rect x="592" y="486" width="24" height="14" rx="4"
            fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="624" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ranh giới đã vật hoá bằng luật máy</text>
    </svg>
  </div>
</body>
</html>
