    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ban_do_khuon_roi_nhom
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/ban-do-khuon-roi-nhom.test.mjs]
    expected: >
      exit 0; "PASS: [RN-3]": ma trận viết sẵn (in «số hàng: 7»): khoi chuỗi · danh sách một dòng · danh sách khối (tệp
