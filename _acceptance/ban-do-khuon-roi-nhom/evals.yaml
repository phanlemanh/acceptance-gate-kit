schema_version: 1
feature_slug: ban-do-khuon-roi-nhom
# Ca đo của vòng: tên ca mở bằng «RN-», ở tests/scripts/ban-do-khuon-roi-nhom.test.mjs (đuôi .test.mjs — cũng chạy trong
# mảnh mjs của suite). Khoá executor (thêm ở vòng này):
#   executors.test.ban_do_khuon_roi_nhom — node tests/scripts/ban-do-khuon-roi-nhom.test.mjs, in «PASS: [RN-…]»/«FAIL: …».
#   executors.test.ban_do_khuon_roi_nhom_hai_kho — node tests/scripts/ban-do-khuon-roi-nhom-hai-kho.mjs (ca RN-5). Cần hai
#   kho trên máy (QUY_HANG_ROOT hoặc ~/onehub-quy-hang · CRM_ROOT hoặc ~/dev/crm) nên tệp không mang đuôi .test.mjs và
#   KHÔNG vào feature_loop.suite_keys; kho vắng hay thiếu commit ghim → thoát 2 nêu đường (mù, không xanh).
# Kho mẫu do code sinh trong lượt (bộ dựng chung tests/scripts/khuon-loi-kho-mau.mjs); «bộ máy gốc» = git archive
# eab2ca41 scripts lib feature-loop skills bung trong lượt, chạy trên CÙNG kho với cây đang kiểm. Mỗi ca «-do» chạy CHÍNH
# hàm kiểm trên bản sao TRỌN thư mục của cây đang kiểm bị tiêm một nhát (khớp đúng một lần), SAU khi bản lành xanh trên
# cùng fixture; bản sao phải chạy được (--dem in đúng dòng) trước khi tin màu đỏ; ghim thông điệp của ĐÚNG lỗi được
# tiêm. Kỳ vọng viết sẵn thành hằng trong tệp ca, không tính từ mã sản phẩm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ban_do_khuon_roi_nhom
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/ban-do-khuon-roi-nhom.test.mjs]
    expected: >
      exit 0; "PASS: [RN-1]": cùng lối dựng kho mẫu rời nhóm — bộ máy gốc thoát 1 và in đúng ba dòng báo viết sẵn
      "lệch: src/man/bang/Moi.tsx · thuộc hai nhóm màn: bang-du-lieu, trang-tam", "nợ cũ: src/man/bang/DanhSachMau.tsx ·
      thuộc hai nhóm màn: bang-du-lieu, trang-tam", "nợ cũ: src/thu/Thu.tsx · khuôn TrangTam" (đối chứng: fixture chạm
      luật); cây đang kiểm thoát 0, 0 dòng "lệch:"/"nợ cũ:"/"sai:". "PASS: [RN-1-do]": bản lành xanh; bản sao thay phép lọc
      rời nhóm trong nhomCuaTep bằng `true` → lỗi chứa "tệp rời nhóm vẫn bị chấm". Cũng trong RN-1: CLI `--json` của cây in
      bảy mục ngoai_le của trang-tam đều `"khoi": null`; bộ máy gốc in `"khoi": ""` cho cả bảy (đối chứng), và thay null
      bằng "" thì JSON của cây bằng hệt gốc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ban_do_khuon_roi_nhom
    paths: [scripts/ban-do-khuon.cjs, scripts/design-floor-khuon.mjs, tests/scripts/ban-do-khuon-roi-nhom.test.mjs]
    expected: >
