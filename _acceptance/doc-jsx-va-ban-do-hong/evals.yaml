schema_version: 1
feature_slug: doc-jsx-va-ban-do-hong
# Ca đo mở bằng «DJ-» ở tests/scripts/doc-jsx-va-ban-do-hong.test.mjs; khoá executors.test.doc_jsx_va_ban_do_hong in
# «PASS: [DJ-…]»/«FAIL: …». Bộ máy gốc = git archive c8fa5a65588609b622dc83a9b114d65d2bdc5b47 scripts lib feature-loop skills bung trong lượt, chạy trên CÙNG
# kho với cây đang kiểm. Mỗi ca «-do» chạy CHÍNH hàm kiểm trên bản sao TRỌN thư mục bị tiêm một nhát (khớp đúng một lần),
# SAU khi bản lành xanh trên cùng fixture, bản sao phải chạy được, và ghim thông điệp của đúng lỗi được tiêm. Kỳ vọng là
# hằng viết sẵn trong tệp ca, không tính từ mã sản phẩm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.doc_jsx_va_ban_do_hong
    paths: [scripts/ban-do-khuon.cjs, tests/scripts/doc-jsx-va-ban-do-hong.test.mjs]
    expected: >
      exit 0; "PASS: [DJ-1]": trên CÙNG một thẻ, bộ máy gốc thoát 1 có dòng chứa "thiếu khe title" và không có "thiếu khe
      children"; cây đang kiểm thoát 1 có "thiếu khe children" và không có "thiếu khe title". "PASS: [DJ-1-do]": bản lành
      xanh; bản sao bỏ bước bỏ qua biểu thức trong ngoặc nhọn → lỗi chứa "thẻ có mũi tên đọc sai".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.doc_jsx_va_ban_do_hong
    paths: [scripts/ban-do-khuon.cjs, tests/scripts/doc-jsx-va-ban-do-hong.test.mjs]
    expected: >
      exit 0; "PASS: [DJ-2]" in «số hàng: 32», số phép so đếm trong vòng lặp và so với hằng viết tay 32; thêm số nhát tiêm so với hằng 20; danh sách khe thiếu viết sẵn (khe đòi: title, children): mui-ten-truoc-co-con [] · mui-ten-truoc-tu-dong [children] · mui-ten-sau-co-con [] · mui-ten-sau-tu-dong [children] · khe-vang-co-con [title] · khe-vang-tu-dong [title, children] · khe-trong-bieu-thuc [title] · khe-trong-chuoi [title] · so-sanh [] · mui-ten-chua-tu-dong-co-con [] · mui-ten-chua-tu-dong-tu-dong [children] · ngoac-trong-chuoi [] · chuoi-mau-long [] · jsx-long-mot-nhay [] · jsx-long-hai-nhay [children] · jsx-long-nhay-le [] · bieu-thuc-chinh-quy-ngoac [] · dau-chia [children] · chu-thich-cap-the [] · chu-thich-trong-bieu-thuc [] · tham-so-kieu [] · tham-so-kieu-mui-ten [children] · nhieu-dong [children] · khe-tran [children] · chu-thich-dong-trong-bieu-thuc [] · chu-thich-dong-cap-the [] · url-trong-jsx-long [] · bieu-thuc-chinh-quy-lop [] · bieu-thuc-chinh-quy-thoat [] · chuoi-thoat-nhay [] · chuoi-mau-thoat [] · chuoi-mau-long-mau []. "PASS: [DJ-2-chot]": bỏ một hàng → lỗi chứa "số phép so 31, cần 32". "PASS: [DJ-2-do]": bản lành xanh; bản sao làm phẳng giữ nguyên ruột ngoặc nhọn → lỗi chứa "khe trong biểu thức con bị tính" ở hàng khe-trong-bieu-thuc. Một nhát tiêm cô lập mỗi nhánh bỏ qua, mỗi ca ghim đúng tên hàng đỏ: "PASS: [DJ-2-chuoi]" ngoac-trong-chuoi · "PASS: [DJ-2-mau]" chuoi-mau-long · "PASS: [DJ-2-cmt]" chu-thich-trong-bieu-thuc · "PASS: [DJ-2-cmt-the]" chu-thich-cap-the · "PASS: [DJ-2-regex]" bieu-thuc-chinh-quy-ngoac · "PASS: [DJ-2-chia]" dau-chia · "PASS: [DJ-2-kieu]" tham-so-kieu · "PASS: [DJ-2-nhay]" jsx-long-hai-nhay · "PASS: [DJ-2-le]" jsx-long-nhay-le · "PASS: [DJ-2-cmt2]" chu-thich-dong-trong-bieu-thuc · "PASS: [DJ-2-url]" url-trong-jsx-long · "PASS: [DJ-2-cmt2-the]" chu-thich-dong-cap-the · "PASS: [DJ-2-chuoi-the]" khe-trong-chuoi · "PASS: [DJ-2-kieu-mui-ten]" tham-so-kieu-mui-ten · "PASS: [DJ-2-regex-lop]" bieu-thuc-chinh-quy-lop · "PASS: [DJ-2-regex-esc]" bieu-thuc-chinh-quy-thoat · "PASS: [DJ-2-chuoi-esc]" chuoi-thoat-nhay · "PASS: [DJ-2-mau-esc]" chuoi-mau-thoat · "PASS: [DJ-2-mau-long]" chuoi-mau-long-mau.
