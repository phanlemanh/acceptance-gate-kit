      hang-viec, vai}. "ok" cho "DP2-06 khong-dot": kho thử không đợt → đúng một mục "thieu" là co-dot, thoát
      0, băm cây kho trước == sau. "ok" cho "DP2-06-do hang-viec-hong": hang-viec.json sai khuôn → mục
      hang-viec "thieu" và viec nêu trường sai.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/hang.mjs, dieu-phoi/scripts/pha.mjs, dieu-phoi/scripts/lich.mjs, dieu-phoi/scripts/phat-lich.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-07 doi-ke-hoach": năm lệnh (hang day-len, hang them, hang nghi, pha tam-dung,
      pha dang-chay) mỗi lệnh: hang-viec.json/dieu-khien.json đổi đúng trường viết sẵn, LUAT.md thêm đúng 1
      dòng dưới «## Nhật ký», su-kien.jsonl thêm đúng 1 sự kiện. "ok" cho "DP2-07 ap-nhip-ke": sau `hang nghi
      P2` một nhịp → tiep/P2.json không có hàng; sau `hang day-len B --truoc A` → hàng kế của dãy là B.
      "ok" cho "DP2-07 chay-lai": mỗi lệnh trong năm lệnh chạy lần hai → thoát 0, băm hang-viec.json,
      dieu-khien.json, LUAT.md, su-kien.jsonl sau lần hai == sau lần một.
      "ok" cho "DP2-07-do ma-la": `hang day-len KHONG-CO --truoc A` → thoát 1 nêu "KHONG-CO", băm hai tệp
      trước == sau.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/nguon-hang.mjs, dieu-phoi/scripts/goi-dot.mjs, scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-08 round-trip": kho thử có tệp lộ trình code sinh (một hàng có slug, một hàng
      không slug có dấu tiếng Việt trong câu giao) + _acceptance/config.yaml khai lo_trinh.tep → tập (ma,
      slug) của bộ đọc gói == tập (r._ma, r.slug ?? suySlug(r.cau_giao)) tính bằng kiemKhuon + suySlug của
      lo-trinh.mjs THẬT của cây kit; chạy product-map.mjs THẬT để dựng LO-TRINH.html → nhom_trang_thai theo
      ma của bộ đọc gói == của docDuLieu trong lo-trinh.mjs trên cùng trang. "ok" cho
