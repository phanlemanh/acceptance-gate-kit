      0, đúng một dòng stderr nêu tên tệp, hang-viec.json giữ hàng khai tay của gói. "ok" cho "DP2-08-do
      lech-slug": bản sao bộ đọc gói bỏ bước bỏ dấu → hàng không slug lệch với suySlug của kit, ca đỏ nêu mã.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/the.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-09 khoi-tao": ma trận viết sẵn 7 hàng mang ma (số assert = 7): (a) ô decision
      build → đã quyết; (b) có contract.md → đã quyết; (c) chưa có thư mục → chờ; (d) ô stage discovery
      chưa decision → chờ; (e) ô decision park → không vào đợt, nằm ở canh_bao[]; (f, S4-r1) ô `decision:` trơn không chú thích
      → chờ; (g, S4-r1) ô `decision: "build"` có nháy → đã quyết. JSON có day[], hang[];
      hoi[] == ["quyen-tu-merge"] cộng đúng một mục build cho mỗi hàng chờ; may_di_tiep[] chứa "uu-tien" và
      "lan-v"; cho_cong_dang[] == [slug (c), slug (d), slug (f)]; canh_bao[] nêu slug (e). "ok" cho "DP2-09 dong": đợt có một
      hàng không ma và một lần day-len → hang_phat_sinh == [hàng không ma], lop_phu == [lần day-len].
