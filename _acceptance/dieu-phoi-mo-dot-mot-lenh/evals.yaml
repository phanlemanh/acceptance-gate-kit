      không đổi; 7 ô còn lại ném lỗi chứa "<từ> → <sang>" và băm tệp trước == sau. "ok" cho "DP2-04-do bo-bang": bản sao
      pha.mjs cho phép mọi chuyển → ô dang-dong→nhap không còn bị từ chối, ca đỏ nêu "dang-dong → nhap".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/pha.mjs, tests/dieu-phoi/mo-dot.test.mjs, tests/dieu-phoi/fixtures/dot-crm-0910/**]
    expected: >
      exit 0; "ok" cho "DP2-05 cap-theo-pha": ma trận 4 pha × 2 đơn (merge, s4) viết sẵn, mỗi pha một thư
      mục đợt code sinh, một nhịp taoVong với io giả → cap đúng bảng {dang-chay: merge+s4, nhap: không,
      tam-dung: không, dang-dong: merge}; trang-thai.json.pha == pha. "ok" cho "DP2-05 dot-cu": fixture
      dot-crm-0910 (không dieu-khien.json) chạy một nhịp → trang-thai.json.pha "dang-chay", 0 loi-nhip.
      "ok" cho "DP2-05-do bo-pha": bản sao phat-lich.mjs bỏ kiểm pha → ô nhap cấp đơn, ca đỏ nêu "nhap".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/chan-doan.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-06 khung": đợt mở từ gói → JSON là mảng, mọi phần tử đúng ba khoá muc/
