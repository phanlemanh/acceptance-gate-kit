schema_version: 1
feature_slug: dieu-phoi-mo-dot-mot-lenh
# Ca đo của hàng sống ở tests/dieu-phoi/mo-dot.test.mjs (tên ca bắt đầu «DP2-»). Khoá executor thêm ở S3:
#   executors.test.dieu_phoi_dp2 = node --test trên tests/dieu-phoi/**, gộp dòng «ok … DP1-…|DP2-…», «not ok» và
#     tổng kết TAP thành MỘT dòng (lượt chấm chỉ giữ vài dòng cuối của lệnh xanh)
#   executors.test.dieu_phoi_lb   = LB_CASES=LB1,LB2 node tests/plugins/lenh-bam-duoc.test.mjs
# Kho thử do code sinh trong lượt (git init trong thư mục tạm). Đường dẫn suy từ vị trí tệp test. Mỗi ca đỏ
# chạy CHÍNH hàm/lệnh đo trên bản sao bị tiêm, SAU khi bản lành xanh trên cùng fixture, và ghim thông điệp.
# Mỗi eval ghim đúng dòng TAP «ok … - DP2-…». Suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/commands/**, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; stdout có "ok" cho "DP2-01 ba-lenh": tập tên tệp dưới dieu-phoi/commands/ == {mo-dot.md,
      dong-dot.md, xem.md} (đẳng thức tập, in ra); không tệp nào có dòng frontmatter
      `disable-model-invocation`; không tệp nào chứa `plugins/cache`; mọi chuỗi `node …/scripts/<x>.mjs`
      gọi script CỦA GÓI (x.mjs có trong dieu-phoi/scripts/) bắt đầu bằng `${CLAUDE_PLUGIN_ROOT}/scripts/`,
      chuỗi qua `${CLAUDE_PLUGIN_ROOT}` trỏ tệp có thật trong gói, và script gói anh em (vd lo-trinh.mjs
      của acceptance-gate) chỉ được gọi qua một biến đã giải (`$AG`), không đường cố định; thân mo-dot.md và dong-dot.md mỗi tệp
      có dòng nằm giữa marker CHU-QUYET-CUA-NGUOI. Và "ok" cho "DP2-01-do khoa-xem": bản sao thêm
      `disable-model-invocation: true` vào xem.md → chính hàm kiểm trả lỗi nêu "xem.md". Trình tự mo-dot.md
      (S4-r1): "chan-doan --json --mo" đứng trước dòng DỪNG khi goi-dot thiếu, dòng đó đứng trước lời gọi
      `mo $ARGUMENTS`; "ok" cho "DP2-01-do thu-tu": bản sao bỏ --mo và dòng DỪNG → hàm kiểm nêu "mo-dot.md: trình tự".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.dieu_phoi_validate
    paths: [dieu-phoi/commands/**, dieu-phoi/.claude-plugin/plugin.json, dieu-phoi/hooks/hooks.json]
    expected: >
      exit 0; stdout có "PASS: DP1-01b validate" (bộ kiểm gói Claude Code --strict sạch lỗi trên gói đã có
      thư mục commands/) và "PASS: DP1-01b-do bo-lop-hooks".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1c
    criterion: AC-1
    executor: judgment
    inputs: [dieu-phoi/commands/mo-dot.md, dieu-phoi/commands/dong-dot.md, _acceptance/dieu-phoi-mo-dot-mot-lenh/contract.md, docs/superpowers/specs/2026-10-10-dieu-phoi-mo-dot-mot-lenh-design.md, docs/superpowers/specs/2026-10-10-dieu-phoi-workflow-design.md]
    question: >
      Đọc trình tự mà AC-1 của contract.md khai cho hai lệnh (thứ tự các bước, chỗ DỪNG khi mục goi-dot
      thiếu, chỉ pha dang-dong sau khi người duyệt thẻ đóng) và phần Out of scope / Later (ngưỡng hạn mức
      thuộc DP4; T15 thay «ba quyết định có khuyến nghị»). Thân mo-dot.md và dong-dot.md có đi đúng trình tự
      đó không? Và có chỗ nào thân lệnh để máy TỰ SINH chữ quyết của người (chữ duyệt thẻ, chữ build cho một
      hàng, quyền tự merge) không? Lưu ý: CHÉP chữ người đã gõ vào decided_by là hợp lệ (spec workflow §14
      chỗ nối 2), không tính là tự sinh. Trả PASS khi đúng trình tự và không chỗ nào máy tự sinh chữ quyết.
    evidence_required: [run_id, verdict, rationale]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/goi-dot.mjs, dieu-phoi/scripts/vai.mjs, dieu-phoi/scripts/pha.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-02 mo-tu-goi": kho thử khai dieu_phoi.goi_dot = "goi/dot-{ten}" và gói đủ ba
      tệp do ca dựng → sau `mo thu`: hai tệp JSON của đợt == bản gói cộng goc_kho/dot (so sâu), LUAT.md ==
      khuôn của gói + nguyên văn LUAT-rieng.md (so chuỗi), vai.json có giam_sat và day == day của gói,
      dieu-khien.json pha "nhap" và nguon_goi == đường gói. "ok" cho "DP2-02 chay-lai": `mo thu` lần hai
      thoát 0, stdout "đợt thu đã mở", băm cây thư mục đợt trước == sau. "ok" cho "DP2-02 co-goi-thang":
      --goi trỏ gói khác → dùng gói của cờ. "ok" cho "DP2-02-do thieu-tep": gói thiếu LUAT-rieng.md → thoát
      1, stderr nêu "LUAT-rieng.md", không có thư mục đợt và không symlink.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/chan-doan.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-03 dung-tay": kho thử không khai goi_dot → `mo thu` thoát 0, dieu-khien.json
      pha "dang-chay" và nguon_goi null; `chan-doan --json` có mục goi-dot trang_thai "thieu" và viec chứa
      "dieu_phoi.goi_dot". Cùng ca, kho có gói → mục goi-dot "du" (đối chứng hai chiều trên cùng hàm). "ok" cho
      "DP2-03 chan-doan-truoc-mo" (S4-r1): kho chưa có đợt, `chan-doan --json --mo thu` → goi-dot "thieu" có
      "dieu_phoi.goi_dot" khi không khai, "thieu" nêu thư mục khi khai mà vắng thư mục, "du" khi có gói hoặc --goi;
      không tạo .acceptance-runs; gọi trơn vẫn "khong-ap" (AC-6).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dieu_phoi_dp2
    paths: [dieu-phoi/scripts/pha.mjs, tests/dieu-phoi/mo-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-04 bang-chuyen": ma trận viết sẵn 4×4 = 16 ô (in số ô, số assert = 16): 5 ô cho
      phép (nhap→dang-chay, dang-chay→tam-dung, tam-dung→dang-chay, dang-chay→dang-dong, tam-dung→dang-dong)
