schema_version: 1
feature_slug: vong-la-mot-ket-qua
# Ca đo sống ở tests/scripts/lo-trinh.test.mjs (LT-142..LT-150), executor `executors.test.lo_trinh` sẵn
# có. Kho thử do code sinh trong lượt (git init thư mục tạm). Bản phạm vi thử sinh bằng hàm ghi `vietPV`
# (rút khuôn dòng từ khối PHAM-VI-MA của khuôn); khoảng cỡ trong mọi bảng kỳ vọng RÚT từ khối
# CAT-LUOT-CO của SKILL trong ca, không chép số. usage-report.md của kho thử sinh bằng CHÍNH
# feature-loop/scripts/wf-usage.mjs (bên ghi thật) với tiêu đề lấy từ dòng `--title` của Feature Loop
# SKILL. Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao gói bị tiêm, SAU khi bản lành xanh trên cùng kho, và
# ghim thông điệp rút từ đầu ra của hàm đo. Răng «gốc» = `git archive 68951cef scripts lib skills`.
# Mỗi eval ghim đúng dòng "PASS: LT-…".
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, skills/cat-luot/SKILL.md, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-142" — đối chứng dương: gói lành, hàng 11 tiêu chí ra `tren-muc-tieu`,
      thoát 0. Bản sao gói sửa khối (`tach_tu: 11`, `cho_phep_den: 10`) → cùng hàng ra `can-tach`, thoát 1.
      Ma trận khối hỏng viết sẵn: vắng khối · thiếu từng khoá (5 ca, mỗi khoá một) · `muc_tieu: 0-10` ·
      `tran_luot_cham: 0` · `it_du_lieu_duoi: abc` · `muc_tieu: 10-8` · `cho_phep_den: 9` · `tach_tu: 14`
      (hở) · `tach_tu: 12` (chồng) — mỗi ca thoát 2, stderr nêu đúng tên khoá hỏng, stdout không có «bảng
      phủ»; số ca == 13 (in ra). Và "PASS: LT-142-do" — bản sao script nướng khoảng thành hằng (bỏ
      đọc khối): CHÍNH hàm đo trả lỗi nêu «khối sửa không đổi cờ».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
