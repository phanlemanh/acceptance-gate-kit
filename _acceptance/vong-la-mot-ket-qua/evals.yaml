  - id: E10
    criterion: AC-10
    executor: judgment
    inputs:
      - skills/cat-luot/SKILL.md
      - skills/acceptance/references/lo-trinh-template.json
      - _acceptance/vong-la-mot-ket-qua/mau/pham-vi-curator.md
    question: >
      Chỉ dùng ba tệp trong inputs, hãy tự làm theo SKILL cắt lượt và cắt bản phạm vi mẫu (13 mã D1 +
      H1–H12 của kế hoạch bàn giao media-library, vốn từng bị cắt thành 13 hồ sơ theo gốc kỹ thuật) thành
      hàng lộ trình theo khuôn: ghi ra các hàng bạn cắt (ma · cau_giao · vai · tieu_chi · phu) và chân
      trời nếu có. Rồi chấm CHÍNH các hàng ấy: (1) mỗi hàng một kết quả, ít hàng hơn 13, không hàng nào
      gom theo gốc kỹ thuật; (2) mỗi hàng có tieu_chi trong khoảng của khối CAT-LUOT-CO, hoặc đã tách/gộp
      theo khối; (3) câu giao đúng một trong hai dáng — có vai mở câu cho việc người dùng thấy, vai `nen`
      kèm bat_khi đo được cho việc nền, không ép «Là kỹ sư…»; (4) mọi mã ở đúng một hàng hoặc chân trời;
      (5) không hàng nào mang trường cho agent. Với mỗi vế, nêu bước/khối nào của SKILL dẫn tới lựa chọn;
      vế nào SKILL không dẫn được (bạn phải tự đoán) thì vế ấy FAIL. Trả PASS chỉ khi cả năm vế đạt.
    evidence_required: [run_id, verdict, proposals]
