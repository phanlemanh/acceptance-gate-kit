    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: judgment
    inputs: [commands/start.md, scripts/trang-thai-ho-so.cjs, skills/acceptance/references/human-facing-language.md]
    question: >
      Đọc khối START-VAT-DA-O-NHANH-GOC và điều khoản bàn giao cho dòng vat-da-o-nhanh-goc ở
      bước 4 của commands/start.md, cùng hai chữ của khoá ấy trong bảng chữ trạng thái; đối
      chiếu với điều khoản MỘT câu hỏi chọn ở bước 4 và luật N1–N6 của bản luật ngôn ngữ mặt
      người. Thẻ có mời resume trơn vào một hồ sơ «đã duyệt» có vật đã merge ở bất kỳ đường nào
      không?
    expected: >
      PASS khi: (1) dòng này không in bước máy kế; (2) hai lối nằm trong cùng câu hỏi chọn,
      không thêm câu hỏi, không thêm cổng; (3) lối «chấm lại» bàn giao kèm câu dặn đưa hồ sơ
      về implemented trước S4, và không có đường nào đưa lệnh resume trơn; (4) lối «đóng theo
      quan sát» kết thúc lệnh mở phiên, không tự ghi gì; (5) nhãn và việc kế trong bảng chữ
      qua được phép thử xoá-tên-máy. REJECT khi thiếu một trong năm.
    evidence_required: [verdict, rationale]
  - id: E7a
    criterion: AC-7
    executor: script
    cmd: config:executors.script.chup_ca_2_15
    expected: >
      Exit 0, và đầu ra có sáu dòng PASS mở đầu bằng «PASS: CH0 », «PASS: CH1 », «PASS: CH2 »,
      «PASS: CH3 », «PASS: CH4 », «PASS: CH5 » — mỗi ca một dòng riêng, không lấy từ dòng tổng
      kết. CH2–CH4 là chiều đỏ trên CÙNG fixture của CH1, chỉ đổi đích ghi; CH0 gồm mutant
      tiêm một mảng chuỗi vào bản sao mã nguồn của module.
    paths: [feature-loop/scripts/chup-ho-so-da-thong.mjs, feature-loop/scripts/repin-lane.mjs, tests/scripts/chup-ho-so-da-thong.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7b
    criterion: AC-7
    executor: script
    cmd: config:executors.script.chup_cay_that_2_15
    expected: >
      Exit 0 và dòng cuối «PASS: chup-cay-that <n> ho so da thong cong (<m> tep) truoc <k> lenh
      tai HEAD <sha8> · sau: 0 tep bi cham» với n LỚN HƠN 0 và k BẰNG số khoá của
      feature_loop.suite_keys (năm ở config hiện tại). Mỗi lệnh in một dòng «[chup] lệnh i/k
      exit 0». sha8 in ra BẰNG HEAD mà lượt chấm ghi nhận. Chiều đỏ ghim mã: 2 không có nền (không
      git · cây chấm có tệp chưa commit ngoài _acceptance/ — worktree tại HEAD không phải vật đang
      chấm · không dựng được worktree · suite_keys không giải được · chụp rỗng) · 3 có tệp bị
      chạm, in từng đường tệp · 4 một lệnh đỏ · 5 thiếu cờ. Chốt cây bẩn đã thử thật: trên cây
      chưa commit bước nâng số → mã 2 gọi tên tệp. Đã thử thật trong phiên dựng hồ sơ bằng cờ thay lệnh: lệnh không chạm gì →
      0 · ghi thêm vào hợp đồng đã ký của mốc 2.14.0 → mã 3 gọi đúng tệp «đổi nội dung» · lệnh
      đỏ → mã 4 · ghi vào hồ sơ draft và thư mục lượt chạy → 0 (chiều im). Lệnh chạy trong
      worktree tách, KHÔNG trên cây của lượt chấm; thời gian ≈ thời gian chạy trọn các suite.
    paths: [feature-loop/scripts/chup-ho-so-da-thong.mjs, _acceptance/release-2-15-0/rang-chup-cay-that.mjs, _acceptance/config.yaml]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.mot_nguon_2_15
    expected: >
      Exit 0 và đúng một dòng «PASS: mot-nguon DA_THONG_CONG_2 — hang AG-ENGINE co (<n>
      hang) · GL03 xanh · khoi gach ho so da ky <m> dong, khong dong nao cho rang chup ho so ·
      module khong go tay trang thai, 2 tep khong chua chuoi RT13 quet (doi chung: lib va tep
      ca RT13 co) · RT13 xanh». Chiều đỏ ghim mã: 2 không có nền · 3 GL03 đỏ · 4 RT13 đỏ · 5
      hồ sơ đã ký còn khai gạch · 6 module gõ tay trạng thái hoặc tệp chứa chuỗi RT13 quét · 7
      thiếu hàng bảng · 8 thiếu cờ. Đã thử thật trên cây làm việc rồi khôi phục: tiêm một dòng
      gạch → mã 5 · tiêm một mảng trạng thái vào module → mã 6 · gỡ hàng bảng → mã 7. Bản đầu
      của vế 6 khai rộng hơn sự thật và đỏ mã 6 ngay lần chạy đầu — xem Notes §3 lớp bốn.
    paths: [feature-loop/scripts/repin-lane.mjs, feature-loop/scripts/chup-ho-so-da-thong.mjs, tests/scripts/chup-ho-so-da-thong.test.mjs, _acceptance/ra-co-ten-lam-va-trao/contract.md, _acceptance/release-2-15-0/rang-mot-nguon.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9a
    criterion: AC-9
    executor: script
    cmd: config:executors.script.vong_meta_2_15
    expected: >
      Exit 0, và đầu ra có năm dòng PASS mở đầu bằng «PASS: VM1 », «PASS: VM2 », «PASS: VM3 »,
      «PASS: VM4 », «PASS: VM5 ». VM5 chạy bản sao TRỌN scripts/ và lib/, đối chứng dương
      xanh trước, rồi gỡ đúng một dòng đếm (neo đúng một lần) và đòi phán của VM2 đỏ ở n và cờ.
      Ngoài ca, trong phiên dựng hồ sơ đã thử ba đột biến khác trên bản sao — bỏ lọc hồ sơ mốc ·
      bỏ phép «sinh sau mốc» · bỏ lọc dòng version — cả ba làm VM1, VM2, VM5 đỏ.
    paths: [scripts/start-scan.mjs, tests/scripts/vong-meta-dang-mo.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9b
    criterion: AC-9
    executor: judgment
    inputs: [commands/start.md, skills/acceptance/references/human-facing-language.md]
    question: >
      Đọc khối START-VONG-META trong bước 3 của commands/start.md và dòng khoá metaOpen trong
      khối START-SCAN-KEYS; đối chiếu với luật N1–N6 của bản luật ngôn ngữ mặt người và điều
      khoản MỘT câu hỏi chọn ở bước 4. Dòng đếm vòng meta có biến thành một câu hỏi, một cổng,
      hay một lời máy chọn hộ ở đường nào không, và «chưa biết» có bị in thành số 0 không?
    expected: >
      PASS khi: (1) dòng chỉ in khi metaOpen.applies là true, không in ở repo tiêu thụ; (2) in số
      kèm tên từng hồ sơ, không cắt; (3) cờ là một câu, không thêm câu hỏi, không thêm cổng, không
      lệnh, máy không chọn hộ; (4) n null in thành «chưa đếm được», không in 0; (5) câu chữ qua
      phép thử xoá-tên-máy. REJECT khi thiếu một trong năm.
    evidence_required: [verdict, rationale]
