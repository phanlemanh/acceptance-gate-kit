schema_version: 1
feature_slug: release-2-15-0
# Khuôn theo 2.13.0/2.14.0: mỗi eval máy ghim dòng PASS của chính ca hoặc răng nó gọi,
# phán quyết không lấy từ mã thoát trọn suite. Mọi cmd đi qua config: ref.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.p200_cat_so_2_15
    expected: >
      Exit 0 và đầu ra có đúng một dòng «PASS: P200 xanh (dung 1 dong PASS cua chinh no;
      phan quyet KHONG lay tu ma thoat tron suite; rang ban <8 hex>)». Răng chép nguyên thân
      từ 2.14.0. Chiều đỏ ghim mã như 2.14.0: 2 chưa từng chạy · 3 P200 in FAIL · 4 nhiều hơn
      một dòng PASS · 5 không tới kết luận · 8 không đọc được dấu bản răng. Vế giá trị
      «2.15.0» KHÔNG nằm trong eval — owner xác nhận trên thẻ.
    paths: [.claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, GUIDE.md, _acceptance/release-2-15-0/rang-p200.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.so_tang_2_15
    expected: >
      Exit 0 và đúng một dòng «PASS: so trong cay (<số>) TANG theo semver so voi so tai
      commit dua ho so moc vao kho (<sha>) = <số cũ> — neo suy TU KHO, khong ghim sha».
      Chiều đỏ ghim mã: 2 không có nền · 3 số KHÔNG tăng · 4 không đọc được số tại neo · 5
      không tới kết luận. Đã thử thật trong phiên dựng hồ sơ: cây chưa nâng số → mã 3 «BANG
      so tai neo»; sau khi nâng → 0.
    paths: [.claude-plugin/plugin.json, _acceptance/release-2-15-0/rang-so-tang.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.moc_diagram_2_15
    expected: >
      Exit 0 và đúng một dòng «PASS: diagram-design KHONG doi ke tu lan cat so gan nhat
      (<sha>), so doc duoc tai HEAD la 2.7.0 (doi chung duong: cua so moc..HEAD KHONG rong;
      bo loc diagram-design/ con khop vat; rang ban <8 hex>)». Chiều đỏ ghim mã như 2.14.0:
      2 · 3 · 4 · 5 (có đổi mà giữ số) · 6 · 8.
    paths: [diagram-design/.claude-plugin/plugin.json, _acceptance/release-2-15-0/rang-moc.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.vdg_nhom_moi_2_15
    expected: >
      Exit 0, và đầu ra có dòng «PASS: VDG1 a-vat-da-vao» cùng hai dòng PASS của VDG4 (bằng
      chứng đổi tên xep-lai) và VDG6 (chưa có kế hoạch). Ca ghim nhãn và việc kế GÕ TAY
      trong tệp ca, không rút từ bảng chữ — sửa bảng sai thì đỏ.
    paths: [scripts/start-scan.mjs, scripts/trang-thai-ho-so.cjs, tests/scripts/vat-da-o-nhanh-goc.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
