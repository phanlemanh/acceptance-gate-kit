  - id: E10e
    criterion: AC-10
    executor: script
    cmd: config:executors.script.product_map
    expected: "Exit 0, «PRODUCT-MAP.md khớp hồ sơ xưởng.»"
    paths: [PRODUCT-MAP.md, scripts/product-map.mjs, scripts/trang-thai-ho-so.cjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: judgment
    question: >
      Đọc ## Notes của hợp đồng. Bốn khối (năm dòng số · lớp vendored · lớp lỗi tái phát ·
      nhát cắt kế) có ĐỦ MẶT không; bảng năm dòng có ĐỦ BA CỘT (vòng R1 · phiên crm · ba việc
      meta) không; mỗi ô có NGUỒN RÚT hoặc «không đo được» kèm lý do không; dòng 2 có tách
      trong/ngoài thiết kế và gọi tên lớp hạ tầng không. KHÔNG tính lại con số nào ngoài BỐN
      phép đối chiếu: (i) dòng 4 cột R1 — 42,83 · 34,82 · 69,43 · 147,77 M — so §5 finding R1 ·
      (ii) dòng 4b cột R1 — 20,2 · 10,0 · 2,7 · 9,5 % và làn ui 91,2 % — so bảng §3 finding R1 ·
      (iii) dòng 2 cột R1 so dòng «Tổng» §4 finding R1 · (iv) dòng 2 cột crm so bảng §1 finding
      truy nguyên · (v) số 145,93 M của vòng meta nặng nhất 2.14 so dòng 4 Notes §1 của hợp đồng mốc
      2.14.0, cùng câu giải thích 142 M và 146 M của finding bối cảnh là hai nền. NĂM phép ấy là
      danh sách ĐÓNG. Bảng phải có BỐN cột (R1 · phiên crm · vòng meta đã ký · ba việc chip). Rồi:
      khối năm dòng có nói THẲNG bảy điều bất lợi không — cửa sổ «0 vòng meta mới» có một vòng
      meta đã ký trước R mà tài liệu tổng kết bỏ sót · token một vòng sản phẩm không rẻ hơn vòng meta nặng nhất 2.14 · lượt gọi
      người vượt trần bốn vòng liền · tìm-lỗi 9,5 % nhưng làn ui 91 % · việc meta của cửa sổ không
      có token · ngưỡng mở lại luật (a) đã chạm · router trượt lần thứ tư. Cuối cùng: §4 có gọi tên
      đủ năm nhát cắt owner dịch 17/09 (thuoc-co-cua thu hẹp là vòng meta 2.15→2.16 với ① ② ④ ·
      router mặc định 2.16→2.17 và bỏ công thức 4b · làn ui · park cho vòng · S4 và CI chưa
      chụp cây) và định đoạt HAI mục T1 của R2 kèm lý do, và giữ R3 không chạy chiến dịch.
    inputs:
      - _acceptance/release-2-15-0/contract.md
      - docs/findings/2026-09-17-quan-sat-r1-ba-dinh.md
      - docs/findings/2026-09-16-truy-nguyen-thuoc-khong-co-cua.md
      - docs/findings/2026-09-17-boi-canh-truoc-va-sau-R.md
      - _acceptance/release-2-14-0/contract.md
    expected: >
      PASS khi bốn khối có mặt, bảng đủ bốn cột với nguồn từng ô, dòng 2 tách trong/ngoài và gọi
      tên hạ tầng, NĂM phép đối chiếu khớp, bảy điều bất lợi nói thẳng, §4 đủ năm nhát cắt và hai
      định đoạt R2 có lý do. Che bất kỳ điều bất lợi nào là FAIL.

      Nguồn gốc của R1 và phiên crm nằm ở hai repo tiêu thụ, không trong kho này; đối chiếu là
      với nhân chứng đã đọc chúng, và hợp đồng khai thẳng thế. Hội đồng KHÔNG suy rộng ra số khác.
    evidence_required: [judged_by, verdict, votes, rationale]
  - id: E12a
    criterion: AC-12
