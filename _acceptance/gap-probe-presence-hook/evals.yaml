evals:
  # 8 eval máy dùng chung suite scripts (nơi pre-merge-check.sh được test).
  # Độ phân giải per-AC nằm ở tên case GP* bên trong suite — giới hạn đã ghi rõ
  # ở mục Out of scope của contract, không giấu.
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM1: mode required + thiếu cả file lẫn descope → stdout có VIOLATION nêu slug, exit != 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM2 + GPM2b: advisory VÀ khoá vắng → stdout có NOTE, KHÔNG có VIOLATION, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM3: mode off → stdout KHÔNG chứa chuỗi gap-probe nào, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM4: contract T1 + mode required → KHÔNG in gì về gap-probe (thừa hưởng vòng lọc REQUIRED_FOR), exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM5: verdict clean và verdict findings → im lặng ở cả required lẫn advisory, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM6: gap-probe.md rỗng (touch) và verdict rác → VIOLATION ở required, exit != 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM7 + GPM7b: entry descope thường VÀ bản thụt-đầu-viết-hoa → KHÔNG violation, NOTE nêu id entry, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM8: verdict probe-failed ở mode required → NOTE, KHÔNG violation, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM10: contract T3 status draft và status approved, mode required → KHÔNG in gì về gap-probe, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM11: gap_probe với giá trị \"required\" (nháy), Required (hoa) → nhận đúng là required; requird (sai chính tả) → in cảnh báo cấu hình sai, KHÔNG âm thầm về advisory"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  # E12 gác cổng cho E9: judge chỉ chấm được nếu gói bằng chứng ĐỦ cả 4 dạng
  # thông điệp. Thiếu gác này thì file chỉ có VIOLATION là judge vẫn PASS —
  # đúng lỗi d-109, lần đó có mắt người bắt, lần này thì không.
  - id: E12
    criterion: AC-9
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM12: evidence/premerge-messages.txt tồn tại và chứa đủ 4 nhãn — VIOLATION(required) · NOTE(advisory) · NOTE(descope nêu id) · NOTE(probe-failed)"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E13
    criterion: AC-12
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM13: slug thiếu gap-probe nhưng NGOÀI diff PR → không in gì; chạy không --base → bỏ qua kèm NOTE nói rõ, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E14
    criterion: AC-13
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM17: decisions.jsonl CHỈ có một dòng JSON hỏng trông giống descope gap-probe → VẪN VIOLATION ở required (fail-CLOSED), và decision card trên cùng artifact cũng phất cờ — hai bên cùng kết luận"
    paths: [lib/gap-probe.js, scripts/pre-merge-check.sh, scripts/gate-card.js, tests/scripts/**]
  - id: E15
    criterion: AC-14
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM18a/b: mode required + vắng node HOẶC xoá lib/gap-probe.js → VIOLATION (exit != 0) kèm marker GAP-PROBE: NOT ENFORCED; mode advisory cùng tình huống → marker + NOTE, exit 0"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E16
    criterion: AC-15
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P37: template config trong acceptance-init của CẢ HAI harness (commands/acceptance-init.md và codex/acceptance-gate/skills/acceptance-init/SKILL.md) đều có khoá gap_probe"
    paths: [commands/acceptance-init.md, codex/acceptance-gate/skills/acceptance-init/SKILL.md, tests/plugins/**]
  - id: E17
    criterion: AC-16
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM19: mỗi lý do tắt (thiếu node · thiếu lib · thiếu --base · git diff lỗi) đều in ĐÚNG MỘT dòng 'GAP-PROBE: NOT ENFORCED reason=' và dòng tổng kết cuối khai đã tắt"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E18
    criterion: AC-17
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM15 (giữ từ v2): lịch sử rời nhau khiến git diff thoát != 0 → mode required cho VIOLATION + marker, TUYỆT ĐỐI không coi danh sách rỗng là 'không slug nào liên quan'"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E19
    criterion: AC-18
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM14 (giữ từ v2): _acceptance/ nằm ở pkg/ (không phải git root) + slug T3 trong diff thiếu gap-probe → VẪN VIOLATION, không tắt im lặng"
    paths: [scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E20
    criterion: AC-19
    executor: script
    cmd: config:executors.test.plugins
    expected: "case P38: gate-card.js require lib/gap-probe.js VÀ không còn literal regex descope nào của riêng nó (grep -F trên chuỗi regex)"
    paths: [lib/gap-probe.js, scripts/gate-card.js, tests/plugins/**]
  - id: E21
    criterion: AC-20
    executor: script
    cmd: config:executors.test.scripts
    expected: "case GPM20: bảng >=8 đầu vào (hoa/thường, khoảng trắng, JSON hỏng, verdict lạ) chạy qua CẢ HAI lối vào → kết luận khớp TỪNG ca, in ca lệch nếu có"
    paths: [lib/gap-probe.js, scripts/gate-card.js, scripts/pre-merge-check.sh, tests/scripts/**]
  - id: E9
    criterion: AC-9
    executor: judgment
    question: "Đọc thông điệp VIOLATION và NOTE của luật gap-probe: một người chưa từng đọc kit có biết đang thiếu gì và phải làm gì tiếp không?"
    # Sinh bằng: chạy 4 fixture GP1/GP2/GP7/GP8 rồi gom stdout — KHÔNG chép tay.
    # E12 kiểm sự đầy đủ TRƯỚC khi judge chấm.
    inputs: [evidence/premerge-messages.txt]
