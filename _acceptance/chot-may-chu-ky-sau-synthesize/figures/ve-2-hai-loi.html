<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vế 2 — hai lối</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · chot-may-chu-ky-sau-synthesize</p>
    <h1>Vế 2 — phê răng bên đọc hay để hạt giống</h1>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .tx { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 400; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #636b80; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #636b80; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .ea { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #ba4513; }
          .no { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; }
          .num { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- Gốc → nhánh PHÊ -->
      <path d="M340 80 H268 Q260 80 260 88 V172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gốc → nhánh KHÔNG PHÊ (khuyến nghị) -->
      <path d="M660 80 H732 Q740 80 740 88 V172" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels -->
      <rect x="284" y="56" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="300" y="68" class="no" text-anchor="middle" letter-spacing="0.12em">PHÊ</text>
      <rect x="664" y="56" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="698" y="68" class="no" text-anchor="middle" letter-spacing="0.12em" style="fill:#ba4513">KHÔNG PHÊ</text>

      <!-- ===== Gốc: quyết định ===== -->
      <polygon points="500,32 660,80 500,128 340,80" fill="#f5f5f5"/>
      <polygon points="500,32 660,80 500,128 340,80" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="80" class="nm" text-anchor="middle">Vế 2 — răng bên đọc (CỘNG)</text>
      <text x="500" y="98" class="mo" text-anchor="middle">phê đích danh · ADR 0018</text>

      <!-- ===== Nhánh PHÊ ===== -->
      <rect x="40" y="176" width="440" height="392" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="440" height="392" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="200" class="ey">NHÁNH PHÊ</text>
      <text x="64" y="224" class="nm">Thêm AC · nâng T3 · duyệt lại</text>
      <line x1="64" y1="240" x2="456" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="64" y="264" class="no">1</text>
      <text x="88" y="264" class="nm">Thêm AC răng bên đọc</text>
      <text x="88" y="280" class="sb">một luật đọc mới — CỘNG, owner phê đích danh</text>
      <line x1="64" y1="296" x2="456" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="64" y="316" class="no">2</text>
      <text x="88" y="316" class="nm">Vòng nâng T2 → T3</text>
      <text x="88" y="332" class="mo">chạm lib/evidence-core.cjs + scripts/recheck-evidence.cjs</text>
      <line x1="64" y1="348" x2="456" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="64" y="368" class="no">3</text>
      <text x="88" y="368" class="nm">Đỏ ngay trên hồ sơ đã có</text>
      <text x="88" y="392" class="ey">LUẬT ĐỌC · SỐ HỒ SƠ ĐỎ</text>
      <text x="392" y="392" class="ey" text-anchor="end">KIT</text>
      <text x="456" y="392" class="ey" text-anchor="end">CRM</text>
      <line x1="88" y1="400" x2="456" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="88" y="420" class="tx">verified_at sớm hơn ts run-log</text>
      <text x="392" y="420" class="num" text-anchor="end">13</text>
      <text x="456" y="420" class="num" text-anchor="end">12</text>
      <text x="88" y="444" class="tx">verified_at muộn hơn giờ commit</text>
      <text x="392" y="444" class="num" text-anchor="end">0</text>
      <text x="456" y="444" class="num" text-anchor="end">6</text>
      <text x="88" y="468" class="tx">chữ ký không có commit ký</text>
      <text x="392" y="468" class="num" text-anchor="end">37/81</text>
      <text x="456" y="468" class="num" text-anchor="end">6/51</text>
      <text x="88" y="500" class="tx" style="fill:#4f5d75">→ cần nợ có tên hoặc luật hẹp hơn</text>
      <line x1="64" y1="520" x2="456" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="64" y="544" class="no">4</text>
      <text x="88" y="544" class="nm">Thêm Gate 1.5 — duyệt lại</text>

      <!-- ===== Nhánh KHÔNG PHÊ (khuyến nghị, focal) ===== -->
      <rect x="520" y="176" width="440" height="392" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="176" width="440" height="392" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="544" y="200" class="ea">NHÁNH KHÔNG PHÊ · KHUYẾN NGHỊ</text>
      <text x="544" y="224" class="nm">Giữ T2 · số đo vào hạt giống</text>
      <line x1="544" y1="240" x2="936" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="544" y="264" class="no">1</text>
      <text x="568" y="264" class="nm">Vòng giữ T2</text>
      <text x="568" y="280" class="mo">acceptance-verify.js + tests/workflows — ngoài t3_paths</text>
      <line x1="544" y1="296" x2="936" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="544" y="316" class="no">2</text>
      <text x="568" y="316" class="nm">Số đo ghi vào hạt giống</text>
      <text x="568" y="332" class="sb">ba luật, kit + crm: 13+12 · 0+6 · 37+6</text>
      <line x1="544" y1="348" x2="936" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="544" y="368" class="no">3</text>
      <text x="568" y="368" class="nm">Lỗ còn lại — giới hạn đã khai</text>
      <text x="568" y="384" class="sb">mỗi lỗ kèm một ngưỡng mở lại</text>

      <text x="568" y="416" class="tx">· Chữ ký do phiên tự viết ngoài /signoff</text>
      <text x="580" y="432" class="sb">mở lại: ≥ 1 hồ sơ có chữ ký không đi qua commit</text>
      <text x="580" y="446" class="mo">Gate 2 signoff:</text>

      <text x="568" y="476" class="tx">· human_override trong khối vô hướng</text>
      <text x="580" y="492" class="sb">mở lại: ≥ 1 báo cáo có human_override có giá trị</text>
      <text x="580" y="506" class="sb">trong khối vô hướng mà không phải output của một test</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="592" x2="960" y2="592" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="612" class="ey">CHÚ GIẢI</text>

      <polygon points="40,636 52,630 64,636 52,642" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="640" class="lg">Quyết định ở Cổng Phạm vi</text>

      <rect x="232" y="630" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="264" y="640" class="lg">Nhánh khuyến nghị</text>

      <rect x="392" y="630" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="424" y="640" class="lg">Nhánh còn lại</text>

      <text x="960" y="640" class="mo" text-anchor="end">căn cứ: hợp đồng — Out of scope (số đo) · Notes (giới hạn đã khai)</text>
    </svg>
  </div>
</body>
</html>
