<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng chốt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · chot-may-chu-ky-sau-synthesize</p>
    <h1>Luồng chốt sau synthesize</h1>

    <svg viewBox="0 0 1000 844" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .tx { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 400; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #636b80; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #636b80; }
          .mi { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500; fill: #2d3142; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .ea { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #ba4513; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .ac { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- 1 → 2 -->
      <line x1="500" y1="96" x2="500" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2 → quyết định -->
      <line x1="500" y1="352" x2="500" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- quyết định → BLOCKED -->
      <path d="M340 440 H208 Q200 440 200 448 V524" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- quyết định → report -->
      <path d="M660 440 H792 Q800 440 800 448 V524" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- report → run-log (chỉ khi đổi) -->
      <line x1="800" y1="600" x2="800" y2="652" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Connector labels -->
      <rect x="256" y="416" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="270" y="428" class="al" text-anchor="middle">CÓ</text>
      <rect x="692" y="416" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="728" y="428" class="al" text-anchor="middle">NGƯỢC LẠI</text>
      <rect x="808" y="616" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="812" y="628" class="al">NẾU ĐỔI</text>

      <!-- ===== Bước 1: tác tử tổng hợp ===== -->
      <rect x="360" y="32" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="32" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="60" class="nm" text-anchor="middle">Tác tử tổng hợp trả chuỗi báo cáo</text>
      <text x="500" y="80" class="mo" text-anchor="middle">synthesize:report → report (chuỗi)</text>

      <!-- ===== Bước 2: chốt máy (focal) ===== -->
      <rect x="240" y="136" width="520" height="216" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="136" width="520" height="216" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="264" y="160" class="ea">CHỐT MÁY · TRƯỚC KHI TRẢ REPORT</text>
      <text x="264" y="180" class="mi">chotTruongNguoi(report, { invokedAt, gioTheoRunId })</text>
      <line x1="264" y1="192" x2="736" y2="192" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="264" y="216" class="nm">Ba khoá người → rỗng</text>
      <text x="264" y="232" class="mo">human_signoff · human_override · bypass_ack</text>
      <rect x="692" y="204" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="714" y="216" class="ac" text-anchor="middle">AC-1</text>
      <line x1="264" y1="248" x2="736" y2="248" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="264" y="268" class="nm">verified_at → giờ engine</text>
      <text x="264" y="284" class="sb">khối tươi · suite · frontmatter: invokedAt — khối carry: verifiedAt gốc</text>
      <rect x="692" y="256" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="714" y="268" class="ac" text-anchor="middle">AC-2</text>
      <line x1="264" y1="300" x2="736" y2="300" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="264" y="320" class="nm">Chỉ ở vị trí trường</text>
      <text x="264" y="336" class="sb">frontmatter cấp 0 · dòng trường khối; khối vô hướng + văn xuôi giữ byte</text>
      <rect x="692" y="308" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="714" y="320" class="ac" text-anchor="middle">AC-3</text>

      <!-- ===== Bước 3: rẽ nhánh ===== -->
      <polygon points="500,392 660,440 500,488 340,440" fill="#f5f5f5"/>
      <polygon points="500,392 660,440 500,488 340,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="436" class="nm" text-anchor="middle">Có verified_at mà</text>
      <text x="500" y="452" class="nm" text-anchor="middle">thiếu invokedAt?</text>

      <!-- BLOCKED -->
      <rect x="60" y="528" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="528" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="552" class="nm">BLOCKED — lý do gọi tên</text>
      <rect x="280" y="540" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="302" y="552" class="ac" text-anchor="middle">AC-4</text>
      <text x="76" y="572" class="mo">chot-truong-nguoi: khong co gio engine</text>
      <text x="76" y="588" class="mo">(invokedAt vang) — khong ep duoc verified_at</text>
      <text x="76" y="608" class="sb">report rỗng</text>

      <!-- Report trả vòng chính -->
      <rect x="660" y="528" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="528" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="676" y="556" class="nm">Report trả vòng chính</text>
      <text x="676" y="576" class="sb">vòng chính ghi thành evidence-report.md</text>

      <!-- Dòng run-log (chỉ khi đổi) -->
      <rect x="660" y="656" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="656" width="280" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="676" y="680" class="nm">+ một dòng run-log</text>
      <rect x="880" y="668" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="902" y="680" class="ac" text-anchor="middle">AC-5</text>
      <text x="676" y="700" class="mo">kind: chot-truong-nguoi</text>
      <text x="676" y="716" class="sb">bốn số đổi theo khoá · ts = invokedAt</text>
      <text x="676" y="736" class="sb">không đổi → không dòng nào</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="780" x2="960" y2="780" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="800" class="ey">CHÚ GIẢI</text>

      <rect x="40" y="812" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="822" class="lg">Bước</text>

      <rect x="136" y="812" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="168" y="822" class="lg">Chốt máy (vế 1)</text>

      <polygon points="336,818 348,812 360,818 348,824" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="822" class="lg">Rẽ nhánh</text>

      <line x1="448" y1="818" x2="476" y2="818" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="484" y="822" class="lg">Chỉ khi chốt đã đổi ≥ 1 dòng</text>

      <rect x="640" y="812" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="684" y="822" class="lg">AC trong hợp đồng</text>
    </svg>
  </div>
</body>
</html>
