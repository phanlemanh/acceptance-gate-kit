<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư mục rỗng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · tep-sinh-khong-chan-gop · Hỏi-1</p>
    <h1>Thư mục rỗng làm bản vẽ lệch bản clone sạch</h1>

    <svg viewBox="0 0 1000 592" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #636b80; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #4f5d75; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .eh { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.18em; fill: #2d3142; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .ac { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Section: HÔM NAY ===== -->
      <text x="40" y="28" class="eh">HÔM NAY</text>
      <line x1="120" y1="24" x2="960" y2="24" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="60" y="56" class="ey">MÁY CÓ THƯ MỤC SÓT</text>
      <text x="560" y="56" class="ey">BẢN CLONE SẠCH · CI</text>
      <line x1="500" y1="44" x2="500" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- ===== Connectors (drawn before boxes) ===== -->
      <line x1="250" y1="140" x2="250" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="750" y1="140" x2="750" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="228" x2="556" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="456" y="204" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="216" class="al" text-anchor="middle">ĐẨY LÊN CI</text>

      <!-- Left · row 1 -->
      <rect x="60" y="72" width="380" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="72" width="380" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="96" class="nm">Thư mục rỗng còn sót</text>
      <text x="76" y="114" class="mo">_acceptance/rong/</text>
      <text x="76" y="130" class="sb">vết của lệnh bị ngắt, worktree dọn dở</text>

      <!-- Right · row 1 -->
      <rect x="560" y="72" width="380" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="72" width="380" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="576" y="96" class="nm">Không có thư mục ấy</text>
      <text x="576" y="116" class="sb">git không giữ thư mục rỗng</text>

      <!-- Left · row 2 -->
      <rect x="60" y="172" width="380" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="172" width="380" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="196" class="nm">Bản đồ thêm dòng «Hồ sơ hỏng: rong»</text>
      <text x="76" y="216" class="sb">trang lộ trình đếm nó vào «ngoài lộ trình»</text>
      <text x="76" y="240" class="sb">bản vẽ ấy được commit</text>

      <!-- Right · row 2 (focal) -->
      <rect x="560" y="172" width="380" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="172" width="380" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="576" y="196" class="nm">Vẽ lại không có dòng ấy → kiểm bản vẽ đỏ</text>
      <text x="576" y="216" class="mo">product-map.mjs --check</text>
      <text x="576" y="240" class="sb">dù không ai sửa nguồn nào</text>

      <!-- ===== Section: SAU VÒNG ===== -->
      <text x="40" y="292" class="eh">SAU VÒNG</text>
      <line x1="124" y1="288" x2="960" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <rect x="60" y="308" width="880" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="308" width="880" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="76" y="336" class="nm">Hai cột vẽ giống từng byte → kiểm bản vẽ xanh</text>
      <rect x="880" y="324" width="44" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="902" y="336" class="ac" text-anchor="middle">AC-6</text>
      <text x="76" y="360" class="sb">thư mục không có tệp nào — kể cả chỉ chứa thư mục con rỗng — bị bỏ qua ở cả bản đồ lẫn trang lộ trình</text>

      <text x="60" y="420" class="ey">VẪN «HỒ SƠ HỎNG» NHƯ CŨ</text>

      <!-- Edge · có tệp lạ -->
      <rect x="60" y="432" width="380" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="432" width="380" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="456" class="nm">Thư mục có tệp lạ</text>
      <text x="76" y="476" class="mo">_acceptance/la/ghi-chu.txt</text>
      <text x="76" y="492" class="sb">tệp chưa theo dõi là việc dở thật — giữ lối cũ</text>

      <!-- Edge · chỉ có tệp bị bỏ qua (giới hạn khai) -->
      <rect x="560" y="432" width="380" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="432" width="380" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="576" y="456" class="nm">Thư mục chỉ có tệp kho bỏ qua</text>
      <text x="576" y="476" class="mo">.DS_Store</text>
      <text x="576" y="492" class="sb">giới hạn khai · mở lại khi CI đỏ vì nó một lần</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="536" x2="960" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="560" class="ey">CHÚ GIẢI</text>

      <rect x="120" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="562" class="lg">Trạng thái</text>

      <rect x="232" y="552" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="264" y="562" class="lg">Chỗ đỏ hôm nay</text>

      <rect x="380" y="552" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="412" y="562" class="lg">Giới hạn khai</text>

      <rect x="508" y="550" width="36" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="552" y="562" class="lg">Tiêu chí trong hợp đồng</text>
    </svg>
  </div>
</body>
</html>
