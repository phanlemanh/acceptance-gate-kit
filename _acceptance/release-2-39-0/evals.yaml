      (bỏ hồ sơ mốc `release-*`), BẰNG sáu hồ sơ kể trong Context. Chiều đỏ trong chính lệnh, đo trước khi viết hợp đồng:
      cùng lệnh chỉ kể `luot-kiem-nhe` thoát 1 «ĐỎ: hồ sơ ĐƯỢC KÝ trong cửa sổ mà mốc KHÔNG kể: do-tuong-phan-lab-oklab
