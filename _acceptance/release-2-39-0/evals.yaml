      HEAD bằng đúng hai manifest, và mọi dòng đổi trong đó là dòng "version". Chiều đỏ: cùng lệnh với mốc `c8fa5a65`
      (v2.38.0) — tập tệp vẫn là hai manifest nhưng lệnh đo mọi dòng đổi, nên một dòng mô tả đổi thì in «ĐỎ: dòng đổi
      ngoài "version"» và thoát 1; trước commit nâng số, tập tệp rỗng thì in «ĐỎ: tập tệp đổi khác hai tệp khai», thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
