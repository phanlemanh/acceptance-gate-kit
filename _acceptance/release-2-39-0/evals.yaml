      rút danh sách mong đợi từ gạch «- **Lớp chép CI:…» của mục «## 2.39.0» trong CHANGELOG.md, và tập tệp đổi byte từ
      `88d31b63` tới HEAD là đúng `scripts/pre-merge-check.sh` (bản vá của t3-arm-chu-ky-khong-im). Chiều đỏ trên cùng tệp
      lệnh: mốc `c8fa5a65` (v2.38.0) với mục 2.39.0 vẫn kể đúng một tệp, nên dùng mục 2.38.0 — thoát 1 «ĐỎ: tệp đổi mà ghi
      chú KHÔNG kể: scripts/pre-merge-check.sh» (đo ở release-2-38-1).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-39-0/contract.md, _acceptance/do-tuong-phan-lab-oklab/contract.md, _acceptance/do-tuong-phan-lab-oklab/design.md, _acceptance/doc-jsx-va-ban-do-hong/contract.md, _acceptance/doc-jsx-va-ban-do-hong/design.md, _acceptance/lenh-cho-khoa-nhay-duong-dan/contract.md, docs/superpowers/specs/2026-11-10-lenh-cho-khoa-nhay-duong-dan-design.md, _acceptance/t3-arm-chu-ky-khong-im/contract.md, _acceptance/t3-arm-chu-ky-khong-im/design.md, _acceptance/tier-b-doc-khong-do-duoc/contract.md, docs/superpowers/specs/2026-11-10-tier-b-doc-khong-do-duoc-design.md, _acceptance/luot-kiem-nhe/contract.md, _acceptance/luot-kiem-nhe/opportunity.md, docs/superpowers/specs/2026-11-11-luot-kiem-nhe-design.md, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-39-0 và mục «## 2.39.0» của CHANGELOG.md (chỉ mục đó; không đọc tệp sử mô tả plugin
      dưới docs/), cạnh đúng nguồn nó chép. (0) Ở sáu mục con của sáu hồ sơ: mỗi câu mô tả vòng (dòng «Gốc:» đọc
      ở opportunity.md nếu có, không thì Context của hợp đồng hay design doc; gạch «Vật:» chép dòng feature của hợp đồng;
      giới hạn trích trong ngoặc «») có phải chữ của hồ sơ ấy — không tóm tắt sáng tạo, không nói rộng hơn — và số giới
      hạn đã khai có khớp Notes của hợp đồng không? (1) Lời về ba việc chỉ-bớt (mô tả plugin rút, sử chép nguyên văn vào
      docs/reference/su-mo-ta-plugin-toi-2-38-1.md, gỡ lib/eval-yaml.js, dời scripts/rel-cua-so.sh vào hồ sơ mốc, .env vào .gitignore, ba ca kiểm gỡ) có
      khớp Context của hợp đồng release-2-39-0 không? (2) Lời về lớp chép CI có đúng với khối INIT-CI-COPY-LIST của
      commands/acceptance-init.md không — tệp kể có thuộc khối và tổng 36 đúng? (3) Đoạn «Vì sao 2.39.0» và «Ai bị ảnh
      hưởng» có nói thẳng các đổi hành vi chạm kho đang dùng mà sáu mục con kể, cùng việc gỡ hai tệp và mô tả plugin thôi
      mang sử, và căn cứ chọn số có đúng với Context của hợp đồng release-2-39-0 không? Trả PASS khi cả bốn vế đúng; FAIL
      nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
