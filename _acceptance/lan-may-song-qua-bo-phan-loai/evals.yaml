schema_version: 1
feature_slug: lan-may-song-qua-bo-phan-loai
# Ô này giao LỜI KHAI trên bốn vật (luật cho-phép · khuôn khởi tạo · nghi thức ·
# tài liệu). Rủi ro lớn nhất KHÔNG phải lời khai sai, mà là THƯỚC đo lời khai bị
# viết vừa khít mutant của chính nó — lớp lỗi hồ sơ design-pass-nac trả giá bốn
# vòng cho. Nên mọi phép đo ở đây phải là QUAN HỆ ĐẾM ĐƯỢC giữa hai vật, hoặc
# mệnh đề ĐÓNG trên tập hữu hạn; cấm phủ định phổ quát trên không gian mở.
#
# <<<MUTANT-MATRIX
#   E1=4 · E2=3 · E3=5 · E4=5 · E5=7 · E6=4 · E8=3   (tổng 31; E3 là răng hồ sơ,
#   5 mutant chia ba chân — đơn vị vẫn là MUTANT như mọi ô khác)
# MUTANT-MATRIX>>>
#
# ĐỔI KHUÔN (vòng 2, sau khi luật dừng-vá bật): bảng trên là chỗ DUY NHẤT khai ma
# trận, VÀ là chỗ duy nhất được LIỆT KÊ mutant. Văn `expected` của mỗi eval chỉ mô tả
# PHÉP ĐO — không con số, không «m1..m3», không «BA vế». Vòng 1 tôi bỏ số khỏi bốn
# eval rồi tuyên đóng cả lớp, để nguyên phần kể lể ở ba eval còn lại và lớp tái phát
# ngay vòng sau. Vá từng chỗ không đóng được lớp này; bỏ HẲN bản chép thứ hai mới
# đóng — không có gì để lệch thì không lệch được.
#
# GIỚI HẠN ĐÃ KHAI: không eval nào đo HIỆU LỰC LÚC CHẠY của luật cho-phép —
# settings đọc lúc khởi động phiên, phá thử ở S1 xác nhận sửa giữa phiên không có
# hiệu lực. Hiệu lực đo ở ngưỡng Cổng Đáng (5 vòng S4 kế). Đây là lỗ ĐÃ KHAI, không
# phải lời tuyên độ phủ sai.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [.claude/settings.json, _acceptance/config.yaml, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM1]". Đo QUAN HỆ SONG ÁNH giữa HAI vật, không đọc
      một danh sách gõ tay: rút tập lệnh từ `permissions.allow` của
      `.claude/settings.json`, rút tập lệnh nguồn bằng cách giải từng dotted key
      trong `feature_loop.suite_keys` của `_acceptance/config.yaml`, rồi khẳng định
      hai tập BẰNG NHAU. Thông điệp đỏ NÊU ĐÍCH DANH lệnh thừa / lệnh thiếu.
      Đối chứng dương: cây nguyên vẹn XANH, chạy TRƯỚC mọi mutant.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [.claude/settings.json, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM2]". Mệnh đề ĐÓNG: KHÔNG entry nào trong
      `permissions.allow` chứa ký tự `*`. Cố ý KHÔNG viết dưới dạng «cấm các glob
      rộng sau đây» — danh sách cấm trên không gian mở là lớp lỗi đã trả giá; đếm
      ký tự trên tập hữu hạn entry thì đóng và đếm được.
      Đối chứng dương: cây nguyên vẹn XANH.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.lm_khong_nuot
    paths: [.claude/settings.json, _acceptance/lan-may-song-qua-bo-phan-loai/contract.md, _acceptance/lan-may-song-qua-bo-phan-loai/rang-khong-nuot.mjs, _acceptance/lan-may-song-qua-bo-phan-loai/rang-khong-nuot.sh]
    expected: >
      exit 0; stdout có "khong-nuot OK". RĂNG HỒ SƠ, CỐ Ý không vào suite vĩnh viễn — nằm trong bộ kiểm thường trực thì mọi sửa hợp lệ về sau của `enabledPlugins`/`extraKnownMarketplaces` (do hồ sơ KHÁC làm) sẽ làm suite đỏ oan, đúng lớp «thước ghim vào thứ SẼ ĐỔI»; răng chết theo hồ sơ khi gộp. Đo trên VẬT THẬT, KHÔNG đo một hàm trộn dựng
      riêng cho test — ô này không giao đường trộn nào. Đọc mốc `BASE-LMSQBPL` TỪ
      contract.md (không hardcode sha trong ca), lấy bản settings ở mốc bằng
      `git show <sha>:.claude/settings.json`, so với bản trong cây. HAI CHÂN RỜI,
      mỗi chân một thông điệp: (a) mọi khoá cấp cao NGOÀI `permissions` bằng nhau
      từng ký tự; (b) BÊN TRONG `permissions`, mọi khoá ngoài `allow` bằng nhau, và
      `allow` chỉ được THÊM — phần tử có ở mốc phải còn trong cây.
      Danh sách khoá phải-giữ RÚT TỪ chính bản ở mốc (duyệt khoá của nó), KHÔNG liệt
      tay trong ca — liệt tay là một allowlist mới.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: [commands/acceptance-init.md, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM4]". Khối giữa mốc neo CONSUMER-ALLOW-ADVICE trong
      khuôn khởi tạo phải nêu: dạng khai KHỚP CHÍNH XÁC · cấm dùng `*` · lý do (bộ
      phân loại là nút cổ chai của làn máy) · kit KHÔNG tự ghi luật vào kho họ · cấp
      quyền là quyết định an ninh của đội.
      MỖI VẾ LÀ MỘT ĐIỀU KIỆN, khai dạng BẢNG trong bộ ca (id · thông điệp · bait);
      runner tự duyệt bảng nên số mutant LUÔN bằng số vế và không thể quên vế nào.
      CẤM gộp hai điều kiện vào một vế bằng phép VÀ/HOẶC — nhánh không có mutant
      riêng là vế chết. Phép đo trên văn xuôi đi qua hàm gộp khoảng trắng (ngắt dòng
      là chuyện trình bày, không phải nghĩa). Bộ kiểm phân biệt mốc neo TRÙNG với mốc
      neo THIẾU, không gộp hai chuyện vào một thông điệp.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.plugins
    paths: [feature-loop/skills/feature-loop/SKILL.md, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM5]". Khối giữa mốc neo `CLASSIFIER-FALLBACK` trong
      nghi thức phải nêu: dấu hiệu kích hoạt «bộ phân loại» · phân biệt với BLOCKED
      nguyên nhân KHÁC · hành động bắt buộc, ghim vào CÂU MỆNH LỆNH «lệnh chạy TUẦN
      TỰ» chứ không vào từ đơn lẻ (khối còn có câu tiền lệ nhắc tuần tự — đo từ đơn
      lẻ là để câu tiền lệ đỡ hộ mệnh lệnh) · cấm dispatch lại fan-out · con trỏ
      Phase 3 · tên skill acceptance. Các vế khai dạng BẢNG như E4.
      Cộng MỘT vế là QUAN HỆ ĐẾM ĐƯỢC: đếm số KHỐI mang mốc neo trên trọn hai thư
      mục `skills/` và `feature-loop/`, phải đúng 1 — ĐẾM KHỐI chứ không đếm FILE:
      đếm file thì hai khối trong CÙNG một file vẫn ra 1 và bản sao thứ hai mang luật
      ngược lại lọt xanh, còn nội dung của nó thì không bộ kiểm nào đọc tới.
      PHẠM VI THẬT: các vế văn xuôi là phép đo CÓ-MẶT trên từ vựng ĐÓNG — canh điều
      khoản khỏi bị xoá hay rút ruột, KHÔNG chứng minh câu chữ nói đúng ý.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    paths: [GUIDE.md, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM6]". GUIDE nêu CẢ HAI nửa, đo TRONG KHỐI giữa mốc
      neo GUIDE-CLASSIFIER-LANE — KHÔNG grep trọn tài liệu: GUIDE đã có sẵn cụm «tuần
      tự» ở hai chỗ khác không liên quan, nên grep cả file làm vế «lượt kế đi TUẦN
      TỰ» thành assertion CHẾT. Các vế khai dạng BẢNG như E4: có `permissions.allow` ·
      nói rõ dành cho LỆNH KIỂM cố định · trỏ mốc neo CLASSIFIER-FALLBACK · nói lượt
      kế đi TUẦN TỰ. Mục phải nằm TRONG thân tài liệu và có tên trong Mục lục —
      người vận hành tra mục lục là đúng người AC-6 nhắm.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.plugins
    paths: [.claude/settings.json, tests/plugins/lan-may-classifier.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LM8]". Mỗi entry trong `permissions.allow` khớp ĐÚNG
      khuôn luật quyền của khung cấu hình harness — dạng `Bash(<lệnh>)`. Khuôn là MỘT
      hằng đặt giữa cặp mốc neo `PERM-RULE-GRAMMAR` trong chính bộ ca, kèm chú thích
      trỏ nguồn (khoá `permissions` của khung cấu hình, đọc nguyên văn ở S1); cấm bên
      viết và bên đọc mỗi bên tự chế khuôn riêng.
      Ca cũng khẳng định các entry nằm dưới `permissions.allow`, KHÔNG dưới `ask` hay
      `deny`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: judgment
    question: >
      Đọc bộ ca `tests/plugins/lan-may-classifier.test.mjs`. Đối chiếu với BẢNG MA
      TRẬN MUTANT khai giữa cặp mốc neo `MUTANT-MATRIX` ở đầu evals.yaml của hồ sơ
      — đọc TỪ đó; câu hỏi này cố ý KHÔNG chép lại số.
      Số mutant thực thi có ĐỦ như đã khai không, hay có ca tuyên N vế mà chỉ chạy
      một mutant? Với MỖI mutant: nó đi qua CHÍNH hàm/bộ kiểm mà chiều xanh dùng
      (cùng bộ đọc, khác input), hay là một phép so riêng dựng cho mutant? Fixture
      có do CODE SINH trong chính lượt chạy hay viết tay đúng khuôn bên đọc? Thông
      điệp đỏ có GHIM tên lệnh/entry/vế/khoá cụ thể, hay có chỗ nào kết luận CHỈ từ
      mã thoát (assertion âm-tính-một-mình) hoặc CHỈ từ «chuỗi vắng» mà không kiểm
      bản sao có chạy nổi không?
      E1 có đọc CẢ HAI đầu (settings và config) hay chỉ đọc một đầu rồi so với hằng
      gõ tay trong test? E5 có chân đếm mốc neo trên TRỌN glob thư mục kèm mutant
      tiêm khối thứ hai vào file KHÁC không? E3 có rút danh sách khoá phải-giữ TỪ
      chính bản trước, hay liệt tay?
      Và câu hỏi TRỌNG TÂM: có thước nào được viết vừa khít mutant của chính nó
      không — tức chiều đỏ chỉ chứng minh nó bắt được thứ chính nó viết ra, còn một
      vi phạm THẬT diễn đạt cách khác thì lọt?
      LƯU Ý: hồ sơ khai tường minh MỘT giới hạn — không eval nào đo hiệu lực lúc
      chạy của luật cho-phép (settings đọc lúc khởi động phiên). Giới hạn ĐÃ KHAI
      không tính là vi phạm; vi phạm là khi bộ ca TUYÊN một độ phủ mà nó không giao.
      TRƯỚC KHI KẾT LUẬN: in lại con số đọc được từ marker `MUTANT-MATRIX` cho TỪNG
      ca, cạnh số mutant bạn ĐẾM ĐƯỢC trong file test — hai cột, để người đọc tự đối
      chiếu. Không in được bảng thì nói thẳng là không đọc được, ĐỪNG suy từ chính
      file test rồi tuyên «khớp» (bộ ca tự làm chứng cho chính nó).
      Nêu đích danh ca vi phạm; không có thì nói rõ đã soi hết bao nhiêu ca và bao
      nhiêu mutant.
    inputs: [../../tests/plugins/lan-may-classifier.test.mjs, evals.yaml, rang-khong-nuot.mjs]
    expected: >
      Hội đồng xác nhận số mutant khớp bảng ma trận, mỗi mutant bẻ đúng MỘT vế và đi
      qua cùng bộ kiểm của chiều xanh, fixture code-sinh, thông điệp ghim, E1 đọc
      cả hai đầu, E5 có chân đếm trọn glob kèm mutant file-thứ-hai. Ca nào chỉ có
      chiều âm, mutant đi qua bộ kiểm khác chiều xanh, số mutant ít hơn số vế đã
      khẳng định, hoặc thước viết vừa khít mutant của chính nó — là FAIL.
    evidence_required: [run_id, verifier, verified_at, output]
