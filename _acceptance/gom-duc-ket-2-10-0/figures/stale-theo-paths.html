<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K4 — stale theo paths</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 62ch;
      line-height: 1.5;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · K4 · AC-6</p>
    <h1>Luật stale theo <span style="font-family:var(--font-mono); font-size:0.85em;">paths:</span></h1>
    <p class="sub">Hồ sơ hoá cũ khi nào sau <span style="font-family:var(--font-mono);">verified_commit</span> — chỉ khi mọi eval máy/ui khai đủ paths mới xét khớp ∪paths; thiếu paths hoặc thiếu node/lib rơi về luật cũ (chặt hơn, không fail-open).</p>

    <svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <!-- Start -> Diamond1 -->
      <line x1="500" y1="88" x2="500" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond1 CÓ -> Bỏ qua -->
      <line x1="600" y1="240" x2="720" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond1 KHÔNG -> Diamond2 -->
      <line x1="500" y1="288" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond2 KHÔNG -> Luật cũ -->
      <line x1="600" y1="376" x2="720" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond2 CÓ -> Diamond3 -->
      <line x1="500" y1="424" x2="500" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond3 CÓ -> STALE (accent, headline outcome) -->
      <line x1="600" y1="512" x2="720" y2="512" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Diamond3 KHÔNG -> Không stale -->
      <line x1="500" y1="560" x2="500" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (masked, 6-10px gap above line) ===== -->
      <rect x="642" y="218" width="30" height="16" rx="2" fill="#f5f5f5"/>
      <text x="657" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CÓ</text>

      <rect x="480" y="294" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="638" y="354" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="658" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="480" y="430" width="30" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CÓ</text>

      <rect x="642" y="490" width="30" height="16" rx="2" fill="#f5f5f5"/>
      <text x="657" y="502" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CÓ</text>

      <rect x="480" y="566" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="578" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <!-- ===== Nodes ===== -->
      <!-- Start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File đổi sau</text>
      <text x="500" y="74" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verified_commit</text>

      <!-- Diamond 1 -->
      <polygon points="500,192 600,240 500,288 400,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="234" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trong _acceptance/</text>
      <text x="500" y="248" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hoặc t1?</text>

      <!-- Bỏ qua -->
      <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ qua</text>

      <!-- Diamond 2 -->
      <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="362" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ đủ paths ở</text>
      <text x="500" y="376" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MỌI eval máy/ui?</text>
      <text x="500" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(node+lib có?)</text>

      <!-- Luật cũ -->
      <rect x="720" y="352" width="220" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="830" y="372" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Luật cũ: mọi file</text>
      <text x="830" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">còn lại = stale</text>

      <!-- Diamond 3 -->
      <polygon points="500,464 600,512 500,560 400,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="508" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File khớp</text>
      <text x="500" y="522" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">∪paths?</text>

      <!-- STALE (coral focal) -->
      <rect x="720" y="484" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="800" y="518" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">STALE</text>

      <!-- Không stale -->
      <rect x="420" y="600" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không stale</text>

      <!-- Legend -->
      <line x1="40" y1="700" x2="960" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="716" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="732" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="742" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc (oval)</text>

      <polygon points="292,738 304,732 316,738 304,744" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="742" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Quyết định (diamond)</text>

      <rect x="524" y="732" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="556" y="742" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kết quả nổi bật (STALE)</text>
    </svg>
  </div>
</body>
</html>
