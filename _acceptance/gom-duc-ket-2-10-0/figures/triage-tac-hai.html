<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K7 — triage theo tác hại</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
      line-height: 1.5;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · K7 · AC-9</p>
    <h1>Triage theo tác hại</h1>
    <p class="sub">Máy tính phạm vi (<span style="font-family:var(--font-mono);">inPaths</span>), agent chỉ phán tác hại — không tự suy AC gần giống. Thẻ Cổng 2 xếp mục <span style="font-family:var(--font-mono);">behavior</span> trước <span style="font-family:var(--font-mono);">measure</span>, vắng <span style="font-family:var(--font-mono);">harm</span> xếp cuối.</p>

    <svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <!-- Start -> Rect(inPaths) -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rect(inPaths) -> Rect(harm) -->
      <line x1="500" y1="176" x2="500" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rect(harm) -> Diamond -->
      <line x1="500" y1="272" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond CÓ -> Rect(nâng inContract) — accent, headline rule -->
      <line x1="600" y1="376" x2="720" y2="376" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Rect(nâng inContract) -> Oval(Vào vòng VÁ) — accent -->
      <line x1="840" y1="404" x2="840" y2="444" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Diamond KHÔNG -> Diamond2 (AC đích danh) -->
      <line x1="500" y1="424" x2="500" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond2 CÓ -> Vá (luật cũ) -->
      <line x1="600" y1="560" x2="720" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond2 KHÔNG -> Ngoài hợp đồng -->
      <line x1="500" y1="608" x2="500" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="628" y="354" width="30" height="16" rx="2" fill="#f5f5f5"/>
      <text x="643" y="366" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CÓ</text>

      <rect x="480" y="452" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="642" y="538" width="30" height="16" rx="2" fill="#f5f5f5"/>
      <text x="657" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CÓ</text>

      <rect x="480" y="588" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <!-- ===== Nodes ===== -->
      <!-- Start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finding thật</text>

      <!-- Rect: máy tính inPaths -->
      <rect x="380" y="120" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy tính inPaths</text>
      <text x="500" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">file ∈ ∪paths của evals?</text>

      <!-- Rect: agent phán harm -->
      <rect x="380" y="216" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent phán harm</text>
      <text x="500" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">behavior | measure</text>

      <!-- Diamond: harm=behavior ∧ inPaths? -->
      <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="368" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">harm=behavior</text>
      <text x="500" y="382" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">∧ inPaths?</text>

      <!-- Rect: máy nâng inContract -->
      <rect x="720" y="348" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="840" y="370" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy nâng inContract=true</text>
      <text x="840" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">acRef = criterion khớp</text>

      <!-- Oval: vào vòng VÁ (accent focal) -->
      <rect x="760" y="444" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="840" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vào vòng VÁ</text>

      <!-- Diamond2: AC đích danh? -->
      <polygon points="500,512 600,560 500,608 400,560" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="556" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AC đích</text>
      <text x="500" y="570" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">danh?</text>

      <!-- Oval: Vá (luật cũ) -->
      <rect x="720" y="536" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vá</text>
      <text x="800" y="570" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">luật cũ</text>

      <!-- Oval: Ngoài hợp đồng -->
      <rect x="420" y="648" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="668" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ngoài hợp đồng</text>
      <text x="500" y="682" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">thẻ xếp cuối measure</text>

      <!-- Legend -->
      <line x1="40" y1="740" x2="960" y2="740" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="756" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="772" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="782" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc (oval)</text>

      <rect x="228" y="772" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="782" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước máy/agent (rect)</text>

      <polygon points="452,778 464,772 476,778 464,784" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="782" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Quyết định (diamond)</text>

      <rect x="660" y="772" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="692" y="782" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Luật mới K7 (inContract)</text>
    </svg>
  </div>
</body>
</html>
