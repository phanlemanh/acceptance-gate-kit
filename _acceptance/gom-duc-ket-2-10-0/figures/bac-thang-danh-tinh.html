<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K2 — bậc thang danh tính</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .sub {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
      line-height: 1.5;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · K2 · AC-4</p>
    <h1>Bậc thang danh tính mới</h1>
    <p class="sub">Mọi nấc có tên → GHI THẲNG kèm một dòng «với danh tính … (từ &lt;nguồn&gt;)», người sửa bằng một câu bất kỳ lúc nào sau. Chỉ CẠN mới hỏi — không còn câu CẢNH BÁO approvers.</p>

    <svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <!-- Ladder KHÔNG chain (down the middle) -->
      <line x1="400" y1="192" x2="400" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="360" x2="400" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="528" x2="400" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="696" x2="400" y2="736" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Merge bus (CÓ chain -> trunk -> GHI THẲNG), plain lines no arrowhead, single exit arrow -->
      <line x1="560" y1="128" x2="680" y2="128" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="560" y1="296" x2="680" y2="296" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="560" y1="464" x2="680" y2="464" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="560" y1="632" x2="680" y2="632" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="680" y1="128" x2="680" y2="632" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="680" cy="128" r="4" fill="#2d3142"/>
      <circle cx="680" cy="296" r="4" fill="#2d3142"/>
      <circle cx="680" cy="464" r="4" fill="#2d3142"/>
      <circle cx="680" cy="632" r="4" fill="#2d3142"/>
      <line x1="680" y1="380" x2="760" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="380" y="204" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="400" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="380" y="372" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="400" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="380" y="540" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="400" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="380" y="708" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="400" y="720" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="590" y="112" width="26" height="16" rx="2" fill="#f5f5f5"/>
      <text x="603" y="124" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="590" y="280" width="26" height="16" rx="2" fill="#f5f5f5"/>
      <text x="603" y="292" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="590" y="448" width="26" height="16" rx="2" fill="#f5f5f5"/>
      <text x="603" y="460" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="590" y="616" width="26" height="16" rx="2" fill="#f5f5f5"/>
      <text x="603" y="628" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <!-- ===== Nodes ===== -->
      <!-- Diamond 1: --as -->
      <polygon points="400,64 560,128 400,192 240,128" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="124" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--as có tên?</text>
      <text x="400" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nấc 1</text>

      <!-- Diamond 2: cổng trước cùng hồ sơ -->
      <polygon points="400,232 560,296 400,360 240,296" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="284" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng trước cùng</text>
      <text x="400" y="298" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hồ sơ có tên?</text>
      <text x="400" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">approved_by == git user.name hiện tại</text>

      <!-- Diamond 3: git config user.name -->
      <polygon points="400,400 560,464 400,528 240,464" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="456" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git config</text>
      <text x="400" y="472" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user.name có?</text>

      <!-- Diamond 4: signoff.approvers -->
      <polygon points="400,568 560,632 400,696 240,632" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="624" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">signoff.approvers</text>
      <text x="400" y="640" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đúng một tên?</text>

      <!-- End: CẠN (accent focal — the real human moment) -->
      <rect x="320" y="736" width="160" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="400" y="764" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CẠN</text>
      <text x="400" y="780" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hỏi một câu</text>

      <!-- Merge target: GHI THẲNG -->
      <rect x="740" y="352" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GHI THẲNG</text>
      <text x="860" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+ dòng «với danh tính … (từ &lt;nguồn&gt;)»</text>

      <!-- Legend -->
      <line x1="40" y1="828" x2="960" y2="828" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="844" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <polygon points="52,850 64,844 76,850 64,856" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="88" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nấc thang (diamond)</text>

      <rect x="228" y="844" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đích chung khi có tên (rect)</text>

      <rect x="452" y="844" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="484" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">CẠN — khoảnh khắc hỏi người</text>

      <circle cx="700" cy="850" r="4" fill="#2d3142"/>
      <text x="712" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm gộp nhánh (merge dot)</text>
    </svg>
  </div>
</body>
</html>
