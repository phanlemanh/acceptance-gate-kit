  - id: E16
    criterion: AC-15
    executor: judgment
    runs: 3
    inputs:
      - ../../skills/acceptance/references/human-facing-language.md
      - ../../commands/acceptance-card.md
      - ../../commands/acceptance-report.md
      - ../../commands/acceptance-status.md
      - ../../feature-loop/skills/feature-loop/SKILL.md
      - ../../codex/acceptance-gate/skills/acceptance-card/SKILL.md
      - ../../codex/acceptance-gate/skills/acceptance-report/SKILL.md
      - ../../codex/acceptance-gate/skills/acceptance-status/SKILL.md
      - ../../codex/feature-loop-codex/skills/feature-loop-codex/SKILL.md
    question: >
      Bạn nhận CHÍN file. Với TỪNG file một, áp phép thử Xoá-tên-máy lên phần
      TRÌNH CHO NGƯỜI của nó: xoá hết tên file, tên hàm, tên biến và mã số khỏi
      từng câu, rồi hỏi câu đó còn nghĩa cho một người không đọc mã nguồn
      không. Vùng TRÌNH CHO NGƯỜI là các câu mà sản phẩm cuối sẽ hiện cho người
      duyệt đọc (bảng luật, ví dụ TRƯỚC/SAU, khuôn bảng tóm tắt, câu về quyền
      trả lại, các câu mô tả việc sẽ trình). Vùng KHÔNG tính là chỉ dẫn kỹ
      thuật dành cho agent (đường dẫn script, tên khoá cấu hình, lệnh chạy) —
      luật loại trừ mặt máy nên đừng chấm phần đó. Bắt buộc: liệt kê tên cả
      chín file đã soi và cho kết luận đạt/không đạt RIÊNG cho từng file; với
      mỗi câu không qua được, trích câu đó kèm bản viết lại đề xuất.
    expected: "Judge liệt kê đủ 9 tên file đã soi và phán riêng từng file; văn mặt-người qua được Xoá-tên-máy, câu không qua được phải nêu đích danh kèm đề xuất viết lại. 3 lượt chạy để lộ variance."
