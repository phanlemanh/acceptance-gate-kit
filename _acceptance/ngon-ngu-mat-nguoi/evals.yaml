# Evals — ngon-ngu-mat-nguoi
# Mọi eval máy chạy qua suite tests/plugins (case P89-P96 sinh ở S3).
# cmd là config: ref — resolve tại S4; paths phục vụ carry-forward P1.
#
# LUẬT ÁP CHO CẢ FILE (bất biến kho, gap-probe P1#1 siết theo LỚP):
# mọi case dựng bản sao rồi kết luận từ đột biến PHẢI (a) chạy bản NGUYÊN VẸN
# trước và bản đó phải XANH, (b) ghim đúng thông điệp mong đợi chứ không chỉ
# mã thoát. Eval nào dưới đây không nêu đủ hai vế là eval chưa siết.

