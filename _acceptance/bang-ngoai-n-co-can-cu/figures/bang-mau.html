<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

svg{width:100%;min-width:900px;display:block}

<text x="448" y="122" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Tách thành một việc riêng.</text>

<text x="656" y="218" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chỉ thiếu bài kiểm chặt; sản phẩm vẫn</text>
<text x="656" y="234" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">chạy đúng.</text>
<line x1="40" y1="248" x2="920" y2="248" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="52" y="270" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="500">Ngoài-4</text>
<text x="148" y="270" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Danh sách bốn cột của bảng viết lặp ở</text>
<text x="148" y="286" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">nhiều chỗ trong mã.</text>
<text x="448" y="270" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Không sửa — chấp nhận và</text>
<text x="448" y="286" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">ghi vết.</text>
<text x="656" y="270" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Người dùng không thấy khác; chỉ tốn</text>
<text x="656" y="286" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">công khi đổi cột về sau.</text>

<text x="148" y="338" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">con» biến mất, không báo lỗi.</text>

<text x="656" y="322" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Tải lại là có. Không mất dữ liệu.</text>
