    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
      - scripts/design-gate.mjs
      - scripts/design-scan.js
      - scripts/build-design-scan.mjs
      - lib/design-detect.mjs
      - lib/p-tiers.json
      - skills/design-pass/SKILL.md
      - _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh
    expected: >
      exit 0 — ĐỐI CHỨNG GIỮ-GÂN, chân quan trọng nhất của một chip GỠ. Với
      TỪNG vật trong mảng CẤM ĐỤNG (`scripts/design-gate.mjs`,
      `scripts/design-scan.js`, `scripts/build-design-scan.mjs`,
      `lib/design-detect.mjs`, `lib/p-tiers.json`, `vendor/impeccable/`,
      `tests/design-eval/`, `tests/skills/`, `skills/design-pass/`)
      stdout in "LUU-KHO-GIU: <path> con nguyen
      (byte-equal moc) OK" và dòng đếm "LUU-KHO-GIU: 9/9" suy từ mảng.
      "Còn nguyên" đo bằng **băm nội dung so với mốc**, không chỉ `test -e`:
      tồn-tại-mà-bị-sửa là đúng kiểu cắt-nhầm-gân mà `test -e` mù.
      **`skills/ux-ui-craft/` RA KHỎI mảng byte-equal — ngoại lệ khai TRƯỚC khi
      đo.** Bản đầu viết "ngoại lệ được phép khác tag: không có"; kiểm trên vật
      chứng minh câu đó SAI: `references/layout-craft.md:121` chứa tham chiếu
      SỐNG ("Where design-loop is wired… `design-static-check`'s
      layout-token-only BLOCK") trỏ đúng plugin và đúng script sắp chết, nên nó
      PHẢI đổi. Giữ câu "không có ngoại lệ" thì AC-4 và AC-6 mâu thuẫn và
      **không tồn tại trạng thái cây nào cho cả bộ xanh** — S4 kẹt vòng, lối
      thoát rẻ nhất lúc đó là nới một trong hai sau khi đã thấy số, tức hạ
      thước. Thay bằng chân riêng: `layout-craft.md` KHÔNG còn trỏ
      `design-static-check`, CÓ trỏ `design-gate`, và mọi file khác trong
      `skills/ux-ui-craft/` byte-equal mốc — in "LUU-KHO-GIU: ux-ui-craft 1 file
      doi co khai, con lai byte-equal OK".
      Chiều đỏ CHẠY THẬT: xoá một dòng
      trong bản sao `lib/design-detect.mjs` → đỏ "LUU-KHO-GIU:
      lib/design-detect.mjs LECH tag".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.scripts
    paths:
      - tests/design-eval
      - tests/skills
    expected: >
      exit 0; stdout có tổng kết "Results: **664** passed, 0 failed" — ĐẲNG
      THỨC, không phải sàn. Suite `scripts` tại `daa9b3d` có **671** ca; hồ sơ
      này gỡ `design-loop/`, mà `tests/scripts/run-tests.sh:1390-1406` gọi
      THẲNG hai script của nó (`design-static-check.mjs`, `design-config-patch.mjs`)
      qua **7 assert**: `DSC01` `DSC02` `DSC03` `SG1` `SG2` `SG3` `SG4`. Vậy
      `664 = 671 − 7`, và eval đỏ ghim "so ca lech ky vong: 671 -> <thuc te>".
      **Vì sao KHÔNG dùng sàn `≥` ở đây:** đây là suite bị CHỦ Ý làm teo. Đặt
      sàn 671 thì S4 đỏ vì thước sai chứ không vì vật hỏng, và đường thoát tự
      nhiên lúc đó là hạ sàn xuống con số vừa đo — sau khi hạ, phép đo mất hẳn
      khả năng bắt "gỡ nhầm một thư mục test", tức mất đúng lý do nó tồn tại.
      Sàn `≥` chỉ hợp lệ cho suite hồ sơ KHÔNG đụng tới (E13, E14).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

