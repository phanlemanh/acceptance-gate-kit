      **không tồn tại trạng thái cây nào cho cả bộ xanh** — S4 kẹt vòng, lối
      thoát rẻ nhất lúc đó là nới một trong hai sau khi đã thấy số, tức hạ
      thước. Thay bằng chân riêng: `layout-craft.md` KHÔNG còn trỏ
      `design-static-check`, CÓ trỏ `design-gate`, và mọi file khác trong
      `skills/ux-ui-craft/` byte-equal mốc — in "LUU-KHO-GIU: ux-ui-craft 1 file
      doi co khai, con lai byte-equal OK".
