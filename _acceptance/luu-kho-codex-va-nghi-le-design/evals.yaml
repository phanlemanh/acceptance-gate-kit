      trước một phép đo, mỗi lần vì đọc ra thêm một ca không có đích để trỏ về.
      Bản trước viết `173 − <số assert của P30>`, với **173** là
      số ca đo tại `daa9b3d` (suite này KHÔNG tự in số — nó chỉ nói "all plugin
      tests passed" — nên số ca phải đếm bằng dòng `PASS:`; chính vì thế nó là
      suite dễ teo mà không ai thấy). In "LUU-KHO-SUITE: plugins 173 -> <n> OK";
      đỏ ghim "LUU-KHO-SUITE: so ca lech ky vong: 173 -> <n>". Số assert của
