    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: script
    cmd: config:executors.script.luu_kho_so_ca_scripts
    paths:
      - tests/design-eval
      - tests/skills
    expected: >
      exit 0; stdout có "LUU-KHO-SUITE: scripts 671 -> 686 OK" và dòng tổng kết
      NGUYÊN VĂN của suite `Results: 686 passed, 0 failed` — ĐẲNG
      THỨC, không phải sàn. Suite `scripts` tại `daa9b3d` có **671** ca; hồ sơ
      này gỡ `design-loop/`, mà `tests/scripts/run-tests.sh:1390-1406` gọi
      THẲNG hai script của nó (`design-static-check.mjs`, `design-config-patch.mjs`)
      qua **7 assert**: `DSC01` `DSC02` `DSC03` `SG1` `SG2` `SG3` `SG4`; rồi
      AC-17/AC-19 thêm **22 assert** `RS01`–`RS06`. Vậy `686 = 671 − 7 + 22`, và
      eval đỏ ghim "so ca lech ky vong: 671 -> <thuc te>".
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 2] Hai chuỗi ghim ở trên trước đây
      viết `664`, và cây KHÔNG BAO GIỜ in được chúng.** Rà soát vòng 2 (F4):
      chuỗi `671 -> 664` được VIẾT MỚI trong vòng sửa 1, ở đúng commit đổi đẳng
      thức sang 686 — mọi chỗ khác (AC-11, khối `SO-CA-KY-VONG`, E19, bảng Số
      đo) đều ghi 686, riêng eval này còn 664. Nó sống sót được vì sổ chạy chỉ
      ghi `exit_code`: lời hứa thông-điệp của cả 23 eval chưa từng được đối
      chiếu với đầu ra thật. Nay trường `pinned:` dưới đây là bản MÁY-ĐỌC của
      lời hứa ấy, và `ghi-so-chay.mjs` fail-closed nếu đầu ra không chứa nó
      (xem AC-20).
      **Vì sao KHÔNG dùng sàn `≥` ở đây:** đây là suite bị CHỦ Ý làm teo. Đặt
      sàn 671 thì S4 đỏ vì thước sai chứ không vì vật hỏng, và đường thoát tự
      nhiên lúc đó là hạ sàn xuống con số vừa đo — sau khi hạ, phép đo mất hẳn
      khả năng bắt "gỡ nhầm một thư mục test", tức mất đúng lý do nó tồn tại.
      Sàn `≥` chỉ hợp lệ cho suite hồ sơ KHÔNG đụng tới (E13, E14).
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1]** `cmd` đổi từ
      `config:executors.test.scripts` sang `config:executors.script.luu_kho_so_ca_scripts`.
