      Chiều đỏ CHẠY THẬT: thêm lại entry design-loop vào bản sao manifest →
      đỏ "LUU-KHO-MKT: con entry design-loop".
    pinned:
      - "LUU-KHO-MKT: claude 2 plugin (acceptance-gate, feature-loop) OK"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
      - _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh
      - GUIDE.md
      - QUICKSTART.md
      - README.md
      - CONTEXT.md
    expected: >
      exit 0; mảng needle KHÔNG nêu lại ở đây — nó sống ở khối máy-đọc
      `NEEDLE-CHET` trong `contract.md` (lý do vào/ra của từng needle cũng nằm
      ở AC-4 của contract, một chỗ), và `luu-kho-rang.sh` đọc thẳng khối ấy.
      Với TỪNG needle của khối, quét phạm vi SỐNG (mảng `SCOPE` in ở đầu nhóm
      E4) và in "LUU-KHO-REF: <needle> HEAD=0 tag=<n>(>0) OK"; dòng đếm
      "LUU-KHO-REF: <n>/<n>" suy từ khối lúc chạy.
      **[SỬA SAU CỔNG 1 — 13/08, vòng thu gọn «chỉ TRỪ»]** Bản trước mang HAI
      bản chép của mảng ngay trong eval này (một mảng 11 lỗi thời từ bản duyệt
      + một ghi chú "còn TÁM" của vòng sửa 1) — cả hai trôi khỏi khối thật
      (G2 vòng 3). Xử như E2: giá trị về khối, văn xuôi giữ lý do.
      Bốn needle mirror + `.agents` + hai đích quét là bổ sung sau phản biện:
      thiếu chúng thì gỡ `plugins/` và script sync xong, `CLAUDE.md` vẫn bắt
      "chạy sync và commit mirror cùng lượt" còn CI vẫn gọi script đã xoá — cả
      bộ eval xanh, hai cổng duyệt, CI đỏ sau merge. `.agents` vào mảng vì
      đường dẫn `.agents/plugins/marketplace.json` KHÔNG chứa chuỗi `codex`,
      nên needle theo tên thương hiệu mù với nó.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Phạm vi bỏ `tests/`** — lý do
      đầy đủ nằm trong AC-4 của `contract.md`, không còn chỉ trong chú thích
      script.
      **MIỄN TRỪ theo CẶP `(tệp, từ khoá)`, khai trước khi đo, mỗi cặp kèm số
      dòng:** `skills/ux-ui-craft/SKILL.md × design-loop` (1) ·
      `.claude-plugin/plugin.json × design-loop` (1) ·
      `.claude-plugin/plugin.json × sync-plugin-packages` (1) ·
      `feature-loop/.claude-plugin/plugin.json × design-loop` (1). Script in
      "LUU-KHO-REF: mien tru 4/4 cap dung so dong da khai OK" và ĐỎ hai chiều —
      khai thiếu, hoặc khai thừa (dòng khai mà tệp không còn hit). Bản trước neo
      theo TIỀN TỐ TỆP nên che trọn bốn tệp cho cả tám needle: allowlist
      fail-loud hoá fail-silent, và đã có vật lọt thật.
      **Thêm một chân TRƯỚC mọi con số 0:** mỗi mục trong danh sách phạm vi phải
      TỒN TẠI trên cây ("LUU-KHO-REF: 13/13 muc pham vi ton tai OK"). Không có
      chân này thì một mục gõ sai làm `grep` im lặng và cả tám needle in
      "HEAD=0 … OK" trong khi phép quét chưa quét gì.
      Hai chân bắt buộc mỗi needle: HEAD phải 0 VÀ tag phải >0 — needle nào tag=0 thì đỏ
      "LUU-KHO-REF: <needle> tag=0 — needle nay chua bao gio ton tai, phep do
      khong song" (lớp needle-đã-tồn-tại: một từ khoá gõ sai cho 0-hit hai đầu
      và xanh oan). `docs/` và `_acceptance/` ngoài phạm vi (sử liệu). Grep
      dùng lớp ký tự cho ký tự đặc biệt (GNU coi ` là anchor). Chiều đỏ CHẠY
      THẬT: chèn lại một dòng "In Codex…" vào bản sao `commands/signoff.md` →
      đỏ "LUU-KHO-REF: In Codex HEAD=1".
    pinned:
      - "LUU-KHO-REF: 13/13 muc pham vi ton tai OK"
      - "LUU-KHO-REF: 11/11"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

