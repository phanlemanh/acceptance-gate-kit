      lượng. Đây là chân chống gỡ-quá-tay, và cũng là chân chống suite-rỗng
      (một suite bị gỡ sạch case vẫn in "all tests passed" và trả 0).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

