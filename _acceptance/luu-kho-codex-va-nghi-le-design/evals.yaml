      feature-loop) OK" và "LUU-KHO-MKT: .agents/plugins/marketplace.json vang
      OK". Script đọc manifest bằng `node -e` + JSON.parse (KHÔNG grep — manifest
      là JSON, grep mù với định dạng: một entry bị comment hay đổi thụt lề vẫn
      khớp chuỗi), assert tập tên plugin đúng bằng {acceptance-gate,
      feature-loop} và entry `design-loop` vắng. Đối chứng dương: cùng phép đọc
      trên manifest lấy từ tag cho 3 entry — in "LUU-KHO-MKT: tag co 3 entry
      OK", nên "2 entry" là kết quả của việc GỠ chứ không phải của file hỏng.
      Chiều đỏ CHẠY THẬT: thêm lại entry design-loop vào bản sao manifest →
      đỏ "LUU-KHO-MKT: con entry design-loop".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
      - _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh
      - GUIDE.md
      - QUICKSTART.md
      - README.md
      - CONTEXT.md
    expected: >
      exit 0; với TỪNG needle trong mảng **MƯỜI MỘT** từ khoá — `codex`,
      `In Codex`, `.agents`, `design-loop`, `/design-init`, `/design-mockup`,
      `/design-push`, `sync-plugin-packages`, `mirror_sync`, `plugins/`, `P30`
      — quét phạm vi SỐNG (`commands/`, `skills/`, `feature-loop/`, `scripts/`,
      `lib/`, `hooks/`, `tests/`, `GUIDE.md`, `QUICKSTART.md`, `README.md`,
      `CONTEXT.md`, **`CLAUDE.md`**, **`.github/`**, hai manifest) và in
      "LUU-KHO-REF: <needle> HEAD=0 tag=<n>(>0) OK"; dòng đếm
      "LUU-KHO-REF: 11/11" suy từ mảng.
      Bốn needle mirror + `.agents` + hai đích quét là bổ sung sau phản biện:
      thiếu chúng thì gỡ `plugins/` và script sync xong, `CLAUDE.md` vẫn bắt
      "chạy sync và commit mirror cùng lượt" còn CI vẫn gọi script đã xoá — cả
      bộ eval xanh, hai cổng duyệt, CI đỏ sau merge. `.agents` vào mảng vì
      đường dẫn `.agents/plugins/marketplace.json` KHÔNG chứa chuỗi `codex`,
      nên needle theo tên thương hiệu mù với nó.
      **MIỄN TRỪ đúng MỘT dòng, khai trước khi đo:**
      `skills/ux-ui-craft/SKILL.md:289` ("a design-loop" — danh từ chung). Script
      in "LUU-KHO-REF: mien tru 1/1 dong da khai OK" và ĐỎ nếu số dòng miễn trừ
      khác 1 — allowlist phình ra là cách lưới fail-loud hoá fail-silent.
      Hai chân bắt buộc mỗi needle: HEAD phải 0 VÀ tag phải >0 — needle nào tag=0 thì đỏ
      "LUU-KHO-REF: <needle> tag=0 — needle nay chua bao gio ton tai, phep do
      khong song" (lớp needle-đã-tồn-tại: một từ khoá gõ sai cho 0-hit hai đầu
      và xanh oan). `docs/` và `_acceptance/` ngoài phạm vi (sử liệu). Grep
      dùng lớp ký tự cho ký tự đặc biệt (GNU coi ` là anchor). Chiều đỏ CHẠY
      THẬT: chèn lại một dòng "In Codex…" vào bản sao `commands/signoff.md` →
      đỏ "LUU-KHO-REF: In Codex HEAD=1".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

