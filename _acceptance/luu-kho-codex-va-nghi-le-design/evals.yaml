schema_version: 1
feature_slug: luu-kho-codex-va-nghi-le-design
# Vật được giao ở hồ sơ này phần lớn là SỰ VẮNG MẶT. Đó là hình dạng nguy hiểm
# nhất trong sổ vấp của kho: "assertion âm-tính-một-mình là assertion không
# sống" — grep hỏng, đường dẫn gõ sai, script chưa chạy đều cho cùng một màu
# xanh. Nên MỌI eval âm ở đây bị buộc ba điều:
#   (a) ĐỐI CHỨNG DƯƠNG neo vào tag `truoc-luu-kho-2026-08` — cùng câu quét
#       chạy trên cây của tag phải cho >0 hit. Cố ý KHÔNG dùng origin/main:
#       origin/main còn di chuyển, tag thì bất biến, và chính AC-1 bảo đảm tag
#       tồn tại. Tag VẮNG → script ĐỎ (fail-closed), không phải bỏ qua.
#   (b) GHIM ĐÚNG THÔNG ĐIỆP, không tin mã thoát trọn suite (lớp
#       runner-nuốt-mã-thoát + suite-xanh-cả-hai-cây).
#   (c) CHIỀU ĐỎ CHẠY THẬT: script tự dựng bản sao có vật bị lưu kho chép
#       ngược về, chạy lại CHÍNH checker thật, in xác-nhận-đột-biến.
# Số ca in ra SUY từ mảng, không phải literal (lớp tổng-kết-không-kèm-số-ca).
# Không có làn design/ui-check: kit không có web UI.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
      - _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh
    expected: >
      exit 0; stdout có "LUU-KHO-TAG: truoc-luu-kho-2026-08 -> <sha>" và
      "LUU-KHO-TAG: la cha cua commit go dau tien OK". Script assert: (1) tag
      tồn tại (`git rev-parse -q --verify`); (2) cây của tag CÓ đủ ba đường
      dẫn `codex/`, `design-loop/`, `plugins/` (`git ls-tree` — không checkout,
      không đụng cây làm việc); (3) mốc là **CHA TRỰC TIẾP** của commit gỡ đầu
      tiên — `git rev-list <mốc>..<commit gỡ đầu>` trừ chính nó phải RỖNG; quan
      hệ tổ-tiên KHÔNG đủ vì nó cho phép chèn commit khác vào giữa, tức cây của
      mốc không còn là "ngay trước khi gỡ"; (4) **mốc có trên remote** —
      `git ls-remote --tags origin` trả đúng sha local, đỏ ghim "LUU-KHO-TAG:
      chua day len remote". Chân (4) là chân sống-còn của cả hồ sơ: mốc chỉ nằm
      local thì đường-đảo-rẻ (thứ duy nhất biện minh cho việc xoá ~194 file)
      không tồn tại với bất kỳ ai khác, hai ADR ghim một sha không ai resolve
      nổi, và mọi lần verify lại đỏ vĩnh viễn theo chính luật fail-closed dưới
      đây. Chiều đỏ CHẠY
      THẬT: gọi lại chính hàm kiểm với tên tag bịa `truoc-luu-kho-KHONG-CO` →
      đỏ ghim "LUU-KHO-TAG: thieu tag doi chung — khong the chay bat ky
      assertion am nao", in xác-nhận-đột-biến. Đây là chân fail-closed của cả
      bộ: thiếu tag thì E2/E4/E9 mất đối chứng dương nên KHÔNG được phép xanh.
      Baseline: n-a (script là vật của chính hồ sơ này; đối chứng neo vào tag
      tường minh trong lệnh).
    pinned:
      - "LUU-KHO-TAG: la cha cua commit go dau tien OK"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
      - _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh
    expected: >
      exit 0; danh sách vật lưu kho KHÔNG nêu lại ở đây — nó sống ở đúng MỘT
      chỗ: khối máy-đọc `VAT-LUU-KHO` trong `contract.md`, và `luu-kho-rang.sh`
      đọc thẳng khối ấy. Stdout có dòng đếm "LUU-KHO-PATH: <n>/<n> vang o HEAD,
      co o tag OK (danh sach doc tu khoi VAT-LUU-KHO)" với n = số dòng của
      khối, suy lúc chạy chứ không viết cứng ở đâu.
      **[SỬA SAU CỔNG 1 — 13/08, vòng thu gọn «chỉ TRỪ»]** Bản trước liệt kê
      lại sáu đường dẫn và ghim "6/6" ngay tại đây — một bản chép chỉ-người-đọc
      của khối, và nó đã trôi thật (G1 vòng 3: khối lên bảy, câu này còn sáu,
      nằm ở đúng dòng vòng 2 cite cho F1). Luật rút ra, khai ở AC-20: văn xuôi
      nêu QUAN HỆ và LÝ DO; GIÁ TRỊ chỉ sống ở khối máy-đọc hoặc ở bản chép
      được máy so mỗi vòng (`pinned:` — trôi là recorder đỏ, trôi thành TIẾNG).
      Script đỏ ghim đích danh khi: path còn trên HEAD ("… con tren HEAD") HOẶC
      path KHÔNG có ở tag ("… khong co o tag — doi chung duong hong, assertion
      nay khong song"). Vế sau là chân chống chính lớp lỗi đã ghi sổ: gõ sai
      đường dẫn thì cả hai đầu đều 0-hit và eval xanh oan. Chiều đỏ CHẠY THẬT:
      chép `codex/` từ tag về một bản sao tạm rồi chạy lại checker trên bản sao
      → đỏ "LUU-KHO-PATH: codex/ con tren HEAD"; đối chứng dương (cây thật)
      xanh trước đột biến.
    pinned:
      - "LUU-KHO-PATH: 7/7 vang o HEAD, co o tag OK"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.luu_kho_rang
    paths:
