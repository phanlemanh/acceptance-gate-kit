<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng khuôn hai cổng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #636b80;
      --color-rule:   rgba(45,49,66,0.12);
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    .src {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-soft);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · khoi-khuon-tren-the-cong</p>
    <h1>Luồng khuôn qua hai cổng</h1>

    <svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .nmono { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #4f5d75; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
          .ac { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #636b80; letter-spacing: 0.06em; }
          .lb { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #636b80; letter-spacing: 0.06em; }
          .tag { font-family: 'Geist Mono', monospace; font-size: 7px; fill: rgba(45,49,66,0.8); letter-spacing: 0.08em; }
          .eb { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.14em; }
          .q { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; fill: #2d3142; }
          .qa { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; fill: #ba4513; }
          .qm { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 400; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Hỏi-1: hai ngoặc phạm vi phê ===== -->
      <text x="40" y="88" class="eb">HỎI-1</text>
      <text x="40" y="108" class="q">Phê CỘNG</text>
      <text x="40" y="124" class="q">mấy phần?</text>

      <!-- Ngoặc A: cả ba phần (khuyến nghị) -->
      <path d="M216,108 V96 H1240 V108" fill="none" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="560" y="72" width="336" height="16" rx="2" fill="#f5f5f5"/>
      <text x="728" y="84" class="qa" text-anchor="middle">Phê cả ba phần — khuyến nghị</text>

      <!-- Ngoặc B: chỉ hai phần đầu -->
      <path d="M216,156 V144 H812 V156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="292" y="120" width="444" height="16" rx="2" fill="#f5f5f5"/>
      <text x="514" y="132" class="qm" text-anchor="middle">Chỉ phê hai phần đầu — Cổng Bằng chứng để sau</text>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <!-- S1 → Chọn nhóm -->
      <path d="M168,268 H188 Q196,268 196,260 V212 Q196,204 204,204 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- S1 → Nhóm mới -->
      <path d="M168,292 H188 Q196,292 196,300 V348 Q196,356 204,356 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Chọn nhóm → khuon-nap -->
      <path d="M376,204 H396 Q404,204 404,212 V260 Q404,268 412,268 H424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhóm mới → khuon-nap -->
      <path d="M376,356 H396 Q404,356 404,348 V300 Q404,292 412,292 H424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhóm mới → Hỏi-n (dòng sổ) -->
      <path d="M296,388 V448 Q296,456 304,456 H632" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="432" y="432" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="464" y="445" class="lb" text-anchor="middle">IN DÒNG SỔ</text>
      <!-- Hỏi-n → Thẻ Cổng Phạm vi -->
      <line x1="722" y1="424" x2="722" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="732" y="360" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="756" y="373" class="lb" text-anchor="middle">LÊN THẺ</text>
      <!-- khuon-nap → Thẻ Cổng Phạm vi -->
      <line x1="584" y1="280" x2="632" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Thẻ Cổng Phạm vi → S3/S4 -->
      <line x1="812" y1="280" x2="860" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- S3/S4 → Thẻ Cổng Bằng chứng -->
      <line x1="1004" y1="280" x2="1052" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- khuon-nap → Thẻ Cổng Bằng chứng (đọc chon.nhom) -->
      <path d="M560,240 V220 Q560,212 568,212 H1138 Q1146,212 1146,220 V240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="784" y="188" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="836" y="201" class="lb" text-anchor="middle">ĐỌC CHON.NHOM</text>
      <!-- Hỏi-n → chú thích Hỏi-2 -->
      <line x1="812" y1="456" x2="860" y2="456" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ===== Hộp ===== -->
      <!-- S1 bước nạp (bắt đầu) -->
      <rect x="40" y="252" width="128" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="252" width="128" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="104" y="278" class="nm" text-anchor="middle">S1 bước nạp</text>
      <text x="104" y="294" class="mo" text-anchor="middle">--nap --slug</text>

      <!-- Chọn nhóm -->
      <rect x="216" y="172" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="196" class="nm" text-anchor="middle">Chọn nhóm</text>
      <text x="296" y="212" class="mo" text-anchor="middle">--nhom &lt;nhóm&gt;</text>
      <text x="296" y="226" class="ac" text-anchor="middle">AC-1</text>

      <!-- Nhóm mới -->
      <rect x="216" y="324" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="324" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="348" class="nm" text-anchor="middle">Nhóm mới</text>
      <text x="296" y="364" class="mo" text-anchor="middle">--nhom-moi &lt;tên&gt;</text>
      <text x="296" y="378" class="ac" text-anchor="middle">--gan tuỳ chọn · AC-2</text>

      <!-- khuon-nap.json — phần 1 -->
      <rect x="424" y="240" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="240" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="432" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="452" y="255" class="tag" text-anchor="middle">PHẦN 1</text>
      <text x="504" y="280" class="nmono" text-anchor="middle">khuon-nap.json</text>
      <text x="504" y="296" class="sb" text-anchor="middle">chon: nhóm · tệp bản đồ</text>
      <text x="504" y="310" class="sb" text-anchor="middle">màn mẫu + băm git</text>

      <!-- Thẻ Cổng Phạm vi — phần 2 -->
      <rect x="632" y="240" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="240" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="660" y="255" class="tag" text-anchor="middle">PHẦN 2</text>
      <text x="722" y="280" class="nm" text-anchor="middle">Thẻ Cổng Phạm vi</text>
      <text x="722" y="296" class="sb" text-anchor="middle">khối Khuôn + 3 cờ vàng</text>
      <text x="722" y="310" class="ac" text-anchor="middle">AC-3 · AC-4</text>

      <!-- Hỏi-n (nhánh nhóm mới) -->
      <rect x="632" y="424" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="424" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="722" y="446" class="nm" text-anchor="middle">Hỏi-n trên thẻ</text>
      <text x="722" y="462" class="sb" text-anchor="middle">tạo nhóm · xếp vào nhóm gần</text>
      <text x="722" y="476" class="sb" text-anchor="middle">hoặc để ngoài bản đồ</text>

      <!-- S3/S4 bước chấm — có sẵn từ KH1 -->
      <rect x="860" y="240" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="860" y="240" width="144" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="868" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="882" y="255" class="tag" text-anchor="middle">KH1</text>
      <text x="932" y="280" class="nm" text-anchor="middle">S3/S4 bước chấm</text>
      <text x="932" y="296" class="mo" text-anchor="middle">→ khuon-cham.json</text>
      <text x="932" y="310" class="ac" text-anchor="middle">có sẵn</text>

      <!-- Thẻ Cổng Bằng chứng — phần 3 -->
      <rect x="1052" y="240" width="188" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="1052" y="240" width="188" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1060" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1080" y="255" class="tag" text-anchor="middle">PHẦN 3</text>
      <text x="1146" y="280" class="nm" text-anchor="middle">Thẻ Cổng Bằng chứng</text>
      <text x="1146" y="296" class="sb" text-anchor="middle">số đo + danh sách lệch</text>
      <text x="1146" y="310" class="sb" text-anchor="middle">cờ chạm nhóm khác · AC-5</text>

      <!-- Hỏi-2: chú thích tô -->
      <rect x="860" y="416" width="380" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="860" y="416" width="380" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="876" y="436" class="eb">HỎI-2</text>
      <text x="928" y="436" class="q">Màn mới quyết bằng gì?</text>
      <text x="876" y="460" class="qa">● Câu Hỏi-n sẵn có — khuyến nghị</text>
      <text x="876" y="480" class="qm">○ Nhãn riêng trong câu duyệt</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="528" x2="1240" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="548" class="eb">CHÚ GIẢI</text>

      <rect x="40" y="564" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="574" class="sb">Phần mới của vòng</text>

      <rect x="224" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="256" y="574" class="sb">Có sẵn từ KH1</text>

      <line x1="392" y1="570" x2="420" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="428" y="574" class="sb">Luồng chạy</text>

      <line x1="540" y1="570" x2="568" y2="570" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="576" y="574" class="sb">Thẻ đọc vật</text>

      <path d="M696,576 V564 H724 V576" fill="none" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="732" y="574" class="sb">Điểm hỏi người — lối khuyến nghị tô cam</text>
    </svg>

    <p class="src">Nguồn: design.md §2–§3 · contract.md AC-1…AC-5 · figures/index.md (đề bài luong-khuon-hai-cong)</p>
  </div>
</body>
</html>
