<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Kế hoạch ba làn</title>
<style>
:root{--bg:#faf9f6;--ink:#1f1f1d;--mute:#6c6a64;--line:#b4b2a9;--a:#E1F5EE;--aL:#1D9E75;--b:#EAF0FA;--bL:#3A6FB0;--c:#F4F2EC;--cL:#8a887f;--m:#FAEEDA;--mL:#EF9F27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--ink:#eceae4;--mute:#a9a79f;--line:#5c5a54;--a:#15372c;--b:#1c2a3e;--c:#2a2926;--m:#3a2c14}}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
svg{width:100%;height:auto;max-width:980px;display:block;margin:0 auto}
text{fill:var(--ink);font-size:13px}.m{fill:var(--mute);font-size:11px}.t{font-weight:600;font-size:14px}
p{max-width:980px;margin:12px auto;color:var(--mute);font-size:13px}
</style></head><body>
<svg viewBox="0 0 980 420" role="img" aria-label="Kế hoạch thi công ba làn song song">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--line)"/></marker></defs>
<rect x="10" y="175" width="150" height="70" rx="10" fill="var(--m)" stroke="var(--mL)"/>
<text x="85" y="205" text-anchor="middle" class="t">Bước 0</text><text x="85" y="225" text-anchor="middle" class="m">khoá chạy ba tệp ca</text>
<path d="M160 210 C 190 210 190 70 220 70" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<path d="M160 210 L 220 210" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<path d="M160 210 C 190 210 190 350 220 350" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<g><rect x="220" y="20" width="560" height="100" rx="10" fill="var(--a)" stroke="var(--aL)"/>
<text x="236" y="42" class="t">Làn A · bộ chấm (5 việc nối tiếp)</text>
<text x="236" y="66">A1 nhãn hạ tầng cho bộ kiểm chung → A2 khung in dấu mã thoát → A3 đọc dấu (8 trường hợp)</text>
<text x="236" y="88">→ A4 mã commit từ máy → A5 ảnh neo hồ sơ</text>
<text x="236" y="108" class="m">AC-1 · AC-2 · AC-3 · AC-4 · AC-5 · AC-9 — kèm sửa ~31 chỗ ca cũ thêm dòng dấu</text></g>
<g><rect x="220" y="160" width="560" height="100" rx="10" fill="var(--b)" stroke="var(--bL)"/>
<text x="236" y="182" class="t">Làn B · thẻ người ký (2 việc nối tiếp)</text>
<text x="236" y="206">B1 hiện đủ từng mục «không làm», cờ câu dịch lạc → B2 đọc mọi bảng phản biện</text>
<text x="236" y="248" class="m">AC-6 · AC-7</text></g>
<g><rect x="220" y="300" width="560" height="100" rx="10" fill="var(--c)" stroke="var(--cL)"/>
<text x="236" y="322" class="t">Làn C · đo chi phí và chữ (2 việc nối tiếp)</text>
<text x="236" y="346">C1 bảng chi phí tách theo khối → C2 ba câu tài liệu</text>
<text x="236" y="388" class="m">AC-8 · AC-10</text></g>
<path d="M780 70 C 810 70 810 210 840 210" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<path d="M780 210 L 840 210" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<path d="M780 350 C 810 350 810 210 840 210" stroke="var(--line)" fill="none" marker-end="url(#ar)"/>
<rect x="840" y="170" width="130" height="80" rx="10" fill="var(--m)" stroke="var(--mL)"/>
<text x="905" y="196" text-anchor="middle" class="t">Gộp + đủ</text><text x="905" y="214" text-anchor="middle" class="t">bốn suite</text><text x="905" y="236" text-anchor="middle" class="m">→ chấm S4</text>
</svg>
<p>Ba làn chạy song song trong ba worktree riêng, tệp rời nhau (mỗi làn một tệp ca) nên gộp không xung đột. Trong mỗi làn các việc chạy nối tiếp, mỗi việc: ca đỏ trước → sửa → ca xanh → commit.</p>
</body></html>
