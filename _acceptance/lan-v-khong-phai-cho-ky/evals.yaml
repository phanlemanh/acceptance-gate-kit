# Evals — lan-v-khong-phai-cho-ky (phạm vi T3, sau khi owner trả lại 21/08)
#
# Phép đo thật sống ở hai chỗ:
#   · tests/plugins/lan-v.test.mjs — ca LV1..LV9 (LV7 = bảng sự-thật 300 ô có
#     TRỤC SẠCH; LV8 = đẳng thức JS↔bash; LV9 = sàn đếm bộ lọc). Suite plugins
#     gọi bằng 9 dòng `run` đặt tên bắt đầu «ca lan V —» (không chứa chuỗi
#     `PASS: LV<n>` để suite có ĐÚNG 9 dòng ca do chính file ca in).
#   · _acceptance/lan-v-khong-phai-cho-ky/rang.sh — 6 chân, `cmd:` khai bằng
#     ĐƯỜNG DẪN (không thêm khoá config.yaml, nếp hạt giống B).
#
# Bài học vòng một, ghim vào khuôn: mọi eval phải khai CHIỀU ĐỎ chạy trong CÙNG
# lượt, và chiều đỏ phải giết ĐÚNG nhánh mà tiêu chí nói tới (vòng một có một vế
# đỏ là mã chết vì đột biến chỉ chạm bộ đọc bản đồ).

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan sach
    expected: >
      Răng ghim dòng 'PASS: LV8a xanhSach: 6 dieu kien x 2 chieu, why ghim dung
      dieu kien truot dau tien'. Ma trận fixture code-sinh phủ MỖI điều kiện ở cả
      hai chiều (đạt/trượt): verdict PASS · bypass_used · hạng T2 · mục UNCERTAIN ·
      «Known limits» hiện-diện-và-rỗng · «Ngoài hợp đồng» hiện-diện-và-rỗng, cộng
      ba biến thể VẮNG-mục (vắng ≠ rỗng). Mỗi ô so `clean` với bảng kỳ vọng viết
      trước VÀ so `why` với điều kiện trượt đầu tiên. Chiều đỏ cùng lượt: bản sao
      lib bị gỡ một điều kiện (marker XANH-SACH-<tên>) → ca đỏ ghim
      'dieu kien <ten> khong con phan biet duoc'.
    paths: [lib/evidence-core.cjs, tests/plugins/lan-v.test.mjs, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan dang-thuc
    expected: >
      Bash so với BẢNG KỲ VỌNG VIẾT TAY, KHÔNG so với lib — dưới ngả (i) bash gọi
      lib nên phép so bash↔lib hằng-đúng (phản biện 21/08 bắt). Với TỪNG fixture
      của E1: răng chạy CHÍNH `bash scripts/pre-merge-check.sh <fixture> --base
      <ref>`, đọc kết luận sạch/không-sạch từ dòng NOTE/VIOLATION thật, rồi so
      với ô tương ứng trong bảng kỳ vọng của AC-7 (bảng độc lập với cả bash lẫn
      lib, viết tay trước khi có mã). Lệch một ô → đỏ ghim 'lech o <toa do>:
      bash=<x> ky vong=<y>'. Răng in 'DANG-THUC OK: <N> o, bash khop bang ky vong
      o ca <N>'. HAI chiều đỏ cùng lượt, mỗi cái một thông điệp riêng: (1) đột
      biến MỐI NỐI — bản sao bẻ lớp vỏ bash đọc/ánh xạ đầu ra `node -e` (đảo
      nghĩa mã thoát) → răng đỏ ghim 'moi noi hong ma van khop'; (2) đột biến
      BẢNG — sửa một ô kỳ vọng → răng đỏ ghim đúng toạ độ ô đó. Đối chứng dương:
      bản không tiêm phải xanh trước cả hai.
    paths: [lib/evidence-core.cjs, scripts/pre-merge-check.sh, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cases
    expected: >
      Răng ghim dòng 'PASS: LV1 sach + chua ky -> da giao o ca hai bo doc (khong
      phu thuoc veto_state)'. Ca hỏi CẢ HAI bộ đọc và ghim GIÁ TRỊ từng bên:
      `groups.done` state, vắng khỏi `groups.gates`, mục bản đồ, VÀ quan hệ số đếm
      ô mermaid «Đã giao» tăng đúng 1. Chiều đỏ: đột biến 1 (bản đồ) và đột biến 2
      (máy quét) ở chân mutant, mỗi cái ghim MỘT câu riêng.
    paths: [scripts/start-scan.mjs, scripts/product-map.mjs, lib/evidence-core.cjs, tests/plugins/lan-v.test.mjs]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cases
    expected: >
      Răng ghim dòng 'PASS: LV2 sach ma VANG veto_state -> van da giao, KHONG chu
      thich'. Đây là chiều ngược mà vòng một làm sai (vị từ khoá vào veto_state):
      hồ sơ người duyệt tay ở Cổng 1, sạch ở Cổng 2, phải là «đã giao» và không
      mang «cửa veto mở». FAIL ghim 'sach ma van bi xep cho ky: <bo doc>' hoặc
      'gan chu thich cua veto mo khi khong co veto_state'.
    paths: [scripts/start-scan.mjs, scripts/product-map.mjs, lib/evidence-core.cjs, tests/plugins/lan-v.test.mjs]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cases
    expected: >
      Răng ghim dòng 'PASS: LV3 V-mo + PASS + T2 nhung CHUA SACH -> van la cong
      cho chu ky (4 bien the)'. Bốn biến thể: bypass_used true · có mục UNCERTAIN ·
      «Known limits» có nội dung · «Ngoài hợp đồng» có nội dung. Đây là ca ĐÓNG LỖ
      của vòng một — vị từ quay lại khoá vào veto_state sẽ đỏ ở cả bốn biến thể
      với 'chua sach ma bi xep da giao: <bien the> <bo doc>'. Chiều đỏ riêng ở
      chân mutant (đột biến 4: trả vị từ về tiêu chí veto_state).
    paths: [scripts/start-scan.mjs, scripts/product-map.mjs, lib/evidence-core.cjs, tests/plugins/lan-v.test.mjs]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cases
    expected: >
      Răng ghim dòng 'PASS: LV4 da-veto -> KHONG da giao du bang chung sach'.
      Ca cô lập lớp: vị từ viết thành «sạch ⇒ đã giao» mà quên nhánh da-veto sẽ đỏ
      ở đây với 'da-veto bi xep da giao: <bo doc>'.
    paths: [scripts/start-scan.mjs, scripts/product-map.mjs, tests/plugins/lan-v.test.mjs]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cases
    expected: >
      Răng ghim dòng 'PASS: LV7 bang su-that 300 o: <N> o da giao khop ham ky vong,
      hai bo doc khop'. Bảng sự-thật viết trước trên veto(5) × verdict(5) × hạng(2)
      × chữ ký(2) × sạch(3); số ô đếm TỪ chính vòng lặp và in ra phải = 300. Với
      từng ô: tính GIÁ TRỊ KỲ VỌNG của từng bộ đọc từ hàm kỳ vọng viết tay (độc lập
      với vị từ đang kiểm), so với giá trị THẬT của mỗi bộ đọc, rồi mới so quan hệ.
      FAIL ghim toạ độ '(veto=<b>, verdict=<c>, hang=<d>, ky=<e>, sach=<f>) <bo doc>
      ky vong <x> thuc te <y>'.
    paths: [scripts/start-scan.mjs, scripts/product-map.mjs, lib/evidence-core.cjs, tests/plugins/lan-v.test.mjs]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan ban-do
    expected: >
      Trên cây thật (ROOT suy từ vị trí răng): `product-map.mjs --root $ROOT --check`
      exit 0; và chú thích đầu `scripts/product-map.mjs` chứa câu luật mới nêu «đóng
      cổng» thay vì liệt kê approved/implemented/verified — răng ghim NGUYÊN VĂN câu
      đó, và ghim rằng câu cũ («Bucket cố ý THÔ … gộp MỘT nhãn») KHÔNG còn. Chiều đỏ
      cùng lượt: bản sao PRODUCT-MAP.md thêm dòng rác → --check exit khác 0 (đối
      chứng --check có răng); bản sao product-map.mjs trả lại câu cũ → răng đỏ ghim
      'chu thich dau file van noi luat cu'.
    paths: [scripts/product-map.mjs, PRODUCT-MAP.md, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E9
    criterion: AC-8
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan ve-lai
    expected: >
      Vòng làn V phải vẽ lại bản đồ TRONG CÙNG VÒNG: răng dựng bản sao cây, đưa một
      hồ sơ fixture qua bước `implemented`→`verified` + sạch, chạy bước vẽ-lại mà
      thân vòng lặp khai (`feature-loop/skills/feature-loop/SKILL.md`, khối làn V),
      rồi đòi `--check` exit 0 trên bản sao. Răng in 'VE-LAI OK: buoc ve lai co
      that trong than vong lap va lam --check xanh'. Chiều đỏ cùng lượt: bản sao
      SKILL.md gỡ bước vẽ-lại → răng đỏ ghim 'than vong lap khong con buoc ve lai
      ban do o lan V' (đo CHỈ DẪN — known-limit khai ở contract).
    paths: [feature-loop/skills/feature-loop/SKILL.md, scripts/product-map.mjs, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E10
    criterion: AC-9
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan san-dem
    expected: >
      `LV_CASES=LVX node tests/plugins/lan-v.test.mjs` phải exit KHÁC 0 và in dòng
      nêu tên đã khai ('LV_CASES=LVX khong khop ca nao — go sai ten?'), cùng khuôn
      `only_matched` sẵn có cuối `tests/plugins/run-tests.sh`. Đối chứng dương cùng
      lượt: `LV_CASES=LV1` exit 0 và in đúng một dòng ca. Chiều đỏ: bản sao file ca
      gỡ sàn đếm → răng đỏ ghim 'san dem bien mat: LV_CASES sai ten van exit 0'.
    paths: [tests/plugins/lan-v.test.mjs, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E11
    criterion: AC-10
    executor: script
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan mot-chu
    expected: >
      Hai chuỗi khai đúng MỘT nơi: nhãn «cửa veto mở» và các câu `why` của
      `xanhSach`. Răng import hằng THẬT từ lib (không chép chuỗi vào mình), rồi so
      với `scripts/pre-merge-check.sh` và `commands/start.md`. Răng in 'MOT-CHU OK:
      <n> chuoi khai mot noi, <m> site doc lai'. Chiều đỏ cùng lượt: tiêm một chữ
      vào TỪNG site trên bản sao rồi chạy CHÍNH bộ so — nó phải kêu đúng site đó và
      chỉ site đó (không đo cú tiêm, đo bộ so).
    paths: [lib/evidence-core.cjs, scripts/pre-merge-check.sh, commands/start.md, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E12
    criterion: AC-11
    executor: script
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan ban-do
    expected: >
      Cây thật: `release-2-0-0` và `release-2-1-0` (bằng chứng sạch) nằm dưới
      '## Đã giao' kèm ' — cửa veto mở'; `release-2-2-0` (đã ký) dưới '## Đã giao'
      KHÔNG kèm chú thích; **hồ sơ NÀY** (Known limits có nội dung ⇒ chưa sạch) nằm
      ở cổng chờ chữ ký / '## Đang làm', KHÔNG phải «đã giao» — đây là đối chứng
      sống cho AC-5 trên cây thật. Máy quét thật khớp cùng kết luận. Răng in
      'BAN-DO OK: 2 sach da giao · 1 da ky · 1 chua sach van o cong · check exit 0'.
    paths: [scripts/product-map.mjs, scripts/start-scan.mjs, PRODUCT-MAP.md, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E13
    criterion: AC-1
    executor: test
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan mutant
    expected: >
      Mutant đi qua CHÍNH ca kiểm, đối chứng dương trên CÙNG CÁCH CHÉP (bản A không
      tiêm phải xanh trước; bản A không chạy được = ĐỎ riêng). BỐN đột biến, mỗi cái
      giết MỘT nhánh và ghim MỘT câu riêng — không phép so hai-vế: (1) nhánh V trong
      `product-map.mjs` → LV1 đỏ ghim 'ban do van xep'; (2) nhánh V trong
      `start-scan.mjs` → LV1 đỏ ghim 'van nam trong gates'; (3) nới điều kiện PASS
      trong `xanhSach` → LV7 đỏ ở ô REJECT với toạ độ ghim; (4) **trả vị từ về tiêu
      chí `veto_state` của vòng một** → LV3 đỏ ở cả bốn biến thể chưa-sạch. Marker
      vắng hoặc sed không đổi được dòng nào = ĐỎ riêng. Răng in 'MUTANT OK: 4 dot
      bien chay that, moi cai ghim MOT cau rieng'.
    paths: [lib/evidence-core.cjs, scripts/product-map.mjs, scripts/start-scan.mjs, tests/plugins/lan-v.test.mjs, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]

  - id: E14
    criterion: AC-7
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Trọn suite plugins xanh ('Results: all plugin tests passed'), gồm ĐÚNG 9 dòng
      'PASS: LV1'…'PASS: LV9' và 0 dòng 'FAIL: LV' — ca sống trong suite thường trực,
      không chỉ trong răng hồ sơ. Đây là lưới hồi quy: nó chứng minh harness còn
      sống, KHÔNG phải bằng chứng riêng cho hành vi làn V (ghi chú này để người đọc
      Cổng 2 không lấy dòng tổng kết suite làm bằng chứng thay E1–E13).
    paths: [tests/plugins/run-tests.sh, tests/plugins/lan-v.test.mjs]

  - id: E15
    criterion: AC-2
    executor: judgment
    question: >
      Ngả thi hành nào cho «một nguồn luật sáu-điều-kiện» giữ được bất biến
      một-nguồn của kit mà KHÔNG mở đường fail-open ở lưới trước-merge: (i) bash
      gọi lib qua node với suy biến FAIL-CLOSED khi thiếu node/lib, hay (ii) giữ hai
      bản dựng và ghim đẳng thức bằng răng E2?
    inputs: [contract.md, ../../scripts/pre-merge-check.sh, ../../lib/evidence-core.cjs]
    expected: >
      Hội đồng đọc cả hai ngả trên nguồn thật và phán: ngả đã chọn có giữ được
      «một nguồn» không, và hướng suy biến khi thiếu node/lib có thật sự là
      fail-CLOSED không (thiếu công cụ ⇒ coi như CHƯA sạch ⇒ vẫn đòi người). Trả
      lời phải trích dòng thật của `xanh_sach_check` và của bản vá đề xuất; nêu
      bằng-chứng-thiếu nếu chưa đủ căn cứ.

  - id: E16
    criterion: AC-12
    executor: script
    cmd: _acceptance/lan-v-khong-phai-cho-ky/rang.sh --chan cong-cu-vang
    expected: >
      Trụ an toàn của ngả (i) đo bằng MÁY, không bằng lời. Răng dựng bản sao cây
      + một hồ sơ fixture đúng-ra-là-SẠCH, rồi chạy CHÍNH `scripts/pre-merge-check.sh`
      ba lượt: (a) môi trường đủ → kết luận SẠCH (đối chứng dương; lượt này đỏ
      thì hai lượt sau vô nghĩa, răng dừng và báo riêng); (b) `PATH` không có
      `node` → cổng KHÔNG được kết luận sạch: VIOLATION hoặc exit 2, thông điệp
      nêu đúng lý do không đọc được nguồn luật; (c) `lib/evidence-core.cjs` bị
      dời khỏi bản sao → cùng đòi hỏi như (b). Răng in 'CONG-CU-VANG OK: fail-CLOSED
      ca hai chieu (thieu node · thieu lib), doi chung duong xanh'. Chiều đỏ cùng
      lượt: bản sao pre-merge bị tiêm nhánh «không đọc được ⇒ coi như sạch» →
      răng đỏ ghim 'fail-OPEN: thieu <node|lib> ma cong van cho qua'.
    paths: [scripts/pre-merge-check.sh, lib/evidence-core.cjs, _acceptance/lan-v-khong-phai-cho-ky/rang.sh]
