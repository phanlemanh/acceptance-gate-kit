    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/scripts/road-map-de-dung.test.mjs, tests/scripts/fixtures/lo-trinh/crm-onehub-1017/**, _acceptance/road-map-de-dung/mau/**]
