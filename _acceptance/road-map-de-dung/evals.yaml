      RD-10: M1 (mục tiêu D, 6 giờ máy) và M2 (D+5, độc lập) → bắt đầu M2 == hoàn tất M1; mốc không ngày đứng cuối; mốc ngoài
      không vào làn. RD-10-mot-moc: một mốc → dòng bằng bộ máy cũ v2.32.0 trừ nhãn «(máy chạy 24/24 — chưa đo nhịp ngày)».
      RD-10-hai-lo-trinh: hai lộ trình cùng kho, mỗi lộ trình một mốc độc lập → cả hai bắt đầu hôm nay. RD-10-do: bản sao giữ
