      · oneflow · kho không lo_trinh) — mọi dòng khác nhau giữa bộ máy mới và cũ (trang, khối dữ liệu, --xem) thuộc tập kỳ vọng
      tính độc lập từ dữ liệu kho; in kỳ vọng/thực tế từng kho; kho không lo_trinh 0 byte khác.
