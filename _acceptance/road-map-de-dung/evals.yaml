schema_version: 1
feature_slug: road-map-de-dung
# Ca đo sống ở tests/scripts/road-map-de-dung.test.mjs (ca RD-<n> = AC-n; đuôi .test.mjs nên cũng chạy trong mảnh mjs của
# suite) — khoá riêng executors.test.road_map_de_dung, mọi eval máy chung MỘT lệnh; ca Chrome AC-6 ở
# tests/scripts/xem-trang-lo-trinh.test.mjs (khoá lo_trinh_trang sẵn có). Kho thử do code sinh trong lượt (thư mục tạm,
# git init, commit ghim ngày, hôm nay ghim bằng ACCEPTANCE_TODAY = 2026-10-20 mặc định). Bản chụp crm onehub b74ec7eae
# (và 55811c635^ cho AC-8) do tests/scripts/lo-trinh-chup-crm.mjs sinh vào tests/scripts/fixtures/lo-trinh/crm-onehub-1017/.
# BỘ MÁY CŨ = git archive v2.32.0 scripts lib skills (trọn thư mục) bung trong lượt. Mỗi ca đỏ chạy CHÍNH hàm đo trên BẢN
# SAO của vật với nhát tiêm khớp ĐÚNG một lần (ca tự kiểm số lần khớp), SAU khi bản lành xanh trên cùng kho thử, và ghim
# thông điệp. Ca in đúng một dòng «PASS: RD-…» hoặc «FAIL: RD-… — <vì sao>»; mỗi eval ghim dòng PASS của chính nó — lệnh
# xanh mà thiếu dòng ghim là ĐỎ. Mọi đường dẫn suy từ vị trí tệp ca.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [scripts/cat-luot.mjs, scripts/lo-trinh.mjs, tests/scripts/road-map-de-dung.test.mjs]
    expected: >
      exit 0; stdout có "PASS: RD-1", "PASS: RD-1-do", "PASS: RD-1-do2". RD-1: ma trận chín ca viết sẵn (mã chỉ ở mốc ngoài →
      thoát 1, một dòng `[moc-ngoai-da-bo]` nêu bốn đích + «không ở chỗ nào» cho mã ấy · mã ở mốc ngoài và ở da_bac → thoát 0,
      bảng phủ «→ không làm trong kho» · da_bac khác đợt → không tính phủ · phu chuỗi → lỗi nêu da_bac · da_bac thiếu ly_do → lỗi · da_bac
      và một hàng → «ở hai chỗ» · mốc ngoài ngoài đợt → một dòng gom cảnh báo, thoát 0 · hàng dung_tren mốc ngoài →
      `[cho-van-hanh]` · phat-hanh mang phu → lỗi) mỗi ca đúng mã thoát + dòng ghim; in «9/9 ca»; CO_TEN không có
      van-hanh-lap-chua-tu-phuc-vu. RD-1-do: bản sao vẫn tính phủ cho mốc ngoài → FAIL ghim «mã tính phủ ở mốc ngoài». RD-1-do2:
      bản sao không đọc da_bac làm chỗ phủ → FAIL ghim «không làm trong kho không phải chỗ phủ».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [scripts/lo-trinh.mjs, scripts/gio-may.mjs, scripts/product-map.mjs, tests/scripts/road-map-de-dung.test.mjs, tests/scripts/fixtures/lo-trinh/crm-onehub-1017/**]
    expected: >
      exit 0; stdout có "PASS: RD-2", "PASS: RD-2-im", "PASS: RD-2-crm", "PASS: RD-2-do". RD-2: F (hai mốc ngoài, một gắn hàng)
      và F′ (bỏ đúng hai mốc) — trang, khối dữ liệu, --xem, thẻ khởi động của F bằng của F′ trừ ĐÚNG một dòng «2 mốc là việc
      của người — trang không vẽ nữa (luật 17/10): <hai nhãn>»; mã thoát bằng nhau; khối dữ liệu F không có mốc nào mang tên
      hai mốc ngoài; «Giờ máy theo mốc» không dòng mốc ngoài. RD-2-im: tệp không mốc ngoài → 0 dòng cờ ấy. RD-2-crm: trang bản
      chụp onehub — OKR 11 mốc (28 − 17), Kho tài liệu 5 (6 − 1), số tính từ tệp in ra. RD-2-do: bản sao vẫn vẽ mốc ngoài →
      FAIL ghim «mốc ngoài còn trên trang».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [skills/cat-luot/SKILL.md, skills/acceptance/references/lo-trinh-template.json, skills/acceptance/references/pham-vi-template.md, CONTEXT.md, docs/adr/0026-*.md, scripts/cat-luot.mjs, tests/scripts/road-map-de-dung.test.mjs]
    expected: >
      exit 0; stdout có "PASS: RD-3", "PASS: RD-3-trang", "PASS: RD-3-do". RD-3: khối CAT-LUOT-VAN-HANH chứa đủ bốn đích (ngay
      của mốc + ly_do ở da_bac · opportunity.md + observed · da_bac · chan_troi + mo_lai_khi) và không chứa «loai: ngoai» như
      đích; tập tên ở CAT-LUOT-BANG-CO BẰNG CO_TEN; khuôn lộ trình 0 mốc loai ngoai, ≥ 1 da_bac có dot + phu + ly_do; khối
      CAT-LUOT-RANG chạy NGUYÊN VĂN (AG = gốc kit) trên khuôn + bản phạm vi mẫu → thoát 0, 0 «lỗi:», 0 «cảnh báo:», ≥ 1 dòng
      «→ không làm trong kho»; RD-3-trang: trang vẽ từ khuôn có tiêu đề «Không làm trong kho» và mỗi ly_do của da_bac là chữ
      nhìn thấy; CONTEXT.md mục «Mốc ngoài» có chữ «đã bỏ» và trỏ ADR 0026; tệp ADR 0026 có câu «mất chỗ chung xem ngày của
      người». RD-3-do: bản sao khuôn giữ mốc V1 loai ngoai → FAIL ghim «khuôn còn mốc ngoài: V1».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: judgment
    inputs:
      - skills/cat-luot/SKILL.md
      - skills/acceptance/references/lo-trinh-template.json
      - _acceptance/road-map-de-dung/mau/pham-vi-crm.md
      - _acceptance/road-map-de-dung/mau/dap-an.json
    question: >
      Chỉ dùng bốn tệp trong inputs. `dap-an.json` là cách cắt ĐÚNG bản phạm vi mẫu `pham-vi-crm.md` (dựng từ việc của người
      thật trên lộ trình crm) theo luật mới «bỏ mốc ngoài». Câu hỏi không phải đáp án có đúng không, mà SKILL cắt lượt có DẪN
      một phiên cắt tới đáp án ấy không. Với TỪNG mã của bản phạm vi: nêu chỗ của mã trong đáp án (hàng · chờ điều kiện · đã
      bác, kèm ngay + vi_sao của mốc nhận hạn · ngưỡng trong ô cơ hội · mo_lai_khi · tu_phuc_vu nếu có) và trích bước hoặc
      khối của SKILL buộc phiên cắt đặt mã ấy đúng chỗ đó. Mã FAIL khi SKILL im lặng, nước đôi (hai chỗ đều hợp luật), hay
      dẫn tới một mốc `loai: ngoai`. PASS khi mọi mã có trích dẫn quyết được chỗ của nó.
    evidence_required: [run_id, verdict, proposals]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/scripts/road-map-de-dung.test.mjs, tests/scripts/fixtures/lo-trinh/crm-onehub-1017/**]
    expected: >
      exit 0; stdout có "PASS: RD-5", "PASS: RD-5-kho-thu", "PASS: RD-5-cu-do", "PASS: RD-5-ten-ngan", "PASS: RD-5-ten-ngan-im",
      "PASS: RD-5-do". RD-5: bộ đọc máy rút chữ nhìn thấy khối Mốc trang bản chụp onehub (bỏ thẻ, thuộc tính, nội dung details
      đóng); mỗi mốc còn việc: «còn k/n việc» đúng số, mỗi việc chưa giao một dòng «<tên> — <trạng thái>» với tên = tenNganHang,
      trạng thái = chữ ô Trạng thái cùng lần vẽ, mã đứng sau tên; details mở chứa câu giao + slug khi có; in «<n>/<n> ô so,
      n tính từ tệp». RD-5-kho-thu: cùng phép đo trên kho thử năm trạng thái. RD-5-cu-do: CHÍNH bộ đọc trên trang bộ máy cũ
      v2.32.0 cùng bản chụp → FAIL nêu tên ≥ 1 mốc (ca PASS khi bộ đọc báo hỏng — chiều đỏ của thước, sau khi bản mới xanh).
      RD-5-ten-ngan: Kho tài liệu → đúng một dòng «11 việc chưa có tên ngắn — …» ở Cần sửa. RD-5-ten-ngan-im: OKR (đủ tên) →
      0 dòng ấy. RD-5-do: bản sao in mã trước tên → FAIL ghim «mã đứng trước tên».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lo_trinh_trang
    paths: [scripts/lo-trinh.mjs, tests/scripts/xem-trang-lo-trinh.test.mjs, tests/scripts/lo-trinh-do-trang.mjs]
    expected: >
      exit 0; stdout có "PASS: LTT-ten", "PASS: LTT-ten-do", "PASS: LTT-san". LTT-ten: Chrome thật, khổ 1280 và 375, sáng và
      tối — mọi summary dòng việc cao ≥ 44px, tương phản chữ tên và trạng thái ≥ 4,5 : 1, scrollWidth ≤ innerWidth ở 375.
      LTT-san (sẵn có) vẫn xanh: trang kho thử ≤ 1/3 trang 2.21.0. LTT-ten-do: bản sao bỏ min-height của summary → FAIL ghim
      «vùng chạm < 44px».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: judgment
    inputs:
      - _acceptance/road-map-de-dung/mau/trang-moi.txt
      - _acceptance/road-map-de-dung/mau/cau-hoi-trang.md
      - _acceptance/road-map-de-dung/mau/dap-an-trang.json
    question: >
      Chỉ dùng ba tệp trong inputs. `trang-moi.txt` là chữ nhìn thấy của khối Mốc trên trang lộ trình crm vẽ bằng bản kit mới
      (máy xuất). Trước tiên, CHỈ đọc `trang-moi.txt` và trả lời ba câu trong `cau-hoi-trang.md` («mốc X còn làm những gì,
      xong chưa») bằng tên việc và trạng thái; rồi mới mở `dap-an-trang.json` để so. PASS khi cả ba câu trả lời khớp đáp án
      (đủ việc, đúng trạng thái) và một người không biết mã việc đọc được trong khoảng một phút. FAIL khi phải đoán nghĩa của
      mã, thiếu việc, hay trạng thái không đọc ra được.
    evidence_required: [run_id, verdict, proposals]
