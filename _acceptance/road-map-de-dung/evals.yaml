      RD-9-crm: bản chụp onehub — mỗi mốc đã qua ngày chưa khép rơi vào ĐÚNG một dòng (gom mốc ngoài AC-2 hoặc gom AC-9), in
      bảng gán; tập rỗng → FAIL. RD-9-do: bản sao bỏ điều kiện «không that» → FAIL ghim «mốc đã khép vẫn bị báo».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
