<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Phạm vi hai câu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tiêu đề trong hình (để PNG mang theo) -->
      <text x="20" y="32" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CỔNG PHẠM VI · ROAD-MAP-DE-DUNG</text>
      <text x="20" y="64" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Lora', serif">Hai câu hỏi cho chủ kho</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <line x1="128" y1="208" x2="128" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="376" y1="208" x2="376" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="208" x2="624" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="872" y1="208" x2="872" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Hỏi-1 ===== -->
      <text x="20" y="100" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-1</text>
      <rect x="20" y="112" width="464" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ba việc CỘNG sang vòng RD2 — duyệt trước mục nào?</text>
      <text x="252" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">E1 · lệnh xem đưa đường dẫn trang</text>
      <text x="252" y="176" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">E2 · Rà soát + Giờ máy lên trang</text>
      <text x="252" y="192" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">E3 · road-map mặc định</text>

      <!-- Hỏi-1 · máy khuyên -->
      <rect x="20" y="240" width="216" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="20" y="240" width="216" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="32" y="252" width="84" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="74" y="264" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <text x="36" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">E sang vòng RD2</text>
      <text x="36" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Duyệt trước E1 + E2</text>
      <text x="36" y="340" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">E3 đổi thành «đề nghị bật khi</text>
      <text x="36" y="356" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">kho khai lộ trình»</text>
      <text x="36" y="376" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Giữ ADR 0025</text>

      <!-- Hỏi-1 · lối khác -->
      <rect x="268" y="240" width="216" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="280" y="252" width="68" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="314" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>
      <text x="284" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Gộp E vào RD1</text>
      <text x="284" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Hợp đồng 13+ tiêu chí phải tách</text>
      <text x="284" y="340" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">+~1 ngày máy</text>
      <text x="284" y="360" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">E3 cần ADR lật ADR 0025</text>

      <!-- ===== Hỏi-2 ===== -->
      <text x="516" y="100" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỎI-2</text>
      <rect x="516" y="112" width="464" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="748" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tiêu đề mục <tspan font-family="'Geist Mono', monospace" font-weight="500">da_bac</tspan> trên trang</text>
      <text x="748" y="172" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dùng khối sẵn có hay thêm khoá mới?</text>

      <!-- Hỏi-2 · máy khuyên -->
      <rect x="516" y="240" width="216" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="516" y="240" width="216" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="528" y="252" width="84" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="570" y="264" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <rect x="680" y="252" width="40" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="700" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRỪ</text>
      <text x="532" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Dùng <tspan font-family="'Geist Mono', monospace" font-weight="500">da_bac</tspan> sẵn có</text>
      <text x="532" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Tiêu đề «Không làm trong kho»</text>
      <text x="532" y="340" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Mỗi mục kèm lý do</text>

      <!-- Hỏi-2 · lối khác -->
      <rect x="764" y="240" width="216" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="776" y="252" width="68" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="810" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>
      <rect x="920" y="252" width="48" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="944" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CỘNG</text>
      <text x="780" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Khoá mới <tspan font-family="'Geist Mono', monospace" font-weight="500">ra_khoi_kho</tspan></text>
      <text x="780" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Mọi kho học khoá mới</text>

      <!-- Chú giải -->
      <line x1="20" y1="432" x2="980" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="20" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="120" y="448" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="152" y="458" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ngả máy khuyên</text>
      <rect x="264" y="448" width="24" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="296" y="458" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>
      <text x="380" y="458" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRỪ · CỘNG</text>
      <text x="448" y="458" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">loại thay đổi của lối</text>
    </svg>
  </div>
</body>
</html>
