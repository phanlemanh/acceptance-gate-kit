<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lối ra ở thẻ Cổng Bằng chứng chưa ký được</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · loi-moi-tran-luot-loi-song-co-gia · nguồn: design §4.1 §4.4 · contract AC-1…AC-6</p>
    <h1>Lối ra ở thẻ Cổng Bằng chứng chưa ký được</h1>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Khối «Lối ra» — nền vẽ trước, đường nối đi qua biên -->
      <rect x="120" y="412" width="760" height="284" rx="8" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <text x="136" y="436" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LỐI RA — KHỐI MÁY SINH TRÊN THẺ</text>

      <!-- Đường nối (vẽ trước nút) -->
      <!-- Bắt đầu → D1 -->
      <line x1="500" y1="88" x2="500" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 CÓ → máy tự chấm lại -->
      <line x1="620" y1="164" x2="740" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 KHÔNG → D2 -->
      <line x1="500" y1="212" x2="500" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 KHÔNG → thẻ giữ nguyên -->
      <line x1="640" y1="308" x2="740" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 CÓ → D3 (vào khối) -->
      <line x1="500" y1="372" x2="500" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 CÓ LẶP → lối 1 (khuyến nghị) -->
      <path d="M404,484 H264 a8,8 0 0 0 -8,8 V560" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <!-- D3 KHÔNG LẶP → lối 2 (khuyến nghị) -->
      <line x1="500" y1="524" x2="500" y2="560" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Nhãn đường nối -->
      <rect x="668" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÓ</text>

      <rect x="508" y="222" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KHÔNG</text>

      <rect x="664" y="288" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG</text>

      <rect x="508" y="386" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="395" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CÓ</text>

      <rect x="300" y="464" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="473" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÓ LẶP</text>

      <rect x="508" y="536" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="545" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KHÔNG LẶP</text>

      <!-- Bắt đầu: thẻ chưa ký được -->
      <rect x="380" y="32" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ Cổng Bằng chứng CHƯA ký được</text>
      <text x="500" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verdict REJECT / BLOCKED</text>

      <!-- D1: trạng thái loại trừ -->
      <polygon points="500,116 620,164 500,212 380,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="160" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trạng thái: thước lệch,</text>
      <text x="500" y="174" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cây đổi hay chết lần đầu?</text>

      <!-- Kết: máy tự chấm lại -->
      <rect x="740" y="136" width="224" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="852" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy tự chấm lại</text>
      <text x="852" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không lời mời · AC-3</text>

      <!-- D2: điều kiện mở khối -->
      <polygon points="500,244 640,308 500,372 360,308" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="292" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt cuối ≥ 3?</text>
      <text x="500" y="306" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">hoặc</text>
      <text x="500" y="320" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">một eval chưa đạt ở lượt cuối</text>
      <text x="500" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">và ở ≥ 1 lượt trước?</text>
      <text x="348" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-2 (trần)</text>
      <text x="348" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-1 (lặp)</text>

      <!-- Kết: thẻ giữ nguyên -->
      <rect x="740" y="272" width="224" height="72" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="852" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ giữ nguyên</text>
      <text x="852" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không cần làm gì — quay lại sửa code</text>
      <text x="852" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bằng từng byte bản cũ · AC-6</text>

      <!-- D3: khuyến nghị tất định -->
      <polygon points="500,444 596,484 500,524 404,484" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="488" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có eval lặp?</text>
      <text x="608" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">máy khuyên · AC-4</text>

      <!-- Lối 1: thu phạm vi -->
      <rect x="144" y="560" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Thu phạm vi</text>
      <text x="256" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đưa AC ra Known limits có tên</text>
      <text x="256" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ ký lại Cổng Phạm vi</text>
      <text x="256" y="640" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giá: một chạm · AC ấy không có chứng máy</text>

      <!-- Lối 2: thêm một lượt -->
      <rect x="388" y="560" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Sửa rồi chấm thêm một lượt</text>
      <text x="500" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phút máy = thuoc-vat − round-tally</text>
      <text x="500" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thiếu một vế → «chưa đo» · AC-5</text>
      <text x="500" y="640" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giá: ≈ N phút máy · «vượt trần 3 lượt»</text>

      <!-- Lối 3: dừng vòng -->
      <rect x="632" y="560" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Dừng vòng</text>
      <text x="744" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giữ nhánh và hồ sơ</text>
      <text x="744" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lối cố định, không khuyên</text>
      <text x="744" y="640" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giá: không ship · quay lại được</text>

      <!-- Dòng cố định: không có lối ký -->
      <text x="144" y="680" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KHÔNG CÓ LỐI KÝ — báo cáo REJECT / BLOCKED không ký được · đúng ba mã, không chữ mời ký · AC-3</text>

      <!-- Chú giải -->
      <line x1="40" y1="716" x2="960" y2="716" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="732" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH MANG LOẠI</text>

      <rect x="40" y="744" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đầu / cuối</text>

      <rect x="180" y="744" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối ra (bước)</text>

      <polygon points="332,750 344,744 356,750 344,756" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điều kiện máy đọc từ sổ chạy</text>

      <rect x="560" y="744" width="24" height="12" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <text x="592" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Khối in trên thẻ</text>

      <line x1="716" y1="750" x2="744" y2="750" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="752" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Máy khuyên (tất định)</text>

      <line x1="892" y1="750" x2="920" y2="750" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="928" y="754" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh</text>
    </svg>
  </div>
</body>
</html>
