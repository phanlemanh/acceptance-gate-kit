<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 ba lối</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · Cổng Phạm vi</p>
    <h1>Hỏi-1: cờ --require-measured và mã thoát 5, phê hay không?</h1>

    <svg viewBox="0 0 1080 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cây quyết định ngang: một gốc, ba nhánh A, B, C; nhánh A là khuyến nghị">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first. Gốc -> A/B/C (rounded orthogonal elbows, fanned attach points) -->

      <path d="M264 256 H320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M264 288 H284 Q292 288 292 296 V408 Q292 416 300 416 H320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Option -> outcome -->
      <path d="M560 96 H624" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M560 256 H624" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M560 416 H624" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- GỐC -->
      <rect x="24" y="180" width="240" height="152" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="180" width="240" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="40" y="200" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GỐC</text>
      <text x="40" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Eval gọi design-gate trên .tsx</text>
      <text x="40" y="248" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Hôm nay: <tspan fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">KHONG-DO-DUOC</tspan> mà mã 0</text>
      <text x="40" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">→ xanh rỗng</text>
      <text x="40" y="292" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">crm 61 eval</text>
      <text x="40" y="308" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">artifact-platform 23 khoá dom</text>

      <!-- NHÁNH A (khuyến nghị, focal) -->
      <rect x="320" y="52" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="52" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="332" y="60" width="104" height="16" rx="2" fill="transparent" stroke="rgba(186,69,19,0.45)" stroke-width="0.8"/>
      <text x="384" y="72" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A · KHUYẾN NGHỊ</text>
      <text x="332" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Phê cờ <tspan font-size="10" font-weight="500" font-family="'Geist Mono', monospace">--require-measured</tspan> · mã 5</text>

      <rect x="624" y="40" width="432" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="40" width="432" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="60" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỆ QUẢ</text>
      <text x="640" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">không kho nào đổi màu khi nhận bản</text>
      <line x1="640" y1="88" x2="1040" y2="88" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="640" y="104" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KẾT CỤC</text>
      <text x="640" y="120" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">kho tự thêm cờ khi muốn chặn: crm 57 eval đỏ</text>
      <text x="640" y="136" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">(mã 1 qua vòng <tspan font-size="10" font-family="'Geist Mono', monospace">|| exit 1</tspan>)</text>

      <!-- NHÁNH B -->
      <rect x="320" y="212" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="212" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="332" y="220" width="28" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="346" y="232" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B</text>
      <text x="332" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Không phê — kho tự đọc</text>
      <text x="332" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"><tspan font-size="10" font-weight="500" font-family="'Geist Mono', monospace">do_duoc</tspan> (bậc 1)</text>

      <rect x="624" y="200" width="432" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="200" width="432" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="220" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỆ QUẢ</text>
      <text x="640" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">kit 0 dòng</text>
      <line x1="640" y1="248" x2="1040" y2="248" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="640" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KẾT CỤC</text>
      <text x="640" y="280" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">mỗi kho tự viết bộ đọc JSON bọc lệnh</text>

      <!-- NHÁNH C -->
      <rect x="320" y="372" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="372" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="332" y="380" width="28" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="346" y="392" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">C</text>
      <text x="332" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Đổi mặc định</text>

      <rect x="624" y="360" width="432" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="360" width="432" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="380" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỆ QUẢ</text>
      <text x="640" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">mọi kho đổi màu ở lượt ghim kế</text>
      <line x1="640" y1="408" x2="1040" y2="408" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="640" y="424" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KẾT CỤC</text>
      <text x="640" y="440" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">crm 57 eval + artifact-platform 23 khoá</text>
      <text x="640" y="456" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">đỏ cùng lúc</text>

      <!-- Legend strip -->
      <line x1="24" y1="496" x2="1056" y2="496" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="520" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="96" y="510" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="124" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHUYẾN NGHỊ</text>
      <rect x="232" y="510" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PHƯƠNG ÁN · HỆ QUẢ</text>
      <text x="1056" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC LIÊN QUAN: AC-1 · AC-4 · AC-5 · AC-8</text>
    </svg>
  </div>
</body>
</html>
