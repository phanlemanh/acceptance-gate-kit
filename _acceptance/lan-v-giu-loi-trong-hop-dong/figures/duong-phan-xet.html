<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường phán xét</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .frame { max-width: 920px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.6;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.4;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lưu đồ · Thẻ duyệt</p>
    <h1>Đường phán xét</h1>

    <div class="scroll">
    <svg viewBox="0 0 920 868" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lưu đồ phán xét một hồ sơ T2 đã đạt mà chưa có chữ ký người">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors, drawn before the nodes -->
      <line x1="460" y1="104" x2="460" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="232" x2="720" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 308 232 H 164 Q 156 232 156 240 V 368 Q 156 376 164 376 H 460" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="460" y1="312" x2="460" y2="376" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="460" y1="376" x2="460" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="308" y1="504" x2="200" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="504" x2="720" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="584" x2="460" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels -->
      <g font-family="'Geist', sans-serif" font-size="12" font-weight="500" fill="#4f5d75">
        <rect x="620" y="184" width="96" height="40" rx="2" fill="#f5f5f5"/>
        <text x="668" y="204" text-anchor="middle">Có, và PR</text>
        <text x="668" y="220" text-anchor="middle">không đổi hồ sơ</text>

        <rect x="168" y="204" width="128" height="20" rx="2" fill="#f5f5f5"/>
        <text x="232" y="220" text-anchor="middle">Có, và PR đổi hồ sơ</text>

        <rect x="468" y="332" width="40" height="20" rx="2" fill="#f5f5f5"/>
        <text x="472" y="348">Chưa</text>

        <rect x="212" y="476" width="84" height="20" rx="2" fill="#f5f5f5"/>
        <text x="252" y="492" text-anchor="middle">Không có lỗi</text>

        <rect x="620" y="456" width="96" height="40" rx="2" fill="#f5f5f5"/>
        <text x="668" y="476" text-anchor="middle">Có chữ mà máy</text>
        <text x="668" y="492" text-anchor="middle">không đọc được</text>

        <rect x="468" y="604" width="156" height="20" rx="2" fill="#f5f5f5"/>
        <text x="472" y="620">Có lỗi, ở bất kỳ mức nào</text>
      </g>

      <!-- Merge point -->
      <circle cx="460" cy="376" r="4" fill="#2d3142"/>

      <g font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">
        <!-- Entry -->
        <rect x="300" y="40" width="320" height="64" rx="32" fill="#f5f5f5"/>
        <rect x="300" y="40" width="320" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="460" y="68">Hồ sơ T2 có phán quyết đạt,</text>
        <text x="460" y="88">chưa có chữ ký người</text>

        <!-- Decision 1 -->
        <polygon points="460,152 612,232 460,312 308,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="228">Máy đã thông qua</text>
        <text x="460" y="248">hồ sơ này từ trước?</text>

        <!-- Outcome: not reviewed again -->
        <rect x="720" y="184" width="160" height="96" rx="48" fill="#f5f5f5"/>
        <rect x="720" y="184" width="160" height="96" rx="48" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="772" y="196" width="56" height="20" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="800" y="210" fill="#ba4513" font-size="12" font-weight="500" font-family="'Geist Mono', monospace">Hỏi-2</text>
        <text x="800" y="240">Không xét lại,</text>
        <text x="800" y="260">đi tiếp</text>

        <!-- Decision 2 -->
        <polygon points="460,424 612,504 460,584 308,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="500">Mục lỗi trong</text>
        <text x="460" y="520">hợp đồng nói gì?</text>

        <!-- Outcome: no errors -->
        <rect x="40" y="464" width="160" height="80" rx="40" fill="#f5f5f5"/>
        <rect x="40" y="464" width="160" height="80" rx="40" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="500">Đi tiếp</text>
        <text x="120" y="520">không cần ký</text>

        <!-- Outcome: unreadable -->
        <rect x="720" y="464" width="160" height="80" rx="40" fill="#f5f5f5"/>
        <rect x="720" y="464" width="160" height="80" rx="40" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="500">Giữ lại,</text>
        <text x="800" y="520">người soi</text>

        <!-- Outcome: errors present -->
        <rect x="300" y="648" width="320" height="88" rx="44" fill="#f5f5f5"/>
        <rect x="300" y="648" width="320" height="88" rx="44" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="432" y="660" width="56" height="20" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="460" y="674" fill="#ba4513" font-size="12" font-weight="500" font-family="'Geist Mono', monospace">Hỏi-1</text>
        <text x="460" y="708">Giữ lại, người phải đọc và ký</text>
      </g>

      <!-- Footnote -->
      <line x1="40" y1="768" x2="880" y2="768" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="800" fill="#2d3142" font-size="16" font-weight="500" font-family="'Geist', sans-serif">Hồ sơ đã có chữ ký người không đi qua sơ đồ này</text>
      <text x="40" y="828" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">AC liên quan: AC-1, AC-3, AC-4, AC-5, AC-6</text>
    </svg>
    </div>
  </div>
</body>
</html>
