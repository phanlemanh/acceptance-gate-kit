# evals — release-2-26-0
# Không có bộ răng riêng (nếp từ 2.2.0 → 2.25.0, luật «mốc phát hành KHÔNG dựng răng»): thứ cần
# canh ở mọi lần cắt số là ca vĩnh viễn P200 (vùng 3 của suite plugins) — mọi số đọc TỪ manifest,
# 5 đột biến + đối chứng dương, MỘT lối thoát. AC-4 và AC-5 đo bằng lệnh git, không dựng script
# mới. Mọi eval trỏ KHOÁ MẢNH (hồ sơ ha-tang-khong-dot-luot, Known limit Ngoài-1). E1/E2/E6 chấm
# MÃ THOÁT của vùng 3 — không hứa dòng P200 trong bằng chứng: workflow lượt chấm cắt đầu ra lệnh
# xanh (240 ký tự mỗi dòng, ba dòng cuối), ba mốc 2.22 → 2.25 thử đưa dòng vào và đều hụt (Out of scope).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vùng 3 của suite plugins xanh, nên ca P200 (cùng vùng) xanh: hai plugin cùng số 2.26.0,
      ba số hợp semver (2.26.0 · 2.26.0 · 2.7.1), đọc từ manifest. Chiều đỏ sống trong chính P200 (5 đột
      biến + đối chứng dương trên bản sao nguyên vẹn); P200 đỏ thì vùng 3 thoát khác 0.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
