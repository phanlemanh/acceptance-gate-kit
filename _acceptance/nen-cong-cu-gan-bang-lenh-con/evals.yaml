schema_version: 1
feature_slug: nen-cong-cu-gan-bang-lenh-con
# Khuôn như hồ sơ nen-cong-cu-lenh-shell: mọi eval chạy CHUNG một lệnh (bộ chạy dedupe),
# lệnh ghim dòng PASS của đúng các ca gọi tên — phán quyết không lấy từ mã thoát trọn
# suite. Mọi ca dùng fixture lành của NEN0 (code sinh trong lượt, đường dẫn suy từ vị
# trí tệp ca), mỗi ca đổi đúng một biến: thêm khoá executor ở nhóm `script` NGOÀI
# `feature_loop.suite_keys`, nên chân suite không chạy chuỗi lệnh đang đo.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN-LC1. Ca kiểm trước tiên (a) sha256 của giá trị YAML thô
      hằng trong tệp ca == 652e6eccb66fa661478ede817b496b72cae36638e024bff9da48fb6165d64379
      (dòng `zqw_giu_nqz:` của crm@onehub 64d7c593) và (b) round-trip: `resolveConfigKey`
      trả đúng chuỗi mong đợi — hỏng → ca đỏ với «fixture khong round-trip». Lượt chạy có
      HAI khoá ngoài suite: `executors.script.lc` (chuỗi crm) và khoá đối chứng
      `executors.script.lc_doi_chung` = `${X_KHONG_CO:-git} --version`. Đối chứng dương
      của bộ dò: stderr có ĐÚNG 1 dòng bỏ-tra cho khoá đối chứng, nguyên văn
      `cong-cu: bo qua executors.script.lc_doi_chung — tu dau «${X_KHONG_CO:-git}» dung cu
      phap shell, khong phai ten chuong trinh`. Rồi: mã 0, chân cong_cu xanh, 0 bullet
      `nen cong-cu:`, và 0 dòng bỏ-tra mang khoá `executors.script.lc`. Chiều đỏ: trên
      bản chưa vá ca này ĐỎ với bullet `THIEU merge-base` — đo ở S3 trước commit vá, ghi sổ.
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs, tests/scripts/duong-nen-fixture.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN-LC2 — CÙNG fixture của LC1, khoá `executors.script.lc`
      mang `khong-co-that --x`: chân cong_cu ĐỎ, mã 1, bullet đúng nguyên văn
      `nen cong-cu: THIEU khong-co-that (khoa executors.script.lc)` và không bullet
      cong-cu nào khác. Cặp với LC1: một bản vá tắt tra cho mọi khoá (hoặc cho mọi từ đầu
      không phải tên trần) không qua được cặp này. Chiều nhạy trên lệnh CÓ phép gán nằm ở
      bốn khoá thiếu của NEN-LC3.
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN-LC3 — một lượt, 8 khoá nhóm `script` + khoá đối chứng,
      round-trip từng khoá trước. Sáu khoá của AC-3, nguyên văn:
      lc_tran_co `B=$(git rev-parse HEAD) && echo "$B"` ·
      lc_nhay_co `B="$(git rev-parse "HEAD")" && echo "$B"` ·
      lc_huyen_co `` B=`git rev-parse HEAD`; echo $B `` ·
      lc_tran_thieu `B=$(khong-co-that-lc1 --x) && echo "$B"` ·
      lc_nhay_thieu `B="$(khong-co-that-lc2 "--x")" && echo "$B"` ·
      lc_huyen_thieu `` B=`khong-co-that-lc3 --x`; echo $B ``.
      Ba khoá `_co` không bullet; ba khoá `_thieu` mỗi khoá đúng một bullet
      `nen cong-cu: THIEU khong-co-that-lcN (khoa executors.script.lc_<dạng>_thieu)`.
      Trên bản chưa vá: `rev-parse`, `&&`, `rev-parse`, `--x`… bị gọi tên thay — ca đỏ.
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN-LC3 — hai khoá của AC-4 trong cùng ma trận, nguyên văn:
      lc_gan_co `A=1; git --version` (im) · lc_gan_thieu `A=1 && khong-co-that-lc4 --x`
      (đúng một bullet `nen cong-cu: THIEU khong-co-that-lc4 (khoa
      executors.script.lc_gan_thieu)`). Trên bản chưa vá hai khoá gọi tên `git`/`&&`.
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN-LC3 — so BẰNG NHAU: tập bullet `nen cong-cu:` (đã sắp)
      của lượt == 4 dòng mong đợi (lc1…lc4, đã sắp), số phần tử == 4; ma trận khai rỗng →
      ca đỏ. Bộ dò bỏ-tra: đúng 1 dòng nguyên văn cho `lc_doi_chung` (đối chứng dương) và 0
      dòng mang bất kỳ khoá nào trong 8 khoá. Thừa/thiếu một bullet hay một khoá rơi vào
      nhánh bỏ-tra đều làm ca đỏ với tập thực tế in ra.
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ncl_lenh_con
    expected: >
      Exit 0 và dòng PASS của NEN0, NEN1, NEN-TD1, NEN-TD2, NEN-TD3, NEN-TD4, NEN-TD5,
      NEN-TD6 — các ca của vòng nen-cong-cu-lenh-shell vẫn sống, gồm hai ca đột biến
      (gỡ luật `tenChuongTrinh` thì chuỗi `${…:-$(…)}` phải đỏ trở lại).
    paths: [feature-loop/scripts/duong-nen.mjs, tests/scripts/duong-nen.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
