<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 — hai lối khi bộ quét lỗi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · quet-het-han-khong-moi-ky · AC-1 · AC-2 · AC-5</p>
    <h1>Bộ quét lỗi thì thẻ hồ sơ máy-thông đi lối nào?</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <!-- Start → diamond -->
      <line x1="204" y1="224" x2="240" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond top: kịp, có cổng → kiểm sáu điều kiện -->
      <path d="M340 168 V96 Q340 88 348 88 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond right: không kịp → fork -->
      <line x1="440" y1="224" x2="580" y2="224" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- Fork → A (khuyến nghị) -->
      <path d="M580 224 V188 Q580 180 588 180 H660" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Fork → B -->
      <path d="M580 224 V276 Q580 284 588 284 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond bottom: kịp, kho chưa dựng cổng → lối cũ -->
      <path d="M340 280 V392 Q340 400 348 400 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (masked, gap above line) ===== -->
      <rect x="452" y="64" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="73" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KỊP · ĐÃ DỰNG CỔNG</text>

      <rect x="472" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHÔNG</text>
      <rect x="444" y="232" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="241" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hết hạn · ngắt · thoát lỗi</text>

      <rect x="584" y="160" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="169" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">A · KHUYẾN NGHỊ</text>

      <rect x="612" y="264" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="622" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B</text>

      <rect x="436" y="376" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KỊP · KHO CHƯA DỰNG CỔNG</text>

      <!-- Fork dot + Hỏi-1 tag -->
      <circle cx="580" cy="224" r="4" fill="#2d3142"/>
      <text x="592" y="228" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">HỎI-1 · NGƯỜI CHỌN</text>

      <!-- ===== Nodes ===== -->
      <!-- Start oval -->
      <rect x="24" y="200" width="180" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="24" y="200" width="180" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="114" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dựng thẻ hồ sơ máy-thông</text>

      <!-- Diamond -->
      <polygon points="340,168 440,224 340,280 240,224" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="222" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ quét trả lời</text>
      <text x="340" y="236" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kịp?</text>

      <!-- End: đã kiểm -->
      <rect x="660" y="60" width="300" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="660" y="60" width="300" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="810" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi tiếp hay kéo lại</text>
      <text x="810" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đã kiểm sáu điều kiện</text>

      <!-- End A (focal) -->
      <rect x="660" y="148" width="300" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="660" y="148" width="300" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="810" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi tiếp hay kéo lại + cờ vàng</text>
      <text x="810" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cờ ghi lý do + lệnh chạy lại</text>

      <!-- End B -->
      <rect x="660" y="252" width="300" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="660" y="252" width="300" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="810" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không ô quyết: chưa trình được</text>
      <text x="810" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ lệnh chạy lại</text>
      <!-- Cost of B -->
      <text x="810" y="340" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Giá: thẻ cửa veto vô dụng tới khi chạy lại</text>

      <!-- End: lối cũ (không đổi) -->
      <rect x="660" y="372" width="300" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="660" y="372" width="300" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="810" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giữ lối mời ký cũ</text>
      <text x="810" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ cờ «chưa ai kiểm» · không đổi</text>

      <!-- ===== Legend ===== -->
      <line x1="24" y1="460" x2="976" y2="460" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="488" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="56" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm bắt đầu / kết cục của thẻ</text>

      <polygon points="232,494 244,488 256,494 244,500" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Máy rẽ nhánh</text>

      <circle cx="372" cy="494" r="4" fill="#2d3142"/>
      <text x="384" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chỗ người chọn (Hỏi-1)</text>

      <line x1="520" y1="494" x2="548" y2="494" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="556" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khuyến nghị</text>

      <line x1="664" y1="494" x2="692" y2="494" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="700" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường cũ, vòng này không đổi</text>
    </svg>
  </div>
</body>
</html>
