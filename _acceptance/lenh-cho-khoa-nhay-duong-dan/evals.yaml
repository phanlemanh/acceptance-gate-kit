schema_version: 1
feature_slug: lenh-cho-khoa-nhay-duong-dan
# Ca đo: tests/dieu-phoi/lenh-cho-khoa-nhay-duong-dan.test.mjs, ca «KN-<n>» = AC-<n>. Lệnh sinh ra chạy bằng vỏ thật với jq thật;
# sleep giả rút ngắn và đếm số vòng kiểm. Chiều đỏ: commit ca đứng TRƯỚC commit vật (SHA ghi sổ lúc S3), cộng ca đỏ sống -do trên bản sao lich.mjs.
evals:
