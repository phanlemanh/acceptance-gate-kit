    criterion: AC-1
    executor: script
    cmd: config:executors.script.kn_dieu_phoi
    paths: [dieu-phoi/scripts/lich.mjs, dieu-phoi/scripts/nhay.mjs, dieu-phoi/scripts/hook-chan-s4.mjs, tests/dieu-phoi/lenh-cho-khoa-nhay-duong-dan.test.mjs]
    expected: >
      exit 0; KN-1, KN-1-do: thư mục có dấu cách, khoá đúng dãy, thoát 0 ở bash, sh (zsh khi có) với số vòng kiểm 0.
      Đỏ sống cùng fixture: bản bỏ bọc treo qua ≥2 vòng. Đỏ lịch sử: commit ca trước commit vật, SHA ghi sổ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
