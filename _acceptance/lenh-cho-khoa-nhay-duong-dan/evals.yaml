    expected: >
      exit 0; KN-2, KN-2-do: sống qua ≥2 vòng kiểm ở khoá vắng, ≥2 vòng ở khoá dãy khác, thoát 0 khi về đúng dãy. Đỏ
      sống: bản bỏ vị từ phiên đỏ «thoát sớm khi khoá của dãy khác»; bản bỏ bọc đỏ «lệnh chờ không thoát».
