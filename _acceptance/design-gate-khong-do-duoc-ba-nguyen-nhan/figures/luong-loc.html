<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lớp lọc phát hiện tương phản</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1440px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lưu đồ quyết định · Cổng thiết kế · AC-1 đến AC-6</p>
    <h1>Một phát hiện tương phản đo được hay không, và trang nhận phán quyết nào</h1>

    <svg viewBox="0 0 1440 660" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone headers -->
      <text x="32" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BƯỚC 1 · TỪNG PHÁT HIỆN TƯƠNG PHẢN</text>
      <line x1="32" y1="84" x2="928" y2="84" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="992" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BƯỚC 2 · PHÁN QUYẾT CỦA TRANG</text>
      <line x1="992" y1="84" x2="1408" y2="84" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== Arrows (drawn first, behind nodes) ===== -->
      <!-- Vào → Q1 -->
      <line x1="160" y1="200" x2="208" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q1 → Q2 : không -->
      <line x1="400" y1="200" x2="448" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q2 → Q3 : không -->
      <line x1="688" y1="200" x2="736" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q3 → Q4 : không nhãn nào, đo được -->
      <line x1="928" y1="200" x2="992" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q1, Q2, Q3 : có → tập phát hiện mang nhãn -->
      <line x1="304" y1="264" x2="304" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="272" x2="568" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="832" y1="264" x2="832" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Tập nhãn → Q5 -->
      <line x1="928" y1="400" x2="992" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q4 → Q5 : không -->
      <line x1="1088" y1="264" x2="1088" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q4 → CHẶN : có -->
      <line x1="1184" y1="200" x2="1232" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Q5 → KHÔNG ĐO ĐƯỢC : có (accent) -->
      <line x1="1184" y1="400" x2="1232" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Q5 → ĐẠT : không -->
      <line x1="1088" y1="464" x2="1088" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (masked, 6-10px off the stroke) ===== -->
      <rect x="404" y="180" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="424" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="692" y="180" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="712" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="940" y="180" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="960" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>
      <rect x="932" y="206" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="960" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ĐO ĐƯỢC</text>

      <rect x="312" y="304" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="326" y="315" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="576" y="308" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="590" y="319" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="840" y="304" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="854" y="315" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="1096" y="293" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="1116" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>
      <rect x="1196" y="180" width="24" height="14" rx="2" fill="#f5f5f5"/>
      <text x="1208" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="1196" y="380" width="24" height="14" rx="2" fill="#f5f5f5"/>
      <text x="1208" y="391" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="1096" y="489" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="1116" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <!-- ===== Nodes ===== -->
      <!-- Vào: phát hiện tương phản P0 -->
      <rect x="32" y="168" width="128" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="32" y="168" width="128" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="96" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phát hiện</text>
      <text x="96" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tương phản P0</text>

      <!-- Q1: chữ cắt theo nền gradient? -->
      <polygon points="304,136 400,200 304,264 208,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chữ cắt theo</text>
      <text x="304" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nền gradient?</text>

      <!-- Q2: nền tổ tiên không đọc được? -->
      <polygon points="568,128 688,200 568,272 448,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="568" y="182" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nền trong lời báo là</text>
      <text x="568" y="196" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trắng mặc định, mà một</text>
      <text x="568" y="210" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tổ tiên khai nền không</text>
      <text x="568" y="224" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đọc được?</text>

      <!-- Q3: trang có CSS không áp được? -->
      <text x="832" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CẤP TRANG · CỘNG THÊM</text>
      <polygon points="832,136 928,200 832,264 736,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="186" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang có CSS</text>
      <text x="832" y="200" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không áp được, màu</text>
      <text x="832" y="214" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không ghim nội dòng?</text>

      <!-- Tập phát hiện mang nhãn (accent) -->
      <rect x="208" y="360" width="720" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="360" width="720" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="304" y="380" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÃN · CHỮ GRADIENT</text>
      <text x="304" y="394" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chữ thật là một dải màu</text>
      <text x="568" y="380" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÃN · NỀN TỔ TIÊN</text>
      <text x="568" y="394" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nền trắng trong lời báo là nền bị bỏ</text>
      <text x="832" y="380" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÃN · CSS KHÔNG ÁP</text>
      <text x="832" y="394" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trừ phần tử ghim màu nội dòng</text>
      <line x1="224" y1="406" x2="912" y2="406" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="568" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phát hiện mang nhãn: ra khỏi nhóm chặn</text>

      <!-- Q4: còn phát hiện chặn đo được? -->
      <polygon points="1088,136 1184,200 1088,264 992,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1088" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn phát hiện</text>
      <text x="1088" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chặn đo được?</text>

      <!-- Q5: còn phát hiện mang nhãn? -->
      <polygon points="1088,336 1184,400 1088,464 992,400" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1088" y="398" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn phát hiện</text>
      <text x="1088" y="412" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mang nhãn?</text>

      <!-- Kết quả: CHẶN -->
      <rect x="1232" y="168" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="1232" y="168" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1320" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CHẶN</text>
      <text x="1320" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thoát mã 2</text>

      <!-- Kết quả: KHÔNG ĐO ĐƯỢC (accent) -->
      <rect x="1232" y="364" width="176" height="72" rx="36" fill="#f5f5f5"/>
      <rect x="1232" y="364" width="176" height="72" rx="36" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1320" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KHÔNG ĐO ĐƯỢC</text>
      <text x="1320" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thoát mã 0</text>
      <text x="1320" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mã 5 khi bật chế độ chặt</text>

      <!-- Kết quả: ĐẠT -->
      <rect x="1008" y="528" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="1008" y="528" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1088" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ĐẠT</text>
      <text x="1088" y="563" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không còn phát hiện nào</text>

      <!-- ===== Legend ===== -->
      <line x1="32" y1="600" x2="1408" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI</text>

      <rect x="32" y="632" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="64" y="642" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm vào hoặc kết quả</text>

      <polygon points="260,638 272,632 284,638 272,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="642" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi có hoặc không</text>

      <rect x="480" y="632" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="512" y="642" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tập phát hiện cùng lý do</text>

      <rect x="720" y="632" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="752" y="642" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối mới: không đo được</text>
    </svg>
  </div>
</body>
</html>
