<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Một lựa chọn ở bước thiết kế đi tới đâu</title>
  <!-- Hình tầng 2 — chiếu của figures/index.md (đề bài co-che.html) và bản thiết kế §3.1, §3.4, §3.8.
       AC chở: AC-1, AC-4, AC-5, AC-7. Thứ tự ba câu máy tự xét đặt «khó-đảo» lên đầu vì §3.1:
       «chạm khó-đảo — luôn là câu hỏi, bất kể nguồn»; «không trỏ được căn cứ thì là chỉ người có». -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình 1 · Cổng Phạm vi · sơ đồ luồng</p>
    <h1>Một lựa chọn ở bước thiết kế đi tới đâu</h1>

    <svg viewBox="0 0 1000 784" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Thẻ Cổng Phạm vi — khung chứa (vẽ trước để mũi tên nằm trên) ===== -->
      <rect x="40" y="472" width="920" height="128" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="56" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Thẻ Cổng Phạm vi</text>

      <!-- ===== Mũi tên (sau khung, trước nút) ===== -->
      <!-- bắt đầu → câu 1 -->
      <line x1="500" y1="72" x2="500" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 1 KHÔNG → câu 2 -->
      <line x1="500" y1="188" x2="500" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 2 KHÔNG → câu 3 -->
      <line x1="500" y1="308" x2="500" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 1 CÓ → thành câu hỏi (vào cạnh trên) -->
      <path d="M 372 144 L 200 144 Q 192 144 192 152 L 192 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 3 KHÔNG → thành câu hỏi (vào cạnh phải) -->
      <path d="M 372 384 L 352 384 Q 344 384 344 376 L 344 288 Q 344 280 336 280 L 312 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 2 CÓ → máy quyết -->
      <line x1="628" y1="264" x2="688" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- câu 3 CÓ → máy quyết -->
      <path d="M 628 384 L 648 384 Q 656 384 656 376 L 656 288 Q 656 280 664 280 L 688 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- thành câu hỏi → khối câu chỉ anh trả lời được -->
      <line x1="192" y1="296" x2="192" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- máy quyết → khối máy đã quyết -->
      <line x1="808" y1="296" x2="808" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- máy quyết → đỏ (căn cứ hỏng) — điểm nhấn -->
      <path d="M 736 296 L 736 440 Q 736 448 728 448 L 568 448 Q 560 448 560 456 L 560 512" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- thẻ → duyệt -->
      <line x1="340" y1="600" x2="340" y2="640" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- thẻ → sửa: → dòng lật ghi sổ -->
      <line x1="660" y1="600" x2="660" y2="640" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên (mặt nạ giấy, cách nét 8px) ===== -->
      <rect x="272" y="120" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="284" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="508" y="196" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="528" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="508" y="316" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="528" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="646" y="240" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="658" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="664" y="316" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="676" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="296" y="316" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="316" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="604" y="424" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="648" y="436" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CĂN CỨ HỎNG</text>

      <rect x="668" y="612" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="686" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sửa:</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu -->
      <rect x="380" y="32" width="240" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="380" y="32" width="240" height="40" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lựa chọn ở bước thiết kế</text>

      <!-- Câu 1: chỉ người biết hoặc khó-đảo? -->
      <polygon points="500,100 628,144 500,188 372,144" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="141" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ người biết</text>
      <text x="500" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hoặc khó-đảo?</text>

      <!-- Câu 2: trỏ được căn cứ có từ trước vòng? -->
      <polygon points="500,220 628,264 500,308 372,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="261" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trỏ được căn cứ</text>
      <text x="500" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">có từ trước vòng?</text>

      <!-- Câu 3: chỉ còn một lối? -->
      <polygon points="500,340 628,384 500,428 372,384" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ còn một lối?</text>

      <!-- Thành câu hỏi Hỏi-n -->
      <rect x="72" y="240" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="240" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thành câu hỏi Hỏi-n</text>
      <text x="192" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khuyến nghị · lối khác · giá</text>

      <!-- Máy quyết, ghi sổ kèm căn cứ -->
      <rect x="688" y="240" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="240" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy quyết, ghi sổ kèm căn cứ</text>
      <text x="808" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">câu trích + tệp · hoặc lối khác chết vì</text>

      <!-- Khối trên thẻ: câu chỉ anh trả lời được -->
      <rect x="80" y="512" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="512" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Câu chỉ anh trả lời được</text>
      <text x="192" y="552" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi-1, Hỏi-2… theo thứ tự sổ</text>

      <!-- Khối trên thẻ: đỏ — điểm nhấn -->
      <rect x="380" y="512" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="512" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="500" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đỏ — dòng lệnh duyệt để trống</text>
      <text x="500" y="552" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mỗi dòng hỏng một cờ đỏ</text>

      <!-- Khối trên thẻ: máy đã quyết — anh lật được -->
      <rect x="696" y="512" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="512" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy đã quyết — anh lật được</text>
      <text x="808" y="552" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">in câu trích cạnh lựa chọn</text>

      <!-- duyệt -->
      <rect x="232" y="640" width="216" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="232" y="640" width="216" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="340" y="660" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">duyệt</text>
      <text x="340" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nhận khuyến nghị</text>

      <!-- dòng lật ghi sổ -->
      <rect x="552" y="640" width="216" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="552" y="640" width="216" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="660" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng lật ghi sổ</text>
      <text x="660" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đếm cho ngưỡng</text>

      <!-- ===== Chú giải — dải dưới ===== -->
      <line x1="40" y1="716" x2="960" y2="716" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="736" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG NGHĨA</text>

      <rect x="40" y="752" width="28" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="76" y="764" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bắt đầu / kết thúc</text>

      <polygon points="212,760 228,752 244,760 228,768" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="764" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">máy tự xét, không hỏi người</text>

      <rect x="432" y="752" width="28" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="468" y="764" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bước</text>

      <rect x="532" y="752" width="28" height="16" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="568" y="764" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">khung thẻ</text>

      <line x1="652" y1="760" x2="684" y2="760" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="692" y="764" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đỏ: máy kiểm thấy căn cứ hỏng</text>
    </svg>

    <div class="footer">
      <span>Hình tầng 2 · chiếu của figures/index.md (đề bài co-che) và bản thiết kế §3.1 · §3.4 · §3.8 · AC-1 · AC-4 · AC-5 · AC-7</span>
      <span>hồ sơ buoc-len-thiet-ke-khong-hoi · vẽ 11/10/2026</span>
    </div>
  </div>
</body>
</html>
