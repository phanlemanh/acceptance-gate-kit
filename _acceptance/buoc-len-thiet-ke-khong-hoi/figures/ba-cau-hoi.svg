<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 636" xmlns="http://www.w3.org/2000/svg">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Đầu cột ===== -->
      <text x="136" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CÂU CHO ANH</text>
      <text x="496" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HAI LỐI · GIÁ MỖI LỐI</text>

      <!-- ===== Nối (vẽ trước nút) ===== -->
      <!-- Hỏi-1 (y0 = 56) -->
      <path d="M 416 120 L 456 120" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <path d="M 456 120 L 456 92 Q 456 84 464 84 L 496 84" fill="none" stroke="#2d3142" stroke-width="1.6"/>
      <path d="M 456 120 L 456 148 Q 456 156 464 156 L 496 156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <!-- Hỏi-2 (y0 = 208) -->
      <path d="M 416 272 L 456 272" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <path d="M 456 272 L 456 244 Q 456 236 464 236 L 496 236" fill="none" stroke="#2d3142" stroke-width="1.6"/>
      <path d="M 456 272 L 456 300 Q 456 308 464 308 L 496 308" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <!-- Hỏi-3 (y0 = 360) -->
      <path d="M 416 424 L 456 424" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <path d="M 456 424 L 456 396 Q 456 388 464 388 L 496 388" fill="none" stroke="#2d3142" stroke-width="1.6"/>
      <path d="M 456 424 L 456 452 Q 456 460 464 460 L 496 460" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>

      <!-- ===== Hỏi-1: Duyệt phần CỘNG? ===== -->
      <rect x="136" y="84" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="84" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="92" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="172" y="104" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="148" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Duyệt phần CỘNG?</text>

      <rect x="496" y="56" width="360" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <rect x="508" y="68" width="80" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.60)" stroke-width="0.8"/>
      <text x="548" y="80" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <text x="604" y="80" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Duyệt phần CỘNG</text>
      <text x="604" y="98" fill="#f5f5f5" font-size="10" font-family="'Geist', sans-serif">giữ chiều đỏ</text>

      <rect x="496" y="128" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="128" width="360" height="56" rx="6" fill="#f5f5f5" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="508" y="140" width="80" height="16" rx="2" fill="transparent" stroke="#636b80" stroke-width="0.8"/>
      <text x="548" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>
      <text x="604" y="152" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Chỉ viết lại lời dặn</text>
      <text x="604" y="170" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">mất chiều đỏ, bỏ 7 tiêu chí</text>

      <!-- ===== Hỏi-2: Câu gộp áp lối khác: hàng sau hay làm ngay? ===== -->
      <rect x="136" y="236" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="236" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="244" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="172" y="256" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
      <text x="148" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Câu gộp áp lối khác:</text>
      <text x="148" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">hàng sau hay làm ngay?</text>

      <rect x="496" y="208" width="360" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <rect x="508" y="220" width="80" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.60)" stroke-width="0.8"/>
      <text x="548" y="232" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <text x="604" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hàng riêng ngay sau</text>
      <text x="604" y="250" fill="#f5f5f5" font-size="10" font-family="'Geist', sans-serif">tới lúc đó, chọn khác vẫn ký lại</text>

      <rect x="496" y="280" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="280" width="360" height="56" rx="6" fill="#f5f5f5" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="508" y="292" width="80" height="16" rx="2" fill="transparent" stroke="#636b80" stroke-width="0.8"/>
      <text x="548" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>
      <text x="604" y="304" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Làm ngay trong vòng</text>
      <text x="604" y="322" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">chạm lệnh duyệt, thêm ~2 tiêu chí</text>

      <!-- ===== Hỏi-3: Bỏ bản mẫu nhìn? ===== -->
      <rect x="136" y="388" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="388" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="396" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="172" y="408" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-3</text>
      <text x="148" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bỏ bản mẫu nhìn?</text>

      <rect x="496" y="360" width="360" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <rect x="508" y="372" width="80" height="16" rx="2" fill="transparent" stroke="rgba(245,245,245,0.60)" stroke-width="0.8"/>
      <text x="548" y="384" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <text x="604" y="384" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bỏ bản mẫu</text>
      <text x="604" y="402" fill="#f5f5f5" font-size="10" font-family="'Geist', sans-serif">nhìn ảnh ở Cổng Bằng chứng</text>

      <rect x="496" y="432" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="432" width="360" height="56" rx="6" fill="#f5f5f5" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="508" y="444" width="80" height="16" rx="2" fill="transparent" stroke="#636b80" stroke-width="0.8"/>
      <text x="548" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>
      <text x="604" y="456" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Chạy bản mẫu</text>
      <text x="604" y="474" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">thêm một lượt gọi (vượt trần 4)</text>

      <!-- ===== Chú thích đọc: một câu trả lời ===== -->
      <text x="136" y="524" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Lora', 'Instrument Serif', serif">«duyệt» = nhận cả ba lối máy khuyên</text>
      <text x="136" y="544" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Lora', 'Instrument Serif', serif">chọn lối khác: «sửa: Hỏi-n = lối»</text>

      <!-- ===== Chú giải — dải dưới ===== -->
      <line x1="40" y1="568" x2="960" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="600" width="28" height="16" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="612" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lối máy khuyên — tô đậm, nét liền</text>

      <rect x="284" y="600" width="28" height="16" rx="4" fill="#f5f5f5" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="320" y="612" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lối khác — nền nhạt, nét đứt</text>

      <rect x="508" y="600" width="28" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="544" y="612" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">câu chỉ anh trả lời được</text>
    </svg>
