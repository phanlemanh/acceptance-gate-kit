schema_version: 1
feature_slug: vong-mo-co-chu-giu
# Ca đo của hàng GT1: tên ca bắt đầu «GT-». Khoá executor thêm ở S3 (điều phối cho 17/10, XONG GT1-1710-1 — chỉ thêm khoá):
#   executors.test.dieu_phoi_tin = node --test trên tests/dieu-phoi/tin.test.mjs, gộp dòng «ok … GT-», «not ok», dòng
#     chẩn đoán «#   …» và tổng kết TAP thành MỘT dòng (cùng khuôn khoá dieu_phoi_khung). Suite xanh mà thiếu dòng ghim
#     là ĐỎ.
#   executors.script.dieu_phoi_tin_kenh_that = node tests/dieu-phoi/tin-kenh-that.mjs — chỉ đọc kênh thật
#     phanlemanh/acceptance-gate-kit#308 bằng gh thật; KHÔNG vào feature_loop.suite_keys (CI không có gh đăng nhập).
#     gh vắng hay chưa đăng nhập → thoát 2 «không đọc được ở đây».
# Kho thử do code sinh trong lượt (git init trong thư mục tạm, remote origin giả, CLI thật của gói `mo` + `pha dang-chay`,
# worktree thật cho P1, P2 và giám sát; kho lạ thứ hai với remote khác). Mọi tin trong fixture do CHÍNH lệnh `tin` sinh
# trong cùng lượt; riêng ma trận văn bản AC-4 chép nguyên văn hai ca 16/10 và một tin khuôn cũ có thật từ #308. Kênh giả là
# chương trình gh giả trỏ bằng DIEU_PHOI_GH, sinh trong lượt, hình JSON theo `gh api …/issues/<số>/comments`, trang 30 kèm
# header Link. Lệnh hook rút từ hooks.json (không gõ lại), CLAUDE_PLUGIN_ROOT trỏ bản sao gói. Đường dẫn suy từ vị trí tệp
# test. Mỗi ca đỏ chạy CHÍNH lệnh đo trên bản sao gói bị tiêm, SAU khi bản lành xanh trên cùng fixture, kiểm riêng bước tiêm
# đã áp, và ghim thông điệp của ĐÚNG lỗi được tiêm. Ma trận viết sẵn: số assert = số hàng, in ra. Lời hứa đẳng thức thì so
# bằng nhau, không so bao hàm. «0 byte ghi» = băm cây trước và sau bằng nhau. «chạm» = số đối số ngoài lệnh, khẩu lệnh và
# đích/mã, đếm trên argv thật mà ca chạy.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_tin
    paths: [dieu-phoi/scripts/tin*.mjs, dieu-phoi/scripts/dot.mjs, dieu-phoi/scripts/vai.mjs, tests/dieu-phoi/tin*.mjs, tests/dieu-phoi/gh-gia.mjs]
    expected: >
      exit 0; "ok" cho "GT-01 gui-mot-cau": 9 hàng (a)…(i) in ra «hàng · kỳ vọng · thực tế». (a) mã G-<ddmm>-1, dòng đầu ===
      "GIAO G-<ddmm>-1 · G → P2"; sáu nhãn theo thứ tự; Ý định === câu đã gõ; Kết quả chứa "hang-b" và nhanh_chinh; Ranh
      giới chứa "thu/kho-a", worktree P2 và từng mục ranh_gioi; Quyền theo --tu-merge; Báo về chứa vai.json giam_sat.phien;
      (b) G-<ddmm>-2; (c) kênh giả thêm đúng 1 bình luận, dòng đầu === "GIAO MBP-<ddmm>-1 · MBP → M5", Kết quả chứa slug GT1;
      (d) thoát 1, stderr chứa "không suy được Kết quả", băm bằng; (e) "thiếu ý định", băm bằng; (f) mã P1-<ddmm>-1, chan
      false; với --chan, chan true; (g) stderr liệt đủ chín khẩu lệnh, băm bằng; (h) "không thuộc đợt", băm bằng; (i) mã ba
      khúc, !== "P1-7"; (j) ma trận nguồn suy 5 hàng: đang giữa hang-a (hồ sơ implemented) → Kết quả/Ranh giới của hang-a;
      chưa vào hàng → hang-b; hết hàng → thoát 1 "không suy được Kết quả"; --hang hang-b khi đang giữa hang-a → hang-b;
      --ket-qua "<câu>" → Kết quả === câu đó; mỗi hàng so bằng nhau với giá trị viết trong ca; (k) một khuôn hạn: lời giao "Hạn xong:
      <n> phút sau khi nhận", lời nhận "Hạn xong: <mốc ISO>" === lúc NHẬN + n; 4 hàng: trọn hàng có giờ máy → n === cận trên
      giờ máy × 60 của du-bao.json; trọn hàng không giờ máy → "chưa có hạn"; việc lẻ → "chưa có hạn"; việc lẻ --han-xong 90 →
      n === 90.
      Đếm chạm in ra: (a) === 1,
      (f) === 1. "ok" cho "GT-01-do bo-ranh-gioi": bản sao xoá dòng Ranh giới khỏi loiGiaoViec (kiểm bước tiêm áp) → ca nêu
      "Ranh giới:". "ok" cho "GT-01-do luon-hang-ke": bản sao luôn lấy hàng kế → ca nêu "đang giữa hang-a".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
