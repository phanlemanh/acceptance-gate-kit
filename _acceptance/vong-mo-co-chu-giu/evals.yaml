      thấy gói. Người đọc có trả lời được, mà không cần tài liệu nào khác, ba câu: (1) khi một việc được giao tới phiên mình
      thì phải gõ gì, phải kèm câu gì, và có phải tự điền hạn không; (2) khi nào PHẢI hỏi và khi nào KHÔNG được hỏi; (3) vòng đóng khi
      nào, người giao làm gì khi sản phẩm không đạt và trong bao lâu, và NHẬN có đóng vòng không? PASS khi cả ba câu trả lời được từ khối, không mâu thuẫn trong khối.
