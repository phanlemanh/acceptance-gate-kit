  - id: E10b
    criterion: AC-10
    executor: judgment
    inputs: [dieu-phoi/scripts/mau/LUAT.md]
    question: >
      Chỉ đọc khối «Giao tiếp — khẩu lệnh và vòng mở» (giữa marker LUAT-TIN) của tệp này, như một phiên thợ mới chưa từng
      thấy gói. Người đọc có trả lời được, mà không cần tài liệu nào khác, ba câu: (1) khi một việc được giao tới phiên mình
      thì phải gõ gì, và có phải tự điền gì thêm không; (2) khi nào PHẢI hỏi và khi nào KHÔNG được hỏi; (3) vòng đóng bằng
      những khẩu lệnh nào, và NHẬN có đóng vòng không? PASS khi cả ba câu trả lời được từ khối, không mâu thuẫn trong khối.
      FAIL khi một câu không có câu trả lời, hoặc khối tự mâu thuẫn.
    evidence_required: [run_id, verifier, verified_at, output]
