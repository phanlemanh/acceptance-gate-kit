    gllc_bo_loc_rong: GLLC_CASES=GL08 node tests/scripts/repin-lane-lop-cu.test.mjs
    # --- cua-veto-sau-chu-ky (11/09, T3) --- moi eval = MOT chan cua rang ho so (rang.sh viet o S3).
