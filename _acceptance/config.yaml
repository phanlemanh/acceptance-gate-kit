    emmd_dau_cuoi_that: bash _acceptance/eval-khai-ma-thoat-mong-doi/rang.sh --chan dau-cuoi-that
    bo_giai_nhay: "node tests/scripts/bo-giai-nhay.test.mjs"
    # Vật của hồ sơ release-2-11-0. Giá trị CỐ Ý là scalar vỏ nháy kép có `\"` bên trong:
