schema_version: 1
# Acceptance-Gate Kit chạy cổng của chính nó (dogfood). Ba điểm khác một repo
# tiêu thụ bình thường — đọc trước khi sửa:
#
# 1. TỰ HOST. Kit LÀ nguồn của plugin, nên executor trỏ vào `scripts/` ngay
#    trong repo, KHÔNG qua ${CLAUDE_PLUGIN_ROOT}. Nhờ vậy cổng luôn chấm bằng
#    mã đang sửa, không bằng bản trong plugin cache (cache thường tụt version).
#    feature-loop S4: resolve bằng
#    `node feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --root .`
# 2. `*.md` KHÔNG phải T1 ở repo này. Sản phẩm của kit phần lớn LÀ markdown
#    (mọi SKILL.md và mọi file commands/ là hành vi thật, không phải tài liệu). Chỉ
#    những file docs được liệt tên đích danh mới bỏ qua cổng.
# 3. KHÔNG có làn design/dev_server/capture: kit không có web UI.
enforcement: strict
recheck: strict              # kit tự bắt mình theo mức chặt nhất; consumer mới có thể để `warn`
gap_probe: required          # cùng posture: kit KHÔNG tự cho mình mode advisory mà bảo consumer
                             # dùng nó. Chỉ xét slug có file trong diff PR nên nợ lịch sử không nổ —
                             # NHƯNG `required` có sàn fail-CLOSED: chạy không --base (hoặc git diff
                             # lỗi, thiếu node/lib) là VIOLATION, không phải bỏ qua. CI phải luôn
                             # truyền base (xem .github/workflows/gate.yml).
baseline_minutes: []         # CỐ Ý ĐỂ TRỐNG, không phải quên. Owner (2026-07-26): trước khi có kit
                             # thì "gần như không phê duyệt được, hoặc mất rất lâu" — tức baseline
                             # KHÔNG phải một khoảng thời gian, mà là một việc thường không xảy ra.
                             # Điền một con số ước lượng vào đây sẽ bịa ra mẫu số và biến KPI thành
                             # "giảm X%" trong khi sự thật là "từ KHÔNG-THỂ sang đo được".
                             # /acceptance-report sẽ in "baseline chưa ghi" — đọc kèm dòng này.
                             # Đo thật: mốc so sánh đúng là số feature phê duyệt được / tháng,
                             # không phải số phút mỗi lần.
executors:
  test:
    scripts: "bash tests/scripts/run-tests.sh"
    # Bốn mảnh của CÙNG suite scripts (hồ sơ ha-tang-khong-dot-luot AC-1..3): suite trọn chạy
    # 498 s máy rảnh / 601 s dưới tải — qua trần 600 s của công cụ chạy lệnh trong tác tử chấm.
    # Lượt chấm (feature_loop.suite_keys) chạy bốn mảnh; khoá `scripts` ở trên vẫn chạy trọn
    # (CI, người gọi tay). Mảnh truyền bằng đối số `--manh`, không bằng tiền tố biến môi
    # trường, để lệnh khớp nguyên văn một mục permissions.allow (song ánh LM1).
    scripts_bash: "bash tests/scripts/run-tests.sh --manh bash"
    scripts_mjs_1: "bash tests/scripts/run-tests.sh --manh mjs:1/3"
    scripts_mjs_2: "bash tests/scripts/run-tests.sh --manh mjs:2/3"
    scripts_mjs_3: "bash tests/scripts/run-tests.sh --manh mjs:3/3"
    hooks: "bash tests/hooks/run-tests.sh"
    # Bọc lượt 6 release-2-11-0 (owner chọn 11/09): suite plugins in ~70k ký tự và
    # bốn trên năm lượt chấm của hồ sơ đó bị công cụ cắt output giữa chừng rồi agent
    # khai exit 1 (tool-kill). pipefail GIỮ mã thoát của suite; lọc + tail chỉ để
    # đầu ra lọt qua. Suite sập trước dòng «Results:» thì grep không khớp → vẫn ≠ 0.
    plugins: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh 2>&1 | grep -E \"FAIL|^Results:\" | tail -n 40'"
    # Ba vùng của CÙNG suite plugins (hồ sơ ha-tang-khong-dot-luot AC-8): suite trọn đo 537 s máy
    # rảnh — trên ngưỡng 80 % trần 600 s của công cụ chạy lệnh trong tác tử chấm. Lượt chấm chạy ba
    # vùng (vùng 2 chỉ có P161, khối đắt nhất); khoá `plugins` ở trên vẫn chạy trọn (CI, người gọi).
    plugins_vung_1: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh --manh vung:1 2>&1 | grep -E \"FAIL|^Results:\" | tail -n 40'"
    plugins_vung_2: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh --manh vung:2 2>&1 | grep -E \"FAIL|^Results:\" | tail -n 40'"
    plugins_vung_3: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh --manh vung:3 2>&1 | grep -E \"FAIL|^Results:\" | tail -n 40'"
    workflows: "bash tests/workflows/run-tests.sh"
    lo_trinh: "node tests/scripts/lo-trinh.test.mjs"
    # Hồ sơ road-map-de-dung (vòng RD1): ca RD-1…RD-11 + RD-tat (bộ nhát tắt tests/scripts/tat-rd1.mjs). Tệp .test.mjs nên cũng
    # chạy trong mảnh mjs của suite. Bản chụp crm do tests/scripts/chup-crm-onehub.mjs sinh (không cần kho crm lúc chạy).
    road_map_de_dung: node tests/scripts/road-map-de-dung.test.mjs
    # Hồ sơ dai-tom-tat-doc-dung: ca DT-1..DT-8 (dải tóm tắt hồ sơ). DT-9 cần kho crm trên máy (CRM_ROOT,
    # mặc định ~/dev/crm) nên tệp không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys.
    dai_tom_tat: "node tests/scripts/dai-tom-tat.test.mjs"
    dai_tom_tat_crm: "node tests/scripts/dai-tom-tat-crm.mjs"
    # Hồ sơ dai-tom-tat-dem-dung-vi-sao-tron: ca DD-1..DD-6, DD-8 (bộ đọc khối giới hạn, «Vì sao làm» trọn). DD-7/DD-9 cần sáu
    # kho tiêu thụ trên máy (KHO_<TÊN> hoặc ~/dev/<tên>) nên tệp không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys.
    dai_tom_tat_dem_dung: "node tests/scripts/dai-tom-tat-dem-dung.test.mjs"
    dai_tom_tat_sau_kho: "node tests/scripts/dai-tom-tat-sau-kho.mjs"
    # Cửa tín hiệu (hồ sơ cua-tin-hieu-gom-nhom, hàng L3) — ca TH-1…TH-10.
    tin_hieu: "node tests/scripts/tin-hieu.test.mjs"
    tin_hieu_vang: "TH_CASES=TH-10,TH-10-ong,TH-10-do,TH-10-do2 node tests/scripts/tin-hieu.test.mjs"
    # Câu cho người gửi (hồ sơ cau-tin-hieu-nguoi-gui) — ca CN-1…CN-8 cùng tệp ca.
    tin_hieu_cau: "TH_CASES=CN-1,CN-1-do,CN-1-do2,CN-2,CN-2-do,CN-3,CN-3-do,CN-4,CN-4-do,CN-5,CN-5-do,CN-5-do2,CN-5-do3,CN-6,CN-6-do,CN-6-do-tt,CN-6-do-khung,CN-6-do2,CN-6-do3,CN-6-do4,CN-7,CN-7-do,CN-8,CN-8-do node tests/scripts/tin-hieu.test.mjs"
    # Bộ đọc hồ sơ khoan dung (hồ sơ bo-doc-ho-so-khoan-dung) — ca YC-… (bộ dò YAML chuẩn, cờ thẻ, lệnh kiểm) và
    # NK-… (một bộ đọc ngày ký cho bốn mặt). Cả hai tệp mang đuôi .test.mjs nên cũng chạy trong mảnh mjs của suite.
    yaml_chuan: node tests/scripts/yaml-chuan.test.mjs
    # Hồ sơ moc-la-chien-dich (hàng MC1, nấc 1 ADR 0025): ca MC-1…MC-9, MC-11 (tệp .test.mjs — cũng chạy trong mảnh mjs
    # của suite) · phần bảng dịch của AC-5 ở LT-97 · MC-10 cần kho crm trên máy (CRM_ROOT, mặc định ~/dev/crm) nên tệp
    # không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys (crm vắng → thoát 2, mù).
    moc_chien_dich: node tests/scripts/moc-chien-dich.test.mjs
    moc_chien_dich_lt97: "LT_CASES=LT-97,LT-97-do,LT-97-do2 node tests/scripts/lo-trinh.test.mjs"
    moc_chien_dich_crm: node tests/scripts/moc-chien-dich-crm.mjs
    ra_soat_lo_trinh: node tests/scripts/ra-soat-lo-trinh.test.mjs
    ra_soat_lo_trinh_crm: node tests/scripts/ra-soat-lo-trinh-crm.mjs
    # Hồ sơ ap-chinh-sach-lo-trinh (RM2): ca AP-1…AP-10 chung một lệnh; AP-11 cần kho crm trên máy (KHO_CRM hoặc
    # ~/dev/crm) nên tệp không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys (crm vắng → thoát 2, mù).
    ap_chinh_sach_lo_trinh: node tests/scripts/ap-chinh-sach-lo-trinh.test.mjs
    # Hồ sơ lo-trinh-gio-may (RM6): ca GM-1…GM-9 chung một lệnh (giờ máy + token trên lộ trình, đo vòng, đo lệch).
    lo_trinh_gio_may: node tests/scripts/lo-trinh-gio-may.test.mjs
    # Hồ sơ lo-trinh-du-lieu-ngay-du-kien (RM6c): ca ND-1…ND-8 chung một lệnh (giờ máy + ngày dự kiến trong khối dữ liệu trang).
    lo_trinh_du_lieu_ngay: node tests/scripts/lo-trinh-du-lieu-ngay.test.mjs
    # Hồ sơ du-bao-dong-bang-theo-ma-moc (RM6b): chỉ các ca DB-<n> của cùng tệp (ca GM chạy ở khoá trên và trong mảnh mjs).
    du_bao_theo_ma_moc: "env GM_CASES=DB node tests/scripts/lo-trinh-gio-may.test.mjs"
    ap_chinh_sach_lo_trinh_crm: node tests/scripts/ap-chinh-sach-lo-trinh-crm.mjs
    # Hồ sơ cua-tin-hieu-giua-chien-dich (RM3): ca CT-1…CT-10 chung một lệnh (tệp .test.mjs — cũng chạy trong mảnh mjs).
    cua_tin_hieu_giua_chien_dich: node tests/scripts/cua-tin-hieu-giua-chien-dich.test.mjs
    # Hồ sơ cua-tin-hieu-goc-moi-worktree (RM3b): ca GW-1…GW-6 chung một lệnh.
    cua_tin_hieu_goc_moi_worktree: node tests/scripts/cua-tin-hieu-goc-moi-worktree.test.mjs
    # Hồ sơ ve-lo-trinh-doc-tin-hieu-cua-cay (VA2, vá 2.32.1): ca VT-1…VT-4 chung một lệnh.
    ve_lo_trinh_doc_tin_hieu_cua_cay: node tests/scripts/ve-lo-trinh-doc-tin-hieu-cua-cay.test.mjs
    # Hồ sơ kho-moi-cai-goi-road-map (RM4): ca KM-1…KM-8 chung một lệnh; KM-9 đo trên bản sao các kho thật của máy
    # (KHO_GOC hoặc ~/dev) nên tệp không mang đuôi .test.mjs và KHÔNG vào feature_loop.suite_keys (không dò được → thoát 2, mù).
    kho_moi_cai_goi_road_map: node tests/scripts/kho-moi-cai-goi-road-map.test.mjs
    kho_moi_cai_goi_road_map_cac_kho: node tests/scripts/kho-moi-cai-goi-road-map-cac-kho.mjs
    kho_cam_ket_co_lo_trinh: node tests/scripts/kho-cam-ket-co-lo-trinh.test.mjs
    # Hồ sơ cham-lai-khong-tu-doi (hàng VA1): ca CL1…CL8 chung một lệnh (mang sang theo định nghĩa eval · tệp args của
    # lượt cuối). Bộ cũ: ba tệp ca của các hồ sơ đã ký mà vật chạm (cây đổi · thước chỉ-đọc · ai đã ghi).
    cham_lai_khong_tu_doi: node tests/scripts/cham-lai-khong-tu-doi.test.mjs
    cham_lai_khong_tu_doi_bo_cu: "node tests/scripts/cay-doi-trong-luot.test.mjs && node tests/scripts/ntr-thuoc.test.mjs && node tests/scripts/ghi-boi-tac-tu-cham.test.mjs"
    kho_cam_ket_co_lo_trinh_cac_kho: node tests/scripts/kho-cam-ket-co-lo-trinh-cac-kho.mjs
    # AC-4 sau Cổng Bằng chứng lượt 2: chạy chính ca DP2-11 của gói điều phối (chỉ chạy, không sửa tệp ca của vùng M5).
    moc_chien_dich_dp211: "node --test --test-name-pattern=DP2-11 tests/dieu-phoi/mo-dot.test.mjs"
    ngay_ky: node tests/scripts/ngay-ky.test.mjs
    # Đo trang lộ trình trên Chrome thật (CDP) — thiếu Chrome thì ĐỎ nêu tên, không bỏ qua.
    lo_trinh_trang: "node tests/scripts/xem-trang-lo-trinh.test.mjs"
    # Hồ sơ xa-stdout-truoc-khi-thoat: ca đo XD-1..XD-7 (stdout qua pipe không bị cắt ở 64 KB). Khoá riêng,
    # không trỏ mảnh mjs:3/3 — mảnh chia theo chỉ số glob, tệp mới sau này xô ca sang mảnh khác thì eval
    # xanh mà không chạy ca nào. KHÔNG vào feature_loop.suite_keys.
    xuat_du_qua_pipe: "node tests/scripts/xuat-du-qua-pipe.test.mjs"
    # Hồ sơ moi-cong-khong-qua-nut (KY1): ca MQ-1…MQ-10 chung một lệnh (đuôi .test.mjs — cũng chạy trong mảnh mjs).
    moi_cong_khong_qua_nut: node tests/scripts/moi-cong-khong-qua-nut.test.mjs
    # Hồ sơ kho-tri-thuc-va-lint (TT1, đợt tri-thuc-2410): ca KT-1…KT-9 chung một lệnh (đuôi .test.mjs — cũng chạy trong mảnh mjs).
    kho_tri_thuc_va_lint: node tests/scripts/kho-tri-thuc-va-lint.test.mjs
    ghi_tri_thuc: node tests/scripts/ghi-tri-thuc.test.mjs
    # Hồ sơ o-mo-viec-mang-nguon (TT3, đợt tri-thuc-2410): ca ON-1…ON-7 chung một lệnh (đuôi .test.mjs — cũng chạy trong mảnh mjs).
    o_mo_viec_mang_nguon: node tests/scripts/o-mo-viec-mang-nguon.test.mjs
    # Hồ sơ o-mo-viec-mang-nguon (AC-8): ca hồi quy của bộ xếp căn cứ bước thiết kế.
    can_cu_s1_ca: node tests/scripts/can-cu-s1.ca.mjs
    # Hồ sơ thiet-ke-nap-tri-thuc (TT4, đợt tri-thuc-2410): ca TN-1…TN-8 chung một lệnh (đuôi .test.mjs — cũng chạy trong mảnh mjs).
    thiet_ke_nap_tri_thuc: node tests/scripts/thiet-ke-nap-tri-thuc.test.mjs
    # Hồ sơ thiet-ke-nap-tri-thuc (AC-9): bốn tệp ca hồi quy, dừng ở tệp đỏ đầu tiên.
    thiet_ke_nap_hoi_quy: "bash -c 'set -e; node tests/scripts/luat-san-pham.ca.mjs; node tests/scripts/co-hop-dong.test.mjs; node tests/scripts/kho-tri-thuc-va-lint.test.mjs; node tests/scripts/o-mo-viec-mang-nguon.test.mjs'"
    # Hồ sơ vong-don-le-tra-tri-thuc (TT5, đợt tri-thuc-2410): ca TD-1…TD-9 chung một lệnh (đuôi .test.mjs — cũng chạy trong mảnh mjs).
    vong_don_le_tra_tri_thuc: node tests/scripts/vong-don-le-tra-tri-thuc.test.mjs
    # Hồ sơ vong-don-le-tra-tri-thuc (AC-9): năm tệp ca hồi quy của tầng tri thức, dừng ở tệp đỏ đầu tiên.
    vong_don_le_hoi_quy: "bash -c 'set -e; node tests/scripts/kho-tri-thuc-va-lint.test.mjs; node tests/scripts/o-mo-viec-mang-nguon.test.mjs; node tests/scripts/thiet-ke-nap-tri-thuc.test.mjs; node tests/scripts/can-cu-s1.ca.mjs; node tests/scripts/ghi-tri-thuc.test.mjs'"
    # Hồ sơ moi-cong-khong-qua-nut (AC-9): ca P188 (điều khoản mời cổng khớp từng ký tự) chạy riêng một khối.
    p188_moi_cong: "bash -c 'set -o pipefail; ONLY_BLOCK=P188 bash tests/plugins/run-tests.sh | grep -F P188'"
    # Hồ sơ moi-cong-khong-qua-nut (AC-9, từ lượt 2): bộ ca khung điều phối, mỗi dòng một ca đỏ hoặc dòng ghim — dòng
    # gộp một hàng của dieu_phoi_khung bị cắt ở người chấm nên lượt 1 không thấy ca nào đỏ.
    dieu_phoi_khung_tung_dong: "bash -c 'set -o pipefail; node --test --test-reporter=tap \"tests/dieu-phoi/**/*.test.mjs\" 2>&1 | grep -E \"^ *not ok|^ *ok [0-9]+ - DP(1-07|2-01)|^# (pass|fail) \"'"
    # Từ lượt 3 (chủ kho chọn thu phạm vi AC-9): chỉ hai ca có tên DP1-07, DP2-01 và các ca đỏ đi kèm của chúng.
    dieu_phoi_dp107_dp201: "bash -c 'set -o pipefail; node --test --test-reporter=tap --test-name-pattern=\"DP1-07|DP2-01\" tests/dieu-phoi/dong-goi.test.mjs tests/dieu-phoi/mo-dot.test.mjs 2>&1 | grep -E \"^ *(not )?ok [0-9]+ - |^# (pass|fail) \"'"
    # Mốc 2.25.0: vùng 3 GIỮ các dòng P200 (vế + chiều đỏ) trong bằng chứng — ba mốc 2.22 → 2.24
    # chấm số phiên bản trên dòng mà bộ lọc FAIL|Results của plugins_vung_3 cắt mất (Known
    # limit Ngoài-1 lặp ba lần). Gộp thành MỘT dòng vì workflow lượt chấm chỉ giữ ba dòng cuối
    # (gồm dòng __EXIT) của lệnh xanh khi viết báo cáo (lượt chấm 2 của release-2-25-0 bắt).
    rel2250_vung_3_p200: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh --manh vung:3 2>&1 | grep -E \"FAIL|^Results:|P200 (VE|OK)|[[]chieu do]\" | tail -n 60 | paste -sd\"|\" -'"
    # Gói dieu-phoi (hồ sơ dieu-phoi-dong-goi-loi): lõi 84 ca + ca DP1-*. Gộp dòng ghim «ok … DP1-…»,
    # mọi «not ok» và tổng kết TAP thành MỘT dòng — lượt chấm chỉ giữ vài dòng cuối của lệnh xanh.
    dieu_phoi: "bash -c 'set -o pipefail; node --test --test-reporter=tap \"tests/dieu-phoi/**/*.test.mjs\" 2>&1 | grep -E \"^ *(not )?ok [0-9]+ - DP1-|^ *not ok|^# (pass|fail|skipped|todo) \" | paste -sd\"|\" -'"
    # P200 + P33 của suite plugins (AC-9, E9): khoá `plugins` lọc bỏ dòng PASS nên không ghim được.
    dieu_phoi_plugins: bash tests/dieu-phoi/chay-p200-p33.sh
    # Hồ sơ dieu-phoi-mo-dot-mot-lenh: như khoá `dieu_phoi` nhưng ghim cả «ok … DP1-» lẫn «ok … DP2-»,
    # kèm dòng chẩn đoán «#   …» mà các ca in ra (tập đã so, số đếm) để lượt chấm đọc được.
    dieu_phoi_dp2: "bash -c 'set -o pipefail; node --test --test-reporter=tap \"tests/dieu-phoi/**/*.test.mjs\" 2>&1 | grep -E \"^ *(not )?ok [0-9]+ - DP[12]-|^ *not ok|^#   |^# (pass|fail|skipped|todo) \" | paste -sd\"|\" -'"
    # Hai ca bảng tên lệnh (AC-14, E14b): tài liệu nhắc /dieu-phoi:… phải nằm trong COMMAND-NAMES.
    dieu_phoi_lb: "bash -c 'LB_CASES=LB1,LB2 node tests/plugins/lenh-bam-duoc.test.mjs'"
    # Hồ sơ dieu-phoi-feature-loop-trong-dot: như `dieu_phoi_dp2` nhưng ghim cả «ok … DP7-».
    dieu_phoi_dp7: "bash -c 'set -o pipefail; node --test --test-reporter=tap \"tests/dieu-phoi/**/*.test.mjs\" 2>&1 | grep -E \"^ *(not )?ok [0-9]+ - DP[127]-|^ *not ok|^#   |^# (pass|fail|skipped|todo) \" | paste -sd\"|\" -'"
    # Hồ sơ ngoai-n-tu-dinh-tuyen: ca NT1–NT10, gộp mọi dòng «PASS: NT…»/«FAIL: …» và tổng kết thành MỘT dòng
