    emmd_xung_dot_lenh: bash _acceptance/eval-khai-ma-thoat-mong-doi/rang.sh --chan xung-dot-lenh
    emmd_so_ky_vong: bash _acceptance/eval-khai-ma-thoat-mong-doi/rang.sh --chan so-ky-vong
    emmd_lan_ghim: bash _acceptance/eval-khai-ma-thoat-mong-doi/rang.sh --chan lan-ghim
    emmd_luat_ghim: bash _acceptance/eval-khai-ma-thoat-mong-doi/rang.sh --chan luat-ghim
