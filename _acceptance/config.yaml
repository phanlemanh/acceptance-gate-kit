    chd_ac7: CHD_CASES=AC-7,AC-7-do,AC-7-do-ngay-ky node tests/scripts/co-hop-dong.test.mjs
    chd_ac8: CHD_CASES=AC-8,AC-8-do node tests/scripts/co-hop-dong.test.mjs
    # Hồ sơ design-floor-vendor-va-ban-va-a (FL2): mỗi lệnh chạy chiều xanh trên cây thật rồi đột biến cùng nhãn của
