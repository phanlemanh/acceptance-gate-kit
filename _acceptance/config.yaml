    df_va01: bash tests/design-floor/eval.sh va01
    df_fn01: bash tests/design-floor/eval.sh fn01
    df_bg01: bash tests/design-floor/eval.sh bg01
    df_ngoai_tuyen: bash tests/design-floor/eval.sh ngoai-tuyen
