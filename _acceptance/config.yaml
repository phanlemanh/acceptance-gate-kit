schema_version: 1
# Acceptance-Gate Kit chạy cổng của chính nó (dogfood). Ba điểm khác một repo
# tiêu thụ bình thường — đọc trước khi sửa:
#
# 1. TỰ HOST. Kit LÀ nguồn của plugin, nên executor trỏ vào `scripts/` ngay
#    trong repo, KHÔNG qua ${CLAUDE_PLUGIN_ROOT}. Nhờ vậy cổng luôn chấm bằng
#    mã đang sửa, không bằng bản trong plugin cache (cache thường tụt version).
#    feature-loop S4: resolve bằng
#    `node feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --root .`
# 2. `*.md` KHÔNG phải T1 ở repo này. Sản phẩm của kit phần lớn LÀ markdown
#    (mọi SKILL.md và mọi file commands/ là hành vi thật, không phải tài liệu). Chỉ
#    những file docs được liệt tên đích danh mới bỏ qua cổng.
# 3. KHÔNG có làn design/dev_server/capture: kit không có web UI.
enforcement: strict
recheck: strict              # kit tự bắt mình theo mức chặt nhất; consumer mới có thể để `warn`
gap_probe: required          # cùng posture: kit KHÔNG tự cho mình mode advisory mà bảo consumer
                             # dùng nó. Chỉ xét slug có file trong diff PR nên nợ lịch sử không nổ —
                             # NHƯNG `required` có sàn fail-CLOSED: chạy không --base (hoặc git diff
                             # lỗi, thiếu node/lib) là VIOLATION, không phải bỏ qua. CI phải luôn
                             # truyền base (xem .github/workflows/gate.yml).
baseline_minutes: []         # CỐ Ý ĐỂ TRỐNG, không phải quên. Owner (2026-07-26): trước khi có kit
                             # thì "gần như không phê duyệt được, hoặc mất rất lâu" — tức baseline
                             # KHÔNG phải một khoảng thời gian, mà là một việc thường không xảy ra.
                             # Điền một con số ước lượng vào đây sẽ bịa ra mẫu số và biến KPI thành
                             # "giảm X%" trong khi sự thật là "từ KHÔNG-THỂ sang đo được".
                             # /acceptance-report sẽ in "baseline chưa ghi" — đọc kèm dòng này.
                             # Đo thật: mốc so sánh đúng là số feature phê duyệt được / tháng,
                             # không phải số phút mỗi lần.
executors:
  test:
    scripts: "bash tests/scripts/run-tests.sh"
    hooks: "bash tests/hooks/run-tests.sh"
    # Bọc lượt 6 release-2-11-0 (owner chọn 11/09): suite plugins in ~70k ký tự và
    # bốn trên năm lượt chấm của hồ sơ đó bị công cụ cắt output giữa chừng rồi agent
    # khai exit 1 (tool-kill). pipefail GIỮ mã thoát của suite; lọc + tail chỉ để
    # đầu ra lọt qua. Suite sập trước dòng «Results:» thì grep không khớp → vẫn ≠ 0.
    plugins: "bash -c 'set -o pipefail; bash tests/plugins/run-tests.sh 2>&1 | grep -E \"FAIL|^Results:\" | tail -n 40'"
    workflows: "bash tests/workflows/run-tests.sh"
  script:
    coverage_lint: "node scripts/eval-coverage-lint.js ."
    # Vật của hồ sơ luu-kho — răng đo sự VẮNG MẶT, đối chứng dương neo vào mốc
    # `truoc-luu-kho-2026-08` (bất biến) chứ không vào origin/main (còn di
    # chuyển). Cùng nếp không-vào-suite-vĩnh-viễn với hai script dưới.
    luu_kho_rang: "bash _acceptance/luu-kho-codex-va-nghi-le-design/luu-kho-rang.sh"
    # AC-11 là một ĐẲNG THỨC số ca, và bốn eval của nó hứa đỏ ghim
    # "so ca lech ky vong: <truoc> -> <sau>". Bốn khoá dưới là chỗ lời hứa đó
    # thành mã: mỗi khoá chạy ĐÚNG MỘT suite (không thêm lượt chạy nào so với
    # trước) rồi đếm và so với bản khai máy-đọc trong contract.md. Chúng chết
    # theo hồ sơ khi merge, cùng nếp không-vào-suite-vĩnh-viễn với luu_kho_rang.
    luu_kho_so_ca_plugins: "bash _acceptance/luu-kho-codex-va-nghi-le-design/so-ca.sh --suite plugins"
    luu_kho_so_ca_workflows: "bash _acceptance/luu-kho-codex-va-nghi-le-design/so-ca.sh --suite workflows"
    luu_kho_so_ca_scripts: "bash _acceptance/luu-kho-codex-va-nghi-le-design/so-ca.sh --suite scripts"
    luu_kho_so_ca_hooks: "bash _acceptance/luu-kho-codex-va-nghi-le-design/so-ca.sh --suite hooks"
    # Vật của hồ sơ cat-hinh-thuc — răng đo sự VẮNG MẶT của một luật hành xử,
    # đối chứng dương neo vào `origin/main`. Cùng nếp không-vào-suite-vĩnh-viễn.
    cat_hinh_thuc_rang: "bash _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh"
    # Vật của hồ sơ doi-hanh-vi-cong-nguoi (1c) — răng lớp MÁY, neo đối chứng
    # dương vào MỐC BẤT BIẾN `BASE-1C` đọc từ contract (không origin/main: sau
    # khi hồ sơ này merge thì needle về 0 ở cả hai đầu và phép đo tự chết).
    # Mỗi chân kèm chiều đỏ chạy qua CHÍNH hàm kiểm trong cùng lượt.
    # Cùng nếp không-vào-suite-vĩnh-viễn với các bộ răng hồ sơ trên.
    rang_1c_g1: "bash _acceptance/doi-hanh-vi-cong-nguoi/rang-1c.sh --chan g1"
    rang_1c_g3: "bash _acceptance/doi-hanh-vi-cong-nguoi/rang-1c.sh --chan g3"
    rang_1c_g4: "bash _acceptance/doi-hanh-vi-cong-nguoi/rang-1c.sh --chan g4"
    rang_1c_manifest: "bash _acceptance/doi-hanh-vi-cong-nguoi/rang-1c.sh --chan manifest"
    rang_1c_so_ca_asserts: "bash _acceptance/doi-hanh-vi-cong-nguoi/rang-1c.sh --chan so-ca-asserts"
    # Vật của hồ sơ veto-co-dau-vet (đợt 2, T3) — răng lớp mã-tiền-định: chạy
    # CHÍNH hook/pre-merge/lõi kiểm trên fixture code-sinh, chiều đỏ cùng lượt.
    # Cùng nếp không-vào-suite-vĩnh-viễn với các bộ răng hồ sơ trên.
    rang_veto_hook_v: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan hook"
    rang_veto_hook_cu: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan hook-cu"
    rang_veto_premerge_dem: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan premerge-dem"
    rang_veto_premerge_sach: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan premerge-sach"
    rang_veto_ghi_nguoc: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan ghi-nguoc"
    rang_veto_vanban: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan vanban"
    rang_veto_so_ca: "bash _acceptance/veto-co-dau-vet/rang-veto.sh --chan so-ca"
    # Vật của hồ sơ release-2-0-0 — cùng nếp không-vào-suite-vĩnh-viễn.
    rang_release_manifest: "bash _acceptance/release-2-0-0/rang-release.sh --chan manifest"
    rang_release_docs: "bash _acceptance/release-2-0-0/rang-release.sh --chan docs"
    rang_release_lan_v: "bash _acceptance/release-2-0-0/rang-release.sh --chan lan-v"
    rang_release_diff: "bash _acceptance/release-2-0-0/rang-release.sh --chan diff-allowlist"
    # Vật của hồ sơ cong-dang-co-cua — BA chân cho phạm vi đã thu (bản 13 chân
    # của làn thẻ trả về ô cùng làn, xem discovery/LAY-VE-LAN-THE.md). Mỗi chân
    # ghim ĐÚNG DÒNG CA trong lưới thường trực + chạy thật, không tin mã thoát
    # của trọn suite. Cùng nếp không-vào-suite-vĩnh-viễn.
    cdcc_loi_thuat: bash _acceptance/cong-dang-co-cua/rang.sh --chan loi-thuat
    cdcc_gioi_han: bash _acceptance/cong-dang-co-cua/rang.sh --chan gioi-han
    cdcc_dang_thuc_lop: bash _acceptance/cong-dang-co-cua/rang.sh --chan dang-thuc-lop
    # Răng hồ sơ duong-lui-phai-song — fixture kho git tạm CODE-SINH (fixture.mjs),
    # mỗi chân mang đối chứng dương + chiều đỏ tiêm vào bản sao trong cùng lượt; dòng
    # lệnh làn ký RÚT từ khối SIGNOFF-LANE-CLAUSE, checker P192 rút từ suite. Cùng
    # nếp không-vào-suite-vĩnh-viễn với các bộ răng hồ sơ trên (lưới thường trực:
    # V07–V10 hooks · LV5 · P192 · additive-only).
    dlps_recheck_vang: bash _acceptance/duong-lui-phai-song/rang.sh --chan recheck-vang
    dlps_lan_v_stale: bash _acceptance/duong-lui-phai-song/rang.sh --chan lan-v-stale
    dlps_h1_rong: bash _acceptance/duong-lui-phai-song/rang.sh --chan h1-rong
    dlps_ky_lan_song: bash _acceptance/duong-lui-phai-song/rang.sh --chan ky-lan-song
    dlps_ky_stale: bash _acceptance/duong-lui-phai-song/rang.sh --chan ky-stale
    dlps_veto_ghi: bash _acceptance/duong-lui-phai-song/rang.sh --chan veto-ghi
    dlps_veto_slot: bash _acceptance/duong-lui-phai-song/rang.sh --chan veto-slot
    dlps_ket_ghi: bash _acceptance/duong-lui-phai-song/rang.sh --chan ket-ghi
    dlps_ky_lan_clause: bash _acceptance/duong-lui-phai-song/rang.sh --chan ky-lan-clause
    dlps_su_lieu: bash _acceptance/duong-lui-phai-song/rang.sh --chan su-lieu
    product_map: "node scripts/product-map.mjs --root . --check"
    # Ca VĨNH VIỄN P200 chạy MỘT khối (ONLY_BLOCK) — cho hồ sơ MỐC PHÁT HÀNH: eval
    # ghim dòng «PASS: P200 …» của chính ca thay vì mã thoát trọn suite plugins
    # (Ngoài-6 của release-2-8-0: «P200 xanh» và «suite xanh» không phân biệt được).
    # Không phải răng riêng của mốc — P200 là ca thường trực, khoá này chỉ khoanh nó.
    # Lọc `grep -F P200` chỉ CHỌN DÒNG để ba dòng cuối của bằng chứng là chính «P200 OK» +
    # «PASS: P200»; mã thoát vẫn là của suite (pipefail) — không phải phép đo mới.
    p200_cat_so: "bash -c 'set -o pipefail; ONLY_BLOCK=P200 bash tests/plugins/run-tests.sh | grep -F P200'"
    cat_khoi_rang_khuon: bash _acceptance/cat-khoi-viec-cua-anh-tren-tin/cat-khoi-rang.sh --chan khuon
    cat_khoi_rang_clause: bash _acceptance/cat-khoi-viec-cua-anh-tren-tin/cat-khoi-rang.sh --chan clause
    cat_khoi_rang_oneshot: bash _acceptance/cat-khoi-viec-cua-anh-tren-tin/cat-khoi-rang.sh --chan oneshot
    cat_khoi_so_ca: bash _acceptance/cat-khoi-viec-cua-anh-tren-tin/cat-khoi-rang.sh --chan so-ca
    rang_hinh_cong1: bash _acceptance/hinh-tai-cong-1/rang.sh
    rang_siet_rang: bash _acceptance/siet-rang-cau-ve-hinh/rang.sh
    rang_arm_guide: bash _acceptance/status-chua-arm-cong/rang.sh
    # Vật của hồ sơ tool-kill-duong-doc-lap — răng một-nguồn luật tool-kill (mỗi chân
    # kèm chiều đỏ cùng lượt). Cùng nếp không-vào-suite-vĩnh-viễn.
    rang_tkddl_nguon: bash _acceptance/tool-kill-duong-doc-lap/rang.sh --chan nguon
    rang_tkddl_w25: bash _acceptance/tool-kill-duong-doc-lap/rang.sh --chan w25
    rang_tkddl_skill_fl: bash _acceptance/tool-kill-duong-doc-lap/rang.sh --chan skill-fl
    rang_tkddl_skill_acc: bash _acceptance/tool-kill-duong-doc-lap/rang.sh --chan skill-acc
    # Vật của hồ sơ start-bang-dieu-khien — răng neo vào SỰ THẬT CỦA CÂY hôm nay
    # (16 hồ sơ cửa veto mở · 57 hồ sơ ra được ngày) hoặc phải dựng kho git riêng.
    # Mỗi chân kèm chiều đỏ cùng lượt. Cùng nếp không-vào-suite-vĩnh-viễn với các
    # bộ răng hồ sơ trên — chúng chết theo hồ sơ khi merge.
    # Vật của hồ sơ design-pass-nac-khong-dong-bo — răng «câu chết phải chết», đối
    # chứng dương neo vào mốc git CỐ ĐỊNH đọc từ contract (neo origin/main thì sau khi
    # hồ sơ gộp, hai đầu cùng 0 mà vẫn xanh). Cùng nếp không-vào-suite-vĩnh-viễn.
    dpnkdb_cau_chet: bash _acceptance/design-pass-nac-khong-dong-bo/rang-cau-chet.sh
    bdk_rang_at: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan at
    bdk_rang_veto: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan veto-ten
    bdk_rang_dang_thuc: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan dang-thuc
    bdk_rang_bon_bo_doc: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan bon-bo-doc
    bdk_rang_ahead_behind: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan ahead-behind
    bdk_rang_sort_tuoi: bash _acceptance/start-bang-dieu-khien/rang-bdk.sh --chan sort-tuoi
    # Vật của hồ sơ lan-may-song-qua-bo-phan-loai — răng «không nuốt cấu hình khác»,
    # so bản settings ở mốc git CỐ ĐỊNH với bản trong cây. CỐ Ý không vào suite vĩnh
    # viễn: để trong bộ kiểm thường trực thì mọi sửa hợp lệ về sau của enabledPlugins
    # / extraKnownMarketplaces (do hồ sơ KHÁC làm) sẽ làm suite đỏ oan.
    lm_khong_nuot: bash _acceptance/lan-may-song-qua-bo-phan-loai/rang-khong-nuot.sh
    # Vật của hồ sơ thuoc-nhan-de-khoi — răng cho thước nhãn-đè-khối. Chân
    # ba-ca-that neo mốc BẤT BIẾN BASE-TNK (848adc92, bản trước-sửa) chứ không
    # origin/main: sau khi hồ sơ merge thì hai đầu cùng sạch và phép đo tự chết.
    # CỐ Ý không vào suite vĩnh viễn vì thế — lưới thường trực là case
    # tests/scripts/label-occlusion.test.mjs (fixture code-sinh mỗi lần chạy).
    tnk_rang_hai_chieu: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan hai-chieu
    tnk_rang_ba_ca_that: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan ba-ca-that
    tnk_rang_nhan_con_song: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan nhan-con-song
    tnk_rang_fill_trong_suot: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan fill-trong-suot
    tnk_rang_html_inline: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan html-inline
    tnk_rang_suite_case: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan suite-case
    tnk_rang_taste_gate: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan taste-gate
    tnk_rang_quet_vung_ngoai: bash _acceptance/thuoc-nhan-de-khoi/rang.sh --chan quet-vung-ngoai
    # Vật của hồ sơ nhanh-chinh-khong-ten-main — mỗi chân dựng repo git thật
    # trong chính lần chạy; bản sao để tiêm đột biến chụp CÂY LÀM VIỆC (trọn
    # thư mục), không dựng từ HEAD. Cùng nếp không-vào-suite-vĩnh-viễn.
    nckt_master_khong_remote: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan master-khong-remote
    nckt_nhanh_la_cau_huong_dan: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan nhanh-la-cau-huong-dan
    nckt_doc_bat_buoc_van_dong: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan doc-bat-buoc-van-dong
    nckt_remote_tra_loi: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan remote-tra-loi
    nckt_ci_single_branch: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan ci-single-branch
    nckt_khong_doan_sang_ten_khac: bash _acceptance/nhanh-chinh-khong-ten-main/rang.sh --chan khong-doan-sang-ten-khac
    # Vật của hồ sơ suite-run-log-provenance — răng hồ sơ cho lớp «lệnh suite
    # không để lại dấu vết». Chiều đỏ dựng bằng bản sao TRỌN CÂY (git archive
    # HEAD) do code sinh trong chính lần chạy, KHÔNG neo mốc di động. Cố ý
    # không vào suite vĩnh viễn: lưới thường trực là các ca trong
    # tests/workflows/acceptance-verify.test.mjs.
    srlp_rang_suite_case: bash _acceptance/suite-run-log-provenance/rang.sh --chan suite-case
    srlp_rang_hai_chieu: bash _acceptance/suite-run-log-provenance/rang.sh --chan hai-chieu
    srlp_rang_va_cham_ten: bash _acceptance/suite-run-log-provenance/rang.sh --chan va-cham-ten
    srlp_rang_ket_qua_rieng: bash _acceptance/suite-run-log-provenance/rang.sh --chan ket-qua-rieng
    srlp_rang_thu_tu: bash _acceptance/suite-run-log-provenance/rang.sh --chan thu-tu
    srlp_rang_day_khep: bash _acceptance/suite-run-log-provenance/rang.sh --chan day-khep
    srlp_rang_khong_hoi_quy: bash _acceptance/suite-run-log-provenance/rang.sh --chan khong-hoi-quy
    srlp_rang_bo_doc: bash _acceptance/suite-run-log-provenance/rang.sh --chan bo-doc
    itgk_goc_kho_giu: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan goc-kho-giu
    itgk_thieu_exit_2: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan thieu-exit-2
    itgk_duong_cu_goi_y: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan duong-cu-goi-y
    itgk_abs_hai_chieu: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan abs-hai-chieu
    itgk_lane_doc_khong_doi: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan lane-doc-khong-doi
    itgk_tai_lieu_khong_con_duong_cu: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan tai-lieu-khong-con-duong-cu
    itgk_bang_chung_cung_ho_so: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan bang-chung-cung-ho-so
    itgk_thu_muc_khong_phai_file: bash _acceptance/inputs-tinh-tu-goc-kho/rang.sh --chan thu-muc-khong-phai-file
    # --- co-qua-timebox-nhom-da-xong (06/09) --- RT13 chay rieng + bat bien o (khoi rieng, cuoi executors.script)
    cqt_rt13: "RT_CASES=RT13 node tests/plugins/ra-co-ten.test.mjs"
    cqt_o_khong_doi: 'RT_CASES=RT13 node tests/plugins/ra-co-ten.test.mjs && node scripts/product-map.mjs --root . --check && test -z "$(git status --porcelain PRODUCT-MAP.md)"'
    # --- thuoc-khai-mot-dang-do-mot-neo (06/09) --- hai thuoc da va (khoi rieng, cuoi executors.script)
    # KHONG sinh khoa song song cho nhom lane: o do tro thang itgk_lane_doc_khong_doi
    # (chinh khoa dang do) — gap-probe P0, khoa moi viet dung se che loi tang giai chuoi.
    # Selector phai la chuoi DUY NHAT: chuoi 'P86' khop CA HAI khoi (P86 S1 ... va
    # P86 GATE-MODEL), nen doi ten rieng khoi GATE-MODEL van cho exit 0 voi 0 dong
    # MUTANT — hoi dong S4 vong 4 pha thu ra. 'P86 GATE-MODEL' chi khop mot khoi.
    tkm_p86: 'ONLY_BLOCK="P86 GATE-MODEL" bash tests/plugins/run-tests.sh'
