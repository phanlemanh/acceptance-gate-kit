risk_tiers:
  t1_skip_globs:
    # Chỉ docs THẬT. Không dùng "*.md" — xem ghi chú 2 ở đầu file.
    - "docs/**"
    - "README.md"
    - "GUIDE.md"
    - "QUICKSTART.md"
    - "CHANGELOG.md"
    - "CONTEXT.md"
    - "CLAUDE.md"
    # Giấy phép + công bố vendor (05/09, lối B — ADR 0013). Văn xuôi pháp lý
    # thuần: KHÔNG code path nào đọc hai file này, nên chúng không phải hành vi
    # của cổng. QUYẾT ĐỊNH cấp phép thì ngược lại — khó-đảo, và nó đã đi qua
    # cổng người rồi (owner quyết 05/09, ghi ADR 0013); hai file dưới chỉ là
    # BẢN CHIẾU của quyết định đó. Liệt ĐÍCH DANH, không glob: `*.md` hay
    # `NOTICE*` sẽ nuốt cả NOTICE của cây vendor — mà tree-hash trong đó LÀ
    # răng (P196). ĐIỀU KIỆN THU HỒI: ngày có script/CI đọc LICENSE hoặc NOTICE
    # làm dữ liệu, hai dòng này phải GỠ trong cùng PR cắm.
    - "LICENSE"
    - "NOTICE"
    # Hồ sơ đề xuất đã TỪ CHỐI (CLAUDE.md). Văn xuôi thuần, không có hành vi —
    # để ngoài danh sách này thì mỗi lần ghi một quyết định-không-làm lại làm
    # evidence stale và tốn một vòng S4.
    - ".out-of-scope/**"
    # Ca đo skill cho `claude plugin eval` (30/08). T1 vì đang TRƠ: harness
    # early access chưa bật cho org, không đường code/CI nào của kit đọc
    # evals/. ĐIỀU KIỆN THU HỒI: ngày plugin eval được bật và evals/ cắm vào
    # CI làm răng, dòng này phải GỠ trong cùng PR cắm — lúc đó ca đo LÀ hành
    # vi của thước, hết là văn xuôi.
    - "evals/**"
    # Bản đồ sản phẩm — view máy sinh, cùng vai với mirror (ADR 0007). Không
    # miễn trừ thì chính commit chữ ký Cổng 2 (nó kèm bản đồ vừa vẽ lại) tự làm
    # bằng chứng stale và chặn merge, thành vòng không thoát. An toàn vì
    # `product-map.mjs --check` trong CI canh `bản đồ == hồ sơ` độc lập, y như
    # P30 canh `mirror == nguồn`; case P126 là RED bắt buộc chứng minh điều đó.
    - "PRODUCT-MAP.md"
    # Trang lộ trình — view MÁY SINH cạnh bản đồ (cùng bộ dựng product-map), không phải hành vi.
    - "LO-TRINH.html"
    # Bản ghi mốc ĐỊNH TUYẾN (ADR 0019, 15/09 — cùng điều kiện ADR 0007). Nó là
    # view MÁY SINH: `tests/scripts/routing-baseline.mjs --slug <s> --write` dựng
    # dòng bằng chính `gate-card.js --extract`, và ca LM20 canh drift độc lập —
    # sửa tay là LM20 đỏ. Không miễn trừ thì CHÍNH commit chữ ký (hồ sơ mới ký
    # vào diện quét LM20 → baseline phải thêm dòng) làm bằng chứng hoá cũ và
    # pre-merge chặn không lối ra — đúng vòng lặp mà ADR 0007 đã giải cho bản đồ.
    # ĐIỀU KIỆN THU HỒI: ngày LM20 thôi canh tệp này, hoặc dòng của nó được viết
    # tay trở lại, dòng dưới phải GỠ trong cùng PR.
    - "tests/scripts/fixtures/routing-baseline.txt"
    # CHỈ gate.yml, KHÔNG phải ".github/**" — miễn trừ HẸP có chủ đích
    # (2026-08-15): việc bảo trì CI thuần (bump actions/checkout@vN khi runner
    # khai tử Node cũ) không đáng một vòng nghiệm thu — cổng mà câu trả lời hợp
    # lý duy nhất là «ừ» là trạm thu phí. Nhưng KHÔNG mở rộng thành glob cả thư
    # mục: file workflow quyết định cổng CÓ CHẠY HAY KHÔNG, miễn trừ rộng là mở
    # đường fail-open. Ai sửa gate.yml theo hướng đổi HÀNH VI cổng (thêm/bớt
    # bước, đổi cờ) vẫn phải tự giác đi vòng nghiệm thu — reviewer PR là chốt
    # còn lại cho ca đó.
    - ".github/workflows/gate.yml"
  t3_paths:
    # Lõi cưỡng chế: bug ở đây biến thành false-green im lặng trên MỌI repo tiêu thụ.
    - "hooks/**"
    - "lib/**"
    - "scripts/pre-merge-check.sh"
    - "scripts/recheck-evidence.cjs"
signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]   # approvers: informational — KHÔNG được cổng cưỡng chế.
                             # Bốn bản vá 2026-07-28/29 cố đọc khoá này từ YAML bằng
                             # công cụ text của shell đều hỏng theo một hình dạng hợp
                             # lệ mới, nên cả lớp bị gỡ. Chữ ký VẪN bị kiểm: không
                             # được rỗng và không được khớp bảng tiền tố giữ-chỗ.
  # require_human_commit ĐÃ GỠ 16/08 (ADR 0012): chữ ký là quyết định người
  # phát ngôn, máy ghi hộ và commit một lượt; trách nhiệm đọc ở forge.
feature_loop:
  suite_keys:
    # Chạy mỗi vòng verify. Ba suite + cổng chống trôi từ vựng.
    # Khoá `mirror_sync` đã CHẾT cùng mirror (hồ sơ luu-kho, Cổng 1 duyệt
    # 12/08): `plugins/` chỉ tồn tại cho harness Codex, gỡ Codex thì mirror
    # thành 125 file máy sinh không ai đọc, và P30 thành lưới canh sự khớp của
    # thứ vô dụng. Xoá khoá ở ĐÂY là bắt buộc: để lại một suite_key trỏ executor
    # không còn định nghĩa là gỡ-một-nửa, và runner sẽ đỏ vì hạ tầng chứ không
    # vì vật.
    # Suite scripts đi vào lượt chấm qua BỐN MẢNH (hồ sơ ha-tang-khong-dot-luot): nguyên
    # khối nó qua trần 600 s của công cụ chạy lệnh trong tác tử chấm.
    - executors.test.scripts_bash
    - executors.test.scripts_mjs_1
    - executors.test.scripts_mjs_2
    - executors.test.scripts_mjs_3
    - executors.test.hooks
    # Suite plugins cũng vào lượt chấm qua BA VÙNG (AC-8) — trọn khối nó trên 80 % trần.
    - executors.test.plugins_vung_1
    - executors.test.plugins_vung_2
    - executors.test.plugins_vung_3
    # Lớp thuần của 2 workflow script (verdict routing, dedupe, carry-forward,
    # scope-triage) — harness vm-realm, không sinh agent nào.
    - executors.test.workflows
    # Bản đồ sản phẩm phải khớp hồ sơ xưởng — pattern P30 cho một view máy sinh.
    - executors.script.product_map
    # Kiểm bản cài (hồ sơ kiem-ban-cai-sau-phat-hanh, hàng KC1): CHỈ chạy trọn ở lượt chấm hồ sơ cắt mốc —
    # số trong .claude-plugin/plugin.json ở HEAD khác gốc vòng; vòng thường in một dòng «BỎ QUA», < 1 s.
    # Bản cài của cây sẽ gắn tag hỏng → lượt chấm mốc đỏ → không cắt số.
    - executors.test.kiem_ban_cai_moc
# Ổ cắm lộ trình của chính kit (hồ sơ trang-lo-trinh-doc-mot-phut; bật ở chiến dịch ghim lại 2.25.0 —
# hẹn với owner 08/10). Khối chan_troi trong tệp là trường tự do, trang không hiện.
lo_trinh:
  tep: docs/plans/lo-trinh-kit.json
# Tầng tri thức của chính kit (mục chờ điều kiện TT-C5/F5; chủ kho bật 26/10 — kế hoạch
# docs/plans/2026-10-26-ke-hoach-design-floor-tiep.md, bước 1). Kho này CÔNG KHAI nên gốc tri thức là kho riêng
# đi kèm; `duong` tương đối gốc checkout chính (cha của git-common-dir), không theo worktree.
tri_thuc:
  cong_khai: true
  kho:
    ten: acceptance-gate-kit-tri-thuc
    duong: ../acceptance-gate-kit-tri-thuc
    remote: https://github.com/phanlemanh/acceptance-gate-kit-tri-thuc.git

# Gói đợt của gói dieu-phoi (dieu-phoi/README.md): `{ten}` thay bằng tên đợt khi mở bằng /dieu-phoi:mo-dot.
dieu_phoi:
  goi_dot: docs/plans/dot-{ten}
