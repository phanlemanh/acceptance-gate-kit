schema_version: 1
feature_slug: dai-tom-tat-doc-dung
# Ca đo sống ở tests/scripts/dai-tom-tat.test.mjs (DT-1..DT-8, DT-11) — executor `executors.test.dai_tom_tat`
# thêm ở S3 — và tests/scripts/dai-tom-tat-crm.mjs (DT-9, cần kho crm trên máy nên KHÔNG mang đuôi
# .test.mjs, không vào suite) — executor `executors.test.dai_tom_tat_crm`. Kho thử do mã sinh trong lượt
# (thư mục tạm, đường dẫn suy từ vị trí tệp test); ô cơ hội do CHÍNH `lo-trinh.mjs --mo-o` ghi; gạch giới
# hạn mẫu của DT-8 rút từ khối KNOWN-LIMITS-NOTE của commands/signoff.md. Mỗi ca đỏ chạy CHÍNH hàm đo trên
# bản sao cây có ho-so-tom-tat.cjs bị tiêm, SAU khi bản lành xanh trên cùng kho thử, và ghim thông điệp rút
# từ đầu ra của hàm đo. Mỗi eval ghim đúng dòng "PASS: DT-…".
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dai_tom_tat
    paths: [scripts/ho-so-tom-tat.cjs, scripts/evidence-page.js, scripts/lo-trinh.mjs, tests/scripts/dai-tom-tat.test.mjs]
    expected: >
      exit 0; stdout có "PASS: DT-1" — kho thử KHÔNG khai nhánh production, không dòng thuc-te: ô production
      của trang hồ sơ (bộ đọc HTML độc lập trong ca) VÀ của khối lo-trinh-du-lieu (docDuLieu) == «chưa ghi
      quan sát production»; thêm dòng thuc-te → cả hai == câu reality viết sẵn; bỏ decisions.jsonl → ô null
      và «decisions.jsonl» trong thieu. Và "PASS: DT-1-do" — bản sao bật suy triển khai cho kho không khai:
      CHÍNH hàm đo trả lỗi nêu «kho không khai».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dai_tom_tat
    paths: [scripts/ho-so-tom-tat.cjs, scripts/evidence-page.js, tests/scripts/dai-tom-tat.test.mjs]
    expected: >
      exit 0; stdout có "PASS: DT-2" — hợp đồng thử có một gạch «Known limits — anh chọn ở Cổng Bằng chứng
      …:» với 13 gạch con (câu sinh trong ca), báo cáo `## Known limits` rỗng: chua_lam kết «13 giới hạn đã
      biết»; mục gioi-han của trang hồ sơ có đúng 13 dòng data-loai="gioi-han" == 13 câu theo thứ tự; Notes
      chỉ nhắc «known limits» giữa câu → chua_lam == «2 mục để ngoài phạm vi · giới hạn đã biết: chưa đọc
      được — Notes nhắc giới hạn sai khuôn»; một gạch giới hạn + một chỗ nhắc → «… · 1 giới hạn đã biết
      (Notes còn chỗ nhắc giới hạn sai khuôn)». Và "PASS: DT-2-do" — bản sao chỉ đọc Known limits của báo
      cáo: CHÍNH hàm đo trả lỗi nêu «13»; "PASS: DT-2-do-co" — bản sao bỏ cờ: CHÍNH hàm đo trả lỗi nêu «không
      được in 0».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
