  - id: E10
    criterion: AC-10
    executor: judgment
    inputs: [skills/acceptance/references/lo-trinh-du-lieu.md, scripts/ho-so-tom-tat.cjs, lib/md-section.cjs]
    paths: [skills/acceptance/references/lo-trinh-du-lieu.md, scripts/ho-so-tom-tat.cjs, lib/md-section.cjs]
    question: >
      Đọc mô tả các ô moi_nguoi.production, moi_nguoi.chua_lam, moi_nguoi.vi_sao trong
      lo-trinh-du-lieu.md và so với mã của tomTatHoSo trong ho-so-tom-tat.cjs (hàm section/contentLines nó gọi ở lib/md-section.cjs). Mô tả có nói đúng (1) các câu
