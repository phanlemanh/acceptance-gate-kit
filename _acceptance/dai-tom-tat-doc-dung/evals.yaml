      khai / chưa gộp / chưa đọc được) — và rằng «đã thấy chạy» chỉ từ dòng người ghi, (2) hai nguồn giới
      hạn (Known limits của báo cáo, khối giới hạn trong Notes của hợp đồng) và luật lấy nguồn nhiều mục
      hơn, cùng cờ khi Notes nhắc giới hạn sai khuôn, (3) vế «để ngoài phạm vi», (4) câu dẫn +
      danh sách và trần 400 ký tự của ô vì sao — không câu nào trong tài liệu mâu thuẫn với mã?
    expected: PASS khi cả bốn vế đúng; nêu câu cụ thể nếu sai.
