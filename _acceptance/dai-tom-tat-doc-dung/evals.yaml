    expected: >
      exit 0; stdout có "PASS: DT-6" — ô cơ hội do `lo-trinh.mjs --mo-o` ghi, mục «Vấn đề & ai gặp» thay
      bằng (a) câu dẫn «… ba chỗ hở:» + ba gạch mở bằng cụm in đậm → vi_sao == câu dẫn + « » + ba cụm nối
      « · » viết sẵn; (b) câu dẫn + hai gạch thường nhiều câu → câu dẫn + câu đầu mỗi gạch viết sẵn; (c) đoạn
      kết «:» rồi một đoạn văn (không danh sách) → vi_sao == đoạn đó nguyên văn; (d) câu dẫn kết `…chỗ hở:**`
      («:» trong dấu nhấn) + danh sách → câu dẫn (đã bỏ dấu nhấn) + các mục nối « · » viết sẵn; (e) câu dẫn
      + bảng (hàng tiêu đề, hàng phân cách, hai hàng) → câu dẫn + ô đầu hai hàng; ca (a)(b)(d)(e) không kết «:». Và "PASS: DT-6-do" — bản sao trả lại đoạn đầu trơn: CHÍNH hàm đo trả lỗi nêu ca (a);
      "PASS: DT-6-do-nhan" — bản sao dò «:» trước khi bỏ dấu nhấn: CHÍNH hàm đo trả lỗi nêu ca (d).
