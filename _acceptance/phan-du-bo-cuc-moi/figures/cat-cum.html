<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cắt cụm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 860px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">So sánh hai nhánh · Cổng Phạm vi · Hỏi-1 (d-…-10) · AC-9 · AC-10</p>
    <h1>Cắt làm hai vòng, hay một vòng cho cả 413 khoá?</h1>

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="500" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi-1 · cắt cụm?</text>

      <rect x="40" y="152" width="440" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>

      <text x="56" y="488" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif">272 khoá</text>
      <text x="164" y="488" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">25 tệp kiểm · mang AC-9, AC-10 (dời)</text>
      <rect x="56" y="520" width="396.48" height="12" rx="2" fill="rgba(45,49,66,0.06)"/>
      <rect x="56" y="520" width="261.12" height="12" rx="2" fill="#4f5d75"/>
      <text x="56" y="552" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">272 / 413</text>

      <text x="536" y="208" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Mọi cụm trong một lượt</text>

      <text x="536" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MỘT VÒNG</text>
      <text x="536" y="284" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">mọi cụm vòng nhận, cùng lúc</text>
      <text x="536" y="320" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif">413 khoá</text>
      <text x="644" y="320" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">≈ 50 tệp kiểm</text>
      <text x="536" y="360" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· một PR</text>
      <text x="536" y="384" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· một lượt ghim lại</text>
      <text x="536" y="408" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· AC-9, AC-10 ở lại vòng này</text>
      <rect x="536" y="520" width="396.48" height="12" rx="2" fill="#4f5d75"/>
      <text x="536" y="552" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">413 / 413</text>

      <!-- ===== Trục dưới — mốc ===== -->
      <line x1="40" y1="608" x2="960" y2="608" stroke="#bfc0c0" stroke-width="1"/>
      <line x1="40" y1="600" x2="40" y2="616" stroke="#4f5d75" stroke-width="1"/>

      <text x="40" y="636" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">15/11/2026 · Cổng Đáng ký</text>
      <text x="960" y="636" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04/12/2026 · gộp chậm nhất</text>
      <text x="500" y="636" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">timebox của vòng: gộp trước lượt đo lại của B2</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="656" x2="960" y2="656" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="40" y="672" width="32" height="12" rx="2" fill="#4f5d75"/>
      <text x="80" y="682" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">thanh = số khoá đích, cùng một thang (cả thanh = 413)</text>
      <text x="960" y="682" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">cắt thì AC-9, AC-10 dời sang vòng kế</text>
    </svg>
    <p class="colophon">Nguồn: docs/superpowers/specs/2026-11-15-phan-du-bo-cuc-moi-design.md §6 · contract.md (Notes, Đường đo) · figures/index.md · commit afaa3cf3</p>
