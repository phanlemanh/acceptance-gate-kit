<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làn V đọc sổ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ho-so-khep-thoi-hoi · AC-4 · AC-5 · AC-8</p>
    <h1>Làn máy-đi-trước đọc sổ quyết trước khi gọi người</h1>

    <svg viewBox="0 0 1140 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Mũi tên (vẽ trước, nằm sau nút) -->
      <!-- Bắt đầu → Quyết 1 -->
      <line x1="220" y1="204" x2="260" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Quyết 1: KHÔNG → lên, sang phải → Kết cục 1 -->
      <path d="M380,144 V88 Q380,80 388,80 H860" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Quyết 1: CÓ → Quyết 2 -->
      <line x1="500" y1="204" x2="560" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Quyết 2: CÓ → Kết cục 2 (lối mới, tiêu điểm) -->
      <line x1="800" y1="204" x2="860" y2="204" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Quyết 2: KHÔNG → xuống, sang phải → Kết cục 3 -->
      <path d="M680,264 V348 Q680,356 688,356 H860" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhãn mũi tên -->
      <rect x="592" y="58" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="620" y="69" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="512" y="178" width="36" height="14" rx="2" fill="#f5f5f5"/>
      <text x="530" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="812" y="178" width="36" height="14" rx="2" fill="#f5f5f5"/>
      <text x="830" y="189" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="688" y="298" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="714" y="309" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <!-- Bắt đầu -->
      <rect x="40" y="176" width="180" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="176" width="180" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="130" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ chưa ký,</text>
      <text x="130" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">báo cáo sạch</text>

      <!-- Quyết 1 -->
      <polygon points="380,144 500,204 380,264 260,204" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tệp phát hiện có mục</text>
      <text x="380" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ngoài hợp đồng?</text>

      <!-- Quyết 2 (quyết mới của vòng này) -->
      <polygon points="680,144 800,204 680,264 560,204" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi mục đã có dòng</text>
      <text x="680" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">quyết của người trong sổ?</text>

      <!-- Kết cục 1 -->
      <rect x="860" y="52" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="860" y="52" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="980" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Làn máy-đi-trước</text>
      <text x="980" y="92" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như cũ, không gọi người</text>

      <!-- Kết cục 2 (tiêu điểm) -->
      <rect x="860" y="168" width="240" height="72" rx="28" fill="#f5f5f5"/>
      <rect x="860" y="168" width="240" height="72" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="980" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Làn máy-đi-trước</text>
      <text x="980" y="208" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">người đã quyết rồi, không hỏi lại</text>
      <text x="980" y="224" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ghim-lai-tren-lop-cu · crm quyen-luot-mang-theo</text>

      <!-- Kết cục 3 -->
      <rect x="860" y="320" width="240" height="72" rx="28" fill="#f5f5f5"/>
      <rect x="860" y="320" width="240" height="72" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="980" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn cần người</text>
      <text x="980" y="360" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thẻ hỏi: ký hay trả lại</text>
      <text x="980" y="376" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">co-qua-timebox-nhom-da-xong · 7 mục</text>

      <!-- Chú thích: hai lối đã loại (nét mờ) -->
      <line x1="40" y1="424" x2="1100" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HAI LỐI ĐÃ LOẠI</text>

      <g opacity="0.55">
        <rect x="40" y="456" width="500" height="28" rx="6" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="56" y="474" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">Chặt</tspan> — mọi mục đòi chữ ký → CI của crm đỏ ngay ngày cài</text>
        <rect x="600" y="456" width="500" height="28" rx="6" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="616" y="474" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">Ân xá theo ngày</tspan> — lỗ vẫn mở cho hồ sơ cũ</text>
      </g>

      <!-- Chú giải -->
      <line x1="40" y1="508" x2="1100" y2="508" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="140" y="524" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="172" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm vào / kết cục</text>
      <polygon points="300,530 312,524 324,530 312,536" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi máy tự trả lời</text>
      <line x1="480" y1="530" x2="508" y2="530" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối mới vòng này thêm: đọc sổ thay vì gọi lại người</text>
      <rect x="800" y="524" width="24" height="12" rx="4" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>
      <text x="832" y="534" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối đã loại</text>
    </svg>
  </div>
</body>
</html>
