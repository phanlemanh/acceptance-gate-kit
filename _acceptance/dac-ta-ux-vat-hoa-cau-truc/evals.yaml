schema_version: 1
feature_slug: dac-ta-ux-vat-hoa-cau-truc
# Hai bộ đo, cùng nếp các hồ sơ trước:
#   · suite `scripts` — case W8 vào suite vĩnh viễn (lint là vật vĩnh viễn).
#   · suite `plugins` — khuôn/SKILL round-trip + khớp chuỗi miễn.
# MỌI eval máy khai chiều đỏ trên CÙNG fixture code-sinh + thông điệp ghim
# (AC-11 là luật lớp, được chứng bởi chính expected của E2, E6–E9).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/acceptance/references/ux-spec-template.md, tests/plugins/ux-spec.test.mjs]
    expected: >
      exit 0; stdout có "PASS: UX1". Case mở khuôn qua marker UX-SPEC-TEMPLATE,
      kiểm đủ 6 mục theo TIÊU ĐỀ mục (không đếm chữ), marker con UX-STATE-TABLE
      tồn tại bên trong, và đầu khuôn có đúng chuỗi cửa miễn "bỏ đặc-tả-UX — ".
      Đối chứng dương: khuôn nguyên vẹn XANH. Chiều đỏ KHÔNG tautology: (1) gỡ
      marker khỏi bản sao → dựng fixture từ bản sao và chạy CHÍNH
      eval-coverage-lint — reader thật phải bật W8a ghim NGUYÊN CÂU "thiếu bảng
      UX-STATE-TABLE (marker)" (không dùng mảnh chuỗi cũng có trong dòng chú giải);
      (2) gỡ TRỌN mục «### 6. Khuôn IA đã chọn + căn cứ» → CÙNG bộ kiểm tiêu-đề
      của chiều xanh trượt đúng mục đó trong khi mục khác vẫn xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/acceptance/references/ux-spec-template.md, tests/plugins/ux-spec.test.mjs, scripts/eval-coverage-lint.js]
    expected: >
      exit 0; stdout có "PASS: UX2-trich" — thực thi trong case UX1: TRÍCH section
      từ CHÍNH ux-spec-template.md qua marker rồi «điền» bằng luật bỏ-ngoặc, bảng
      trạng thái mẫu rút ra ≥2 dòng và cả hai marker còn nguyên trong bản trích.
      Chiều đỏ: bản sao đổi tên marker → bộ trích thấy section mất UX-STATE-TABLE
      (cùng bộ kiểm của chiều xanh, khác input).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    paths: [feature-loop/skills/feature-loop/SKILL.md, tests/plugins/ux-spec.test.mjs]
    expected: >
      exit 0; stdout có "PASS: UX3". Case đo QUAN HỆ trong SKILL.md: (a) S1 có
      chỉ dẫn điền «Đặc tả UX» TRƯỚC khi sinh 3 artifact và resolve khuôn qua
      resolve-plugin.mjs (cấm hardcode path cache); (b) chỉ dẫn contract ghi
      design_doc: và trỏ đúng cánh W8a (không hứa cánh đã cắt); (c) nghi thức hình Cổng 1 có câu vẽ từ
      section Đặc tả UX; (d) chuỗi «dòng state-matrix» cũ không còn đứng ngoài
      con trỏ về khuôn (một nguồn). Mỗi mệnh đề là một PHÉP KIỂM chạy trên MỘT chuỗi (bản thật hoặc bản sao),
      nên chiều đỏ đi qua đúng bộ kiểm của chiều xanh — không assert chuỗi rời
      trên toàn file. Đối chứng dương: SKILL hiện tại xanh cả 5 mệnh đề. Chiều
      đỏ, BỐN mutant trên bản sao — mỗi mệnh đề đo được đều có mutant: (1) gỡ
      TRỌN câu «Kế đó, VẪN TRƯỚC khi sinh 3 artifact: …» → (a) và (b) cùng đỏ;
      (2) đổi "vẽ TỪ section Đặc tả UX" → (c) đỏ; (3) thay mệnh đề resolve
      bằng đường plugins/cache cứng → (a2) đỏ; (4) chèn một câu «dòng
      state-matrix» mồ côi xa con trỏ → (d) đỏ (d quét MỌI lần xuất hiện).
      Mọi mệnh đề tuyên ở đây đều CÓ mutant thật trong code test — không vế nào
      chỉ nằm trong nhãn PASS.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: [feature-loop/skills/feature-loop/SKILL.md, skills/acceptance/references/ux-spec-template.md, tests/plugins/ux-spec.test.mjs]
    expected: >
      exit 0; stdout có "PASS: UX4". Chuỗi miễn "bỏ đặc-tả-UX — " xuất hiện
      trong CẢ SKILL.md lẫn ux-spec-template.md và khớp từng ký tự — hai TÀI LIỆU
      chép cùng một chuỗi, bên đọc là NGƯỜI và ván thử; engine KHÔNG có reader
      cho chuỗi này (đã khai ở AC-4), nên eval chỉ hứa đúng phần đo được. Chiều đỏ trên bản sao: đổi một bên
      thành "bỏ dac-ta-ux — " → CÙNG bộ kiểm của chiều xanh (một hàm, hai
      input) báo "chuỗi miễn lệch giữa SKILL và khuôn" — không tautology.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: judgment
    question: >
      Đọc mục «Khuôn IA đã chọn + căn cứ» trong ux-spec-template.md và đoạn tra
      mẫu trong S1 của feature-loop SKILL.md: (1) thang hai nấc (có công cụ tra
      mẫu → tra + ghi vết; không có → danh sách khuôn IA có tên) có được dạy đúng
      và KHÔNG tạo phụ thuộc cứng vào công cụ nào không? (2) vết tra mẫu (mục «Khuôn IA + căn cứ») có nằm ở chỗ người đọc
      được tại cổng không — biết rằng vòng này CỐ Ý không cho máy kiểm nội dung
      căn cứ (đã thu phạm vi), nên câu hỏi là vị trí và độ rõ của vết?
      (3) luật «chỉ tra khi không tự chắc» có đủ rõ để không thành trạm thu phí
      cho luồng hiển nhiên không?
    inputs: [../../skills/acceptance/references/ux-spec-template.md, ../../feature-loop/skills/feature-loop/SKILL.md]
    expected: cả ba câu YES với trích dẫn dòng cụ thể; câu nào NO → nêu đúng đoạn thiếu
    evidence_required: [run_id, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: judgment
    question: >
      Đọc các case UX1, UX3, UX4 trong tests/plugins/ux-spec.test.mjs: có ca nào
      chỉ có assertion âm tính một mình (thiếu đối chứng dương), fixture nào
      viết tay thay vì rút-từ-writer, ghim nào thoả bởi thứ khác cảnh báo thật,
      hay chiều đỏ nào là tautology (mutation và assertion cùng một thao tác)?
      LƯU Ý PHẠM VI: vòng này CỐ Ý không có phép đo máy nào cho đặc tả UX (cắt
      trọn 24/08, hạt giống docs/plans/2026-08-24-hat-giong-khop-vong-dac-ta-ux.md)
      — đừng báo sự VẮNG MẶT của lưới là thiếu sót; chỉ soi 6 tiêu chí hiện có.
    inputs: [../../tests/plugins/ux-spec.test.mjs]
    expected: NO cho cả ba câu (không chỗ nào); có chỗ → liệt kê đúng case
    evidence_required: [run_id, verifier, verified_at, output]
