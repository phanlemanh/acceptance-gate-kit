<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 352" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- spine + drops (arrows first) -->
      <line x1="16" y1="64" x2="976" y2="64" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="90"  y1="68" x2="90"  y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="254" y1="68" x2="254" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="418" y1="68" x2="418" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="582" y1="68" x2="582" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="746" y1="68" x2="746" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="910" y1="68" x2="910" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- time dots -->
      <circle cx="90"  cy="64" r="4" fill="#2d3142"/>
      <circle cx="254" cy="64" r="4" fill="#2d3142"/>
      <circle cx="418" cy="64" r="4" fill="#2d3142"/>
      <circle cx="582" cy="64" r="4" fill="#2d3142"/>
      <circle cx="746" cy="64" r="4" fill="#2d3142"/>
      <circle cx="910" cy="64" r="5" fill="#eb6c36"/>

      <!-- time labels -->
      <text x="90"  y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">04:01</text>
      <text x="254" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">07:05</text>
      <text x="418" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">08:28</text>
      <text x="582" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">09:00</text>
      <text x="746" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">09:37</text>
      <text x="910" y="48" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ba4513">11:02</text>
      <text x="16" y="48" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">24/08</text>

      <!-- ══ VÒNG 1 ══ -->
      <rect x="16" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="96" width="148" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="28" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 1</text>
      <rect x="28" y="126" width="64" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="60" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">KHÔNG ĐẠT</text>
      <text x="28" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Chuỗi ghim không có trong</text>
      <text x="28" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">đầu ra · chiều đỏ chỉ có</text>
      <text x="28" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">trên giấy</text>
      <line x1="28" y1="208" x2="152" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="28" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">NÂNG PHẠM VI SỬA NGAY</text>
      <text x="28" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(+2 tiêu chí mới)</text>

      <!-- ══ VÒNG 2 ══ -->
      <rect x="180" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="96" width="148" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 2</text>
      <rect x="192" y="126" width="88" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="236" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">CHỜ PHÁN ĐOÁN</text>
      <text x="192" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Cánh đọc ngoài vùng nó gác</text>
      <text x="192" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">· phép đo mù định dạng</text>
      <text x="192" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">(lớp cũ đổi da)</text>
      <line x1="192" y1="208" x2="316" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="192" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">DỪNG-VÁ → ĐỔI KHUÔN A</text>
      <text x="192" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(một bộ đọc chung)</text>

      <!-- ══ VÒNG 3 ══ -->
      <rect x="344" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="96" width="148" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 3</text>
      <rect x="356" y="126" width="64" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="388" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">KHÔNG ĐẠT</text>
      <text x="356" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Tự chế bộ đọc thứ ba trong</text>
      <text x="356" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">khi kit có sẵn thư viện ·</text>
      <text x="356" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">ghim ăn nhầm dòng chú giải</text>
      <line x1="356" y1="208" x2="480" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="356" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">SỬA NỐT</text>
      <text x="356" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(dùng bộ đọc sẵn có)</text>

      <!-- ══ VÒNG 4 ══ -->
      <rect x="508" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="508" y="96" width="148" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 4</text>
      <rect x="520" y="126" width="64" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="552" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">KHÔNG ĐẠT</text>
      <text x="520" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Ô nuốt luật: bảng rỗng đi</text>
      <text x="520" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">qua sạch · lỗi ghim-ăn-</text>
      <text x="520" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">chú-giải LẶP LẠI</text>
      <line x1="520" y1="208" x2="644" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="520" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">THU PHẠM VI</text>
      <text x="520" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(cắt đối chiếu khai↔đo)</text>

      <!-- ══ VÒNG 5 ══ -->
      <rect x="672" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="96" width="148" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="684" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 5</text>
      <rect x="684" y="126" width="80" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="724" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">KHÔNG ĐẠT ×2</text>
      <text x="684" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">False green dựng lại được:</text>
      <text x="684" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">một dòng trong khối mã tắt</text>
      <text x="684" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">được cờ của cánh cuối</text>
      <line x1="684" y1="208" x2="808" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="684" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">CẮT NỐT</text>
      <text x="684" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(bỏ trọn phép đo máy)</text>

      <!-- ══ VÒNG 6 — lần đầu hai hội đồng ĐẠT ══ -->
      <rect x="836" y="96" width="148" height="172" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="96" width="148" height="172" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="848" y="116" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vòng 6</text>
      <rect x="848" y="126" width="100" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
      <text x="898" y="138" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ba4513">ĐẠT ×2 HỘI ĐỒNG</text>
      <text x="848" y="164" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Mọi finding còn lại là rác</text>
      <text x="848" y="178" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">của việc cắt — đã dọn</text>
      <text x="848" y="192" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">theo LỚP, cây nhất quán</text>
      <line x1="848" y1="208" x2="972" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="848" y="228" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142">DỌN RÁC</text>
      <text x="848" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">(lời khớp vật thật)</text>

      <!-- footnote -->
      <text x="500" y="308" text-anchor="middle" font-family="'Instrument Serif', 'Lora', serif" font-style="italic" font-size="14" fill="#2d3142">Cả sáu vòng chỉ có một lớp lỗi — «thước tự dối»: phép đo tin chính nó thay vì vật.</text>
      <text x="500" y="328" text-anchor="middle" font-family="'Instrument Serif', 'Lora', serif" font-style="italic" font-size="14" fill="#2d3142">Phần sinh ra lớp lỗi đó đã cắt trọn khỏi vật giao; vòng 6 là lần đầu hai hội đồng cùng ĐẠT.</text>
    </svg>