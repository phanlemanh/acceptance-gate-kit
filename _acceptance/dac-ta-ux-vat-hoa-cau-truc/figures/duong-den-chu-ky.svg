<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ══ arrows first ══ -->
      <line x1="500" y1="96" x2="500" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- diamond → chạy (trái, accent) -->
      <path d="M 388 184 L 264 184 Q 256 184 256 192 L 256 260" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="292" y="160" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="318" y="172" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ba4513" letter-spacing="0.06em">CHẠY</text>

      <!-- diamond → ép (phải) -->
      <path d="M 612 184 L 736 184 Q 744 184 744 192 L 744 260" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="660" y="160" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="678" y="172" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80" letter-spacing="0.06em">ÉP</text>

      <!-- chạy: các bước -->
      <line x1="256" y1="328" x2="256" y2="356" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="256" y1="416" x2="256" y2="444" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="256" y1="496" x2="256" y2="524" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ép: các bước -->
      <line x1="744" y1="328" x2="744" y2="356" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="744" y1="424" x2="744" y2="452" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ══ nodes ══ -->
      <!-- start -->
      <rect x="340" y="40" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="340" y="40" width="320" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="64" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Hai hội đồng ĐẠT — chữ ký đang treo</text>
      <text x="500" y="82" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">vòng 6 · 24/08 11:02</text>

      <!-- diamond -->
      <polygon points="500,128 612,184 500,240 388,184" fill="#f5f5f5"/>
      <polygon points="500,128 612,184 500,240 388,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="180" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ký trên</text>
      <text x="500" y="196" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">bằng chứng nào?</text>

      <!-- tag ngả máy khuyên -->
      <rect x="128" y="232" width="104" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
      <text x="180" y="244" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ba4513">NGẢ MÁY KHUYÊN</text>

      <!-- chạy 1 -->
      <rect x="136" y="260" width="240" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="260" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="284" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Một vòng máy xác nhận</text>
      <text x="256" y="300" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">trên bản đã dọn</text>
      <text x="256" y="316" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">~20 phút · chạy nền</text>

      <!-- chạy 2 -->
      <rect x="136" y="356" width="240" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="356" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="380" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tờ bằng chứng mới</text>
      <text x="256" y="396" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">khớp đúng cây hiện tại</text>

      <!-- chạy 3 -->
      <rect x="136" y="444" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="444" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="474" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ký một lệnh — không sửa tay</text>

      <!-- chạy: kết -->
      <rect x="136" y="524" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="136" y="524" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="256" y="548" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">MERGE</text>
      <text x="256" y="566" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">lưới trước-merge xanh</text>

      <!-- ép 1 -->
      <rect x="624" y="260" width="240" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="260" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="284" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Ký ngay trên báo cáo</text>
      <text x="744" y="300" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">KHÔNG-ĐẠT lệch mốc</text>
      <text x="744" y="316" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">verdict vòng 5 · mốc ghim cũ</text>

      <!-- ép 2 -->
      <rect x="624" y="356" width="240" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="356" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="384" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Lưới trước-merge CHẶN</text>
      <text x="744" y="404" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">verdict + mốc ghim không khớp cây</text>

      <!-- ép: kết -->
      <rect x="624" y="452" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="624" y="452" width="240" height="56" rx="28" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="744" y="476" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Phải mở đường vòng tay</text>
      <text x="744" y="494" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#636b80">gỡ lưới thủ công · để vết trên hồ sơ</text>

      <!-- annotation -->
      <text x="744" y="548" text-anchor="middle" font-family="'Instrument Serif', 'Lora', serif" font-style="italic" font-size="14" fill="#2d3142">Lưới chặn ở ngả «ép» là lưới làm đúng việc —</text>
      <text x="744" y="568" text-anchor="middle" font-family="'Instrument Serif', 'Lora', serif" font-style="italic" font-size="14" fill="#2d3142">ngả ép không nhanh hơn ngả chạy.</text>
    </svg>