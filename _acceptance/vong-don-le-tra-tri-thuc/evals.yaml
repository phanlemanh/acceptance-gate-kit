      luôn thêm khoá dong_tra vào hàng của lệnh đếm → --dem --json lệch byte, ca in đúng câu «luôn thêm khoá mà lệnh đếm vẫn
      im».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
