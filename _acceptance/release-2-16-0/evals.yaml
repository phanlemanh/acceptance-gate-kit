schema_version: 1
feature_slug: release-2-16-0
# Khuôn theo 2.14.0/2.15.0: mỗi eval máy ghim dòng PASS của chính ca hoặc răng nó gọi,
# phán quyết không lấy từ mã thoát trọn suite. Mọi cmd đi qua config: ref.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.p200_cat_so_2_16
    expected: >
      Exit 0 và đầu ra có đúng một dòng «PASS: P200 xanh (dung 1 dong PASS cua chinh no;
      phan quyet KHONG lay tu ma thoat tron suite; rang ban <8 hex>)». Răng chép nguyên thân
      từ 2.15.0. Chiều đỏ ghim mã như 2.15.0: 2 chưa từng chạy · 3 P200 in FAIL · 4 nhiều hơn
      một dòng PASS · 5 không tới kết luận · 8 không đọc được dấu bản răng. Vế giá trị
      «2.16.0» KHÔNG nằm trong eval — owner xác nhận trên thẻ.
    paths: [.claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, GUIDE.md, _acceptance/release-2-16-0/rang-p200.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.so_tang_2_16
    expected: >
      Exit 0 và đúng một dòng mở đầu «PASS: so trong cay (<số>) TANG theo semver so voi so tai
      CHA cua commit sinh ho so moc (<sha8>, con <sha8>) = <số cũ> — neo suy TU KHO, khong ghim
      sha». Neo là CHA của commit sinh hồ sơ mốc, tức cây ngay TRƯỚC khi hồ sơ tồn tại; hồ sơ
      chưa vào kho thì răng rơi về HEAD đã commit và tự nói ra điều đó. Chiều đỏ ghim mã: 2
      không có nền · 3 số KHÔNG tăng · 4 không đọc được số tại neo · 5 không tới kết luận. Đã
      thử thật trên cây này ở lượt sửa 1, HAI chiều đỏ trên cùng một neo: hạ số ở cây về đúng
      số của neo → mã 3 «BANG so tai neo»; hạ thêm một bậc → mã 3 «LUI so voi neo»; khôi phục
      → 0. Bản chép từ 2.15.0 neo vào CHÍNH commit sinh hồ sơ và vì thế đỏ mã 3 vĩnh viễn khi
      hồ sơ và bước nâng số nằm chung một commit — lượt chấm 1 của mốc này bắt đúng ca ấy.
    paths: [.claude-plugin/plugin.json, _acceptance/release-2-16-0/rang-so-tang.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.moc_diagram_2_16
    expected: >
      Exit 0 và đúng một dòng «PASS: diagram-design KHONG doi ke tu lan cat so gan nhat
      (<sha>), so doc duoc tai HEAD la 2.7.0 (doi chung duong: cua so moc..HEAD KHONG rong;
      bo loc diagram-design/ con khop vat; rang ban <8 hex>)». Chiều đỏ ghim mã như 2.15.0:
      3 · 4 · 5 (có đổi mà giữ số) · 6 · 8.
    paths: [diagram-design/.claude-plugin/plugin.json, _acceptance/release-2-16-0/rang-moc.sh]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cua_so_vendored_2_16
    expected: >
      Exit 0 và đúng một dòng «PASS: vendored <n> tep chep CI + chinh tep mang khoi chep (danh
      sach BANG danh sach tai neo) KHONG doi ke tu lan cat so <số> (<sha8>) toi cay lam viec
      (doi chung: cua so tren toan kho co <m> tep doi)» với n BẰNG số tệp trong khối chép (chín
      hôm nay) và m LỚN HƠN 0. Neo suy từ kho — lần cắt số trước — không ghim sha. Chiều đỏ
      ghim mã: 2 không có nền (không rút được khối ở cây hoặc ở neo · danh sách dưới năm tệp ·
      tệp vắng · cửa sổ toàn kho rỗng) · 3 DANH SÁCH đổi so với neo, in mục thêm và mục bớt,
      HOẶC có tệp chép đổi nội dung, in từng tệp · 8 thiếu cờ. Phép so danh sách hai đầu là vế
      mà phản biện context sạch của mốc này đòi: sàn «không dưới năm tệp» một mình là fail-open
      — gỡ ba mục khỏi khối thì sáu tệp còn lại vẫn không đổi và răng vẫn xanh.
    paths: [commands/acceptance-init.md, scripts/pre-merge-check.sh, scripts/recheck-evidence.cjs, lib/, _acceptance/release-2-16-0/rang-cua-so.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cua_so_viec_meta_2_16
    expected: >
      Exit 0 và đúng một dòng «PASS: viec-meta <k> ho so vong sinh sau lan cat so <số> (<sha8>)
      BANG khoi khai [<danh sách>] · the mo phien tren cay that: vong meta dang mo n=<n>
      [<danh sách>]», với danh sách hồ sơ vòng bằng đúng khối VIEC-META-CUA-SO của hợp đồng
      (thuoc-co-cua hôm nay) và n là SỐ, không null. Chiều đỏ ghim mã: 2 không có nền (không
      rút được khối · chính hồ sơ mốc có ở neo — neo sai) · 4 tập KHÁC khối khai, gọi tên
      thiếu hoặc thừa · 5 bộ quét trên cây thật không nhận kho kit hoặc n null · 8 thiếu cờ.
    paths: [_acceptance/release-2-16-0/contract.md, _acceptance/release-2-16-0/rang-cua-so.mjs, scripts/start-scan.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6a
    criterion: AC-6
    executor: test
    cmd: config:executors.test.scripts
    expected: >
      Exit 0 và dòng tổng kết «Results: <n> passed, 0 failed» với <n> LỚN HƠN 0.
    paths: [scripts/, tests/scripts/, lib/]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.hooks
    expected: >
      Exit 0 và dòng tổng kết «Results: <n> passed, 0 failed» với <n> LỚN HƠN 0.
    paths: [hooks/, tests/hooks/]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6c
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Exit 0 và «Results: all plugin tests passed»; đầu ra KHÔNG có dòng nào mang chữ FAIL.
      Không đòi dòng PASS của ca nào ở đây: bộ lọc của chính lệnh này cắt mọi dòng PASS.
    paths: [tests/plugins/, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, _acceptance/release-2-16-0/]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6d
    criterion: AC-6
    executor: test
    cmd: config:executors.test.workflows
    expected: >
      Exit 0 và «Results: all workflow tests passed».
    paths: [feature-loop/workflows/, tests/workflows/]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6e
    criterion: AC-6
    executor: script
    cmd: config:executors.script.product_map
    expected: "Exit 0, «PRODUCT-MAP.md khớp hồ sơ xưởng.»"
    paths: [PRODUCT-MAP.md, scripts/product-map.mjs, scripts/trang-thai-ho-so.cjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: judgment
    question: >
      Đọc khối ## Notes của hợp đồng. Năm khối (năm dòng số · lớp vendored · lớp lỗi tái
      phát · kết quả chiến dịch ghim lại · nhát cắt kế) có ĐỦ MẶT không; bảng năm dòng có ĐỦ HAI CỘT (vòng meta
      thuoc-co-cua · ba việc vá-trong-mốc) không; mỗi ô có NGUỒN RÚT hoặc «không đo được»
      kèm lý do không; dòng 2 có tách trong/ngoài thiết kế và gọi tên lý do của lượt ngoài
      không. KHÔNG tính lại con số nào ngoài BỐN phép đối chiếu: (i) dòng 4 — 1,53 · 23,25 ·
      21,96 · 5,09 · 2,97 M, S4 gộp 30,02 M, vòng gộp 54,80 M — so bảng per-model của
      usage-report.md, cộng cả out, in, cache_read và cache_create · (ii) dòng 4b — 22,5/75,6/1,9
      · 28,1/65,6/6,3 · 50,5/41,6/7,9 và gộp 25,7/71,2/3,1 phần trăm, tìm-lỗi 18,49 M — so bảng
      vai trò của cùng tệp, KHÔNG cộng cache_create, với refute và review vào khối tìm-lỗi và
      machine, judge, baseline vào khối chứng-minh-vật · (iii) dòng 1 và dòng 2 so giờ tác giả
      các commit được gọi tên · (iv) tỉ lệ tìm-lỗi gộp 71,2 phần trăm so số 9,5 phần trăm của
      vòng R1 ở Notes mục 1 hợp đồng mốc 2.15.0, cùng câu giải thích vì sao hai số ấy không so
      thẳng được. BỐN phép ấy là danh sách ĐÓNG. Rồi: khối năm dòng có nói THẲNG bảy điều bất
      lợi không — tìm-lỗi 71,2 phần trăm ngược chiều spec token · lượt gọi người 5 so trần 4,
      vòng thứ năm liên tiếp vượt trần · một lượt thi công chết trọn vì hạn mức phiên · owner
      phải tự bắt một phát hiện trong hợp đồng mà lượt chấm 2 cho qua · số chạm không đo được ·
      hiệu lực khuôn goal vẫn chưa có số · chiến dịch ghim lại tốn 2 giờ 25 phút máy và ghim được
      0 hồ sơ. Cuối cùng: mục 5 có gọi tên ít nhất MỘT chỗ cắt cho cửa sổ kế và có định đoạt
      router không; và mục 4 có nói đúng ba số 14 trên 72 hồ sơ, 60 eval đỏ, 0 hồ sơ được ghim.
    inputs:
      - _acceptance/release-2-16-0/contract.md
      - _acceptance/thuoc-co-cua/contract.md
      - _acceptance/thuoc-co-cua/decisions.jsonl
      - _acceptance/thuoc-co-cua/usage-report.md
      - _acceptance/release-2-15-0/contract.md
      - docs/findings/2026-09-17-boi-canh-truoc-va-sau-R.md
    expected: >
      PASS khi năm khối có mặt, bảng đủ hai cột với nguồn từng ô, dòng 2 tách trong/ngoài và
      gọi tên lý do của lượt ngoài, BỐN phép đối chiếu khớp, bảy điều bất lợi nói thẳng, mục 5
      có ít nhất một chỗ cắt gọi tên và định đoạt router. Che bất kỳ điều bất lợi nào là FAIL.

      Hội đồng KHÔNG suy rộng ra số khác và KHÔNG đòi cột repo tiêu thụ: hợp đồng khai thẳng
      rằng cửa sổ một ngày này không có vòng sản phẩm nào phiên cắt mốc có nhân chứng.
    evidence_required: [judged_by, verdict, votes, rationale]
