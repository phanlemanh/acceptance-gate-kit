schema_version: 1
feature_slug: cat-hinh-thuc
# Vật được giao là VĂN CHỈ DẪN (command/SKILL/template/reference) + hai script
# đọc trường phút. Ba luật của kho áp cho từng eval dưới đây:
#   (a) Không assertion âm-tính-một-mình. Mọi "0 hit" kèm đối chứng dương trên
#       worktree `origin/main` — needle nào >0 trên cây cũ mới được tin là "đã
#       gỡ"; needle 0-hit CẢ HAI đầu là needle gõ sai, script phải ĐỎ chứ không
#       xanh (lớp needle-chưa-bao-giờ-tồn-tại).
#   (b) Ghim ĐÚNG THÔNG ĐIỆP, không tin mã thoát trọn suite — suite này xanh
#       trên cả cây cũ lẫn cây mới nên mã thoát không phân biệt được.
#   (c) Chiều đỏ CHẠY THẬT trên bản sao, đi qua CHÍNH checker thật, in
#       xác-nhận-đột-biến; đối chứng dương phải xanh TRƯỚC khi tiêm.
# Số ca in ra SUY từ mảng, không viết cứng.
# Known-limit khai trước: script răng của hồ sơ này so với base tường minh
# `origin/main` nên KHÔNG vào suite vĩnh viễn (sau khi hồ sơ merge, origin/main
# hết còn là "cây cũ"). Cùng nếp với `no-ben-viet-drift.sh` (chip ③) và
# `no-vat-cam-drift.sh` (chip ③b).
# Không có làn design/ui-check: kit không có mặt người.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - commands/approve.md
      - commands/signoff.md
      - skills/acceptance/SKILL.md
      - feature-loop/skills/feature-loop/SKILL.md
    expected: >
      exit 0; với TỪNG needle trong mảng HỎI-PHÚT — `hỏi user số phút`,
      `how many minutes`, `ask .* minutes`, và cụm mời-khai-phút trong khuôn
      một-lượt-gõ — in "CAT-PHUT: <needle> HEAD=0 base=<n>(>0) OK"; dòng đếm
      "CAT-PHUT: <k>/<k>" với k suy từ độ dài mảng. Đỏ ghim đích danh khi
      HEAD>0 ("… con hoi phut tai <file>:<dòng>") HOẶC base=0 ("… base=0 —
      needle nay chua bao gio ton tai, phep do khong song"). Phạm vi quét đúng
      như khai ở đầu mục Criteria của contract, và script IN RA phạm vi nó
      thực quét để người đối chiếu được (không tin lời khai trong contract).
      Chiều đỏ CHẠY THẬT: chèn lại câu "hỏi user số phút" vào bản sao
      `feature-loop/skills/feature-loop/SKILL.md` → đỏ đích danh file+dòng;
      đối chứng dương xanh trước khi tiêm.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-12
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - GUIDE.md
      - QUICKSTART.md
      - README.md
    expected: >
      exit 0 — lớp KHẲNG-ĐỊNH-phút, tách khỏi lớp HỎI-phút của E1 vì mọi needle
      dạng câu hỏi đều MÙ với văn quảng cáo. Mảng needle viết TRƯỚC, 4 phần tử:
      `baseline_minutes` · cụm KPI giảm-%-thời-gian-người · cụm `5–10 phút`
      (mọi biến thể dấu gạch) · `time_human_minutes` xuất hiện trong văn khuyến
      nghị cho người đọc (phân biệt với schema/frontmatter — script loại trừ
      khối frontmatter khi đếm). Với từng needle in "KPI-PHUT: <needle> HEAD=0
      base=<n>(>0) OK", đếm "KPI-PHUT: 4/4" suy từ mảng. Đỏ ghim file+dòng khi
      HEAD>0; đỏ ghim "needle nay chua bao gio ton tai" khi base=0. Chiều đỏ
      CHẠY THẬT: chèn lại dòng KPI cũ vào bản sao `GUIDE.md` → đỏ đích danh.

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - lib/workspace-record.cjs
      - scripts/recheck-evidence.cjs
      - scripts/gate-card.js
    expected: >
      exit 0 — ĐƯỜNG ĐỌC-CŨ, chân bảo vệ 38 hồ sơ đã ký. Script tự SINH hai
      fixture trong chính lần chạy (KHÔNG dùng file viết tay, KHÔNG trỏ vào hồ
      sơ thật): (cũ) một workspace hợp lệ CÓ `time_human_minutes: {gate1: 7,
      gate2: 3}`; (mới) một workspace hợp lệ VẮNG hẳn khoá đó. Chạy bốn bên đọc
      trên CẢ HAI — `pre-merge-check.sh`, `recheck-evidence.cjs`,
      `product-map.mjs --check`, `gate-card.js` — và in
      "DOC-CU: <reader> x <fixture> OK" cho đủ 8 tổ hợp, đếm "DOC-CU: 8/8" suy
      từ tích hai mảng. Điều kiện xanh gắt hơn "không lỗi": stdout của mỗi lượt
      KHÔNG được chứa cảnh báo về trường thiếu, và card cổng render từ fixture
      CŨ phải vẫn hiện đúng con số 7/3 (giữ được thì mới là đọc-cũ; nuốt mất là
      mất sử liệu). Đường dẫn fixture suy từ vị trí script, không hardcode ROOT.
      **ROUND-TRIP bắt buộc — hai fixture KHÔNG được cùng do script tự nặn.**
      Hồ sơ này sửa chính BÊN VIẾT (thôi ghi trường phút), nên fixture tự dựng
      đúng khuôn bên đọc sẽ xanh 8/8 trong khi workspace THẬT tạo sau merge lại
      đỏ ở PR đầu tiên của đội — đúng hình dạng bên-viết-và-bên-đọc-trôi-khỏi-
      nhau. Vì vậy: fixture **MỚI** phải lấy nguyên đầu ra của đường KHỞI TẠO
      THẬT trên cây HEAD (chạy khuôn contract/`workspace-record` rồi dùng
      nguyên si, không sửa tay một ký tự); fixture **CŨ** lấy bằng `git show`
      một workspace đã ký từ `origin/main`, không viết lại. In
      "ROUND-TRIP: fixture-moi sinh boi <writer> OK" và ĐỎ nếu khoá phút xuất
      hiện trở lại trong đầu ra bên viết. Chiều đỏ CHẠY THẬT ×2: (a) bỏ nhánh
      đọc-cũ trong bản sao một reader → đỏ "DOC-CU: <reader> x cu VO"; (b) cho
      bên viết ghi lại khoá phút → đỏ "ROUND-TRIP: ben viet con ghi phut".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - skills/acceptance/references/human-facing-language.md
    expected: >
      exit 0; script rút khối `GATE-ONESHOT-GRAMMAR` QUA MARKER (không quét cả
      file) và assert ba chân: (1) khối KHÔNG còn mời khai phút — neo âm; (2)
      khối vẫn khai rằng vế `, phút <số>` được **chấp nhận và bỏ qua** — neo
      dương, đây là lời hứa "người quen tay không bị chặn"; (3) danh sách neo
      dương cũ của khối (các mục không liên quan phút) còn NGUYÊN, so bằng tập
      hợp chứ không bằng số đếm. Ba chân này cố ý tách nhau: chỉ có (1) thì gỡ
      quá tay cũng xanh, chỉ có (2) thì để nguyên câu hỏi cũ cũng xanh. Chiều
      đỏ CHẠY THẬT ×2: (a) gỡ luôn vế chấp-nhận-bỏ-qua → đỏ "ONESHOT: mat ve
      chap-nhan-bo-qua"; (b) chèn lại câu mời khai phút → đỏ "ONESHOT: con moi
      khai phut".
      **Chân PER-SITE (thêm sau phản biện):** ngữ pháp còn bản chép trong TỪNG
      thân lệnh cổng; assert cả ba site Claude (`commands/approve.md`,
      `commands/signoff.md`, `commands/start.md`) đồng bộ với khối gốc, in
      "ONESHOT-SITE: <file> dong bo OK" và đếm 3/3. Không có chân này thì một
      site chưa đồng bộ sẽ coi câu gộp có vế phút là sai cú pháp và **chặn owner
      ngay tại cổng**, trong khi khối gốc vẫn khai đúng.
      **Đây là lớp PHỤ — nó đo mực đã in.** Lời hứa hành vi do E3b đo.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3b
    criterion: AC-3
    executor: judgment
    inputs:
      - skills/acceptance/references/human-facing-language.md
      - commands/approve.md
      - commands/signoff.md
    paths:
      - skills/acceptance/references/human-facing-language.md
      - commands/approve.md
      - commands/signoff.md
    question: >
      Agent context SẠCH (chỉ các file ở `inputs`) đóng vai máy nhận câu gộp
      của owner tại cổng, ba ca chấm theo bảng đáp án viết TRƯỚC:
      (ca 1) owner gõ câu gộp CÓ vế `, phút 12` — agent phải (a) CHẤP NHẬN câu
      đó, không báo sai cú pháp, không hỏi lại; và (b) khi xuất bản nháp
      frontmatter sẽ ghi, **KHÔNG được có `time_human_minutes: {gate1: 12}`** —
      vế phút bị bỏ qua chứ không được ghi. Chân (b) là lời hứa "không ghi", vế
      mà bộ đo cũ hoàn toàn không chạm.
      (ca 2) owner gõ câu gộp KHÔNG có vế phút — agent xử lý bình thường, không
      hỏi phút.
      (ca 3) ca biên: vế phút sai định dạng (`, phút mười hai`) — agent vẫn
      chấp nhận phần còn lại của câu và bỏ qua vế hỏng, KHÔNG chặn owner.
      Lệch bảng đáp án → REJECT, sửa THÂN CHỈ DẪN chứ không sửa đáp án.
    expected: >
      Cả ba ca khớp; đặc biệt ca 1 chân (b) phải thấy rõ agent KHÔNG ghi trường
      phút vào bản nháp nó xuất ra.
    evidence_required: [run_id, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - commands/acceptance-report.md
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
    expected: >
      exit 0; assert trên thân `commands/acceptance-report.md`: (âm) không còn
      nhánh so phút-vs-baseline — needle `baseline_minutes` và cụm so-sánh đã
