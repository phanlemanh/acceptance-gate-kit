schema_version: 1
feature_slug: cat-hinh-thuc
# Vật được giao là VĂN CHỈ DẪN (command/SKILL/template/reference) + hai script
# đọc trường phút. Ba luật của kho áp cho từng eval dưới đây:
#   (a) Không assertion âm-tính-một-mình. Mọi "0 hit" kèm đối chứng dương trên
#       worktree `origin/main` — needle nào >0 trên cây cũ mới được tin là "đã
#       gỡ"; needle 0-hit CẢ HAI đầu là needle gõ sai, script phải ĐỎ chứ không
#       xanh (lớp needle-chưa-bao-giờ-tồn-tại).
#   (b) Ghim ĐÚNG THÔNG ĐIỆP, không tin mã thoát trọn suite — suite này xanh
#       trên cả cây cũ lẫn cây mới nên mã thoát không phân biệt được.
#   (c) Chiều đỏ CHẠY THẬT trên bản sao, đi qua CHÍNH checker thật, in
#       xác-nhận-đột-biến; đối chứng dương phải xanh TRƯỚC khi tiêm.
# Số ca in ra SUY từ mảng, không viết cứng.
# Known-limit khai trước: script răng của hồ sơ này so với base tường minh
# `origin/main` nên KHÔNG vào suite vĩnh viễn (sau khi hồ sơ merge, origin/main
# hết còn là "cây cũ"). Cùng nếp với `no-ben-viet-drift.sh` (chip ③) và
# `no-vat-cam-drift.sh` (chip ③b).
# Không có làn design/ui-check: kit không có mặt người.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - commands/approve.md
      - commands/signoff.md
      - skills/acceptance/SKILL.md
      - feature-loop/skills/feature-loop/SKILL.md
    expected: >
      exit 0; với TỪNG needle trong mảng HỎI-PHÚT — `hỏi user số phút`,
      `how many minutes`, `minutes spent`, và cụm mời-khai-phút của khuôn
      một-lượt-gõ (`số phút là ĐIỀU MÁY BIẾT`) — in "CAT-PHUT: <needle> HEAD=0
      base=<n>(>0) OK"; dòng đếm "CAT-PHUT: <k>/<k>" với k suy từ độ dài mảng.
      Đỏ ghim đích danh khi HEAD>0 ("… con o <file>:<dòng>") HOẶC base=0 ("…
      base=0 — needle nay chua bao gio ton tai, phep do khong song"). Phạm vi
      quét khai ở khối máy-đọc `PHAM-VI-RANG` của contract, và script SO phạm vi
      nó thực quét với chính khối ấy rồi in kết quả so (`CAT-SCOPE`).
      Chiều đỏ CHẠY THẬT: chèn lại câu "hỏi user số phút" vào bản sao
      `feature-loop/skills/feature-loop/SKILL.md` → đỏ đích danh file+dòng;
      đối chứng dương xanh trước khi tiêm.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Hai chỗ khai lại.** (a) Needle
      `ask .* minutes` của bản duyệt có **base=0** — nó chưa bao giờ tồn tại ở
      dạng ấy, tức một chân âm-tính-một-mình đội lốt chân có đối chứng. Nó bị
      **thay** bằng `minutes spent` (cụm tiếng Anh THẬT của thân skill cũ,
      base=1), không bị bỏ: bỏ là co mảng cho vừa cái đo được. Bản thi công
      trước chạy 2 needle trong khi eval hứa 4 và vẫn in "2/2" — «k suy từ
      mảng» nên nó luôn khớp chính nó (H11). (b) Câu «script in phạm vi để
      người đối chiếu» nay là **phép so máy** với khối `PHAM-VI-RANG`; in ra
      cho người đọc mà không so là đúng chỗ H6 sống.
    pinned:
      - "CAT-PHUT: 4/4"
      - "CAT-SCOPE: khop ban khai PHAM-VI-RANG"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-12
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - GUIDE.md
      - QUICKSTART.md
      - README.md
    expected: >
      exit 0 — lớp KHẲNG-ĐỊNH-phút, tách khỏi lớp HỎI-phút của E1 vì mọi needle
      dạng câu hỏi đều MÙ với văn quảng cáo. Mảng needle viết TRƯỚC, 4 phần tử:
      `baseline_minutes` · cụm KPI giảm-%-thời-gian-người · cụm `5–10 phút`
      (mọi biến thể dấu gạch) · `time_human_minutes` xuất hiện trong văn khuyến
      nghị cho người đọc (phân biệt với schema/frontmatter — script loại trừ
      khối frontmatter khi đếm). Với từng needle in "KPI-PHUT: <needle> HEAD=0
      base=<n>(>0) OK", đếm "KPI-PHUT: 4/4" suy từ mảng. Đỏ ghim file+dòng khi
      HEAD>0; đỏ ghim "needle nay chua bao gio ton tai" khi base=0. Chiều đỏ
      CHẠY THẬT: chèn lại dòng KPI cũ vào bản sao `GUIDE.md` → đỏ đích danh.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Thêm một chân QUAN HỆ.** Bốn needle
      trên đều là literal, nên một cách diễn đạt khác lọt hết (H11). Chân thêm
      đo **cột THƯỚC ĐO** của bảng mục tiêu trong `GUIDE.md`: không mục tiêu nào
      được đo bằng một trường phút, bất kể câu chữ ở cột mục tiêu. In
      "KPI-PHUT: bang muc tieu GUIDE (<k> hang…) 0 thuoc do bang phut OK", đỏ
      khi rút được dưới 3 hàng (phép rút hỏng) hoặc khi còn thước phút.
    pinned:
      - "KPI-PHUT: 4/4"
      - "KPI-PHUT: bang muc tieu GUIDE"

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - lib/workspace-record.cjs
      - scripts/recheck-evidence.cjs
      - scripts/gate-card.js
    expected: >
      exit 0 — ĐƯỜNG ĐỌC-CŨ, chân bảo vệ 38 hồ sơ đã ký. Script tự SINH hai
      fixture trong chính lần chạy, đường dẫn suy từ vị trí script:
      (cũ) một workspace đã ký lấy bằng `git show <base>:_acceptance/<slug>/…`,
      CÓ `time_human_minutes`, không viết lại một ký tự; (mới) cùng workspace ấy
      nhưng frontmatter hợp đồng lấy NGUYÊN từ BÊN VIẾT — khối máy-đọc
      `CONTRACT-FRONTMATTER-TEMPLATE` trên cây HEAD, chỉ thay chỗ trống. Chạy
      bốn bên đọc trên CẢ HAI — `pre-merge-check.sh`, `recheck-evidence.cjs`,
      `product-map.mjs --check`, `gate-card.js` — in "DOC-CU: <reader> x
      <fixture> OK" cho đủ 8 tổ hợp và đếm "DOC-CU: 8/8" suy từ tích hai mảng.
      **Điều kiện xanh của từng CẶP: phán quyết trên hai fixture BẰNG NHAU** —
      "DOC-CU: <reader> phan quyet cu == moi OK". Đó mới là mệnh đề AC-2 cần:
      có hay không có trường phút, bên đọc xử y hệt. Thêm: đầu ra không nhắc
      trường phút / trường lạ, và sau khi cả bốn bên đọc chạy, trường phút của
      hồ sơ CŨ còn NGUYÊN BYTE trên đĩa.
      **ROUND-TRIP bắt buộc — hai fixture KHÔNG được cùng do script tự nặn.**
      Hồ sơ này sửa chính BÊN VIẾT (thôi ghi trường phút), nên fixture tự dựng
      đúng khuôn bên đọc sẽ xanh 8/8 trong khi workspace THẬT tạo sau merge lại
      đỏ ở PR đầu tiên của đội — đúng hình dạng bên-viết-và-bên-đọc-trôi-khỏi-
      nhau. In "ROUND-TRIP: fixture-moi sinh boi CONTRACT-FRONTMATTER-TEMPLATE
      (ben viet that) OK" và ĐỎ "ROUND-TRIP: ben viet con ghi phut" nếu khoá
      phút xuất hiện trở lại trong đầu ra bên viết. Chiều đỏ CHẠY THẬT ×2:
      (a) cho một bên đọc THÔI dung thứ trường lạ trong bản sao mang cả `lib/`
      lẫn `scripts/` (cây chạy được, khác đúng một chỗ tiêm) → hai phán quyết
      LỆCH nhau; (b) cho bên viết ghi lại khoá phút → ROUND-TRIP đỏ.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Eval này TRƯỚC ĐÓ KHÔNG CÓ MỘT
      DÒNG MÃ NÀO, và sổ chạy đóng dấu xanh cho nó ba vòng (H1).** Chín eval
      chia chung một `cmd:`, và bộ ghi sổ gán rc của một lượt chạy vật lý cho
      MỌI eval-id trong nhóm — eval không có chân nào vẫn hưởng màu xanh của
      tám eval kia. Lỗ ấy đóng ở đúng chỗ nó sống: `ghi-so-chay-1a.mjs` nay đòi
      mỗi eval máy khai `pinned:` với ≥1 chuỗi RIÊNG trong nhóm-lệnh, và chết to
      khi chuỗi khai vắng trong đầu ra.
      **Một vế của bản duyệt phải khai lại: «card cổng render từ fixture CŨ
      phải vẫn hiện đúng con số 7/3» KHÔNG THOẢ ĐƯỢC.** Đo lại: không bên đọc
      nào — kể cả trên `origin/main` — từng đọc `time_human_minutes`. Card chưa
      bao giờ hiện số phút. Vế thay thế (còn-nguyên-byte) đo đúng lời hứa gốc
      «giữ được sử liệu» bằng thứ quan sát được.
    pinned:
      - "DOC-CU: 8/8"
      - "ROUND-TRIP: fixture-moi sinh boi CONTRACT-FRONTMATTER-TEMPLATE"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
      - skills/acceptance/references/human-facing-language.md
    expected: >
      exit 0; script rút khối `GATE-ONESHOT-GRAMMAR` QUA MARKER (không quét cả
      file) và assert ba chân: (1) khối KHÔNG còn mời khai phút — neo âm; (2)
      khối vẫn khai rằng vế `, phút <số>` được **chấp nhận và bỏ qua** — neo
      dương, đây là lời hứa "người quen tay không bị chặn"; (3) danh sách neo
      dương cũ của khối (các mục không liên quan phút) còn NGUYÊN, so bằng tập
      hợp chứ không bằng số đếm. Ba chân này cố ý tách nhau: chỉ có (1) thì gỡ
      quá tay cũng xanh, chỉ có (2) thì để nguyên câu hỏi cũ cũng xanh. Chiều
      đỏ CHẠY THẬT ×2: (a) gỡ luôn vế chấp-nhận-bỏ-qua → đỏ "ONESHOT: mat ve
      chap-nhan-bo-qua"; (b) chèn lại câu mời khai phút → đỏ "ONESHOT: con moi
      khai phut".
      **Chân PER-SITE:** điều khoản `GATE-ONESHOT-CLAUSE` chép NGUYÊN VĂN ở
      từng thân lệnh cổng, số bản chép phải có khai trong khối máy-đọc
      `GATE-ONESHOT-SITES`; assert từng site khớp bản khai và đếm
      "ONESHOT-SITE: <k>/<k>". Không có chân này thì một site chưa đồng bộ sẽ
      coi câu gộp có vế phút là sai cú pháp và **chặn owner ngay tại cổng**,
      trong khi khối gốc vẫn khai đúng.
      **Đây là lớp PHỤ — nó đo mực đã in.** Lời hứa hành vi do E3b đo.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Ba chỗ khai lại, cả ba do rà soát
      vòng 1 chỉ ra (H2).** (a) Bản thi công quét CẢ FILE bằng hai `grep -q`
      chuỗi rời; câu «Vế `, phút <số>` ở cuối câu KHÔNG còn ĐƯỢC CHẤP NHẬN. Máy
      báo lỗi cú pháp và hỏi lại người.» giữ nguyên CẢ HAI chuỗi trong khi nghĩa
      đảo 180°, và bộ răng vẫn in 3/3 OK. Neo dương nay đo **cụm LIỀN** «vẫn
      ĐƯỢC CHẤP NHẬN và BỎ QUA lặng» — phép phủ định phá vỡ cụm liền — cộng một
      chân cấm: không CÂU nào trong khối được ghép `phút <số>` với «báo lỗi» /
      «sai cú pháp» / «KHÔNG còn». (b) Chân (3) so **TẬP CÂU**: mọi câu của base
      không chứa chữ «phút» phải còn nguyên ở HEAD, in "ONESHOT-SET: <k>/<k>".
      So theo dòng thì hai hunk hợp lệ có gói lại dòng sẽ đỏ oan; so theo số đếm
      thì số khớp chính nó. (c) Chân PER-SITE của bản duyệt viết «ba site
      Claude … đồng bộ với khối gốc» nhưng cái các site chép là **CLAUSE** chứ
      không phải GRAMMAR, và `commands/start.md` không mang cụm «ĐƯỢC CHẤP NHẬN»
      nào — bản thi công thay vật đo bằng chính bản luật (file dễ hơn). Nay đọc
      đúng bản khai `GATE-ONESHOT-SITES` (6 site, kèm số bản chép).
    pinned:
      - "ONESHOT-SET:"
      - "ONESHOT-SITE: 6/6"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3b
    criterion: AC-3
    executor: judgment
    inputs:
      - skills/acceptance/references/human-facing-language.md
      - commands/approve.md
      - commands/signoff.md
    paths:
      - skills/acceptance/references/human-facing-language.md
      - commands/approve.md
      - commands/signoff.md
    question: >
      Agent context SẠCH (chỉ các file ở `inputs`) đóng vai máy nhận câu gộp
      của owner tại cổng, ba ca chấm theo bảng đáp án viết TRƯỚC:
      (ca 1) owner gõ câu gộp CÓ vế `, phút 12` — agent phải (a) CHẤP NHẬN câu
      đó, không báo sai cú pháp, không hỏi lại; và (b) khi xuất bản nháp
      frontmatter sẽ ghi, **KHÔNG được có `time_human_minutes: {gate1: 12}`** —
      vế phút bị bỏ qua chứ không được ghi. Chân (b) là lời hứa "không ghi", vế
      mà bộ đo cũ hoàn toàn không chạm.
      (ca 2) owner gõ câu gộp KHÔNG có vế phút — agent xử lý bình thường, không
      hỏi phút.
      (ca 3) ca biên: vế phút sai định dạng (`, phút mười hai`) — agent vẫn
      chấp nhận phần còn lại của câu và bỏ qua vế hỏng, KHÔNG chặn owner.
      Lệch bảng đáp án → REJECT, sửa THÂN CHỈ DẪN chứ không sửa đáp án.
    expected: >
      Cả ba ca khớp; đặc biệt ca 1 chân (b) phải thấy rõ agent KHÔNG ghi trường
      phút vào bản nháp nó xuất ra.
    evidence_required: [run_id, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - commands/acceptance-report.md
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
    expected: >
      exit 0; assert trên thân `commands/acceptance-report.md`: (âm) không còn
      nhánh so phút-vs-baseline — needle `baseline_minutes` và cụm so-sánh đã
      vắng, đối chứng dương trên base >0; (dương) mục **sổ vàng** và mục **vệ
