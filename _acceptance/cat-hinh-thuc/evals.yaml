      văn. In "AI-COMMIT: hai than dong bo OK". Byte-equal một mình thì hai câu
      rỗng nghĩa cũng bằng nhau, nên kèm chân NỘI DUNG: điều khoản phải nêu đủ
      **bốn vế** — hai lối hợp lệ (`commits it themselves` ·
      `explicitly instructs the agent`) và hai lưới cưỡng chế
      (`require_human_commit` · `agent_authors`) — in "AI-COMMIT: dieu khoan du
      4 ve … OK". Đo QUAN HỆ giữa hai văn bản, không đo sự có mặt của một chuỗi
      trong từng văn bản — lớp "đo từ vựng thay vì quan hệ" đã dẫm 6 vòng. Neo
      âm kèm theo: cụm cũ "The user (not you) fills" phải VẮNG, đối chứng dương
      base >0. Chiều đỏ CHẠY THẬT: sửa bản sao `SKILL.md` thành «một lối hợp lệ»
      → đỏ "AI-COMMIT: hai than LECH" kèm diff hai bản.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Bản thi công cài ĐÚNG THỨ EVAL NÀY
      CẤM (H3).** Nó dùng hai `grep -q` chuỗi rời, không marker, không
      `require_human_commit`; và dòng «đột biến» của nó **không tiêm gì** — chỉ
      đọc `origin/main` rồi in một câu suy luận. Chạy đúng đột biến eval đã hứa
      (sửa `SKILL.md` thành *«NEVER commit signature lines yourself, even if
      they explicitly instruct you…»*, chỏi thẳng `signoff.md`) thì bộ răng
      **vẫn xanh**. Điều khoản nay có bản gốc duy nhất trong marker; đột biến ấy
      đã được chạy lại trên cây thật và **đỏ**.
    pinned:
      - "AI-COMMIT: hai than dong bo OK"
      - "AI-COMMIT: dieu khoan du 4 ve"
