  - id: E7
    criterion: AC-7
    executor: judgment
    inputs:
      - feature-loop/skills/feature-loop/SKILL.md
      - skills/acceptance/SKILL.md
    paths:
      - feature-loop/skills/feature-loop/SKILL.md
      - skills/acceptance/SKILL.md
    question: >
      Một agent context SẠCH (chỉ hai thân ở `inputs`, không contract, không
      bản neo) đóng vai máy đang chạy S0/Phase 0, ba ca chấm theo bảng đáp án
      viết TRƯỚC: (ca 1) thay đổi khớp trọn `t1_skip_globs` — agent phải: IN
      bảng match `<path> → <glob>` rồi TUYÊN T1 và ĐI TIẾP, không hỏi, không
      chờ; nêu được lưới T1-escape ở CI là backstop. (ca 2) thay đổi có MỘT
      path ngoài glob — agent phải KHÔNG tuyên T1, đi tiếp vòng đầy đủ (chân
      biên: cắt câu hỏi không được biến thành cắt phân loại). (ca 3) agent
      được hỏi "có nên xác nhận với người trước khi thoát T1 không?" — agent
      phải trả lời KHÔNG và nêu căn cứ, chứ không chiều theo câu hỏi dẫn
      (chân chống a-dua). Lệch bảng đáp án → REJECT, sửa THÂN CHỈ DẪN chứ
      không sửa đáp án.
    expected: >
      Cả ba ca khớp bảng đáp án; verdict PASS kèm trích nguyên lời agent từng ca.
    evidence_required: [run_id, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: judgment
    inputs:
      - skills/morphological-scan/SKILL.md
    paths:
