      "REPORT: bo nhanh phut OK" + "REPORT: so vang + ve sinh cong byte-equal
      base OK". Chiều đỏ CHẠY THẬT: xoá một dòng khỏi mục sổ vàng trong bản sao
      → đỏ "REPORT: so vang LECH base".
    pinned:
      - "REPORT: bo nhanh phut OK"
      - "REPORT: so vang + ve sinh cong byte-equal base OK"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cat_hinh_thuc_rang
    paths:
      - skills/acceptance/references/human-facing-language.md
      - _acceptance/cat-hinh-thuc/cat-hinh-thuc-rang.sh
    expected: >
      exit 0; ba chân trên bản luật ngôn ngữ mặt người: (1) NEO ÂM — điều khoản
      "tin CHỈ-BÁO … vẫn kết bằng khối" đã VẮNG, đối chứng dương base >0;
      (2) khuôn `YOUR-MOVE-BLOCK-TEMPLATE` rút qua marker, **byte-equal base**;
      (3) `GATE-INVITE-CLAUSE` rút qua marker, **byte-equal base**, và phạm vi
      của nó vẫn là "tin mời cổng". Chip này GỠ một tư cách luật, nên chân (1)
      là bắt buộc — assert-chuỗi-phải-có-mặt không bao giờ bắt được điều khoản
      cũ quay lại. Chân (2)(3) là đối chứng giữ-gân. Thêm chân LAN: điều khoản
      chép nguyên văn ở ba site, **số bản chép của từng site khai trong khối
      máy-đọc `GATE-INVITE-SITES`**; assert từng site khớp bản khai
      ("MOI-TIN-SITE: <file> <k>/<k> ban chep OK", đếm 3/3) và **0 site ngoài
      bản khai** mang điều khoản, trừ chính bản gốc. Chiều đỏ CHẠY THẬT: chép
      điều khoản vào bản sao một command NGOÀI bản khai → đỏ đích danh file đó.
      **[SỬA SAU CỔNG 1 — 13/08, vòng sửa 1] Hai chỗ khai lại (H7, H9).**
      (a) Chân (3) KHÔNG còn là byte-equal: hạng mục 1a.2 gỡ đúng một vế CỦA
      CHÍNH `GATE-INVITE-CLAUSE`, nên byte-equal không có trạng thái cây nào
      thoả — bản thi công đặc cách khối này khỏi phép so, cùng một commit với
      lượt sửa vật và không khai ở đâu. Thước mới là **phép so TẬP CÂU**: mọi
      câu của base không chứa chữ «chỉ-báo» phải còn nguyên ở HEAD. Chặt hơn
      đếm từ khoá, và miễn nhiễm với việc gói lại dòng.
      (b) Chân LAN cũ dùng **ngưỡng gõ tay `>5`** trong khi kho có sẵn bản khai
