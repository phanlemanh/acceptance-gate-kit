<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thẻ tri thức ở Cổng Phạm vi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1440px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · thiet-ke-nap-tri-thuc · AC-1 · AC-2 · AC-3 · AC-7</p>
    <h1>Thẻ tri thức ở Cổng Phạm vi</h1>
    <p class="sub">Hỏi-1 (CỘNG): thiếu dòng tra thì thẻ không mời duyệt. Chỉ hai ca chặn; mọi ca khác là cờ hoặc không cờ.</p>

    <svg viewBox="0 0 1400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Arrows (drawn first) ============ -->
      <!-- Spine: D1 → D2 → D3 → D4 → D5 → S → E4 -->
      <line x1="192" y1="96" x2="232" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="392" y1="96" x2="432" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="592" y1="96" x2="632" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="96" x2="832" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="992" y1="96" x2="1032" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1176" y1="96" x2="1216" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Exits down -->
      <line x1="112" y1="144" x2="112" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="312" y1="144" x2="312" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="512" y1="144" x2="512" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="712" y1="144" x2="712" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="912" y1="144" x2="912" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1104" y1="120" x2="1104" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Arrow labels (mask + 6px gap) ============ -->
      <!-- horizontal: mask y 72..88, line at 96 → 8px gap -->
      <rect x="196" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="212" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">có</text>
      <rect x="396" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="412" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">có</text>
      <rect x="596" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="612" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">có</text>
      <rect x="792" y="72" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="812" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">không</text>
      <rect x="992" y="72" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1012" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">không</text>
      <rect x="1176" y="72" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1196" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">khớp</text>

      <!-- vertical: mask 8px right of the line -->
      <rect x="120" y="160" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="124" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không</text>
      <rect x="320" y="160" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="324" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không</text>
      <rect x="520" y="160" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="524" y="172" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không</text>
      <rect x="720" y="160" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="724" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">có</text>
      <rect x="920" y="160" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="924" y="172" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">có</text>
      <rect x="1112" y="144" width="88" height="32" rx="2" fill="#f5f5f5"/>
      <text x="1116" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">lệch/sai/</text>
      <text x="1116" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không đọc được</text>

      <!-- ============ Decisions (spine, cy = 96) ============ -->
      <!-- D1 -->
      <polygon points="112,48 192,96 112,144 32,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="92" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho khai</text>
      <text x="112" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tri_thuc?</text>
      <!-- D2 -->
      <polygon points="312,48 392,96 312,144 232,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ draft?</text>
      <!-- D3 -->
      <polygon points="512,48 592,96 512,144 432,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="512" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có dòng đã tra?</text>
      <!-- D4 -->
      <polygon points="712,48 792,96 712,144 632,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="712" y="92" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng ghi</text>
      <text x="712" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không đọc được?</text>
      <!-- D5 -->
      <polygon points="912,48 992,96 912,144 832,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="912" y="92" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn trang ô đã nêu</text>
      <text x="912" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chưa tra?</text>

      <!-- Step S -->
      <rect x="1032" y="72" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1104" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm băm từng trang</text>
      <text x="1104" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--con-tro</text>

      <!-- E4: end, spine row -->
      <rect x="1216" y="64" width="160" height="64" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1296" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không cờ,</text>
      <text x="1296" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mời duyệt</text>

      <!-- ============ Outcomes row (y 200..272) ============ -->
      <!-- E1 -->
      <rect x="24" y="200" width="176" height="72" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="112" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thẻ như cũ,</text>
      <text x="112" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">giống từng byte</text>
      <!-- E2 -->
      <rect x="224" y="200" width="176" height="72" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="312" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cờ vàng đọc-cũ,</text>
      <text x="312" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không chặn</text>
      <!-- B1: CHẶN (accent) -->
      <rect x="424" y="200" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="512" y="224" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" letter-spacing="0.04em">CHẶN —</text>
      <text x="512" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">máy tự tra, ghi dòng,</text>
      <text x="512" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dựng lại thẻ</text>
      <!-- E3 -->
      <rect x="624" y="200" width="176" height="72" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="712" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cờ vàng không đọc được</text>
      <text x="712" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ở đây, không chặn</text>
      <!-- B2: CHẶN (accent) -->
      <rect x="824" y="200" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="912" y="232" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" letter-spacing="0.04em">CHẶN —</text>
      <text x="912" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nêu trang chưa tra</text>
      <!-- E5 -->
      <rect x="1016" y="200" width="176" height="72" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1104" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cờ vàng,</text>
      <text x="1104" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vẫn mời duyệt</text>

      <!-- ============ Hỏi-1 alternative: bracket under the two CHẶN nodes ============ -->
      <path d="M 512 276 L 512 284 Q 512 292 520 292 L 904 292 Q 912 292 912 284 L 912 276" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="712" y="316" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Lora', 'Instrument Serif', serif" text-anchor="middle">Hỏi-1 lối khác — nếu chỉ cờ vàng: hai nút CHẶN thành cờ vàng</text>

      <!-- ============ Legend ============ -->
      <line x1="24" y1="340" x2="1376" y2="340" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <polygon points="24,380 36,372 48,380 36,388" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="384" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi máy kiểm</text>

      <rect x="184" y="372" width="24" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="384" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước máy</text>

      <rect x="316" y="372" width="24" height="16" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="348" y="384" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kết quả trên thẻ</text>

      <rect x="476" y="372" width="24" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="508" y="384" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">CHẶN — thẻ không mời duyệt, ô quyết để trống</text>

      <line x1="772" y1="380" x2="800" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="808" y="384" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác của Hỏi-1</text>
    </svg>
  </div>
</body>
</html>
