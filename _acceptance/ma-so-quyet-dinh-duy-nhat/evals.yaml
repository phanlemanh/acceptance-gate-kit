  - id: E10
    criterion: AC-7
    executor: test
    cmd: config:executors.test.workflows
    paths: [feature-loop/skills/feature-loop/SKILL.md]
    expected: exit 0 — suite workflows hồi quy.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E11
    criterion: AC-8
    executor: test
    cmd: config:executors.test.scripts
    paths: [commands/approve.md, commands/signoff.md, tests/scripts/gate-card-dec-key.test.mjs]
    expected: >
      exit 0; stdout có "PASS: DK10" — approve.md và signoff.md đều chứa "DEC-ID-RECIPE" và KHÔNG chứa
      dạng cũ nào trong [d-<next>, d-<UTC>-<rand>, $RANDOM]; chiều đỏ: bản sao approve.md đổi
      "d-<UTC>-<n>" thành "d-<next>" → thông điệp ghim "approve.md: con dang ma cu d-<next>".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.scripts
    paths: [commands/acceptance-card.md, scripts/gate-card.js, tests/scripts/gate-card-dec-key.test.mjs]
    expected: >
      exit 0; stdout có "PASS: DK11" — khuôn phần tử rút từ khối DEC-PLAIN-ITEM-TEMPLATE của
      acceptance-card.md, điền bằng key của --extract (thay <key>, <câu>) rồi JSON.parse, render Cổng 1:
      đối chứng dương 4/4 dòng mang đúng "DICH <chữ của dòng>"; chiều đỏ trên cùng fixture: khuôn đổi
      tên trường "id" thành "key" → thông điệp ghim "khuon overlay khong dich duoc 4/4 dong".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
