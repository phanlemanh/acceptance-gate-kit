  - id: E10
    criterion: AC-7
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/scripts/hang.mjs, dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/trung-tep.mjs, feature-loop/skills/feature-loop/SKILL.md, tests/dieu-phoi/loi/vung-giao-viec.test.mjs]
    expected: >
      exit 0; "ok" cho "VG-7". VG-7: rút dòng lệnh khai vùng từ khối TRONG-DOT-VUNG của SKILL vòng lặp (marker), thay ô
      bằng slug x và vùng app/b/**, chạy bằng `node dieu-phoi.mjs` với cwd là worktree của dãy P1 → hàng x có ranh_gioi
      [vùng cũ…, "app/b/**"] (vùng cũ còn nguyên, thứ tự giữ), LUAT.md thêm đúng một dòng Nhật ký nêu x và app/b/**;
      nhịp kế của motNhip: hàng z chưa bắt đầu ở P2 khai app/b/c.tsx mang `sau` ["X"]; hàng z2 đã được chọn làm hàng kế
