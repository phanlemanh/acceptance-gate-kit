  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/**, tests/dieu-phoi/loi/vung-giao-viec.test.mjs, _acceptance/vung-giao-viec-tu-cat-luot/goc-so]
