schema_version: 1
feature_slug: vung-giao-viec-tu-cat-luot
# Ca đo sống ở hai tệp: tests/scripts/cat-luot-vung.test.mjs (in «PASS: CV-…»/«FAIL: CV-…», thoát khác 0 khi có FAIL)
# và tests/dieu-phoi/loi/vung-giao-viec.test.mjs (node --test; khoá executors.test.vung_giao_viec gộp dòng «ok … VG-»,
# «not ok», chẩn đoán và tổng kết TAP thành MỘT dòng). Suite xanh mà thiếu dòng ghim là ĐỎ. Fixture do code sinh trong
# lượt (thư mục đợt tạm, worktree tạm, lộ trình tạm), trừ bản phát lại ẩn danh dưới tests/dieu-phoi/fixtures/ — đầu vào
# như lượt cắt viết, đi qua răng phủ thật và bộ đọc gói thật trước khi chạy lịch. Đường dẫn suy từ vị trí tệp ca.
# Chiều đỏ trong bộ kiểm: ca «-do» tiêm vào BẢN SAO (trọn thư mục dieu-phoi, hoặc tệp răng) SAU khi bản sao lành xanh,
# và ghim thông điệp.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cat_luot_vung
    paths: [scripts/cat-luot.mjs, skills/acceptance/references/lo-trinh-template.json, skills/cat-luot/SKILL.md, tests/scripts/cat-luot-vung.test.mjs]
    expected: >
      exit 0; có dòng «PASS: CV-1» và «PASS: CV-1-do». CV-1: mọi hàng của khuôn lộ trình mang `vung` là mảng chuỗi khác
      rỗng; khối CAT-LUOT-VUNG của SKILL có mặt và nêu khoá `vung`; chạy răng phủ (kiemCo) trên khuôn với dot của hàng
      mẫu → 0 dòng lỗi hay cảnh báo mang cờ vung-*. CHIỀU ĐỎ (CV-1-do): bản sao khuôn bỏ `vung` ở một hàng mẫu → răng
      cho đúng một cảnh báo «[chua-khai-vung]» nêu mã hàng ấy.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/scripts/goi-dot.mjs, dieu-phoi/scripts/nguon-hang.mjs, skills/acceptance/references/lo-trinh-template.json, tests/dieu-phoi/loi/vung-giao-viec.test.mjs]
    expected: >
      exit 0; "ok" cho "VG-1". VG-1: gói tạm khai nguon_hang trỏ các hàng mẫu của khuôn lộ trình (chép khuôn vào kho tạm),
      hàng thi công không ranh_gioi → docGoi trả mỗi hàng ranh_gioi đúng bằng `vung` của hàng khuôn cùng mã. Đối chứng
      trong ca: bản sao khuôn bỏ `vung` → ranh_gioi vắng.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-1
    executor: judgment
    inputs: [skills/cat-luot/SKILL.md, docs/superpowers/specs/2026-10-28-vung-giao-viec-tu-cat-luot-design.md]
    question: >
      Đọc khối CAT-LUOT-VUNG và đoạn bước 3 của SKILL cắt lượt. Một phiên cắt lượt chưa từng thấy design doc có đủ chỉ dẫn
      để ghi `vung` cho MỖI hàng ở CẢ hai dáng (chuoi và lan-va) theo màn của câu giao, biết khi nào một hàng giữ cả khu
      (sửa khung chung) và khi nào chỉ một màn, và biết không ghi thư mục hồ sơ `_acceptance/` không? Trả PASS khi cả bốn
      điều có trong SKILL bằng lời rõ; FAIL nêu điều thiếu.
    expected: PASS
    evidence_required: [run_id, verdict, judges, rationale]
  - id: E4
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cat_luot_vung
    paths: [scripts/cat-luot.mjs, tests/scripts/cat-luot-vung.test.mjs]
    expected: >
      exit 0; có «PASS: CV-2» và «PASS: CV-2-do». CV-2: ma trận viết trước 9 hàng trong đợt × cờ mong đợi — `["**"]` →
      lỗi vung-qua-rong · `["*.tsx"]` → lỗi vung-qua-rong · `["**/khu/**"]` → lỗi vung-qua-rong · `"app/x/**"` (chuỗi,
      không mảng) → lỗi vung-sai-kieu · `[]` → lỗi vung-sai-kieu · vắng → cảnh báo chua-khai-vung ·
      `["_acceptance/x/**"]` → cảnh báo vung-chi-ho-so · `["app/khu/**"]` → không cờ vùng · `["app/khu/man-a/**",
      "README.md"]` → không cờ vùng; ba hàng mảng trộn: `["app/x/**", "**"]` → lỗi vung-qua-rong nêu «**» ·
      `["_acceptance/x/**", "app/y/**"]` → không cờ vùng · `["app/x/**", ""]` → lỗi vung-sai-kieu; cùng mười hai hàng ở
      đợt KHÁC → 0 dòng mang cờ vung-*. Mã thoát răng: 1 khi có lỗi vùng trong đợt, 0 khi chỉ cảnh báo. CHIỀU ĐỎ:
      CV-2-do bản sao răng mà phép thử thư mục tĩnh luôn đúng → hàng `["**"]` không còn cờ, ca in «CV-2-do: ** lot»;
      CV-2-do2 bản sao răng chỉ xét phần tử đầu của vung → hàng `["app/x/**", "**"]` không còn cờ, ca in «CV-2-do2:
      tron lot».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cat_luot_vung
    paths: [scripts/cat-luot.mjs, dieu-phoi/scripts/trung-tep.mjs, dieu-phoi/scripts/glob.mjs, tests/scripts/cat-luot-vung.test.mjs]
    expected: >
      exit 0; có «PASS: CV-3», «PASS: CV-3-do», «PASS: CV-4», «PASS: CV-4-do». CV-3: ba hàng `app/khu/**`,
      `app/khu/a/**`, `app/khu/b/x.tsx` (mọi cặp chồng) → đúng một lỗi «[vung-trung-moi-hang]» nêu ba mã; đổi hàng thứ ba
      thành `app/khac/**` → không lỗi ấy; hai hàng chồng nhau (dưới ba) → không lỗi ấy. CV-4: ma trận ≥ 12 cặp glob (tệp
      × thư mục, thư mục lồng, anh em `a/**` × `ab/**`, `*.tsx` cùng cấp × thư mục con, hai mẫu đại diện cùng tiền tố) →
      phép so trong khối VUNG-GIAO-CHEP của răng trả ĐÚNG như `mauGiao` của dieu-phoi/scripts/trung-tep.mjs ở mọi cặp;
      khối chép mang `khop` và `mauGiao` nguyên văn thân hàm. CHIỀU ĐỎ: CV-3-do bản sao răng bỏ kiểm quan hệ → ca in
      «CV-3-do: moi cap chong lot»; CV-4-do bản sao khối chép đổi `startsWith` thành `===` → ca in «CV-4-do: lech <cặp>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-4
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/scripts/goi-dot.mjs, dieu-phoi/scripts/nguon-hang.mjs, tests/dieu-phoi/loi/vung-giao-viec.test.mjs]
    expected: >
      exit 0; "ok" cho "VG-4". VG-4 trên CÙNG một gói tạm ba hàng nguồn: A (lộ trình có vung, thi công không ranh_gioi)
      → ranh_gioi = vung của A; B (lộ trình có vung, thi công khai tay `["tay/**"]`) → ranh_gioi = ["tay/**"]; C (lộ
      trình không vung, thi công không ranh_gioi) → không có khoá ranh_gioi. docHangLoTrinh trả `vung` cho A, B và không
      cho C. CHIỀU ĐỎ (VG-4-do): bản sao trọn thư mục dieu-phoi, goi-dot bỏ dòng chép → A không còn ranh_gioi, ca ghim
      «VG-4-do: A khong nhan vung».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-5
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/scripts/hang.mjs, dieu-phoi/scripts/nguon-hang.mjs, tests/dieu-phoi/loi/vung-giao-viec.test.mjs]
    expected: >
      exit 0; "ok" cho "VG-5". VG-5: đợt tạm có cấu hình nguon_hang trỏ lộ trình tạm có hàng M (vung `["app/m/**"]`)
      chưa có trong hang-viec; trang-thai cho hàng Y ở dãy khác đang làm với ranh_gioi `["app/m/a.tsx"]` → `hang them M
