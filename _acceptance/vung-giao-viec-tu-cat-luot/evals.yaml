      ["app/khac/**"] và không sau; mã không có trong lộ trình → hàng không ranh_gioi và cảnh báo «không khai ranh_gioi»
      như cũ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-6
    executor: test
    cmd: config:executors.test.vung_giao_viec
    paths: [dieu-phoi/scripts/goi-dot.mjs, dieu-phoi/scripts/nguon-hang.mjs, dieu-phoi/scripts/trung-tep.mjs, dieu-phoi/scripts/lich.mjs, dieu-phoi/scripts/phat-lich.mjs, scripts/cat-luot.mjs, tests/dieu-phoi/fixtures/dot-chong-vung/**, tests/dieu-phoi/loi/vung-giao-viec.test.mjs]
    expected: >
      exit 0; "ok" cho "VG-6". VG-6: lộ trình phát lại qua răng phủ (kiemCo) → 0 lỗi vùng; gói phát lại qua docGoi →
      mười bốn hàng, mỗi hàng ranh_gioi = vung; dựng thư mục đợt tạm, chạy motNhip theo kịch bản tiến độ của bản phát lại
      (hàng đầu mỗi dãy bắt đầu; hàng xong theo thứ tự gộp ghi trong kịch bản) → khi dãy của hàng dáng VK8 tới lượt hàng
      ấy, hàng dáng VK6 còn đang làm và hàng dáng VK8 mang `sau` chứa mã hàng dáng VK6 kèm một sự kiện doi-ke-hoach
      them-sau. Đối chứng cùng kịch bản, gói không vùng (bỏ `vung` khỏi lộ trình) → hàng dáng VK8 không có `sau`. Cặp
      chồng của bản phát lại so BẰNG danh sách 25 cặp viết trước trong ca (H2-H3 … H11-H12) và k = 25 ≤ trần 45 (một nửa
      91 cặp; mức 78/91 của paths đã bị loại); ca in «VG-6 cặp chồng: 25/91». VG-6-an-danh: MỌI chuỗi trong
      tests/dieu-phoi/fixtures/dot-chong-vung/ khớp khuôn tổng hợp đã khai (mã H<số>, P<số>, slug hang-<số>, dãy V<số>,
      đoạn đường thuộc {app, api, ui, tro-ly, khu, khu-chu, man-<chữ>, **, khu-*.ts}, câu «Người dùng mở màn của hàng
      <số>», cùng các giá trị khuôn cố định của gói) — bản lành 0 khớp lạ. CHIỀU ĐỎ: VG-6-do bản sao bản phát lại đổi
      mọi vùng thành app/khu/** → ca in «VG-6-do: cap chong 91/91 vuot tran 45»; VG-6-an-danh-do bản sao tiêm một slug
      ngoài khuôn → đúng một khớp lạ nêu tệp và chuỗi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
