schema_version: 1
feature_slug: trang-lo-trinh-doc-mot-phut
# Hai tệp ca đo: tests/scripts/lo-trinh.test.mjs (LT-90…, cấu trúc HTML, chạy bằng Node) và
# tests/scripts/lo-trinh-trang.test.mjs (LTT-*, đo trên Chrome thật qua CDP bằng
# tests/scripts/lo-trinh-do-trang.mjs, ngày đóng băng 2026-10-03). Kho thử do code sinh trong lượt
# (git init thư mục tạm; trạng thái hai lộ trình dựng từ fixture crm-okr + crm-kho-tai-lieu và
# `_nguon.ho_so` của chúng). Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao vật bị tiêm, SAU khi bản lành
# xanh trên cùng kho thử, và ghim thông điệp rút từ đầu ra của hàm đo. Mỗi eval ghim đúng dòng
# "PASS: …" — suite xanh mà thiếu dòng ghim là ĐỎ. Không có Chrome → ca LTT ĐỎ nêu tên, không bỏ qua.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-90" — kho thử hai lộ trình (một có hàng kế, một có tệp hỏng) và kho
      một lộ trình rỗng: mỗi lộ trình đọc được có đúng một thẻ theo thứ tự khai với bốn nhãn «Làm tiếp»,
      «Cần sửa trong kế hoạch», «Mốc kế tiếp», «Tiến độ» theo thứ tự; liên kết mã hàng kế trỏ một neo có
      trên trang; lệnh in == "/feature-loop:feature-loop " + hangKe.thamSo của JSON quét start cùng kho;
      số chỗ lệch == số cờ của lộ trình; ba số tiến độ cộng == số hàng; thẻ tệp hỏng chỉ có câu
      «Không đọc được kế hoạch <tệp>»; kho rỗng có «Kế hoạch chưa có việc nào». Và "PASS: LT-90-do" — bản
      sao bộ vẽ in mã trơn thay `<tệp>:<mã>` khi nhiều tệp: CHÍNH hàm đo trả lỗi nêu thamSo.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-91" — danh sách chỗ lệch của mỗi mục == bảng dịch áp lên kq.co (đẳng
      thức, đúng thứ tự); mỗi chỗ lệch có mã hàng là `<a>` bọc trọn ô trỏ neo có trên trang; danh sách
      đứng trước bảng việc của mục. Và "PASS: LT-05-the" — cờ thẻ start == kq.co gốc, số chỗ lệch trang ==
      số cờ thẻ. Và "PASS: LT-91-do" — bản sao bỏ một cờ khi vẽ: CHÍNH hàm đo trả lỗi đếm lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-92" — kho thử có hàng đã giao, đang làm, chưa mở, hàng không hồ sơ, cột
      «Vì sao» rỗng mọi hàng: tập mã bảng «Việc còn mở» == hàng ngoài nhóm đã giao; tập mã trong
      `<details>` (không có thuộc tính open) == hàng đã giao, tiêu đề «N việc đã giao»; hợp hai tập ==
      mọi hàng; mỗi hàng có id `lt<i>-h-<mã>`; «Cần xong trước» là liên kết tới id có trên trang; hàng
      không hồ sơ có «theo ghi chép, chưa có hồ sơ»; không bảng nào có cột «Vì sao»; cột «Mã» và
      «Trạng thái» luôn có. Và "PASS: LT-92-do" — bản sao không gập hàng đã giao: CHÍNH hàm đo trả lỗi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-93" — kho hai lộ trình có ba hồ sơ không lộ trình nào trỏ: mỗi slug đó
      xuất hiện đúng một lần trong trang, trong `<details>` cuối trang, tiêu đề «3 hồ sơ không thuộc kế
      hoạch nào»; kho mọi hồ sơ đều thuộc lộ trình thì không có khối. Và "PASS: LT-11" (chữ mới: khối
      ngoài kế hoạch chứa ngoai1, ngoai2, mốc và mục đã bác đủ). Và "PASS: LT-93-do" — bản sao in khối
      mỗi lộ trình một lần: CHÍNH hàm đo trả lỗi «xuất hiện 2 lần».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.lo_trinh_trang
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-trang.test.mjs, tests/scripts/lo-trinh-do-trang.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-94" (Node) — dải mốc sắp theo ngày, mỗi mốc mang data-ngay, mốc không
      gắn việc có «chưa gắn việc», tiêu đề «k/N mốc chưa gắn việc nào» với k, N đếm từ dữ liệu; trang không
      chứa chuỗi ngày hôm nay của máy vẽ. Và "PASS: LTT-moc" (Chrome, ngày đóng băng 2026-10-03, kho có
      mốc đã qua, mốc hôm nay, mốc tương lai) — ô Mốc kế tiếp của thẻ == tên + ngày + «hôm nay» của mốc
      hôm nay; mốc đã qua ghi «đã qua»; đổi ngày đóng băng sang hôm sau thì ô ghi mốc tương lai «còn N
      ngày» với N đúng. Và "PASS: LTT-moc-khong-script" — tắt script: ô thẻ «Xem dải mốc bên dưới», dải
      mốc vẫn có ngày.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-06" (vẽ hai lần giống từng byte, --check xanh), "PASS: LT-06-do" (sửa
      byte · đổi hồ sơ có hàng trỏ · xoá trang → --check exit 1 nêu LO-TRINH.html và lệnh vẽ lại) và
      "PASS: LT-95" — vẽ cùng kho trong hai tiến trình con có `Date` bị chặn ở 2026-10-03 và 2026-10-06:
      hai trang giống từng byte (đối chứng: cả hai tiến trình thoát 0, trang khác rỗng). Và "PASS: LT-95-do"
      — bản sao bộ vẽ chèn ngày vẽ dd/mm/yyyy: CHÍNH hàm so trả lỗi nêu vị trí byte đầu tiên lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.lo_trinh_trang
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-trang.test.mjs, tests/scripts/lo-trinh-do-trang.mjs]
    expected: >
      exit 0; stdout có "PASS: LTT-san" — năm trạng thái × ba khổ × hai màu = 30 ô (số ô in ra, assert ==
      30): mọi ô manDau đúng, không tràn, ≤ 6 cỡ chữ, h1 > h2 > h3, tương phản thấp nhất ≥ ngưỡng, nút
      ≥ 44px; trang hai lộ trình cao ≤ 3900 ở 1440; in ô xấu nhất mỗi thước. Và "PASS: LTT-san-do" — bốn
      bản sao bộ vẽ, mỗi bản tiêm một lỗi (màu chữ phụ #bbbbbb · bỏ khối CSS điện thoại · h2 32px · summary
      không min-height): CHÍNH hàm đo trả đúng thước bị phá (tương phản · tràn hoặc màn đầu · tiêu đề · nút)
      và chỉ thước đó. Và "PASS: LTT-san-im" — đổi câu giải thích cuối trang thành câu dài gấp đôi: mọi
      thước vẫn xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-96" — mọi `td` của mọi bảng có data-nhan == văn bản `th` cùng cột. Và
      "PASS: LT-96-do" — bản sao gán data-nhan lệch một cột: CHÍNH hàm đo nêu cột lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.lo_trinh_trang
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh-trang.test.mjs, tests/scripts/lo-trinh-do-trang.mjs]
    expected: >
      exit 0; stdout có "PASS: LTT-hanh-vi" — Chrome 1440, trang hai lộ trình: cuộn tới giữa bảng việc còn
      mở thì `th` đầu bảng có top trong [0, chiều cao màn); `.lenh` có computed user-select == "all"; mở
      trang tại `#<neo hàng>` thì hàng đó có outline-width > 0 và một hàng khác có outline-width == 0. Và
      "PASS: LTT-hanh-vi-do" — ba bản sao bộ vẽ, mỗi bản gỡ một thuộc tính (position sticky · user-select ·
      outline của :target): CHÍNH hàm đo trả đúng vế bị gỡ và chỉ vế đó.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-97" — ma trận viết sẵn trong ca: mỗi dạng cờ trong mã là một hàng có tên,
      kèm cách kích và câu đích viết tay (không rút từ bảng dịch); số hàng ma trận == số dạng đếm từ mã lớp
      phân tích (mọi `co.push(`/`coHang.push(`/`dat(` có chuỗi, cộng cờ khai hai lần trong
      lo-trinh-khoa) == số dòng bảng dịch == số dạng kho thử thật sự phát ra (in bốn số, assert bằng nhau,
      0 thì ĐỎ); với từng dạng: chỗ lệch trên trang == câu đích (đẳng thức, sau khi thay giá trị), chứa mọi
      giá trị của cờ gốc, không chứa chuỗi cấm; chữ trang ngoài `<code>` và lệnh mở không chứa cụm cấm.
      Và "PASS: LT-97-do" — bản sao xoá một dòng bảng dịch: CHÍNH hàm đo nêu đúng tên dạng rơi về nguyên
      văn; "PASS: LT-97-do2" — bản sao đảo hai nhóm bắt trong dòng dịch «kế hoạch ghi «K», hồ sơ ghi «H»»:
      CHÍNH hàm đo nêu dạng đó và câu sai.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, scripts/product-map.mjs, scripts/start-scan.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-01" (ổ cắm vắng: không trang, mô-đun không nạp), "PASS: LT-80" (kho không
      khai: bản đồ + JSON quét giống từng byte bộ e4a399ed) và "PASS: LT-98" — kho hai lộ trình một tệp
      hỏng: thẻ và mục tệp hỏng có câu lỗi, lộ trình kia đủ bốn nhãn thẻ và bảng việc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: judgment
    inputs:
      - _acceptance/trang-lo-trinh-doc-mot-phut/mau/hai-lo-trinh.html
      - _acceptance/trang-lo-trinh-doc-mot-phut/mau/hai-lo-trinh--1440.png
      - _acceptance/trang-lo-trinh-doc-mot-phut/mau/hai-lo-trinh--375.png
    paths: [scripts/lo-trinh.mjs, _acceptance/trang-lo-trinh-doc-mot-phut/mau/hai-lo-trinh.html]
    question: >
      Hội đồng context sạch chỉ đọc ba tệp ở `inputs`: trang mẫu trạng thái hai lộ trình (HTML do bộ vẽ
      của vòng sinh từ fixture crm; ca LT-99-mau giữ nó bằng từng byte bản vẽ lại trong lượt) và hai ảnh
      màn đầu của chính trang đó ở 1440 và 375 (chụp bằng `tests/scripts/lo-trinh-do-trang.mjs --chup`,
      ngày đóng băng 2026-10-03; ảnh là bản chiếu, máy giữ HTML). Chỉ từ ẢNH, cho TỪNG lộ trình: việc làm
      tiếp là gì (mã + câu), mốc gần nhất là gì và còn bao lâu, có bao nhiêu chỗ lệch — và có chữ nào
      người đọc không trong nhóm làm kit phải hỏi nghĩa không.
    expected: >
      PASS khi cả hai ảnh trả lời đủ ba câu cho cả hai lộ trình và không có chữ nội bộ (tên trường,
      «cờ», «tự khai», «câu giao»…). FAIL khi thiếu một câu ở một ảnh hoặc có chữ nội bộ — nêu chữ đó.
      UNCERTAIN khi ảnh không đọc được.
    evidence_required: [run_id, verifier, verified_at, output]
  - id: E11b
    criterion: AC-11
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs, _acceptance/trang-lo-trinh-doc-mot-phut/mau/hai-lo-trinh.html, _acceptance/trang-lo-trinh-doc-mot-phut/mau/anh.json]
    expected: >
      exit 0; stdout có "PASS: LT-99-mau" — trang mẫu hội đồng đọc == bản vẽ lại trong lượt từ fixture crm
      (hai lộ trình) bằng bộ vẽ của cây đang kiểm, từng byte; và `mau/anh.json` (do lệnh chụp ghi) có
      sha256 của HTML nguồn == sha256 của trang mẫu, sha256 của từng PNG == băm của tệp PNG trong `mau/`
      — ảnh lỗi thời so với trang thì ĐỎ nêu tệp. Và "PASS: LT-99-do" — đổi một byte trang mẫu sau khi
      chụp: CHÍNH hàm đo nêu «ảnh chụp từ trang khác».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, scripts/lo-trinh-khoa.cjs, scripts/start-scan.mjs, "lib/**", tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-100" — kho thử hai lộ trình từ fixture crm-okr + crm-kho-tai-lieu và
      `_nguon.ho_so` sinh trong lượt; bộ máy base lấy bằng `git archive v2.21.0 scripts lib` (trọn thư
      mục; tag không resolve thì FAIL, không bỏ qua); chạy `phanTichKho` (bỏ ra hàm render) và
      `start-scan.mjs --root` ở base và ở cây đang kiểm: đối chứng dương hai bên thoát 0 và có ≥ 1 hàng
      mỗi lộ trình; kết quả JSON hai bên bằng nhau toàn phần. Và "PASS: LT-100-do" — bản sao cây đang
      kiểm đổi một luật nhóm trong suyTrangThai: CHÍNH hàm so trả lỗi nêu hàng lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
