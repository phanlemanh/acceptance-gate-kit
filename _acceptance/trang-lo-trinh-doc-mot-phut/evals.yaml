schema_version: 1
feature_slug: trang-lo-trinh-doc-mot-phut
# Hai tệp ca đo: tests/scripts/lo-trinh.test.mjs (LT-90…, cấu trúc HTML, chạy bằng Node) và
# tests/scripts/xem-trang-lo-trinh.test.mjs (LTT-*, đo trên Chrome thật qua CDP bằng
# tests/scripts/lo-trinh-do-trang.mjs, ngày đóng băng 2026-10-03). Kho thử do code sinh trong lượt
# (git init thư mục tạm; trạng thái hai lộ trình dựng từ fixture crm-okr + crm-kho-tai-lieu và
# `_nguon.ho_so` của chúng). Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao vật bị tiêm, SAU khi bản lành
# xanh trên cùng kho thử, và ghim thông điệp rút từ đầu ra của hàm đo. Mỗi eval ghim đúng dòng
# "PASS: …" — suite xanh mà thiếu dòng ghim là ĐỎ. Không có Chrome → ca LTT ĐỎ nêu tên, không bỏ qua.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-90" — kho thử hai lộ trình (một có hàng kế, một có tệp hỏng), kho
      một lộ trình rỗng, kho mã trùng (T đã giao + T chưa giao) và kho việc không mã: mỗi lộ trình đọc
      được có đúng một thẻ theo thứ tự khai với bốn nhãn «Làm tiếp», «Cần sửa trong kế hoạch», «Mốc kế
      tiếp», «Tiến độ» theo thứ tự; liên kết mã hàng kế == neo của CHÍNH hàng kế (đọc từ bảng: mã + câu
      giao; kho mã trùng → `#lt1-h-T-2` và câu «hai»); lệnh in == "/feature-loop:feature-loop " +
      hangKe.thamSo của JSON quét start cùng kho, không tham số thì thẻ nói «Mã này trùng…» hoặc «Việc
      này chưa có mã»; «N chỗ cần sửa» == số cờ + số từ trạng thái lạ; các số tiến độ cộng == số hàng;
      thẻ tệp hỏng chỉ có câu «Không đọc được kế hoạch <tệp>»; kho rỗng có «Kế hoạch chưa có việc nào». Và "PASS: LT-90-do" — bản
      sao bộ vẽ in mã trơn thay `<tệp>:<mã>` khi nhiều tệp: CHÍNH hàm đo trả lỗi nêu thamSo.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
