    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-91" — danh sách chỗ cần sửa của mỗi mục == bảng dịch áp lên kq.co (đẳng
      thức, đúng thứ tự) rồi một ô mỗi từ trạng thái lạ (câu viết trong ca); mỗi chỗ có mã hàng là `<a>`
      bọc trọn ô trỏ ĐÚNG neo của hàng đầu mang mã đó (đọc từ bảng); danh sách đứng trước bảng việc. Và "PASS: LT-05-the" — cờ thẻ start == kq.co gốc, số chỗ lệch trang ==
      số cờ thẻ. Và "PASS: LT-91-do" — bản sao bỏ một cờ khi vẽ: CHÍNH hàm đo trả lỗi đếm lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
