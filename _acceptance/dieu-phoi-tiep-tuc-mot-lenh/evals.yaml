schema_version: 1
feature_slug: dieu-phoi-tiep-tuc-mot-lenh
# Ca đo của hàng sống ở tests/dieu-phoi/tiep-tuc.test.mjs (tên ca bắt đầu «DP3-»). Khoá executor thêm ở S3:
#   executors.test.dieu_phoi_dp3 = node --test trên tests/dieu-phoi/**, gộp dòng «ok … DP1-|DP2-|DP3-»,
#     «not ok», dòng chẩn đoán «#   …» và tổng kết TAP thành MỘT dòng
#   executors.test.dieu_phoi_lb   = LB_CASES=LB1,LB2 node tests/plugins/lenh-bam-duoc.test.mjs (có từ DP2)
# Kho thử do code sinh trong lượt (git init trong thư mục tạm). Đường dẫn suy từ vị trí tệp test. Đồng hồ
# giả truyền vào hàm. Mỗi ca đỏ chạy CHÍNH hàm/lệnh đo trên bản sao bị tiêm, SAU khi bản lành xanh trên cùng
# fixture, kiểm riêng từng lần thay đã áp, và ghim dấu hiệu của ĐÚNG lỗi được tiêm (không ghim chữ mà mọi
# thông báo lỗi đều mang). Ma trận viết sẵn: số assert = số hàng ma trận, in ra. Lời hứa là đẳng thức thì
# so bằng nhau, không so bao hàm. Mỗi eval ghim đúng dòng TAP «ok … - DP3-…». Suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_dp3
    paths: [dieu-phoi/commands/**, tests/dieu-phoi/mo-dot.test.mjs, tests/dieu-phoi/tiep-tuc.test.mjs]
    expected: >
      exit 0; "ok" cho "DP2-01 ba-lenh" với tập tên tệp dưới dieu-phoi/commands/ == {mo-dot.md, dong-dot.md,
      xem.md, tiep-tuc.md} (đẳng thức tập, in ra); không tệp nào khoá model-invocation; script của gói đi qua
      ${CLAUDE_PLUGIN_ROOT}. "ok" cho "DP3-01 trinh-tu": trong tiep-tuc.md, vị trí của lời gọi CLI
      `tiep-tuc` đứng TRƯỚC mọi câu giăng Monitor và mọi câu mở chip, câu «thoi_vai» đứng trước Monitor, có
      dạng `--nhe`, và MỖI hành động trong hằng HANH_DONG của tiep-tuc.mjs (rút lúc chạy, không chép tay —
      sáu hành động khong · nhan-giang-lai · mo-chip · worktree-mat · cho-nguoi · chua-biet) có một dòng xử
      lý trong thân lệnh. "ok"
      cho "DP3-01-do dao-buoc": bản sao chuyển đoạn lời gọi CLI xuống sau câu mở chip (kiểm bước tiêm áp) →
      hàm kiểm nêu "tiep-tuc.md: trình tự" với hai vị trí in ra.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.dieu_phoi_validate
    paths: [dieu-phoi/commands/**, dieu-phoi/.claude-plugin/plugin.json, dieu-phoi/hooks/hooks.json]
    expected: >
      exit 0; stdout có "PASS: DP1-01b validate" (bộ kiểm gói Claude Code --strict sạch lỗi trên gói có
      bốn lệnh) và "PASS: DP1-01b-do bo-lop-hooks".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1c
    criterion: AC-1
    executor: judgment
    inputs: [dieu-phoi/commands/tiep-tuc.md, _acceptance/dieu-phoi-tiep-tuc-mot-lenh/contract.md, docs/superpowers/specs/2026-10-11-dieu-phoi-tiep-tuc-mot-lenh-design.md, docs/superpowers/specs/2026-10-10-dieu-phoi-workflow-design.md]
    question: >
      Đọc trình tự AC-1 của contract.md và §4.2 bước 2–7, §5 của spec workflow, trừ phần đã dời sang DP4 ở Out
      of scope của contract (đọc mức dùng, ban-giao.json, chuyển pha từ hai trạng thái ★). Thân tiep-tuc.md có
      đi đúng trình tự đó không: CLI tính kế hoạch trước, phiên chỉ làm việc của app theo đúng hành động CLI
      trả cho từng dãy, không tự suy dãy nào cần chip; phiên đã thôi vai thì dừng Monitor và không ghi gì; dạng
      --nhe chỉ làm phần thức. Có chỗ nào thân lệnh để phiên tự đổi pha của đợt hay tự mở chip cho dãy CLI báo
      `khong` không? Trả PASS khi đúng trình tự và không có chỗ nào như vậy.
    evidence_required: [run_id, verdict, rationale]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_dp3
    paths: [dieu-phoi/scripts/hook-nhip.mjs, dieu-phoi/scripts/song.mjs, dieu-phoi/scripts/chan-doan.mjs, dieu-phoi/hooks/hooks.json, tests/dieu-phoi/tiep-tuc.test.mjs]
    expected: >
      exit 0; "ok" cho "DP3-02 ghi-nhip": chạy CHÍNH lệnh hook PostToolUse rút từ dieu-phoi/hooks/hooks.json
      (thay ${CLAUDE_PLUGIN_ROOT}) với stdin {session_id:"s-p1", cwd:<worktree P1>} rồi {session_id:"s-gs",
      cwd:<gốc kho>} → song/s-p1.json có {phien:"s-p1", day:"P1", worktree:<realpath worktree P1>} và song/s-gs.json
      có day null (so sâu trên ba khoá, luc là ISO). "ok" cho "DP3-02 30-giay": gọi lại trong 30″ → mtime tệp
      không đổi; đồng hồ giả +31″ → tệp ghi lại. "ok" cho "DP3-02 round-trip": chan-doan thật trên cùng đợt
      báo dãy P1 có phiên sống (mục day:P1, trường song == "s-p1"). "ok" cho "DP3-02-do khong-dot": kho thử
      không đợt, cùng lệnh hook → băm cây trước == sau (đối chứng: kho có đợt thì tệp được tạo).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dieu_phoi_dp3
    paths: [dieu-phoi/scripts/tiep-tuc.mjs, dieu-phoi/scripts/chan-doan.mjs, dieu-phoi/scripts/song.mjs, tests/dieu-phoi/tiep-tuc.test.mjs]
    expected: >
      exit 0; "ok" cho "DP3-03 ma-tran": ma trận viết sẵn 7 hàng (a)–(g) như AC-3, mỗi hàng khai tuổi nhịp,
      đồng hồ giả, nhịp do hook thật ghi (lệnh rút từ hooks.json, đồng hồ giả lùi mtime); số assert = 7 (in
      ra); hành động trong `chan-doan --json` (mục day:<id>) và trong `tiep-tuc --json` (ke_hoach) lần lượt
