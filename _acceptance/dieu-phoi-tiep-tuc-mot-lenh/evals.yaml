      của dãy>"; việc của (g) chứa "kiểm thanh bên". "ok" cho "DP3-03-do bo-khoa": bản sao bỏ điều kiện giữ
      khoá (kiểm bước tiêm áp) → hàm kiểm nêu đúng "(d): mo-chip, cần khong" và không nêu hàng nào khác. "ok"
      cho "DP3-03-do bo-chua-biet": bản sao bỏ nhánh đợt-chưa-có-nhịp → nêu đúng "(g): mo-chip, cần chua-biet"
      và không nêu hàng nào khác.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
