<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn xin lượt tìm hàng theo ba bước</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · đơn xin lượt</p>
    <h1>Đơn xin lượt tìm hàng theo ba bước, bước hai là bước mới</h1>

    <svg viewBox="0 0 1000 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng quyết định ba bước để biết đơn xin lượt mang hàng nào">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Đơn -> Bước 1 -->
      <line x1="500" y1="88" x2="500" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước 1 CÓ -> dùng cờ -->
      <line x1="620" y1="176" x2="744" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước 1 KHÔNG -> Bước 2 -->
      <line x1="500" y1="228" x2="500" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước 2 đúng một -> dùng hồ sơ -->
      <line x1="630" y1="336" x2="744" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước 2 từ hai -> từ chối -->
      <line x1="370" y1="336" x2="256" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước 2 không có -> Bước 3 -->
      <line x1="500" y1="404" x2="500" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px clear of the stroke) -->
      <rect x="668" y="152" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="682" y="164" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="508" y="240" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="532" y="252" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="655" y="312" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="687" y="324" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐÚNG MỘT</text>

      <rect x="264" y="312" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="312" y="324" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TỪ 2 CÙNG BẬC</text>

      <rect x="508" y="416" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="540" y="428" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG CÓ</text>

      <!-- Đơn xin lượt (oval, start) -->
      <rect x="380" y="36" width="240" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="380" y="36" width="240" height="52" rx="26" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đơn xin lượt</text>
      <text x="500" y="76" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">cần biết mang hàng nào</text>

      <!-- Bước 1 (diamond) -->
      <polygon points="500,124 620,176 500,228 380,176" fill="#f5f5f5"/>
      <polygon points="500,124 620,176 500,228 380,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="164" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 1</text>
      <text x="500" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có chỉ rõ tên hàng?</text>

      <!-- Dùng đúng tên đó (oval, end) -->
      <rect x="744" y="152" width="216" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="744" y="152" width="216" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="852" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng đúng hàng đó</text>
      <text x="852" y="190" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">tên được chỉ luôn thắng</text>

      <!-- Bước 2 (diamond, focal) -->
      <polygon points="500,268 630,336 500,404 370,336" fill="#f5f5f5"/>
      <polygon points="500,268 630,336 500,404 370,336" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="500" y="316" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 2 · MỚI</text>
      <text x="500" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dãy có hồ sơ chưa gộp</text>
      <text x="500" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong cây làm việc?</text>

      <!-- Dùng hồ sơ ấy (oval, end) -->
      <rect x="744" y="312" width="216" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="744" y="312" width="216" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="852" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng hồ sơ ấy</text>
      <text x="852" y="350" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">đơn mang hàng của nó</text>

      <!-- Từ chối (oval, end) -->
      <rect x="40" y="308" width="216" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="308" width="216" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="148" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Từ chối, không ghi gì</text>
      <text x="148" y="348" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">in tên các hồ sơ, dặn chỉ rõ tên</text>

      <!-- Bước 3 (rectangle, step) -->
      <rect x="380" y="452" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="452" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="396" y="472" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BƯỚC 3</text>
      <text x="500" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hàng kế của lịch (như trước)</text>

      <!-- Annotation 1: bậc (margin, bottom-left) -->
      <text x="40" y="436" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Bậc theo loại lượt:</text>
      <text x="40" y="456" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">chấm lại — đang chấm, rồi đã thông;</text>
      <text x="40" y="476" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">ghim lại, gộp — chỉ đã thông.</text>
      <path d="M 250 450 Q 350 436 432 368" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="432" cy="368" r="2" fill="#2d3142"/>

      <!-- Annotation 2: đường nền (margin, right) -->
      <text x="960" y="488" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">Đường nền đi thẳng đến bước 3</text>
      <path d="M 772 484 Q 700 492 624 484" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="620" cy="484" r="2" fill="#2d3142"/>

      <!-- Legend -->
      <line x1="40" y1="544" x2="960" y2="544" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHO BIẾT LOẠI</text>

      <rect x="40" y="576" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu / kết quả</text>

      <polygon points="220,582 232,576 244,582 232,588" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi</text>

      <rect x="340" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước làm</text>

      <rect x="480" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="512" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước mới của vòng này</text>

      <line x1="680" y1="582" x2="708" y2="582" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="716" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ghi chú bên lề</text>
    </svg>

    <footer>Nguồn: _acceptance/lenh-dot-ghi-dung-hang/design.md §2.1 · hình là chiếu của chữ, sửa ở nguồn rồi vẽ lại</footer>
  </div>
</body>
</html>
