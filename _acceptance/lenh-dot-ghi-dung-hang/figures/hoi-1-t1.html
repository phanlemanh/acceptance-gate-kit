<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ T1 đã gộp: đưa vào vòng hay để hạt giống</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · Hỏi-1</p>
    <h1>Hồ sơ T1 đã gộp: đưa vào vòng này hay để hạt giống?</h1>

    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cây quyết định hai nhánh cho hồ sơ T1 đã lên nhánh chính">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Gốc -> Quyết định -->
      <line x1="500" y1="92" x2="500" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Quyết định -> Nhánh A (máy khuyên, accent) -->
      <path d="M380 184 H222 Q214 184 214 192 V288" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Quyết định -> Nhánh B -->
      <path d="M620 184 H778 Q786 184 786 192 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hệ quả -> Giá -->
      <line x1="214" y1="376" x2="214" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="786" y1="376" x2="786" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px above the stroke) -->
      <rect x="259" y="160" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="301" y="172" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯA VÀO VÒNG</text>
      <rect x="657" y="160" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="699" y="172" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỂ HẠT GIỐNG</text>

      <!-- Gốc (oval) -->
      <rect x="300" y="36" width="400" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="300" y="36" width="400" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ T1 đã lên nhánh chính</text>
      <text x="500" y="80" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">không qua cổng, giữ nháp mãi</text>

      <!-- Quyết định (diamond) -->
      <polygon points="500,128 620,184 500,240 380,184" fill="#f5f5f5"/>
      <polygon points="500,128 620,184 500,240 380,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="181" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đưa vào vòng này,</text>
      <text x="500" y="197" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hay để hạt giống?</text>

      <!-- Nhánh A: hệ quả (focal, máy khuyên) -->
      <rect x="64" y="288" width="300" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="288" width="300" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="80" y="309" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MÁY KHUYÊN</text>
      <text x="214" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lịch coi hồ sơ là xong</text>
      <text x="214" y="358" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Thợ được giao hàng kế</text>

      <!-- Nhánh B: hệ quả -->
      <rect x="636" y="288" width="300" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="636" y="288" width="300" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="786" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lịch vẫn coi là đang làm</text>
      <text x="786" y="358" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Lời ghi danh gửi thợ vào hồ sơ đã gộp</text>

      <!-- Giá A -->
      <rect x="64" y="424" width="300" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="424" width="300" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="80" y="444" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ</text>
      <text x="214" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm một tiêu chí (AC-7)</text>

      <!-- Giá B -->
      <rect x="636" y="424" width="300" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="636" y="424" width="300" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="652" y="444" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ</text>
      <text x="786" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho tiêu thụ tự lách tới bản sau</text>

      <!-- Legend -->
      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHO BIẾT LOẠI</text>

      <rect x="40" y="552" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm xuất phát</text>

      <polygon points="200,558 212,552 224,558 212,564" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi quyết định</text>

      <rect x="380" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="412" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả</text>

      <rect x="500" y="552" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="532" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Giá phải trả</text>

      <line x1="660" y1="558" x2="688" y2="558" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="696" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
    </svg>

    <footer>Nguồn: _acceptance/lenh-dot-ghi-dung-hang/design.md §2.4 · hình là chiếu của chữ, sửa ở nguồn rồi vẽ lại</footer>
  </div>
</body>
</html>
