      gì", số dòng Nhật ký và số dòng su-kien.jsonl không đổi. "ok" cho "TC2-04-do cat-slug": bản lành xanh; bản sao gói bỏ
      nhánh giữ đối số dạng slug (kiểm nhát tiêm khớp một lần) → hàm kiểm nêu "slug bị cắt còn sáu từ".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
