    cmd: config:executors.test.dieu_phoi_tc2
    paths: [dieu-phoi/scripts/hang.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/lenh-dot-ghi-dung-hang.test.mjs]
