schema_version: 1
feature_slug: lo-trinh-cat-luot
# Ca đo sống ở tests/scripts/lo-trinh.test.mjs (LT-130..LT-141), executor `executors.test.lo_trinh`
# sẵn có. Kho thử do code sinh trong lượt (git init thư mục tạm). Bản phạm vi thử sinh bằng HÀM ghi
# dựng trên khối mẫu rút từ khuôn pham-vi-template.md (không viết tay đúng khuôn bên đọc). Mỗi ca đỏ chạy
# CHÍNH hàm đo trên bản sao vật bị tiêm (hoặc kho thử bị tiêm), SAU khi bản lành xanh trên cùng kho, và
# ghim thông điệp rút từ đầu ra của hàm đo. Bộ vẽ «trước vòng» = `git archive ccce2817 scripts lib
# skills`. Mỗi eval ghim đúng dòng "PASS: LT-…".
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, skills/acceptance/references/pham-vi-template.md, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-130" — khối mẫu PHAM-VI-MA rút từ khuôn: bộ đọc ra dot/dang/nguon và
      danh sách mã == danh sách mã đếm bằng regex độc lập trong ca trên chính khối (đẳng thức thứ tự), 0
      lỗi; năm ca hỏng sinh từ khối mẫu (mã trùng · dòng `- \`` thiếu `—` · mã rỗng · `dang: khac` · không
      mã nào) ra đúng lỗi ghim (nêu mã / số dòng / giá trị) và ca không mã thoát 2. Và "PASS: LT-130-do" —
      bản sao bộ đọc bỏ lặng dòng sai khuôn: CHÍNH hàm đo trả lỗi nêu «dòng sai khuôn».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-131" — đối chứng dương: kho thử 6 mã, mỗi mã đúng một mục cùng đợt →
      thoát 0, bảng phủ đủ 6 dòng đúng mã → chỗ. Ma trận viết sẵn 4 ca đỏ {vang · hai-hang · hang-chan-troi
      · ma-la} × kỳ vọng (mã thoát 1, đúng MỘT dòng lỗi, cụm ghim nêu mã và — ca trùng — cả hai chỗ), cộng
      ca chua-cat trên cùng bản phạm vi 6 mã (thoát 1, đúng MỘT dòng lỗi chứa «chưa cắt» và «6 mã»), số ca
      đo == 5 (in ra); hai ca im {khac-dot · khong-dot} thoát 0 dù phủ trùng tên mã. Và
      "PASS: LT-131-do" — bản sao răng đếm mọi mục bất kể dot: CHÍNH hàm đo trả lỗi nêu ca «khac-dot».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-132" — chân trời cùng đợt: `ly_do` vắng và `ly_do: "  "` → thoát 1, lỗi
      nêu mã chân trời; có lý do → không lỗi này (đối chứng). Và "PASS: LT-132-do" — bản sao bỏ luật lý do:
      CHÍNH hàm đo trả lỗi nêu «ly_do».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, scripts/lo-trinh.mjs, skills/acceptance/references/lo-trinh-template.json, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-133" — bốn ca hỏng ở hàng CÙNG ĐỢT (thiếu cau_giao · mã trùng · dung_tren
      chuỗi · dung_tren trỏ mã không có) → thoát 1, stdout chứa NGUYÊN VĂN câu cờ của kiemKhuon/suy luận
      (rút bằng cách gọi kiemKhuon trong ca, không viết tay); cùng bốn hỏng ở hàng KHÔNG dot → thoát 0 và
      mỗi cờ hiện sau «cảnh báo:»; kiemKhuon cờ «phu phải là một mảng» và «chan_troi
      #<n> không phải object»; lo-trinh-template.json có ≥1 hàng mang `phu`+`dot` và khối `chan_troi`, kiemKhuon
      0 cờ. Và "PASS: LT-133-do" — bản sao kiemKhuon bỏ luật `phu`: CHÍNH hàm đo trả lỗi nêu «phu».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-134" — bản phạm vi chưa add → thoát 2, stderr chứa «bản phạm vi phải là
      tệp có trong git», stdout không có bảng phủ; tệp lộ trình chưa add → thoát 2 «tệp lộ trình phải là tệp
      có trong git»; tệp ngoài kho (đường tuyệt đối thư mục tạm khác) → thoát 2 cùng câu; đối chứng dương:
      sau commit cùng tệp → thoát 0. Và "PASS: LT-134-do" — bản sao bỏ kiểm git: CHÍNH hàm đo trả lỗi nêu
      «chưa add».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-135" — hàng B đứng trên A, ngày B < ngày A → thoát 1 nêu B và hai ngày;
      hàng gắn mốc có ngày > ngày mốc → thoát 1 nêu mã hàng, ngày hàng, ngày mốc; thiếu ngày một bên → không
