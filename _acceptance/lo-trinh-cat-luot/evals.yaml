      có đúng 0 hoặc 1 dòng «bước kế: …», câu == bảng ô → câu VIẾT SẴN trong ca (ô không bước kế → 0 dòng),
      hàng không hồ sơ 0 dòng; in ma trận. Và "PASS: LT-139-do" — bản sao đổi câu của ô cho-nghiem-thu:
