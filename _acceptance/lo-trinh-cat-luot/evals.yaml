    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [skills/cat-luot/SKILL.md, scripts/cat-luot.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-138" — khối CAT-LUOT-RANG và CAT-LUOT-NHIP của SKILL chạy NGUYÊN VĂN
