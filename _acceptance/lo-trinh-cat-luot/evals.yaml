      so ngày: CHÍNH hàm đo trả lỗi nêu ca «dung-thu-tu».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/cat-luot.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-136" — kho thử: ba hồ sơ T2 (khoảng 2, 4, 9 ngày; một dùng
      veto_opened_at), hai hồ sơ T3 (3, 7 ngày), một hồ sơ thiếu ngày ký, một hồ sơ chưa ký: --nhip in
      T2 trung vị 4 n 3, T3 trung vị 5 n 2, bo_qua 1 (số mong đợi tính trong ca từ ngày đã dựng, không gõ
      sẵn kết quả của script); kho không hồ sơ → n 0 mọi hạng; hồ sơ thử ghi `human_signoff` theo khuôn bên
      ghi của lệnh ký (`<tên> <YYYY-MM-DD>`). Và "PASS: LT-136 kho-that" — --nhip trên các hồ sơ đã ký thật
      của kit (gốc suy từ vị trí tệp test): T2 n ≥ 10 và bo_qua ≤ một nửa số hồ sơ đã ký (in số). Và
      "PASS: LT-136-do" — bản sao bỏ nhánh veto_opened_at: CHÍNH hàm đo trả lỗi nêu «T2»; "PASS: LT-136-do
      dinh-dang" — bản sao bộ đọc ngày ký đòi DD/MM/YYYY: ca kho-that đỏ nêu «bo_qua».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
