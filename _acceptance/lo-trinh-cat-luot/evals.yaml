      start == bộ vẽ ccce2817 trên cùng kho (bỏ trường git), không LO-TRINH.html; và "PASS: LT-141" — kho khai
      lộ trình mà không hàng nào có hồ sơ: LO-TRINH.html == bộ vẽ ccce2817 từng byte. Và "PASS: LT-141-do" —
