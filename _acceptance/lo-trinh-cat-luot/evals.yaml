      parse được; khối CAT-LUOT-SAU-LUAT có đúng sáu dòng đánh số 1–6; SKILL chứa `chuoi`, `lan-va`,
      `morphological-scan`, và trong văn bản vị trí «chạy răng» đứng sau «ghi hàng» và trước «mở PR». Và
      "PASS: LT-138-do" — bản sao SKILL đổi cờ lệnh răng thành `--pham_vi`: CHÍNH hàm đo trả lỗi nêu
      «CAT-LUOT-RANG».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: judgment
    inputs: [skills/cat-luot/SKILL.md, skills/acceptance/references/pham-vi-template.md, _acceptance/lo-trinh-cat-luot/mau/pham-vi-lan-va.md]
    question: >
      SKILL.md là skill cắt lượt của kit; pham-vi-template.md là khuôn bản phạm vi; pham-vi-lan-va.md là
      một bản phạm vi mẫu dáng làn vá (33 mã khảo sát CRM). Chỉ dựa vào ba tệp: (1) một phiên Claude có đủ
      chỉ dẫn để cắt bản mẫu thành hàng đúng sáu luật cho dáng làn vá — gói theo màn hoặc theo vùng sản
      phẩm, không đặt «cần xong trước» giả giữa các hàng chạy song song, mã không cắt được thành câu giao
      thì vào chân trời kèm lý do — không? (2) Bảng phủ có phải là thứ máy sinh (người không chép tay)
      không? (3) Có chỗ nào SKILL bảo kit hay phiên ghi TRẠNG THÁI vào tệp ý định không? PASS khi (1) và
      (2) có, (3) không — kèm trích câu SKILL cho từng vế; FAIL nêu vế sai và câu; UNCERTAIN khi tệp không
      đọc được.
    paths: [skills/cat-luot/SKILL.md, skills/acceptance/references/pham-vi-template.md]
    expected: PASS kèm trích câu cho từng vế; FAIL nêu vế sai
    evidence_required: [judged_by, verdict, rationale]
