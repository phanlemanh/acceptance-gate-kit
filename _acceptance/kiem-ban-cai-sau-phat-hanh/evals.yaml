  - id: E10
    criterion: AC-9
    executor: judgment
    inputs:
      - CHANGELOG.md
      - GUIDE.md
      - docs/superpowers/specs/2026-10-13-kiem-ban-cai-sau-phat-hanh-design.md
    question: >
      Đọc mục «Chưa phát hành» đầu CHANGELOG.md và mục 7.2 của GUIDE.md (tìm «kiem-ban-cai»), đối chiếu design
      doc §2–§4. Chỉ phán trên chữ của ba tệp này. (1) Hai tệp có DẶN người cắt mốc dùng lệnh kiểm bản cài với
      `--ref v<số>` SAU khi gắn tag, và máy nhận dùng chế độ `--may --ref v<số>` SAU khi cài, thay khối `node -e`
      ở bước 3 mục A1 của 2.27; và có nói kiểm tự đi trọn ở lượt chấm hồ sơ cắt mốc (đổi số) còn vòng thường chỉ
      in dòng BỎ QUA? (2) Có dặn đọc dòng `TỔNG KẾT` (ĐẠT / ĐỎ / KHÔNG CHẠY ĐƯỢC) chứ không đọc mã thoát một
      mình, và dòng `ĐỎ may:` thì gỡ + cài lại theo bốn bước? (3) Có khai các giới hạn của design §4 (tác tử chấm
      đo tĩnh · CI không chạy · bước sau-tag là lời dặn · nhận diện lượt mốc theo số gói gốc) kèm ngưỡng? Trả PASS
      khi cả ba vế có; FAIL nêu vế thiếu.
    expected: "PASS — ba vế đúng; FAIL nêu vế thiếu"
    evidence_required: [run_id, verifier, verified_at, panel_votes]
