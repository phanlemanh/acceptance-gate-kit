schema_version: 1
feature_slug: kiem-ban-cai-sau-phat-hanh
# Ca đo sống ở tests/scripts/kiem-ban-cai.ca.mjs (ca KB-<n> = AC-n), chạy bằng khoá riêng
# executors.test.kiem_ban_cai — cũng là khoá được thêm vào feature_loop.suite_keys (AC-9), nên mọi eval máy
# của hồ sơ này chung MỘT lệnh (chạy một lần mỗi lượt). Đuôi .ca.mjs: không lọt vào mảnh *.test.mjs của CI
# (runner không có CLI claude). Mọi nguồn cài bị tiêm dựng từ `git archive HEAD` TRONG lượt; đường dẫn suy từ
# vị trí tệp ca; mỗi ca đỏ chạy SAU khi KB-2 (bản lành) xanh trong cùng lượt và ghim thông điệp. Ca in đúng
# một dòng «PASS: KB-…» hoặc «FAIL: KB-… — <vì sao>» cho mỗi ca, và thoát ≠ 0 khi có ca FAIL. Mỗi eval ghim
# dòng PASS của chính nó — lệnh xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.kiem_ban_cai
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai.ca.mjs]
    expected: >
      exit 0; stdout có "PASS: KB-1" — ca chụp cấu hình Claude thật (gốc = CLAUDE_CONFIG_DIR của môi trường
      chạy ca, mặc định ~/.claude): sha256 của plugins/installed_plugins.json và plugins/known_marketplaces.json
      (hai tệp PHẢI tồn tại và khác rỗng — vắng thì FAIL «không có gì để so») + danh sách đường · cỡ · mtime dưới
      plugins/cache/ và plugins/marketplaces/. Chụp TRƯỚC lượt `--ref HEAD` và lượt `--may --ref HEAD`, chụp lại
      SAU: bằng nhau. Độ nhạy của hàm chụp (cùng ca, trước khi tin chiều bằng): chạy hàm trên một bản sao tạm của
      một tệp, chạm một byte → ảnh chụp khác; không khác thì FAIL «hàm chụp mù». Thư mục tạm lệnh in ở dòng đầu
      («cấu hình cách ly <dir>», «kho giả lập <dir>») không còn trên đĩa sau khi lệnh thoát; với `--giu` thì CÒN
      (phép kiểm-dọn nhìn thấy thư mục), rồi ca tự xoá.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.kiem_ban_cai
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai.ca.mjs, .claude-plugin/marketplace.json]
    expected: >
      exit 0; stdout có "PASS: KB-2" — `--ref HEAD` nguồn nguyên vẹn: thoát 0; tám dòng bắt đầu
      `[kiem-ban-cai] ĐẠT ` theo đúng thứ tự so-phien-ban, khop-tag, thu-muc-goi, tac-tu-cham, hook-goi,
      the-cong, luoi-truoc-gop, dieu-phoi (ca so mảng tên mục rút từ đầu ra với mảng viết sẵn); dòng
      so-phien-ban nêu đúng tập tên gói đọc từ `.claude-plugin/marketplace.json` (ca đọc tệp, không gõ tay), mỗi
      tên kèm số đọc từ plugin.json của nó; dòng cuối bắt đầu `[kiem-ban-cai] TỔNG KẾT: ĐẠT 8/8`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.kiem_ban_cai
    paths: [scripts/kiem-ban-cai.mjs, tests/scripts/kiem-ban-cai.ca.mjs, feature-loop/agents/**, feature-loop/workflows/acceptance-verify.js]
    expected: >
      exit 0; stdout có "PASS: KB-3 thieu-agents", "PASS: KB-3 sai-ten", "PASS: KB-3 cam-but". (thieu-agents)
      nguồn cài = bản sao HEAD bỏ feature-loop/agents/: thoát 1; dòng `[kiem-ban-cai] ĐỎ thu-muc-goi:` chứa
      «THIẾU thư mục gói: feature-loop/agents»; dòng `[kiem-ban-cai] ĐỎ tac-tu-cham:` chứa «tác tử chấm vắng
      trong bản cài: feature-loop:cham-lenh»; dòng cuối bắt đầu `[kiem-ban-cai] TỔNG KẾT: ĐỎ` và chứa cả
      `thu-muc-goi` lẫn `tac-tu-cham`. (sai-ten) agents/cham-lenh.md mang `name: sai-ten` → thoát 1, `ĐỎ
