schema_version: 1
feature_slug: suc-khoe-cho-trong-va-toc-do
# Ca đo của hàng SK1: tệp tests/dieu-phoi/loi/suc-khoe.test.mjs (hàm thuần, đọc văn bản, cấu hình) và
# tests/dieu-phoi/loi/suc-khoe-nhip.test.mjs (nhịp thật `motNhip` của bộ phát lịch trên thư mục đợt tạm), tên ca bắt đầu
# «SK-». Khoá executor thêm ở S3 (chỉ thêm khoá):
#   executors.test.dieu_phoi_suc_khoe = node --test trên hai tệp ấy, gộp dòng «ok … SK-», «not ok», dòng chẩn đoán «#   …»
#     và tổng kết TAP thành MỘT dòng (cùng khuôn khoá dieu_phoi_tin_gd của GT2). Suite xanh mà thiếu dòng ghim là ĐỎ.
# Fixture do code sinh trong lượt: thư mục đợt tạm dựng bằng hàm của tệp test, `io` giả trả văn bản theo ĐÚNG định dạng
# lệnh macOS; văn bản thật chụp 21/10 sống ở tests/dieu-phoi/loi/so-do-mbp-2110.txt (đầu ra nguyên văn của bốn lệnh,
# ghi kèm lệnh đã chạy). Thư mục máy tạm qua DIEU_PHOI_MAY_DIR. Đường dẫn suy từ vị trí tệp test.
# Mỗi ca «-do» chạy CHÍNH hàm đo trên một bản sao trọn thư mục dieu-phoi/ bị tiêm (cp -R của gói đang kiểm vào thư mục tạm,
# rồi thay một đoạn mã), SAU khi bản lành xanh trên cùng fixture; ca kiểm riêng rằng bước tiêm đã áp (chuỗi thay có mặt
# trong bản sao, chuỗi gốc vắng) và ghim thông điệp của ĐÚNG hàng bị tiêm. Ma trận viết sẵn: số assert = số hàng, in ra.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_suc_khoe
    paths: [dieu-phoi/scripts/suc-khoe.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/lich.mjs, dieu-phoi/scripts/mau/dieu-phoi.config.json, tests/dieu-phoi/loi/suc-khoe-nhip.test.mjs]
    expected: >
      exit 0; "ok" cho "SK-01 swap-cu-khong-giam-tai": ma trận 4 hàng in «hàng · kỳ vọng · thực tế» — (m5, áp lực 1)
      (mbp, áp lực 1) → trang_thai "dang-chay", khoá s4 cấp cho đơn đang chờ, 0 sự kiện "giam-tai", suc_khoe.ghi.swap
      có "9.7/11.0 GB" hay "12.0/13.0 GB" và lyDo rỗng; (m5, áp lực 2) (mbp, áp lực 2) trên CÙNG fixture → trang_thai
      "giam-tai", lyDo ["áp lực bộ nhớ mức 2"] (đối chứng dương). Cấu hình là mẫu của gói đọc từ đĩa. "ok" cho "SK-01-do
      luat-swap-cu": bản sao gói tiêm lại dòng so swap đã dùng với 8 GB vào hàm đánh giá → hàm đo nêu đủ bốn hàng:
      "(m5, áp lực 1)" và "(mbp, áp lực 1)" với thực tế mở đầu "giam-tai · s4 vắng", hai hàng áp lực 2 với lý do
      "áp lực bộ nhớ mức 2; swap …" (lý do giảm tải chỉ được là áp lực).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_suc_khoe
    paths: [dieu-phoi/scripts/suc-khoe.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/lich.mjs, tests/dieu-phoi/loi/suc-khoe-nhip.test.mjs]
    expected: >
      exit 0; "ok" cho "SK-02 ap-luc-giam-tai": ba hàng (mức 2, mức 4, mức 1 từ đầu) — bốn đơn s4, ghim-lai, duong-nen, merge cùng
      chờ; sau nhịp: chỉ khoá merge tồn tại, lyDo đúng chuỗi "áp lực bộ nhớ mức 2" / "áp lực bộ nhớ mức 4"; qua ba nhịp
      đếm sự kiện "giam-tai" có can_phan true === 1; nhịp thứ tư mức 1 → đếm "het-giam-tai" === 1 và trang_thai
      "dang-chay"; hàng (mức 1 từ đầu, dưới ngưỡng) cùng bốn đơn → không giảm tải: 0 sự kiện "giam-tai", khoá s4 và merge đều được cấp. "ok" cho "SK-02-do bo-ap-luc": bản sao tiêm bỏ điều kiện áp lực → hàm đo nêu hai hàng với thực tế
      "dang-chay".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
