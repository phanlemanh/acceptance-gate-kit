      trang-thai, bang.html và `xem` (đối chứng dương cùng fixture). "ok" cho "SK-03-do bo-xet-cho": bản sao tiêm cho hàm vừa-làn luôn trả vừa → hàm đo nêu đúng hai hàng
      "(level 46)" (thực tế mở đầu "khoá s4 cấp cho đơn s4") và "(ba nhịp level 46)" (thực tế "thieu-cho 0").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
