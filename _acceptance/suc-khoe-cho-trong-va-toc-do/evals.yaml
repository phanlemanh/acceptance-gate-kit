  - id: E6b
    criterion: AC-6
    executor: judgment
    inputs: [dieu-phoi/scripts/mau/LUAT.md]
    question: >
      Đọc tệp luật thợ này như một phiên thợ vừa nhận lượt s4 rồi chấm ra đỏ. Tệp có nói đủ bốn điều sau, đủ rõ để làm
      đúng mà không hỏi ai không: (1) đọc nhãn «chạy dưới tải» ở đâu, trước khi nhả khoá; (2) lượt mang nhãn mà đỏ thì nhả
      thế nào (kèm lý do hạ tầng); (3) chấm lại đúng commit đó một lần, chỉ khi bộ phát lịch cho thử lại, và không sửa vật
      trước lần chấm lại; (4) lần chấm lại vẫn đỏ thì đỏ là của vật? Thiếu hay mơ hồ điều nào thì nêu điều đó.
    expected: PASS khi đủ cả bốn điều và không điều nào mâu thuẫn với phần còn lại của tệp.
    evidence_required: [run_id, verdict, judges, verified_at]
