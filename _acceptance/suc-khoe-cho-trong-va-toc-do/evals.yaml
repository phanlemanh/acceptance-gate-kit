    cmd: config:executors.test.dieu_phoi_suc_khoe
    paths: [dieu-phoi/scripts/suc-khoe.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/lich.mjs, dieu-phoi/scripts/do-lan.mjs, tests/dieu-phoi/loi/suc-khoe-nhip.test.mjs]
    expected: >
