      hang_cho của s4 có cho đúng chuỗi "thiếu chỗ: cần 18.0 GB, trống 16.6 GB", trang_thai "dang-chay", và bang.html cùng
      chuỗi của `xem` (veXem(moHinh(tt))) đều chứa đúng chuỗi ấy; (ba nhịp level 46)
