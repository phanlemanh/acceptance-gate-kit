<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng đời một lượt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1232 504" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tiêu đề trong hình (để PNG mang theo) -->
      <text x="32" y="32" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CỔNG PHẠM VI · SK1 · VÒNG ĐỜI</text>
      <text x="32" y="64" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Lora', serif">Vòng đời một lượt nặng</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <line x1="200" y1="224" x2="228" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="224" x2="428" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="224" x2="628" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="224" x2="828" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1000" y1="224" x2="1028" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Quay về 1 -->
      <path d="M1116 144 V120 Q1116 112 1108 112 H124 Q116 112 116 120 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="580" y="90" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="616" y="102" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHU CẦU</text>

      <!-- Nhánh ở 4 -->
      <line x1="716" y1="304" x2="716" y2="356" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="724" y="320" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="728" y="332" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LƯỢT MANG NHÃN</text>

      <!-- Ghi chú nhỏ dưới bước 2 -->
      <line x1="316" y1="304" x2="316" y2="336" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- 1 · Cấp -->
      <rect x="32" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="144" width="168" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="44" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="56" y="168" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="48" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cấp</text>
      <text x="48" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">áp lực bình thường</text>
      <text x="48" y="236" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">VÀ trống ≥ nhu cầu × 1,5</text>
      <text x="48" y="252" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">(nhu cầu chưa biết →</text>
      <text x="48" y="268" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bỏ vế chỗ)</text>

      <!-- 2 · Đo -->
      <rect x="232" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="144" width="168" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="244" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="256" y="168" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="248" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Đo mỗi nhịp 5 giây</text>
      <text x="248" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">trống thấp nhất</text>
      <text x="248" y="236" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">áp lực cao nhất</text>
      <text x="248" y="252" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">tốc độ swapin</text>
      <text x="248" y="268" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">có làn nặng khác</text>
      <text x="248" y="284" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">chồng không</text>

      <!-- 3 · Nhãn (tâm điểm) -->
      <rect x="432" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="144" width="168" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="444" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="456" y="168" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="448" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Nhãn «dưới tải»</text>
      <text x="448" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">khi áp lực cảnh báo</text>
      <text x="448" y="236" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">liền 2 phút</text>
      <text x="448" y="252" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">(hoặc tốc độ vượt</text>
      <text x="448" y="268" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">ngưỡng kho đặt)</text>

      <!-- 4 · Khép -->
      <rect x="632" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="144" width="168" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="644" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="656" y="168" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="648" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Khép</text>
      <text x="648" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">thợ nhả (mã thoát,</text>
      <text x="648" y="236" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lý do hạ tầng)</text>
      <text x="648" y="252" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">hay bộ phát lịch</text>
      <text x="648" y="268" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">thu hồi</text>

      <!-- 5 · Sổ đo -->
      <rect x="832" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="144" width="168" height="160" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="844" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="856" y="168" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="848" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Một dòng vào sổ đo</text>
      <text x="848" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">cấp máy</text>

      <!-- 6 · p95 -->
      <rect x="1032" y="144" width="168" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="1032" y="144" width="168" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1044" y="156" width="24" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1056" y="168" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <text x="1048" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">p95</text>
      <text x="1048" y="220" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">của các dòng sạch</text>
      <text x="1048" y="236" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">→ nhu cầu cho</text>
      <text x="1048" y="252" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lần cấp sau</text>

      <!-- Nhánh: thử lại -->
      <rect x="632" y="360" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="360" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="716" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Được thử lại một lần</text>
      <text x="716" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cho commit này</text>

      <!-- Ghi chú nhỏ -->
      <text x="232" y="356" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Swap đã dùng và RSS lớn nhất</text>
      <text x="232" y="376" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">chỉ được ghi, không chặn.</text>

      <!-- Chú giải -->
      <line x1="32" y1="456" x2="1200" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="128" y="472" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="160" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhãn «dưới tải» và lối thử lại</text>
      <line x1="340" y1="478" x2="372" y2="478" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="384" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Quay về bước 1</text>
      <text x="1200" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-1…AC-8</text>
    </svg>
  </div>
</body>
</html>
