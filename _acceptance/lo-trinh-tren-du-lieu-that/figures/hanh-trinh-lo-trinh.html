<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành trình lộ trình ở crm · Journey map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Journey map · lo-trinh-tren-du-lieu-that</p>
    <h1>Hành trình lộ trình ở crm — bảy chỗ chưa phủ</h1>
    <p class="sub">Chiếu từ mục «Vấn đề &amp; ai gặp» và «Cổng 0» của opportunity.md, đo trên 156 hồ sơ thật của crm ngày 03/10.</p>

    <svg viewBox="0 0 1160 536" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage headers -->
      <text x="240"  y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">KHAI LỘ TRÌNH</text>
      <text x="400"  y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">VÀO PHIÊN</text>
      <text x="560"  y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">XEM TRANG</text>
      <text x="720"  y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">MỞ VIỆC</text>
      <text x="880"  y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">LÀM &amp; KÝ</text>
      <text x="1040" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">NGHIỆM THU</text>

      <!-- Stage hairlines -->
      <line x1="160"  y1="80" x2="160"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="320"  y1="80" x2="320"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="480"  y1="80" x2="480"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="640"  y1="80" x2="640"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="800"  y1="80" x2="800"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="960"  y1="80" x2="960"  y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

      <!-- Band rules -->
      <line x1="40" y1="80"  x2="1120" y2="80"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="176" x2="1120" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="360" x2="1120" y2="360" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="448" x2="1120" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Band eyebrows -->
      <text x="48" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀM GÌ</text>
      <text x="48" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIN THẺ</text>
      <text x="48" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HÔM NAY</text>
      <text x="48" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">Ô MỚI SỬA</text>

      <!-- LÀM GÌ — touchpoints -->
      <rect x="176" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Viết tệp ý định</text>
      <text x="240" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lo_trinh.tep</text>

      <rect x="336" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc thẻ /start</text>
      <text x="400" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 dòng lộ trình</text>

      <rect x="496" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở trang lộ trình</text>
      <text x="560" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LO-TRINH.html</text>

      <rect x="656" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở hàng kế</text>
      <text x="720" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">feature-loop &lt;mã&gt;</text>

      <rect x="816" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Làm vòng, ký cổng</text>
      <text x="880" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khối MAP-STAGE</text>

      <rect x="976" y="104" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1040" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên nghiệm thu</text>
      <text x="1040" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ngưỡng của hàng</text>

      <!-- TIN THẺ — neutral baseline -->
      <line x1="176" y1="256" x2="1104" y2="256" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1104" y="248" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TRUNG TÍNH</text>

      <!-- Trust curve: qualitative, one smooth path -->
      <path d="M 240 264 C 296 264 344 304 400 304 C 456 304 504 288 560 288 C 616 288 664 288 720 288 C 776 288 824 216 880 216 C 936 216 984 256 1040 256"
            fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="240"  cy="264" r="4" fill="#4f5d75"/>
      <circle cx="560"  cy="288" r="4" fill="#4f5d75"/>
      <circle cx="720"  cy="288" r="4" fill="#4f5d75"/>
      <circle cx="880"  cy="216" r="4" fill="#4f5d75"/>
      <circle cx="1040" cy="256" r="4" fill="#4f5d75"/>

      <!-- Pain moment (accent 1 of 2) -->
      <circle cx="400" cy="304" r="6" fill="#eb6c36"/>
      <line x1="400" y1="312" x2="400" y2="320" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="336" fill="#4f5d75" font-size="14" font-style="italic"
            font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Hàng «1» đã giao bị đưa lên làm hàng kế</text>

      <!-- Ô MỚI SỬA — plain notes, numbered by gap -->
      <text x="240" y="388" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">6 · nhiều tệp lộ trình mỗi kho</text>
      <text x="240" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">7 · cờ khi chưa bật bản đồ</text>

      <text x="400" y="388" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">4 · tự khai đã giao, không hồ sơ</text>
      <text x="400" y="404" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">→ có cờ, không là hàng kế</text>

      <text x="560" y="388" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">1 · /start in đường mở trang</text>
      <text x="560" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">5 · so lời khai theo nhóm</text>
      <text x="560" y="420" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(hôm nay 11/18 cờ là nhiễu)</text>

      <text x="720" y="388" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">2 · dựng ô cơ hội từ hàng</text>
      <text x="720" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">rồi qua Cổng Đáng</text>

      <text x="880" y="388" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">3 · hồ sơ ghi mã hàng,</text>
      <text x="880" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nối hai chiều, lệch có cờ</text>

      <text x="1040" y="388" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">2 · điều kiện bật của hàng</text>
      <text x="1040" y="404" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thành ngưỡng đề xuất</text>

      <!-- Legend -->
      <line x1="40" y1="472" x2="1120" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="500" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Việc người dùng làm</text>

      <circle cx="208" cy="508" r="4" fill="#4f5d75"/>
      <text x="220" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Mức tin thẻ hôm nay (định tính)</text>

      <circle cx="400" cy="508" r="6" fill="#eb6c36"/>
      <text x="416" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chỗ đau nhất</text>

      <line x1="520" y1="508" x2="548" y2="508" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="556" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Trung tính</text>

      <text x="656" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Số 1–7 = chỗ chưa phủ trong opportunity.md</text>
    </svg>
  </div>
</body>
</html>
