schema_version: 1
feature_slug: lo-trinh-tren-du-lieu-that
# Ca đo sống ở tests/scripts/lo-trinh.test.mjs (LT-70..LT-80, cùng tệp với ca của lát 1; executor
# `executors.test.lo_trinh` chạy đúng tệp đó). Kho thử do code sinh trong lượt (git init trong thư mục
# tạm). Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao vật bị tiêm, SAU khi bản lành xanh trên cùng kho thử,
# và ghim thông điệp rút từ đầu ra của hàm đo. Mỗi eval ghim đúng dòng "PASS: LT-…" — suite xanh mà
# thiếu dòng ghim là ĐỎ. Bộ vẽ «bản trước vòng» lấy bằng `git archive e4a399ed scripts lib` (CI
# checkout fetch-depth 0); sha không resolve được thì ca FAIL, không bỏ qua.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-70" — ma trận toàn phần: mọi tên ô của SECTIONS cộng «Chưa mở» và
      «Không suy được» làm lời khai × trục hồ sơ == ĐÚNG các khoá của SECTIONS (ô nào HO_SO không dựng
      được phải nằm trong danh sách loại trừ viết sẵn trong ca, và số ô đo + số ô loại trừ == số khoá
      SECTIONS, assert); cộng trục lời khai qua tu_vung (mỗi từ của config thử × mỗi ô); số cặp đo ==
      tích các trục (in ra); với mỗi cặp, có cờ «tệp khai khác hồ sơ» ⟺ nhóm khác nhau theo bảng nhóm của design §1
      (bảng nhóm viết trong ca từ KHOÁ ô, tên rút từ SECTIONS); cờ có mặt thì chứa cả chữ khai lẫn chữ
      ô hồ sơ. Và "PASS: LT-70-do" — bản sao lo-trinh.mjs so lời khai bằng đẳng thức chữ (vật lát 1):
      CHÍNH hàm đo của LT-70 chạy lại trên bản sao trả danh sách cặp sai chứa cặp
      («Đã giao», «Đã giao — chờ phiên nghiệm thu»); và "PASS: LT-70-do2" — bản sao xếp `xep-lai` vào
      nhóm chưa làm: CHÍNH hàm đo trả cặp sai («Chưa mở», «Xếp lại sau»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-71" — kho thử: hàng A slug vắng-hồ-sơ khai «Đã giao», hàng B khai
      «Đang làm», hàng C khai «Chưa mở», hàng D không khai, hàng E đứng trên A: trạng thái A, B ==
      «Không suy được»; C, D == «Chưa mở»; cờ của A == đúng một chuỗi «hàng A: tự khai Đã giao mà
      không có hồ sơ <slug>» (đẳng thức), C, D không cờ; hàng kế == C (không phải A, không phải E).
      Và "PASS: LT-71-do" — bản sao bỏ nhánh «không hồ sơ mà khai đã giao/đang làm»: CHÍNH hàm đo trả
      lỗi chứa "hàng kế A" (hàng tự khai đã giao lên làm hàng kế — đúng lỗi crm hàng «1»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/fixtures/lo-trinh/crm-okr.json, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-72" — fixture crm-okr dựng kho bằng bảng `_nguon.ho_so` (hồ sơ do
      HO_SO sinh theo ô khai): hàng kế != "1"; hàng kế có lời khai (sau tu_vung) và ô hồ sơ đều thuộc
      nhóm chưa làm (suy trong ca, không đọc danh sách viết sẵn); thành phần cờ theo loại so với số
      ghi ở opportunity.md trước khi có mã: thiếu câu giao == 4 · mã trùng == 1 · «tệp khai khác hồ
      sơ» == 2 và đúng ở mã {9c, D} · «tự khai … mà không có hồ sơ» == 1 ở mã "1" · tổng == 8.
      Và "PASS: LT-72-do" — CHÍNH hàm đo trên bản sao bộ đọc của commit e4a399ed (vật lát 1) trả lỗi
      nêu hàng kế "1" và số cờ thừa 11.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-73 mot-nguoi-nhan", "PASS: LT-73 nhieu-nguoi-nhan",
      "PASS: LT-73 ho-so-ghi-ma-khac", "PASS: LT-73 ho-so-khac-nhan-S-co",
      "PASS: LT-73 ho-so-khac-nhan-S-vang", "PASS: LT-73 gop-S-vang-khai-da-giao-C-nhan",
      "PASS: LT-73 ma-khong-co-hang", "PASS: LT-73 tep-khong-khai", "PASS: LT-73 khong-truong" — mỗi ca
      một kho thử; trạng thái hàng và danh sách cờ so đẳng thức với bảng design §2; ca gộp: trạng thái
      == ô của C, mảng cờ của hàng có ĐÚNG một phần tử (cờ liên kết), và `--mo-o` trên cùng kho in
      {"hoSo":"C","moi":false}; ca mot-nguoi-nhan: hàng thôi «tin theo lời»
      (đếm tinTheoLoi giảm đúng 1) và hồ sơ không còn trong «vòng ngoài lộ trình»; ca khong-truong:
      LO-TRINH.html giống từng byte bản do bộ vẽ commit e4a399ed vẽ trên cùng kho. Và
      "PASS: LT-73-do" — bản sao bộ đọc bỏ phần quét lo_trinh_ma: CHÍNH hàm đo trả lỗi nêu
      "mot-nguoi-nhan"; "PASS: LT-73-khong-truong-do" — bản sao bộ đọc tiêm một byte vào trang khi
      không hồ sơ nào ghi trường: CHÍNH phép so byte của ca khong-truong ĐỎ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, scripts/start-scan.mjs, skills/acceptance/references/opportunity-template.md, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-74 co-bat-khi", "PASS: LT-74 bat-khi-khong-moc" và
      "PASS: LT-74 khong-bat-khi" — Timebox == tiền tố + "2026-11-30 (mốc m-lt)" chỉ ở ca có mốc; CLI --mo-o thoát 0
      và ghi đúng một tệp mới; khoá frontmatter của tệp ghi ⊇ khoá rút từ khối OPP-FRONTMATTER-TEMPLATE
      của khuôn (round-trip writer→khuôn), stage == discovery, decision rỗng, feature == cau_giao,
      lo_trinh_ma == mã; dòng SỐNG bắt đầu bằng tiền tố rút từ khối OPP-DE-XUAT-PREFIX (ca co-bat-khi)
      hoặc là "…" (ca khong-bat-khi); start-scan xếp slug vào gates gate dang (co-bat-khi) hoặc
      groups.considering (hai ca kia); phanTich sau đó cho hàng coHoSo true; sha256 tệp ý định trước
      == sau. Và "PASS: LT-74-do" — bản sao khuôn đổi tiền tố trong khối OPP-DE-XUAT-PREFIX: tệp ghi
      mang tiền tố MỚI (bằng chứng writer đọc khuôn, không chép cứng).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-75 da-co-ho-so", "PASS: LT-75 dich-da-co", "PASS: LT-75 thieu-slug"
      — lần lượt: stdout == {"hoSo":"<slug>","moi":false} thoát 0 · thoát 2, stderr chứa đường thư mục
      · câu giao "Đặt OKR cho Bộ phận trong CRM ngay bây giờ" cho slug == "dat-okr-cho-bo-phan-trong" (sáu từ đầu, in
