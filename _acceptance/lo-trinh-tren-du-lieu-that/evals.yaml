  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [feature-loop/skills/feature-loop/SKILL.md, scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-76 ma-mot-tep", "PASS: LT-76 ma-hai-tep", "PASS: LT-76 da-co-ho-so",
