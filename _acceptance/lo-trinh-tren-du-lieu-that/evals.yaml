      bảng gộp 3 vào mô tả việc: CHÍNH hàm đo của bang-thoat trả lỗi nêu "3". "PASS: LT-76 mau" — mẫu
      S0-MA-HANG-RE nhận "7n", "docs/a.json:7n" và từ chối đúng từng chuỗi trong danh sách (khoảng trắng
