      VĂN qua bash (thay <mã>, gốc gói = cây đang kiểm như harness thay; không gán sẵn biến nào khác)
      trên kho thử sinh trong lượt; mã thoát + JSON lần lượt 0+moi:true · 3 (cây _acceptance/ giữ từng
      byte) · 0+moi:false · 0+slug suy · 1. "PASS: LT-76 bang-thoat" — bảng S0-MO-O-THOAT parse thành
