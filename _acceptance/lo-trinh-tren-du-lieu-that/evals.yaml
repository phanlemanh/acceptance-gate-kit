  - id: E12
    criterion: AC-12
    executor: judgment
    inputs: [_acceptance/lo-trinh-tren-du-lieu-that/do-crm-onehub.html, _acceptance/lo-trinh-tren-du-lieu-that/opportunity.md]
    question: >
      do-crm-onehub.html là LO-TRINH.html do bộ vẽ của vòng sinh trên bản sao crm onehub, chép nguyên.
      opportunity.md (ghi trước khi có mã) liệt các lệch thật: 4 hàng thiếu câu giao, 1 mã trùng, hai
      lệch ở hàng 9c và D, và hàng «1» khai slug không có hồ sơ. Trả lời bằng chữ trên trang: hàng kế
      có phải một hàng mà trạng thái trên trang là chưa làm và lời khai (nếu có) cũng là chưa làm không;
      mỗi cờ trong mục «Cờ» có thuộc một trong năm loại lệch thật ấy không; hàng «1» có được nêu tên
      trong mục «Cờ» không? PASS khi cả ba đúng, kèm trích chữ trên trang; FAIL nêu câu nào sai và cờ
      nào; UNCERTAIN khi trang không đọc được.
    paths: [scripts/lo-trinh.mjs, _acceptance/lo-trinh-tren-du-lieu-that/do-crm-onehub.html]
    expected: PASS kèm trích chữ cho từng câu; FAIL nêu câu và dòng
    evidence_required: [judged_by, verdict, rationale]
