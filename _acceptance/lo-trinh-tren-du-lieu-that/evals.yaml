    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh-khoa.cjs, scripts/lo-trinh.mjs, scripts/product-map.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-77 dang" — cacTepTuConfig trên ba dạng (chuỗi · khối · dòng) trả
      cùng mảng theo thứ tự khai; tệp lặp → gộp + cờ «khai hai lần»; config có khối khác chứa
      "  tep: x" → không đọc nhầm (mảng == chỉ tệp của lo_trinh). Và "PASS: LT-77 mot-tep-byte" —
      kho thử một tệp: LO-TRINH.html của cây đang kiểm == của bộ vẽ commit e4a399ed (sha256 bằng nhau);
      đường thực thi của bên «cũ» nằm trong thư mục giải nén (in ra, assert tiền tố); đối chứng dương:
