    paths: [scripts/lo-trinh.mjs, tests/scripts/ra-soat-lo-trinh-crm.mjs]
    expected: >
      exit 0; stdout có "PASS: RS-9-crm", "PASS: RS-9-kit". RS-9-crm: bản sao crm d0351bcd (git archive docs/plan
      _acceptance trong lượt), hôm nay 2026-10-14 — đề xuất theo lộ trình BẰNG viết sẵn: lo-trinh-okr.json [] ·
      lo-trinh-kho-tai-lieu.json [] · lo-trinh-viec-du-an.json [DA6, DA7, DA8 → cho-dieu-kien/xep-lai, can_cu.nguon
      tu-khai]. RS-9-kit: tệp lộ trình kit ở 1baceb96 trên cây kit — [A3, DP8 → doi-moc/moc-qua-ngay]. crm vắng hoặc
      sha không có → thoát 2 nêu đường, không in PASS.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ra_soat_lo_trinh
    paths: [.claude-plugin/marketplace.json, road-map/**, tests/scripts/ra-soat-lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: RS-10", "PASS: RS-10-do". RS-10: marketplace có mục name road-map, source ./road-map,
      tags chứa bat-theo-lua-chon; version của road-map/.claude-plugin/plugin.json == acceptance-gate == feature-loop
      == dieu-phoi; frontmatter road-map/commands/xem.md không có disable-model-invocation; dòng lệnh rút từ khối mã của
