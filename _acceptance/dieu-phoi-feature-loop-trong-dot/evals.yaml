  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.dieu_phoi_dp7
    paths: [dieu-phoi/README.md, dieu-phoi/scripts/tho.mjs, tests/dieu-phoi/trong-dot.test.mjs]
    expected: >
      exit 0; "ok" cho "DP7-11 readme": README có tiêu đề mục "Phiên thợ trong đợt"; trong mục có "tho", "--tu-merge",
