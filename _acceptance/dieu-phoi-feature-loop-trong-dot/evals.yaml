      không đổi so với merge-base (git diff --quiet, in kết quả trong ca "DP7-10 dp12-nguyen").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-12
    executor: test
    cmd: config:executors.test.dieu_phoi_dp7
    paths: [dieu-phoi/scripts/nguon-hang.mjs, dieu-phoi/scripts/goi-dot.mjs, dieu-phoi/scripts/hinh-dang.mjs, tests/dieu-phoi/trong-dot.test.mjs]
    expected: >
      exit 0; hai tệp lộ trình a.json, b.json do ca dựng cùng có hàng mã X (slug x-tu-a, x-tu-b). "ok" cho "DP7-12
      hai-tep": docHangLoTrinh(kho, ["a.json:X", "b.json:X"]).hang == [{ma X, slug x-tu-a, tep a.json}, {ma X,
