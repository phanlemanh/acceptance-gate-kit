  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-35-0/contract.md, _acceptance/design-gate-che-do-chat/contract.md, _acceptance/design-gate-khong-do-duoc-ba-nguyen-nhan/contract.md, _acceptance/design-floor-vendor-va-ban-va-a/contract.md, _acceptance/design-floor-ban-va-b-c-d/contract.md, _acceptance/design-floor-moc-s0-s1/contract.md, _acceptance/design-floor-moc-s3-s4/contract.md, _acceptance/vung-giao-viec-tu-cat-luot/contract.md, _acceptance/khung-dot-dinh-vi/contract.md, scripts/design-floor-bac.mjs, GUIDE.md, feature-loop/skills/feature-loop/SKILL.md, dieu-phoi/README.md, commands/acceptance-init.md]
    question: >
      Đọc AC-9 của contract release-2-35-0 và mục «## 2.35.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép.
      (0) Ở các mục con của tám hồ sơ: mỗi câu mô tả vòng (câu giao, lý do làm, giới hạn trích trong ngoặc «») có phải chữ
      của hợp đồng hồ sơ ấy (dòng feature, Context, Notes) — không tóm tắt, không nói rộng hơn — và số giới hạn đã khai
      (nhãn trạng thái + chọn ở Cổng Bằng chứng) có khớp Notes không? (1) Lời về bậc M0–M3 (điều kiện từng bậc, ai ghi M3),
      lệnh `design-floor-s4.mjs` qua `executors.design.floor`, khối `design_floor` (`tokens`, `registry`, `sinh_lai`) và bốn
      móc S0/S1/S3/S4 có khớp scripts/design-floor-bac.mjs, GUIDE.md mục «Wire executors.design» và các khối DESIGN-FLOOR-* của
      SKILL feature-loop không? (2) Lời về lệnh `hoi`/`hoi-xong`, `xem --khung`, khoá `muc_tieu` và vùng giao việc có khớp
      dieu-phoi/README.md không? (3) Lời về lớp chép CI (hai tệp chép lại chỉ khi khai tin_hieu; nền thiết kế chạy từ bản kit
      cài) có khớp nhãn trong khối INIT-CI-COPY-LIST của commands/acceptance-init.md không? (4) Đoạn «Vì sao 2.35.0» và «Ai
      bị ảnh hưởng» có nói thẳng các đổi hành vi chạm kho đang dùng — kho đã khai `design.surface_globs` thành M1 và thấy
      dòng bậc ở S0 (kèm dòng stderr khi chưa nối `executors.design.floor`); «cần anh» lớn hơn ở kho có câu giám sát;
      `p0_count` của chế độ dom không còn đếm phát hiện không đo được — không? Trả PASS khi cả năm vế đúng; FAIL nêu đúng vế
      và câu sai.
    evidence_required: [run_id, verdict, rationale]
