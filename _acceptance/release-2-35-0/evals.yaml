    question: >
      Đọc AC-11 của contract release-2-35-0 và ghi chú nhận cho invest. (i) Làm đúng các bước khai của ghi chú trên cấu
      hình kho nhận như ghi chú tả, `docBac` của scripts/design-floor-bac.mjs trả bậc nào? Phải là M1 — không M2/M3 — và
      ghi chú phải nói máy không tự nâng bậc (M2 cần khai `design_floor.tokens` VÀ `design_floor.registry` trỏ tệp có thật;
      M3 chỉ người ghi `design_floor.niem_phong`). (ii) Lệnh `executors.design.floor` và khối `design_floor` có theo khuôn
      GUIDE.md mục «Wire executors.design» (lệnh `design-floor-s4.mjs --root .`, đường bản kit cài ghim lại mỗi bản phát
      hành) không, và có nói hồ sơ chạm giao diện khai eval `script` với `cmd: config:executors.design.floor` như khối
      DESIGN-FLOOR-S4 của SKILL feature-loop? (iii) Bảng đường nền DO1 có sha đỉnh đã đo, giờ lấy về, định nghĩa từng cột
      (làm-xong, ký, gộp, chi phí máy, lượt gọi người) và KHÔNG chứa slug hồ sơ, tên tính năng hay nội dung sản phẩm nào
      của kho nhận? Trả PASS khi cả ba vế đúng; FAIL nêu vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
