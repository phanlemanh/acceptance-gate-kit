    expected: >
      exit 0; mọi ca "GT-" của GT1 vẫn "ok" (0 dòng "not ok", tổng kết "# fail 0") — vòng mã mới, hook đưa tin, hook dừng,
      bộ canh và kênh không đổi hành vi sau GT2.
