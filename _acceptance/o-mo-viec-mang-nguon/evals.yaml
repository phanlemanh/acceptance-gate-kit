schema_version: 1
feature_slug: o-mo-viec-mang-nguon
# Ca đo của hàng TT3: tệp tests/scripts/o-mo-viec-mang-nguon.test.mjs, tên ca «ON-<n>», in «PASS: ON-…» / «FAIL: ON-…»,
# thoát 1 khi có ca đỏ. Khoá executor thêm ở S3 (chỉ thêm khoá):
#   executors.test.o_mo_viec_mang_nguon = node trên tệp ca ấy (đuôi .test.mjs nên cũng chạy trong mảnh mjs của suite).
#   executors.test.can_cu_s1_ca = node tests/scripts/can-cu-s1.ca.mjs (ca hồi quy của AC-8).
# Mọi kho thử dựng trong thư mục tạm của lượt (git init + commit thật); trang tri thức SINH từ khối TRI-THUC-TRANG rút từ
# khuôn tri-thuc-template.md thật, không viết tay; băm tính bằng git hash-object lúc chạy. «Bộ máy trước vòng» = git
# archive <merge-base với origin/main> scripts lib skills, giải vào thư mục tạm; bản tiêm là bản sao scripts/ của cây
# với nhát tiêm khớp đúng một lần (kiểm riêng là đã áp). Đường dẫn suy từ vị trí tệp test. Mỗi ca đỏ chạy đối chứng xanh
# TRƯỚC trên cùng đầu vào; ma trận viết sẵn, số hàng in ra.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/tri-thuc.mjs, scripts/tri-thuc-nguon.cjs, scripts/lo-trinh.mjs, skills/acceptance/references/opportunity-template.md, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-1": opportunity.md có đúng một dòng mở bằng tiền tố OPP-NGUON-PREFIX, là dòng ngay sau «Mở từ hàng
      X»; năm đường trỏ in ra theo thứ tự nền, nền, đợt, [A1], [A2, B1], mỗi băm === git hash-object của trang; không có
      trang [B1] hay ma: []; không có «chưa có trang»; docDongNguon trả đúng năm đường; năm lần --con-tro thoát 0.
      Chiều đỏ trong cùng ca: nếu thiếu dòng, thừa trang, sai thứ tự hay sai băm thì «FAIL: ON-1» nêu đúng vế lệch.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/lo-trinh.mjs, scripts/tri-thuc-nguon.cjs, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-2": ô của hàng Y (không dot) và stdout so Buffer.equals với bản bộ máy trước vòng mở trên bản sao
      kho → bằng nhau (in số byte hai bên). "PASS: ON-2-mutant": bản tiêm bỏ điều kiện «hàng có dot» (nhát tiêm khớp đúng
      một lần) → so lệch và ca in đúng câu «hàng không đợt mà ô có dòng Nguồn».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/lo-trinh.mjs, scripts/tri-thuc-nguon.cjs, scripts/tri-thuc.mjs, scripts/tri-thuc-khoa.cjs, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-3": kho không khai tri_thuc, có docs/tri-thuc/wiki đủ trang, hàng có dot → ô và stdout bằng từng byte
      bản bộ máy trước vòng. "PASS: ON-3-mutant": bản tiêm đọc gốc mặc định docs/tri-thuc khi khối vắng → lệch, ca in đúng
      câu «kho không khai tri_thuc mà ô có dòng Nguồn». "PASS: ON-3-thieu-tep": bản sao bộ máy đã xoá ba tệp tri-thuc.mjs,
      tri-thuc-khoa.cjs, tri-thuc-nguon.cjs → mở ô hàng Y và --hang X bằng từng byte bộ máy trước vòng; bản tiêm thêm import
      tĩnh tri-thuc-nguon.cjs vào đầu lo-trinh.mjs → ca in đúng câu «bên đọc cũ nạp mô-đun tri thức».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/tri-thuc.mjs, scripts/tri-thuc-nguon.cjs, scripts/lo-trinh.mjs, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-4": ma trận sáu hàng in ra (hàng · mã thoát · moi · dòng Nguồn); năm hàng biên thoát 0 với "moi":true
      và dòng kết đúng chuỗi ghim của AC-4 (ba hàng đầu còn đúng số đường trỏ của trang còn lại); hàng kho riêng vắng: đúng
      dòng «Nguồn: không đọc được ở đây: <tên> — git clone <remote> <đường>», 0 đường trỏ; hàng khối lỗi: «Nguồn: khối
      tri_thuc lỗi — cong_khai phải là true hoặc false»; hàng sáu: mọi đường trỏ mở bằng «<tên kho>:», --con-tro thoát 0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/tri-thuc.mjs, scripts/cat-luot.mjs, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-5": ma trận tám hàng in ra (hàng · mã thoát · dòng lỗi nhắc nguồn); mỗi hàng thoát 1 với đúng MỘT dòng
      «lỗi: nguồn …» hoặc «lỗi: bản phạm vi thiếu nguon …» mang mã của hàng ([nguon-khong-phai-trang] ×4 · [nguon-lech] băm
      lệch · [nguon-lech] không có tệp · [nguon-chua-vao-kho] · [nguon-khong-phai-trang] không phải trang wiki); đối chứng hai
      đường trỏ đúng thoát 0 và 0 dòng nhắc nguồn, chạy trước mỗi hàng (in số lần đối chứng = 8); bảng phủ của đối chứng
      in «A1 → hàng X» và «A2 → hàng X» (khoá dot/phu của hàng thử rút từ hàng TT3 thật của docs/plans/lo-trinh-kit.json).
      "PASS: ON-5-khoi-loi": khối tri_thuc có cong_khai: co → thoát 1, đúng một dòng «lỗi: khối tri_thuc lỗi: cong_khai phải
      là true hoặc false», 0 dòng [nguon-*].
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/tri-thuc.mjs, scripts/cat-luot.mjs, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-6": kho riêng vắng → răng phủ thoát 0, đúng một dòng «cảnh báo: nguồn «…»: không đọc được ở đây: <tên>»,
      0 dòng lỗi nhắc nguồn; đối chứng tạo kho riêng lành → cùng lệnh thoát 0 không cảnh báo nguồn; trên kho riêng vắng,
      nguon liên kết và chữ tự do → mỗi lần thoát 1 với đúng một dòng [nguon-khong-phai-trang]. "PASS: ON-6-im": kho không
      khai tri_thuc, nguon chữ tự do và liên kết → stdout + mã thoát bằng từng byte bộ máy trước vòng (hai lần so in ra).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.o_mo_viec_mang_nguon
    paths: [scripts/tri-thuc-nguon.cjs, skills/acceptance/references/opportunity-template.md, tests/scripts/o-mo-viec-mang-nguon.test.mjs]
    expected: >
      exit 0; "PASS: ON-7": khối OPP-NGUON-PREFIX rút được từ khuôn thật; lệnh lo-trinh.mjs --mo-o THẬT chạy trên bản sao bộ
      máy có khuôn tiêm tiền tố «Nguồn-thử:» → ô ghi ra có dòng mở bằng «Nguồn-thử:», bộ đọc cùng khuôn tiêm trả năm đường trỏ, bộ đọc khuôn thật trả coDong false; khuôn mất khối → bên
      ghi ném lỗi chứa «OPP-NGUON-PREFIX».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8a
    criterion: AC-8
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, scripts/cat-luot.mjs, skills/acceptance/references/opportunity-template.md, skills/acceptance/references/pham-vi-template.md]
    expected: exit 0; không dòng «FAIL:» nào.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.kho_tri_thuc_va_lint
    paths: [scripts/tri-thuc.mjs, scripts/tri-thuc-khoa.cjs]
    expected: exit 0; không dòng «FAIL:» nào.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8c
    criterion: AC-8
    executor: test
    cmd: config:executors.test.road_map_de_dung
    paths: [scripts/lo-trinh.mjs, scripts/cat-luot.mjs]
    expected: exit 0; không dòng «FAIL:» nào.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8d
    criterion: AC-8
    executor: test
    cmd: config:executors.test.can_cu_s1_ca
    paths: [scripts/cat-luot.mjs, feature-loop/skills/feature-loop/SKILL.md]
    expected: exit 0; không ca nào đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
