schema_version: 1
feature_slug: trang-thai-dot-dieu-phoi-tho
# Ca đo của hàng: tên ca bắt đầu «KH-». Khoá executor thêm ở S3:
#   executors.test.dieu_phoi_khung = node --test trên tests/dieu-phoi/**, gộp dòng «ok … (DP<n>|SDT|KH)-», «not ok»,
#     dòng chẩn đoán «#   …» và tổng kết TAP thành MỘT dòng (cùng khuôn khoá dieu_phoi_sdt). Ca KH-01…KH-04 sống ở
#     tests/dieu-phoi/khung.test.mjs.
#   executors.script.dieu_phoi_khung_mod = node tests/dieu-phoi/kiem-khung.mjs — `claude plugin test` trên bản sao gói
#     kèm tệp ca tests/dieu-phoi/mod/khung.test.ts (cả bề mặt terminal và desktop, đồng hồ giả), `claude -p` trong môi
#     trường cô lập (hợp đồng, Thuật ngữ) và `claude plugin validate --strict --json`. In mỗi ca một dòng
#     «PASS|FAIL: KH-0n …». Tìm engine như kiem-mod.mjs; không có → FAIL nêu đúng điều đó.
# Kho thử do code sinh trong lượt (git init trong thư mục tạm, CLI thật của gói dựng đợt, worktree thật cho dãy,
# trang-thai.json chép từ tests/dieu-phoi/fixtures/dot-crm-0910). JSON mà tệp ca mod nhận là stdout THẬT của
# `xem --json` sinh trong cùng lượt (round-trip CLI → mod), không viết tay. Bản cũ = `git archive f59d9547 dieu-phoi`
# (commit cố định, không merge-base). Đường dẫn suy từ vị trí tệp test. Mỗi ca đỏ chạy CHÍNH hàm/lệnh đo trên bản sao
# bị tiêm, SAU khi bản lành xanh trên cùng fixture, kiểm riêng bước tiêm đã áp, và ghim dấu hiệu của ĐÚNG lỗi được
# tiêm. Ma trận viết sẵn: số assert = số hàng, in ra. Lời hứa là đẳng thức thì so bằng nhau, không so bao hàm.
# Suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_khung
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/mo-hinh.mjs, dieu-phoi/scripts/dot.mjs, tests/dieu-phoi/khung.test.mjs, tests/dieu-phoi/fixtures/dot-crm-0910/**]
    expected: >
      exit 0; "ok" cho "KH-01 xem-json": 4 hàng cwd (gốc kho · worktree P3 · thư mục con của P3 · worktree ngoài
      dãy) in ra «hàng · day_cua_cwd mong đợi · thực tế»; mỗi hàng thoát 0, stderr rỗng, stdout một dòng JSON; các
      khoá ngoài day_cua_cwd/canh_bao/mui_gio_phut deepStrictEqual moHinh(trang-thai.json, {nhom, hangViec}) tính
      trên CÙNG tệp; day_cua_cwd = null, "P3", "P3", null; canh_bao null; mui_gio_phut 420 với TZ=Asia/Ho_Chi_Minh.
      "ok" cho "KH-01-do bo-day-cua-cwd": bản sao dieu-phoi.mjs bỏ khoá day_cua_cwd (kiểm bước tiêm áp) → ca nêu
      "day_cua_cwd" ở hàng (b).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_khung
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/dot.mjs, tests/dieu-phoi/khung.test.mjs]
    expected: >
      exit 0; "ok" cho "KH-02 xem-json-bien": 4 hàng in ra — (a) kho không đợt: stdout === '{"dot":null}\n', thoát
      0, stderr ""; (b) thư mục tạm ngoài git: như (a); (c) đợt chưa có trang-thai.json: thoát 0, JSON.dot = tên
      đợt, pha = pha của dieu-khien.json, chua_co_nhip === true; (d) trang-thai.json hỏng: thoát 1, stderr bắt đầu
      "dieu-phoi: ", stdout "". "ok" cho "KH-02-do khong-dot-rong": bản sao trả {} khi không đợt (kiểm bước tiêm
      áp) → hàng (a) đỏ, thông điệp chứa byte nhận được "{}".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dieu_phoi_khung
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/mo-hinh.mjs, tests/dieu-phoi/khung.test.mjs]
    expected: >
      exit 0; "ok" cho "KH-03 xem-khong-doi": bản cũ = `git archive f59d9547 dieu-phoi` giải vào thư mục tạm
      (commit cố định); 4 hàng (a) có nhịp · (b) chưa có nhịp · (c) không đợt · (d) có nhịp + .claude/settings.json
      còn hook gọi scripts/dieu-phoi/ — stdout, stderr, mã thoát của `xem` HEAD === của bản cũ ở mọi hàng (in ra);
      đối chứng dương: stdout hàng (d) chứa dòng bắt đầu "cảnh báo:". "ok" cho "KH-03-do doi-chu": bản sao HEAD đổi
      "chờ lượt" thành "cho luot" trong veXem (kiểm bước tiêm áp) → ca nêu "(a)" và hai dòng khác nhau.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dieu_phoi_khung
    paths: [dieu-phoi/scripts/khung.mjs, dieu-phoi/scripts/mo-hinh.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/khung.test.mjs, tests/dieu-phoi/fixtures/dot-crm-0910/**]
    expected: >
      exit 0; "ok" cho "KH-04 ve-dai": 16 hàng (a)–(p) như AC-4, chuỗi mong đợi viết sẵn trong tệp test (chép từ
      thiết kế §2.2, không rút từ mã), số assert = 16 in ra; mỗi hàng so đúng quan hệ AC-4 nêu (bằng · chứa · mở đầu ·
      kết thúc · độ dài 40 và ký tự cuối "…"); (k) lệch 0 → chứa "S4: P5 → 00:47", (l) lệch −300 → chứa
      "S4: P5 → 19:47" dưới TZ=Asia/Ho_Chi_Minh của tiến trình test. "ok" cho "KH-04 round-trip-dai": kho thử mở
      bằng `mo sau-14-10`, đầu vào = JSON.parse(stdout THẬT của xem --json), 5 hàng (R1)–(R5) strictEqual với dòng
      TRỌN viết tay trong AC-4 (8 đơn chờ, 0 việc chờ người đếm tay từ fixture), in số assert 5. "ok" cho "KH-04
      round-trip-xem": (R6)–(R8) chuXem(JSON.parse(stdout xem --json)) === stdout của xem bỏ "\n" cuối; (R9) kho
      không đợt → "dieu-phoi: " + chuXem({dot:null}) === stderr của xem bỏ "\n" cuối. "ok" cho "KH-04
      khung-khong-import": dieu-phoi/scripts/khung.mjs có 0 dòng khớp /^\s*import\b/m. Ba ca đỏ, mỗi ca kiểm bước
      tiêm áp: "ok" cho "KH-04-do bo-giam-tai" (bỏ nhánh GIẢM TẢI → ca nêu "(g)" và "(R4)"); "ok" cho "KH-04-do
      sai-khoa-cho" (đếm chờ lượt từ khoá khác → ca nêu "(R1)"); "ok" cho "KH-04-do gio-may" (tính giờ bằng giờ máy
      → ca nêu "(k)" hoặc "(l)").
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.dieu_phoi_khung_mod
    paths: [dieu-phoi/hooks/mod/khung.ts, dieu-phoi/hooks/mod/register.ts, dieu-phoi/scripts/khung.mjs, dieu-phoi/scripts/mo-hinh.mjs, dieu-phoi/types/index.d.ts, dieu-phoi/.claude-plugin/plugin.json, tests/dieu-phoi/kiem-khung.mjs, tests/dieu-phoi/mod/khung.test.ts]
    expected: >
      exit 0; dòng "PASS: KH-05 dai" kèm «<bản> · <p> pass 0 fail · terminal+desktop»: plugin test trên bản sao gói,
      process.run trả stdout THẬT của `xem --json` (kho thử, cwd worktree P3) sinh trong cùng lượt; mỗi bề mặt
      terminal và desktop: Text của dải === veDai(cùng JSON, {cot: bodyColumns − 8}); Button khoá "xem" có mặt;
      press "xem" → hook ui.open bên dưới nhận id "dieu-phoi-dot"; stdout '{"dot":null}' → không Text nào của gói;
      process.run ném → Text "khung: không đọc được đợt"; hasSurvey → không Text nào của gói. Dòng "PASS: KH-05-do
      bo-next-khong-dot": bản sao khung.ts bỏ nhánh veDai(...) === null → next(e) (kiểm bước tiêm áp) → plugin test
      báo "(fail)" ở ca không đợt, dòng nêu tên ca. Không có engine có lệnh test → "FAIL: KH-05" nêu đúng điều đó.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.dieu_phoi_khung_mod
    paths: [dieu-phoi/hooks/mod/khung.ts, dieu-phoi/scripts/khung.mjs, tests/dieu-phoi/kiem-khung.mjs, tests/dieu-phoi/mod/khung.test.ts]
    expected: >
      exit 0; dòng "PASS: KH-06 nhip": đồng hồ giả của plugin test; session.start xong → 0 lời gọi process.run;
      đẩy 1 ms → đúng 1 lời gọi, argv === ['node', '<gốc gói>/scripts/dieu-phoi.mjs', 'xem', '--json'], cwd === cwd
      phiên, timeoutMs === 10000; có đợt + 20000 ms → 2 lời gọi; không đợt + 20000 ms → 1, tới tổng 120000 ms → 2;
      lời gọi lỗi → lần kế sau 20000 ms. Dòng "PASS: KH-06-do chu-ky": bản sao đặt chu kỳ không đợt 20000 (kiểm
      bước tiêm áp) → ca không đợt "(fail)", dòng nêu "120000".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.dieu_phoi_khung_mod
    paths: [dieu-phoi/hooks/mod/khung.ts, dieu-phoi/scripts/mo-hinh.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/kiem-khung.mjs, tests/dieu-phoi/mod/khung.test.ts]
    expected: >
      exit 0; dòng "PASS: KH-07 pane": mỗi bề mặt terminal và desktop, sau press "xem", Pane "dieu-phoi-dot" dựng
      ra các Text mà dãy chữ theo thứ tự === các dòng stdout THẬT của `xem` (không cờ) trên cùng kho thử; trước lần
      đọc đầu → "đang đọc đợt…"; lỗi đọc → dòng đầu "khung: không đọc được đợt"; số lời gọi ui.open trước lần bấm
      === 0. Dòng "PASS: KH-07-do mo-khong-hoi": bản sao gọi ui.open trong session.start (kiểm bước tiêm áp) → ca
      đếm "(fail)".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.dieu_phoi_khung_mod
    paths: [dieu-phoi/hooks/mod/khung.ts, dieu-phoi/hooks/hooks.json, dieu-phoi/commands/xem.md, dieu-phoi/scripts/mo-hinh.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/kiem-khung.mjs]
    expected: >
      exit 0; dòng "PASS: KH-08 lenh-dong-co-that" kèm số hàng 4: engine thật, môi trường cô lập (bỏ mọi biến
      CLAUDE_*/ANTHROPIC_*, CLAUDE_CONFIG_DIR tạm, ANTHROPIC_API_KEY giả, ANTHROPIC_BASE_URL http://127.0.0.1:9),
      `claude -p "/dieu-phoi:xem" --plugin-dir <bản sao gói> --output-format json` ở 4 kho thử (a) có nhịp · (b) chưa
      có nhịp · (c) không đợt · (d) có cảnh báo; mỗi hàng is_error false, num_turns 0, total_cost_usd 0, result ===
      "dieu-phoi: " + chữ `xem` không cờ in cho cùng kho (stdout bỏ "\n" cuối; hàng (c): stderr bỏ tiền tố
      "dieu-phoi: " và "\n" cuối). Dòng "PASS: KH-08 duong-lui": chạy SAU khi hàng (a) xanh, gói CÓ mod, kho thử có
      trang-thai.json hỏng (CLI thoát 1) → num_turns ≥ 1, terminal_reason "api_error", result không mở đầu
      "dieu-phoi: khung" (hook ném, engine bỏ qua hook, lệnh markdown chạy). Dòng "PASS: KH-08-do matcher" và "PASS:
      KH-08-do khong-mod": chạy SAU khi hàng (a) xanh trên cùng kho, bản sao đổi matcher lệnh / gỡ "modules" khỏi
      hooks.json (kiểm bước tiêm áp) → num_turns ≥ 1 và terminal_reason "api_error". Không có engine → "FAIL: KH-08"
      nêu đúng điều đó.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.dieu_phoi_khung_mod
    paths: [dieu-phoi/scripts/mod-luat.mjs, dieu-phoi/hooks/mod/**, dieu-phoi/hooks/hooks.json, dieu-phoi/.claude-plugin/plugin.json, dieu-phoi/types/index.d.ts, tests/dieu-phoi/kiem-khung.mjs]
    expected: >
      exit 0; dòng "PASS: KH-09 rang": validate --strict --json của engine thật success, 0 lỗi; SU_KIEN_MOD có khoá
      "./mod/khung.ts" và register.ts chứa "dangKyKhung(on)"; kiemKhungMod(gói, {suKienValidate}) === []; tập
      gatingHooks[].hook === ["command.run{command=dieu-phoi:xem}"] và mục đó hasCatch === false; không giá trị nào
      của SU_KIEN_MOD giao SU_KIEN_CONG; dòng "calls:" của module không chứa $.fs.write, $.fs.remove, $.store.set,
      $.session.send, $.session.append, $.prompt.submit, $.tool.*, $.command.run (in nguyên dòng calls); mọi argv viết
      thẳng của $.process.run trong khung.ts kết thúc bằng 'xem', '--json'. Năm dòng đỏ trên bản sao, mỗi dòng kiểm
      bước tiêm áp: "PASS: KH-09-do cong" (dòng bảng khung.ts thêm "tool.call" + on('tool.call', …)) → lỗi chứa
      "khung.ts" và "tool.call"; "PASS: KH-09-do gating" (on('prompt.submit', …) vào bảng và tệp) → thông điệp
      gatingHooks lệch chứa "prompt.submit"; "PASS: KH-09-do allow" (nhánh decision: 'allow') → lỗi khớp
      /hooks\/mod\/khung\.ts:\d+ trả lời cho phép/; "PASS: KH-09-do ghi-tep" (thêm $.fs.write) → lỗi chứa
      "$.fs.write"; "PASS: KH-09-do argv" (argv lệnh con "pha") → lỗi chứa "khung.ts" và "pha".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9b
    criterion: AC-9
    executor: script
    cmd: config:executors.script.dieu_phoi_mod
    paths: [dieu-phoi/scripts/mod-luat.mjs, dieu-phoi/hooks/mod/**, dieu-phoi/hooks/hooks.json, dieu-phoi/.claude-plugin/plugin.json, tests/dieu-phoi/kiem-mod.mjs]
    expected: >
      exit 0; các dòng "PASS: DP4-12 modules", "PASS: DP4-12 plugin-test", "PASS: DP4-12 round-trip", "PASS: DP4-12-do
      bo-dieu-kien", "PASS: DP4-12-do boc-mang", "PASS: DP4-13 validate", "PASS: DP4-13 su-kien", "PASS: DP4-13-do
      allow", "PASS: DP4-13-do ngoai-bang", "PASS: DP4-13-do phan-la" đều có mặt và không dòng "FAIL:" nào — răng của
      hồ sơ đã ký dieu-phoi-doi-tai-khoan vẫn xanh khi gói có phần khung.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
