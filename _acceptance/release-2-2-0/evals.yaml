# evals — release-2-2-0
#
# Lớp MÁY duy nhất (mốc này không đổi hành vi, chỉ đóng số): rang-release.sh —
# mỗi chân có MỘT hàm kiểm nhận GỐC, cây thật và bản đột biến cùng đi qua nó,
# chiều đỏ in vết cùng lượt và ghim đúng thông điệp.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.rang_release22_manifest
    paths: [_acceptance/release-2-2-0/rang-release.sh, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, diagram-design/.claude-plugin/plugin.json]
    expected: >
      acceptance-gate 2.2.0 · feature-loop 2.2.0 · diagram-design giữ số hợp
      semver (2.5.0); mô tả acceptance-gate có mục «v2.2.0»; mô tả feature-loop
      khai cặp «acceptance-gate >= 2.2.0». Chiều đỏ qua CHÍNH kiem_manifest:
      bản sao hạ số → ĐỎ ghim «ag-version 2.1.0»; bản sao để cặp cũ → ĐỎ ghim
      «fl khai cap ag >= 2.2.0».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.rang_release22_docs
    paths: [_acceptance/release-2-2-0/rang-release.sh, GUIDE.md, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json]
    expected: >
      Dòng «Khớp phiên bản» của GUIDE khớp ĐÚNG ba số ĐỌC TỪ manifest (một
      nguồn, không so hằng trong script). Chiều đỏ: bản sao GUIDE ghi số cũ →
      ĐỎ ghim câu mong đợi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    expected: "suite scripts XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.hooks
    expected: "suite hooks XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3c
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: "suite plugins XANH (gồm P197 · P198 · P199 của ba hồ sơ trong mốc)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3d
    criterion: AC-3
    executor: test
    cmd: config:executors.test.workflows
    expected: "suite workflows XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rang_release22_lan_v
    paths: [_acceptance/release-2-2-0/rang-release.sh, _acceptance/release-2-2-0/contract.md]
    expected: >
      Hợp đồng mở làn V: `veto_state: mo` · `approved_by` RỖNG · hạng T2 (ba vế
      đều là điều kiện của làn). Chiều đỏ: bản sao hạ hạng T3 → điều kiện làn V
      mất (pre-merge chặn theo §4c). Đỏ ghim vế thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rang_release22_diff
    paths: [_acceptance/release-2-2-0/rang-release.sh]
    expected: >
      Mọi file trong diff nhánh so với base nằm trong allowlist ĐÓNG (2 manifest ·
      GUIDE.md · PRODUCT-MAP.md · _acceptance/config.yaml · _acceptance/release-2-2-0/**).
      Base không giải được → ĐỎ (fail-closed), không bỏ qua. Chiều đỏ: đường dẫn
      engine giả lập đi qua CHÍNH nhánh lọc và bị loại.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.rang_release22_mo_ta
    paths: [_acceptance/release-2-2-0/rang-release.sh, .claude-plugin/plugin.json]
    expected: >
      Mục «v2.2.0» của mô tả acceptance-gate nói đủ năm vế người dùng cần: hình
      tại Cổng 1 · ngưỡng nghiệm thu trên thẻ · nhật-ký-vấp (stranger drive) ·
      S5 bàn giao · KHÔNG phải migrate. Chiều đỏ: bản sao xoá tên nhật-ký-vấp →
      ĐỎ ghim đúng vế thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
