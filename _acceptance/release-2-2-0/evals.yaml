# evals — release-2-2-0
#
# MỘT chân răng (`rang-release.mjs`) phục vụ bốn tiêu chí của mốc: bốn eval dưới
# dùng CHUNG một lệnh (S4 dedupe — chạy một lượt, chấm bốn AC). Mọi vế là giá
# trị trong một tiến trình Node, mã thoát = số vế đỏ; cây thật và bản đột biến
# cùng đi qua CHÍNH hàm `kiem()`; mỗi chiều đỏ ghim ĐÚNG câu.
#
# Phạm vi thước đã THU (owner chọn 18/08, luật dừng-vá lần hai) — ba việc bỏ vì
# đã có lưới khác đo, ghi ở Known limits của hợp đồng:
#   · hành trình làn V → lưới trước-merge tự chạy ở biên merge, có bộ kiểm riêng;
#   · ba ca P197/P198/P199 → suite plugins chạy như E3c, ba ca thuộc ba hồ sơ kia;
#   · tự-kiểm bộ đếm → sinh ra để canh bộ đếm bash, mà bash đã chết.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.rang_release22
    paths: [_acceptance/release-2-2-0/rang-release.mjs, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, diagram-design/.claude-plugin/plugin.json]
    expected: >
      Ba vế số: `ag-version 2.2.0` · `fl-version 2.2.0` · `dd-version 2.5.0
      khong doi so voi base` (QUAN HỆ với `git show <base>`, không phải hình
      dạng semver). Chiều đỏ qua CHÍNH `kiem()`: hạ số ag → ĐỎ «ag-version
      2.1.0»; nâng vendor pin 9.9.9 → ĐỎ «dd-version doi so voi base»; manifest
      ag hỏng → ĐỎ «khong doc duoc manifest acceptance-gate» (không crash,
      không im lặng). Kèm đối chứng dương của chính đường đột biến: bản sao
      NGUYÊN VẸN phải 0 vế đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.rang_release22
    paths: [_acceptance/release-2-2-0/rang-release.mjs, GUIDE.md]
    expected: >
      Vế `GUIDE khop so doc tu manifest`: câu mong đợi DỰNG TỪ ba số đọc trong
      manifest, không so với hằng trong script. Chiều đỏ: bản sao GUIDE ghi số
      cũ → ĐỎ ghim nguyên câu mong đợi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    expected: "suite scripts XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.hooks
    expected: "suite hooks XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3c
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: "suite plugins XANH (ba ca P197/P198/P199 của ba hồ sơ trong mốc chạy ở đây)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3d
    criterion: AC-3
    executor: test
    cmd: config:executors.test.workflows
    expected: "suite workflows XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rang_release22
    paths: [_acceptance/release-2-2-0/rang-release.mjs]
    expected: >
      Diff nhánh so với base KHÔNG rỗng (rỗng = chân mù → ĐỎ) và chứa đủ ba vật
      lõi (2 manifest + GUIDE.md); mọi file trong diff nằm trong allowlist ĐÓNG;
      `git status` kiểm cả MÃ THOÁT (git hỏng → ĐỎ, không thành «không có sửa
      chưa commit»); sửa chưa commit ngoài allowlist cũng ĐỎ. Base không giải
      được → ĐỎ fail-closed.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.rang_release22
    paths: [_acceptance/release-2-2-0/rang-release.mjs, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json]
    expected: >
      Đo trên ĐÚNG MỤC `v2.2.0` (cắt đoạn, không quét cả chuỗi): năm vế người
      dùng — hình tại Cổng 1 · ngưỡng nghiệm thu trên thẻ · nhật-ký-vấp
      (stranger drive) · S5 bàn giao · KHÔNG phải migrate; và mục `v2.2.0` của
      feature-loop TỰ khai cặp `acceptance-gate >= 2.2.0`. Hai chiều đỏ: xoá
      tên nhật-ký-vấp → ĐỎ đúng vế; DỜI câu khai cặp sang mục lịch sử v2.1.0 →
      ĐỎ «cau khai cap nam ngoai muc nay (sua muc lich su khong tinh)» — đúng
      lỗi vòng chấm 18/08 bắt được trên vật thật.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
