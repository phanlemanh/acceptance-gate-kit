schema_version: 1
feature_slug: co-qua-timebox-nhom-da-xong

# T2, sáu tiêu chí. E1–E3 và E5 cùng chạy RT13 nhưng ghim token khác nhau trong câu tóm tắt PASS
# (workflow dedupe lệnh; mỗi ô một khẳng định). Câu tóm tắt PASS của RT13 sau hồ sơ này được nối
# thêm NGUYÊN VĂN: `iii: <n> hồ sơ quá hạn trên cây thật (<tên>) · iii-b: 7 fixture — park quá hạn ✓ · park chưa hạn ✗ · kill quá hạn ✓ · archived quá hạn ✓ · archived chưa hạn ✗ · release quá hạn ✓ · release chưa hạn ✗ · mutant ×3 bắt: pk-qua · ar-qua · rl-qua` (gap-probe 06/09 P1: chữ khai phải bằng chuỗi máy in). Không judgment.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cqt_rt13
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs"]
    expected: >-
      exit 0; stdout có `PASS: [RT13]` và câu tóm tắt chứa `park quá hạn ✓ · park chưa hạn ✗ · kill quá hạn ✓`
      — fixture park Timebox 2026-01-01 nằm ở ô done/xep-lai và mang cờ; fixture park Timebox hôm-nay+2 cùng ô,
      không cờ (should-NOT-fire); kill quá hạn ở done/da-bac mang cờ. Phép kiểm khoá ô TRƯỚC khi soi cờ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cqt_rt13
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs"]
    expected: >-
      exit 0; câu tóm tắt PASS của RT13 chứa `archived quá hạn ✓ · archived chưa hạn ✗` — hai fixture stage
      archived ở ô done/da-dong-ho-so, Timebox 2026-01-01 mang cờ, Timebox hôm-nay+2 không.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cqt_rt13
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs"]
    expected: >-
      exit 0; câu tóm tắt PASS của RT13 chứa `release quá hạn ✓ · release chưa hạn ✗` — hai fixture hợp đồng
      signed-off (khuôn writer) + bằng chứng có chữ ký + uat-session verdict release + cơ hội chốt ngưỡng, ở ô
      done/da-nghiem-thu-release; Timebox 2026-01-01 mang cờ, hôm-nay+2 không.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs", "_acceptance/baseline-127-tin-hieu-phan-biet/opportunity.md"]
    expected: >-
      exit 0; stdout có `PASS: [RT13]` với `iii: n hồ sơ quá hạn trên cây thật` trong đó n ≥ 1 và danh sách
      tên chứa `baseline-127-tin-hieu-phan-biet` (tiền đề của ca đỏ 06/09 còn đứng); KHÔNG có dòng
      `cờ qua-timebox thiếu`; suite kết `Results: 0 failed`. n = 0 thì E4 KHÔNG phải bằng chứng của AC-4.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cqt_rt13
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs"]
    expected: >-
      exit 0; câu tóm tắt PASS của RT13 chứa `mutant ×3 bắt: pk-qua · ar-qua · rl-qua` — ba bản sao của bộ
      quét (chép nguyên cây scripts/ + lib/ + khuôn), mỗi bản gỡ `flags` khỏi một lối, chạy trên CÙNG fixture;
      phép soi nêu đúng slug quá hạn của lối bị gỡ. Bản sao không đổi được chuỗi (mất mỏ neo) hoặc mutant vẫn
      xanh → RT13 FAIL với `mutant KHÔNG bị bắt`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cqt_o_khong_doi
    paths: ["scripts/start-scan.mjs", "tests/plugins/ra-co-ten.test.mjs", "_acceptance/ra-co-ten-lam-va-trao/contract.md", "PRODUCT-MAP.md"]
    expected: >-
      exit 0; RT13 (ii) không in dòng `lệch` nào (stateKey từng slug bản cũ cb38ea01 = bản mới ngoài khối
      KHAC-BIET-DOC-CU); `product-map.mjs --check` in `PRODUCT-MAP.md khớp hồ sơ xưởng.`; và
      `git status --porcelain PRODUCT-MAP.md` rỗng (lệnh thoát ≠ 0 nếu bản đồ bị ghi). Chiều đỏ của (ii) sống
      trong RT13 (bản sao xoá một dòng KHAC → đỏ).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
