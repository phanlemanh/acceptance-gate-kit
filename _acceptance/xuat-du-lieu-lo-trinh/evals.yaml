schema_version: 1
feature_slug: xuat-du-lieu-lo-trinh
# Ca đo sống ở tests/scripts/lo-trinh.test.mjs (LT-110..LT-120, cùng tệp với ca của các vòng lộ trình
# trước; executor `executors.test.lo_trinh` chạy đúng tệp đó — không thêm khoá executor). Kho thử do
# code sinh trong lượt (git init trong thư mục tạm). Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao vật bị
# tiêm (hoặc trên trang bị tiêm), SAU khi bản lành xanh trên cùng kho thử, và ghim thông điệp rút từ
# đầu ra của hàm đo. Mỗi eval ghim đúng dòng "PASS: LT-…" — suite xanh mà thiếu dòng ghim là ĐỎ. Bộ
# vẽ «bản trước vòng» lấy bằng `git archive 7e965b54 scripts lib` (trọn thư mục; CI checkout
# fetch-depth 0); sha không resolve được thì ca FAIL, không bỏ qua.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-110" — kho thử ba lộ trình (tệp 1: hàng có hồ sơ, hàng theo lời,
      hàng kế, cờ, mốc có/không gắn việc, đã bác; tệp 2: JSON hỏng; tệp 3: hợp lệ, `hang: []`) + một hồ
      sơ ngoài kế hoạch: đếm
      `id="lo-trinh-du-lieu"` trong trang == 1; JSON.parse khối được; khuon/phien_ban/nguon đúng; tập
      khoá từng cấp (gốc · lo_trinh · hang · moc · hang_ke · tien_do) == KHUON_DU_LIEU của mã (đẳng
      thức tập, in ra); lo_trinh[1].loi chứa «tệp kế hoạch» và các mảng của nó rỗng; lo_trinh[2] đủ khoá, tien_do
      toàn 0, hang_ke null; KHUON_DU_LIEU == bảng khoá VIẾT SẴN trong ca (chép từ bảng của design doc,
      không rút từ mã). Và
      "PASS: LT-110-do" — bản sao lo-trinh.mjs bỏ khoá `nhom_trang_thai` khỏi hàng: CHÍNH hàm đo trả
      lỗi nêu «nhom_trang_thai».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, tests/scripts/fixtures/lo-trinh/crm-okr.json, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-111 kho-thu" và "PASS: LT-111 crm-okr" — bản chiếu tham chiếu (trong
      ca, chỉ đọc khối qua docDuLieu) so với bộ đọc HTML độc lập (regex trên `<tr id>` + ô «Trạng thái»,
      thẻ «Làm tiếp», danh sách «Cần sửa», dòng «Tiến độ», `li[data-ngay]` của dải mốc, dấu «theo ghi
      chép», chữ cờ trong ô trạng thái, mục «Đã bác», khối hồ sơ ngoài kế hoạch) của CHÍNH trang: tập mã
      hàng bằng nhau; mỗi mã cùng chữ trạng thái, cùng theo_loi, cùng tập chữ cờ; số hàng theo
      nhom_trang_thai == bốn số trên thẻ; hàng kế + lệnh bằng nhau; số và câu cần sửa bằng nhau; mỗi mốc
      cùng ngày/tên/việc/con_viec; da_bac (mã + lý do) và ngoai_lo_trinh bằng nhau; ho_so mỗi hàng ==
      hồ sơ kho thử dựng để nhận hàng đó (bảng biết trước lúc dựng); số mục so được in ra và > 0 ở từng
      loại. Và "PASS: LT-111 nhom" — ma trận toàn phần: mọi chữ trạng thái lớp phân tích phát được (rút
      từ SECTIONS + «Chưa mở» + «Không suy được», không viết tay) × một hàng mỗi chữ trong kho do code
      sinh; nhom_trang_thai TỪNG hàng == nhóm mà phép chia của thanh tiến độ cho chữ đó (in ma trận; số
      ô đo == số chữ). Chiều đỏ, mỗi ca trên trang lành sau khi bản lành xanh: "PASS: LT-111-do bo-hang"
      (xoá một hàng khỏi khối → lỗi nêu mã hàng) · "PASS: LT-111-do doi-trang-thai" (lỗi nêu mã + hai
      chữ) · "PASS: LT-111-do ngoai-rong" (ngoai_lo_trinh = [] → lỗi nêu «ngoai_lo_trinh») · "PASS:
      LT-111-do co-chua-dich" (thay một cờ bằng câu gốc chưa dịch → lỗi nêu mã hàng) · "PASS: LT-111-do
      doi-nhom" (bản sao mã xếp «Sắp mở vòng» vào dang-lam → lỗi nêu mã hàng và hai tên nhóm).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
