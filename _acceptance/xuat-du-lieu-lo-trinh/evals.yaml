    cmd: config:executors.test.lo_trinh
    paths: [scripts/lo-trinh.mjs, skills/acceptance/references/lo-trinh-du-lieu.md, tests/scripts/lo-trinh.test.mjs]
    expected: >
      exit 0; stdout có "PASS: LT-120" — trang kho thử có một mốc M (ngày D) còn việc chưa giao và một
