  - id: E11
    criterion: AC-11
    executor: judgment
    inputs: [skills/acceptance/references/lo-trinh-du-lieu.md, _acceptance/xuat-du-lieu-lo-trinh/lt1-crm.json]
    question: >
      lo-trinh-du-lieu.md là tài liệu kit giao cho kho tiêu thụ về khối dữ liệu lộ trình; lt1-crm.json là
      hàng «Trang Lộ trình trong CRM» của kho crm. Chỉ dựa vào tài liệu, một kỹ sư crm có dựng được trang
      đó không — biết lấy khối ở đâu và rút ra sao, mỗi hàng hiện trạng thái gì, lọc theo nhóm bằng khoá
      nào, việc kế và lệnh mở ở đâu, mốc nào đã qua còn việc chưa giao — mà không phải đọc mã kit? Luật
      duy nhất tài liệu bảo bản chiếu tự làm có phải là so ngày của mốc với hôm nay không, hay tài liệu
      để bản chiếu tự suy trạng thái ở chỗ nào khác? PASS khi đủ cả năm việc và chỉ có luật so ngày, kèm
      trích câu tài liệu cho từng việc; FAIL nêu việc nào thiếu hoặc chỗ nào bắt bản chiếu tự suy;
      UNCERTAIN khi tài liệu không đọc được.
    paths: [skills/acceptance/references/lo-trinh-du-lieu.md]
    expected: PASS kèm trích câu cho từng việc; FAIL nêu việc thiếu
    evidence_required: [judged_by, verdict, rationale]
