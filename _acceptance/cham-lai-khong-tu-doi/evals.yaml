      tự kiểm đổi byte; 5 mũi: tập mang sang bản mới = [E1, E10, E3] và BẰNG bản trước vòng, không in «E1 không mang
      sang»; mũi khối E3: bản mới mang [E1, E10], bản trước vòng cũng mang E1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cham_lai_khong_tu_doi
    paths: [feature-loop/scripts/carry-plan.mjs, tests/scripts/cham-lai-khong-tu-doi.test.mjs]
    expected: >
