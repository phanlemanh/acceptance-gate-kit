schema_version: 1
feature_slug: cham-lai-khong-tu-doi
# Ca đo sống ở tests/scripts/cham-lai-khong-tu-doi.test.mjs (ca CL<n> = AC-n; đuôi .test.mjs nên cũng chạy trong mảnh
# mjs của suite) — khoá riêng executors.test.cham_lai_khong_tu_doi chạy TRỌN tệp, mọi eval chung MỘT lệnh và ghim dòng
# PASS của chính nó: lệnh xanh mà thiếu dòng ghim là ĐỎ. Kho thử do code sinh trong lượt; tệp args do s4-args thật
# sinh; dòng sổ lượt chấm do bộ chấm thật dựng (harness vm); dòng thuoc-lech/cay-doi do thuoc-vat --write thật ghi.
# «Bản trước vòng» = `git archive <cha của commit đầu đưa dinhNghiaTai vào carry-plan> feature-loop lib scripts skills`
# bung trong lượt — mỗi chiều đỏ là bản ấy trên CÙNG kho thử (fixture tái hiện lỗi), mỗi chiều im so bằng nhau với nó.
# Mọi đường dẫn suy từ vị trí tệp ca. E7b chạy ba bộ ca sẵn có của các hồ sơ đã ký mà vật này chạm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cham_lai_khong_tu_doi
    paths: [feature-loop/scripts/carry-plan.mjs, feature-loop/scripts/s4-args.mjs, tests/scripts/cham-lai-khong-tu-doi.test.mjs]
    expected: >
      exit 0; stdout có dòng bắt đầu "PASS: CL1 — 5/5 mũi đổi khối E1". Ca: kho thử E1/E2/E3, lượt 1 chấm xanh, nhát
      sửa chạm src/b.js; ma trận viết trước 5 mũi {expected 21→22 · cmd · executor · expected_exit · criterion}, ca tự
      kiểm số mũi = 5. Mỗi mũi: bản mới mang ĐÚNG [E10, E3] và stderr chứa «E1 không mang sang — định nghĩa eval đổi so với
      lượt gốc r1»; bản trước vòng trên cùng kho mang E1 (chiều đỏ — fixture tái hiện DA3b). Đối chứng dương: không đổi
      định nghĩa → bản mới mang [E1, E10, E3].
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cham_lai_khong_tu_doi
    paths: [feature-loop/scripts/carry-plan.mjs, lib/ac-line.cjs, tests/scripts/cham-lai-khong-tu-doi.test.mjs]
    expected: >
      exit 0; stdout có dòng bắt đầu "PASS: CL2". Chữ AC-1 trong hợp đồng đổi (21→22), khối E1 giữ: bản mới mang ĐÚNG
      [E10, E3], stderr chứa «E1 không mang sang — tiêu chí AC-1 đổi chữ so với lượt gốc r1»; bản trước vòng mang E1.
      Mũi tiền tố (DA3b): chữ AC-10 và expected E10 đổi → bản mới mang ĐÚNG [E1, E3], stderr chứa «E10 không mang sang —
      định nghĩa eval đổi so với lượt gốc r1» và KHÔNG chứa «E1 không mang sang»; bản trước vòng mang E10.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cham_lai_khong_tu_doi
    paths: [feature-loop/scripts/carry-plan.mjs, feature-loop/workflows/acceptance-verify.js, tests/scripts/cham-lai-khong-tu-doi.test.mjs]
    expected: >
      exit 0; stdout có dòng bắt đầu "PASS: CL3". Lượt 2 do bản trước vòng sinh args (ca tự kiểm nó mang E1 — sai thì ca
      FAIL «fixture khong dung hinh»), bộ chấm ghi dòng mang; lượt 3 bản mới: round 3, E1 không mang sang, stderr trỏ
      «lượt gốc r1»; bản trước vòng ở lượt 3 mang E1 (chiều đỏ).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cham_lai_khong_tu_doi
    paths: [feature-loop/scripts/carry-plan.mjs, feature-loop/scripts/s4-args.mjs, tests/scripts/cham-lai-khong-tu-doi.test.mjs]
    expected: >
