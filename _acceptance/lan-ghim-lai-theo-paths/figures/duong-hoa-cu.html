<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường hoá cũ theo paths</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; line-height: 1.5; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · lan-ghim-lai-theo-paths · Cổng Phạm vi</p>

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="368" y="452" width="48" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="560" y="484" width="72" height="12" rx="2" fill="#f5f5f5"/>

      <text x="680" y="652" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không hoá cũ</text>
      <text x="680" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">in NOTE bỏ qua: slug + tệp</text>

      <!-- End: keep old list -->

      <text x="736" y="514" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">in NOTE nói vì sao</text>

      <text x="736" y="552" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">eval máy thiếu paths</text>
      <text x="736" y="568" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">evals.yaml vắng hoặc hỏng</text>
