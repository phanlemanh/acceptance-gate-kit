schema_version: 1
feature_slug: dieu-phoi-doi-tai-khoan
# Ca đo của hàng sống ở tests/dieu-phoi/doi-tai-khoan.test.mjs (tên ca bắt đầu «DP4-»). Khoá executor thêm ở S3:
#   executors.test.dieu_phoi_dp4  = node --test trên tests/dieu-phoi/**, gộp dòng «ok … DP1-|DP2-|DP3-|DP4-»,
#     «not ok», dòng chẩn đoán «#   …» và tổng kết TAP thành MỘT dòng (cùng khuôn khoá dieu_phoi_dp3)
#   executors.script.dieu_phoi_mod = node tests/dieu-phoi/kiem-mod.mjs — `claude plugin test` trên bản sao gói
#     kèm tệp ca của mod, và `claude plugin validate --strict --json` đối chiếu bảng MOD-SU-KIEN; tìm bản
#     Claude Code có lệnh `test` (PATH, rồi bản của app), không có → FAIL nêu đúng điều đó
#   executors.script.dieu_phoi_validate, executors.test.dieu_phoi_lb — có từ DP1, DP2
# Kho thử do code sinh trong lượt (git init trong thư mục tạm, worktree thật cho dãy). Đường dẫn suy từ vị trí
# tệp test. Đồng hồ giả truyền vào hàm, hoặc DIEU_PHOI_NOW_MS cho tiến trình con. Hook chạy bằng CHÍNH lệnh rút
# từ dieu-phoi/hooks/hooks.json (thay ${CLAUDE_PLUGIN_ROOT}). Mỗi ca đỏ chạy CHÍNH hàm/lệnh đo trên bản sao bị
# tiêm, SAU khi bản lành xanh trên cùng fixture, kiểm riêng bước tiêm đã áp, và ghim dấu hiệu của ĐÚNG lỗi được
# tiêm. Ma trận viết sẵn: số assert = số hàng, in ra. Lời hứa là đẳng thức thì so bằng nhau, không so bao hàm.
# Mỗi eval ghim đúng dòng TAP «ok … - DP4-…». Suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_dp4
    paths: [dieu-phoi/scripts/pha.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/doi-tai-khoan.test.mjs]
    expected: >
      exit 0; "ok" cho "DP4-01 bang-chuyen": ma trận 6 × 6 cặp pha viết sẵn trong tệp test (36 dòng in ra dạng
      «cặp · mong đợi · thực tế», mong đợi chép từ AC-1, KHÔNG rút từ bảng CHUYEN của mã): 11 cạnh của AC-1 thoát 0
      và thêm đúng một dòng lich_su; 6 ô đường chéo thoát 0, độ dài lich_su không đổi; 19 ô còn lại gọi CLI `pha`
      thật thoát 1 và băm dieu-khien.json trước == sau; vào dang-ban-giao ghi khối ban_giao có ma khớp
      ^bg-\d{8}T\d{6}Z$ và pha_truoc. "ok" cho "DP4-01 khong-cap": đợt ở mỗi pha ★, một đơn s4 lành trong xin/, một nhịp bộ phát lịch
      thật (motNhip) → không có khoa/s4, đơn vẫn nằm nguyên (băm trước == sau); đối chứng dương: cùng fixture ở
      dang-chay → khoá được cấp. "ok" cho "DP4-01-do cap-o-ban-giao": bản sao choPhepTheoPha trả true ở
      dang-ban-giao (kiểm bước tiêm áp) → ca nêu "dang-ban-giao" và khoá s4 bị cấp.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_dp4
    paths: [dieu-phoi/scripts/han-muc.mjs, dieu-phoi/scripts/mau/han-muc.json, dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/phat-lich.mjs, dieu-phoi/scripts/chan-doan.mjs, tests/dieu-phoi/fixtures/rate-limits-mod.json, tests/dieu-phoi/doi-tai-khoan.test.mjs]
    expected: >
      exit 0; "ok" cho "DP4-02 chuan-hoa": ma trận viết sẵn 6 đầu vào (3 lành: mod, get-usage với ba nhãn gồm một
      cửa sổ tuần theo model, statusline giây; 3 hỏng: mảng rỗng, JSON hỏng, nguồn lạ) — 6 assert in ra; mỗi đầu
      vào lành cho cua_so so sâu bằng giá trị viết sẵn (cửa sổ theo model vắng); mỗi đầu vào hỏng thoát 1, stderr
      nêu nguồn, băm han-muc.json trước == sau. "ok" cho "DP4-02 hai-muoi": 25 lần gọi → tệp giữ đúng 20 lần đọc
      mới nhất (so luc đầu và cuối). "ok" cho "DP4-02 khuon": tập khoá (sâu) của lần đọc CLI ghi == tập khoá của
      dieu-phoi/scripts/mau/han-muc.json. "ok" cho "DP4-02 round-trip": bộ đọc lần đọc hiệu lực mà nhịp bộ phát
      lịch dùng trả đúng lần đọc CLI vừa ghi. "ok" cho "DP4-02-do khong-dot": kho thử không đợt, cùng lệnh →
      thoát 0, stdout "khong-co-dot", băm cây trước == sau; đối chứng: kho có đợt thì tệp được tạo. Đầu vào
      nguồn mod của ma trận đọc từ tệp fixture chung tests/dieu-phoi/fixtures/rate-limits-mod.json (cùng tệp ca
      mod của E12 dùng). "ok" cho "DP4-02 chan-doan-han-muc": đợt khai han_muc, 4 hàng in ra — không lần đọc ·
      một lần đọc 40′ · chỉ lần đọc của phiên khác trước nhan_luc → mục han-muc trang_thai "thieu", viec chứa
      "get_usage" và "han-muc --nguon get-usage"; có lần đọc hiệu lực → "du"; đợt không khai han_muc → không có
      mục han-muc (so danh sách tên mục).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
