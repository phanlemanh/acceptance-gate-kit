    expected: >
      exit 0; "ok" cho "DP4-03 ma-tran": 15 hàng (a)–(o) như AC-3, mỗi hàng một kho thử dựng bằng mã, nhịp
      motNhip thật với đồng hồ giả; số assert = 15 (in ra); sự kiện hạn mức và pha mỗi hàng so bằng nhau với dòng
