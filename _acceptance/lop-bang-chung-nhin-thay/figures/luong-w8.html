<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng W8 — lớp bằng chứng nhìn thấy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lưu đồ quyết định · Hồ sơ lop-bang-chung-nhin-thay · Cổng Phạm vi</p>
    <h1>Luồng W8 — một hợp đồng có mặt người nhìn phải có bằng chứng nhìn thấy</h1>

    <svg viewBox="0 0 1000 832" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Vào → Mặt người nhìn? -->
      <line x1="380" y1="88" x2="380" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Mặt người nhìn? KHÔNG → phải -->
      <line x1="500" y1="168" x2="640" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Mặt người nhìn? CÓ → xuống -->
      <line x1="380" y1="216" x2="380" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Có eval ui-check? CÓ → phải (đường xanh, cam) -->
      <line x1="500" y1="304" x2="640" y2="304" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Có eval ui-check? KHÔNG → xuống -->
      <line x1="380" y1="352" x2="380" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đã ghi bỏ? CÓ → phải -->
      <line x1="500" y1="440" x2="640" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đã ghi bỏ? KHÔNG → xuống -->
      <line x1="380" y1="488" x2="380" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ba răng → Ngưỡng (đứt: chưa mở) -->
      <line x1="380" y1="600" x2="380" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên (mask + khoảng hở 8px) ===== -->
      <rect x="548" y="144" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="570" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="392" y="228" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="404" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="558" y="280" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="570" y="292" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="392" y="364" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="414" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="558" y="416" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="570" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="392" y="500" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="414" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="392" y="612" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="420" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ĐANG ĐẾM</text>

      <!-- ===== Nút ===== -->
      <!-- 1. Vào (oval) -->
      <rect x="260" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="380" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hợp đồng khai surfaces</text>

      <!-- 2. Mặt người nhìn? (diamond) -->
      <polygon points="380,120 500,168 380,216 260,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có mặt người nhìn</text>
      <text x="380" y="178" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong surfaces?</text>

      <!-- 3. Ngoài nghĩa vụ (oval) -->
      <rect x="640" y="144" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="760" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không có nghĩa vụ nhìn thấy</text>
      <text x="760" y="181" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">api · cli · mobile (đi làn test, không đường frame)</text>

      <!-- 4. Có eval ui-check? (diamond) -->
      <polygon points="380,256 500,304 380,352 260,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có ít nhất một eval</text>
      <text x="380" y="314" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nhìn màn hình (ui-check)?</text>

      <!-- 5. Xanh (oval, tiêu điểm) -->
      <rect x="640" y="280" width="240" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="760" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xanh — nghĩa vụ đã trả</text>
      <text x="760" y="317" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">theo hợp đồng, ≥1 là đủ · không nhãn vẫn tính</text>

      <!-- 6. Đã ghi bỏ? (diamond) -->
      <polygon points="380,392 500,440 380,488 260,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="436" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã ghi «bỏ ui-observed —</text>
      <text x="380" y="450" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lý do» vào sổ chưa?</text>

      <!-- 7. Bỏ có tên (rectangle) -->
      <rect x="640" y="404" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ có tên — người ký thấy trước</text>
      <text x="760" y="446" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ghi trước seal → thẻ Cổng 1: dòng thông tin</text>
      <text x="760" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ghi sau seal → thẻ Cổng 2: khối «CHƯA duyệt»</text>

      <!-- 8. Ba răng (rectangle) -->
      <rect x="260" y="528" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ba răng cùng kêu, không chặn</text>
      <text x="380" y="570" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lint W8 · cờ vàng thẻ Cổng 1</text>
      <text x="380" y="584" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">NOTE ở kiểm tra trước merge (chưa chặn)</text>

      <!-- 9. VIOLATION (oval đứt — để sau) -->
      <rect x="260" y="640" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="380" y="664" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chặn merge (VIOLATION) — để sau</text>
      <text x="380" y="680" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ngưỡng mở: 2 hợp đồng không frame / mốc phát hành</text>

      <!-- ===== Chú thích lề (callout) ===== -->
      <!-- Callout 1: alias surface -->
      <text x="40" y="132" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">web, web-ui đọc là ui;</text>
      <text x="40" y="148" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">mobile thì không.</text>
      <path d="M 152 156 Q 200 176 248 168" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="252" cy="168" r="2" fill="#2d3142"/>

      <!-- Callout 2: nhãn ui-observed -->
      <text x="40" y="272" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">nhãn «ui-observed» chỉ là lời khai;</text>
      <text x="40" y="288" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">gắn lên test/script là lạc chỗ.</text>
      <path d="M 200 296 Q 224 312 248 304" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="252" cy="304" r="2" fill="#2d3142"/>

      <!-- ===== Ghi chú dưới hình ===== -->
      <text x="40" y="732" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Ghi chú: hook đã giữ frame + observed trên mọi ui-check — neo máy là executor, nhãn chỉ để đọc.</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="756" x2="960" y2="756" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="772" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI</text>

      <rect x="40" y="788" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vào / ra (oval)</text>

      <rect x="200" y="788" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Việc máy làm (chữ nhật)</text>

      <polygon points="380,794 392,788 404,794 392,800" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="412" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh (thoi)</text>

      <line x1="540" y1="796" x2="568" y2="796" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường xanh</text>

      <rect x="680" y="788" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="712" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Để sau, chờ ngưỡng đếm (đứt)</text>
    </svg>
  </div>
</body>
</html>
