schema_version: 1
feature_slug: moi-cong-khong-qua-nut
# Ca đo của hàng KY1: tệp tests/scripts/moi-cong-khong-qua-nut.test.mjs, tên ca «MQ-<n>», in «PASS: MQ-…» / «FAIL: MQ-…»,
# thoát 1 khi có ca đỏ. Khoá executor thêm ở S3 (chỉ thêm khoá):
#   executors.test.moi_cong_khong_qua_nut = node trên tệp ca ấy (đuôi .test.mjs nên cũng chạy trong mảnh mjs của suite).
#   executors.test.p188_moi_cong = ONLY_BLOCK=P188 của tests/plugins/run-tests.sh, giữ dòng P188.
# Từ lượt 2, E9b dùng khoá thêm executors.test.dieu_phoi_khung_tung_dong (cùng bộ ca khung điều phối, mỗi ca một dòng). Trước S4, mọi `config:` của tệp này phải giải được (s4-args từ chối khi không).
# Mọi đầu vào rút từ văn bản thật trong lượt: điều khoản, bảng chỗ chép và khuôn qua marker của
# skills/acceptance/references/human-facing-language.md; hằng ONE_SHOT_CMD_SIGNOFF và ô «ký hay trả: ___» rút từ nguồn
# scripts/gate-card.js; luật đợt rút qua hàm ghepLuat thật của dieu-phoi/scripts/goi-dot.mjs. Đường dẫn suy từ vị trí tệp
# test. Mỗi ca đỏ chạy CHÍNH bộ kiểm trên bản tiêm của văn bản thật (nhát tiêm khớp đúng một lần, kiểm riêng là đã áp), SAU
# khi bản lành xanh trên cùng đầu vào, và ghim thông điệp của ĐÚNG hàng bị tiêm. Ma trận viết sẵn: số assert = số hàng, in ra.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.moi_cong_khong_qua_nut
    paths: [skills/acceptance/references/human-facing-language.md, tests/scripts/moi-cong-khong-qua-nut.test.mjs]
    expected: >
      exit 0; "PASS: MQ-1": rút khối GATE-END-TURN-CLAUSE qua marker được đúng một dòng không rỗng, vị trí sau khối
      GATE-INVITE-CLAUSE; dòng chứa đủ chín cụm `card.html`, `evidence-page.html`, `SendUserFile`, «in đường dẫn trang»,
      «```text», «chép đúng như thẻ in», `___`, `wrap_up`, «không câu hỏi và không nút». Chiều đỏ "PASS: MQ-1-do": bản tiêm bỏ cụm `SendUserFile` khỏi điều khoản →
      bộ kiểm trả «điều khoản thiếu: SendUserFile»; bản tiêm dời khối lên trước GATE-INVITE-CLAUSE → «điều khoản đứng trước
      GATE-INVITE-CLAUSE».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
