      commands/acceptance-card.md, feature-loop/skills/feature-loop/SKILL.md và bốn tệp dieu-phoi; mọi dòng số đếm === số khai,
      mọi bản khớp từng ký tự. Chiều đỏ "PASS: MQ-2-do", 3 hàng: (a) đổi một ký tự trong bản chép ở
