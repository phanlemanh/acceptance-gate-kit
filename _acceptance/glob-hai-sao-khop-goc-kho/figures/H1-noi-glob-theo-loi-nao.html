<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H1 — Nới ngữ nghĩa glob theo lối nào, và mỗi lối chạm gì</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · glob-hai-sao-khop-goc-kho · H1</p>
    <h1>Nới ngữ nghĩa glob theo lối nào, và mỗi lối chạm gì</h1>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cây quyết định hai nhánh: cộng ngữ nghĩa hai sao (đã chọn) hay chuyển sang minimatch đầy đủ (bác)">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Gốc → Lối A (đã chọn, accent): rẽ trái rồi xuống -->
      <path d="M 340 112 H 248 A 8 8 0 0 0 240 120 V 200" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Lối A: nhánh → ví dụ → hệ quả -->
      <line x1="240" y1="272" x2="240" y2="296" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="416" x2="240" y2="456" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Gốc → Lối B (bác, mờ, đứt): rẽ phải rồi xuống -->
      <g opacity="0.55">
        <path d="M 660 112 H 752 A 8 8 0 0 1 760 120 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="760" y1="272" x2="760" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="760" y1="416" x2="760" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      </g>

      <!-- Nhãn nhánh trên đoạn ngang (mask cách nét 6px) -->
      <rect x="240" y="88" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="292" y="100" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LỐI A · ĐÃ CHỌN</text>
      <rect x="668" y="88" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="708" y="100" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LỐI B · BÁC</text>

      <!-- ===== Nút gốc: quyết định (hình thoi) ===== -->
      <polygon points="500,64 660,112 500,160 340,112" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo khai "**/*.md"</text>
      <text x="500" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">— máy hiểu thế nào?</text>

      <!-- Ô đỏ nhỏ ở nút gốc: hiện trạng trước vòng -->
      <rect x="356" y="168" width="288" height="20" rx="2" fill="rgba(180,35,24,0.08)" stroke="#b42318" stroke-width="0.8"/>
      <text x="500" y="182" fill="#b42318" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trước vòng: "**/*.md" không bắt "AGENTS.md"</text>

      <!-- ===== LỐI A — đã chọn ===== -->
      <!-- Nhánh A -->
      <rect x="80" y="208" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="208" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CỘNG: "**/" là không-hoặc-nhiều thư mục</text>
      <text x="240" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">"**/" đầu hay giữa mẫu đều vậy (AC-5) · "*" vẫn vượt "/"</text>

      <!-- Ví dụ A: ba đường dẫn thật -->
      <rect x="80" y="304" width="320" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="304" width="320" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="92" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BA ĐƯỜNG DẪN THẬT</text>
      <line x1="92" y1="330" x2="388" y2="330" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="92" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">AC-1</text>
      <text x="132" y="348" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AGENTS.md  với mẫu "**/*.md"</text>
      <text x="388" y="348" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">khớp</text>

      <text x="132" y="372" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">docs/a.md  với mẫu "**/*.md"</text>
      <text x="388" y="372" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">khớp</text>

      <text x="92" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">AC-6</text>
      <text x="132" y="396" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">docs/a.md  với "*.md" (consumer khác)</text>
      <text x="388" y="396" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">khớp</text>

      <!-- Hệ quả A (focal, accent) -->
      <rect x="80" y="464" width="320" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="80" y="464" width="320" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="240" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không lời khai đang sống nào đổi nghĩa</text>
      <text x="240" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lệch gitignore một điểm ("*" vượt "/") — ghi GUIDE (AC-9)</text>

      <!-- ===== LỐI B — bác (mờ) ===== -->
      <g opacity="0.55">
        <!-- Nhánh B -->
        <rect x="600" y="208" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="208" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">minimatch đầy đủ: "*" không vượt "/"</text>
        <text x="760" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bác vì đổi nghĩa lời khai đang sống ở mọi repo tiêu thụ</text>

        <!-- Ví dụ B -->
        <rect x="600" y="304" width="320" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="304" width="320" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="612" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BA ĐƯỜNG DẪN THẬT</text>
        <line x1="612" y1="330" x2="908" y2="330" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <text x="612" y="348" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AGENTS.md  với mẫu "**/*.md"</text>
        <text x="908" y="348" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">khớp</text>

        <text x="612" y="372" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">docs/a.md  với mẫu "**/*.md"</text>
        <text x="908" y="372" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">khớp</text>

        <text x="612" y="396" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">docs/a.md  với "*.md" (consumer khác)</text>
        <text x="908" y="396" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">không khớp</text>

        <!-- Hệ quả B -->
        <rect x="600" y="464" width="320" height="64" rx="32" fill="#f5f5f5"/>
        <rect x="600" y="464" width="320" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="760" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lời khai "*.md" ở template + GUIDE đổi nghĩa</text>
        <text x="760" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docs sâu bị coi là mã · stale nổ ở chiều ngược lại</text>
      </g>

      <!-- ===== Chú thích chân hình ===== -->
      <text x="80" y="564" fill="#2d3142" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Ô đỏ nhỏ dưới nút gốc là hiện trạng trước vòng: bộ khớp đòi ít nhất một dấu "/" nên "**/*.md" bỏ sót markdown ở gốc kho. Lối mờ là lối đã bác.</text>

      <!-- ===== Chú giải (dải ngang dưới cùng) ===== -->
      <line x1="80" y1="592" x2="920" y2="592" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="80" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <line x1="80" y1="632" x2="108" y2="632" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="116" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối đã chọn</text>

      <line x1="240" y1="632" x2="268" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.55" marker-end="url(#arrow)"/>
      <text x="276" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối đã bác (mờ, kèm lý do một dòng)</text>

      <rect x="480" y="624" width="24" height="12" rx="2" fill="rgba(180,35,24,0.08)" stroke="#b42318" stroke-width="0.8"/>
      <text x="512" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hiện trạng trước vòng</text>

      <text x="680" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">AC-n</text>
      <text x="712" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí nghiệm thu liên quan (AC-1 · AC-5 · AC-6 · AC-9)</text>
    </svg>
  </div>
</body>
</html>
