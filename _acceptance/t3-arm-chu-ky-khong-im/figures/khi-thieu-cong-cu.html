<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khi thiếu công cụ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 920px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình tại điểm quyết định · AC-1, AC-2, AC-3</p>
    <h1>Khi máy chạy cổng thiếu công cụ đọc chữ ký</h1>

    <svg viewBox="0 0 920 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng quyết định khi máy chạy cổng thiếu công cụ đọc chữ ký">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" viewBox="0 0 8 6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="5.33" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first, nodes after -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2">
        <line x1="460" y1="96" x2="460" y2="128" marker-end="url(#arrow)"/>
        <path d="M300,208 H248 Q240,208 240,216 V328" marker-end="url(#arrow)"/>
        <path d="M620,208 H672 Q680,208 680,216 V328" marker-end="url(#arrow)"/>
        <line x1="240" y1="472" x2="240" y2="520" marker-end="url(#arrow)"/>
        <path d="M80,400 H56 Q48,400 48,408 V652 Q48,660 56,660 H96" marker-end="url(#arrow)"/>
        <path d="M840,400 H864 Q872,400 872,408 V668 Q872,676 864,676 H824" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
      </g>
      <line x1="680" y1="472" x2="680" y2="516" stroke="#eb6c36" stroke-width="2.8" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <g font-family="'Geist Mono', monospace" font-size="12" letter-spacing="0.06em" fill="#4f5d75">
        <rect x="256" y="180" width="40" height="20" rx="2" fill="#f5f5f5"/>
        <text x="276" y="196" text-anchor="middle">CÓ</text>
        <rect x="624" y="180" width="56" height="20" rx="2" fill="#f5f5f5"/>
        <text x="652" y="196" text-anchor="middle">KHÔNG</text>
        <rect x="248" y="484" width="32" height="20" rx="2" fill="#f5f5f5"/>
        <text x="252" y="500">CÓ</text>
        <rect x="56" y="436" width="56" height="20" rx="2" fill="#f5f5f5"/>
        <text x="60" y="452">KHÔNG</text>
        <rect x="792" y="436" width="72" height="20" rx="2" fill="#f5f5f5"/>
        <text x="860" y="452" text-anchor="end">LỐI KHÁC</text>
        <rect x="688" y="484" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="692" y="500" fill="#ba4513" font-weight="600">KHUYẾN NGHỊ</text>
      </g>

      <!-- Entry -->
      <rect x="220" y="40" width="480" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="74" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR đổi code trọng yếu, kèm hồ sơ hạng dưới T3</text>

      <!-- Decisions -->
      <g fill="#ffffff" stroke="#2d3142" stroke-width="1">
        <polygon points="460,128 620,208 460,288 300,208"/>
        <polygon points="240,328 400,400 240,472 80,400"/>
        <polygon points="680,328 840,400 680,472 520,400"/>
      </g>
      <g fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">
        <text x="460" y="200">Máy chạy cổng có đủ</text>
        <text x="460" y="224">công cụ đọc chữ ký?</text>
        <text x="240" y="392">Hồ sơ có</text>
        <text x="240" y="416">chữ ký người?</text>
        <text x="680" y="392">Hỏi-1: chặn hay</text>
        <text x="680" y="416">cho qua kèm cảnh báo?</text>
      </g>

      <!-- Outcomes -->
      <rect x="96" y="520" width="288" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="554" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tính hồ sơ, cổng đi tiếp</text>

      <rect x="96" y="632" width="288" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="666" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chặn: chưa có chữ ký người</text>

      <rect x="536" y="520" width="288" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="536" y="520" width="288" height="72" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2.8"/>
      <g fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">
        <text x="680" y="552">Chặn, nói rõ thiếu node</text>
        <text x="680" y="576">hay thiếu thư viện</text>
      </g>

      <rect x="536" y="632" width="288" height="88" rx="20" fill="#f5f5f5"/>
      <rect x="536" y="632" width="288" height="88" rx="20" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.55)" stroke-width="1.2" stroke-dasharray="6,5"/>
      <g fill="#4f5d75" font-size="16" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">
        <text x="680" y="656">Cho qua, in một dòng cảnh báo:</text>
        <text x="680" y="680">code trọng yếu có thể gộp</text>
        <text x="680" y="704">mà không ai ký</text>
      </g>

      <!-- Note under the figure -->
      <line x1="48" y1="752" x2="872" y2="752" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <g fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">
        <text x="48" y="784">Đọc ngày 10/11/2026: 13 kho cài cổng, không kho nào đang rơi vào nhánh thiếu công cụ.</text>
        <text x="48" y="812">Hỏi-2: thư viện có mặt mà chạy lỗi thì PR vẫn bị chặn, chỉ lời báo chưa đúng.</text>
      </g>
    </svg>
  </div>
</body>
</html>
