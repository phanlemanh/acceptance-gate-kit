    paths: [scripts/pre-merge-check.sh, tests/scripts/t3-can-ho-so-arm.test.mjs, tests/scripts/additive-only.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
