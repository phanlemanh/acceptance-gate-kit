    expected: >
      Exit 0 và dòng tổng kết của rang/vi-phan-kho.mjs: mỗi PR trong rang/ds-pr.json của t3-can-ho-so-arm cho đúng kết quả đã
      chốt trên máy đủ công cụ, lệch một PR là đỏ và nêu tên PR. Dưới sàn nhóm hoặc dưới 5 kho → exit 2 mù.
    paths: [scripts/pre-merge-check.sh, _acceptance/t3-can-ho-so-arm/rang/vi-phan-kho.mjs, _acceptance/t3-can-ho-so-arm/rang/ds-pr.json]
