      0. "ok" cho "DP1-13 kiem-chuyen" (thân không đổi). "ok" cho "DP8-03-do ma-thoat-tren-moi-dong": bản sao CLI
      tính mã thoát trên mọi dòng chuyển → hàm kiểm nêu "thoát 1 khi chỉ còn lịch sử".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
