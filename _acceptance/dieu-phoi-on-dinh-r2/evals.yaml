      im (../dieu-phoi-khac/ · ./dieu-phoi/ từ thư mục khác scripts/ · chuỗi trong .md · đường tuyệt đối); tập
      dòng `kiemChuyen` trả cho các tệp này BẰNG tập viết sẵn của hàng phải bắt (in số hàng mỗi nhóm); dòng vừa
      chứa scripts/dieu-phoi/ vừa là import tương đối xuất hiện đúng một lần; mọi dòng import ấy nằm trong
      phai_sua của `phanLopChuyen`. "ok" cho "DP8-02-do bo-quet-import": bản sao gói bỏ bước quét import (kiểm
      bước tiêm áp) → hàm kiểm nêu "scripts/kiem-cheo/dem.mjs" thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dieu_phoi_sdt
    paths: [dieu-phoi/scripts/dieu-phoi.mjs, dieu-phoi/scripts/kiem-chuyen.mjs, tests/dieu-phoi/on-dinh-r2.test.mjs, tests/dieu-phoi/dong-goi.test.mjs]
    expected: >
