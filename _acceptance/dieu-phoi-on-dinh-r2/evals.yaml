schema_version: 1
feature_slug: dieu-phoi-on-dinh-r2
# Ca đo của vòng sống ở tests/dieu-phoi/on-dinh-r2.test.mjs (tên ca bắt đầu «DP8-»). Khoá executor:
#   executors.test.dieu_phoi_sdt — có từ hồ sơ dieu-phoi-sua-truoc-dot-thu: node --test trên tests/dieu-phoi/**,
#     gộp dòng «ok … DP<n>-|SDT-», «not ok», dòng chẩn đoán «#   …» và tổng kết TAP thành MỘT dòng; regex
#     «DP[0-9]+» đã nhặt «DP8-».
#   executors.script.dieu_phoi_dp8_crm — thêm ở S3: node tests/dieu-phoi/dp8-crm-that.mjs (đo trên kho crm thật
#     của máy này; không vào CI, không vào suite_keys — tiền lệ esl_vi_phan_bay_kho).
#   executors.script.dieu_phoi_validate, executors.test.dieu_phoi_lb — có từ DP1, DP2.
# Kho thử do code sinh trong lượt (git init + git worktree add thật trong thư mục tạm). Đợt dựng bằng `mo` thật
# từ gói đợt khai qua cấu hình; nhịp bộ phát lịch là `motNhip`/`taoVong` thật với đồng hồ giả; nhịp sống do hook
# thật ghi. Đường dẫn suy từ vị trí tệp test. Mỗi ca đỏ chạy CHÍNH hàm đo trên bản sao gói bị tiêm, SAU khi bản
# lành xanh trên cùng fixture, kiểm từng lần thay đã áp, và ghim dấu hiệu của ĐÚNG lỗi được tiêm. Ma trận viết
# sẵn: số assert = số hàng, in ra. Lời hứa là đẳng thức thì so bằng nhau. Mỗi eval ghim đúng dòng TAP
# «ok … - <tên ca>»; suite xanh mà thiếu dòng ghim là ĐỎ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dieu_phoi_sdt
    paths: [dieu-phoi/scripts/kiem-chuyen.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/on-dinh-r2.test.mjs]
    expected: >
      exit 0; "ok" cho "DP8-01 phan-lop": kho thử do code sinh có đúng một dòng trỏ scripts/dieu-phoi/ ở mỗi
      hàng của ma trận viết sẵn (hook settings · package.json · hook git · README gốc · LUAT.md đợt · eval script
      sống hồ sơ đang mở · eval script sống hồ sơ đã ký · eval judgment sống hồ sơ đang mở · eval judgment sống
      hồ sơ đã ký · eval ui-check sống hồ sơ machine-cleared · eval not-run · executor eval sống gọi · executor
      chỉ eval not-run gọi · executor trong suite_keys · run-log.jsonl · evidence-report.md · decisions.jsonl ·
      rang/x.mjs · docs/superpowers/specs/x.md · docs/plan/y.md · LO-TRINH.html · glob khai · khối khai #id · eval sống
      khác cùng tệp với khối khai · executor gọi từ eval viết ở cột 0 · khối not-run viết ở cột 0 — 27 hàng);
      `phanLopChuyen` xếp mỗi hàng đúng nhóm viết sẵn (phải sửa hay lớp lịch sử nêu tên), số assert == độ dài ma
      trận (in ra); đa tập (phai_sua ∪ lich_su[].dong) BẰNG đa tập `kiemChuyen` trên cùng kho. "ok" cho "DP8-01
      khong-khai": cùng kho bỏ khoá dieu_phoi.lich_su → hai hàng khai rơi về phải sửa. "ok" cho "DP8-01-do
      bo-eval-chet": bản sao gói bỏ luật eval-chet (kiểm bước tiêm áp) → hàm kiểm nêu hàng eval not-run. "ok"
      cho "DP8-01-do ho-so-nuot-eval": bản sao xếp mọi tệp _acceptance/ vào ho-so → hàm kiểm nêu hàng eval script
      sống của hồ sơ đang mở.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dieu_phoi_sdt
