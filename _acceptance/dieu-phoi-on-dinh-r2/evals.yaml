    cmd: config:executors.script.dieu_phoi_dp8_crm
    paths: [dieu-phoi/scripts/kiem-chuyen.mjs, dieu-phoi/scripts/dieu-phoi.mjs, tests/dieu-phoi/dp8-crm-that.mjs]
    expected: >
