      "kiem-chuyen: <tệp>:<dòng>" BẰNG phai_sua theo đúng thứ tự, rồi một dòng tổng "kiem-chuyen: lich-su <n> dòng
      — …" với n == số dòng lịch sử, lớp theo thứ tự bảng, tổng các k == n; thoát 1. `--chi-tiet` thêm đúng n
      dòng "kiem-chuyen lich-su: <tệp>:<dòng> · <lớp>" bằng lich_su. Sau khi gỡ mọi dòng phải sửa: dòng
