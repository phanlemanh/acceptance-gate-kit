# Eval cho hồ sơ release-2-12-0 — mốc THUẦN CẮT SỐ.
#
# Nguyên tắc của bộ đo này: KHÔNG dựng dàn đo dùng-một-lần. Ba mốc 2.0.0 · 2.1.0 ·
# 2.2.0 mỗi lần tự dựng một dàn riêng, và mỗi vòng soi lại tìm ra một cách nó không đo
# thật (fail-open · assertion âm-tính-một-mình · lời-khai-sai · mất lối thoát). Nên:
#   - AC-1 dùng ca THƯỜNG TRỰC P200, đọc mọi số TỪ manifest, canh được cả mốc sau.
#   - AC-2 dùng răng của hồ sơ, nhưng bất biến của nó KHÔNG ghim số mốc nào: mốc so
#     suy TỪ KHO, nên bản chép chạy đúng ở mọi cửa sổ và hồ sơ đã ký còn ghim lại được.
#   - AC-3 dùng đúng bốn suite + bản đồ mà mọi hồ sơ khác dùng.
#
# ĐỌC TRƯỜNG `baseline:` CỦA BÁO CÁO THẾ NÀO (nó là trường của evidence-report, KHÔNG
# phải của tệp này — bản trước đặt câu này sai vật). Răng của hồ sơ nằm trong chính thư
# mục hồ sơ nên chúng KHÔNG tồn tại ở commit gốc; làn baseline của workflow quy định
# script-của-feature vắng ở base thì ghi «có phân biệt». Đó là phân biệt SỰ TỒN TẠI CỦA
# CHÍNH TỆP, không phải phân biệt cây trước/sau mốc. Với hồ sơ này, `baseline:` của mọi
# khối eval phải đọc là `n-a`, và bằng chứng phân biệt thật nằm ở CHIỀU ĐỎ của từng răng
# (mã thoát riêng cho từng lối hỏng), mô tả trong `expected` dưới đây.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.p200_cat_so_2_12
    expected: >-
      `rang-p200.sh` chạy ca thường trực P200 rồi rút phán quyết TỪ DÒNG CỦA CHÍNH NÓ
      (`  PASS: P200 …`), đúng một dòng. P200 đọc mọi số TỪ manifest: hai plugin cùng
      `2.12.0`; `GUIDE.md` dẫn xuất số từ manifest; mục mô tả của chính số đó nói người
      dùng nhận gì và `feature-loop` tự khai cặp `acceptance-gate >= 2.12.0`.
      VÌ SAO KHÔNG gọi thẳng suite: `ONLY_BLOCK` chỉ lọc khối đi qua `run()`, còn ~46
      khối viết thẳng bằng echo+if vẫn chạy và vẫn cộng vào `failures` — lấy mã thoát
      trọn suite nghĩa là một khối rời đỏ sẽ báo «số 2.12.0 không nhất quán» về một lần
      cắt số hoàn toàn lành, đúng lớp hạ-tầng-tự-sinh-tín-hiệu-đỏ mà cửa sổ này ghi là
      ba lần. Ba lối hỏng có mã thoát riêng: 2 suite không in gì · 3 P200 không có dòng
      PASS nào · 4 P200 in nhiều hơn một dòng PASS (bộ lọc hỏng).
    paths:
      - ".claude-plugin/plugin.json"
      - "feature-loop/.claude-plugin/plugin.json"
      - "GUIDE.md"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.moc_diagram_2_12
    expected: >-
      Răng thoát 0 và in ĐÚNG chuỗi `giu 2.7.0 BANG so tai moc truoc 45e5f1d8`, kèm đối
      chứng dương «cửa sổ mốc..HEAD KHÔNG rỗng» — tức xanh vì ĐO, không vì thiếu vật.
      Mốc so của chân 1..3 suy TỪ KHO (commit gần nhất CẮT SỐ của `diagram-design`);
      số so của chân 7 đọc từ manifest TẠI commit mốc phát hành trước, không gõ vào răng.
      Năm lối hỏng có mã thoát riêng: 3 không tìm được lần cắt số · 4 cửa sổ rỗng ·
      5 `diagram-design/` CÓ đổi sau lần cắt số · 6 không đọc được số tại HEAD ·
      7 số tại HEAD KHÁC số tại mốc trước. Chiều đỏ của chân 7 đã chạy thật: trỏ
      `--moc-truoc` vào một mốc mà `diagram-design` mang 2.5.0 → thoát 7 in cả hai số.
    paths:
      - "diagram-design/.claude-plugin/plugin.json"
      - "_acceptance/release-2-12-0/rang-moc.sh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3a
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    expected: "Suite scripts thoát 0, dòng `Results:` không có ca đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.hooks
    expected: "Suite hooks thoát 0, dòng `Results:` không có ca đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3c
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: >-
      Suite plugins thoát 0. Lệnh đã bọc `pipefail` + lọc + `tail` từ mốc 2.11.0 vì suite
      in ~70k ký tự và bốn trên năm lượt chấm của mốc đó bị công cụ cắt đầu ra giữa chừng
      rồi tác tử khai đỏ. Lệnh này ĐỎ thì E3f là thứ quyết định nó là hạ tầng hay vật —
      KHÔNG có câu dặn nào ở đây thay cho phép đo đó.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3d
    criterion: AC-3
    executor: test
    cmd: config:executors.test.workflows
    expected: "Suite workflows thoát 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3e
    criterion: AC-3
    executor: script
    cmd: config:executors.script.product_map
    expected: "`product-map.mjs --root . --check` thoát 0 — bản đồ khớp hồ sơ xưởng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3f
    criterion: AC-3
    executor: script
    cmd: config:executors.script.phan_lop_do_2_12
    expected: >-
      `phan-lop-ha-tang.cjs --quet` quét MỌI dòng máy đỏ trong `run-log.jsonl` của hồ sơ
      và đòi mỗi dòng có một dòng `kind: infra-recheck` đi kèm phán quyết `ha-tang`.
      Dòng đỏ chưa phân lớp → thoát 1 nêu tên dòng; phân lớp ra `vat` → thoát 1 nêu tên.
      Nhờ eval này, câu «lệnh đỏ phải phân lớp bằng máy trước khi tin» thôi là lời dặn
      trong `expected` và thành một phép đo — bản trước có script nằm sẵn trong hồ sơ mà
      KHÔNG eval nào, khoá nào, dòng hợp đồng nào gọi nó.
      Chiều đỏ đã chạy thật trên hai bản sao: một bản có dòng đỏ chưa phân lớp, một bản
      có dòng phân lớp `vat` — cả hai thoát 1 với thông điệp riêng.
      GIỚI HẠN của bộ phân lớp, chính nó tự khai: nó không phân biệt «hạ tầng» với «lệnh
      chập chờn» (lệnh 50/50 bị gọi nhầm ≈1/4 ở `--lan 2`), nên một phán quyết `ha-tang`
      chỉ đứng được khi có thêm dấu hiệu độc lập từ nhật ký workflow.
    paths:
      - "_acceptance/release-2-12-0/phan-lop-ha-tang.cjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: judgment
    question: >
      Bốn khối bắt buộc của `## Notes` có MẶT ĐỦ không, mỗi khối có NỘI DUNG THẬT hay chỉ
      có tiêu đề, và khối nào cố ý để TRỐNG có khai rõ lý do không? Bốn khối: (1) ba dòng
      số của luật (c) — thời gian làm-xong→quyết-được mỗi vòng, lượt chấm, lượt gọi người
      tách trong/ngoài thiết kế, số vòng bị hạ tầng đốt; (2) bảng lớp vendored đủ 9 mục
      của `INIT-CI-COPY-LIST` với +/− đo tại sha nêu tên; (3) lớp lỗi tái phát gọi tên kèm
      dẫn chứng; (4) nhát cắt cho cửa sổ kế gọi tên cụ thể. Trả FAIL cho khối chỉ có tiêu
      đề mà không có số, và cho số nào không nói được nó đọc từ đâu.
    inputs: [_acceptance/release-2-12-0/contract.md]
    expected: >
      Bốn khối có mặt, mỗi khối mang số đọc được từ nguồn có tên. Ba dòng số là VĂN ĐẾM
      TAY và hợp đồng khai thẳng điều đó ở Known limits — đúng tiền lệ ba mốc 2.9.0,
      2.10.0 và 2.11.0. Lượt chấm 2 của hồ sơ này đã GỠ một eval định chấm chúng bằng
      máy: nó ghim hình dạng diff của chính PR vào hồ sơ sắp ký nên không có HEAD nào nó
      xanh được lúc ký, và hai trong ba ô còn lại của nó fail-open. Ô «gọi người đếm tay»
      trống ở bốn trong năm vòng vì số thật chỉ đếm tay được từ phiên đã chạy vòng đó;
      hợp đồng khai lý do ấy và có thêm một cột «cận dưới» rút từ sổ quyết định.
    evidence_required: [run_id, verifier, verified_at]
