  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rel2310_lop_chep
    expected: >
      Exit 0 và dòng «XANH: đúng 3 tệp đổi như ghi chú 2.31.0 kể» — rút danh sách chép từ khối INIT-CI-COPY-LIST
      của acceptance-init (26 tệp), rút danh sách mong đợi từ gạch «- **Lớp chép CI:…» của mục «## 2.31.0»
      trong CHANGELOG.md, và tập tệp đổi byte từ `7cf78c36` tới HEAD BẰNG tập ghi chú kể. Chiều đỏ trong chính
      lệnh (đo ở release-2-29-0): tệp đổi mà ghi chú không kể, hay ghi chú kể tệp không đổi, đều in tên và
      thoát 1; mục không có gạch hay gạch không kể tệp nào thì thoát 2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-31-0/contract.md, lib/out-of-contract.cjs, road-map/README.md, road-map/commands/xem.md, commands/start.md, _acceptance/ra-soat-lo-trinh/contract.md, _acceptance/moc-la-chien-dich/contract.md]
    question: >
      Đọc AC-9 của contract release-2-31-0 và mục «## 2.31.0» của CHANGELOG.md (chỉ mục đó), cạnh mã và tài liệu
      đi kèm. (1) Mục «crm, theo thứ tự» có nói crm nhận SAU 2.30.0 (crm PR #413), nếu #413 chưa gộp thì làm trọn
      các bước của 2.30.0 trước, và cài theo ĐÚNG thẻ v2.31.0 không? (2) Lời «dòng Căn cứ: của review-findings.md»
      và «bộ đọc cũ đọc tệp khuôn mới không lệch trường nào» có khớp lib/out-of-contract.cjs không — bộ đọc nhận
      khoá «Căn cứ» vào trường can_cu, và với bộ đọc trước bản này một dòng khoá nó không biết bị bỏ qua thay vì
      làm lệch trường khác? (3) Lời về lệnh lo-trinh.mjs --ra-soat (ba loại đề xuất, chỉ mốc loai: phat-hanh, chính
      sách tuoi_ngay / tran_ke_tiep, không ghi tệp lộ trình), về gói road-map (lệnh cài --scope project, lệnh
      /road-map:xem chỉ đọc, acceptance-init không tự bật, không hook) và về số đo crm d0351bcd (DA6, DA7, DA8 →
      chờ điều kiện) có khớp road-map/README.md, road-map/commands/xem.md và hợp đồng ra-soat-lo-trinh không?
      (4) Lời về cờ MC1 — đúng một dòng «kho chưa khai lộ trình» trên thẻ khởi động của kho thiếu khoá
      lo_trinh.tep, cờ «chưa thuộc mốc» chỉ ở hàng cân nhắc/sắp mở/chờ duyệt/đang dựng, và số cờ crm 1997da85
      (OKR 12 → 26, Việc và Dự án 4 → 5, Kho tài liệu 2 → 2) — có khớp commands/start.md và hợp đồng
      moc-la-chien-dich không? Trả PASS khi cả bốn vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
