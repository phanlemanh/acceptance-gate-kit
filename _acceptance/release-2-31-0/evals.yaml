      `7cf78c36` tới HEAD đúng bằng manifest. Chiều đỏ (đo khi mở hồ sơ): cùng lệnh với mốc `6a9c0f9a` (v2.29.0,
      trước DP10) in thêm `dieu-phoi/README.md` và `dieu-phoi/scripts/phat-lich.mjs`, thoát 1.
