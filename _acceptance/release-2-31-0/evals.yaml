  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rel2310_cua_so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ, suy từ kho bằng QUAN HỆ (hồ
      sơ có contract.md đổi trong `7cf78c36..HEAD`, nay `status: signed-off`, mà ở mốc trước CHƯA ký; bỏ hồ sơ
      mốc `release-*`), BẰNG tập bốn slug kể trong Context. Chiều đỏ trong chính lệnh: slug thừa và slug
      thiếu đều in tên — đo khi mở hồ sơ: chạy với tập «x» thì «ĐỎ: … mốc KHÔNG kể: …», thoát 1.
