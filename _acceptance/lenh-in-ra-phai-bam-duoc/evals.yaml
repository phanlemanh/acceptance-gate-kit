schema_version: 1
feature_slug: lenh-in-ra-phai-bam-duoc
# Mọi eval ghim "PASS: [LB<n>]" trong stdout suite plugins. Ca ở tests/plugins/lenh-bam-duoc.test.mjs:
# bảng rút từ marker, vật thật đọc từ thư mục + plugin.json lúc chạy, chiều đỏ trên bản sao, ghim thông điệp.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/acceptance/references/human-facing-language.md, .claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LB1]" — bảng ⊆ vật thật: tiền tố == name plugin.json, vật tồn tại; harness chỉ
      trong ALLOW=[goal]; ba chiều đỏ: dòng foo → "không có vật"; plugin.json name đổi → "tiền tố lệch";
      dòng harness bar → "ngoài danh sách ngoại lệ".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [commands, skills/acceptance, skills/uat-session, feature-loop/skills/feature-loop/SKILL.md, scripts/gate-card.js, scripts/evidence-page.js, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LB2]" — ranh giới khai tường minh; 13 file có mặt; `/uat-session` trần cũng đỏ; (i) 0 trần + 0 uat-session
      thiếu tiền tố; (ii) mọi token /x:y ⊆ cột bấm-được — chèn /acceptance-gate:foo → đỏ file:dòng; (iii) số token
      có tiền tố ≥ 68; (iv) ĐỐI CHỨNG DƯƠNG: cùng hàm quét trên git show origin/main:<12 file> == 65 trần + 3
      `uat-session; (v) giữ-gân: 3 chuỗi mẫu → 0 hit; chèn `/start` → đỏ; chèn `uat-session <slug>` → đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/acceptance/references/human-facing-language.md, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: 'exit 0; stdout có "PASS: [LB3]" — đúng 1 câu luật nhắc COMMAND-NAMES; gỡ → đỏ.'
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/gate-card.js, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LB4]" — ba trạng thái Analyst: (a) "n-a — lý do ≥ 20" → 0 cờ đỏ baseline;
      (b) "n-a" trần / lý do ngắn → cờ đỏ ghim «n-a không nêu lý do»; (c) rỗng/vắng section → không cờ baseline; (c') n-a hỗn hợp «; E4, E5: …» → đỏ như cũ; round-trip writer
      thật: Analyst của A/B/C trên cây → 0 cờ đỏ baseline.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/gate-card.js, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [LB5]" — fixture CONTEXT.md có mặt, không --glossary-base → 0 cờ glossary-base
      (bản cũ: 1); cây thật A/B/C: gate-card CŨ (git show origin/main, đặt đúng scripts/gate-card.js trong bản
      sao cây) vs MỚI, so TẬP thông điệp: cũ∖mới ⊆ {baseline n-a, --glossary-base}; mới∖cũ = ∅; đối chứng dương:
      baseline ≥ 1 trong cũ của A/B/C; glossary-base: bản CŨ trên fixture Cổng 1 bắn, bản mới không. Cờ ngưỡng/biên GIỮ (P143).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins
    paths: [scripts/gate-card.js, tests/plugins/duong-do.test.mjs, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: 'exit 0; stdout có "PASS: [LB6]" và "PASS: [DD2]" "PASS: [DD4]" — «Bỏ đường đo —» không gạch = dòng bỏ.'
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.plugins
    paths: [CONTEXT.md, skills/uat-session/SKILL.md, tests/plugins/duong-do.test.mjs, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: 'exit 0; stdout có "PASS: [LB7]" và "PASS: [DD7]" — _Avoid_ không metric; uat-session không «tracking»; bản sao thêm lại metric → đỏ.'
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
