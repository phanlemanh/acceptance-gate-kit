    cmd: config:executors.test.plugins
    paths: [commands/start.md, _acceptance/duong-do-trong-dinh-nghia-xong/opportunity.md, tests/plugins/lenh-bam-duoc.test.mjs]
    expected: 'exit 0; stdout có "PASS: [LB8]" và "PASS: [VC6]" — vị trí khối + dòng ghi chú decided_at.'
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
