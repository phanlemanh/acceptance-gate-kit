<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ nghỉ chiếu vào bản đồ — hai khối có sẵn, không thêm khối</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body, div, p, h1 { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    .colophon { font-family: var(--font-mono); font-size: 0.66rem; color: var(--color-muted); border-top: 1px solid rgba(45,49,66,0.12); margin-top: 1.5rem; padding-top: 0.75rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hai nhánh · ho-so-nghi · Cổng Phạm vi</p>
    <h1>Hồ sơ nghỉ chiếu vào bản đồ — hai khối có sẵn, không thêm khối</h1>

    <svg viewBox="0 0 1000 440" role="img" aria-labelledby="cb-title cb-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="cb-title">Hồ sơ nghỉ chiếu vào bản đồ</title>
      <desc id="cb-desc">Hồ sơ nghỉ đi qua câu hỏi đã thông Cổng 2 chưa. Có: trạng thái da-nghi vào khối Đã giao. Không: trạng thái da-dong-ho-so vào khối Đã bác từ khám phá. Tập khối bản đồ không đổi.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== vùng bản đồ (khối cố định) ===== -->
      <rect x="744" y="40" width="224" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bản đồ sản phẩm</text>
      <text x="760" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">TẬP KHỐI HÔM NAY · KHÔNG THÊM</text>

      <!-- ===== mũi tên (vẽ trước hộp) ===== -->
      <!-- bắt đầu → câu hỏi -->
      <line x1="192" y1="192" x2="248" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- có: đỉnh phải → hàng trên -->
      <path d="M 440,192 H 472 Q 480,192 480,184 V 116 Q 480,108 488,108 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="488" y="140" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="492" y="152" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ</text>
      <!-- không: đỉnh dưới → hàng dưới -->
      <path d="M 344,240 V 268 Q 344,276 352,276 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="352" y="244" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="356" y="256" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHÔNG</text>
      <!-- trạng thái → khối -->
      <line x1="688" y1="108" x2="760" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="276" x2="760" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== bắt đầu: hồ sơ nghỉ ===== -->
      <rect x="32" y="168" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="32" y="168" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="112" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ nghỉ</text>
      <text x="112" y="204" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dòng sổ hợp lệ</text>

      <!-- ===== câu hỏi: đã thông Cổng 2? ===== -->
      <polygon points="248,192 344,144 440,192 344,240" fill="#f5f5f5"/>
      <polygon points="248,192 344,144 440,192 344,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đã thông</text>
      <text x="344" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng 2?</text>

      <!-- ===== trạng thái trên: da-nghi (mới, tiêu điểm) ===== -->
      <rect x="528" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="80" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="608" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">da-nghi</text>
      <text x="608" y="120" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đã nghỉ, giữ sử liệu</text>
      <text x="608" y="152" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-5 · trạng thái mới</text>

      <!-- ===== trạng thái dưới: da-dong-ho-so ===== -->
      <rect x="528" y="248" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="248" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="608" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">da-dong-ho-so</text>
      <text x="608" y="288" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chưa thông, đóng hồ sơ</text>
      <text x="608" y="320" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-5 · trạng thái có sẵn</text>

      <!-- ===== khối bản đồ ===== -->
      <rect x="760" y="80" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="80" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã giao</text>
      <text x="856" y="122" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khối có sẵn</text>
      <rect x="760" y="248" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="248" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã bác từ khám phá</text>
      <text x="856" y="290" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khối có sẵn</text>

      <!-- ===== ghi chú biên tập ===== -->
      <text x="32" y="356" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Tập khối bản đồ không đổi — bộ kiểm bản đồ ở kho tiêu thụ đếm khối cố định.</text>

      <!-- ===== legend ===== -->
      <line x1="32" y1="372" x2="968" y2="372" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · HÌNH DẠNG MANG LOẠI</text>
      <rect x="32" y="408" width="28" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="68" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bắt đầu</text>
      <polygon points="160,416 174,408 188,416 174,424" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="196" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Câu hỏi</text>
      <rect x="272" y="408" width="28" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="308" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Trạng thái mới của vòng</text>
      <rect x="464" y="408" width="28" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Trạng thái · khối có sẵn</text>
      <rect x="656" y="408" width="28" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="692" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bản đồ — tập khối cố định</text>
    </svg>

    <p class="colophon">Hình là chiếu của nguồn chữ, không phải nguồn. Nguồn: docs/superpowers/specs/2026-09-19-ho-so-nghi-design.md mục 4–5 · _acceptance/ho-so-nghi/contract.md AC-5 · đề bài ở figures/index.md.</p>
  </div>
</body>
</html>
