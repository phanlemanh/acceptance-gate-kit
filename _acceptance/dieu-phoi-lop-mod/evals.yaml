      hang-viec-hong" (hang-viec.json vắng → lời cũ, không «Lệnh xin lượt», và `xin` thật sự từ chối), "DP6-04
      duong-dau-cach" (đường chỉ có dấu cách → lệnh in ra vẫn chạy được). "ok" cho "DP7-06 trong-day" và "DP7-06
      ngoai-day" (hai ca của DP7 trên cùng lời chặn).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
