      có trên merge-base (rút bằng `git show <merge-base>:<tệp>` cho mọi tệp test dưới tests/dieu-phoi/, in số) ⊆
      tập tên có dòng "ok" của lượt này; "ok" cho "DP6-07 loi-nguyen": `git diff --quiet <merge-base> --
