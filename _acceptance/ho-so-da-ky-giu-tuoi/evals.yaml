      kho vắng in «<kho>: không có trên máy — bỏ» (ít nhất acceptance-gate-kit có mặt, nếu không ca FAIL). Trên kho thử
      AC-6 khoá vắng và false: mã thoát + dòng sổ (bỏ ts, sha, id lượt) bằng bản trước vòng. Chiều đỏ: bản sao bản mới
