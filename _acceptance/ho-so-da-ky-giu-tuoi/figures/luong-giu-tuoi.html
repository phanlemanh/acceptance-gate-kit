<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng giữ tươi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ho-so-da-ky-giu-tuoi</p>
    <h1>Hồ sơ đã ký giữ tươi — màu đỏ về đúng PR, vòng khác đi tiếp</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 400; fill: #636b80; }
          .mo { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 400; fill: #636b80; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; fill: #4f5d75; }
          .ea { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; fill: #ba4513; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; fill: #4f5d75; }
          .ch { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; fill: #4f5d75; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Lanes ===== -->
      <rect x="24" y="72" width="936" height="344" rx="6" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="40" y="100" class="ey">NHÁNH CHÍNH — LỆNH GIỮ TƯƠI</text>
      <rect x="236" y="88" width="40" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.55)" stroke-width="0.8"/>
      <text x="256" y="100" class="ch" text-anchor="middle">MỚI</text>

      <rect x="24" y="440" width="936" height="264" rx="6" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="40" y="468" class="ey">VÒNG KHÁC CHẠM HỒ SƠ</text>

      <!-- Gate column -->
      <line x1="972" y1="72" x2="972" y2="704" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="984" y="100" class="ey">CỔNG PHẠM VI</text>
      <text x="984" y="116" class="sb">hai câu hỏi cho chủ kho</text>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- N1 → N2 -->
      <line x1="208" y1="180" x2="236" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N2 → N3 -->
      <line x1="440" y1="180" x2="468" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N3 → N4 (xanh) -->
      <line x1="672" y1="180" x2="716" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N3 → N5 (đỏ) -->
      <line x1="572" y1="216" x2="572" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Dòng nền đỏ → điểm rẽ của vòng khác (đối chiếu) -->
      <path d="M512 400 V424 Q512 432 504 432 H436 Q428 432 428 440 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- B1 → B2 -->
      <line x1="240" y1="536" x2="284" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B2 → B3 (đủ) -->
      <line x1="568" y1="536" x2="612" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B2 → B4 (thiếu) -->
      <path d="M428 604 V644 Q428 652 436 652 H612" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ba phần mới → Hỏi-1 -->
      <line x1="928" y1="374" x2="984" y2="374" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Nhánh thiếu → Hỏi-2 -->
      <line x1="904" y1="652" x2="984" y2="652" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Connector labels -->
      <rect x="678" y="158" width="36" height="14" rx="2" fill="#f5f5f5"/>
      <text x="696" y="168" class="al" text-anchor="middle">XANH</text>
      <rect x="580" y="226" width="24" height="14" rx="2" fill="#f5f5f5"/>
      <text x="584" y="236" class="al">ĐỎ</text>
      <rect x="576" y="514" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="590" y="524" class="al" text-anchor="middle">ĐỦ</text>
      <rect x="436" y="608" width="44" height="18" rx="2" fill="#f5f5f5"/>
      <text x="440" y="622" class="al">THIẾU</text>
      <rect x="520" y="401" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="524" y="413" class="al">ĐỐI CHIẾU</text>

      <!-- ===== Nhánh chính ===== -->
      <!-- N1 -->
      <rect x="48" y="144" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="144" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="128" y="176" class="nm" text-anchor="middle">Các PR gộp</text>
      <text x="128" y="192" class="nm" text-anchor="middle">trong khoảng</text>

      <!-- N2 -->
      <rect x="240" y="144" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="144" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="170" class="nm" text-anchor="middle">Chọn hồ sơ cũ vì khoảng</text>
      <text x="340" y="188" class="sb" text-anchor="middle">hai lượt lưới trước-gộp</text>
      <text x="340" y="206" class="mo" text-anchor="middle">AC-1</text>

      <!-- N3 -->
      <rect x="472" y="144" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="144" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="572" y="170" class="nm" text-anchor="middle">Ghim lại từng hồ sơ</text>
      <text x="572" y="188" class="sb" text-anchor="middle">suite chạy một lần</text>
      <text x="572" y="206" class="mo" text-anchor="middle">AC-2 · AC-3</text>

      <!-- N4 -->
      <rect x="720" y="144" width="208" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="144" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="824" y="178" class="nm" text-anchor="middle">Hồ sơ tươi lại</text>
      <text x="824" y="198" class="mo" text-anchor="middle">AC-2</text>

      <!-- N5: đỏ → chạy lại ở đầu khoảng, rẽ ba nhỏ -->
      <rect x="472" y="256" width="456" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="256" width="456" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="280" class="nm">Chạy lại ở đầu khoảng</text>
      <text x="912" y="280" class="sb" text-anchor="end">rẽ ba</text>

      <rect x="488" y="292" width="136" height="56" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="556" y="314" class="nm" text-anchor="middle">Đỏ do PR #n</text>
      <text x="556" y="330" class="sb" text-anchor="middle">kèm cặp sha</text>
      <text x="556" y="342" class="mo" text-anchor="middle">AC-4</text>

      <rect x="632" y="292" width="136" height="56" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="700" y="314" class="nm" text-anchor="middle">Đỏ sẵn</text>
      <text x="700" y="330" class="sb" text-anchor="middle">trước khoảng</text>
      <text x="700" y="342" class="mo" text-anchor="middle">AC-4</text>

      <rect x="776" y="292" width="136" height="56" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="844" y="314" class="nm" text-anchor="middle">Hạ tầng</text>
      <text x="844" y="330" class="sb" text-anchor="middle">không gọi tên PR</text>
      <text x="844" y="342" class="mo" text-anchor="middle">AC-5</text>

      <rect x="488" y="356" width="424" height="32" rx="4" fill="rgba(45,49,66,0.06)" stroke="none"/>
      <text x="500" y="376" class="nm">Mọi nhánh đỏ ghi một dòng nền đỏ</text>
      <text x="820" y="376" class="mo" text-anchor="end">AC-3</text>
      <rect x="832" y="364" width="40" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.55)" stroke-width="0.8"/>
      <text x="852" y="376" class="ch" text-anchor="middle">MỚI</text>

      <!-- ===== Vòng khác ===== -->
      <!-- B1 -->
      <rect x="48" y="500" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="500" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="530" class="nm" text-anchor="middle">Vòng khác ghim lại</text>
      <text x="144" y="546" class="nm" text-anchor="middle">hồ sơ ấy</text>

      <!-- B2 decision -->
      <polygon points="428,468 568,536 428,604 288,536" fill="#f5f5f5"/>
      <polygon points="428,468 568,536 428,604 288,536" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="428" y="512" class="nm" text-anchor="middle">Eval đỏ:</text>
      <text x="428" y="528" class="nm" text-anchor="middle">cùng ca · cùng thông điệp</text>
      <text x="428" y="544" class="nm" text-anchor="middle">cùng định nghĩa</text>
      <text x="428" y="560" class="nm" text-anchor="middle">nền trên merge-base?</text>
      <text x="404" y="604" class="mo" text-anchor="end">AC-6</text>

      <!-- B3 nhãn -->
      <rect x="616" y="488" width="288" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="488" width="288" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="516" class="nm">Nhãn «đỏ sẵn trên nền»</text>
      <rect x="848" y="500" width="40" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.55)" stroke-width="0.8"/>
      <text x="868" y="512" class="ch" text-anchor="middle">MỚI</text>
      <text x="632" y="536" class="sb">không phải ĐẠT</text>
      <text x="632" y="552" class="sb">vòng đi tiếp</text>
      <text x="632" y="572" class="mo">AC-6 · AC-7</text>

      <!-- B4 thiếu -->
      <rect x="616" y="624" width="288" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="624" width="288" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="650" class="nm">Đỏ như hôm nay</text>
      <text x="632" y="668" class="mo">AC-6</text>

      <!-- ===== Gate questions (focal) ===== -->
      <rect x="984" y="320" width="192" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="320" width="192" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1000" y="344" class="ea">HỎI-1</text>
      <text x="1000" y="364" class="nm">Phê phần mới</text>
      <text x="1000" y="384" class="sb">lệnh giữ tươi</text>
      <text x="1000" y="400" class="sb">dòng nền đỏ</text>
      <text x="1000" y="416" class="sb">nhãn «đỏ sẵn trên nền»</text>

      <rect x="984" y="608" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="608" width="192" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1000" y="632" class="ea">HỎI-2 · KHUYÊN</text>
      <text x="1000" y="652" class="nm">Suite chung đỏ</text>
      <text x="1000" y="668" class="nm">→ vẫn chặn</text>

      <!-- ===== Legend ===== -->
      <line x1="24" y1="732" x2="1176" y2="732" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="756" class="ey">CHÚ GIẢI</text>

      <rect x="112" y="746" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="756" class="lg">Bước</text>

      <polygon points="196,752 208,746 220,752 208,758" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="756" class="lg">Rẽ nhánh</text>

      <rect x="300" y="744" width="40" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.55)" stroke-width="0.8"/>
      <text x="320" y="756" class="ch" text-anchor="middle">MỚI</text>
      <text x="348" y="756" class="lg">Phần thêm vào kit, chờ phê ở Hỏi-1</text>

      <line x1="536" y1="752" x2="564" y2="752" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="572" y="756" class="lg">Vòng khác đối chiếu với dòng nền đỏ</text>

      <rect x="764" y="746" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="796" y="756" class="lg">Câu hỏi ở Cổng Phạm vi</text>

      <text x="932" y="756" class="mo">AC-n</text>
      <text x="960" y="756" class="lg">tiêu chí trong hợp đồng</text>
    </svg>
  </div>
</body>
</html>
