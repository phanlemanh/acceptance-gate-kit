# Evals: start-scan-hardening — mọi AC đều máy-đo, không judgment
# cmd là config: ref (resolve tại S4); paths phục vụ carry-forward round delta

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Case P102 pass: fixture code-sinh; đối chứng dương (mọi file đọc được →
      phân ô thường) XANH trước; rồi (a) chmod 000 contract.md → slug vào
      broken[] reason chứa EACCES + đúng tên file, không rơi sang opportunity.md
      bên cạnh; (b) contract.md là THƯ MỤC → reason chứa EISDIR; (c) slug
      implemented + chmod 000 evidence-report.md → broken[] reason chứa EACCES
      + đúng tên evidence-report.md, KHÔNG rơi về nextStep S4; slug lành vẫn
      phân ô đúng. (gap-probe P1-1)
    paths: [scripts/start-scan.mjs, tests/plugins/run-tests.sh]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    expected: >
      Case P102 pass: (a) contract implemented + evidence verdict FAIL →
      broken[] reason "verdict không nhận diện được: FAIL" (cùng khuôn nhánh
      verified); (b) evidence CÓ frontmatter nhưng KHÔNG có dòng verdict →
      broken[] reason chứa "thiếu verdict" — không lặng lẽ sang bước kế
      (gap-probe P2-3); đối chứng dương: implemented + REJECT vẫn ra nextStep
      S3-fix như cũ.
    paths: [scripts/start-scan.mjs, tests/plugins/run-tests.sh]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.plugins
    expected: >
