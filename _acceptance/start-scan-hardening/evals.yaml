      token lạ "--foo" · "--root /khong/ton/tai" · "--root <file thường>"
      (đường dẫn có thật nhưng không phải thư mục, gap-probe P1-2) — đều exit
      2, stderr ghim đúng thông điệp từng lối (lối 5 nêu đường dẫn), stdout
      KHÔNG có JSON; đối chứng dương "--root <dir hợp lệ>" exit 0 JSON parse được.
    paths: [scripts/start-scan.mjs, tests/plugins/run-tests.sh]
  - id: E4
