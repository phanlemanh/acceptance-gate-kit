      /start → hàm trả lỗi ghim tên GUIDE, mutant README riêng → lỗi ghim tên
      README; mutant nào xanh = case đỏ.
    paths: [GUIDE.md, README.md, tests/plugins/run-tests.sh]
  - id: E5
