<svg font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" width="680" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
<!-- Phác tầng 1, vẽ nội tuyến trong phiên 2026-08-19 (a19f3e81…); chép về ô 2026-08-22 và làm tự-đủ (CSS nhúng). Chiếu của hạt giống 2026-08-19 mục 8. --><title>H2 — vật dựng theo hai trục: gần sản phẩm thật và đo được</title><desc>Trục ngang từ bản chép đến sản phẩm thật; trục dọc từ chỉ nhìn đến máy đo được. Canvas và proto HTML ở góc chép-nhìn; ruột tạm thật và bản sau cờ ở góc thật-đo.</desc>
<style>
