<svg xmlns="http://www.w3.org/2000/svg" width="680" height="336" viewBox="0 0 680 336" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ba nguồn hội tụ về bước phân kỳ</title>
<desc>North Star, huashu-design và /design cùng dẫn tới bước phân kỳ trước Cổng 1, sinh ba luật vay: động cơ kèm đánh đổi, độ nét vừa đủ quyết, bỏ bước phải để vết. Phác tầng 1, vẽ trong phiên «Phân tích skill Huashu Design» 2026-08-20/22; chiếu của hạt giống 2026-08-19 mục 3b.</desc>
<style>
  .th{font-size:14px;font-weight:500}.ts{font-size:12px}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="40" width="180" height="56" rx="4"/><text class="th" x="130" y="63" text-anchor="middle">North Star ③</text><text class="ts" x="130" y="81" text-anchor="middle">máy trước, người veto</text></g>
<g class="c-purple"><rect x="250" y="40" width="180" height="56" rx="4"/><text class="th" x="340" y="63" text-anchor="middle">huashu-design</text><text class="ts" x="340" y="81" text-anchor="middle">chưa thấy vật = vô hiệu</text></g>
<g class="c-purple"><rect x="460" y="40" width="180" height="56" rx="4"/><text class="th" x="550" y="63" text-anchor="middle">/design canvas</text><text class="ts" x="550" y="81" text-anchor="middle">2–4 hướng, trục có tên</text></g>
<line class="arr" x1="130" y1="96" x2="290" y2="140" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="96" x2="340" y2="140" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="96" x2="390" y2="140" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="210" y="140" width="260" height="56" rx="4"/><text class="th" x="340" y="163" text-anchor="middle">Bước phân kỳ trước Cổng 1</text><text class="ts" x="340" y="181" text-anchor="middle">canvas = phác tầng 1</text></g>
<line class="arr" x1="290" y1="196" x2="130" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="196" x2="340" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="196" x2="550" y2="240" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="40" y="240" width="180" height="56" rx="4"/><text class="th" x="130" y="263" text-anchor="middle">Động cơ + đánh đổi</text><text class="ts" x="130" y="281" text-anchor="middle">mỗi hướng, chống mồi</text></g>
<g class="c-coral"><rect x="250" y="240" width="180" height="56" rx="4"/><text class="th" x="340" y="263" text-anchor="middle">Độ nét vừa đủ quyết</text><text class="ts" x="340" y="281" text-anchor="middle">phác thấp hợp lệ</text></g>
<g class="c-coral"><rect x="460" y="240" width="180" height="56" rx="4"/><text class="th" x="550" y="263" text-anchor="middle">Bỏ bước phải để vết</text><text class="ts" x="550" y="281" text-anchor="middle">một dòng, veto-default</text></g>
</svg>
