<path d="M190 372 L206 372 L206 306 L222 306" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="226" y="284" width="130" height="44" rx="8" stroke-width="0.5"/><text class="th" x="291" y="298" text-anchor="middle" dominant-baseline="central">Chọn hướng</text><text class="ts" x="291" y="316" text-anchor="middle" dominant-baseline="central">lúc rảnh · 1 chạm</text></g>
