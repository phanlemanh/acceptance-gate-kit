<g class="c-gray"><rect x="20" y="494" width="640" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="510" text-anchor="middle" dominant-baseline="central">Làn Người: trước 1 ô dài đồng bộ + 1 cổng · sau 2 ô ngắn không đồng bộ</text><text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">làn Vật: thứ đi vào repo giống nhau (ô thật + ảnh) · thêm một artboard vứt đi</text></g>
