<svg font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" width="680" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<!-- Phác tầng 1, vẽ nội tuyến trong phiên 2026-08-19 (a19f3e81…); chép về ô 2026-08-22 và làm tự-đủ (CSS nhúng). Chiếu của hạt giống 2026-08-19 mục 8. --><title>H3 — ba đường cho Q1</title><desc>Gốc là câu hỏi dùng /design thế nào; ba nhánh giữ nguyên, ghép, thay hẳn; mỗi nhánh một ô đánh đổi.</desc>
<style>
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9;stroke-width:.5}.arr{stroke:#888780;stroke-width:1.5;fill:none}.leader{stroke:#B4B2A9;stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th,.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th,.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral .th,.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
