</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Q1 · /design đứng đâu trong S1-D?</text><text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">quyết một lần cho kit, thử trước trên b1</text></g>
<path d="M340 76 L340 100 L120 100 L120 124" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<path d="M340 76 L340 100 L560 100 L560 124" fill="none" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="20" y="128" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="146" text-anchor="middle" dominant-baseline="central">A · Giữ nguyên</text><text class="ts" x="120" y="164" text-anchor="middle" dominant-baseline="central">design-pass đồng bộ, không canvas</text></g>
<g class="c-teal"><rect x="240" y="128" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central">B · Ghép</text><text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">canvas quyết hướng · ruột tạm để đo</text></g>
<g class="c-coral"><rect x="460" y="128" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="146" text-anchor="middle" dominant-baseline="central">C · Thay hẳn</text><text class="ts" x="560" y="164" text-anchor="middle" dominant-baseline="central">canvas là toàn bộ khoảnh khắc</text></g>

<line x1="120" y1="184" x2="120" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="184" x2="340" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="184" x2="560" y2="212" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="20" y="216" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="120" y="236" text-anchor="middle" dominant-baseline="central">Được / Mất</text><text class="ts" x="120" y="258" text-anchor="middle" dominant-baseline="central">+ một cây nguồn, đo được</text><text class="ts" x="120" y="276" text-anchor="middle" dominant-baseline="central">− phiên 30–60' đồng bộ</text><text class="ts" x="120" y="294" text-anchor="middle" dominant-baseline="central">− không có nhà cho chọn hướng</text><text class="ts" x="120" y="312" text-anchor="middle" dominant-baseline="central">− b1 đang bỏ vì thế</text></g>
<g class="c-teal"><rect x="240" y="216" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="340" y="236" text-anchor="middle" dominant-baseline="central">Được / Mất</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">+ 2 lần gọi, đều không đồng bộ</text><text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">+ ruột tạm dùng lại S3/S4</text><text class="ts" x="340" y="294" text-anchor="middle" dominant-baseline="central">− một lượt máy dựng thêm</text><text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">− lệch nghi thức, phải ghi tên</text></g>
<g class="c-coral"><rect x="460" y="216" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="560" y="236" text-anchor="middle" dominant-baseline="central">Được / Mất</text><text class="ts" x="560" y="258" text-anchor="middle" dominant-baseline="central">+ rẻ nhất, người sửa tay</text><text class="ts" x="560" y="276" text-anchor="middle" dominant-baseline="central">− số giá chép lại (hai nguồn)</text><text class="ts" x="560" y="294" text-anchor="middle" dominant-baseline="central">− không có ma trận chụp cho S4</text><text class="ts" x="560" y="312" text-anchor="middle" dominant-baseline="central">− vết đã trả học phí 12/08</text></g>

<g class="c-gray"><rect x="20" y="360" width="640" height="40" rx="8" stroke-width="0.5"/><text class="t" x="340" y="380" text-anchor="middle" dominant-baseline="central">Máy khuyên B — A và C mỗi đường mất một thứ kit tồn tại vì nó</text></g>
