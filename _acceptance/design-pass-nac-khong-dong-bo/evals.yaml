schema_version: 1
feature_slug: design-pass-nac-khong-dong-bo
# Vòng này giao LỜI (nghi thức + vòng lặp + tài liệu) và MỘT MỐI NỐI máy-đọc
# (khoá `reaction:` / `options:` / `divergence:` trong sổ phiên → bộ dựng thẻ).
# Bộ ca sống ở suite `plugins`, file `tests/plugins/design-pass-nac.test.mjs`;
# fixture rút TỪ khuôn thật qua marker và do CODE SINH trong chính lượt chạy —
# cùng khuôn với P135–P137 của trục ngữ cảnh (tiền lệ đã chạy thật từ 2.0.0).
#
# MA TRẬN MUTANT LÀ TOÀN PHẦN, VIẾT TRƯỚC (luật ma-trận-phép-đo). Vật giao ở đây
# phần lớn là LỜI, nên rủi ro lớn nhất là một ca tuyên khẳng định N vế mà chỉ
# một vế có chiều đỏ — N−1 vế còn lại có thể biến mất mà ca vẫn in PASS. Vì thế
# mỗi ca khai SỐ MUTANT = SỐ VẾ ĐƯỢC KHẲNG ĐỊNH, mỗi mutant bẻ ĐÚNG MỘT vế trên
# bản sao và thông điệp đỏ GHIM TÊN VẾ đó. Bảng dưới là hợp đồng, không để bộ ca
# tự quyết:
#   E1=6 · E2=4 · E3=3 · E4=3 · E5=4 · E6=5 · E7=5 · E8=5 · E9=2 · E10=3 nhánh
#   · E11=3 · E12=4 · E13=3 chân · E15=2
#
# ĐÍNH CHÍNH vòng 1 (25/08): bảng cũ khai 5 con số KHÔNG khớp bộ ca thật, và HAI vế
# là assert chết — «có nhánh bỏ im lặng» (vế lõi AC-6) bị chuỗi else-if che, và nhánh
# giá trị-lạ của E10 đo BẢN IN DỰ PHÒNG của nhãn thay vì đo cờ. Hội đồng bắt được cả
# hai bằng cách xoá lưới thật rồi chạy lại: ca vẫn xanh. Bảng hứa mà bộ ca không giao
# chính là lớp lỗi nặng nhất ở đây — số dưới đây nay ĐẾM ĐƯỢC trên đầu ra từng ca.
#
# MỘT ca cố ý KHÔNG vào suite vĩnh viễn: `cau_chet` (E13) neo đối chứng dương
# vào mốc git CỐ ĐỊNH `BASE-DPNKDB` đọc từ contract. Neo vào origin/main thì sau
# khi ô này gộp, cả hai đầu đều 0 → phép đo tự chết mà vẫn xanh (lớp lỗi đã ghi:
# thước-ghim-vào-thứ-sẽ-đổi). Ca này chết theo hồ sơ khi gộp.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/design-pass/SKILL.md, tests/plugins/design-pass-nac.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [DP1]". Case trích khối giữa marker REACTION-LADDER
      từ CHÍNH skills/design-pass/SKILL.md, khẳng định đúng bốn id đóng
      nac-0/nac-1/nac-2/nac-3, mỗi id có tên tiếng người + điều kiện dùng, và
      danh sách nấc KHÔNG xuất hiện lần thứ hai ngoài marker.
      Đối chứng dương: bản nguyên vẹn XANH, chạy TRƯỚC mọi mutant.
      MA TRẬN 6 MUTANT (mỗi mutant đi qua CHÍNH bộ trích của chiều xanh, khác
      input): m1..m4 = bản sao ĐỔI TÊN lần lượt nac-0, nac-1, nac-2, nac-3 thành
      id khác → đỏ, thông điệp GHIM đúng id thiếu; m5 = bản sao thêm một danh
      sách nấc thứ hai NGOÀI marker → đỏ, ghim "danh sách nấc xuất hiện 2 chỗ";
      m6 = rỗng hoá ô ĐIỀU KIỆN của một nấc (id vẫn còn) → đỏ ghim "nac thiếu tên
      hoặc điều kiện" — vế này vòng 1 không có mutant nào.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins
    paths: [skills/design-pass/SKILL.md, tests/plugins/design-pass-nac.test.mjs]
    expected: >
      exit 0; stdout có "PASS: [DP2]". Case đo QUAN HỆ, không đo chuỗi có mặt, trên
      hai vế: (v1) frontmatter `description` nêu mặc định KHÔNG ĐỒNG BỘ và nêu
      sync là nấc phải có người gọi tên; (v2) thân skill mục vòng lặp phản ứng
      đặt nac-1 (hoặc thấp hơn) làm mặc định và nac-3 là opt-in.
      Đối chứng dương chạy trước. MA TRẬN 4 MUTANT — mỗi vế một mutant (vòng 1 chỉ
      có 2, nên hai vế có thể biến mất mà ca vẫn xanh): m1 = bản sao thay
      `description` bằng bản 2.3.0 (chuỗi "owner ngồi xem và phản ứng bằng lời
      từng vòng") → đỏ ghim "description còn khai mặc định đồng bộ"; m2 = bản sao
      đổi thân skill cho nac-3 thành mặc định → đỏ ghim "thân skill khai mặc
      định sai nấc"; m3 = xoá vế "phải có người gọi tên" khỏi description → đỏ ghim
      vế đó; m4 = đổi "KHÔNG ĐỒNG BỘ" trong câu chuẩn → đỏ ghim "câu chuẩn không nói
      KHÔNG ĐỒNG BỘ". Mọi mutant đi qua cùng bộ kiểm của chiều xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
