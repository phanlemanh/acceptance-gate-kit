      (v2) hành động (mời nac-3); (v3) GIỚI HẠN phạm vi phiên đúng điểm đó.
      Đối chứng dương chạy trước. MA TRẬN 3 MUTANT, mỗi mutant xoá đúng một vế
      trên bản sao → cùng bộ kiểm đỏ, ghim tên vế: "thiếu điều kiện đếm được" ·
      "thiếu hành động leo thang" · "thiếu vế giới hạn phạm vi".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
