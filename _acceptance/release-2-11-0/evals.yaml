  - id: E9
    criterion: AC-9
    executor: judgment
    question: >
      Hồ sơ mốc có ĐỦ BỐN khối bắt buộc, và mỗi khối có nội dung THẬT hay chỉ có tiêu đề?
      (1) ba dòng số của luật (c) — thời gian làm-xong→quyết-được, số lượt chấm, số lượt
      gọi người TÁCH trong-thiết-kế/ngoài-thiết-kế kèm số chạm, số vòng bị hạ-tầng-kit đốt;
      (2) bảng lớp vendored đủ 9 mục của `INIT-CI-COPY-LIST` với số dòng thêm/bớt; (3) lớp
      lỗi TÁI PHÁT gọi tên; (4) nhát cắt cho cửa sổ kế, gọi tên MỘT chỗ cắt hoặc tuyên
      đã-tối-ưu kèm số. Trả FAIL cho khối chỉ có tiêu đề mà không có số, và cho số nào
      không nói được nó đọc từ đâu.
    inputs: [_acceptance/release-2-11-0/contract.md]
    expected: >
      Bốn khối có mặt và mỗi khối mang số đọc được từ nguồn có tên (revision của contract,
      `run-log.jsonl`, `git diff --numstat`). Khối nào là VĂN không có phép đo máy thì phải
      tự khai điều đó ở Known limits.
    evidence_required: [run_id, verifier, verified_at]
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [feature-loop/scripts/carry-plan.mjs, lib/evidence-core.cjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG9 carry-plan va s4-args dong y ve paths».
      Ca đo HỆ QUẢ chứ không so chuỗi: `paths` ở `carry-plan` biến thành glob quyết eval nào
      được CARRY-FORWARD, nên bộ đọc mangle đường dẫn sẽ cho glob không khớp file nào và
      eval mang màu xanh cũ sang lượt mới dù file thật ĐÃ đổi — chiều FAIL-OPEN. Hai chiều
      trên CÙNG fixture: (a) bản sửa chạm đúng đường đó → E1 phải nằm trong `rerun`, KHÔNG
      được có trong `carriedEvals`; (b) đối chứng dương — bản sửa chạm đường KHÁC → E1 phải
      được carry. Đường dẫn dùng làm fixture lấy hình dạng từ bán kính artifact-platform
      (vỏ kép có escape). `carry-plan` nay đòi `--ag-root`, thiếu là fail-CLOSED có tên.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.moc_diagram_khong_doi
    paths: [_acceptance/release-2-11-0/rang-moc.sh, diagram-design]
    expected: >
      Exit 0, và stdout khai đúng QUAN HỆ chứ không phải một con số ghim cứng:
      «PASS: diagram-design KHONG doi ke tu lan cat so gan nhat (<sha>), giu <số đọc từ
      manifest tại HEAD> (doi chung duong: cua so moc..HEAD KHONG rong)». **KHÔNG ghim
      literal `2.7.0` vào đây** — lượt chấm 2 bắt đúng lỗi đó: AC-11 hứa răng còn xanh khi
      chiến dịch ghim lại chạy nó ở HEAD muộn hơn SAU khi diagram-design đã cắt số mới, mà
      một lời khai ghim `2.7.0` sẽ đỏ đúng lúc vật còn sống. Số và sha đều là biến.
      Mốc so SUY TỪ KHO: commit đầu tiên (từ mới về cũ) chạm manifest mà **số tại nó KHÁC
      số tại cha** — lần CẮT SỐ, không phải lần CHẠM. Bốn chân, bốn mã thoát riêng:
      **6** không đọc được số tại HEAD (vật không còn) · **3** không tìm được lần cắt số
      nào · **4** cửa sổ mốc..HEAD RỖNG, tức mốc trùng HEAD (ĐỐI CHỨNG DƯƠNG). Hai bản trước
      của chân này đều kiểm một điều ĐÚNG THEO CẤU TẠO nên không bao giờ nổ được — lượt
      chấm 2 và 3 lần lượt gọi tên. Nay nó kiểm điều thật sự sai được: mốc trùng HEAD thì
      `diff` rỗng với MỌI đường dẫn, nên kết luận «không đổi» là hằng đúng chứ không phải
      một phép đo; và nó sẽ đỏ thật ngay sau mỗi lần diagram-design lên số · **5** `diagram-design/` CÓ đổi
      sau lần cắt số. Ba chiều đỏ đã chạy trên bản sao trọn cây 10/09: xoá `diagram-design/`
      → exit 6; chạm `diagram-design/NOTICE` sau mốc → exit 5; kho squash một commit (mốc
      trùng HEAD) → exit 4; bản nguyên vẹn → exit 0.
      Chiều đỏ thứ tư ở đường giải chuỗi: bộ giải chưa vá đưa `--chan` thành `"diagram"` →
      exit 2 có tên, nên eval này không thể xanh trên bản chưa vá.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
