# evals — release-2-11-0
# Hai nhóm. (1) Bộ giải: MỘT tệp ca `tests/scripts/bo-giai-nhay.test.mjs` chạy trọn ma trận
# trục A × trục B cộng chiều đỏ trọn-cây; năm eval dưới ghim NĂM DÒNG KHÁC NHAU của chính
# tệp đó (`PASS: BG1..BG5`), không ghim mã thoát chung — «tệp xanh» và «ca này xanh» phải
# phân biệt được. Workflow chạy lệnh trùng MỘT lần. (2) Cắt số: ca vĩnh viễn P200, không
# dựng dàn đo dùng-một-lần (nếp từ 2.2.0).
# E7 CỐ Ý là bằng chứng SỐNG của chính bản vá: giá trị khoá `moc_diagram_khong_doi` là một
# scalar vỏ nháy kép có `\"` bên trong — bộ giải CŨ trả chuỗi còn dấu chéo ngược nên lệnh
# thoát 1 không in gì; bộ giải MỚI trả đúng chuỗi nên lệnh in dòng PASS. Eval này không thể
# xanh trên bản chưa vá.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Exit 0 và đầu ra có dòng «PASS: BG1 boc nhay chi khi CAN va dung mot cap vo». Ma trận
      trục B đủ tám hình dạng trên cùng một khuôn fixture code-sinh, mỗi hình dạng in một
      dòng «BG1-M: <tên>»: không nháy · vỏ đơn cân · vỏ kép cân · vỏ kép có escape · KẾT
      THÚC bằng nháy (không phải vỏ) · BẮT ĐẦU bằng nháy (không phải vỏ) · nháy hai đầu
      nhưng KHÔNG phải một cặp · suy biến (rỗng, `""`, một ký tự `"`). Số dòng BG1-M phải
      BẰNG hằng khai trước trong tệp ca — lệch là đỏ, để một hình dạng bị xoá không tàng
      hình. Chiều đỏ của ca này sống ở BG5.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG2 escape trong vo nhay kep duoc go». Ca
      dựng scalar `"cd sdk && uv run --with \"x==1\" pytest"` rồi khẳng định chuỗi trả về
      chứa ĐÚNG `--with "x==1"` và KHÔNG còn ký tự chéo ngược nào trước nháy; thêm một ca
      `\\` → `\`. Khẳng định là QUAN HỆ trên chuỗi ra, không phải phép có-mặt của một chuỗi
      con dễ trúng nhầm.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, lib/eval-yaml.cjs, feature-loop/scripts/s4-args.mjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG3 chuoi xanh-gia bon buoc da dong». Ca đi
      ROUND-TRIP qua BÊN VIẾT THẬT, không mô phỏng: dựng một workspace code-sinh
      (`config.yaml` + `contract.md` + `evals.yaml`) trong thư mục tạm, `evals.yaml` khai
      `expected_exit: 2` cho một eval `script` mà `cmd: config:<khoá>` trỏ một khoá mang
      `<công-cụ-giả> -k 'a or b'`; công cụ giả là một tệp sinh trong CHÍNH lần chạy, trả mã
      thoát khai trước qua biến môi trường (không cần pytest). Rồi: (1) chạy CHÍNH
      `feature-loop/scripts/s4-args.mjs` của cây đang kiểm và RÚT chuỗi lệnh từ tệp args nó
      SINH RA — không tự gọi `resolveConfigKey`, không tự dựng args · (2) `bash -c` đúng
      chuỗi rút được · (3) so mã thoát với `expectedExits` (lib/eval-yaml.cjs) đọc từ chính
      `evals.yaml` đó. Ma trận hai chiều trên cùng workspace: công cụ giả trả **2** →
      «đạt-có-giới-hạn» (mã của CÔNG CỤ, không phải mã 2 của shell — ca khẳng định công cụ
      giả THẬT SỰ chạy bằng một dấu vết nó ghi ra đĩa); công cụ giả trả **3** với cùng lệnh
      → phép so phải ĐỎ, ghim thông điệp. Giới hạn: phép so verdict cuối sống trong
      `acceptance-verify.js` — xem Known limits, E8d là lưới cho tệp đó.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, feature-loop/scripts/s4-args.mjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG4 bay duong thi-hanh tra dung chuoi nguoi
      viet». Đây là ca HÀNH VI, không phải ca đọc mã nguồn: ma trận **toàn phần** bảy đường
      của bảng AC-4 × các hình dạng trục B có nghĩa cho từng đường, số assert BẰNG một hằng
      khai trước trong tệp ca (lệch là đỏ). Fixture code-sinh trong chính lần chạy, rồi gọi
      **CHÍNH** `resolveConfigList` (cả nhánh inline `[a, "b\"c"]` lẫn nhánh khối
      `- "cd x && echo \"y\""`) và **CHÍNH** `s4-args.mjs` (đọc `paths`/`inputs`/`steps`
      kết thúc bằng nháy, id, `models`) của cây đang kiểm. Khẳng định là QUAN HỆ trên chuỗi
      ra — đúng argv, không còn dấu chéo ngược, không mất ký tự cuối — không phải phép
      có-mặt của một chuỗi con. Ba hình dạng lấy NGUYÊN VĂN từ bán kính đã đo:
      `<html lang=\"vi\">` (crm, `steps`), `evidence-report.md §"E7 — render thật"`
      (artifact-platform, `inputs`), và khoá `uicheck_avatar_pool` (artifact-platform,
      `config.yaml`).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4b
    criterion: AC-4
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, feature-loop/scripts/s4-args.mjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG6 ranh gioi vá dung bang danh sach dong».
      Ca đọc mã nguồn hai tệp và khẳng định TRÊN TỪNG HÀM, không trên cả tệp: bảy đường của
      bảng AC-4 KHÔNG còn khớp `replace(/^["']|["']$/g` trong thân hàm của chúng, và bốn
      hàm cố-ý-giữ (`extractRunIds` · `walkEvalExits` · `extractVerifierValues` ·
      `frontmatterField`) VẪN còn. Chân thứ ba chống cả hai chiều trôi: **tổng số khớp
      trong hai tệp BẰNG số phần tử tập cố-ý-giữ** — vá sót thì tổng lớn hơn, vá lan thì
      tổng nhỏ hơn, cả hai đỏ ghim tên hàm. Ca này là ĐỐI CHỨNG cho quyết định descope đã
      ghi sổ, không thay ca hành vi E4.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.bo_giai_nhay
    paths: [lib/evidence-core.cjs, tests/scripts/bo-giai-nhay.test.mjs]
    expected: >
      Cùng lệnh với E1. Đầu ra có dòng «PASS: BG5 chieu do tren ban sao TRON CAY». Ca dựng
      bản sao bằng `git archive HEAD` (TRỌN cây, không chép danh sách tệp tay — bài học
      P150), rồi: (1) bản NGUYÊN VẸN chạy lại ma trận BG1–BG4 (kể cả ca hành vi bảy đường) → 0 vế đỏ (đối chứng dương,
      không có nó thì mọi màu đỏ dưới đây vô nghĩa) · (2) tiêm lại mệnh đề cũ
      `replace(/^["']|["']$/g, '')` vào `lib/evidence-core.cjs` của bản sao, so BĂM
      trước/sau — **băm không đổi thì ca ĐỎ ngay** với thông điệp «DOT BIEN KHONG AP DUOC»
      · (3) bản bị tiêm phải ĐỎ ở BG1, BG3 **và BG4** — chiều đỏ phủ cả ca hành vi bảy đường, ghim đúng tên đường và tên hình dạng bị hỏng, không chỉ
      «exit khác 0». Đường dẫn suy từ vị trí tệp ca, KHÔNG hardcode gốc kho.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.p200_cat_so
    paths: [.claude-plugin/plugin.json, feature-loop/.claude-plugin/plugin.json, GUIDE.md]
    expected: >
      Exit 0 và đầu ra có dòng «PASS: P200 mot lan cat so nhat quan: hai plugin cung so ·
      GUIDE dan xuat · muc mo ta cua chinh so do (5 dot bien, mot loi thoat)». Ba vế «hop
      semver» đọc TỪ manifest (2.11.0 · 2.11.0 · 2.7.0), vế «hai plugin cung so: 2.11.0»,
      vế «GUIDE khop so DOC TU manifest», vế «mo ta acceptance-gate co muc v2.11.0» và vế
      «muc v2.11.0 cua feature-loop TU khai cap». Chiều đỏ sống trong chính P200 (5 đột
      biến chạy thật + đối chứng dương bản sao nguyên vẹn 0 vế đỏ).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.moc_diagram_khong_doi
    paths: [diagram-design, _acceptance/release-2-11-0/rang-moc.sh]
    expected: >
      Exit 0 và stdout có dòng «PASS: diagram-design KHONG doi trong cua so, giu 2.7.0
      (doi chung duong: lib/ CO doi)». Ba chân tách bằng ba mã thoát riêng nên không chân
      nào fail-open thành màu xanh: **exit 3** sha nền không giải được
      (`git rev-parse --verify`) · **exit 4** đối chứng dương rỗng — `git diff --name-only
      04069351..HEAD -- lib/` phải KHÁC rỗng, rỗng nghĩa là phép đo không chạy (clone nông,
      sai thư mục, git chết) · **exit 5** `diagram-design/` CÓ đổi mà không cắt số. Chiều
      đỏ thứ tư nằm ở chính đường giải chuỗi: giá trị khoá là scalar vỏ nháy kép có `\"`
      bên trong, nên **bộ giải chưa vá đưa `--neo` thành `\"04069351\"` và răng thoát 3
      có tên** — eval này không thể xanh trên bản chưa vá. Đã chạy tay cả hai bản 10/09
      trước khi mở hồ sơ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8a
    criterion: AC-8
    executor: test
    cmd: config:executors.test.scripts
    expected: "suite scripts XANH (tệp ca mới của bộ giải chạy trong suite này qua vòng lặp *.test.mjs)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.hooks
    expected: "suite hooks XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8c
    criterion: AC-8
    executor: test
    cmd: config:executors.test.plugins
    expected: "suite plugins XANH (trọn suite — E6 đã khoanh riêng ca P200)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8d
    criterion: AC-8
    executor: test
    cmd: config:executors.test.workflows
    expected: "suite workflows XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8e
    criterion: AC-8
    executor: script
    cmd: config:executors.script.product_map
    expected: "exit 0 — PRODUCT-MAP.md khớp hồ sơ xưởng (bản đồ vẽ lại cùng commit mở hồ sơ)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    question: >
      Hồ sơ mốc có ĐỦ BỐN khối bắt buộc, và mỗi khối có nội dung THẬT hay chỉ có tiêu đề?
      (1) ba dòng số của luật (c) — thời gian làm-xong→quyết-được, số lượt chấm, số lượt
      gọi người TÁCH trong-thiết-kế/ngoài-thiết-kế kèm số chạm, số vòng bị hạ-tầng-kit đốt;
      (2) bảng lớp vendored đủ 9 mục của `INIT-CI-COPY-LIST` với số dòng thêm/bớt; (3) lớp
      lỗi TÁI PHÁT gọi tên; (4) nhát cắt cho cửa sổ kế, gọi tên MỘT chỗ cắt hoặc tuyên
      đã-tối-ưu kèm số. Trả FAIL cho khối chỉ có tiêu đề mà không có số, và cho số nào
      không nói được nó đọc từ đâu.
    inputs: [_acceptance/release-2-11-0/contract.md]
    expected: >
      Bốn khối có mặt và mỗi khối mang số đọc được từ nguồn có tên (revision của contract,
      `run-log.jsonl`, `git diff --numstat`). Khối nào là VĂN không có phép đo máy thì phải
      tự khai điều đó ở Known limits.
    evidence_required: [run_id, verifier, verified_at]
