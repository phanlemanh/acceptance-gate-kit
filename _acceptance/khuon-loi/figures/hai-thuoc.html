<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai thước</title>
  <!-- Hình tầng 2 — chiếu của figures/index.md (đề bài hai-thuoc). Nhãn nguyên văn từ đề bài.
       Mốc là thứ tự, không phải thang thời gian: đề bài chỉ cho một độ dài (21 ngày), nên khoảng cách giữa các mốc
       không mang nghĩa độ dài. AC chở: AC-3, AC-4, AC-5, AC-7 (Đường đo). -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .footer {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình 2 · khuon-loi · Cổng Phạm vi · đường thời gian</p>
    <h1>Hỏi-2 · thay vế (b) của KH-C1 bằng hai thước</h1>

    <svg viewBox="0 0 1240 392" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Dải xám phía trên — vế cũ ===== -->
      <rect x="40" y="32" width="1160" height="40" rx="4" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="56" y="56" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif"><tspan font-family="'Geist Mono', monospace" font-size="10" font-weight="500" letter-spacing="0.06em">vế cũ:</tspan> răng bắt ≥1 lệch thật qua ≥3 vòng — số bắt tiến về 0 khi răng tốt (0 lệch / 2 vòng có số đo)</text>

      <!-- ===== Trục và nhánh kết (vẽ trước nút) ===== -->
      <line x1="80" y1="232" x2="880" y2="232" stroke="#4f5d75" stroke-width="1"/>

      <!-- nhánh kết trên → SỐNG -->
      <path d="M 880 228 L 880 168 Q 880 160 888 160 L 920 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- nhánh kết dưới → vòng 2 nằm yên -->
      <path d="M 880 236 L 880 296 Q 880 304 888 304 L 920 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- đường thả nhãn -->
      <line x1="140" y1="188" x2="140" y2="226" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="360" y1="240" x2="360" y2="268" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <line x1="600" y1="188" x2="600" y2="226" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

      <!-- ===== Mốc 1 — trong vòng ===== -->
      <circle cx="140" cy="232" r="4" fill="#2d3142"/>
      <text x="140" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong vòng:</text>
      <text x="140" y="164" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">ma trận đỏ + im, 2 mutant</text>
      <text x="140" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(bộ kiểm kit)</text>

      <!-- ===== Mốc 2 — cắt 2.37.0 (điểm nhấn 1) ===== -->
      <circle cx="360" cy="232" r="6" fill="#eb6c36"/>
      <text x="360" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cắt 2.37.0</text>

      <!-- ===== Mốc 3 — kho nhận cài + một vòng giao diện thật ===== -->
      <circle cx="600" cy="232" r="4" fill="#2d3142"/>
      <text x="600" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">onehub-quy-hang cài + bước chấm</text>
      <text x="600" y="180" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">chạy ≥1 vòng giao diện thật</text>

      <!-- ===== Mốc 4 — cửa sổ 21 ngày (điểm nhấn 2) ===== -->
      <line x1="600" y1="220" x2="600" y2="244" stroke="#eb6c36" stroke-width="1.2"/>
      <line x1="880" y1="220" x2="880" y2="244" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="604" y="228" width="272" height="8" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="740" y="268" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">21 ngày:</text>
      <text x="740" y="284" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">đếm vòng đồng nhất lại mới · lệch lọt</text>

      <!-- ===== Hai nhánh kết ===== -->
      <!-- SỐNG -->
      <rect x="920" y="120" width="280" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="120" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1060" y="152" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">0 vòng đồng nhất lại · &lt;2 lệch lọt</text>
      <text x="1060" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ SỐNG</text>

      <!-- vòng 2 nằm yên -->
      <rect x="920" y="248" width="280" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="248" width="280" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1060" y="280" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">không kho nào chạy /</text>
      <text x="1060" y="296" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">còn sửa tay danh sách /</text>
      <text x="1060" y="312" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">hạ tầng đốt lượt</text>
      <text x="1060" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ vòng 2 nằm yên</text>
    </svg>

    <div class="footer">
      <span>Hình tầng 2 · chiếu của figures/index.md (đề bài hai-thuoc) · AC-3 · AC-4 · AC-5 · AC-7 (Đường đo)</span>
      <span>hồ sơ khuon-loi · vẽ 01/11/2026</span>
    </div>
  </div>
</body>
</html>
