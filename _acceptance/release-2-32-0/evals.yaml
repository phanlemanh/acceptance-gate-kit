    executor: script
    cmd: config:executors.script.product_map
    expected: "exit 0 — PRODUCT-MAP.md và LO-TRINH.html khớp hồ sơ xưởng (vẽ lại cùng commit đổi trạng thái hồ sơ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rel2320_cua_so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ, suy từ kho bằng QUAN HỆ (hồ
      sơ có contract.md đổi trong `f0634454..HEAD`, nay `status: signed-off`, mà ở mốc trước CHƯA ký; bỏ hồ sơ
      mốc `release-*`), BẰNG tập tám slug kể trong Context. Chiều đỏ trong chính lệnh: slug thừa và slug
      thiếu đều in tên — đo khi mở hồ sơ: chạy trước khi #370 gộp thì «ĐỎ: mốc kể hồ sơ KHÔNG được ký trong
      cửa sổ: cham-lai-khong-tu-doi», thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rel2320_dd_giu
    expected: >
      Exit 0 và dòng «moc:   "version": "2.7.1", | HEAD:   "version": "2.7.1",» — `diagram-design/` KHÔNG
      có dòng đổi từ `f0634454` tới HEAD VÀ số bằng số ở mốc. Chiều đỏ: cùng lệnh với mốc `1b98fdb1`
      (v2.20.0, trước commit nâng 2.7.1) thoát 1 — đo ở release-2-29-0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vế mô tả của P200 xanh: mô tả acceptance-gate có mục v2.32.0 và mục v2.32.0 của
      feature-loop tự khai cặp acceptance-gate >= 2.32.0; hai đột biến của P200 (mô tả thiếu mục · câu khai
      cặp nằm ngoài mục) phải đỏ trong chính ca.
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.rel2320_goi_doi
    expected: >
      Exit 0 và dòng «hai goi doi: …» kể đúng mười ba tệp — tập tệp đổi dưới `dieu-phoi/` và `road-map/` từ
      `f0634454` tới HEAD bằng hai manifest + năm tệp `dieu-phoi/scripts/` (cua-tin-hieu.mjs, dieu-phoi.mjs,
      mau/LUAT.md, phat-lich.mjs, yeu-cau.mjs) + `road-map/README.md` + năm lệnh `road-map/commands/` (bo-ghim,
      ghim, gui, tra-lai, xem), như CHANGELOG 2.32.0 kể. Chiều đỏ (đo khi mở hồ sơ): cùng lệnh trước commit nâng
      số in thiếu hai manifest, thoát 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rel2320_lop_chep
    expected: >
      Exit 0 và dòng «XANH: đúng 6 tệp đổi như ghi chú 2.32.0 kể» — rút danh sách chép từ khối INIT-CI-COPY-LIST
      của acceptance-init (28 tệp, thêm `scripts/gio-may.mjs` và `lib/chan-lo-trinh.cjs`), rút danh sách mong đợi
      từ gạch «- **Lớp chép CI:…» của mục «## 2.32.0» trong CHANGELOG.md, và tập tệp đổi byte từ `f0634454` tới
      HEAD BẰNG tập ghi chú kể. Chiều đỏ trong chính lệnh (đo ở release-2-29-0): tệp đổi mà ghi chú không kể, hay
      ghi chú kể tệp không đổi, đều in tên và thoát 1; mục không có gạch hay gạch không kể tệp nào thì thoát 2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-2-32-0/contract.md, commands/acceptance-init.md, scripts/lo-trinh.mjs, scripts/pre-merge-check.sh, lib/chan-lo-trinh.cjs, road-map/README.md, road-map/commands/gui.md, road-map/commands/ghim.md, road-map/commands/bo-ghim.md, road-map/commands/tra-lai.md, road-map/commands/xem.md, _acceptance/kho-cam-ket-co-lo-trinh/contract.md]
    question: >
      Đọc AC-9 của contract release-2-32-0 và mục «## 2.32.0» của CHANGELOG.md (chỉ mục đó), cạnh mã và tài liệu
      đi kèm. (1) Mục «crm, theo thứ tự» có nói crm nhận SAU 2.31.0 và cài theo ĐÚNG thẻ v2.32.0 không? (2) Lời về
      lớp chép CI có khớp nhãn trong khối INIT-CI-COPY-LIST của commands/acceptance-init.md và mã nạp không — cụ thể:
      scripts/lo-trinh.mjs nạp scripts/gio-may.mjs ngay lúc nạp (nên kho khai lo_trinh phải chép hai tệp CÙNG LÚC),
      scripts/pre-merge-check.sh gọi lib/chan-lo-trinh.cjs và kho thiếu tệp ấy mà bật luật chỉ thấy một dòng NOTE,
      không vỡ? (3) Lời về bốn lệnh mới của gói road-map (tên lệnh, làm gì, có ghi tệp lộ trình hay không) có khớp
      road-map/README.md và năm tệp road-map/commands/*.md không? (4) Lời về khoá lo_trinh.chan (mặc định tắt, kho
      không khai thì lưới trước-gộp không đổi gì) có khớp lib/chan-lo-trinh.cjs và hợp đồng kho-cam-ket-co-lo-trinh
      không? Trả PASS khi cả bốn vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.kiem_ban_cai_moc
    expected: >
      Exit 0 — cổng số phiên bản của kiem-ban-cai-sau-phat-hanh: số trong .claude-plugin/plugin.json ở HEAD khác
      gốc vòng nên lệnh chạy TRỌN kiểm bản cài trên HEAD (cài cách ly từ `git archive HEAD`), in dòng «TỔNG KẾT:
      ĐẠT 8/8 — HEAD (<sha>) cài đúng tag» và «… v2.31.0 (f0634454) cài đúng tag». Chiều đỏ sống trong ca của KC1
      (KB-1…KB-11). Đỏ → KHÔNG cắt mốc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
